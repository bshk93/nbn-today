      });
    }

    // ══ Team-facing offers (spec § 8.1 — Phase 7) ═════════════════════════════
    //
    // The ⋯ menu and the offer form. One gate on the object (§ 6.0): any holder
    // of the team's role may draft *and* submit — drafting and sending are both
    // team business, and a front office shouldn't be blocked on the owner being
    // around. It is enforced by the API — everything here only decides which
    // affordances to draw, and draws the ones it can't offer *disabled with the
    // rule-citing reason* rather than hiding them, the same convention as the
    // roster ⋯ menu.
    //
    // **No cap math in this page.** Every dollar in the legality panel comes off
    // the fact sheet `POST /api/validate/sign` returns, and the committed-vs-room
    // figure off `GET /api/fa/commitment/{team}` — the same helper the committee's
    // review page renders, so a team can never be shown room the validator didn't
    // credit it with.

    const TEAM_ABBRS = new Set(Object.keys(TEAM_NAMES));

    let ME = { name: null, roles: [] };
    let MY_TEAMS = [];                       // team roles this member holds
    let BOARD = { mode: 'closed', players: {} };
    let MY_OFFERS = {};                      // "TEAM|slug" -> live offer
    let MY_VOIDED = {};                      // "TEAM|slug" -> offer the committee voided (§ 4.3b)
    let POOL = {};
    let LEAGUE_YEAR = null;
    let BIOS = {};         // slug -> bio, for draft_year (minimum-salary tier lookups)
    let CAP_LEVELS = {};   // season -> { min_salary_scale, ... }, from GET /api/cap-levels

    // The `.nbn.today` session cookie covers /api/fa/* (§ 3.3), so a member who
    // has signed in anywhere on the site needs no token here. The header still
    // wins where one happens to be stored.
    async function api(path, opts) {
      const o = Object.assign({ credentials: 'same-origin' }, opts || {});
      o.headers = Object.assign({}, o.headers || {});
      let t = null;
      try { t = localStorage.getItem('nbn_token'); } catch {}
      if (t) o.headers.Authorization = 'Bearer ' + t;
      if (o.body && typeof o.body !== 'string') {
        o.headers['Content-Type'] = 'application/json';
        o.body = JSON.stringify(o.body);
      }
      const res = await fetch('/api' + path, o);
      let data = null;
      try { data = await res.json(); } catch {}
      if (!res.ok) {
        const d = data && data.detail;
        const err = new Error((d && (d.detail || (typeof d === 'string' ? d : null))) || res.statusText);
        err.status = res.status;
        err.data = data;
        throw err;
      }
      return data;
    }

    // `nbn_session_live` is the readable companion to the HttpOnly session cookie
    // — it exists precisely so page JS can tell whether it has a session. Used
    // here to avoid firing an offers request that would 401 on a public load.
    function maybeSignedIn() {
      try { if (localStorage.getItem('nbn_token')) return true; } catch {}
      return /(?:^|;\s*)nbn_session_live=/.test(document.cookie);
    }

    function toast(msg, bad) {
      const t = document.createElement('div');
      t.className = 'toast' + (bad ? ' bad' : '');
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 4500);
    }

    function curYr() {
      if (LEAGUE_YEAR) return LEAGUE_YEAR;
      const now = new Date(), y = now.getFullYear() % 100, m = now.getMonth() + 1;
      return m < 7
        ? `${String(y - 1).padStart(2, '0')}-${String(y).padStart(2, '0')}`
        : `${String(y).padStart(2, '0')}-${String((y + 1) % 100).padStart(2, '0')}`;
    }

    function seasonAfter(s) {
      const [a, b] = s.split('-').map(Number);
      return `${String((a + 1) % 100).padStart(2, '0')}-${String((b + 1) % 100).padStart(2, '0')}`;
    }

    // ── § 3.12 minimum-salary lookups, mirroring nbn-api's
    // _min_salary_for / _one_year_min_cap_hit (transactions.py), so the
    // "Minimum" preset fills in the same figures the validator will check
    // against rather than a second, driftable copy of the scale. ─────────────

    function minScaleFor(season) {
      // Falls back to the latest configured season at or before this one —
      // scales only ever rise, so an older figure under-fills rather than
      // ever overstating the floor (same reasoning as _min_salary_floor).
      const direct = (CAP_LEVELS[season] || {}).min_salary_scale;
      if (direct && direct['0']) return direct;
      let best = null, bestYr = -1;
      Object.keys(CAP_LEVELS).forEach(yr => {
        const scale = (CAP_LEVELS[yr] || {}).min_salary_scale;
        const start = parseInt(yr, 10) || 0;
        if (scale && scale['0'] && start <= (parseInt(season, 10) || 0) && start > bestYr) {
          best = scale; bestYr = start;
        }
      });
      return best || direct || {};
    }

    function minTierKey(yearsExp) {
      return yearsExp >= 10 ? '10+' : String(Math.max(0, yearsExp));
    }

    // Years of NBA experience as of the current league year, from the bio's
    // draft year — or null when there is nothing to go on. That is the common
    // case, not the edge case: `draft_year` is the NBN draft and is null for
    // every player who entered before it, and permanently null for UDFAs. The
    // contract declares its own figure (F.exp) when this can't answer.
    function derivedExp(slug) {
      const draftYear = (BIOS[slug] || {}).draft_year;
      if (!draftYear) return null;
      return Math.max(0, (parseInt(curYr(), 10) || 0) + 2000 - draftYear);
    }

    // The minimum for one season at an explicit experience count, or the
    // league floor when experience is unknown or no scale is configured.
    function tierMinimum(season, yearsExp) {
      const scale = minScaleFor(season);
      const floor = scale['0'] || 0;
      if (yearsExp === null || yearsExp === undefined || !Object.keys(scale).length) return floor;
      return scale[minTierKey(yearsExp)] || floor;
    }

    // A 1-year minimum deal's cap hit is capped at the 2-year veteran minimum
    // regardless of actual tier (§ 3.12) — only relevant for a single-year
    // contract; a multi-year minimum deal follows the per-year tier instead.
    function oneYearMinCapHit(season, yearsExp) {
      const scale = minScaleFor(season);
      const floor = scale['0'] || 0;
      if (yearsExp === null || yearsExp === undefined || !Object.keys(scale).length) return floor;
      const key = minTierKey(yearsExp);
      const tierAmt = scale[key] || floor;
      const twoYrAmt = scale['2'] || 0;
      if (key === '0' || key === '1' || !twoYrAmt) return tierAmt;
      return Math.min(tierAmt, twoYrAmt);
    }

    function minimumSalaries(years, yearsExp) {
      // A genuine 1-year deal gets the § 3.12 2-yr-cap-hit figure. A multi-year
      // deal climbs the scale — each year is the player's own tier minimum for
      // *that* season, and one more season of the deal is one more year of
      // service. That is what § 3.12 prescribes even though the scale's steps
      // at the bottom (rookie → 1 year is +61%) dwarf § 3.13's 5% ladder; the
      // validator exempts minimum-scale years from that ladder, so the honest
      // fill is also the one that passes.
      if (years === 1) return [oneYearMinCapHit(curYr(), yearsExp)];
      const out = [];
      let season = curYr();
      for (let i = 0; i < years; i++) {
        out.push(tierMinimum(season, yearsExp === null || yearsExp === undefined ? null : yearsExp + i));
        season = seasonAfter(season);
      }
      return out;
    }

    function compactMoney(n) {
      if (!n) return '$0';
      const sign = n < 0 ? '-' : '';
      n = Math.abs(n);
      if (n >= 1e6) return sign + '$' + (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
      if (n >= 1e3) return sign + '$' + Math.round(n / 1e3) + 'K';
      return sign + '$' + Math.round(n);
    }

    function parseMoney(v) {
      if (v == null || v === '') return 0;
      const n = parseFloat(String(v).replace(/[$,\s]/g, ''));
      return isNaN(n) ? 0 : n;
    }

    function whenLocal(iso) {
      if (!iso) return '';
      return new Date(iso).toLocaleString(undefined,
        { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    }

    const METHODS = [
      // Required on a standard contract (§ 3.1–§ 3.6) and enforced server-side,
      // so this reads as the unfilled state rather than a legitimate choice —
      // "not declared" invited nine offers through with no funding path at all.
      // Two-ways are the real exemption: $0, outside Team Salary (§ 2.2).
      ['', '— select one —'],
      ['cap_space', 'Cap space'],
      ['bird_rights', 'Bird Rights'],
      ['minimum', 'Minimum'],
      ['mle', "MLE (team's current bucket)"],
      ['ntmle', 'Non-Taxpayer MLE'],
      ['tmle', 'Taxpayer MLE'],
      ['room_exception', 'Room Exception'],
      ['bae', 'Bi-Annual Exception'],
    ];
    const ROLE_OPTIONS = [
      ['none', 'No role promised'],
      ['face', 'Face of the franchise'],
      ['starter', 'Starter'],
      ['role_player', 'Role player'],
      ['veteran', 'Veteran'],
    ];

    function offerFor(team, slug) { return MY_OFFERS[team + '|' + slug] || null; }
    function voidedFor(team, slug) { return MY_VOIDED[team + '|' + slug] || null; }

    async function refreshOffers() {
      MY_OFFERS = {};
      MY_VOIDED = {};
      if (!MY_TEAMS.length) return;
      let list = [];
      try { list = await api('/fa/offers'); } catch { return; }
      // The endpoint also returns offers on players this member reviews as a
      // committee assignee (§ 6.1). Those are not this team's to edit.
      //
      // A voided offer (§ 4.3b) is kept in a map of its own rather than
      // overwriting the live one. It is out of play — the team may bid again, so
      // the menu must offer that — but it is not gone, and the team is owed the
      // reason. Keyed the same way, so a void followed by a fresh offer leaves
      // one entry in each map rather than two fighting over one slot.
      (list || []).filter(o => MY_TEAMS.includes(o.team)).forEach(o => {
        const key = o.team + '|' + o.player;
        if (o.status === 'voided') MY_VOIDED[key] = o;
        else MY_OFFERS[key] = o;
      });
    }

    // ── the ⋯ menu ────────────────────────────────────────────────────────────

    function movesColumn() {
      return {
        key: 'moves', label: '', sortField: null, cls: 'moves-cell', numeric: false,
        render(row, td) {
          // The most advanced state across this member's teams is what the row
          // flag shows; the menu itself breaks it down per team.
          const states = MY_TEAMS.map(t => (offerFor(t, row.slug) || {}).status).filter(Boolean);
          // A void ranks below every live state: if the team has bid again since,
          // that bid is the news, and the void is in the menu either way.
          const flagged = states.includes('returned') ? 'returned'
            : states.includes('submitted') ? 'submitted'
            : states.includes('draft') ? 'draft'
            : MY_TEAMS.some(t => voidedFor(t, row.slug)) ? 'voided' : null;
          if (flagged) {
            const f = document.createElement('span');
            f.className = 'offer-flag ' + flagged;
            f.textContent = flagged === 'returned' ? 'changes asked' : flagged;
            td.appendChild(f);
          }
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'move-btn';
          btn.textContent = '⋯';
          btn.title = 'Free-agency offer';
          btn.setAttribute('aria-label', `Free-agency offer for ${row.player}`);
          btn.addEventListener('click', e => { e.stopPropagation(); openOfferMenu(btn, row); });
          td.appendChild(btn);
        },
      };
    }

    function openOfferMenu(anchor, row) {
      document.querySelectorAll('.move-menu').forEach(m => m.remove());
      const menu = document.createElement('div');
      menu.className = 'move-menu';

      const head = document.createElement('div');
      head.className = 'move-menu-head';
      head.textContent = row.player;
      menu.appendChild(head);

      const close = () => { menu.remove(); document.removeEventListener('click', onDoc, true); };
      const onDoc = e => { if (!menu.contains(e.target) && e.target !== anchor) close(); };

      const addItem = (label, { enabled, why, attn, onClick }) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = label;
        if (attn) b.className = 'attn';
        b.disabled = !enabled;
        if (enabled) b.addEventListener('click', () => { close(); onClick(); });
        menu.appendChild(b);
        if (!enabled && why) {
          const w = document.createElement('span');
          w.className = 'move-menu-why';
          w.textContent = why;
          menu.appendChild(w);
        }
      };

      // `accepting` and its reason are the server's, from GET /api/fa/board —
      // the same `_accepts_offers` the submit path runs. The disabled copy is
      // never composed here, so what the menu says and what the API would do
      // cannot drift.
      const entry = (BOARD.players || {})[row.slug] || null;
      const accepting = !!(entry && entry.accepting);
      const why = (entry && entry.reason) || 'This player isn’t accepting offers right now.';

      MY_TEAMS.forEach(team => {
        const prefix = MY_TEAMS.length > 1 ? team + ' — ' : '';
        const existing = offerFor(team, row.slug);
        // § 4.3b. Shown above the live actions and never hidden: the committee
        // took a bid off the board and the team has no way to ask why, so the
        // reason is the whole of what they get. Disabled, because there is
        // nothing to do with it — the action is to bid again, below.
        const voided = voidedFor(team, row.slug);
        if (voided) {
          addItem(prefix + 'Offer voided by the committee', {
            enabled: false,
            why: '“' + ((voided.void || {}).reason || '—') + '” — it no longer counts against you, '
              + 'and you may offer again.',
          });
        }
        if (!existing) {
          addItem(prefix + (voided ? 'Offer again…' : 'Offer a contract…'), {
            enabled: accepting, why,
            onClick: () => openOfferForm(team, row, null),
          });
        } else if (existing.status === 'returned') {
          addItem(prefix + 'Committee asked for changes…', {
            enabled: true, attn: true,
            onClick: () => openOfferForm(team, row, existing),
          });
        } else if (existing.status === 'draft') {
          addItem(prefix + 'Our draft offer…', {
            enabled: true,
            onClick: () => openOfferForm(team, row, existing),
          });
        } else {
          addItem(prefix + 'Our submitted offer', {
            enabled: true,
            onClick: () => openOfferForm(team, row, existing),
          });
        }
      });

      document.body.appendChild(menu);
      const r = anchor.getBoundingClientRect();
      const mr = menu.getBoundingClientRect();
      menu.style.left = `${Math.max(8, Math.min(r.left - mr.width + r.width, window.innerWidth - mr.width - 8))}px`;
      menu.style.top = `${r.bottom + 4 + mr.height > window.innerHeight ? Math.max(8, r.top - mr.height - 4) : r.bottom + 4}px`;
      setTimeout(() => document.addEventListener('click', onDoc, true), 0);
    }

    // ── the offer form ────────────────────────────────────────────────────────

    function seedForm(row, existing) {
      const y0 = curYr();
      const F = {
        years: 1, salaries: [0], options: [''], guaranteeSchedule: [[]], hold: '', eaps: '',
        type: 'player', method: '', bird: '',
        // Off by default: Years 2+ default to a preset raise off Year 1
        // (below), same as the office's own contract-entry form. Explicit
        // opt-in only, so typed off-menu figures are a deliberate choice.
        customMode: false,
        // § 3.12 years of NBA experience as of Year 1, declared on the contract
        // because the bio usually can't supply it. Prefilled from the draft
        // year when there is one; null means "not established yet".
        exp: derivedExp(row.slug),
        pitch: '', promises: { mpg: null, playoffs: false, role: 'none' },
      };
      if (existing) {
        const c = existing.offer.contract || {};
        const sals = c.salaries || {}, caps = c.cap_holds || {}, sched = c.guarantee_schedule || {};
        const seasons = Object.keys(sals).filter(k => /^\d{2}-\d{2}$/.test(k) && k >= y0).sort();
        // A trailing UFA/RFA line is the hold the deal rolls into, not a
        // contract year — same reading as summarizeContract and the Discord
        // embeds. Counting it would add a phantom year on every reopen.
        const deal = seasons.filter(s => caps[s] !== 'UFA' && caps[s] !== 'RFA');
        F.years = Math.max(1, deal.length);
        F.salaries = deal.map(s => parseMoney(sals[s]));
        F.options = deal.map(s => (caps[s] === 'UFA' || caps[s] === 'RFA') ? '' : (caps[s] || ''));
        F.guaranteeSchedule = deal.map(s => Array.isArray(sched[s])
          ? sched[s].map(step => ({ amount: step.amount || '', date: step.date || '' })) : []);
        const after = deal.length ? seasonAfter(deal[deal.length - 1]) : y0;
        F.hold = (caps[after] === 'UFA' || caps[after] === 'RFA') ? caps[after] : '';
        F.type = c.type || 'player';
        if (c.years_experience !== null && c.years_experience !== undefined) F.exp = c.years_experience;
        F.method = existing.offer.signing_method || '';
        F.bird = existing.offer.bird_rights_type || '';
        F.eaps = existing.offer.eaps_assumption || '';
        F.pitch = existing.pitch || '';
        F.promises = Object.assign({ mpg: null, playoffs: false, role: 'none' }, existing.promises || {});
      } else {
        // Year 1 seeded from what the player is already on the books for, so
        // the common case (re-signing a hold) starts from a real figure.
        F.salaries[0] = (POOL[row.slug] || {}).prior_salary || 0;
        F.hold = 'UFA';
      }
      while (F.salaries.length < F.years) F.salaries.push(0);
      while (F.options.length < F.years) F.options.push('');
      while (F.guaranteeSchedule.length < F.years) F.guaranteeSchedule.push([]);
      return F;
    }

    function contractFromForm(F) {
      const salaries = {}, cap_holds = {}, guarantee_schedule = {};
      let s = curYr();
      for (let i = 0; i < F.years; i++) {
        salaries[s] = '$' + (F.salaries[i] || 0);
        if (F.options[i]) cap_holds[s] = F.options[i];
        if (F.options[i] === 'NON_GTD' && (F.guaranteeSchedule[i] || []).length) {
          const steps = F.guaranteeSchedule[i]
            .filter(step => step.amount || step.date)
            .map(step => {
              const entry = {};
              if (step.amount) entry.amount = step.amount;
              if (step.date)   entry.date   = step.date;
              return entry;
            });
          if (steps.length) guarantee_schedule[s] = steps;
        }
        s = seasonAfter(s);
      }
      // The hold's season is deliberately left out of `salaries`: the API's
      // _autofill_fa_hold_amounts computes the real § 3.10 figure from the prior
      // salary and Bird tier, and a typed placeholder would override it.
      if (F.hold) cap_holds[s] = F.hold;
      const c = { type: F.type, salaries, cap_holds };
      if (Object.keys(guarantee_schedule).length) c.guarantee_schedule = guarantee_schedule;
      // Stated as of Year 1, which is why it travels with the contract rather
      // than the player — re-read in a later league year it still resolves.
      if (F.exp !== null && F.exp !== undefined) c.years_experience = F.exp;
      return c;
    }

    function offerBody(F, team, slug) {
      return {
        player: slug, team,
        contract: contractFromForm(F),
        signing_method: F.method || null,
        bird_rights_type: F.bird || null,
        eaps_assumption: F.eaps || null,
      };
    }

    function totalValue(F) {
      let t = 0;
      for (let i = 0; i < F.years; i++) t += F.salaries[i] || 0;
      return t;
    }

    function openOfferForm(team, row, existing) {
      const slug = row.slug;
      const F = seedForm(row, existing);
      const readOnly = !!existing && existing.status === 'submitted';
      const entry = (BOARD.players || {})[slug] || null;
      // A resubmission is exempt from the FFA window (§ 4.3a): the clock governs
      // *new* offers from other teams, and a revision the committee itself asked
      // for is part of its own review.
      const windowOpen = !!(entry && entry.accepting) || (!!existing && existing.status === 'returned');
      // The version frozen at the remand — what the committee is actually
      // answering. Shown beside each input so the team can see what it is
      // changing from (§ 8.1).
      const prevVersion = existing && (existing.versions || []).length
        ? existing.versions[existing.versions.length - 1] : null;

      const scrim = document.createElement('div');
      scrim.className = 'scrim';
      const box = document.createElement('div');
      box.className = 'offer-modal';
      scrim.appendChild(box);
      const close = () => { scrim.remove(); document.removeEventListener('keydown', onKey); };
      const onKey = e => { if (e.key === 'Escape') close(); };
      document.addEventListener('keydown', onKey);
      scrim.addEventListener('click', e => { if (e.target === scrim) close(); });
      document.body.appendChild(scrim);

      let validateTimer = null, validateSeq = 0, lastValidation = null;

      drawForm();

      function el(tag, cls, text) {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      }

      function select(options, value, onChange) {
        const s = document.createElement('select');
        options.forEach(([v, label, disabled]) => {
          const o = document.createElement('option');
          o.value = v; o.textContent = label;
          if (disabled) o.disabled = true;
          if (v === value) o.selected = true;
          s.appendChild(o);
        });
        s.disabled = readOnly;
        s.addEventListener('change', () => onChange(s.value));
        return s;
      }

      function field(labelText, control) {
        const wrap = el('div');
        wrap.appendChild(el('label', null, labelText));
        wrap.appendChild(control);
        return wrap;
      }

      function drawForm() {
        box.innerHTML = '';

        const h = el('h3');
        h.appendChild(document.createTextNode(`${team} offer — ${row.player}`));
        if (existing) h.appendChild(el('span', 'offer-flag ' + existing.status,
          existing.status === 'returned' ? 'changes asked' : existing.status));
        box.appendChild(h);
        const pool = POOL[slug] || {};
        box.appendChild(el('div', 'sub',
          `${pool.hold_type || ''} ${pool.class_year || ''} · ${row.pos} · ${row.age} yrs`
          + (pool.rfa ? ' · restricted' : '')
          + (existing ? ` · offer #${existing.number}, v${existing.version}` : '')));

        // The committee's asks, pinned above the editor. Every outstanding note
        // is shown, attributed: remands are additive, so a team answers them all
        // in one resubmission rather than guessing which is live (§ 4.3a).
        if (existing && existing.status === 'returned') {
          const b = el('div', 'panel warn');
          b.style.marginTop = '0.7rem';
          b.appendChild(el('div', 'fs-head', 'The committee asked for changes'));
          (existing.remands || []).filter(r => r.from_version >= existing.version).forEach(r => {
            const n = el('div', 'remand-note');
            n.appendChild(el('div', null, r.note));
            n.appendChild(el('div', 'meta', `${r.by} · ${whenLocal(r.at)}`));
            b.appendChild(n);
          });
          box.appendChild(b);
        }

        // § 4.3b. If this team's previous bid was voided, the form it is about to
        // fill in is a *re*-bid, and it should say so with the committee's reason
        // — the same one the ⋯ menu carries, server-composed, never restated here.
        const voided = voidedFor(team, slug);
        if (voided && !existing) {
          const b = el('div', 'panel bad');
          b.style.marginTop = '0.7rem';
          b.appendChild(el('div', 'fs-head',
            `Your previous offer (#${voided.number}) was voided by the committee`));
          const n = el('div', 'remand-note');
          n.appendChild(el('div', null, (voided.void || {}).reason || '—'));
          n.appendChild(el('div', 'meta',
            `${(voided.void || {}).by || '?'} · ${whenLocal((voided.void || {}).at)}`
            + ' · it no longer counts against your cap exposure'));
          b.appendChild(n);
          box.appendChild(b);
        }

        if (readOnly) {
          const b = el('div', 'panel info');
          b.style.marginTop = '0.7rem';
          b.textContent = 'This offer is with the committee. Once submitted to the committee, an offer '
            + 'cannot be withdrawn (§ 3.14) — it can only come back if the committee sends it back for '
            + 'revision. Nothing below can be changed.';
          box.appendChild(b);
        }

        // ── contract ─────────────────────────────────────────────────────────
        const cf = el('fieldset', 'fs');
        cf.appendChild(el('legend', null, 'Contract'));
        const topRow = el('div', 'grid-row');
        topRow.appendChild(field('Years', select(
          [1, 2, 3, 4, 5].map(n => [String(n), n + (n > 1 ? ' years' : ' year')]),
          String(F.years), v => {
            F.years = +v;
            for (let i = 0; i < F.years; i++) {
              F.salaries[i] = F.salaries[i] || 0;
              F.options[i] = F.options[i] || '';
              F.guaranteeSchedule[i] = F.guaranteeSchedule[i] || [];
            }
            F.salaries.length = F.years;
            F.options.length = F.years;
            F.guaranteeSchedule.length = F.years;
            // A minimum deal's figures are per-year and length-dependent — a
            // 1-year deal's cap hit is the 2-yr veteran minimum (§ 3.12), a
            // multi-year one climbs the scale — so re-derive rather than
            // carrying the old year's numbers into a different-length deal.
            if (F.method === 'minimum' && F.type !== 'two-way') {
              F.salaries = minimumSalaries(F.years, F.exp);
            }
            drawForm();
          })));
        topRow.appendChild(field('Type', select(
          [['player', 'Standard'], ['two-way', 'Two-way']], F.type, v => { F.type = v; revalidate(); })));
        cf.appendChild(topRow);

        const yrs = el('div');
        yrs.style.marginTop = '0.55rem';
        let season = curYr();
        for (let i = 0; i < F.years; i++) {
          const s = season;
          const idx = i;
          const r = el('div', 'yr-row');
          const yl = el('div', 'yr', s);
          r.appendChild(yl);

          const input = document.createElement('input');
          // text, not number: a number input rejects "$" and "," outright —
          // pasting a formatted figure (e.g. copied off the legality panel)
          // left the field empty, which silently zeroed the salary.
          // parseMoney() already strips both, so route through it here too.
          input.type = 'text'; input.inputMode = 'decimal';
          input.value = F.salaries[i] || 0;
          // Year 1 is always the typed base. Years 2+ default to whatever the
          // preset raise below last generated, and only unlock for direct
          // typing once "custom" is explicitly checked — except on a minimum
          // deal, which never goes through the preset (§ 3.12 prices it,
          // below).
          input.disabled = readOnly || (idx > 0 && F.method !== 'minimum' && !F.customMode);
          input.addEventListener('input', () => {
            F.salaries[idx] = parseMoney(input.value);
            drawRaises();
            revalidate();
          });
          input.addEventListener('blur', () => {
            input.value = F.salaries[idx] || 0;
          });
          r.appendChild(input);

          if (!F.guaranteeSchedule[idx]) F.guaranteeSchedule[idx] = [];
          const stepsDiv = el('div', 'gtd-steps' + (F.options[i] === 'NON_GTD' ? ' visible' : ''));

          r.appendChild(select(
            [['', '— guaranteed —'], ['PLAYER_OPT', 'Player option'],
             ['TEAM_OPT', 'Team option'], ['NON_GTD', 'Non-guaranteed']],
            F.options[i] || '', v => {
              F.options[idx] = v;
              stepsDiv.classList.toggle('visible', v === 'NON_GTD');
              if (v !== 'NON_GTD') {
                F.guaranteeSchedule[idx] = [];
                stepsDiv.querySelectorAll('.gtd-step').forEach(row => row.remove());
              }
              revalidate();
            }));

          const raise = el('span', 'yr-raise');
          raise.dataset.idx = String(i);
          yl.appendChild(raise);

          if (prevVersion) {
            const was = parseMoney((prevVersion.offer.contract.salaries || {})[s]);
            if (was !== (F.salaries[i] || 0)) {
              const w = el('span', 'yr-was', was ? 'was ' + compactMoney(was) : 'new year');
              yl.appendChild(w);
            }
          }
          yrs.appendChild(r);

          // Partial-guarantee schedule for a non-guaranteed year — what's owed
          // if released, separate from the cap-hit salary above. Only meaningful
          // once the year is marked NON_GTD; CSS hides it otherwise. Mirrors the
          // step editor in players/index.html so the same shape reaches the API
          // (guarantee_schedule) whether entered by the office or by a team here.
          const stepsDesc = el('div', 'gtd-steps-desc',
            'What’s owed if released. Leave amount blank to guarantee the full remaining salary.');
          stepsDiv.appendChild(stepsDesc);

          function addStepRow(step) {
            const stepRow = el('div', 'gtd-step');
            const amtIn = document.createElement('input');
            amtIn.type = 'text'; amtIn.className = 'gtd-step-amount';
            amtIn.placeholder = '$ partial amount';
            amtIn.title = 'Dollar amount that vests on this date. Leave blank to guarantee the full remaining salary.';
            amtIn.value = step.amount || '';
            amtIn.disabled = readOnly;
            amtIn.addEventListener('input', () => { step.amount = amtIn.value; });

            const connOn = el('span', 'gtd-step-conn', 'on');

            const dateIn = document.createElement('input');
            dateIn.type = 'date'; dateIn.className = 'gtd-step-date';
            dateIn.title = 'Date this amount vests. Leave blank for "at signing".';
            dateIn.value = step.date || '';
            dateIn.disabled = readOnly;
            dateIn.addEventListener('input', () => { step.date = dateIn.value; });

            const dateHint = el('span', 'gtd-step-conn', '(blank = at signing)');

            stepRow.appendChild(amtIn);
            stepRow.appendChild(connOn);
            stepRow.appendChild(dateIn);
            stepRow.appendChild(dateHint);

            if (!readOnly) {
              const rmBtn = document.createElement('button');
              rmBtn.type = 'button'; rmBtn.className = 'gtd-step-remove'; rmBtn.textContent = '×';
              rmBtn.addEventListener('click', () => {
                const steps = F.guaranteeSchedule[idx];
                const pos = steps.indexOf(step);
                if (pos !== -1) steps.splice(pos, 1);
                stepRow.remove();
              });
              stepRow.appendChild(rmBtn);
            }
            stepsDiv.insertBefore(stepRow, addStepBtn);
          }

          const addStepBtn = document.createElement('button');
          addStepBtn.type = 'button'; addStepBtn.className = 'add-step-btn';
          addStepBtn.textContent = '+ guarantee step';
          addStepBtn.style.display = readOnly ? 'none' : '';
          addStepBtn.addEventListener('click', () => {
            const step = {};
            F.guaranteeSchedule[idx].push(step);
            addStepRow(step);
          });
          stepsDiv.appendChild(addStepBtn);

          F.guaranteeSchedule[idx].forEach(step => addStepRow(step));
          yrs.appendChild(stepsDiv);

          season = seasonAfter(season);
        }
        // Filled in by paintHold off the validator's fact sheet — see there for
        // why the figure can't be worked out here.
        const holdLine = el('div', 'hold-row');
        holdLine.id = 'hold-amount-row';
        yrs.appendChild(holdLine);
        cf.appendChild(yrs);

        // Minimum deals never reach this — § 3.12 prices every year off the
        // experience scale below, and a flat step off Year 1 doesn't fit it.
        if (!readOnly && F.method !== 'minimum' && F.years > 1) {
          const presets = el('div', 'presets');
          presets.appendChild(el('span', null, 'Fill:'));
          [['-8', '-8%'], ['-5', '-5%'], ['flat', 'Flat'], ['5', '+5%'], ['8', '+8% (Bird)']].forEach(([k, label]) => {
            const b = el('button', null, label);
            b.type = 'button';
            b.addEventListener('click', () => {
              const base = F.salaries[0] || 0;
              const pct = k === 'flat' ? 0 : parseInt(k, 10);
              const step = Math.round(base * (pct / 100));
              for (let i = 1; i < F.years; i++) {
                F.salaries[i] = (F.salaries[i - 1] || 0) + step;
              }
              drawForm();
            });
            presets.appendChild(b);
          });
          cf.appendChild(presets);

          const customLine = el('label', 'checkbox-line');
          const customBox = document.createElement('input');
          customBox.type = 'checkbox';
          customBox.checked = F.customMode;
          customBox.addEventListener('change', () => { F.customMode = customBox.checked; drawForm(); });
          customLine.appendChild(customBox);
          customLine.appendChild(document.createTextNode('Enter custom year-by-year amounts instead of a preset raise'));
          cf.appendChild(customLine);
        }

        const holdRow = el('div', 'grid-row');
        holdRow.style.marginTop = '0.6rem';
        holdRow.appendChild(field('After the contract (§ 3.10)', select(
          [['', '— no trailing hold —'], ['UFA', 'UFA hold'], ['RFA', 'RFA hold']],
          F.hold, v => { F.hold = v; drawForm(); revalidate(); })));
        if (F.hold) {
          holdRow.appendChild(field('Prior salary vs. EAPS', select(
            [['', '— not specified —'], ['below', 'At or below EAPS'], ['above', 'Above EAPS']],
            F.eaps, v => { F.eaps = v; revalidate(); })));
        }
        cf.appendChild(holdRow);
        box.appendChild(cf);

        // ── funding ──────────────────────────────────────────────────────────
        const ff = el('fieldset', 'fs');
        ff.appendChild(el('legend', null, 'Funded by (§ 3.1–3.6)'));
        const fr = el('div', 'grid-row');
        // § 5.4 — shown and disabled with the reason, not hidden, exactly like an
        // ineligible entry in the roster ⋯ menu.
        const methodOpts = METHODS.concat([['sign_and_trade', 'Sign-and-trade — not supported here', true]]);
        const methodSel = select(methodOpts, F.method, v => {
          F.method = v;
          // Fill in the § 3.12 figures for this player rather than leaving
          // the salary boxes at whatever they held before (often $0 on a
          // fresh offer) — the same numbers the validator will check against.
          if (v === 'minimum' && F.type !== 'two-way') {
            F.salaries = minimumSalaries(F.years, F.exp);
            drawForm();
            return;
          }
          revalidate();
        });
        methodSel.title = 'Sign-and-trade requires a companion trade proposal and joint approval — '
          + 'not yet supported on the site (§ 3.14). Bring it to the committee directly.';
        fr.appendChild(field('Exception / method', methodSel));

        // § 3.12 puts each year of a minimum deal on the scale row for the
        // player's experience *that* season, so the tier has to be known to
        // price the deal at all. Only asked for on a minimum contract, where
        // it changes the numbers — everywhere else it is noise.
        if (F.method === 'minimum' && F.type !== 'two-way') {
          const expIn = document.createElement('input');
          expIn.type = 'number';
          expIn.min = '0'; expIn.max = '25'; expIn.step = '1';
          expIn.value = (F.exp === null || F.exp === undefined) ? '' : String(F.exp);
          expIn.placeholder = 'unknown';
          expIn.disabled = readOnly;
          expIn.addEventListener('change', () => {
            const v = expIn.value.trim();
            F.exp = v === '' ? null : Math.max(0, Math.min(25, parseInt(v, 10) || 0));
            F.salaries = minimumSalaries(F.years, F.exp);
            drawForm();
          });
          expIn.title = 'Years of NBA experience in Year 1 of this deal. Sets which row of the '
            + 'Minimum Salary Scale each year is priced on (§ 3.12); the tier steps up one row '
            + 'per contract year.';
          const expField = field('NBA experience (Yr 1)', expIn);
          const note = el('div', 'sub', derivedExp(slug) === null
            ? 'No draft year on file for this player, so this can\'t be derived — set it or every '
              + 'year prices at the rookie minimum.'
            : 'Prefilled from their draft year. Override if it\'s wrong.');
          expField.appendChild(note);
          fr.appendChild(expField);
        }
        fr.appendChild(field('Bird rights tier', select(
          [['', '— none / not applicable —'], ['QVFA', 'Full Bird (QVFA)'],
           ['EQVFA', 'Early Bird (EQVFA)'], ['Non-QVFA', 'Non-Bird (Non-QVFA)']],
          F.bird, v => { F.bird = v; revalidate(); })));
        ff.appendChild(fr);
        box.appendChild(ff);

        // ── pitch and promises ───────────────────────────────────────────────
        const pf = el('fieldset', 'fs');
        pf.appendChild(el('legend', null, 'Pitch'));
        const ta = document.createElement('textarea');
        ta.value = F.pitch;
        ta.disabled = readOnly;
        ta.placeholder = 'Why this player should sign here. The committee reads this alongside the money.';
        ta.addEventListener('input', () => { F.pitch = ta.value; });
        pf.appendChild(ta);
        box.appendChild(pf);

        const mf = el('fieldset', 'fs');
        mf.appendChild(el('legend', null, 'Promises'));
        const mr = el('div', 'grid-row');
        const mpg = document.createElement('input');
        mpg.type = 'number'; mpg.min = '0'; mpg.max = '48';
        mpg.value = F.promises.mpg == null ? '' : F.promises.mpg;
        mpg.disabled = readOnly;
        mpg.placeholder = '—';
        mpg.addEventListener('input', () => {
          F.promises.mpg = mpg.value === '' ? null : Math.max(0, Math.min(48, +mpg.value));
        });
        mr.appendChild(field('Minutes per game', mpg));
        mr.appendChild(field('Role', select(ROLE_OPTIONS, F.promises.role, v => { F.promises.role = v; })));
        const cb = el('label', 'checkbox-line');
        const playoffBox = document.createElement('input');
        playoffBox.type = 'checkbox';
        playoffBox.checked = !!F.promises.playoffs;
        playoffBox.disabled = readOnly;
        playoffBox.addEventListener('change', () => { F.promises.playoffs = playoffBox.checked; });
        cb.appendChild(playoffBox);
        cb.appendChild(document.createTextNode('Promised a playoff team'));
        mr.appendChild(cb);
        mf.appendChild(mr);
        box.appendChild(mf);

        // ── legality ─────────────────────────────────────────────────────────
        const lf = el('fieldset', 'fs');
        lf.appendChild(el('legend', null, 'Legality (§ 5.1) and exposure (§ 5.3)'));
        const panel = el('div', 'panel');
        panel.id = 'legality-panel';
        panel.textContent = 'Checking…';
        lf.appendChild(panel);
        const commit = el('div', 'panel info');
        commit.style.marginTop = '0.4rem';
        commit.id = 'commit-panel';
        commit.textContent = 'Loading this team’s committed offers…';
        lf.appendChild(commit);
        box.appendChild(lf);

        // ── actions ──────────────────────────────────────────────────────────
        const actions = el('div', 'modal-actions');
        const errSpan = el('div', 'spacer');
        actions.appendChild(errSpan);

        const cancel = el('button', null, readOnly ? 'Close' : 'Cancel');
        cancel.addEventListener('click', close);
        actions.appendChild(cancel);

        if (!readOnly) {
          if (existing && existing.status === 'draft') {
            const del = el('button', 'danger', 'Delete draft');
            del.addEventListener('click', async () => {
              if (!confirm('Delete this draft? Nothing has been sent to the committee.')) return;
              del.disabled = true;
              try {
                await api('/fa/offers/' + existing.id, { method: 'DELETE' });
                await refreshOffers();
                rebuildBody();
                close();
                toast('Draft deleted');
              } catch (e) { errSpan.textContent = e.message; del.disabled = false; }
            });
            actions.appendChild(del);
          }

          const save = el('button', null, 'Save draft');
          save.addEventListener('click', async () => {
            save.disabled = true; errSpan.textContent = '';
            try {
              await persist();
              await refreshOffers();
              rebuildBody();
              toast('Saved');
              close();
            } catch (e) { errSpan.textContent = e.message; save.disabled = false; }
          });
          actions.appendChild(save);

          const submit = el('button', 'primary', existing && existing.status === 'returned' ? 'Resubmit…' : 'Submit…');
          submit.id = 'submit-btn';
          submit.addEventListener('click', () => drawConfirm());
          actions.appendChild(submit);
        }
        box.appendChild(actions);

        drawRaises();
        gateSubmit();
        revalidate(true);
        loadCommitment();
      }

      // Year-over-year raise as a % of Year 1 — the figure § 3.13 actually caps.
      // A typing aid only; the binding check is _check_contract_raises server-side.
      function drawRaises() {
        const base = F.salaries[0] || 0;
        box.querySelectorAll('.yr-raise').forEach(span => {
          const i = +span.dataset.idx;
          if (i === 0 || !base) { span.textContent = ''; return; }
          const pct = ((F.salaries[i] || 0) - (F.salaries[i - 1] || 0)) / base * 100;
          span.textContent = ` ${pct >= 0 ? '+' : ''}${pct.toFixed(1)}%`;
          span.style.color = pct > 8.01 ? 'var(--danger)' : pct > 5.01 ? 'var(--gold)' : 'var(--text-muted)';
        });
      }

      // The client check is advisory (§ 5.1): the server re-runs `_validate_sign`
      // at submit and *that* verdict is what's stored. This is the same endpoint,
      // on the same 250ms debounce the transaction simulator uses.
      function revalidate(immediate) {
        clearTimeout(validateTimer);
        validateTimer = setTimeout(runValidation, immediate ? 0 : 250);
      }

      async function runValidation() {
        const panel = box.querySelector('#legality-panel');
        if (!panel) return;
        const seq = ++validateSeq;
        try {
          const res = await fetch('/api/validate/sign', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(offerBody(F, team, slug)),
          });
          if (seq !== validateSeq) return;
          if (!res.ok) {
            const d = await res.json().catch(() => ({}));
            lastValidation = null;
            panel.className = 'panel bad';
            panel.textContent = 'Could not evaluate: ' + (d.detail || ('HTTP ' + res.status));
            paintHold(null);
            gateSubmit();
            return;
          }
          lastValidation = await res.json();
        } catch {
          if (seq !== validateSeq) return;
          lastValidation = null;
          panel.className = 'panel bad';
          panel.textContent = 'Could not reach the validator.';
          paintHold(null);
          gateSubmit();
          return;
        }
        if (seq !== validateSeq) return;
        renderValidation(panel, lastValidation);
        paintHold((lastValidation.fact_sheet || {}).trailing_hold);
        gateSubmit();
      }

      // § 3.10's trailing hold, priced live as the deal is built. The figure is
      // the server's `trailing_hold` off the validate/sign fact sheet — produced
      // by the same _autofill_fa_hold_amounts that writes it at signing time —
      // never worked out here, same rule as every other dollar on this page.
      const BIRD_LABEL = { QVFA: 'Full Bird', EQVFA: 'Early Bird', 'Non-QVFA': 'Non-Bird' };

      function paintHold(h) {
        const line = box.querySelector('#hold-amount-row');
        if (!line) return;
        line.title = '';
        if (!F.hold) { line.textContent = ''; return; }
        if (!h) {
          line.textContent = `${F.hold} hold after the deal — amount pending the legality check`;
          return;
        }
        const tier = BIRD_LABEL[h.bird_tier] || h.bird_tier || '';
        let tail;
        if (h.needs_eaps) {
          tail = 'choose above/below EAPS to price it';
        } else if (h.amount == null) {
          tail = h.note || 'the office will price it';
        } else {
          tail = compactMoney(h.amount) + (tier ? ` · ${tier}` : '');
          line.title = h.note || '';
        }
        line.textContent = `${h.season} — ${h.type} hold · ${tail}`;
      }

      function renderValidation(panel, data) {
        const checks = data.checks || [];
        const failing = checks.filter(c => !c.passed);
        panel.className = 'panel' + (data.legal ? '' : ' bad');
        panel.innerHTML = '';
        panel.appendChild(el('div', 'fs-head',
          data.legal ? 'Legal as it stands' : 'Fails a rule check — cannot be submitted'));
        if (!failing.length) {
          panel.appendChild(el('div', 'checkline ok', '✓ No constraint is triggered.'));
        }
        failing.forEach(c => panel.appendChild(el('div', 'checkline ' + (c.level === 'error' ? 'err' : 'warn'),
          (c.level === 'error' ? '✗ ' : '⚠ ') + (c.message || c.check))));
        const f = data.fact_sheet || {};
        if (!f.unresolved) {
          const bits = [];
          if (f.cap_room != null) bits.push('cap room ' + compactMoney(f.cap_room));
          if (f.exception) bits.push(f.exception.label + ' ' + compactMoney(f.exception.remaining) + ' left');
          if (f.standard_count_after != null) bits.push('roster ' + f.standard_count_before + ' → ' + f.standard_count_after);
          if (bits.length) panel.appendChild(el('div', 'checkline ok', bits.join(' · ')));
        }
        // Warnings are submittable and the committee sees them (§ 5.1) — say so,
        // rather than leaving a yellow line looking like a blocker.
        if (data.legal && failing.length) {
          panel.appendChild(el('div', 'checkline ok',
            'Warnings don’t block a submission; the committee is shown them.'));
        }
      }

      // § 5.3 — a pending offer holds no cap room, so nothing stops a team
      // bidding more than it can fund. Disclosed here and on the committee's
      // review page, off the same server-side helper. Never blocked.
      async function loadCommitment() {
        const panel = box.querySelector('#commit-panel');
        if (!panel) return;
        let c;
        try { c = await api('/fa/commitment/' + team); }
        catch { panel.remove(); return; }
        if (!box.contains(panel)) return;
        panel.className = 'panel' + (c.overcommitted ? ' warn' : ' info');
        panel.textContent = `${team} has ${c.live_offers} live offer${c.live_offers === 1 ? '' : 's'} out, `
          + `${compactMoney(c.committed_year1)} of ${c.season} salary committed against `
          + `${c.room == null ? 'unknown' : compactMoney(c.room)} of room`
          + (c.overcommitted
            ? ' — more than this team can fund. A pending offer holds no cap room, so this is allowed; '
              + 'the committee is told, not blocked (§ 5.3).'
            : '.');
      }

      function gateSubmit() {
        const btn = box.querySelector('#submit-btn');
        if (!btn) return;
        const errs = ((lastValidation && lastValidation.checks) || [])
          .filter(c => !c.passed && c.level === 'error');
        let why = '';
        if (!lastValidation) why = 'Waiting on the legality check.';
        else if (errs.length) why = 'Fails a rule check: ' + (errs[0].message || errs[0].check);
        else if (!windowOpen) why = (entry && entry.reason) || 'This player isn’t accepting offers right now.';
        btn.disabled = !!why;
        btn.title = why || 'Review and submit to the committee';
      }

      // Writes the current form to the server. A submit always goes through here
      // first: `POST /api/fa/offers/{id}/submit` validates and freezes the
      // *stored* offer, so the figures on screen have to be the stored ones.
      async function persist() {
        const body = offerBody(F, team, slug);
        const promises = {
          mpg: F.promises.mpg, playoffs: !!F.promises.playoffs, role: F.promises.role || 'none',
        };
        if (existing) {
          const patched = await api('/fa/offers/' + existing.id, {
            method: 'PATCH',
            body: {
              contract: body.contract, signing_method: body.signing_method,
              bird_rights_type: body.bird_rights_type, eaps_assumption: body.eaps_assumption,
              pitch: F.pitch, promises,
            },
          });
          return patched;
        }
        const created = await api('/fa/offers', {
          method: 'POST',
          body: Object.assign({}, body, { pitch: F.pitch, promises }),
        });
        existing = created;
        return created;
      }

      // § 8.1.7 — a second step naming the player and the total value, quoting
      // § 3.14's rule verbatim. With no withdrawal and one live offer per team
      // per player, the draft is a team's only chance to get this right, so the
      // last thing before it becomes final is a full restatement of it.
      function drawConfirm() {
        const contract = contractFromForm(F);
        const seasons = Object.keys(contract.salaries).sort();
        box.innerHTML = '';
        box.appendChild(el('h3', null, `Submit ${team}’s offer to ${row.player}?`));
        box.appendChild(el('div', 'sub',
          `${F.years} year${F.years === 1 ? '' : 's'}, ${compactMoney(totalValue(F))} total`
          + (F.hold ? ` · rolls into a ${F.hold} hold` : '')));

        const list = el('div', 'panel');
        list.style.marginTop = '0.7rem';
        seasons.forEach((s, i) => {
          const tag = contract.cap_holds[s];
          const steps = (contract.guarantee_schedule || {})[s];
          const stepsNote = (tag === 'NON_GTD' && steps && steps.length)
            ? ' — ' + steps.map(step => step.amount
                ? compactMoney(parseMoney(step.amount)) + ' vests' + (step.date ? ' ' + step.date : '')
                : 'fully guarantees' + (step.date ? ' ' + step.date : '')).join(', ')
            : '';
          list.appendChild(el('div', 'checkline ok',
            `${s} — ${compactMoney(F.salaries[i] || 0)}${tag ? ' (' + tag + ')' : ''}${stepsNote}`));
        });
        // The trailing hold is part of what this offer commits the team to, so
        // it is restated here with the rest of the years (§ 3.10).
        const th = ((lastValidation || {}).fact_sheet || {}).trailing_hold;
        if (th) {
          list.appendChild(el('div', 'checkline ok',
            `${th.season} — ${th.type} hold`
            + (th.amount != null ? `, ${compactMoney(th.amount)}` : ', amount set by the office')));
        }
        box.appendChild(list);

        const warn = el('div', 'panel warn');
        warn.style.marginTop = '0.6rem';
        warn.textContent = 'Once submitted to the committee, this offer cannot be withdrawn (§ 3.14). '
          + 'Your team cannot edit it or take it back; the only way it returns is if the committee sends '
          + 'it back for revision. If your cap position changes and the offer becomes illegal, the '
          + 'committee is shown that and decides — the offer still stands.';
        box.appendChild(warn);

        const actions = el('div', 'modal-actions');
        const errSpan = el('div', 'spacer');
        actions.appendChild(errSpan);
        const back = el('button', null, 'Back');
        back.addEventListener('click', drawForm);
        actions.appendChild(back);
        const go = el('button', 'primary', 'Submit to the committee');
        go.addEventListener('click', async () => {
          go.disabled = true; back.disabled = true; errSpan.textContent = '';
          const label = go.textContent;
          go.textContent = 'Submitting…';
          try {
            const saved = await persist();
            await api('/fa/offers/' + saved.id + '/submit', { method: 'POST' });
            await refreshOffers();
            rebuildBody();
            close();
            toast(`${team}’s offer to ${row.player} is with the committee`);
          } catch (e) {
            errSpan.textContent = e.message;
            go.disabled = false; back.disabled = false; go.textContent = label;
          }
        });
        actions.appendChild(go);
        box.appendChild(actions);
      }
    }

    // ── § 5.1 waiver wire ────────────────────────────────────────────────────
    // Design record: nbn-today/docs/waiver-wire-spec.md. A released player is
    // "on waivers" for 48 hours; other teams can claim the untouched contract.
    // Claims are sealed (spec § 2) — GET /api/waivers never says who else has
    // claimed, only whether *my* team(s) have. The claim methods offered
    // deliberately drop 'bird_rights'/'minimum'/'sign_and_trade' from METHODS:
    // a claim assumes an existing contract rather than negotiating one, so
    // Bird Rights and a minimum-scale choice don't apply the way they do to a
    // fresh signing.
    const CLAIM_METHODS = METHODS.filter(([v]) => !['bird_rights', 'minimum'].includes(v));

    let WAIVERS = [];

    function timeLeft(deadlineIso) {
      if (!deadlineIso) return { text: '', urgent: false };
      const ms = new Date(deadlineIso).getTime() - Date.now();
      if (ms <= 0) return { text: 'resolving…', urgent: true };
      const h = Math.floor(ms / 3600000), m = Math.floor((ms % 3600000) / 60000);
      const d = Math.floor(h / 24);
      const text = d >= 1 ? `${d}d ${h % 24}h left` : `${h}h ${m}m left`;
      return { text, urgent: ms < 6 * 3600000 };
    }

    async function loadWaivers() {
      try { WAIVERS = await api('/waivers'); } catch { WAIVERS = []; }
      renderWaivers();
    }

    function renderWaivers() {
      const wrap = document.getElementById('waivers-wrap');
      wrap.innerHTML = '';
      if (!WAIVERS.length) return;
      const section = document.createElement('div');
      section.className = 'waivers-section';
      const h = document.createElement('h2');
      h.textContent = `On Waivers (${WAIVERS.length})`;
      section.appendChild(h);

      WAIVERS.forEach(w => {
        const card = document.createElement('div');
        card.className = 'waiver-card';

        const main = document.createElement('div');
        main.className = 'wc-main';
        const name = document.createElement('div');
        name.className = 'wc-player';
        name.textContent = displayName((BIOS[w.player] || {}).name || w.player);
        main.appendChild(name);
        const sub = document.createElement('div');
        sub.className = 'wc-sub';
        const sal = (w.contract.salaries || {})[Object.keys(w.contract.salaries || {}).sort()[0]];
        sub.textContent = `Waived by ${w.released_by}` + (sal ? ` · ${formatSalary(sal)} this season` : '');
        main.appendChild(sub);
        card.appendChild(main);

        if (w.awaiting_pdc) {
          const badge = document.createElement('span');
          badge.className = 'wc-status pdc';
          badge.textContent = 'tied — awaiting PDC';
          card.appendChild(badge);
        }

        const dl = document.createElement('div');
        dl.className = 'wc-deadline';
        const tl = timeLeft(w.deadline);
        dl.textContent = tl.text;
        if (tl.urgent) dl.classList.add('urgent');
        card.appendChild(dl);

        if (!MY_TEAMS.length) {
          // Public viewer — informational only, no action to offer.
        } else if (w.released_by && MY_TEAMS.includes(w.released_by) && MY_TEAMS.length === 1) {
          // A team may not claim a player it just released — same rule the
          // server enforces; not worth showing a button that would 422.
        } else {
          MY_TEAMS.forEach(team => {
            if (team === w.released_by) return;
            const mine = (w.my_claims || []).includes(team);
            const btn = document.createElement('button');
            if (mine) {
              btn.className = 'danger';
              btn.textContent = MY_TEAMS.length > 1 ? `Withdraw (${team})` : 'Withdraw claim';
              btn.addEventListener('click', () => withdrawClaim(w, team));
            } else {
              btn.textContent = MY_TEAMS.length > 1 ? `Claim… (${team})` : 'Claim…';
              btn.addEventListener('click', () => openClaimModal(w, team));
            }
            card.appendChild(btn);
          });
        }

        section.appendChild(card);
      });
      wrap.appendChild(section);
    }

    async function withdrawClaim(w, team) {
      if (!confirm(`Withdraw ${team}'s waiver claim on ${displayName((BIOS[w.player] || {}).name || w.player)}?`)) return;
      try {
        await api(`/waivers/${w.txn_id}/claim?team=${team}`, { method: 'DELETE' });
        toast('Claim withdrawn.');
        await loadWaivers();
      } catch (e) {
        toast(e.message, true);
      }
    }

    function openClaimModal(w, team) {
      const playerName = displayName((BIOS[w.player] || {}).name || w.player);
      let method = '';
      let validateTimer = null, validateSeq = 0;

      const scrim = document.createElement('div');
      scrim.className = 'scrim';
      const box = document.createElement('div');
      box.className = 'offer-modal';
      scrim.appendChild(box);
      const close = () => { scrim.remove(); document.removeEventListener('keydown', onKey); };
      const onKey = e => { if (e.key === 'Escape') close(); };
      document.addEventListener('keydown', onKey);
      scrim.addEventListener('click', e => { if (e.target === scrim) close(); });
      document.body.appendChild(scrim);

      function el(tag, cls, text) {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      }

      function draw() {
        box.innerHTML = '';
        box.appendChild(el('h3', null, `${team} — claim ${playerName}`));
        box.appendChild(el('div', 'sub',
          `${team} assumes the contract as it stood — not a new deal. ` +
          `Priority against other claims goes to the worst qualifying record, ` +
          `tie-broken by head-to-head; the window resolves automatically 48 hours ` +
          `after the release.`));

        const list = el('div', 'panel');
        list.style.marginTop = '0.7rem';
        Object.keys(w.contract.salaries || {}).sort().forEach(s => {
          const tag = (w.contract.cap_holds || {})[s];
          list.appendChild(el('div', 'checkline ok',
            `${s} — ${formatSalary(w.contract.salaries[s])}${tag ? ' (' + tag + ')' : ''}`));
        });
        box.appendChild(list);

        const methodField = el('div');
        methodField.style.marginTop = '0.7rem';
        methodField.appendChild(el('label', null, 'Funding method'));
        const sel = document.createElement('select');
        CLAIM_METHODS.forEach(([v, label]) => {
          const o = document.createElement('option');
          o.value = v; o.textContent = label;
          if (v === method) o.selected = true;
          sel.appendChild(o);
        });
        sel.addEventListener('change', () => { method = sel.value; revalidate(true); });
        methodField.appendChild(sel);
        box.appendChild(methodField);

        const panel = el('div', 'panel');
        panel.id = 'claim-legality-panel';
        panel.style.marginTop = '0.7rem';
        panel.textContent = 'Choose a funding method to check legality.';
        box.appendChild(panel);

        const actions = el('div', 'modal-actions');
        const errSpan = el('div', 'spacer');
        actions.appendChild(errSpan);
        const cancel = el('button', null, 'Cancel');
        cancel.addEventListener('click', close);
        actions.appendChild(cancel);
        const go = el('button', 'primary', 'Submit claim');
        go.disabled = true;
        go.addEventListener('click', async () => {
          go.disabled = true; cancel.disabled = true; errSpan.textContent = '';
          go.textContent = 'Submitting…';
          try {
            await api(`/waivers/${w.txn_id}/claim`, {
              method: 'POST',
              body: { team, signing_method: method || null },
            });
            close();
            toast(`${team}'s waiver claim on ${playerName} is filed.`);
            await loadWaivers();
          } catch (e) {
            errSpan.textContent = (e.data && e.data.detail && e.data.detail.checks)
              ? 'Fails a rule check — see below.' : e.message;
            go.disabled = false; cancel.disabled = false; go.textContent = 'Submit claim';
          }
        });
        actions.appendChild(go);
        box.appendChild(actions);

        function revalidate(immediate) {
          clearTimeout(validateTimer);
          validateTimer = setTimeout(runValidation, immediate ? 0 : 250);
        }

        async function runValidation() {
          if (!method) {
            panel.className = 'panel';
            panel.textContent = 'Choose a funding method to check legality.';
            go.disabled = true;
            return;
          }
          const seq = ++validateSeq;
          let data;
          try {
            const res = await fetch(`/api/validate/waiver_claim?txn_id=${w.txn_id}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ team, signing_method: method }),
            });
            if (seq !== validateSeq) return;
            data = await res.json();
            if (!res.ok) throw new Error(data.detail || ('HTTP ' + res.status));
          } catch (e) {
            if (seq !== validateSeq) return;
            panel.className = 'panel bad';
            panel.textContent = 'Could not evaluate: ' + e.message;
            go.disabled = true;
            return;
          }
          if (seq !== validateSeq) return;
          const failing = (data.checks || []).filter(c => !c.passed);
          panel.className = 'panel' + (data.legal ? '' : ' bad');
          panel.innerHTML = '';
          panel.appendChild(el('div', 'fs-head', data.legal ? 'Legal as it stands' : 'Fails a rule check'));
          if (!failing.length) panel.appendChild(el('div', 'checkline ok', '✓ No constraint is triggered.'));
          failing.forEach(c => panel.appendChild(el('div', 'checkline ' + (c.level === 'error' ? 'err' : 'warn'),
            (c.level === 'error' ? '✗ ' : '⚠ ') + (c.message || c.check))));
          go.disabled = !data.legal;
        }
      }

      draw();
    }

    // ── Main ─────────────────────────────────────────────────────────────────

    (async () => {
      const statusEl = document.getElementById('status');
      try {
        const signedIn = maybeSignedIn();
        const [pool, biosJson, ovrJson, teamMapJson, me, board, ly, myOffers, capLevelsJson] = await Promise.all([
          fetch('/api/fa/pool').then(r => r.ok ? r.json() : {}),
          fetch('/api/players').then(r => r.ok ? r.json() : {}),
          fetch('/api/ovr/current').then(r => r.ok ? r.json() : {}),
          fetch('/api/team-map').then(r => r.ok ? r.json() : {}),
          signedIn ? api('/auth/me').catch(() => null) : Promise.resolve(null),
          fetch('/api/fa/board').then(r => r.ok ? r.json() : null).catch(() => null),
          fetch('/api/league-year').then(r => r.ok ? r.json() : null).catch(() => null),
          signedIn ? api('/fa/offers').catch(() => []) : Promise.resolve([]),
          fetch('/api/cap-levels').then(r => r.ok ? r.json() : {}),
        ]);

        POOL = pool;
        BIOS = biosJson;
        CAP_LEVELS = capLevelsJson || {};
        ME = me || ME;
        if (board) BOARD = board;
        LEAGUE_YEAR = (ly && ly.current_season) || null;
        MY_TEAMS = (ME.roles || []).map(r => r.toUpperCase()).filter(r => TEAM_ABBRS.has(r)).sort();
        (myOffers || []).filter(o => MY_TEAMS.includes(o.team))
          .forEach(o => { MY_OFFERS[o.team + '|' + o.player] = o; });

        // § 5.1 waiver wire. Independent of the FA pool load above — a release
        // can happen with the FA pool otherwise empty — so failures here don't
        // block the rest of the page.
        loadWaivers();
        setInterval(loadWaivers, 30000);

        // The pool (class_year, hold_type, prior_salary per player) is derived
        // server-side by GET /api/fa/pool — see nbn-api routers/free_agency.py.
        // This just joins it against bio/OVR/team data for display.
        Object.entries(pool).forEach(([slug, entry]) => {
          const bio = biosJson[slug] || {};
          const noCapHold = entry.hold_type === 'RENOUNCED' || entry.hold_type === 'UNSIGNED';

          const row = {
            slug,
            player: displayName(bio.name || slug),
            team: teamMapJson[slug] || '',
            pos: (bio.pos || []).join('/') || '—',
            ovr: String(ovrJson[slug] || ''),
            age: calcAge(bio.dob),
            salary: noCapHold ? 0 : entry.prior_salary,
            salaryFmt: noCapHold ? CAP_HOLD_LABELS[entry.hold_type] : formatSalary(entry.prior_salary),
            capType: entry.hold_type,
          };

          const yr = entry.class_year;
          if (!allRows[yr]) allRows[yr] = [];
          allRows[yr].push(row);
        });

        const years = Object.keys(allRows).sort();

        if (!years.length) {
          statusEl.textContent = 'No non-guaranteed contracts found.';
          return;
        }

        activeYear = years[0];
        buildYearChips(years);
        buildPosChips();
        statusEl.remove();
        // The ⋯ column is never added for a viewer with no team role, so a
        // public page load renders exactly the table it rendered before Phase 7.
        if (MY_TEAMS.length) COLS.push(movesColumn());
        buildTable();

        const legend = document.createElement('div');
        legend.className = 'cap-legend';
        ['PLAYER_OPT', 'TEAM_OPT', 'UFA', 'RFA', 'RENOUNCED', 'UNSIGNED'].forEach(type => {
          const item = document.createElement('span');
          item.className = 'cap-legend-item';
          const swatch = document.createElement('span');
          swatch.className = 'cap-swatch';
          swatch.style.background = CAP_SWATCH_COLORS[type];
          item.appendChild(swatch);
          item.appendChild(document.createTextNode(
            { PLAYER_OPT: 'Player Option', TEAM_OPT: 'Team Option', UFA: 'UFA Hold', RFA: 'RFA Hold', NON_GTD: 'Non-Guaranteed', RENOUNCED: 'Renounced (no cap hold)', UNSIGNED: 'Never signed' }[type]
          ));
          legend.appendChild(item);
        });
        document.getElementById('table-wrap').appendChild(legend);
      } catch (e) {
        statusEl.textContent = 'Failed to load data.';
      }
    })();
  </script>
  <script src="/nav.js"></script>
  <script src="/token-badge.js"></script>
</body>
</html>

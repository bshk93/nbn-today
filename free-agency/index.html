<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/logo.png">
  <link rel="stylesheet" href="/css/shared.css">
  <title>Free Agency — NBN</title>
  <style>

    .page { max-width: 1100px; margin: 0 auto; }

    header { margin-bottom: 1.5rem; }
    header h1 { font-size: 1.875rem; font-weight: 700; letter-spacing: -0.02em; }
    header p { color: var(--text-muted); margin-top: 0.4rem; font-size: 0.9rem; }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 0.75rem;
    }

    .chip {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text-muted);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.2rem 0.7rem;
      letter-spacing: 0.04em;
    }
    .chip:hover { border-color: var(--text-muted); color: var(--text-secondary); }
    .chip.active { background: var(--accent-dark); border-color: var(--accent); color: var(--text-on-accent); }
    .chip.year-chip.active { background: var(--market-positive-border); border-color: #10b981; color: #d1fae5; }

    .table-wrap {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow-x: auto;
    }

    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; white-space: nowrap; }

    thead th[data-active="true"] { color: var(--text-primary); }

    .sort-arrow { margin-left: 4px; opacity: 0.4; font-size: 0.65rem; }
    th[data-active="true"] .sort-arrow { opacity: 1; }

    tbody tr:nth-child(odd)  { background: var(--bg-page); }
    tbody tr:nth-child(even) { background: var(--bg-card); }
    tbody tr:hover { background: var(--bg-hover); }

    /* Window for offers is shut (GET /api/fa/board: accepting === false) —
       greyed and italicized rather than hidden, same convention as the
       disabled ⋯-menu entry it shares a reason string with. */
    tbody tr.window-closed { opacity: 0.5; font-style: italic; }
    tbody tr.window-closed:hover { opacity: 0.75; }

    td { padding: 0.55rem 1rem; color: var(--text-secondary); border-top: 1px solid var(--bg-card); }
    td.right  { text-align: right; }
    td.center { text-align: center; }
    td.muted  { color: var(--text-muted); }
    td.bold   { font-weight: 600; color: var(--text-primary); }
    td.ovr-cell { font-weight: 700; text-align: right; }
    td.salary-cell { text-align: right; }

    td.cap-ufa        { background: hsl(45,  60%, 20%); color: hsl(45,  90%, 72%); }
    td.cap-rfa        { background: hsl(25,  60%, 20%); color: hsl(25,  90%, 72%); }
    td.cap-player-opt { background: hsl(120, 50%, 17%); color: hsl(120, 75%, 68%); }
    td.cap-team-opt   { background: hsl(210, 55%, 20%); color: hsl(210, 75%, 70%); }
    td.cap-non-gtd    { color: var(--text-dim); text-decoration: line-through; }
    td.cap-renounced  { background: hsl(270, 35%, 18%); color: hsl(270, 55%, 76%); font-style: italic; }
    td.cap-unsigned   { background: hsl(200, 15%, 18%); color: hsl(200, 20%, 68%); font-style: italic; }

    .cap-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem 1.25rem;
      padding: 0.6rem 1rem 0.75rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-subtle);
    }
    .cap-legend-item { display: flex; align-items: center; gap: 0.35rem; }
    .cap-swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }

    #status { text-align: center; padding: 3rem; color: var(--text-muted); font-size: 0.9rem; }

    /* ── team-facing offers (spec § 8.1) ──────────────────────────────────────
       None of this renders for a viewer with no team role: the column is not
       added to COLS at all, so a public page load is byte-identical to before. */
    td.moves-cell { text-align: right; white-space: nowrap; }
    .move-btn {
      background: transparent; border: 1px solid var(--border); border-radius: 5px;
      color: var(--text-muted); cursor: pointer; font-family: inherit; font-size: 0.8rem;
      line-height: 1; padding: 0.15rem 0.4rem;
    }
    .move-btn:hover { border-color: var(--accent); color: var(--text-primary); }
    .offer-flag {
      font-size: 0.62rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
      border: 1px solid var(--border); border-radius: 4px; padding: 0.1rem 0.3rem;
      color: var(--text-muted); margin-right: 0.35rem;
    }
    .offer-flag.draft { border-color: var(--muted-border); color: var(--accent-light); }
    .offer-flag.submitted { border-color: var(--success); color: var(--success); }
    .offer-flag.returned { border-color: var(--gold-border); color: var(--gold); }
    .offer-flag.voided { border-color: var(--danger-border); color: var(--danger); text-decoration: line-through; }

    .move-menu {
      position: fixed; z-index: 10000; min-width: 230px; max-width: 320px;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
      padding: 0.3rem; box-shadow: 0 8px 24px var(--overlay-scrim);
      display: flex; flex-direction: column; gap: 0.1rem;
    }
    .move-menu-head {
      font-size: 0.7rem; color: var(--text-muted); padding: 0.25rem 0.45rem 0.35rem;
      border-bottom: 1px solid var(--border-subtle); margin-bottom: 0.2rem;
    }
    .move-menu button {
      background: none; border: none; border-radius: 5px; color: var(--text-secondary);
      cursor: pointer; font-family: inherit; font-size: 0.8rem; padding: 0.35rem 0.45rem; text-align: left;
    }
    .move-menu button:hover:not(:disabled) { background: var(--bg-hover); color: var(--text-primary); }
    .move-menu button:disabled { color: var(--text-dim); cursor: default; }
    .move-menu button.attn { color: var(--gold); }
    .move-menu-why { color: var(--text-dim); font-size: 0.68rem; line-height: 1.4; padding: 0 0.45rem 0.35rem; }

    .scrim { position: fixed; inset: 0; background: var(--overlay-scrim); z-index: 10001;
             display: flex; align-items: flex-start; justify-content: center; padding: 2rem 1rem; overflow-y: auto; }
    .offer-modal {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
      width: 660px; max-width: 100%; padding: 1.1rem 1.2rem 1rem;
    }
    .offer-modal h3 { font-size: 1rem; font-weight: 700; display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; }
    .offer-modal .sub { font-size: 0.76rem; color: var(--text-muted); margin-top: 0.25rem; line-height: 1.5; }
    .offer-modal .fs { border: none; padding: 0.8rem 0 0; margin: 0; }
    .offer-modal legend, .fs-head {
      font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.07em;
      color: var(--text-muted); font-weight: 700; padding: 0; margin-bottom: 0.4rem;
    }
    .offer-modal label { display: block; font-size: 0.7rem; color: var(--text-muted); font-weight: 600; margin-bottom: 0.2rem; }
    .offer-modal input, .offer-modal select, .offer-modal textarea {
      font-family: inherit; font-size: 0.8rem; background: var(--bg-page); color: var(--text-primary);
      border: 1px solid var(--border); border-radius: 6px; padding: 0.32rem 0.45rem; outline: none; width: 100%;
    }
    .offer-modal textarea { resize: vertical; min-height: 4.5rem; line-height: 1.5; }
    .grid-row { display: flex; gap: 0.6rem; flex-wrap: wrap; }
    .grid-row > div { flex: 1 1 130px; min-width: 0; }

    .yr-row { display: grid; grid-template-columns: 3.4rem minmax(0,1fr) 8.5rem; gap: 0.4rem; align-items: center; margin-bottom: 0.3rem; }
    .yr-row .yr { font-size: 0.74rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .yr-was { font-size: 0.66rem; color: var(--gold); margin-left: 0.3rem; }
    .yr-raise { font-size: 0.66rem; color: var(--text-muted); }
    .hold-row { font-size: 0.74rem; color: var(--gold-dim); padding: 0.15rem 0 0 3.8rem; }

    .gtd-steps { display: none; flex-direction: column; gap: 0.3rem; margin: 0 0 0.5rem 3.8rem; padding: 0.4rem 0.6rem; background: rgba(0,0,0,0.2); border-left: 2px solid var(--border); border-radius: 0 4px 4px 0; }
    .gtd-steps.visible { display: flex; }
    .gtd-steps-desc { font-size: 0.68rem; color: var(--text-muted); font-style: italic; margin-bottom: 0.15rem; }
    .gtd-step { display: flex; gap: 0.35rem; align-items: center; }
    .gtd-step-conn { font-size: 0.72rem; color: var(--text-muted); white-space: nowrap; flex-shrink: 0; }
    .gtd-step input { background: var(--bg-page); border: 1px solid var(--border); border-radius: 6px; color: var(--text-primary); font-size: 0.8rem; font-family: inherit; padding: 0.28rem 0.5rem; outline: none; }
    .gtd-step input:focus { border-color: var(--accent); }
    .gtd-step .gtd-step-amount { width: 9rem; }
    .gtd-step .gtd-step-date { width: 9.5rem; }
    .gtd-step .gtd-step-remove { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; padding: 0 0.2rem; line-height: 1; width: auto; }
    .gtd-step .gtd-step-remove:hover { color: var(--danger); }
    .add-step-btn { align-self: flex-start; background: none; border: 1px dashed var(--border); border-radius: 3px; color: var(--text-muted); cursor: pointer; font-size: 0.7rem; padding: 0.1rem 0.5rem; font-family: inherit; width: auto; }
    .add-step-btn:hover { color: var(--text-secondary); border-color: var(--text-muted); }

    .presets { display: flex; gap: 0.35rem; align-items: center; margin-top: 0.35rem; }
    .presets button {
      background: var(--bg-page); border: 1px solid var(--border); border-radius: 5px; color: var(--text-muted);
      font-family: inherit; font-size: 0.68rem; padding: 0.2rem 0.5rem; cursor: pointer; width: auto;
    }
    .presets button:hover { border-color: var(--accent); color: var(--text-primary); }
    .presets span { font-size: 0.68rem; color: var(--text-dim); }

    .checkbox-line { display: flex; align-items: center; gap: 0.4rem; font-size: 0.78rem; color: var(--text-secondary); margin-top: 1.1rem; }
    .checkbox-line input { width: auto; }

    .panel { border: 1px solid var(--border); border-radius: 8px; padding: 0.55rem 0.7rem; font-size: 0.76rem;
             color: var(--text-secondary); line-height: 1.5; }
    .panel.warn { border-color: var(--gold-border); background: var(--gold-bg); color: var(--gold); }
    .panel.bad { border-color: var(--danger-border); background: var(--danger-bg); color: var(--danger-light); }
    .panel.info { border-color: var(--muted-border); background: var(--accent-panel-bg); }
    .checkline { display: flex; gap: 0.35rem; align-items: baseline; font-size: 0.74rem; }
    .checkline.err { color: var(--danger); }
    .checkline.warn { color: var(--gold); }
    .checkline.ok { color: var(--text-muted); }
    .remand-note { border-left: 2px solid var(--gold-border); padding-left: 0.5rem; margin-top: 0.4rem; }
    .remand-note .meta { color: var(--text-dim); font-size: 0.67rem; }

    .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; align-items: center; margin-top: 1rem; flex-wrap: wrap; }
    .modal-actions .spacer { flex: 1; font-size: 0.72rem; color: var(--danger); }
    .modal-actions button {
      font-family: inherit; font-size: 0.78rem; font-weight: 600; padding: 0.35rem 0.75rem;
      border-radius: 6px; border: 1px solid var(--border); cursor: pointer; width: auto;
      background: transparent; color: var(--text-secondary);
    }
    .modal-actions button.primary { background: var(--accent-dark); border-color: var(--accent); color: var(--text-on-accent); }
    .modal-actions button.danger { color: var(--text-muted); }
    .modal-actions button.danger:hover { border-color: var(--danger); color: var(--danger); }
    .modal-actions button:disabled { opacity: 0.45; cursor: default; }

    .toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); z-index: 10002;
             background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
             padding: 0.5rem 0.9rem; font-size: 0.8rem; color: var(--text-secondary); }
    .toast.bad { border-color: var(--danger-border-strong); color: var(--danger-light); }

    /* § 5.1 waiver wire */
    .waivers-section { margin: 0 0 1.1rem; }
    .waivers-section h2 { font-size: 0.85rem; font-weight: 700; color: var(--text-secondary);
      text-transform: uppercase; letter-spacing: 0.03em; margin: 0 0 0.5rem; }
    .waiver-card { border: 1px solid var(--border); border-radius: 8px; padding: 0.6rem 0.85rem;
      display: flex; align-items: center; gap: 0.9rem; flex-wrap: wrap; margin-bottom: 0.5rem;
      background: var(--bg-card); }
    .waiver-card .wc-main { flex: 1; min-width: 12rem; }
    .waiver-card .wc-player { font-weight: 700; font-size: 0.88rem; }
    .waiver-card .wc-sub { font-size: 0.74rem; color: var(--text-muted); margin-top: 0.1rem; }
    .waiver-card .wc-deadline { font-size: 0.76rem; color: var(--text-muted); min-width: 8rem; text-align: right; }
    .waiver-card .wc-deadline.urgent { color: var(--danger); font-weight: 600; }
    .waiver-card .wc-status { font-size: 0.72rem; padding: 0.15rem 0.5rem; border-radius: 999px;
      border: 1px solid var(--border); color: var(--text-muted); white-space: nowrap; }
    .waiver-card .wc-status.mine { border-color: var(--accent); color: var(--accent); }
    .waiver-card .wc-status.pdc { border-color: var(--gold-border); color: var(--gold); }
    .waiver-card button { padding: 0.35rem 0.7rem; border-radius: 6px; border: 1px solid var(--border);
      background: var(--bg-hover); color: var(--text-primary); font-size: 0.76rem; cursor: pointer; white-space: nowrap; }
    .waiver-card button:hover { border-color: var(--accent); }
    .waiver-card button.danger:hover { border-color: var(--danger); color: var(--danger); }
  </style>
</head>
<body>
  <div class="page">
    <nav class="nav"></nav>
    <header>
      <h1>Free Agency</h1>
      <p>Players with non-guaranteed salary, plus renounced and never-signed free agents with no cap hold. Click any column to sort.</p>
    </header>

    <div id="waivers-wrap"></div>

    <div class="filter-row" id="year-filter"></div>
    <div class="filter-row" id="pos-filter"></div>

    <div class="table-wrap" id="table-wrap">
      <div id="status">Loading…</div>
    </div>
  </div>

  <script>
    const FILTER_DEFS = [
      { id: 'PG', pos: ['PG'] },
      { id: 'SG', pos: ['SG'] },
      { id: 'SF', pos: ['SF'] },
      { id: 'PF', pos: ['PF'] },
      { id: 'C',  pos: ['C']  },
      { id: 'G',  pos: ['PG', 'SG'] },
      { id: 'W',  pos: ['SG', 'SF'] },
      { id: 'F',  pos: ['SF', 'PF'] },
    ];

    const TEAM_NAMES = {
      ATL:'Atlanta', BKN:'Brooklyn', BOS:'Boston', CHA:'Charlotte', CHI:'Chicago',
      CLE:'Cleveland', DAL:'Dallas', DEN:'Denver', DET:'Detroit', GSW:'Golden State',
      HOU:'Houston', IND:'Indiana', LAC:'LA Clippers', LAL:'LA Lakers', MEM:'Memphis',
      MIA:'Miami', MIL:'Milwaukee', MIN:'Minnesota', NOP:'New Orleans', NYK:'New York',
      OKC:'Oklahoma City', ORL:'Orlando', PHI:'Philadelphia', PHX:'Phoenix', POR:'Portland',
      SAC:'Sacramento', SAS:'San Antonio', TOR:'Toronto', UTA:'Utah', WAS:'Washington',
    };

    function displayName(canonical) {
      if (!canonical) return '';
      const toTitle = s => s.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
      if (canonical.includes(',')) {
        const [last, first] = canonical.split(',', 2);
        return toTitle(`${first.trim()} ${last.trim()}`);
      }
      return toTitle(canonical);
    }

    function calcAge(dob) {
      if (!dob) return '';
      return String(Math.floor((Date.now() - new Date(dob).getTime()) / (365.25 * 24 * 3600 * 1000)));
    }

    function formatSalary(v) {
      if (!v) return '—';
      const n = parseFloat(String(v).replace(/[$,\s]/g, ''));
      return isNaN(n) ? v : '$' + Math.round(n).toLocaleString('en-US');
    }

    // ── State ─────────────────────────────────────────────────────────────────

    let allRows = {};        // year → row[]
    let activeYear = null;
    const activePos = new Set();
    let sortField = 'ovr';
    let sortDir = -1;
    let currentTbody = null;

    const CAP_HOLD_CSS = {
      UFA: 'cap-ufa', RFA: 'cap-rfa',
      PLAYER_OPT: 'cap-player-opt', TEAM_OPT: 'cap-team-opt', NON_GTD: 'cap-non-gtd',
      RENOUNCED: 'cap-renounced', UNSIGNED: 'cap-unsigned',
    };
    const CAP_HOLD_LABELS = {
      UFA: 'UFA', RFA: 'RFA',
      PLAYER_OPT: 'Player Opt', TEAM_OPT: 'Team Opt', NON_GTD: 'Non-Gtd',
      RENOUNCED: 'Renounced', UNSIGNED: 'Unsigned',
    };
    const CAP_SWATCH_COLORS = {
      UFA: 'hsl(45,60%,35%)', RFA: 'hsl(25,60%,35%)',
      PLAYER_OPT: 'hsl(120,50%,30%)', TEAM_OPT: 'hsl(210,55%,35%)', NON_GTD: 'var(--border)',
      RENOUNCED: 'hsl(270,45%,45%)', UNSIGNED: 'hsl(200,15%,45%)',
    };

    const COLS = [
      { key: 'team',   label: 'Team',   sortField: 'team',   cls: '',             numeric: false, defaultDir:  1 },
      { key: 'player', label: 'Player', sortField: 'player', cls: 'bold',         numeric: false, defaultDir:  1 },
      { key: 'pos',    label: 'POS',    sortField: 'pos',    cls: 'muted center', numeric: false, defaultDir:  1 },
      { key: 'ovr',    label: 'OVR',    sortField: 'ovr',    cls: 'ovr-cell',     numeric: true,  defaultDir: -1 },
      { key: 'age',    label: 'Age',    sortField: 'age',    cls: 'right',        numeric: true,  defaultDir:  1 },
      { key: 'salary', label: 'Salary', sortField: 'salary', cls: 'salary-cell',  numeric: true,  defaultDir: -1 },
    ];

    function visibleRows() {
      const rows = allRows[activeYear] || [];
      if (activePos.size === 0) return rows;
      return rows.filter(row => {
        const playerPos = new Set(row.pos === '—' ? [] : row.pos.split('/'));
        for (const id of activePos) {
          const def = FILTER_DEFS.find(d => d.id === id);
          if (def && def.pos.some(p => playerPos.has(p))) return true;
        }
        return false;
      });
    }

    function sortRows(rows) {
      return [...rows].sort((a, b) => {
        const col = COLS.find(c => c.sortField === sortField);
        let av = a[sortField], bv = b[sortField];
        if (col && col.numeric) {
          av = parseFloat(av) || 0;
          bv = parseFloat(bv) || 0;
        } else {
          av = (av || '').toLowerCase();
          bv = (bv || '').toLowerCase();
        }
        return av < bv ? -sortDir : av > bv ? sortDir : 0;
      });
    }

    function rebuildBody() {
      if (!currentTbody) return;
      currentTbody.innerHTML = '';
      const rows = sortRows(visibleRows());

      if (!rows.length) {
        const tr = currentTbody.insertRow();
        const td = tr.insertCell();
        td.colSpan = COLS.length;
        td.style.cssText = 'text-align:center;padding:3rem;color:var(--text-muted);font-size:0.9rem;';
        td.textContent = 'No non-guaranteed contracts for this year.';
        return;
      }

      const OVR_MIN = 60, OVR_MAX = 99;

      rows.forEach(row => {
        const tr = currentTbody.insertRow();
        // Every pool player has a board entry (GET /api/fa/board lists closed
        // players too, see its own comment) — `accepting: false` means the
        // window for offers on this player is shut, so the row reads as
        // inactive rather than looking like a normal open listing.
        const boardEntry = (BOARD.players || {})[row.slug];
        if (boardEntry && boardEntry.accepting === false) {
          tr.classList.add('window-closed');
          tr.title = boardEntry.reason || 'This player isn’t accepting offers right now.';
        }
        COLS.forEach(col => {
          const td = tr.insertCell();
          col.cls.split(' ').forEach(c => c && td.classList.add(c));

          if (col.key === 'team') {
            if (row.team) {
              const a = document.createElement('a');
              a.href = `/teams/${row.team}/`;
              a.textContent = row.team;
              td.appendChild(a);
            } else {
              td.textContent = '—';
              td.classList.add('muted');
            }
          } else if (col.key === 'player') {
            const a = document.createElement('a');
            a.href = `/players/?p=${row.slug}`;
            a.textContent = row.player;
            td.appendChild(a);
          } else if (col.key === 'ovr') {
            td.textContent = row.ovr || '—';
            if (row.ovr) {
              const t = Math.min(1, Math.max(0, (parseFloat(row.ovr) - OVR_MIN) / (OVR_MAX - OVR_MIN)));
              td.style.background = `hsl(${Math.round(t * 120)},55%,18%)`;
              td.style.color      = `hsl(${Math.round(t * 120)},80%,72%)`;
            }
          } else if (col.key === 'salary') {
            td.textContent = row.salaryFmt;
            const cls = CAP_HOLD_CSS[row.capType];
            if (cls) td.classList.add(cls);
          } else if (col.render) {
            col.render(row, td);
          } else {
            td.textContent = row[col.key] || '—';
          }
        });
      });
    }

    function buildTable() {
      const wrap = document.getElementById('table-wrap');
      wrap.innerHTML = '';

      const table = document.createElement('table');
      const thead = table.createTHead();
      const hr = thead.insertRow();

      COLS.forEach(col => {
        const th = document.createElement('th');
        const isActive = col.sortField === sortField;
        th.appendChild(document.createTextNode(col.label));
        if (col.cls.includes('right') || col.cls.includes('ovr-cell') || col.cls.includes('salary-cell')) th.style.textAlign = 'right';
        if (col.cls.includes('center')) th.style.textAlign = 'center';
        // The ⋯ column holds no value to sort on, so it gets no arrow and no
        // click handler rather than a header that silently does nothing.
        if (!col.sortField) { hr.appendChild(th); return; }
        const arrow = document.createElement('span');
        arrow.className = 'sort-arrow';
        arrow.textContent = isActive ? (sortDir === -1 ? '↓' : '↑') : '↓';
        th.appendChild(arrow);
        th.dataset.active = isActive;

        th.addEventListener('click', () => {
          if (sortField === col.sortField) { sortDir *= -1; }
          else { sortField = col.sortField; sortDir = col.defaultDir; }
          thead.querySelectorAll('th').forEach(t => {
            t.dataset.active = false;
            const a = t.querySelector('.sort-arrow');
            if (a) a.textContent = '↓';
          });
          th.dataset.active = true;
          th.querySelector('.sort-arrow').textContent = sortDir === -1 ? '↓' : '↑';
          rebuildBody();
        });

        hr.appendChild(th);
      });

      currentTbody = table.createTBody();
      rebuildBody();
      wrap.appendChild(table);
    }

    function buildYearChips(years) {
      const container = document.getElementById('year-filter');
      container.innerHTML = '';
      years.forEach(yr => {
        const btn = document.createElement('button');
        btn.className = 'chip year-chip' + (yr === activeYear ? ' active' : '');
        btn.textContent = yr;
        btn.addEventListener('click', () => {
          if (yr === activeYear) return;
          activeYear = yr;
          container.querySelectorAll('.year-chip').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          rebuildBody();
        });
        container.appendChild(btn);
      });
    }

    function buildPosChips() {
      const container = document.getElementById('pos-filter');
      container.innerHTML = '';
      FILTER_DEFS.forEach(def => {
        const btn = document.createElement('button');
        btn.className = 'chip';
        btn.textContent = def.id;
        btn.addEventListener('click', () => {
          if (activePos.has(def.id)) activePos.delete(def.id);
          else activePos.add(def.id);
          btn.classList.toggle('active');
          rebuildBody();

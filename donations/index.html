<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/logo.png">
  <link rel="stylesheet" href="/css/shared.css">
  <title>Donations — NBN</title>
  <!-- NBN:og -->
  <meta name="description" content="League funding tracker — who's donated, how much, and to what.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NBN">
  <meta property="og:title" content="Donations — NBN">
  <meta property="og:description" content="League funding tracker — who's donated, how much, and to what.">
  <meta property="og:url" content="https://nbn.today/donations/">
  <meta property="og:image" content="https://nbn.today/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Nothing But Net — fantasy basketball GM simulation league">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#111827">
  <!-- /NBN:og -->
  <style>
    .page { max-width: 760px; margin: 0 auto; }
    header { margin-bottom: 1.5rem; }
    header h1 { font-size: 1.875rem; font-weight: 700; letter-spacing: -0.02em; }
    header p { color: var(--text-muted); margin-top: 0.4rem; font-size: 0.9rem; }

    .controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }
    .controls label { font-size: 0.85rem; color: var(--text-muted); }
    .controls select {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      font-size: 0.875rem;
      cursor: pointer;
    }
    .controls select:focus { outline: none; border-color: var(--link); }

    .total-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
      padding: 1rem 1.25rem; display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 1.25rem;
    }
    .total-card .label { font-size: 0.85rem; color: var(--text-muted); }
    .total-card .amount { font-size: 1.5rem; font-weight: 700; color: var(--success-light, #4ade80); }

    table { width: 100%; border-collapse: collapse; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    thead th {
      text-align: left; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em;
      color: var(--text-dim); padding: 0.6rem 0.9rem; border-bottom: 1px solid var(--border);
    }
    tbody td { padding: 0.6rem 0.9rem; font-size: 0.85rem; border-bottom: 1px solid var(--border); vertical-align: top; }
    tbody tr:last-child td { border-bottom: none; }
    .team-cell a { color: inherit; font-weight: 700; }
    .donor { color: var(--text-secondary); }
    .amount-cell { font-weight: 700; text-align: right; white-space: nowrap; }
    .date-cell { color: var(--text-dim); font-size: 0.78rem; white-space: nowrap; }
    .donor a { color: inherit; }

    @media (max-width: 560px) {
      thead th:nth-child(4), tbody td:nth-child(4) { display: none; }
    }
  </style>
</head>
<body>
<script src="/nav.js"></script>

<div class="page">
  <nav class="nav"></nav>

  <header>
    <h1>Donations</h1>
  </header>

  <div class="controls">
    <label for="season-select">Season</label>
    <select id="season-select"></select>
  </div>

  <div class="total-card">
    <span class="label">Total raised</span>
    <span class="amount" id="donations-total"></span>
  </div>

  <table>
    <thead>
      <tr>
        <th>Team</th>
        <th>Donor</th>
        <th class="amount-cell">Amount</th>
        <th>Date</th>
      </tr>
    </thead>
    <tbody id="donations-body"></tbody>
  </table>
</div>

<script>
const TEAMS = {
  LAL: 'Los Angeles Lakers',
  ATL: 'Atlanta Hawks',
  UTA: 'Utah Jazz',
  DAL: 'Dallas Mavericks',
  NOP: 'New Orleans Pelicans',
  CHA: 'Charlotte Hornets',
  WAS: 'Washington Wizards',
  LAC: 'LA Clippers',
  SAS: 'San Antonio Spurs',
  CLE: 'Cleveland Cavaliers',
  NYK: 'New York Knicks',
  SAC: 'Sacramento Kings',
};

// `member` is the exact key in members.json for that donor, used to link to
// their /members/ profile. One row per donation — a joint donation (e.g. the
// Jazz's two donors) is two rows, not one combined line.
const DONATIONS = [
  { team: 'LAL', member: 'RJ', amount: 100, date: '2026-09-07' },
  { team: 'ATL', member: 'KVL', amount: 100, date: '2026-09-07' },
  { team: 'UTA', member: 'Nate', amount: 35, date: '2026-09-07' },
  { team: 'UTA', member: 'AK41', amount: 35, date: '2026-09-07' },
  { team: 'DAL', member: 'Guy Fawkes', amount: 50, date: '2026-09-07' },
  { team: 'NOP', member: 'JDDN', amount: 43, date: '2026-09-07' },
  { team: 'CHA', member: 'AllenOJ', amount: 42, date: '2026-09-07' },
  { team: 'WAS', member: 'nelson', amount: 41, date: '2026-09-07' },
  { team: 'LAC', member: 'Mega', amount: 35, date: '2026-09-07' },
  { team: 'SAS', member: 'bryn', amount: 35, date: '2026-09-07' },
  { team: 'CLE', member: 'killerdawg7', amount: 35, date: '2026-09-07' },
  { team: 'NYK', member: 'spondedphex', amount: 35, date: '2026-09-07' },
  { team: 'SAC', member: 'That1gal', amount: 20, date: '2026-09-07' },
];

function fmtDate(s) {
  const [y, m, d] = s.split('-');
  return `${parseInt(m)}/${parseInt(d)}/${y}`;
}
function fmtUsd(n) {
  return '$' + n.toLocaleString('en-US');
}

// League year rolls over July 1 (see season_clock.py) — a date in Jan-Jun
// belongs to the season that started the previous July.
function seasonForDate(s) {
  const [y, m] = s.split('-').map(Number);
  const startYear = m >= 7 ? y : y - 1;
  return `${String(startYear).slice(-2)}-${String(startYear + 1).slice(-2)}`;
}

DONATIONS.forEach(d => { d.season = seasonForDate(d.date); });

const seasons = [...new Set(DONATIONS.map(d => d.season))].sort().reverse();
const seasonSelect = document.getElementById('season-select');
seasons.forEach(s => {
  const opt = document.createElement('option');
  opt.value = s; opt.textContent = s;
  seasonSelect.appendChild(opt);
});

function render(season) {
  const rows = DONATIONS
    .filter(d => d.season === season)
    .sort((a, b) =>
      b.date.localeCompare(a.date) ||
      a.team.localeCompare(b.team) ||
      b.amount - a.amount
    );

  const body = document.getElementById('donations-body');
  body.innerHTML = '';
  rows.forEach(d => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="team-cell"><a href="/teams/${d.team.toLowerCase()}/">${TEAMS[d.team]}</a></td>
      <td class="donor"><a href="/members/${encodeURIComponent(d.member)}/">${d.member}</a></td>
      <td class="amount-cell">${fmtUsd(d.amount)}</td>
      <td class="date-cell">${fmtDate(d.date)}</td>`;
    body.appendChild(tr);
  });

  document.getElementById('donations-total').textContent =
    fmtUsd(rows.reduce((sum, d) => sum + d.amount, 0));
}

seasonSelect.value = seasons[0];
render(seasons[0]);
seasonSelect.addEventListener('change', () => render(seasonSelect.value));
</script>
<script src="/token-badge.js"></script>
</body>
</html>

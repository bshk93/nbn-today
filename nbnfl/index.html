<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="/theme-boot.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/shared.css">
  <title>NBNFL — Bengals</title>
  <!-- NBN:og -->
  <meta name="description" content="Game log and player stats for the Bengals in NBN’s sister American-football league, plus their players’ real-world NFL stats.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NBN">
  <meta property="og:title" content="NBNFL — Bengals">
  <meta property="og:description" content="Game log and player stats for the Bengals in NBN’s sister American-football league, plus their players’ real-world NFL stats.">
  <meta property="og:url" content="https://nbn.today/nbnfl/">
  <meta property="og:image" content="https://nbn.today/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Nothing But Net — fantasy basketball GM simulation league">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0d0e11">
  <link rel="icon" href="/icons/favicon.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <!-- /NBN:og -->
  <style>
    section { margin-bottom: 2.5rem; }
    .empty { color: var(--text-muted); font-size: 0.85rem; padding: 1rem 0; }

    /* ── record strip ─────────────────────────────────────────────── */
    .record-strip { display: flex; flex-wrap: wrap; gap: 1.5rem; padding: 1rem 1.25rem; }
    .record-stat .label { font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 0.2rem; }
    .record-stat .value { font-size: 1.2rem; font-weight: 700; font-variant-numeric: tabular-nums; }

    /* ── game log ─────────────────────────────────────────────────── */
    .ui-table td, .ui-table th { font-variant-numeric: tabular-nums; }
    tr.game { cursor: pointer; }
    .result-W { color: var(--success); font-weight: 700; }
    .result-L { color: var(--danger); font-weight: 700; }
    .result-T { color: var(--text-muted); font-weight: 700; }
    tr.box-row > td { background: var(--bg-subtle); padding: 0.75rem; }
    tr.box-row:hover > td { background: var(--bg-subtle) !important; }
    .box h5 { font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--text-muted); margin: 0.6rem 0 0.3rem; }
    .box h5:first-child { margin-top: 0; }
    .box-actions { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
    .season-pick { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.9rem; }

    /* ── season stats ─────────────────────────────────────────────── */
    .stat-block { margin-bottom: 1.25rem; }
    .ui-table th.grp { text-align: center; border-bottom: 1px solid var(--border-subtle); }
    .ui-table .grp-start { border-left: 1px solid var(--border-subtle); }
    .stat-block h3 { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 0.4rem; }

    /* ── entry form ───────────────────────────────────────────────── */
    #entry { border-top: 1px solid var(--border); padding-top: 1.5rem; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.7rem; margin-bottom: 1rem; }
    .form-grid label { display: flex; flex-direction: column; font-size: 0.72rem; color: var(--text-muted); gap: 0.25rem; }
    .stat-row {
      display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: flex-end;
      background: var(--bg-subtle); border: 1px solid var(--border); border-radius: 6px;
      padding: 0.6rem; margin-bottom: 0.5rem;
    }
    .stat-row label { display: flex; flex-direction: column; font-size: 0.68rem; color: var(--text-muted); gap: 0.2rem; }
    .stat-row input, .stat-row select {
      background: var(--bg-page); border: 1px solid var(--border); border-radius: 4px;
      color: var(--text-primary); padding: 0.3rem 0.4rem; font-size: 0.8rem; font-family: inherit; width: 110px;
    }
    .stat-row .player-field input { width: 160px; }
    .stat-row .stat-fields { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .stat-row .stat-fields input { width: 62px; }
    .stat-row button.remove {
      background: none; border: none; color: var(--danger); cursor: pointer; font-size: 1rem; padding: 0 0.3rem;
    }
    .form-actions { display: flex; gap: 0.6rem; margin-top: 1rem; }

    .toast {
      position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
      padding: 0.6rem 1rem; font-size: 0.85rem; z-index: 50;
    }
    .toast.bad { border-color: var(--danger-border); color: var(--danger-light); }
  </style>
</head>
<body>
  <div class="page ui-page">
    <header class="ui-header">
      <div>
        <h1 class="ui-title" id="page-title">NBNFL</h1>
      </div>
    </header>

    <div class="ui-tabs" role="tablist">
      <button class="ui-tab active" role="tab" aria-selected="true" data-tab="games">Games</button>
      <button class="ui-tab" role="tab" aria-selected="false" data-tab="irl">IRL</button>
    </div>

    <!-- The IRL tab is real-world NFL stats for this roster (irl-feed.js), kept
         apart from the sim log on purpose: its own tab, its own data. -->
    <div id="irl-panel" hidden></div>

    <div id="games-panel">
    <div class="season-pick" id="season-pick" style="display:none">
      <label class="ui-label" for="season-select" style="margin:0">Season</label>
      <select class="ui-select" id="season-select"></select>
    </div>

    <section>
      <div class="ui-card record-strip" id="record-strip"></div>
    </section>

    <section>
      <h2 class="ui-section-title">Game log</h2>
      <div id="gamelog"></div>
    </section>

    <section>
      <h2 class="ui-section-title">Season stats</h2>
      <div id="season-stats"></div>
    </section>

    <!-- Shown only to the stats role (admin passes too), the same check the
         API's write routes make. -->
    <section id="entry" hidden>
      <h2 class="ui-section-title" id="entry-title">Enter a game</h2>
      <form id="game-form" style="display:none;">
        <div class="form-grid">
          <label>Season <input class="ui-input" type="number" id="f-season" required></label>
          <label>Week <input class="ui-input" type="number" id="f-week" min="1" required></label>
          <label>Date <input class="ui-input" type="date" id="f-date" required></label>
          <label>Opponent <select class="ui-select" id="f-opp" required></select></label>
          <label>Where <select class="ui-select" id="f-where">
            <option value="home">Home</option><option value="away">Away</option>
          </select></label>
          <label><span id="f-my-score-label">Our score</span> <input class="ui-input" type="number" id="f-my-score" min="0" required></label>
          <label>Their score <input class="ui-input" type="number" id="f-opp-score" min="0" required></label>
        </div>

        <div id="stat-rows"></div>
        <datalist id="player-names"></datalist>
        <button type="button" class="ui-btn" id="add-stat-row">+ Add stat line</button>

        <div class="form-actions">
          <button type="submit" class="ui-btn ui-btn--primary" id="submit-game">Save game</button>
          <button type="button" class="ui-btn ui-btn--ghost" id="cancel-edit" style="display:none">Cancel edit</button>
        </div>
      </form>
    </section>
    </div>
  </div>

  <script>
    // One team's log (changed 2026-09-27 from a league-wide board with
    // standings and leaders). The API names the team as `my_team` and refuses
    // any game it isn't in, or any stat line that isn't its own.
    //
    // A new category also goes in the backend's routers/nbnfl.py CATEGORIES.
    // Defense is deliberately just tackles (solo/assisted), sacks, INTs and
    // forced fumbles (re-added 2026-09-27; the fuller version dropped
    // 2026-09-22 asked for data that isn't usually on hand). Total tackles is
    // shown, not entered — it is solo + assisted.
    const CATEGORY_FIELDS = {
      passing:      ['comp', 'att', 'yds', 'td', 'int', 'long'],
      rushing:      ['att', 'yds', 'td', 'fums', 'btk', 'yac', '20+', 'long'],
      receiving:    ['rec', 'yds', 'td', 'rac', 'drops', 'long'],
      defense:      ['solo', 'ast', 'sack', 'int', 'ff'],
      kicking:      ['fgm', 'fga', 'long', 'xpm', 'xpa'],
      kick_returns: ['kr', 'yds', 'long', 'td'],
      punt_returns: ['pr', 'yds', 'long', 'td'],
    };
    const CATEGORY_LABELS = {
      passing: 'Passing', rushing: 'Rushing', receiving: 'Receiving', defense: 'Defense', kicking: 'Kicking',
      kick_returns: 'Kick Returns', punt_returns: 'Punt Returns',
    };
    // Season totals: a player's best single play, not a sum.
    const MAX_FIELDS = new Set(['long']);

    // How stats are shown, as opposed to how they're entered (CATEGORY_FIELDS).
    // A table can draw from more than one entry category: rushing and
    // receiving are entered separately but shown as one row per player, with a
    // scrimmage total. `sort` puts the biggest contributor first.
    const DISPLAY_TABLES = [
      { label: 'Passing', cats: ['passing'], sort: r => val(r, 'passing', 'yds') },
      { label: 'Rushing & Receiving', cats: ['rushing', 'receiving'], sort: r => scrimmage(r) },
      { label: 'Defense', cats: ['defense'], sort: r => tackles(r) ?? 0 },
      { label: 'Kicking', cats: ['kicking'], sort: r => val(r, 'kicking', 'fgm') },
      { label: 'Kick Returns', cats: ['kick_returns'], sort: r => val(r, 'kick_returns', 'yds') },
      { label: 'Punt Returns', cats: ['punt_returns'], sort: r => val(r, 'punt_returns', 'yds') },
    ];
    // Categories that get a yards-per-game column next to their yards.
    const YPG_CATS = new Set(['passing', 'rushing', 'receiving']);

    let MY = null;              // tracked team abbr, from the API
    let teamsByAbbr = {};
    let allGames = [];
    let canEnter = false;      // stats role (or admin): may enter, edit, delete
    let editingId = null;
    const openBoxes = new Set();

    const storedToken = () => { try { return localStorage.getItem('nbn_token'); } catch { return null; } };

    let toastTimer = null;
    function toast(msg, bad) {
      document.querySelectorAll('.toast').forEach(t => t.remove());
      const e = document.createElement('div');
      e.className = 'toast' + (bad ? ' bad' : '');
      e.textContent = msg;
      document.body.appendChild(e);
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => e.remove(), 4000);
    }

    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    // A game from our side: opponent, where, our score, theirs, result.
    function view(g) {
      const home = g.home === MY;
      const us = home ? g.home_score : g.away_score;
      const them = home ? g.away_score : g.home_score;
      return {
        opp: home ? g.away : g.home, home, us, them,
        result: us > them ? 'W' : us < them ? 'L' : 'T',
      };
    }

    const fmt = v => Number.isInteger(v) ? String(v) : String(Math.round(v * 10) / 10);

    const val = (r, cat, f) => r.cats[cat]?.[f] ?? 0;
    const scrimmage = r => val(r, 'rushing', 'yds') + val(r, 'receiving', 'yds');
    function tackles(r) {
      const d = r.cats.defense;
      if (!d || (d.solo === undefined && d.ast === undefined)) return undefined;
      return (d.solo || 0) + (d.ast || 0);
    }
    // NFL passer rating, from the totals (so a season rating is the rating of
    // the season's totals, not an average of per-game ratings). Each of the
    // four parts is clamped to 0–2.375, which is what caps it at 158.3.
    function passerRating(r) {
      const p = r.cats.passing;
      if (!p || !p.att) return undefined;
      const clamp = x => Math.max(0, Math.min(2.375, x));
      const a = clamp(((p.comp || 0) / p.att - 0.3) * 5);
      const b = clamp(((p.yds || 0) / p.att - 3) * 0.25);
      const c = clamp((p.td || 0) / p.att * 20);
      const d = clamp(2.375 - (p.int || 0) / p.att * 25);
      return (a + b + c + d) / 6 * 100;
    }
    const perGame = (r, v) => (v === undefined || !r.g) ? undefined : v / r.g;

    // One row per player: { player, g, cats: {category: totals} }. `g` counts
    // games with a line in any of `cats`, so a back with a rushing and a
    // receiving line in the same game has played one game, not two.
    function aggregate(games, cats) {
      const rows = new Map();
      for (const game of games) {
        const seen = new Set();
        for (const line of (game.stats || [])) {
          if (!cats.includes(line.category)) continue;
          if (!rows.has(line.player)) rows.set(line.player, { player: line.player, g: 0, cats: {} });
          const row = rows.get(line.player);
          if (!seen.has(line.player)) { seen.add(line.player); row.g += 1; }
          const tot = row.cats[line.category] ??= {};
          for (const [f, v] of Object.entries(line.stats || {})) {
            if (typeof v !== 'number') continue;
            tot[f] = tot[f] === undefined ? v : MAX_FIELDS.has(f) ? Math.max(tot[f], v) : tot[f] + v;
          }
        }
      }
      return [...rows.values()];
    }

    // Columns for a table. `season` adds games played and the per-game columns
    // a single box score has no use for.
    function columns(table, season) {
      const cols = [];
      if (season) cols.push({ label: 'G', get: r => r.g });
      const grouped = table.cats.length > 1;
      for (const cat of table.cats) {
        const group = grouped ? CATEGORY_LABELS[cat] : null;
        for (const f of CATEGORY_FIELDS[cat]) {
          cols.push({ group, label: f.toUpperCase(), get: r => r.cats[cat]?.[f] });
          if (f === 'yds' && season && YPG_CATS.has(cat)) {
            cols.push({ group, label: 'Y/G', dec: 1, get: r => perGame(r, r.cats[cat]?.yds) });
          }
          if (cat === 'defense' && f === 'ast') cols.push({ label: 'TOT', get: tackles });
        }
        if (cat === 'passing') cols.push({ label: 'RTG', dec: 1, get: passerRating });
      }
      if (table.cats.includes('rushing') && table.cats.includes('receiving')) {
        cols.push({ group: 'Scrimmage', label: 'YDS', get: scrimmage });
        if (season) cols.push({ group: 'Scrimmage', label: 'Y/G', dec: 1, get: r => perGame(r, scrimmage(r)) });
      }
      return cols;
    }

    function statTable(cols, rows) {
      const wrap = el('div', 'ui-table-wrap');
      const table = el('table', 'ui-table ui-table--dense ui-table--sticky-first');
      const thead = el('thead');
      const grouped = cols.some(c => c.group);
      // A column starting a new group gets a divider, on every row.
      cols.forEach((c, i) => { c.start = !!c.group && (i === 0 || cols[i - 1].group !== c.group); });
      const top = el('tr');
      const player = el('th', null, 'Player');
      top.appendChild(player);
      if (grouped) {
        player.rowSpan = 2;
        const sub = el('tr');
        for (let i = 0; i < cols.length; i++) {
          const c = cols[i];
          if (!c.group) {
            const th = el('th', 'num', c.label);
            th.rowSpan = 2;
            top.appendChild(th);
            continue;
          }
          let n = 1;
          while (i + n < cols.length && cols[i + n].group === c.group) n++;
          const th = el('th', 'grp grp-start', c.group);
          th.colSpan = n;
          top.appendChild(th);
          for (let k = 0; k < n; k++) sub.appendChild(el('th', 'num' + (cols[i + k].start ? ' grp-start' : ''), cols[i + k].label));
          i += n - 1;
        }
        thead.append(top, sub);
      } else {
        for (const c of cols) top.appendChild(el('th', 'num', c.label));
        thead.appendChild(top);
      }
      table.appendChild(thead);
      const tbody = el('tbody');
      for (const r of rows) {
        const tr = el('tr');
        tr.appendChild(el('td', 'strong', r.player));
        for (const c of cols) {
          const v = c.get(r);
          const text = v === undefined ? '–' : c.dec ? v.toFixed(c.dec) : fmt(v);
          tr.appendChild(el('td', 'num' + (c.start ? ' grp-start' : ''), text));
        }
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      wrap.appendChild(table);
      return wrap;
    }

    // ── record ─────────────────────────────────────────────────────
    function renderRecord(games) {
      const strip = document.getElementById('record-strip');
      strip.innerHTML = '';
      let w = 0, l = 0, t = 0, pf = 0, pa = 0;
      for (const g of games) {
        const v = view(g);
        pf += v.us; pa += v.them;
        if (v.result === 'W') w++; else if (v.result === 'L') l++; else t++;
      }
      const diff = pf - pa;
      for (const [label, value] of [['W', w], ['L', l], ['T', t], ['PF', pf], ['PA', pa], ['Diff', diff > 0 ? `+${diff}` : diff]]) {
        const stat = el('div', 'record-stat');
        stat.appendChild(el('div', 'label', label));
        stat.appendChild(el('div', 'value', String(value)));
        strip.appendChild(stat);
      }
    }

    // ── game log ───────────────────────────────────────────────────
    function boxScore(g) {
      const box = el('div', 'box');
      let any = false;
      for (const t of DISPLAY_TABLES) {
        const rows = aggregate([g], t.cats).sort((a, b) => t.sort(b) - t.sort(a));
        if (!rows.length) continue;
        any = true;
        box.appendChild(el('h5', null, t.label));
        box.appendChild(statTable(columns(t, false), rows));
      }
      if (!any) box.appendChild(el('div', 'empty', 'No stat lines for this game.'));
      if (canEnter) {
        const actions = el('div', 'box-actions');
        const edit = el('button', 'ui-btn ui-btn--sm', 'Edit');
        edit.type = 'button';
        edit.onclick = ev => { ev.stopPropagation(); startEdit(g); };
        const del = el('button', 'ui-btn ui-btn--sm ui-btn--danger', 'Delete');
        del.type = 'button';
        del.onclick = ev => { ev.stopPropagation(); deleteGame(g); };
        actions.append(edit, del);
        box.appendChild(actions);
      }
      return box;
    }

    function renderGamelog(games) {
      const root = document.getElementById('gamelog');
      root.innerHTML = '';
      if (!games.length) { root.appendChild(el('div', 'empty', 'No games entered yet.')); return; }
      const wrap = el('div', 'ui-table-wrap');
      const table = el('table', 'ui-table');
      table.innerHTML = '<thead><tr><th class="num">Wk</th><th>Date</th><th>Opponent</th><th class="center">Result</th><th class="num">Score</th></tr></thead>';
      const tbody = el('tbody');
      for (const g of games) {
        const v = view(g);
        const tr = el('tr', 'game');
        tr.appendChild(el('td', 'num', String(g.week)));
        tr.appendChild(el('td', 'muted', g.date));
        const opp = teamsByAbbr[v.opp];
        tr.appendChild(el('td', 'strong', `${v.home ? 'vs' : '@'} ${v.opp}${opp ? ' ' + opp.name : ''}`));
        tr.appendChild(el('td', `center result-${v.result}`, v.result));
        tr.appendChild(el('td', 'num', `${v.us}–${v.them}`));
        tbody.appendChild(tr);

        const boxTr = el('tr', 'box-row');
        const boxTd = el('td');
        boxTd.colSpan = 5;
        boxTd.appendChild(boxScore(g));
        boxTr.appendChild(boxTd);
        boxTr.style.display = openBoxes.has(g.id) ? '' : 'none';
        tbody.appendChild(boxTr);

        tr.onclick = () => {
          const open = boxTr.style.display === 'none';
          boxTr.style.display = open ? '' : 'none';
          if (open) openBoxes.add(g.id); else openBoxes.delete(g.id);
        };
      }
      table.appendChild(tbody);
      wrap.appendChild(table);
      root.appendChild(wrap);
    }

    // ── season stats ───────────────────────────────────────────────
    function renderSeasonStats(games) {
      const root = document.getElementById('season-stats');
      root.innerHTML = '';
      let any = false;
      for (const t of DISPLAY_TABLES) {
        const rows = aggregate(games, t.cats).sort((a, b) => t.sort(b) - t.sort(a));
        if (!rows.length) continue;
        any = true;
        const block = el('div', 'stat-block');
        block.appendChild(el('h3', null, t.label));
        block.appendChild(statTable(columns(t, true), rows));
        root.appendChild(block);
      }
      if (!any) root.appendChild(el('div', 'empty', 'No stats entered yet.'));
    }

    // ── season picker ──────────────────────────────────────────────
    function seasons() { return [...new Set(allGames.map(g => g.season))].sort((a, b) => b - a); }

    // `want` picks a season (after a save); otherwise keep whatever is selected.
    function render(want) {
      const sel = document.getElementById('season-select');
      const list = seasons();
      const current = want ?? (sel.value ? parseInt(sel.value, 10) : list[0]);
      sel.innerHTML = '';
      for (const s of list) {
        const opt = el('option', null, String(s));
        opt.value = s;
        sel.appendChild(opt);
      }
      sel.value = list.includes(current) ? current : list[0];
      document.getElementById('season-pick').style.display = list.length > 1 ? '' : 'none';
      const season = parseInt(sel.value, 10);
      const games = allGames.filter(g => g.season === season);
      renderRecord(games);
      renderGamelog(games);
      renderSeasonStats(games);
      refreshPlayerNames();
    }

    function refreshPlayerNames() {
      const dl = document.getElementById('player-names');
      dl.innerHTML = '';
      const names = new Set(allGames.flatMap(g => (g.stats || []).map(s => s.player)));
      for (const n of [...names].sort()) { const o = el('option'); o.value = n; dl.appendChild(o); }
    }

    // ── entry form ─────────────────────────────────────────────────
    function addStatRow(line) {
      const row = el('div', 'stat-row');

      const playerLabel = el('label', 'player-field', 'Player');
      const playerInput = document.createElement('input');
      playerInput.type = 'text';
      playerInput.setAttribute('list', 'player-names');
      playerInput.value = line?.player || '';
      playerLabel.appendChild(playerInput);
      row.appendChild(playerLabel);

      const catLabel = el('label', null, 'Category');
      const catSel = document.createElement('select');
      for (const cat of Object.keys(CATEGORY_FIELDS)) {
        const opt = el('option', null, CATEGORY_LABELS[cat]);
        opt.value = cat;
        catSel.appendChild(opt);
      }
      if (line?.category) catSel.value = line.category;
      catLabel.appendChild(catSel);
      row.appendChild(catLabel);

      const statFields = el('div', 'stat-fields');
      row.appendChild(statFields);

      function rebuildStatFields(values) {
        statFields.innerHTML = '';
        for (const field of CATEGORY_FIELDS[catSel.value]) {
          const label = el('label', null, field);
          const input = document.createElement('input');
          input.type = 'number';
          input.step = 'any';
          input.dataset.field = field;
          if (values && values[field] !== undefined) input.value = values[field];
          label.appendChild(input);
          statFields.appendChild(label);
        }
      }
      catSel.onchange = () => rebuildStatFields();
      rebuildStatFields(line?.stats);

      const removeBtn = el('button', 'remove', '×');
      removeBtn.type = 'button';
      removeBtn.title = 'Remove this stat line';
      removeBtn.onclick = () => row.remove();
      row.appendChild(removeBtn);

      row._playerInput = playerInput;
      row._catSel = catSel;
      row._statFields = statFields;
      document.getElementById('stat-rows').appendChild(row);
    }

    function collectStatLines() {
      const lines = [];
      for (const row of document.querySelectorAll('.stat-row')) {
        const player = row._playerInput.value.trim();
        if (!player) continue;
        const stats = {};
        for (const input of row._statFields.querySelectorAll('input')) {
          const v = parseFloat(input.value);
          if (!isNaN(v)) stats[input.dataset.field] = v;
        }
        lines.push({ player, team: MY, category: row._catSel.value, stats });
      }
      return lines;
    }

    function resetForm() {
      editingId = null;
      document.getElementById('game-form').reset();
      document.getElementById('stat-rows').innerHTML = '';
      document.getElementById('f-season').value = seasons()[0] || new Date().getFullYear();
      document.getElementById('entry-title').textContent = 'Enter a game';
      document.getElementById('submit-game').textContent = 'Save game';
      document.getElementById('cancel-edit').style.display = 'none';
    }

    function startEdit(g) {
      const v = view(g);
      resetForm();
      editingId = g.id;
      document.getElementById('f-season').value = g.season;
      document.getElementById('f-week').value = g.week;
      document.getElementById('f-date').value = g.date;
      document.getElementById('f-opp').value = v.opp;
      document.getElementById('f-where').value = v.home ? 'home' : 'away';
      document.getElementById('f-my-score').value = v.us;
      document.getElementById('f-opp-score').value = v.them;
      for (const line of (g.stats || [])) addStatRow(line);
      document.getElementById('entry-title').textContent = `Edit week ${g.week} — ${v.home ? 'vs' : '@'} ${v.opp}`;
      document.getElementById('submit-game').textContent = 'Save changes';
      document.getElementById('cancel-edit').style.display = '';
      document.getElementById('entry').scrollIntoView({ behavior: 'smooth' });
    }

    async function api(method, path, body) {
      const r = await fetch(path, {
        method,
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${storedToken()}` },
        body: body ? JSON.stringify(body) : undefined,
      });
      if (!r.ok) {
        const detail = await r.json().then(j => j.detail).catch(() => null);
        throw new Error(typeof detail === 'string' ? detail : `HTTP ${r.status}`);
      }
      return r.json();
    }

    async function deleteGame(g) {
      const v = view(g);
      if (!confirm(`Delete week ${g.week} ${v.home ? 'vs' : '@'} ${v.opp} (${v.us}–${v.them})? This can't be undone.`)) return;
      try {
        await api('DELETE', `/api/nbnfl/games/${g.id}`);
        if (editingId === g.id) resetForm();
        toast('Game deleted');
        await loadGames();
      } catch (err) {
        toast(`Could not delete that game: ${err.message}`, true);
      }
    }

    async function submitGame(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-game');
      btn.disabled = true;
      const home = document.getElementById('f-where').value === 'home';
      const opp = document.getElementById('f-opp').value;
      const us = parseInt(document.getElementById('f-my-score').value, 10);
      const them = parseInt(document.getElementById('f-opp-score').value, 10);
      const body = {
        season: parseInt(document.getElementById('f-season').value, 10),
        week: parseInt(document.getElementById('f-week').value, 10),
        date: document.getElementById('f-date').value,
        home: home ? MY : opp,
        away: home ? opp : MY,
        home_score: home ? us : them,
        away_score: home ? them : us,
        stats: collectStatLines(),
      };
      try {
        const saved = editingId
          ? await api('PUT', `/api/nbnfl/games/${editingId}`, body)
          : await api('POST', '/api/nbnfl/games', body);
        toast(`${editingId ? 'Updated' : 'Saved'}: week ${body.week} ${home ? 'vs' : '@'} ${opp}, ${us}–${them}`);
        openBoxes.add(saved.id);
        resetForm();
        await loadGames(body.season);
      } catch (err) {
        toast(`Could not save that game: ${err.message}`, true);
      } finally {
        btn.disabled = false;
      }
    }

    async function setupEntryForm() {
      const token = storedToken();
      let me = null;
      if (token) {
        try {
          me = await fetch('/api/auth/me', { headers: { Authorization: `Bearer ${token}` } }).then(r => r.ok ? r.json() : null);
        } catch { me = null; }
      }
      const roles = (me && me.roles) || [];
      if (!roles.includes('stats') && !roles.includes('admin')) return;
      canEnter = true;
      document.getElementById('entry').hidden = false;
      document.getElementById('game-form').style.display = '';
      const oppSel = document.getElementById('f-opp');
      for (const t of Object.values(teamsByAbbr)) {
        if (t.abbr === MY) continue;
        const opt = el('option', null, `${t.abbr} — ${t.name}`);
        opt.value = t.abbr;
        oppSel.appendChild(opt);
      }
      document.getElementById('add-stat-row').onclick = () => addStatRow();
      document.getElementById('cancel-edit').onclick = resetForm;
      document.getElementById('game-form').onsubmit = submitGame;
      resetForm();
      render();  // re-render so the box scores pick up Edit/Delete
    }

    async function loadGames(season) {
      allGames = await fetch('/api/nbnfl/games').then(r => r.json());
      render(season);
    }

    (async function init() {
      const teamsData = await fetch('/api/nbnfl/teams').then(r => r.json());
      MY = teamsData.my_team;
      teamsByAbbr = Object.fromEntries(teamsData.teams.map(t => [t.abbr, t]));
      const mine = teamsByAbbr[MY];
      document.getElementById('page-title').textContent = `NBNFL — ${mine ? mine.name : MY}`;
      document.getElementById('season-select').onchange = () => render();
      setupTabs();
      await loadGames();
      await setupEntryForm();
    })();

    // Games | IRL. The IRL feed is mounted the first time its tab opens, so a
    // visit to the sim log never fetches it. The tab lives in the hash (#irl).
    function setupTabs() {
      let irlMounted = false;
      function show(tab) {
        document.querySelectorAll('.ui-tab[data-tab]').forEach(b => {
          const on = b.dataset.tab === tab;
          b.classList.toggle('active', on);
          b.setAttribute('aria-selected', on);
        });
        document.getElementById('games-panel').hidden = tab !== 'games';
        document.getElementById('irl-panel').hidden = tab !== 'irl';
        if (tab === 'irl' && !irlMounted) {
          irlMounted = true;
          IrlFeed.mount(document.getElementById('irl-panel'), { sport: 'nfl', roster: MY });
        }
      }
      document.querySelectorAll('.ui-tab[data-tab]').forEach(b => b.addEventListener('click', () => {
        history.replaceState(null, '', b.dataset.tab === 'games' ? location.pathname : '#' + b.dataset.tab);
        show(b.dataset.tab);
      }));
      show(location.hash === '#irl' ? 'irl' : 'games');
    }
  </script>
  <script src="/irl-feed.js"></script>

  <script src="/nav.js"></script>
  <script src="/token-badge.js"></script>
</body>
</html>

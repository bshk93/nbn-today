<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/logo.png">
  <link rel="stylesheet" href="/css/shared.css">
  <title>NBNFL</title>
  <!-- NBN:og -->
  <meta name="description" content="Scores, standings, and stat leaders for NBN’s sister American-football league.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NBN">
  <meta property="og:title" content="NBNFL">
  <meta property="og:description" content="Scores, standings, and stat leaders for NBN’s sister American-football league.">
  <meta property="og:url" content="https://nbn.today/nbnfl/">
  <meta property="og:image" content="https://nbn.today/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Nothing But Net — fantasy basketball GM simulation league">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#111827">
  <!-- /NBN:og -->
  <style>
                
    section { margin-bottom: 2.5rem; }
    section h2 { font-size: 1.15rem; font-weight: 600; margin-bottom: 0.9rem; }

    .empty { color: var(--text-muted); font-size: 0.85rem; padding: 1rem 0; }

    /* ── standings ────────────────────────────────────────────────── */
    .conferences { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    @media (max-width: 760px) { .conferences { grid-template-columns: 1fr; } }
    .conference h3 { font-size: 0.95rem; font-weight: 700; margin-bottom: 0.6rem; color: var(--text-secondary); }
    .division { margin-bottom: 1rem; }
    .division h4 {
      font-size: 0.7rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 0.35rem;
    }
    table.standings { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    table.standings th, table.standings td { padding: 0.35rem 0.5rem; text-align: right; }
    table.standings th:first-child, table.standings td:first-child { text-align: left; }
    table.standings th { color: var(--text-muted); font-weight: 600; font-size: 0.68rem; text-transform: uppercase; }
    table.standings tbody tr { border-bottom: 1px solid var(--border); }
    table.standings td.team { font-weight: 600; }

    /* ── scores ───────────────────────────────────────────────────── */
    .week-group { margin-bottom: 1.1rem; }
    .week-group h4 {
      font-size: 0.7rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 0.4rem;
    }
    .game-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--border); font-size: 0.85rem;
    }
    .game-row .matchup { display: flex; align-items: center; gap: 0.5rem; }
    .game-row .score { font-weight: 700; font-variant-numeric: tabular-nums; }
    .game-row .win { color: var(--success); }

    /* ── leaders ──────────────────────────────────────────────────── */
    .leader-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1rem; }
    .leader-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 0.9rem;
    }
    .leader-card h4 {
      font-size: 0.7rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 0.6rem;
    }
    .leader-row { display: flex; justify-content: space-between; font-size: 0.82rem; padding: 0.2rem 0; }
    .leader-row .name { color: var(--text-primary); }
    .leader-row .team { color: var(--text-muted); font-size: 0.75rem; margin-left: 0.3rem; }
    .leader-row .value { font-weight: 700; font-variant-numeric: tabular-nums; }

    /* ── entry form ───────────────────────────────────────────────── */
    #entry { border-top: 1px solid var(--border); padding-top: 1.5rem; }
    #entry-note { color: var(--text-muted); font-size: 0.85rem; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.7rem; margin-bottom: 1rem; }
    .form-grid label { display: flex; flex-direction: column; font-size: 0.72rem; color: var(--text-muted); gap: 0.25rem; }
    .form-grid input, .form-grid select {
      background: var(--bg-subtle); border: 1px solid var(--border); border-radius: 5px;
      color: var(--text-primary); padding: 0.4rem 0.5rem; font-size: 0.85rem; font-family: inherit;
    }
    .stat-row {
      display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: flex-end;
      background: var(--bg-subtle); border: 1px solid var(--border); border-radius: 6px;
      padding: 0.6rem; margin-bottom: 0.5rem;
    }
    .stat-row label { display: flex; flex-direction: column; font-size: 0.68rem; color: var(--text-muted); gap: 0.2rem; }
    .stat-row input, .stat-row select {
      background: var(--bg-page); border: 1px solid var(--border); border-radius: 4px;
      color: var(--text-primary); padding: 0.3rem 0.4rem; font-size: 0.8rem; font-family: inherit; width: 90px;
    }
    .stat-row .player-field input { width: 160px; }
    .stat-row .stat-fields { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .stat-row .stat-fields input { width: 62px; }
    .stat-row button.remove {
      background: none; border: none; color: var(--danger); cursor: pointer; font-size: 1rem; padding: 0 0.3rem;
    }
    button.btn {
      background: var(--accent); color: var(--text-on-accent); border: none; border-radius: 6px;
      padding: 0.5rem 1rem; font-size: 0.85rem; font-weight: 600; cursor: pointer; font-family: inherit;
    }
    button.btn:hover { background: var(--accent-dark); }
    button.btn.secondary { background: var(--bg-subtle); color: var(--text-primary); border: 1px solid var(--border); }
    .form-actions { display: flex; gap: 0.6rem; margin-top: 1rem; }

    .toast {
      position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
      padding: 0.6rem 1rem; font-size: 0.85rem; z-index: 50;
    }
    .toast.bad { border-color: var(--danger-border); color: var(--danger-light); }
  </style>
</head>
<body>
  <div class="page ui-page">
    <header class="ui-header">
      <div>
        <h1 class="ui-title">NBNFL</h1>
        <p class="ui-subtitle">Scores, standings, and stat leaders for NBN's sister American-football league. Regular season only — playoffs aren't modeled yet.</p>
      </div>
    </header>

    <section id="standings-section">
      <h2>Standings</h2>
      <div id="standings" class="conferences"></div>
    </section>

    <section id="scores-section">
      <h2>Scores</h2>
      <div id="scores"></div>
    </section>

    <section id="leaders-section">
      <h2>Leaders</h2>
      <div id="leaders" class="leader-grid"></div>
    </section>

    <section id="entry">
      <h2>Enter a game</h2>
      <div id="entry-note"></div>
      <form id="game-form" style="display:none;">
        <div class="form-grid">
          <label>Season <input type="number" id="f-season" required></label>
          <label>Week <input type="number" id="f-week" min="1" required></label>
          <label>Date <input type="date" id="f-date" required></label>
          <label>Away team <select id="f-away" required></select></label>
          <label>Home team <select id="f-home" required></select></label>
          <label>Away score <input type="number" id="f-away-score" min="0" required></label>
          <label>Home score <input type="number" id="f-home-score" min="0" required></label>
        </div>

        <div id="stat-rows"></div>
        <button type="button" class="btn secondary" id="add-stat-row">+ Add stat line</button>

        <div class="form-actions">
          <button type="submit" class="btn" id="submit-game">Save game</button>
        </div>
      </form>
    </section>
  </div>

  <script>
    // No "defense" category — dropped 2026-09-22, we don't consistently have
    // that data at entry time. Re-add it (and its PRIMARY_STAT/PRIMARY_LABEL
    // entries, plus the backend's routers/nbnfl.py PRIMARY_STAT) if that changes.
    const CATEGORY_FIELDS = {
      passing:      ['comp', 'att', 'yds', 'td', 'int', 'long'],
      rushing:      ['att', 'yds', 'td', 'fums', 'btk', 'yac', '20+', 'long'],
      receiving:    ['rec', 'yds', 'td', 'rac', 'drops', 'long'],
      kicking:      ['fgm', 'fga', 'long', 'xpm', 'xpa'],
      kick_returns: ['kr', 'yds', 'long', 'td'],
      punt_returns: ['pr', 'yds', 'long', 'td'],
    };
    const CATEGORY_LABELS = {
      passing: 'Passing', rushing: 'Rushing', receiving: 'Receiving', kicking: 'Kicking',
      kick_returns: 'Kick Returns', punt_returns: 'Punt Returns',
    };

    let teams = [];
    let teamsByAbbr = {};
    const storedToken = () => { try { return localStorage.getItem('nbn_token'); } catch { return null; } };

    let toastTimer = null;
    function toast(msg, bad) {
      document.querySelectorAll('.toast').forEach(t => t.remove());
      const el = document.createElement('div');
      el.className = 'toast' + (bad ? ' bad' : '');
      el.textContent = msg;
      document.body.appendChild(el);
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.remove(), 4000);
    }

    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    // ── standings ──────────────────────────────────────────────────
    // Teams with a real page under /nbnfl/{ABBR}/ — add an abbr here as more
    // team pages get built (nbnfl/team.js itself needs no change per team).
    const TEAM_PAGES = new Set(['CIN']);

    function renderStandings(data) {
      const root = document.getElementById('standings');
      root.innerHTML = '';
      const conferences = Object.keys(data).sort();
      if (!conferences.length) { root.appendChild(el('div', 'empty', 'No games entered yet.')); return; }
      for (const conf of conferences) {
        const confEl = el('div', 'conference');
        confEl.appendChild(el('h3', null, conf));
        const divisions = Object.keys(data[conf]).sort();
        for (const div of divisions) {
          const rows = data[conf][div];
          const divEl = el('div', 'division');
          divEl.appendChild(el('h4', null, div));
          const table = document.createElement('table'); table.className = 'ui-table';
          table.className = 'standings';
          const thead = document.createElement('thead');
          thead.innerHTML = '<tr><th>Team</th><th>W</th><th>L</th><th>T</th><th>PF</th><th>PA</th><th>Diff</th></tr>';
          table.appendChild(thead);
          const tbody = document.createElement('tbody');
          for (const r of rows) {
            const tr = document.createElement('tr');
            const diff = r.diff > 0 ? `+${r.diff}` : r.diff;
            const teamCell = TEAM_PAGES.has(r.abbr)
              ? `<a href="/nbnfl/${r.abbr}/">${r.abbr} ${r.name}</a>`
              : `${r.abbr} ${r.name}`;
            tr.innerHTML = `<td class="team">${teamCell}</td><td>${r.wins}</td><td>${r.losses}</td>` +
              `<td>${r.ties}</td><td>${r.pf}</td><td>${r.pa}</td><td>${diff}</td>`;
            tbody.appendChild(tr);
          }
          table.appendChild(tbody);
          divEl.appendChild(table);
          confEl.appendChild(divEl);
        }
        root.appendChild(confEl);
      }
    }

    // ── scores ─────────────────────────────────────────────────────
    function renderScores(games) {
      const root = document.getElementById('scores');
      root.innerHTML = '';
      if (!games.length) { root.appendChild(el('div', 'empty', 'No games entered yet.')); return; }
      const byWeek = new Map();
      for (const g of games) {
        const key = `${g.season} — Week ${g.week}`;
        if (!byWeek.has(key)) byWeek.set(key, []);
        byWeek.get(key).push(g);
      }
      // list() preserved insertion order, and list_games() already sorts by
      // (season, week, date), so weeks arrive in order without a re-sort here.
      for (const [label, weekGames] of byWeek) {
        const group = el('div', 'week-group');
        group.appendChild(el('h4', null, label));
        for (const g of weekGames) {
          const row = el('div', 'game-row');
          const matchup = el('span', 'matchup');
          const awayWin = g.away_score > g.home_score;
          const homeWin = g.home_score > g.away_score;
          matchup.innerHTML =
            `<span class="${awayWin ? 'win' : ''}">${g.away}</span> @ <span class="${homeWin ? 'win' : ''}">${g.home}</span>`;
          row.appendChild(matchup);
          row.appendChild(el('span', 'score', `${g.away_score} – ${g.home_score}`));
          group.appendChild(row);
        }
        root.appendChild(group);
      }
    }

    // ── leaders ────────────────────────────────────────────────────
    const PRIMARY_LABEL = {
      passing: 'pass yds', rushing: 'rush yds', receiving: 'rec yds', kicking: 'FG made',
      kick_returns: 'return yds', punt_returns: 'return yds',
    };
    function renderLeaders(data) {
      const root = document.getElementById('leaders');
      root.innerHTML = '';
      for (const category of Object.keys(CATEGORY_FIELDS)) {
        const rows = data[category] || [];
        const card = el('div', 'leader-card');
        card.appendChild(el('h4', null, `${CATEGORY_LABELS[category]} — ${PRIMARY_LABEL[category]}`));
        if (!rows.length) {
          card.appendChild(el('div', 'empty', 'No data yet.'));
        } else {
          for (const r of rows) {
            const row = el('div', 'leader-row');
            const name = el('span', null, r.player);
            name.appendChild(el('span', 'team', r.team));
            row.appendChild(name);
            row.appendChild(el('span', 'value', r.value));
            card.appendChild(row);
          }
        }
        root.appendChild(card);
      }
    }

    // ── entry form ─────────────────────────────────────────────────
    function populateTeamSelect(sel) {
      sel.innerHTML = '';
      for (const t of teams) {
        const opt = document.createElement('option');
        opt.value = t.abbr;
        opt.textContent = `${t.abbr} — ${t.name}`;
        sel.appendChild(opt);
      }
    }

    function addStatRow() {
      const row = el('div', 'stat-row');

      const playerLabel = el('label', 'player-field', 'Player');
      const playerInput = document.createElement('input');
      playerInput.type = 'text';
      playerInput.required = true;
      playerLabel.appendChild(playerInput);
      row.appendChild(playerLabel);

      const teamLabel = el('label', null, 'Team');
      const teamSel = document.createElement('select');
      const homeAbbr = document.getElementById('f-home').value;
      const awayAbbr = document.getElementById('f-away').value;
      for (const abbr of [awayAbbr, homeAbbr]) {
        if (!abbr) continue;
        const opt = document.createElement('option');
        opt.value = abbr;
        opt.textContent = abbr;
        teamSel.appendChild(opt);
      }
      teamLabel.appendChild(teamSel);
      row.appendChild(teamLabel);

      const catLabel = el('label', null, 'Category');
      const catSel = document.createElement('select');
      for (const cat of Object.keys(CATEGORY_FIELDS)) {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = CATEGORY_LABELS[cat];
        catSel.appendChild(opt);
      }
      catLabel.appendChild(catSel);
      row.appendChild(catLabel);

      const statFields = el('div', 'stat-fields');
      row.appendChild(statFields);

      function rebuildStatFields() {
        statFields.innerHTML = '';
        for (const field of CATEGORY_FIELDS[catSel.value]) {
          const label = el('label', null, field);
          const input = document.createElement('input');
          input.type = 'number';
          input.step = 'any';
          input.dataset.field = field;
          label.appendChild(input);
          statFields.appendChild(label);
        }
      }
      catSel.onchange = rebuildStatFields;
      rebuildStatFields();

      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'remove';
      removeBtn.textContent = '×';
      removeBtn.title = 'Remove this stat line';
      removeBtn.onclick = () => row.remove();
      row.appendChild(removeBtn);

      row._playerInput = playerInput;
      row._teamSel = teamSel;
      row._catSel = catSel;
      row._statFields = statFields;
      document.getElementById('stat-rows').appendChild(row);
    }

    function collectStatLines() {
      const lines = [];
      for (const row of document.querySelectorAll('.stat-row')) {
        const player = row._playerInput.value.trim();
        if (!player) continue;
        const stats = {};
        for (const input of row._statFields.querySelectorAll('input')) {
          const v = parseFloat(input.value);
          if (!isNaN(v)) stats[input.dataset.field] = v;
        }
        lines.push({ player, team: row._teamSel.value, category: row._catSel.value, stats });
      }
      return lines;
    }

    async function submitGame(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-game');
      btn.disabled = true;
      const body = {
        season: parseInt(document.getElementById('f-season').value, 10),
        week: parseInt(document.getElementById('f-week').value, 10),
        date: document.getElementById('f-date').value,
        home: document.getElementById('f-home').value,
        away: document.getElementById('f-away').value,
        home_score: parseInt(document.getElementById('f-home-score').value, 10),
        away_score: parseInt(document.getElementById('f-away-score').value, 10),
        stats: collectStatLines(),
      };
      try {
        const r = await fetch('/api/nbnfl/games', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${storedToken()}` },
          body: JSON.stringify(body),
        });
        if (!r.ok) {
          const detail = await r.json().then(j => j.detail).catch(() => null);
          throw new Error(detail || `HTTP ${r.status}`);
        }
        toast(`Saved: ${body.away} ${body.away_score} – ${body.home_score} ${body.home}`);
        document.getElementById('game-form').reset();
        document.getElementById('stat-rows').innerHTML = '';
        await loadDashboard();
      } catch (err) {
        toast(`Could not save that game: ${err.message}`, true);
      } finally {
        btn.disabled = false;
      }
    }

    async function setupEntryForm() {
      const note = document.getElementById('entry-note');
      const token = storedToken();
      if (!token) {
        note.textContent = 'Sign in with an admin account to enter a game.';
        return;
      }
      let me;
      try {
        me = await fetch('/api/auth/me', { headers: { Authorization: `Bearer ${token}` } }).then(r => r.ok ? r.json() : null);
      } catch { me = null; }
      if (!me || !(me.roles || []).includes('admin')) {
        note.textContent = 'Sign in with an admin account to enter a game.';
        return;
      }
      note.textContent = '';
      const form = document.getElementById('game-form');
      form.style.display = '';
      populateTeamSelect(document.getElementById('f-home'));
      populateTeamSelect(document.getElementById('f-away'));
      document.getElementById('f-season').value = new Date().getFullYear();
      document.getElementById('add-stat-row').onclick = addStatRow;
      form.onsubmit = submitGame;
    }

    async function loadDashboard() {
      const [standingsData, gamesData, leadersData] = await Promise.all([
        fetch('/api/nbnfl/standings').then(r => r.json()),
        fetch('/api/nbnfl/games').then(r => r.json()),
        fetch('/api/nbnfl/leaders').then(r => r.json()),
      ]);
      renderStandings(standingsData);
      renderScores(gamesData);
      renderLeaders(leadersData);
    }

    (async function init() {
      const teamsData = await fetch('/api/nbnfl/teams').then(r => r.json());
      teams = teamsData.teams;
      teamsByAbbr = Object.fromEntries(teams.map(t => [t.abbr, t]));
      await loadDashboard();
      await setupEntryForm();
    })();
  </script>

  <script src="/nav.js"></script>
  <script src="/token-badge.js"></script>
</body>
</html>

              sub: h.sub ? (h.subHtml ? h.sub : esc(h.sub)) : '',
              href: '/transactions',
            };
          }).filter(Boolean);
        });
      });

    const feedFromNews = () =>
      jget('/api/news').then(d => (d.articles || [])
        .filter(a => a.status === 'published')
        .map(a => ({
          ts: a.published_at || a.created_at || '',
          date: String(a.published_at || a.created_at || '').slice(0, 10),
          type: 'news',
          text: a.title,
          byline: (a.credited && a.credited.length > 1) ? a.credited.join(', ') : a.author,
          href: `/news/view/?id=${encodeURIComponent(a.id)}`,
        })));

    // Final scores, one row per night, for each of the season's recent nights
    // (FEED_SCORE_NIGHTS). One row for the whole night: a row per game was
    // 10-15 rows on a full slate and pushed every transaction behind "Show
    // more". Every night stays in the feed, not just the latest: showing only
    // `latestNight` made the previous nights' finals vanish from the card as
    // soon as the next night's were entered.
    //
    // The scores come from the season's game index (/api/boxscores/games),
    // one request for every night, rather than a /api/boxscores call per date.
    // If that index can't be had, the latest night alone still shows.
    const FEED_SCORE_NIGHTS = 14;
    const scoreRow = (date, nightGames) => {
      // A ticker cell: away over home, the winner bright.
      const side = (team, score, won) =>
        `<span class="dash-feed-side${won ? ' win' : ''}" data-team="${esc(team)}">${esc(team)} <b>${esc(String(score))}</b></span>`;
      const games = nightGames.map(g => {
        const awayWon = g.away_score > g.home_score;
        return '<span class="dash-feed-score">'
          + side(g.away_team, g.away_score, awayWon) + ' '
          + side(g.home_team, g.home_score, !awayWon) + '</span>';
      });
      return {
        ts: date + 'T23:59:59Z',   // after that day's transactions
        date,
        type: 'score',
        html: plural(nightGames.length, 'game')
          + `<span class="dash-feed-scores">${games.join(' ')}</span>`,
        href: `/boxscores/?date=${encodeURIComponent(date)}`,
      };
    };
    const feedFromLatestNight = () => latestNight.then(night =>
      (night && night.games.length ? [scoreRow(night.date, night.games)] : []));
    const feedFromScores = () => schedulePromise.then(sched => {
      const season = asof ? nbnSeasonForDate(asof) : (sched && sched.season) || '';
      if (!season) return feedFromLatestNight();
      const until = asof || today;
      return jget(`/api/boxscores/games?season=${encodeURIComponent(season)}`).then(index => {
        if (!Array.isArray(index)) return feedFromLatestNight();
        const byDate = new Map();
        for (const g of index) {
          if (!g.date || g.date > until) continue;
          if (!byDate.has(g.date)) byDate.set(g.date, []);
          byDate.get(g.date).push(g);
        }
        return [...byDate.keys()].sort().reverse().slice(0, FEED_SCORE_NIGHTS)
          .map(date => scoreRow(date, byDate.get(date)));
      }, feedFromLatestNight);
    });

    const SOURCES = [feedFromTransactions, feedFromNews, feedFromScores];

    // The feed's filters: a kind, a team, and free-text search, applied to
    // the rows already loaded (FEED_MAX) rather than refetched. Each kind is
    // a test on a row's `type`, so a ledger type this list has not heard of
    // still lands under Moves.
    const FEED_KINDS = [
      { key: 'all',    label: 'All',    test: () => true },
      { key: 'moves',  label: 'Moves',  test: t => t !== 'news' && t !== 'score' },
      { key: 'trades', label: 'Trades', test: t => t === 'trade' },
      { key: 'news',   label: 'News',   test: t => t === 'news' },
      { key: 'scores', label: 'Scores', test: t => t === 'score' },
    ];
    // Accents off and lowercased, so "doncic" finds "Dončić".
    const fold = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

    Promise.allSettled(SOURCES.map(fn => fn())).then(results => {
      // Ordered by the civil date each row *shows*, not by `ts`. A transaction
      // carries both when it happened (`date`) and when someone entered it
      // (`created_at`), and they are routinely weeks apart — a trade dated
      // Aug 19 entered on Sep 3 sorts above an article published Aug 30 while
      // displaying "Aug 19", and the feed reads as though it is not sorted at
      // all. `ts` stays as the tie-break, which is what orders several moves
      // filed on the same league day.
      const items = results
        .filter(r => r.status === 'fulfilled')
        .flatMap(r => r.value || [])
        .filter(it => it && (it.date || it.ts))
        .sort((a, b) =>
          String(b.date || '').localeCompare(String(a.date || ''))
          || String(b.ts || '').localeCompare(String(a.ts || '')))
        .slice(0, FEED_MAX);

      const card = $('dash-feed');
      if (!items.length) {
        card.innerHTML = '<div class="dash-card-title">Around the League</div>'
          + '<div class="dash-empty">Nothing yet.</div>';
        return;
      }

      // The date is the day header's (render), so a row is tag + headline.
      const rowHtml = it => {
        const tone = FeedTypes.tone(it.type);
        const sub = it.sub || (it.byline ? 'By ' + esc(it.byline) : '');
        return `<a class="dash-feed-row" href="${esc(it.href)}">`
          + `<span class="ui-chip${tone ? ' ui-chip--' + tone : ''} dash-feed-tag">`
          + `${esc(FeedTypes.label(it.type))}</span>`
          + `<span class="dash-feed-text">${it.html || esc(it.text)}`
          + (sub ? `<span class="dash-feed-sub">${sub}</span>` : '') + `</span></a>`;
      };

      // What each row can be filtered on, worked out once. Teams come off the
      // logos a row draws (a headline's teams, a night's finals), so a team
      // filter matches exactly what the reader can see; the search text is
      // the row's own visible text plus its byline.
      const scratch = document.createElement('div');
      const rows = items.map(it => {
        const html = rowHtml(it);
        // A space between adjacent tags, so "11 games" and "CHA" don't read as one word.
        scratch.innerHTML = html.replace(/></g, '> <');
        const teams = new Set([...html.matchAll(/logo-([a-z]{2,3})\.webp/g)].map(m => m[1].toUpperCase()));
        if (it.type === 'score') {
          scratch.querySelectorAll('.dash-feed-side').forEach(sp =>
            teams.add(sp.textContent.trim().split(' ')[0].toUpperCase()));
        }
        return { it, html, teams, text: fold(scratch.textContent + ' ' + (it.byline || '')) };
      });

      const kinds = FEED_KINDS.filter(k => k.key === 'all' || rows.some(r => k.test(r.it.type)));
      const teams = [...new Set(rows.flatMap(r => [...r.teams]))].sort();

      // Filters live in the query string (replaceState, so they don't stack
      // up Back presses), which makes a filtered feed linkable.
      const qs = new URLSearchParams(location.search);
      const state = {
        kind: kinds.some(k => k.key === qs.get('feed')) ? qs.get('feed') : 'all',
        team: teams.includes(String(qs.get('team') || '').toUpperCase()) ? qs.get('team').toUpperCase() : '',
        q: qs.get('q') || '',
      };

      card.innerHTML = '<div class="dash-card-title">Around the League</div>'
        + '<div class="dash-feed-filters">'
        + '<div class="ui-segmented dash-feed-kinds" role="group" aria-label="Show">'
        + kinds.map(k => `<button type="button" data-kind="${k.key}" aria-pressed="${k.key === state.kind}">${esc(k.label)}</button>`).join('')
        + '</div>'
        + (teams.length > 1
          ? '<select class="ui-select dash-feed-teamsel" aria-label="Team"><option value="">All teams</option>'
            + teams.map(t => `<option value="${esc(t)}"${t === state.team ? ' selected' : ''}>${esc(t)}</option>`).join('')
            + '</select>' : '')
        + `<input type="search" class="ui-input dash-feed-search" placeholder="Search" aria-label="Search the feed" value="${esc(state.q)}">`
        + '</div>'
        + '<div class="dash-feed"></div>'
        + '<button type="button" class="ui-btn ui-btn--ghost ui-btn--sm dash-feed-more" hidden></button>';

      const list = card.querySelector('.dash-feed');
      const more = card.querySelector('.dash-feed-more');
      let open = false;

      function render() {
        const kind = kinds.find(k => k.key === state.kind);
        const terms = fold(state.q).split(/\s+/).filter(Boolean);
        const shown = rows.filter(r => kind.test(r.it.type)
          && (!state.team || r.teams.has(state.team))
          && terms.every(w => r.text.includes(w)));
        const filtered = state.kind !== 'all' || state.team || terms.length;
        // A header before each day's run (rows are sorted by date). Past the
        // cutoff only a tail is hidden, so a header hides with its first row.
        let day = null;
        list.innerHTML = shown.length
          ? shown.map((r, i) => {
              const hide = i >= FEED_LIMIT && !open;
              const head = r.it.date && r.it.date !== day
                ? `<div class="ui-kicker dash-feed-day"${hide ? ' hidden' : ''}>${esc(dayLabel(r.it.date))}</div>` : '';
              day = r.it.date || day;
              return head + (hide ? r.html.replace('<a class="dash-feed-row"', '<a class="dash-feed-row" hidden') : r.html);
            }).join('')
          : `<div class="dash-empty">${filtered ? 'Nothing matches these filters.' : 'Nothing yet.'}</div>`;
        // A night's finals are one row; with a team picked, only its game.
        if (state.team) list.querySelectorAll('.dash-feed-score').forEach(g => {
          if (g.textContent.trim().split(/\s+/).indexOf(state.team) < 0) g.remove();
        });
        const extra = shown.length - FEED_LIMIT;
        more.hidden = extra <= 0;
        more.textContent = open ? 'Show fewer' : `Show ${extra} more`;
      }

      function sync() {
        const p = new URLSearchParams(location.search);
        [['feed', state.kind === 'all' ? '' : state.kind], ['team', state.team], ['q', state.q.trim()]]
          .forEach(([k, v]) => (v ? p.set(k, v) : p.delete(k)));
        const s = p.toString();
        history.replaceState(history.state, '', location.pathname + (s ? '?' + s : '') + location.hash);
      }

      card.querySelector('.dash-feed-kinds').addEventListener('click', e => {
        const b = e.target.closest('button[data-kind]');
        if (!b) return;
        state.kind = b.dataset.kind;
        card.querySelectorAll('.dash-feed-kinds button').forEach(x =>
          x.setAttribute('aria-pressed', String(x === b)));
        open = false; render(); sync();
      });
      const sel = card.querySelector('.dash-feed-teamsel');
      if (sel) sel.addEventListener('change', () => { state.team = sel.value; open = false; render(); sync(); });
      const search = card.querySelector('.dash-feed-search');
      search.addEventListener('input', () => { state.q = search.value; open = false; render(); sync(); });
      more.addEventListener('click', () => { open = !open; render(); });

      render();
    });

    // ── Injury report ─────────────────────────────────────────────────────
    //
    // Who is injured in the 2K sim right now, from the last committed report
    // (nbn-api routers/injuries.py), laid out like the game's injury screen.
    // Out before Hurt, then the longest injury first. Filters work like the
    // feed's and live in the query string under their own keys (inj, injteam,
    // injq), so the two cards can be filtered independently.
    const INJ_STATUSES = [
      { key: 'all',  label: 'All',  test: () => true },
      { key: 'out',  label: 'Out',  test: s => /^out$/i.test(s) },
      { key: 'hurt', label: 'Hurt', test: s => /^hurt$/i.test(s) },
    ];
    // The low end of a 2K duration in days, for ordering only — the same
    // reading as min_duration_days in nbn-api's routers/injuries.py.
    const injDays = d => {
      d = String(d || '');
      if (/career|season|indefinite/i.test(d)) return Infinity;
      if (/day[\s-]*to[\s-]*day|game[\s-]*time/i.test(d)) return 0;
      const m = d.match(/^(\d+(?:\.\d+)?)(?:\s*[-–]\s*\d+(?:\.\d+)?)?\s*(day|week|month)/i);
      return m ? +m[1] * { day: 1, week: 7, month: 30 }[m[2].toLowerCase()] : -1;
    };

    // Shared with the ticker, which lists the same report.
    const injuriesPromise = jget('/api/injuries').catch(() => null);
    // Out before Hurt, then the longest injury first — the card's order and
    // the ticker's.
    const injOrder = (a, b) => (/^out$/i.test(b.status || '') - /^out$/i.test(a.status || ''))
      || (injDays(b.duration) - injDays(a.duration)) || String(a.name).localeCompare(String(b.name));

    injuriesPromise.then(data => {
      if (!data || !data.last_report) return;
      const card = $('dash-injuries');
      const rows = (data.players || []).map(p => ({
        p, out: /^out$/i.test(p.status || ''),
        text: fold([p.name, p.team, p.injury, p.status].join(' ')),
      })).sort((a, b) => injOrder(a.p, b.p));

      const statuses = INJ_STATUSES.filter(s => s.key === 'all' || rows.some(r => s.test(r.p.status)));
      const teams = [...new Set(rows.map(r => r.p.team).filter(Boolean))].sort();
      const qs = new URLSearchParams(location.search);
      const state = {
        status: statuses.some(s => s.key === qs.get('inj')) ? qs.get('inj') : 'all',
        team: teams.includes(String(qs.get('injteam') || '').toUpperCase()) ? qs.get('injteam').toUpperCase() : '',
        q: qs.get('injq') || '',
      };
      const d = new Date(data.last_report.date + 'T12:00:00');
      const when = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

      card.innerHTML = '<div class="dash-standings-head"><div class="dash-card-title"><a class="ui-title-link" href="/injuries/">Injury Report'
        + `<span class="dash-inj-date">${esc(when)}</span></a></div></div>`
        + (rows.length ? '<div class="dash-feed-filters">'
          + '<div class="ui-segmented dash-feed-kinds" role="group" aria-label="Status">'
          + statuses.map(s => `<button type="button" data-status="${s.key}" aria-pressed="${s.key === state.status}">${esc(s.label)}</button>`).join('')
          + '</div>'
          + (teams.length > 1
            ? '<select class="ui-select dash-feed-teamsel" aria-label="Team"><option value="">All teams</option>'
              + teams.map(t => `<option value="${esc(t)}"${t === state.team ? ' selected' : ''}>${esc(t)}</option>`).join('')
              + '</select>' : '')
          + `<input type="search" class="ui-input dash-feed-search" placeholder="Search" aria-label="Search injuries" value="${esc(state.q)}">`
          + '</div>' : '')
        + '<div class="dash-inj-list"></div>';
      card.hidden = false;
      const list = card.querySelector('.dash-inj-list');

      const ovr = p => p.ovr == null ? ''
        : `${p.ovr}${p.ovr_delta ? ` <span class="dash-inj-drop">(${p.ovr_delta > 0 ? '+' : '−'}${Math.abs(p.ovr_delta)})</span>` : ''}`;
      function render() {
        if (!rows.length) { list.innerHTML = '<div class="dash-empty">Nobody is injured.</div>'; return; }
        const status = statuses.find(s => s.key === state.status);
        const terms = fold(state.q).split(/\s+/).filter(Boolean);
        const shown = rows.filter(r => status.test(r.p.status)
          && (!state.team || r.p.team === state.team)
          && terms.every(w => r.text.includes(w)));
        if (!shown.length) { list.innerHTML = '<div class="dash-empty">Nothing matches these filters.</div>'; return; }
        list.innerHTML = '<div class="ui-table-wrap dash-inj-scroll"><table class="ui-table ui-table--dense dash-inj-table">'
          + '<thead><tr><th>Player</th><th class="dash-inj-status">Status</th><th class="num dash-inj-ovr">OVR</th><th>Injury</th><th>Duration</th></tr></thead><tbody>'
          + shown.map(({ p, out }) => '<tr>'
            + `<td><a class="dash-inj-player" href="/players/?p=${encodeURIComponent(p.slug)}">`
            + (p.team ? `<img src="/logos/sm/logo-${esc(p.team.toLowerCase())}.webp" alt="" title="${esc(p.team)}">` : '')
            + `${esc(p.name)}</a>`
            + `<div class="dash-inj-status-sm ${out ? 'dash-inj-out' : 'dash-inj-hurt'}">${esc(p.status)}</div></td>`
            + `<td class="nowrap dash-inj-status ${out ? 'dash-inj-out' : 'dash-inj-hurt'}">${esc(p.status)}</td>`
            + `<td class="num nowrap dash-inj-ovr">${ovr(p)}</td>`
            + `<td>${esc(p.injury)}</td>`
            + `<td class="nowrap">${esc(p.duration)}</td></tr>`).join('')
          + '</tbody></table></div>';
      }
      function sync() {
        const p = new URLSearchParams(location.search);
        [['inj', state.status === 'all' ? '' : state.status], ['injteam', state.team], ['injq', state.q.trim()]]
          .forEach(([k, v]) => (v ? p.set(k, v) : p.delete(k)));
        const s = p.toString();
        history.replaceState(history.state, '', location.pathname + (s ? '?' + s : '') + location.hash);
      }
      const seg = card.querySelector('[aria-label="Status"]');
      if (seg) seg.addEventListener('click', e => {
        const b = e.target.closest('button[data-status]');
        if (!b) return;
        state.status = b.dataset.status;
        seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
        render(); sync();
      });
      const sel = card.querySelector('.dash-feed-teamsel');
      if (sel) sel.addEventListener('change', () => { state.team = sel.value; render(); sync(); });
      const search = card.querySelector('.dash-feed-search');
      if (search) search.addEventListener('input', () => { state.q = search.value; render(); sync(); });
      render();
    }).catch(() => {});

    // The power-rankings standing, always the newest **published** edition
    // across every series — so publishing a new one replaces this with no edit
    // here. The edition's own title and date are shown beside it rather than
    // presenting the standing as undated: today's newest is February's, and a
    // stale standing that names itself is honest where a bare top five is not.
    jget('/api/news/rankings/series').then(series => {
      const editions = Object.values(series || {}).flat()
        .filter(e => e && e.published_at)
        .sort((a, b) => String(a.published_at).localeCompare(String(b.published_at)));
      if (!editions.length) return;
      const latest = editions[editions.length - 1];
      return jget(`/api/news/${encodeURIComponent(latest.id)}`).then(article => {
        // Rank <= 5 rather than the first five rows: teams level on the average
        // share a rank (T-4, T-4, 6), so a tie at the cut legitimately returns
        // six teams and truncating would drop one of two equals.
        const top = (article.final || []).filter(r => r.rank <= 5)
          .sort((a, b) => a.rank - b.rank);
        if (!top.length) return;

        // Same movement vocabulary as the published table (`moveCell` in
        // news/view/index.html): ▲ up, ▼ down, – level, "new" with no previous.
        const move = r => r.prev == null ? '<span class="rank-move new">new</span>'
          : r.move > 0 ? `<span class="rank-move up">▲${r.move}</span>`
          : r.move < 0 ? `<span class="rank-move down">▼${Math.abs(r.move)}</span>`
          : '<span class="rank-move flat">–</span>';

        // The writer's first sentence on each team, under its row. The full
        // blurb is a paragraph or more; the Full rankings link has the rest.
        const lede = team => {
          const body = String(((article.blurbs || {})[team] || {}).body || '')
            .replace(/[*_#>`]/g, '').replace(/\s+/g, ' ').trim();
          if (!body) return '';
          const first = (body.match(/^.+?[.!?](?=\s|$)/) || [body])[0];
          return first.length > 160 ? first.slice(0, 157).replace(/\s+\S*$/, '') + '…' : first;
        };

        const when = String(latest.published_at).slice(0, 10);
        $('dash-ranks').innerHTML =
          `<div class="dash-ranks-head">`
          + `<div class="dash-standings-head"><div class="dash-card-title"><a class="ui-title-link" href="/news/view/?id=${encodeURIComponent(latest.id)}">Power Rankings</a></div></div>`
          + `<span class="dash-ranks-edition">${esc(latest.title || 'Latest edition')} · ${esc(shortDate(when))}</span></div>`
          + '<div class="dash-ranks-row">' + top.map(r =>
              `<a class="dash-rank-team" href="/teams/${esc(String(r.team).toLowerCase())}/" `
              + `title="${esc(r.team)}">`
              + `<span class="dash-rank-pos">${r.tied ? 'T-' : ''}${r.rank}</span>`
              + `<img src="/logos/sm/logo-${esc(String(r.team).toLowerCase())}.webp" alt="">`
              + `<span class="dash-rank-abbr">${esc(r.team)}</span>${move(r)}`
              + (lede(r.team) ? `<span class="dash-rank-blurb">${esc(lede(r.team))}</span>` : '')
              + `</a>`).join('')
          + '</div>';
        $('dash-ranks').hidden = false;
      });
    }).catch(() => {});

    // ── Last night's best ─────────────────────────────────────────────────
    //
    // The three best lines of the latest night with box scores, by Game Score
    // — the same formula the build ranks single-game highs by (`game_score`
    // in nbn-api/stats_build/pipeline.py), so a line that tops this card is
    // ranked the same way on /stats/highs.
    const gameScore = p => p.pts + 0.4 * p.fgm - 0.7 * p.fga - 0.4 * (p.fta - p.ftm)
      + 0.7 * p.oreb + 0.3 * p.dreb + p.stl + 0.7 * p.ast + 0.7 * p.blk - 0.4 * p.pf - p.tov;

    latestNight.then(night => {
      if (!night) return;
      const lines = night.games.flatMap(g => {
        const side = (players, team, opp, home, us, them) => players.map(p => ({
          p, team, opp, home, won: us > them, score: `${us}–${them}`,
        }));
        return [
          ...side(g.away_players || [], g.away_team, g.home_team, false, g.away_score, g.home_score),
          ...side(g.home_players || [], g.home_team, g.away_team, true, g.home_score, g.away_score),
        ];
      }).map(x => ({ ...x, gmsc: gameScore(x.p) }))
        .sort((a, b) => b.gmsc - a.gmsc).slice(0, 3);
      if (!lines.length) return;

      const logo = t => `/logos/sm/logo-${esc(String(t).toLowerCase())}.webp`;
      // Points, rebounds and assists always; steals and blocks when they
      // are part of why the line is here.
      const statLine = p => [['pts', 'PTS'], ['reb', 'REB'], ['ast', 'AST'], ['stl', 'STL'], ['blk', 'BLK']]
        .filter(([k], i) => i < 3 || p[k] >= 3)
        .map(([k, label]) => `${p[k]}<span>${label}</span>`).join('');

      const title = night.date === today ? 'Tonight\'s best'
        : night.date === dayBefore(today) ? 'Last night\'s best' : 'Best performances';
      $('dash-best').innerHTML =
        `<div class="dash-card-title">${title}`
        + `<span class="dash-best-title-date">${esc(shortDate(night.date))}</span></div>`
        + '<div class="dash-best-row">' + lines.map((x, i) => {
          const tag = x.p.slug ? 'a' : 'div';
          const href = x.p.slug ? ` href="/players/?p=${encodeURIComponent(x.p.slug)}"` : '';
          // No photo on file: the team logo stands in, rather than a blank circle.
          const photo = x.p.photo_url
            ? `<img class="dash-best-photo" src="${esc(x.p.photo_url)}" alt="" `
              + `onerror="this.onerror=null;this.src='${logo(x.team)}';this.style.objectFit='contain'">`
            : `<img class="dash-best-photo" src="${logo(x.team)}" alt="" style="object-fit:contain">`;
          return `<${tag} class="dash-best-item"${href}>`
            + `<span class="dash-best-rank">${i + 1}</span>`
            + `<div class="dash-best-top">${photo}<div style="min-width:0">`
            + `<div class="dash-best-name">${esc(nbnPlayerName(x.p.player))}</div>`
            + `<div class="dash-best-game"><img src="${logo(x.team)}" alt="">${esc(x.team)} `
            + `${x.home ? 'vs' : '@'} ${esc(x.opp)} · ${x.won ? 'W' : 'L'} ${esc(x.score)}</div>`
            + `</div></div>`
            + `<div class="dash-best-line">${statLine(x.p)}</div>`
            + `<div class="dash-best-gmsc">Game Score ${x.gmsc.toFixed(1)} · ${x.p.min} min</div>`
            + `</${tag}>`;
        }).join('') + '</div>';
      $('dash-best').hidden = false;
    }).catch(() => {});

    // ── Ticker: the latest night's finals, its top performers, injuries ───
    //
    // Same night and same Game Score as the card above, so the two agree.
    // The injuries are only the new ones: players whose injury first showed
    // up on the latest report (`since` is that report's date). In the Injury
    // Report card's order, capped so a bad night doesn't swamp the scores;
    // the section head links to the full list.
    // The items are written twice; the CSS slides the strip by half its
    // width for a seamless loop, and the copy is hidden from screen readers
    // (and, under reduced motion, from everyone).
    Promise.all([latestNight.catch(() => null), injuriesPromise]).then(([night, inj]) => {
      const logo = t => `<img src="/logos/sm/logo-${esc(String(t).toLowerCase())}.webp" alt="">`;
      const games = night ? night.games : [];
      const finals = games.map(g => {
        const a = Number(g.away_score), h = Number(g.home_score);
        const side = (t, n, won) => `${logo(t)}${won ? `<b>${esc(t)} ${esc(String(n))}</b>` : `${esc(t)} ${esc(String(n))}`}`;
        return `<a class="ticker-item" href="/boxscores/?date=${encodeURIComponent(night.date)}`
          + `&game=${encodeURIComponent(g.away_team)}-${encodeURIComponent(g.home_team)}">`
          + `${side(g.away_team, a, a > h)}<span aria-hidden="true">·</span>${side(g.home_team, h, h > a)}`
          + '<span class="ticker-final">F</span></a>';
      });
      const top = games.flatMap(g => [
        ...(g.away_players || []).map(p => ({ p, team: g.away_team })),
        ...(g.home_players || []).map(p => ({ p, team: g.home_team })),
      ]).map(x => ({ ...x, gmsc: gameScore(x.p) }))
        .sort((a, b) => b.gmsc - a.gmsc).slice(0, 5)
        .map(({ p, team }) => {
          const stats = [['pts', 'PTS'], ['reb', 'REB'], ['ast', 'AST'], ['stl', 'STL'], ['blk', 'BLK']]
            .filter(([k], i) => i < 3 || p[k] >= 3)
            .map(([k, label]) => `<b>${esc(String(p[k]))}</b><span class="ticker-stat">${label}</span>`).join('');
          const tag = p.slug ? 'a' : 'span';
          const href = p.slug ? ` href="/players/?p=${encodeURIComponent(p.slug)}"` : '';
          return `<${tag} class="ticker-item"${href}>${logo(team)}`
            + `<span>${esc(nbnPlayerName(p.player))}</span>${stats}</${tag}>`;
        });
      const INJ_MAX = 10;
      const reportDate = inj && inj.last_report ? inj.last_report.date : null;
      const hurt = (reportDate ? inj.players || [] : [])
        .filter(p => p.since === reportDate).sort(injOrder);
      const injuries = hurt.slice(0, INJ_MAX).map(p => {
        const out = /^out$/i.test(p.status || '');
        const tag = p.slug ? 'a' : 'span';
        const href = p.slug ? ` href="/players/?p=${encodeURIComponent(p.slug)}"` : '';
        return `<${tag} class="ticker-item"${href}>${p.team ? logo(p.team) : ''}`
          + `<span>${esc(p.name)}</span>`
          + `<span class="${out ? 'ticker-out' : 'ticker-hurt'}">${esc(p.status)}</span>`
          + (p.duration ? `<span class="ticker-stat">${esc(p.duration)}</span>` : '')
          + `</${tag}>`;
      });
      if (!finals.length && !injuries.length) return;
      const items = finals.join('')
        + (top.length ? '<span class="ticker-head">Top performers</span>' + top.join('') : '')
        + (injuries.length ? '<a class="ticker-head" href="/injuries/">New injuries'
          + (hurt.length > INJ_MAX ? ` <span class="ticker-more">${hurt.length} total</span>` : '')
          + '</a>' + injuries.join('') : '');
      const label = finals.length
        ? `${night.date === today ? 'Tonight' : night.date === dayBefore(today) ? 'Last night' : 'Latest'}`
          + `<span>${esc(shortDate(night.date))}</span>`
        : `New injuries<span>${esc(shortDate(reportDate))}</span>`;
      const el = $('ticker');
      el.innerHTML = `<div class="ticker-label">${label}</div>`
        + '<div class="ticker-track"><div class="ticker-strip">'
        + `<div style="display:flex;height:100%">${items}</div>`
        + `<div style="display:flex;height:100%" aria-hidden="true" inert>${items}</div>`
        + '</div></div>';
      // A constant speed whatever the night's size: ~4s per item.
      el.style.setProperty('--ticker-dur', `${Math.max(20, (finals.length + top.length + injuries.length + 2) * 4)}s`);
      el.hidden = false;
    }).catch(() => {});

    // ── Latest stream / Latest box scores ─────────────────────────────────
    //
    // Two sidebar cards under the slate: the newest streamed game's video, and
    // the newest "NBN M/D: Box Scores" video for a night's unstreamed games.
    // The links are the ones vod.js shows as buttons on the slate. Each card
    // stays hidden until it has a video, and they can be different nights.
    //
    // A thumbnail until clicked, then the YouTube player in its place. A
    // watch?v= URL is the only shape stored (schedule.youtube_watch_url
    // normalizes every link to it), keeping a t= start time when it had one.
    const ytParts = url => {
      try {
        const u = new URL(url);
        const id = u.searchParams.get('v');
        if (!id || !/^[\w-]{6,20}$/.test(id)) return null;
        return { id, start: parseInt(u.searchParams.get('t'), 10) || 0 };
      } catch (e) { return null; }
    };

    function vodCard(id, title, date, url, label, meta) {
      const yt = ytParts(url);
      if (!yt) return;
      const card = $(id);
      card.innerHTML = `<div class="dash-card-title">${esc(title)}`
        + `<span class="dash-best-title-date">${esc(shortDate(date))}</span></div>`
        + `<div class="dash-vod"><div class="dash-vod-frame">`
        + `<button type="button" class="dash-vod-play" aria-label="Play ${esc(title)}" `
        + `style="background-image:url('https://i.ytimg.com/vi/${esc(yt.id)}/hqdefault.jpg')">${NbnVod.ICON}</button>`
        + `</div><div class="dash-vod-cap"><span class="dash-vod-teams">${label}</span>`
        + `<span class="dash-vod-meta">${meta || ''}`
        + `<a class="dash-vod-yt" href="${esc(url)}" target="_blank" rel="noopener">YouTube ↗</a>`
        + `</span></div></div>`;
      card.querySelector('.dash-vod-play').addEventListener('click', e => {
        e.currentTarget.outerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${esc(yt.id)}?autoplay=1`
          + (yt.start ? `&start=${yt.start}` : '') + `" title="${esc(title)}" `
          + 'allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>';
      });
      // Shown only once the thumbnail loads. A deleted or private video
      // answers with YouTube's 120×90 grey placeholder, not an error, so a
      // thumbnail that small counts as a failure too.
      const img = new Image();
      img.onload = () => { if (img.naturalWidth > 120) card.hidden = false; };
      img.src = `https://i.ytimg.com/vi/${yt.id}/hqdefault.jpg`;
    }

    Promise.all([schedulePromise, latestNight]).then(([sched, night]) => {
      // The last-tipped game with a video, on the latest night that has one.
      const g = ((sched && sched.games) || []).filter(x => x.youtube_url && x.date <= today)
        .sort((a, b) => a.date.localeCompare(b.date)
          || nbnTipMinutes(a.time_et) - nbnTipMinutes(b.time_et)).pop();
      if (!g) return;
      const key = (a, b) => [a, b].map(t => String(t).toUpperCase()).sort().join('|');
      const f = night && night.date === g.date
        && night.games.find(x => key(x.away_team, x.home_team) === key(g.away_team, g.home_team));
      let score = '';
      if (f) {
        const [a, h] = String(f.away_team).toUpperCase() === g.away_team.toUpperCase()
          ? [f.away_score, f.home_score] : [f.home_score, f.away_score];
        score = `<a class="dash-vod-score" title="Box score" href="/boxscores/?date=${encodeURIComponent(g.date)}`
          + `&game=${esc(f.away_team)}-${esc(f.home_team)}">`
          + `<span class="${a > h ? 'win' : ''}">${esc(a)}</span>–`
          + `<span class="${h > a ? 'win' : ''}">${esc(h)}</span> F</a>`;
      }
      const logo = t => `/logos/sm/logo-${esc(String(t).toLowerCase())}.webp`;
      vodCard('dash-stream-vod', 'Latest Stream', g.date, g.youtube_url,
        `<img src="${logo(g.away_team)}" alt="">${esc(g.away_team)}`
        + `<span class="at">@</span><img src="${logo(g.home_team)}" alt="">${esc(g.home_team)}`, score);
    }).catch(() => {});

    streamingDaysPromise.then(days => {
      days = days || {};
      const date = Object.keys(days).filter(d => d <= today && days[d] && days[d].youtube_url).sort().pop();
      if (!date) return;
      vodCard('dash-box-vod', 'Latest Box Scores', date, days[date].youtube_url,
        `${+date.slice(5, 7)}/${+date.slice(8, 10)} Box Scores`,
        `<a class="dash-vod-score" href="/boxscores/?date=${encodeURIComponent(date)}">Box scores</a>`);
    }).catch(() => {});

    // ── Standings ─────────────────────────────────────────────────────────
    //
    // Each conference in full, while a season is being played, with games
    // back of its 1 seed. The seeds are the build's own (tiebreaks included),
    // so this agrees with /standings by construction.
    //
    // The playoff odds (GET /api/playoff-odds) aren't shown here, but the
    // payload still supplies unplayed teams and the clinch marks.
    const oddsPromise = jget('/api/playoff-odds').catch(() => null);
    Promise.all([liveStandingsPromise, oddsPromise, liveSeasonPromise]).then(([rows, odds, season]) => {
      const seeded = rows.filter(r => /^(East|West)-/.test(r.SEED || ''));
      if (!seeded.length) return;
      // The odds payload knows every team's conference and season length,
      // which the standings file can't (it lists only teams that have played):
      // the same fill-in and clinch marks /standings makes.
      const live = odds && odds.season === season && Array.isArray(odds.teams)
        ? new Map(odds.teams.map(t => [t.team, t])) : null;
      // Same formula as /standings: half a game per win or loss behind the leader.
      const gb = (lead, r) => {
        const d = ((+lead.W - +r.W) + (+r.L - +lead.L)) / 2;
        return d === 0 ? '—' : d.toFixed(1);
      };
      const conf = (c, label) => {
        let list = seeded.filter(r => r.SEED.startsWith(c)).sort((a, b) => +a.SEED_NUM - +b.SEED_NUM);
        if (live) {
          const have = new Set(list.map(r => r.TEAM));
          const unplayed = [...live.values()].filter(t => t.conf === c && !have.has(t.team)).map(t => t.team).sort()
            .map(team => ({ TEAM: team, W: 0, L: 0 }));
          // 0–0 reads as .500: below a winning record, above a losing one.
          const at = list.findIndex(r => +r.W < +r.L);
          list = at < 0 ? [...list, ...unplayed] : [...list.slice(0, at), ...unplayed, ...list.slice(at)];
        }
        let marks = {};
        if (live && window.Clinch) {
          const teams = list.map(r => ({ team: r.TEAM, w: +r.W, l: +r.L, games: +(live.get(r.TEAM)?.games) || 0 }));
          if (teams.length && teams.every(t => t.games)) marks = Clinch.marks(teams);
        }
        return `<div><div class="dash-conf-name">${label}<span class="dash-conf-col dash-stand-rec">W–L</span><span class="dash-conf-col dash-stand-gb">GB</span></div>`
          + list.map((r, i) =>
          (i === Clinch.PLAYOFF ? '<div class="dash-stand-line" title="Seeds 7–10 play in">Play-in</div>' : '')
          + (i === Clinch.PLAY_IN ? '<div class="dash-stand-line" title="Seeds 11–15 miss the postseason">Lottery</div>' : '')
          + `<a class="dash-stand-row" href="/teams/${esc(r.TEAM)}/">`
          + `<span class="dash-stand-seed">${i + 1}</span>`
          + `<img src="/logos/sm/logo-${esc(r.TEAM.toLowerCase())}.webp" alt="">`
          + `<span class="dash-stand-abbr">${esc(r.TEAM)}</span>`
          + (marks[r.TEAM] ? `<span class="dash-stand-mark" title="${esc(Clinch.LABELS[marks[r.TEAM]])}">${esc(marks[r.TEAM])}</span>` : '')
          + `<span class="dash-stand-rec">${esc(r.W)}–${esc(r.L)}</span><span class="dash-stand-gb" title="Games back">${gb(list[0], r)}</span></a>`).join('') + '</div>';
      };
      $('dash-standings').innerHTML =
        `<div class="dash-standings-head"><div class="dash-card-title"><a class="ui-title-link" href="/standings">Standings</a></div></div>`
        + `<div class="dash-standings-grid">${conf('East', 'East')}${conf('West', 'West')}</div>`;
      $('dash-standings').hidden = false;
    }).catch(() => {});

    // ── Ratings movers ────────────────────────────────────────────────────
    //
    // The three biggest OVR gains and drops in the latest 2K scrape, off the
    // same diff /ratings-changes shows. Stub ratings are left out, as that page
    // keeps them in their own table: they were never synced into the live OVR.
    // `since` keeps the payload to recent scrapes as the history grows; a
    // league that hasn't scraped in six months simply has no card.
    jget(`/api/ratings-changes?since=${dayBefore(today, 183)}`).then(d => {
      const entries = (d && d.entries) || [];
      const date = entries.length ? entries[0].date : null;
      const moves = entries.filter(e => e.date === date && e.ovr && !e.ovr_stub
          && e.ovr.old != null && e.ovr.new != null && e.ovr.new !== e.ovr.old)
        .map(e => ({ ...e, delta: e.ovr.new - e.ovr.old }));
      // Bigger move first; level moves go to the better player.
      const pick = sign => moves.filter(e => Math.sign(e.delta) === sign)
        .sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta) || b.ovr.new - a.ovr.new)
        .slice(0, 3);
      const up = pick(1), down = pick(-1);
      if (!up.length && !down.length) return;

      const row = e => `<a class="dash-stand-row" href="/players/?p=${encodeURIComponent(e.slug)}">`
        // No team at scrape time: an unsigned player, marked FA in the logo's place.
        + (e.team ? `<img src="/logos/sm/logo-${esc(String(e.team).toLowerCase())}.webp" alt="" title="${esc(e.team)}">`
                  : '<span class="dash-mover-fa" title="Free agent">FA</span>')
        + `<span class="dash-mover-name">${esc(nbnPlayerName(e.name))}</span>`
        + `<span class="dash-mover-ovr">${e.ovr.old}→${e.ovr.new}`
        + (e.delta > 0 ? `<span class="rank-move up">▲${e.delta}</span>`
                       : `<span class="rank-move down">▼${-e.delta}</span>`)
        + '</span></a>';
      const group = (label, list) => list.length
        ? `<div class="dash-movers-group"><div class="dash-conf-name">${label}</div>`
          + list.map(row).join('') + '</div>' : '';

      $('dash-movers').innerHTML =
        '<div class="dash-standings-head"><div class="dash-card-title"><a class="ui-title-link" href="/ratings-changes/">Ratings Movers'
        + `<span class="dash-best-title-date">${esc(shortDate(date))}</span></a></div></div>`
        + group('Up', up) + group('Down', down);
      $('dash-movers').hidden = false;
    }).catch(() => {});

    // ── Award race ────────────────────────────────────────────────────────
    //
    // The leaders of /awards/race, while a season is being played: MVP's top
    // three, then the leader of each other award. The formulas are
    // award-race.js; this only picks who to show.
    Promise.all([liveSeasonPromise, Milestones.seasonRows(), standingsPromise]).then(async ([season, rows, stand]) => {
      if (!season || !window.AwardRace) return;
      const pct = {};
      stand.forEach(r => { pct[`${r.SEASON}|${r.TEAM}`] = +r.PCT; });
      const starts = await jget(`/api/game-starters/counts?season=${season}`).catch(() => null);
      const lad = key => AwardRace.ladder(key, rows, season, pct, { starts });
      const mvp = lad('MVP').slice(0, 3);
      if (!mvp.length) return;
      const row = (award, p, num) => `<a class="dash-race-row" href="/awards/race/">`
        + `<span class="dash-race-award">${esc(award)}</span>`
        + `<img src="/logos/sm/logo-${esc(p.team.toLowerCase())}.webp" alt="" title="${esc(p.team)}">`
        + `<span class="dash-race-name">${esc(nbnPlayerName(p.name))}</span>`
        + `<span class="dash-race-num">${esc(num)}</span></a>`;
      const ppg = p => `${(p.PTS / p.G).toFixed(1)} ppg`;
      const html = mvp.map((p, i) => row(i ? '' : 'MVP', p, ppg(p))).join('')
        + [['DPOY', 'DPOY', p => `${((p.STL + p.BLK) / p.G).toFixed(1)} stk`],
           ['ROTY', 'ROY', ppg], ['6MOY', '6MOY', ppg],
           ['MIP', 'MIP', p => `+${(p.gmscPg - p.prevGmscPg).toFixed(1)} GmSc`]]
          .map(([key, label, num]) => { const top = lad(key)[0]; return top ? row(label, top, num(top)) : ''; }).join('');
      $('dash-race').innerHTML =
        '<div class="dash-standings-head"><div class="dash-card-title"><a class="ui-title-link" href="/awards/race/">Award Race</a></div></div>' + html;
      $('dash-race').hidden = false;
    }).catch(() => {});

    // ── Rookie watch ──────────────────────────────────────────────────────
    //
    // This season's draft class, ranked by the same ROTY ladder as
    // /awards/race (award-race.js), with each rookie's draft slot and line.
    const ROOKIES_SHOWN = 5;
    Promise.all([liveSeasonPromise, Milestones.seasonRows(), standingsPromise]).then(([season, rows, stand]) => {
      if (!season || !window.AwardRace) return;
      const pct = {};
      stand.forEach(r => { pct[`${r.SEASON}|${r.TEAM}`] = +r.PCT; });
      const list = AwardRace.ladder('ROTY', rows, season, pct).slice(0, ROOKIES_SHOWN);
      if (!list.length) return;
      // Picks are numbered overall (1–60), so a 2nd-rounder reads "Pick #41"
      // too. An undrafted player's pick is "NA" in player_seasons.csv.
      const slot = p => (p.draftPick && p.draftPick !== 'NA' ? `Pick #${p.draftPick}` : 'Undrafted');
      const pg = (p, f) => (p[f] / p.G).toFixed(1);
      $('dash-rookies').innerHTML =
        '<div class="dash-standings-head"><div class="dash-card-title"><a class="ui-title-link" href="/awards/race/">Rookie Watch</a></div></div>'
        + list.map(p => `<a class="dash-stand-row dash-ms-row" href="/players/?p=${encodeURIComponent(p.slug)}">`
          + `<img src="/logos/sm/logo-${esc(p.team.toLowerCase())}.webp" alt="" title="${esc(p.team)}">`
          + `<span class="dash-mover-name">${esc(nbnPlayerName(p.name))}</span>`
          + `<span class="dash-rookie-pick">${esc(slot(p))}</span>`
          + `<span class="dash-ms-what">${pg(p, 'PTS')} pts · ${pg(p, 'REB')} reb · ${pg(p, 'AST')} ast</span></a>`).join('');
      $('dash-rookies').hidden = false;
    }).catch(() => {});

    // ── Milestone watch ───────────────────────────────────────────────────
    //
    // Every rostered player within five games of a round-number career total
    // or the next spot in an all-time top 10 (milestones.js, shared with
    // /preview). One line per player, their nearest; the closest five show.
    const MS_GAMES = 5, MS_SHOWN = 5;
    Milestones.load().then(data => {
      const seen = new Set();
      const list = Milestones.upcoming(data, { maxGames: MS_GAMES })
        .filter(m => !seen.has(m.slug) && seen.add(m.slug))
        .slice(0, MS_SHOWN);
      if (!list.length) return;
      $('dash-milestones').innerHTML =
        '<div class="dash-standings-head"><div class="dash-card-title"><a class="ui-title-link" href="/stats/totals">Milestone Watch</a></div></div>'
        + list.map(m => `<a class="dash-stand-row dash-ms-row" href="/players/?p=${encodeURIComponent(m.slug)}">`
          + `<img src="/logos/sm/logo-${esc(m.team.toLowerCase())}.webp" alt="" title="${esc(m.team)}">`
          + `<span class="dash-mover-name">${esc(nbnPlayerName(m.name))}</span>`
          + `<span class="dash-mover-ovr" title="At their per-game rate from ${esc(data.careers[m.slug].rateSeason || 'their career')}">${esc(Milestones.eta(m))}</span>`
          + `<span class="dash-ms-what">${esc(Milestones.describe(m, nbnPlayerName))}</span></a>`).join('');
      $('dash-milestones').hidden = false;
    }).catch(() => {});

    // ── On this day ───────────────────────────────────────────────────────
    //
    // Earlier seasons on today's date: titles and series clinched, the day's
    // best game each year, and trades. The API does the finding; this picks
    // the few worth a line, one of each kind before a second of any: a title
    // or clinch, a game that cleared a feat, a trade, then any other best game.
    const OTD_SHOWN = 4;
    const ROUND_NAME = { 1: 'First Round', 2: 'Conference Semifinals', 3: 'Conference Finals', 4: 'Finals' };
    const teamSpan = abbr => headlineCtx({}).team(String(abbr));
    jget(`/api/on-this-day?date=${encodeURIComponent(today)}`).then(async d => {
      const year = date => date.slice(0, 4);
      const items = [];
      (d.clinches || []).forEach(c => items.push({ rank: c.title ? 0 : 1, date: c.date, html: c.title
        ? `<i class="ui-icon ui-icon--trophy dash-otd-trophy" aria-hidden="true"></i> ${teamSpan(c.winner)} won the title, ${c.wins}–${c.losses} over ${teamSpan(c.loser)}`
        : `${teamSpan(c.winner)} closed out ${teamSpan(c.loser)}, ${c.wins}–${c.losses} <span class="dash-otd-sub">${esc(ROUND_NAME[c.round] || 'Playoffs')}</span>` }));
      (d.games || []).forEach(g => {
        const L = g.line || {};
        const away = g.home ? g.opp : g.team, home = g.home ? g.team : g.opp;
        items.push({ rank: g.feat ? 2 : 4, date: g.date,
          href: `/boxscores/?date=${encodeURIComponent(g.date)}&game=${encodeURIComponent(away)}-${encodeURIComponent(home)}`,
          html: `<b>${esc(nbnPlayerName(g.player))}</b> ${L.P} pts, ${L.R} reb, ${L.A} ast `
            + `<span class="dash-otd-sub">${g.home ? 'vs' : '@'} ${esc(g.opp)}${g.playoff ? ' · playoffs' : ''}${g.feat ? ' · ' + esc(g.feat) : ''}</span>` });
      });
      const trades = d.trades || [];
      if (trades.length) {
        const slugs = txnSlugs(trades);
        const bios = slugs.size
          ? await jget('/api/players?slugs=' + encodeURIComponent([...slugs].join(','))).catch(() => ({}))
          : {};
        const ctx = headlineCtx(bios);
        trades.forEach(t => {
          const h = FeedTypes.headline(t, ctx);
          if (h) items.push({ rank: 3, date: t.date, href: '/transactions', html: h.html });
        });
      }
      if (!items.length) return;
      const order = (a, b) => (a.rank - b.rank) || b.date.localeCompare(a.date);
      items.sort(order);
      // One of each kind first (a title or clinch, a feat, a trade, a game),
      // so four big games on Christmas don't crowd out the trade that day.
      const kind = r => (r <= 1 ? 'po' : r);
      const picked = [], seen = new Set();
      items.forEach(it => { if (!seen.has(kind(it.rank))) { seen.add(kind(it.rank)); picked.push(it); } });
      items.forEach(it => { if (picked.length < OTD_SHOWN && !picked.includes(it)) picked.push(it); });
      picked.sort(order);
      $('dash-otd').innerHTML =
        `<div class="dash-standings-head"><div class="dash-card-title">On This Day`
        + `<span class="dash-best-title-date">${esc(shortDate(today))}</span></div></div>`
        + picked.slice(0, OTD_SHOWN).map(it => {
          const tag = it.href ? 'a' : 'div';
          return `<${tag} class="dash-otd-row"${it.href ? ` href="${esc(it.href)}"` : ''}>`
            + `<span class="dash-otd-year">${esc(year(it.date))}</span><span class="dash-otd-what">${it.html}</span></${tag}>`;
        }).join('');
      $('dash-otd').hidden = false;
    }).catch(() => {});

    // ── NBN Twitter ───────────────────────────────────────────────────────
    //
    // Made-up accounts reacting to the latest game day, written by the box
    // score run (nbn-api routers/tweets.py). Fiction, but the numbers in them
    // are the box score's. A player's own account shows his face, a fan
    // account its team's logo, anyone else an initial.
    const TW_PAGE = 6;
    const twCount = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M'
      : n >= 1e4 ? Math.round(n / 1e3) + 'K'
      : n >= 1e3 ? (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K' : String(n);
    const twRow = t => {
      const av = t.slug
        ? `<img class="dash-tw-av" src="/api/players/${encodeURIComponent(t.slug)}/headshot" alt="" loading="lazy">`
        : t.team
          ? `<img class="dash-tw-av dash-tw-av--logo" src="/logos/sm/logo-${esc(t.team.toLowerCase())}.webp" alt="">`
          : `<span class="dash-tw-av dash-tw-av--init">${esc(t.name.replace(/[^A-Za-z0-9]/g, '').charAt(0).toUpperCase())}</span>`;
      const game = t.teams && t.teams.length === 2
        ? `<a href="/boxscores/?date=${encodeURIComponent(t.date)}&game=${esc(t.teams[0])}-${esc(t.teams[1])}">${esc(t.teams[0])} @ ${esc(t.teams[1])}</a>`
        : '';
      return `<div class="dash-tw">${av}<div style="min-width:0">`
        + `<div class="dash-tw-who"><b>${esc(t.name)}</b> <span>@${esc(t.handle)} · ${esc(shortDate(t.date))}</span></div>`
        + `<div class="dash-tw-text">${esc(t.text)}</div>`
        + `<div class="dash-tw-foot"><span>${twCount(t.retweets || 0)} RTs</span>`
        + `<span>${twCount(t.likes || 0)} likes</span>${game}</div></div></div>`;
    };
    jget(`/api/tweets?limit=${TW_PAGE}`).then(list => {
      if (!list.length) return;
      const card = $('dash-tweets');
      card.innerHTML = '<div class="dash-card-title">NBN Twitter</div><div id="dash-tw-list"></div>';
      const box = $('dash-tw-list');
      let oldest = null;
      const add = rows => {
        box.insertAdjacentHTML('beforeend', rows.map(twRow).join(''));
        // No cached headshot is a 404; fall back to the initial.
        box.querySelectorAll('img.dash-tw-av:not([data-tw])').forEach(img => {
          img.dataset.tw = '1';
          img.onerror = () => {
            const name = img.closest('.dash-tw').querySelector('.dash-tw-who b').textContent;
            img.outerHTML = `<span class="dash-tw-av dash-tw-av--init">${esc(name.charAt(0).toUpperCase())}</span>`;
          };
        });
        oldest = rows[rows.length - 1].id;
        const more = card.querySelector('.dash-tw-more');
        if (more) more.remove();
        if (rows.length < TW_PAGE) return;
        const btn = document.createElement('button');
        btn.className = 'ui-btn ui-btn--ghost ui-btn--sm dash-tw-more';
        btn.textContent = 'Older tweets';
        btn.onclick = () => {
          btn.disabled = true;
          jget(`/api/tweets?limit=${TW_PAGE}&before=${oldest}`)
            .then(r => r.length ? add(r) : btn.remove())
            .catch(() => { btn.disabled = false; });
        };
        card.appendChild(btn);
      };
      add(list);
      card.hidden = false;
    }).catch(() => {});

    // ── Band 1: signed-in only ────────────────────────────────────────────
    if (!token) return;

    // Which team is mine. Same derivation nav.js's profile picker uses:
    // /api/members/me reports position names ("owner") but not which team, so
    // the active tenure off /api/members/public is what names it.
    const mePromise = jget('/api/me', { headers: auth })
      .then(me => jget('/api/members/public')
        .then(members => {
          const mine = members.find(m => m.name === me.name);
          const active = (mine && mine.tenures || []).filter(t => !t.end);
          if (!active.length) return { me, team: null };
          const tenure = active.sort((a, b) => b.start.localeCompare(a.start))[0];
          return { me, team: tenure.team.toUpperCase() };
        }))
      .catch(() => null);

    // ── Band 1: your team ─────────────────────────────────────────────────
    mePromise.then(async ctx => {
      if (!ctx || !ctx.team) return;   // signed in, but no active tenure
      const team = ctx.team;
      const abbr = team.toLowerCase();
      const card = $('dash-team');

      const [sched, capRows, standings, recs, results] = await Promise.all([
        schedulePromise,
        jget('/api/cap-history/current').catch(() => null),
        standingsPromise,
        recordsPromise,
        // This season's results, newest first, for the "Last" line.
        nbnCurrentSeason().then(s => jget(`/api/boxscores/games?team=${team}&season=${s}`)).catch(() => []),
      ]);

      const ph = phaseOf(sched && sched.games);
      const season = (capRows && capRows.entries && capRows.entries[0] || {}).season
        || (sched && sched.season) || '';

      // ── Header: who you are, and where the league year is
      const teamName = (typeof TEAM_LIST !== 'undefined' && TEAM_LIST[team]) || team;

      // Record for the current season if one exists; the last completed season
      // otherwise. In the offseason standings-history has no row for the season
      // about to start, which is exactly when the countdown is the useful thing.
      let recordLine = '';
      const rows = standings.filter(r => r.TEAM === team);
      const cur = rows.find(r => r.SEASON === season);
      const prev = rows.sort((a, b) => b.SEASON.localeCompare(a.SEASON))[0];
      const use = cur || prev;
      if (use) {
        recordLine = `${use.W}–${use.L}`
          + (use.PLAYOFF_RESULT && use.PLAYOFF_RESULT !== 'Missed' ? ` · ${use.PLAYOFF_RESULT}` : '')
          + (cur ? '' : ` (${use.SEASON})`);
      }

      // Your team's own next games, also used for the header countdown below.
      const mine = ((sched && sched.games) || [])
        .filter(g => (g.home_team === team || g.away_team === team) && g.date >= today)
        .sort((a, b) => a.date.localeCompare(b.date));

      // In the preseason this counts to *your opener*, not to the league's
      // opening night — the slate card beside it already owns that number, and
      // the two are rarely the same day (UTA opens Oct 21, the league Oct 20).
      let phaseHtml = '';
      if (ph.phase === 'preseason' && mine.length) {
        const n = daysUntil(today, mine[0].date);
        phaseHtml = `<div class="dash-team-phase">${n === 0 ? 'Tonight' : plural(n, 'day')}</div>`
          + `<div class="dash-team-phase-sub">${n === 0 ? '' : 'to your opener · '}${esc(season)}</div>`;
      } else if (ph.phase === 'preseason') {
        phaseHtml = `<div class="dash-team-phase-sub">${esc(season)}</div>`;
      } else if (ph.phase === 'in-season') {
        phaseHtml = `<div class="dash-team-phase-sub">${esc(season)} season</div>`;
      }

      const headHtml = `<div class="dash-team-head">`
        + `<a class="dash-team-id" href="/teams/${esc(abbr)}/">`
        + `<img src="/logos/sm/logo-${esc(abbr)}.webp" alt="">`
        + `<div><div class="dash-team-name">${esc(teamName)}</div>`
        + `<div class="dash-team-sub">${esc(recordLine || 'Your team')}</div></div></a>`
        + `<div class="dash-team-right">${phaseHtml}</div></div>`;

      // ── At a glance: the card is collapsed to this by default. Last result,
      // next game, and a one-word read of the chips below; everything else
      // (cap lines, the next five, the chips themselves) opens under it.
      const glance = [];
      const last = (Array.isArray(results) ? results : []).find(g => g.date <= today);
      if (last) {
        const home = last.home_team === team;
        const [us, them] = home ? [last.home_score, last.away_score] : [last.away_score, last.home_score];
        glance.push(`<a class="dash-glance" href="/boxscores/?date=${esc(last.date)}&game=${esc(last.away_team)}-${esc(last.home_team)}">`
          + `<span class="dash-line-label">Last</span> `
          + `<span class="${us > them ? 'tone-ok' : 'tone-violation'}">${us > them ? 'W' : 'L'}</span> ${esc(us)}–${esc(them)} `
          + `${home ? 'vs' : '@'} ${esc(home ? last.away_team : last.home_team)}</a>`);
      }
      if (mine.length) {
        const g = mine[0], home = g.home_team === team;
        glance.push(`<a class="dash-glance" href="${previewHref(g)}">`
          + `<span class="dash-line-label">Next</span> ${home ? 'vs' : '@'} ${esc(home ? g.away_team : g.home_team)} · `
          + `${esc(relDate(g.date))}${g.time_et ? ' ' + esc(g.time_et) : ''}</a>`);
      }
      const glanceHtml = `<div class="dash-team-glance">${glance.join('')}`
        + `<span class="dash-glance-status" id="dash-glance-status"></span>`
        + `<button type="button" class="dash-team-toggle" id="dash-team-toggle" aria-expanded="false" aria-controls="dash-team-more">More ▾</button></div>`;

      let html = '';

      // ── Cap and roster, read through cap-health.js
      const chips = [];
      const entry = capRows && (capRows.entries || []).find(e => e.team === team);
      if (entry && typeof CapHealth !== 'undefined') {
        const st = CapHealth.standing({
          season: entry.season,
          capLevels: { [entry.season]: { cap: entry.cap, apron1: entry.apron1, apron2: entry.apron2 } },
          teamState: { hard_cap: entry.hard_cap },
          teamSalaryFull: entry.salary,
          teamSalaryExHolds: entry.salary_ex_holds,
          standardCount: entry.roster,
          twoWayCount: entry.two_way,
          inSeason: entry.in_season,
          // § 2.1a's charge, already folded into the two salary figures above
          // by `cap_history.build_rows` and reported separately so this can
          // name the amount. Undefined on a row predating the field, which
          // standing() handles by naming the floor without a figure.
          erc: entry.empty_roster_charge == null ? undefined : {
            deficiency: entry.empty_roster_deficiency,
            charge: entry.empty_roster_charge,
          },
          draftRights: entry.draft_rights,
          // Homepage altitude for every figure it produces, so the notes read
          // in the same units as the Team Salary line beside them rather than
          // mixing "$135.0M" with "$29,915,676".
          fmt: fmtM,
        });
        const row = k => st.rows.find(r => r.key === k);
        const capRow = row('cap'), apron1Row = row('apron1'), apron2Row = row('apron2'), rosterRow = row('roster');
        // A team's hard cap (§ 1.4) is never a number of its own — it's
        // always pegged to the league's own Apron 1 or Apron 2 level, so a
        // separate "Hard Cap" line necessarily repeats whichever apron line
        // is already here. Boxing that line in place says the same thing
        // without a fourth line that just duplicates a number already shown.
        const hardCapKey = entry.hard_cap === 'first_apron' ? 'apron1'
          : entry.hard_cap === 'second_apron' ? 'apron2' : null;
        const threshLine = (label, r, key) => r
          ? `<span${key === hardCapKey
              ? ` class="dash-line-hardcap${key === 'apron2' ? ' apron2' : ''}" title="This team is hard-capped here"`
              : ''}>`
            + `<span class="dash-line-label">${esc(label)}</span> `
            + `<span class="dash-line-val tone-${esc(r.tone)}">${esc(r.note)}</span></span>`
          : '';
        html += '<div class="dash-sep"></div><div class="dash-lines">'
          + `<span><span class="dash-line-label">Team Salary</span> `
          + `<span class="dash-line-val">${esc(fmtM(entry.salary))}</span></span>`
          + threshLine('Soft Cap', capRow, 'cap')
          + threshLine('Apron 1', apron1Row, 'apron1')
          + threshLine('Apron 2', apron2Row, 'apron2')
          + (rosterRow ? `<span><span class="dash-line-label">Roster</span> `
            + `<span class="dash-line-val">${esc(rosterRow.value)}</span></span>` : '')
          + '</div>';
        // Only the rules that are actually binding. "Over the Salary Cap" is
        // the normal condition for most of the league and the line above
        // already says it in dollars, so notes are left out — same filter the
        // team page's always-visible card applies.
        //
        // `short`, not `text`: a chip is a glance, and the full § citation is
        // a paragraph in a pill. Both registers come from cap-health.js, so
        // this is picking one rather than paraphrasing a rule here.
        st.warnings
          .filter(w => w.severity === 'violation' || w.severity === 'caution')
          .forEach(w => chips.push({
            tone: w.severity, text: w.short || w.text, title: w.text,
            href: `/teams/${abbr}/`,
          }));
      }

      // ── Next games
      if (mine.length) {
        html += '<div class="dash-sep"></div><div class="dash-games dash-games--wide">'
          + mine.slice(0, 5).map(g => {
            const home = g.home_team === team;
            const opp = home ? g.away_team : g.home_team;
            return `<div class="dash-game">`
              + `<span class="dash-game-date">${esc(relDate(g.date))}</span>`
              + `<span class="dash-game-opp"><span>${home ? 'vs' : '@'}</span>${teamChip(opp, recs)}</span>`
              + streamTag(g)
              + `<span class="dash-game-time">${esc(g.time_et || '')}</span></div>`;
          }).join('') + '</div>';
      }

      html += '<div class="dash-sep"></div><div class="dash-chips" id="dash-chips"></div>';
      card.innerHTML = headHtml + glanceHtml + `<div class="dash-team-more" id="dash-team-more" hidden>${html}</div>`;
      card.hidden = false;

      // Open or closed is remembered per browser; closed unless you opened it.
      const moreEl = $('dash-team-more'), toggle = $('dash-team-toggle');
      const setOpen = open => {
        moreEl.hidden = !open;
        toggle.setAttribute('aria-expanded', String(open));
        toggle.textContent = open ? 'Less ▴' : 'More ▾';
      };
      try { setOpen(localStorage.getItem('nbn_dash_team_open') === '1'); } catch { setOpen(false); }
      toggle.addEventListener('click', () => {
        const open = moreEl.hidden;
        setOpen(open);
        try { localStorage.setItem('nbn_dash_team_open', open ? '1' : '0'); } catch {}
      });

      const chipBox = $('dash-chips');
      let settled = 0;
      const EXPECTED = 6;   // the async chip sources below
      // Differences from the league sheet are not a chip: they are bookkeeping
      // for the rosters committee, not something the owner acts on. They live
      // on /committees/rosters only.
      function paintChips() {
        // The collapsed card's one-word read of the chips, so a problem is
        // never hidden by the card being closed.
        const status = $('dash-glance-status');
        // A note (an FFA window, extension-eligible players) is news, not a
        // problem, so it is counted apart from the chips that need action.
        const bad = chips.filter(c => c.tone === 'violation').length;
        const act = chips.filter(c => c.tone === 'violation' || c.tone === 'caution').length;
        const notes = chips.length - act;
        status.className = 'dash-glance-status ' + (bad ? 'violation' : act ? 'caution' : notes ? 'note' : 'ok');
        status.textContent = act ? `${act} ${act === 1 ? 'thing needs' : 'things need'} you`
          : notes ? `${notes} ${notes === 1 ? 'update' : 'updates'}`
          : settled >= EXPECTED ? 'All clear' : '';
        if (!act && !notes && settled >= EXPECTED) status.dataset.icon = 'check';
        else delete status.dataset.icon;
        if (!chips.length) {
          chipBox.innerHTML = settled >= EXPECTED
            ? '<span class="dash-chip ok"><i class="ui-icon ui-icon--check" aria-hidden="true"></i> Nothing needs you right now</span>'
            : '<span class="dash-chip ok">Checking…</span>';
          return;
        }
        const rank = { violation: 0, caution: 1, note: 2 };
        chipBox.innerHTML = chips
          .slice()
          .sort((a, b) => (rank[a.tone] ?? 3) - (rank[b.tone] ?? 3))
          .map(c => `<a class="dash-chip ${esc(c.tone)}" href="${esc(c.href)}"`
            + (c.title ? ` title="${esc(c.title)}"` : '')
            + `>${esc(c.text)}</a>`)
          .join('');
      }
      const add = (tone, text, href, title) => { chips.push({ tone, text, href, title }); };
      const done = () => { settled++; paintChips(); };
      paintChips();

      // Coaching settings. `pending` is the streamer's queue, not the team's
      // obligation — the team's obligation is never having submitted at all,
      // so the two read differently here.
      // (Team pages have no hash routing, so these link to the page rather than
      // to a `#tab-coaching` anchor that would only scroll to a hidden panel.)
      jget('/api/coaching-settings', { headers: auth }).then(all => {
        const rec = all && all[team];
        if (!rec) add('caution', 'No coaching settings', `/teams/${abbr}/`,
                      'This team has never submitted a coaching-settings blob');
        else if (rec.pending) add('note', 'Coaching settings queued', `/teams/${abbr}/`,
                      'Saved, waiting for a streamer to enter them into 2K');
      }).catch(() => {}).then(done);

      // § 5.1 waiver wire. `my_claims` is scoped to the caller's own teams, so
      // this can say "you have not claimed" without ever reading another
      // team's sealed claim.
      jget('/api/waivers', { headers: auth }).then(list => {
        const open = (list || []).filter(w =>
          w.deadline && Date.parse(w.deadline) > Date.now() && !(w.my_claims || []).length);
        if (!open.length) return;
        const hrs = Math.max(0, Math.round((Date.parse(open[0].deadline) - Date.now()) / 3.6e6));
        add(hrs <= 24 ? 'caution' : 'note',
          `${open.length} on waivers · ${hrs}h left`, '/transactions',
          `${plural(open.length, 'player')} you have not claimed; the next window closes in ${plural(hrs, 'hour')}`);
      }).catch(() => {}).then(done);

      // Free-agent offers. `draft` is yours to submit and `returned` was sent
      // back to you; `submitted` is with the committee and needs nothing.
      jget(`/api/fa/offers?team=${encodeURIComponent(team)}`, { headers: auth }).then(offers => {
        const n = s => (offers || []).filter(o => o.status === s).length;
        if (n('returned')) add('violation', `${n('returned')} FA offer${n('returned') === 1 ? '' : 's'} returned`,
                                '/free-agency/', 'Remanded to you by the committee — needs another look');
        if (n('draft')) add('caution', `${n('draft')} FA offer${n('draft') === 1 ? '' : 's'} unsubmitted`,
                            '/free-agency/', 'Drafted but never submitted');
        if (n('submitted')) add('note', `${n('submitted')} offer${n('submitted') === 1 ? '' : 's'} pending`,
                                '/free-agency/', 'Submitted and with the committee — nothing needed from you');
      }).catch(() => {}).then(done);

      // Open FFA windows the league is bidding into. Public — § 9.2 already
      // announces these deadlines, so this is a reminder, not a leak.
      // Always a note: bidding is optional, so an open window never "needs
      // you". (It was a caution under 24h, which a 24h window always is.)
      jget('/api/fa/board').then(board => {
        const open = Object.entries((board && board.players) || [])
          .filter(([, p]) => p.ffa_deadline && Date.parse(p.ffa_deadline) > Date.now())
          .sort((a, b) => Date.parse(a[1].ffa_deadline) - Date.parse(b[1].ffa_deadline));
        if (!open.length) return;
        const hrs = Math.max(0, Math.round((Date.parse(open[0][1].ffa_deadline) - Date.now()) / 3.6e6));
        add('note',
          `${open.length} FFA open · ${hrs}h left`, '/free-agency/',
          `${plural(open.length, 'free agent')} accepting offers; the next window closes in ${plural(hrs, 'hour')}`);
      }).catch(() => {}).then(done);

      // § 6.2 extension eligibility, computed by the API with its own reason
      // string — nothing about the rule is re-derived here.
      jget('/api/poext/eligible').then(list => {
        const n = (list || []).filter(p => p.team === team && p.eligible).length;
        if (n) add('note', `${n} extension-eligible`, '/extensions/',
                   `${plural(n, 'player')} on this roster meets § 6.2's eligibility rules`);
      }).catch(() => {}).then(done);

      // Guarantee/vesting dates inside 30 days. Reads `guarantee_schedule`,
      // the field /calendar renders from; its `guarantee_dates` fallback is
      // dead league-wide (present on 625 players, non-empty on none), so
      // leaving it out cannot change what shows. Deferred to an idle callback:
      // /api/players is 83KB gzipped, by far the heaviest thing here, and no
      // part of the visible page waits on it.
      const soon = () => jget('/api/players').then(bios =>
        fetch(`/data/${abbr}-roster.csv`).then(r => r.ok ? r.text() : '').then(csv => {
          const lines = csv.trim().split('\n');
          if (lines.length < 2) return;
          const iSlug = lines[0].split(',').indexOf('SLUG');
          if (iSlug < 0) return;
          const slugs = new Set(lines.slice(1).map(l => l.split(',')[iSlug]).filter(Boolean));
          const steps = [];
          slugs.forEach(slug => {
            const sch = (bios[slug] || {}).guarantee_schedule || {};
            Object.values(sch).forEach(list => {
              (Array.isArray(list) ? list : []).forEach(s => {
                if (s && s.date && s.date >= today) steps.push({ slug, date: s.date, amount: s.amount });
              });
            });
          });
          steps.sort((a, b) => a.date.localeCompare(b.date));
          if (!steps.length) return;
          const d = daysUntil(today, steps[0].date);
          if (d > 30) return;
          const amt = steps[0].amount ? ` · ${fmtM(steps[0].amount)}` : '';
          add(d <= 7 ? 'caution' : 'note',
            `Guarantee in ${d}d${amt}`, '/calendar',
            `${steps[0].slug} — ${steps[0].date}`);
        })).catch(() => {}).then(done);
      if (window.requestIdleCallback) requestIdleCallback(soon, { timeout: 3000 });
      else setTimeout(soon, 800);
    });
  })();
  </script>
  <script>
  // ── Live banner ─────────────────────────────────────────────────────────
  //
  // The Twitch player, only while twitch.tv/nothingbutnet is live. The page
  // can't ask Twitch itself (Helix needs the client secret), so it asks
  // `GET /api/stream/live`, which checks at most once a minute for everyone.
  // Offline, the banner stays `hidden` and no Twitch iframe ever loads, so
  // the homepage is exactly what it is without this block.
  //
  // Its own script, like every dash card: it fails alone.
  (function () {
    'use strict';
    const POLL_MS = 120000;
    const CHANNEL = 'nothingbutnet';
    const el = document.getElementById('live-banner');
    if (!el) return;
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // Twitch refuses to play an embed whose `parent` isn't the host serving it.
    // Muted, because browsers block autoplay with sound.
    const playerSrc = () => 'https://player.twitch.tv/?channel=' + CHANNEL
      + '&parent=' + encodeURIComponent(location.hostname) + '&muted=true&autoplay=true';

    function show(s) {
      const meta = [s.game, s.viewers != null ? `${Number(s.viewers).toLocaleString()} watching` : '']
        .filter(Boolean).join(' · ');
      const head = `<span class="live-pill"><span class="live-dot"></span>LIVE</span>`
        + `<span class="live-title">${esc(s.title || 'Nothing But Net is live')}</span>`
        + (meta ? `<span class="live-meta">${esc(meta)}</span>` : '')
        + `<a class="live-link" href="https://www.twitch.tv/${CHANNEL}" target="_blank" rel="noopener">Watch on Twitch ↗</a>`;
      const headEl = el.querySelector('.live-head');
      if (headEl) {
        // Already playing: refresh the text, never rebuild the iframe (that restarts it).
        headEl.innerHTML = head;
      } else {
        el.innerHTML = `<div class="live-head">${head}</div>`
          + `<div class="live-player"><iframe src="${esc(playerSrc())}" title="Nothing But Net on Twitch"`
          + ` allow="autoplay; fullscreen" allowfullscreen></iframe></div>`;
      }
      el.hidden = false;
    }

    function hide() {
      el.hidden = true;
      el.innerHTML = '';
    }

    function check() {
      fetch('/api/stream/live')
        .then(r => (r.ok ? r.json() : Promise.reject()))
        .then(s => (s && s.live ? show(s) : hide()))
        // A failed check leaves things as they are rather than cutting off a stream mid-watch.
        .catch(() => {});
    }

    check();
    setInterval(() => { if (document.visibilityState === 'visible') check(); }, POLL_MS);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') check();
    });
  })();
  </script>
</body>
</html>

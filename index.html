<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="/theme-boot.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/shared.css">
  <title>NBN - Nothing But Net</title>
  <!-- NBN:og -->
  <meta name="description" content="Owner history, team pages, standings, player profiles, draft history and stats leaderboards for the NBN fantasy basketball GM simulation league.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NBN">
  <meta property="og:title" content="NBN - Nothing But Net">
  <meta property="og:description" content="Owner history, team pages, standings, player profiles, draft history and stats leaderboards for the NBN fantasy basketball GM simulation league.">
  <meta property="og:url" content="https://nbn.today/">
  <meta property="og:image" content="https://nbn.today/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Nothing But Net — fantasy basketball GM simulation league">

  <meta name="theme-color" content="#0d0e11">
  <link rel="icon" href="/icons/favicon.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <!-- /NBN:og -->
  <style>

    .page-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem 4rem;
    }

    /* page-wrap's align-items:center shrinks block children to content
       width by default — .nav needs the full width so its internal
       margin-left:auto can push the theme picker to the actual right edge. */
    .page-wrap > .nav {
      align-self: stretch;
    }

    /* ── Dashboard ────────────────────────────────────────────────────────
       Sits below the header. Every band renders independently and hides
       itself if its data never arrives, so a slow or failed endpoint costs
       one card rather than the page. Site search lives in the shared nav
       bar (nav.js) like every other page — no separate home search box. */

    .dash-card { min-width: 0; }

    /* Band 1 — your team */
    .dash-team-head {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    /* Logo, name and record are one link to the team's own page — the most
       likely next click from this card by a distance. */
    .dash-team-id {
      display: flex; align-items: center; gap: 0.75rem;
      text-decoration: none; color: inherit; min-width: 0;
    }
    .dash-team-id:hover .dash-team-name { color: var(--link); }
    .dash-team-head img { height: 42px; width: 42px; object-fit: contain; }
    .dash-team-name { font-family: var(--font-display); font-size: var(--text-lg); font-weight: 700; line-height: 1.05; letter-spacing: 0.02em; text-transform: uppercase; }
    .dash-team-sub  { font-size: var(--text-xs); color: var(--text-muted); margin-top: 0.1rem; }
    .dash-team-right { margin-left: auto; text-align: right; }
    .dash-team-phase { font-size: var(--text-base); font-weight: 600; color: var(--gold-alt); }
    .dash-team-phase-sub { font-size: var(--text-xs); color: var(--text-muted); margin-top: 0.1rem; }

    .dash-sep { border-top: 1px solid var(--border-subtle); margin: 0.75rem 0; }
    .dash-team-glance { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 1.25rem; margin-top: 0.75rem; font-size: var(--text-sm); }
    .dash-glance { color: var(--text-secondary); text-decoration: none; font-variant-numeric: tabular-nums; }
    .dash-glance:hover { color: var(--link); }
    .dash-glance .tone-ok { color: var(--success); font-weight: 700; }
    .dash-glance .tone-violation { color: var(--danger); font-weight: 700; }
    .dash-glance-status { font-size: var(--text-xs); font-weight: 600; }
    .dash-glance-status.ok { color: var(--success); }
    .dash-otd-trophy { color: var(--gold); }
    .dash-glance-status.caution { color: var(--gold); }
    .dash-glance-status.violation { color: var(--danger); }
    .dash-glance-status.note { color: var(--text-muted); }
    .dash-team-toggle { margin-left: auto; padding: 0.15rem 0.5rem; border: 1px solid var(--border); border-radius: var(--radius-sm); background: none; color: var(--text-muted); font: inherit; font-size: var(--text-xs); cursor: pointer; }
    .dash-team-toggle:hover { color: var(--text-primary); border-color: var(--text-muted); }

    .dash-lines { display: flex; flex-wrap: wrap; gap: 0.4rem 1.5rem; font-size: var(--text-sm); }
    .dash-line-label { color: var(--text-muted); }
    .dash-line-val   { color: var(--text-secondary); font-weight: 600; }
    /* Same tone → color mapping as the team page's Cap Health card
       (.ch-tone-* in teams/team.js) — one vocabulary for "over" vs "under"
       rather than a second one invented for this card. */
    .dash-line-val.tone-over      { color: var(--danger); }
    .dash-line-val.tone-under     { color: var(--success); }
    .dash-line-val.tone-unknown   { color: var(--text-dim); font-style: italic; }
    /* Flags whichever of the Apron 1/Apron 2 lines is this team's actual
       hard cap (§ 1.4) — see the threshLine/hardCapKey comment below. Same
       gold/red-by-apron-level vocabulary as .hardcap-chip and .hard-cap-banner
       (teams/team.js) — a color this card hasn't invented on its own. */
    .dash-line-hardcap {
      display: inline-flex; align-items: baseline; gap: 0.35rem;
      padding: 0.1rem 0.55rem; border-radius: var(--radius-sm);
      border: 1px solid var(--gold-border); background: var(--gold-bg);
    }
    .dash-line-hardcap.apron2 { border-color: var(--danger-border-strong); background: var(--danger-bg); }
    .dash-line-hardcap .dash-line-label,
    .dash-line-hardcap .dash-line-val { font-weight: 800; }

    .dash-games { display: flex; flex-direction: column; gap: 0.3rem; }
    .dash-game {
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.1rem 0.6rem;
      font-size: var(--text-sm); color: var(--text-secondary);
    }
    .dash-game-day {
      font-size: var(--text-xs); font-weight: 600; color: var(--text-muted);
      margin-top: var(--space-2);
    }
    .dash-game-day:first-child { margin-top: 0; }
    .dash-game-date { color: var(--text-muted); width: 3.6rem; flex: none; }
    .dash-game-opp  { font-weight: 600; display: inline-flex; align-items: center; gap: 0.35rem; min-width: 0; }
    .dash-game-team { display: inline-flex; align-items: center; gap: 0.35rem; color: inherit; text-decoration: none; }
    .dash-game-team:hover span:not(.dash-game-rec) { text-decoration: underline; }
    .dash-game-logo { height: 18px; width: 18px; object-fit: contain; flex: none; }
    #dash-slate .dash-card-title { display: flex; align-items: center; gap: 0.6rem; }
    /* The stream tag takes its own line under the matchup: in the 20rem column
       there's no room for it beside the teams, the record and the time, and
       squeezed in it cut the streamer's name off and wrapped the record. */
    .dash-game-stream {
      order: 1; flex-basis: 100%; padding-left: 1.05rem;
      color: var(--text-muted); font-size: var(--text-xs);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
    }
    /* Once played, the game's video (vod.js) takes the stream tag's place, and
       its line: a zero-height full-width item breaks the row, so the button
       sits under the matchup at its own size and the time stays up top. */
    /* The team card spans the page, so there the tag sits beside the matchup. */
    .dash-games--wide .dash-game-stream { order: 0; flex-basis: auto; padding-left: 0.75rem; }
    .dash-games--wide .dash-game-date { width: 4.8rem; }
    .dash-game:has(> .vod-watch, > .vod-pending)::after { content: ''; order: 1; flex-basis: 100%; height: 0; }
    .dash-game > .vod-watch, .dash-game > .vod-pending { order: 2; margin-left: 1.05rem; }
    .dash-game-time { color: var(--text-muted); font-size: var(--text-xs); margin-left: auto; flex: none; white-space: nowrap; font-variant-numeric: tabular-nums; }

    /* Action chips — the obligations band. Tone matches cap-health.js's
       severities so a violation reads the same here as on the team page. */
    .dash-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .dash-chip {
      display: inline-flex; align-items: center; gap: 0.35rem;
      font-size: var(--text-xs); padding: 0.25rem 0.6rem; border-radius: var(--radius);
      border: 1px solid var(--border); color: var(--text-secondary);
      background: var(--bg-subtle); text-decoration: none;
      /* cap-health.js's warning text is a full rule statement — "16 standard
         players — § 2.1 allows 20 in the offseason, so this is legal now, but
         1 must go before opening night". It is shown verbatim rather than
         abbreviated here, because a shorter label would be a second copy of a
         vocabulary that already exists in one place. So chips wrap. */
      max-width: 100%; text-align: left; line-height: 1.35;
    }
    a.dash-chip:hover { border-color: var(--muted-border); color: var(--text-primary); }
    .dash-chip.violation { border-color: var(--danger-border); background: var(--danger-bg); color: var(--danger-light); }
    .dash-chip.caution   { border-color: var(--gold-border);   background: var(--gold-bg);   color: var(--gold); }
    .dash-chip.ok        { color: var(--text-muted); }

    /* Kind, team and search over the loaded rows. One line on a wide card;
       on a phone the switch keeps its own line and the other two share one. */
    .dash-feed-filters {
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem;
      margin-bottom: 0.8rem;
    }
    .dash-feed-kinds { flex: none; max-width: 100%; overflow-x: auto; }
    .dash-feed-teamsel { flex: none; height: 2rem; font-size: var(--text-xs); }
    .dash-feed-search { flex: 1 1 10rem; min-width: 0; height: 2rem; font-size: var(--text-sm); }

    /* Injury report — the current 2K injury list, as a table laid out like
       the game's own screen. It scrolls inside the card, as the game's list
       does, so a long injury list doesn't push the rest of the page down. */
    .dash-inj-date { font-size: var(--text-xs); color: var(--text-muted); margin-left: 0.5rem; font-weight: 400; }
    .dash-inj-scroll { max-height: 18rem; overflow: auto; }
    .dash-inj-scroll thead th { position: sticky; top: 0; z-index: 1; background: var(--bg-card); }
    .dash-inj-table td { white-space: normal; }
    .dash-inj-table td.nowrap { white-space: nowrap; }
    .dash-inj-player { display: inline-flex; align-items: center; gap: 0.4rem; color: var(--text-primary); font-weight: 600; text-decoration: none; }
    .dash-inj-player:hover { color: var(--link); }
    .dash-inj-player img { width: 16px; height: 16px; flex: none; }
    .dash-inj-table .dash-inj-out { color: var(--danger); font-weight: 600; }
    .dash-inj-table .dash-inj-hurt { color: var(--gold); font-weight: 600; }
    .dash-inj-status-sm { display: none; font-size: var(--text-xs); margin-top: 0.1rem; }
    .dash-inj-drop { color: var(--danger); }
    /* On a phone, OVR drops and Status moves under the player's name, so
       Injury has room to wrap and the table fits the card rather than
       scrolling sideways inside it. */
    @media (max-width: 560px) {
      .dash-inj-table .dash-inj-ovr, .dash-inj-table .dash-inj-status { display: none; }
      .dash-inj-status-sm { display: block; }
      .dash-inj-table th, .dash-inj-table td { padding-left: 0.4rem; padding-right: 0.4rem; }
    }

    /* Power rankings — a horizontal standing rather than a fourth column in
       the row above, which at 820px would leave each card too narrow to hold
       a trade description. */
    .dash-ranks-head {
      display: flex; align-items: baseline; gap: 0.75rem;
      flex-wrap: wrap; margin-bottom: 0.7rem;
    }
    .dash-ranks-edition {
      margin-left: auto; font-size: var(--text-xs); color: var(--text-muted);
    }
    .dash-ranks-head .dash-standings-head { margin-bottom: 0; align-self: stretch; }

    /* A table, not a row of pills. As chips these wrapped to one or two per
       line on a phone, which is the least scannable possible shape for an
       ordered list — the ranks ended up in a zigzag. Four equal columns on a
       wide screen (two even rows of the top 8), one column of full-width rows
       on a narrow one; either way every rank sits at the same x as the one
       above it. */
    .dash-ranks-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.25rem;
    }
    .dash-rank-team {
      display: flex; align-items: center; gap: 0.45rem;
      padding: 0.35rem 0.5rem; border-radius: var(--radius-sm);
      text-decoration: none; color: var(--text-secondary);
      transition: background 0.15s;
      min-width: 0;
    }
    .dash-rank-team:hover { background: var(--bg-hover); }
    .dash-rank-team img { height: 20px; width: 20px; object-fit: contain; flex: none; }
    .dash-rank-pos {
      color: var(--text-muted); font-size: var(--text-xs);
      font-variant-numeric: tabular-nums; text-align: right;
      min-width: 1.4rem; flex: none;
    }
    .dash-rank-abbr { font-size: var(--text-sm); font-weight: 600; }
    .dash-rank-team .rank-move { flex: none; }

    @media (max-width: 700px) {
      .dash-ranks-row { grid-template-columns: 1fr; gap: 0; }
      .dash-rank-team { border-radius: 0; padding: 0.4rem 0.35rem; }
      .dash-rank-team + .dash-rank-team { border-top: 1px solid var(--border-subtle); }
      /* Stacked, the rows read down the page, so the movement belongs in its
         own right-hand column that lines up. Side by side across five columns
         it must not: pushed right, PHX's "–" sits nearer "2 CHI" than PHX and
         reads as CHI's. Each entry stays one group instead. */
      .dash-rank-team .rank-move { margin-left: auto; }
    }

    /* Same vocabulary as the published table's moveCell(). */
    .rank-move { font-size: var(--text-xs); font-family: var(--font-mono); }
    .rank-move.up   { color: var(--success); }
    .rank-move.down { color: var(--danger); }
    .rank-move.flat { color: var(--text-dim); }
    .rank-move.new  { color: var(--gold); font-size: var(--text-xs); text-transform: uppercase; }

    .dash-empty { font-size: var(--text-xs); color: var(--text-muted); }

    /* Skeleton — a card that has asked but not yet answered. */
    .dash-skel {
      height: 0.72rem; border-radius: var(--radius-sm);
      background: var(--bg-hover); opacity: 0.5;
      animation: dash-pulse 1.3s ease-in-out infinite;
      margin-bottom: 0.45rem;
    }
    @keyframes dash-pulse { 0%,100% { opacity: 0.28; } 50% { opacity: 0.6; } }

    /* ══ Layout ═════════════════════════════════════════════════════════════
       Sections instead of boxes. Every part of the page used to be its own
       bordered card with a tiny capitalised label, so nothing was more
       important than anything else. The feed is the main column, the schedule
       and rankings are a sidebar, and sections are separated by space and a
       single rule. The page list that used to follow is the site sidebar now
       (nav.js NAV_SECTIONS).

       These began as a preview behind ?design=clean and were adopted on
       2026-09-24. The :root prefix is what lets them beat the older card-era
       rules above that they override; folding the two together is cleanup
       that hasn't been done yet. */

    :root .page-wrap {
      align-items: stretch;
      max-width: var(--page-width-wide);
      margin: 0 auto;
      padding-top: 2rem;
    }
    /* Beside the docked sidebar the body's own top padding is enough: the
       ticker then lines up with the sidebar's logo instead of sitting a
       band below it. */
    @media (min-width: 900px) {
      html[data-sidebar] .page-wrap { padding-top: 0; }
    }

    /* Ticker: the latest night's finals, its top performers, then the
       injury report, on a loop.
       The strip holds the items twice and slides by half its width, so the
       second copy lands exactly where the first began.
       It scrolls even under prefers-reduced-motion, on purpose: hover and
       focus pause it, and the still fallback was a bare scrollbar. */
    .ticker[hidden] { display: none; }
    .ticker {
      display: flex; align-items: stretch; min-width: 0; height: 2.5rem;
      margin-bottom: var(--space-6); overflow: hidden;
      background: var(--bg-subtle); border: 1px solid var(--border); border-radius: var(--radius-sm);
    }
    .ticker-label {
      display: flex; align-items: center; gap: 0.4rem; flex-shrink: 0; padding: 0 0.85rem;
      background: var(--accent); color: var(--text-on-accent);
      font-family: var(--font-display); font-size: var(--text-base); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap;
    }
    .ticker-label span { font-weight: 600; opacity: 0.85; letter-spacing: 0.02em; }
    .ticker-track {
      flex: 1 1 auto; min-width: 0; overflow: hidden;
      -webkit-mask-image: linear-gradient(90deg, transparent, black 1.5rem, black calc(100% - 1.5rem), transparent);
              mask-image: linear-gradient(90deg, transparent, black 1.5rem, black calc(100% - 1.5rem), transparent);
    }
    .ticker-strip {
      display: flex; align-items: center; width: max-content; height: 100%;
      animation: ticker-scroll var(--ticker-dur, 60s) linear infinite;
    }
    .ticker:hover .ticker-strip, .ticker:focus-within .ticker-strip { animation-play-state: paused; }
    @keyframes ticker-scroll { to { transform: translateX(-50%); } }
    .ticker-item {
      display: inline-flex; align-items: center; gap: 0.35rem; padding: 0 1rem; height: 100%;
      color: var(--text-secondary); font-size: var(--text-sm); white-space: nowrap; text-decoration: none;
      border-right: 1px solid var(--border); font-variant-numeric: tabular-nums;
    }
    a.ticker-item:hover { color: var(--text-primary); text-decoration: none; background: var(--bg-hover, transparent); }
    .ticker-item img { width: 18px; height: 18px; object-fit: contain; }
    .ticker-item b { color: var(--text-primary); font-family: var(--font-display); font-size: var(--text-md); font-weight: 700; }
    .ticker-item .ticker-final { color: var(--text-muted); font-size: var(--text-xs); font-weight: 700; margin-left: 0.15rem; }
    .ticker-item .ticker-stat { color: var(--text-muted); font-size: var(--text-xs); font-weight: 600; margin-right: 0.25rem; }
    .ticker-item .ticker-out { color: var(--danger); font-size: var(--text-xs); font-weight: 700; }
    .ticker-item .ticker-hurt { color: var(--gold); font-size: var(--text-xs); font-weight: 700; }
    a.ticker-head:hover { text-decoration: none; background: var(--bg-hover, transparent); }
    .ticker-head .ticker-more { margin-left: 0.4rem; color: var(--text-muted); font-weight: 600; letter-spacing: 0.02em; text-transform: none; }
    .ticker-head {
      display: inline-flex; align-items: center; padding: 0 1rem; height: 100%; white-space: nowrap;
      color: var(--accent-light); font-family: var(--font-display); font-size: var(--text-base); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      border-right: 1px solid var(--border);
    }
    @media (max-width: 600px) {
      .ticker-label span { display: none; }
    }

    /* Two columns: the feed, and a sidebar of schedule + rankings. The
       wrapper around slate and feed steps aside (display: contents) so both
       can be placed on the page grid directly. */
    :root .dash {
      max-width: none;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 20rem;
      grid-template-areas:
        "live  side"
        "hero  side"
        "team  side"
        "main  side";
      /* The side column spans all three rows, so it starts at the headline;
         the last row takes the slack, or the auto rows would spread out to
         match a side column taller than they are. */
      grid-template-rows: auto auto auto 1fr;
      gap: 0 var(--space-5);
      align-items: start;
      margin-bottom: var(--space-7);
    }
    :root #live-banner { grid-area: live; }
    :root #dash-hero  { grid-area: hero; }
    :root #dash-team  { grid-area: team; }
    :root .dash-main  { grid-area: main; min-width: 0; }
    :root .dash-side  { grid-area: side; min-width: 0; }

    /* One column: the two wrappers step aside so the cards can be ordered
       one by one — the schedule belongs above the feed on a phone. */
    @media (max-width: 900px) {
      :root .dash {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: none;
        grid-template-areas: "live" "hero" "team" "slate" "streamvod" "boxvod" "best" "standings" "race" "rookies" "feed" "tweets" "injuries" "ranks" "milestones" "otd" "movers";
      }
      :root .dash-main, :root .dash-side { display: contents; }
      :root #dash-best      { grid-area: best; }
      :root #dash-stream-vod { grid-area: streamvod; }
      :root #dash-box-vod   { grid-area: boxvod; }
      :root #dash-feed      { grid-area: feed; }
      :root #dash-tweets    { grid-area: tweets; }
      :root #dash-injuries  { grid-area: injuries; }
      :root #dash-slate     { grid-area: slate; }
      :root #dash-standings { grid-area: standings; }
      :root #dash-ranks     { grid-area: ranks; }
      :root #dash-movers    { grid-area: movers; }
      :root #dash-race      { grid-area: race; }
      :root #dash-rookies   { grid-area: rookies; }
      :root #dash-milestones { grid-area: milestones; }
      :root #dash-otd       { grid-area: otd; }
    }

    /* Team links in game rows: logo, abbreviation, and this season's record
       once there is one. */
    .dash-game-rec { color: var(--text-muted); font-weight: 400; font-size: var(--text-xs); font-variant-numeric: tabular-nums; white-space: nowrap; }

    /* Last night's best: three performances side by side. */
    .dash-best-title-date { color: var(--text-muted); font-weight: 400; font-size: var(--text-sm); margin-left: 0.4rem; }
    .dash-best-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .dash-best-item {
      display: flex; flex-direction: column; gap: 0.35rem;
      padding: var(--space-2) var(--space-4); border-left: 1px solid var(--border);
      color: inherit; text-decoration: none; min-width: 0;
      position: relative; overflow: hidden;
    }
    .dash-best-item:first-child { border-left: 0; padding-left: 0; }
    .dash-best-item:hover .dash-best-name { color: var(--link); }
    .dash-best-top { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
    .dash-best-photo {
      width: 52px; height: 52px; border-radius: 50%; flex: none;
      object-fit: cover; object-position: top; background: var(--bg-hover);
    }
    .dash-best-name { font-weight: 700; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; }
    .dash-best-game { display: flex; align-items: center; gap: 0.3rem; font-size: var(--text-xs); color: var(--text-muted); margin-top: 0.15rem; }
    .dash-best-game img { width: 16px; height: 16px; object-fit: contain; }
    .dash-best-line { font-family: var(--font-display); font-size: var(--text-xl); font-weight: 700; line-height: 1; color: var(--text-primary); }
    .dash-best-line span { font-size: var(--text-sm); font-family: inherit; color: var(--text-muted); font-weight: 600; margin: 0 0.5rem 0 0.1rem; text-transform: uppercase; }
    .dash-best-gmsc { font-size: var(--text-xs); color: var(--text-muted); }
    .dash-best-rank {
      position: absolute; top: var(--space-2); right: var(--space-4);
      font-family: var(--font-display); font-size: var(--text-lg); font-weight: 700;
      color: var(--text-dim);
    }
    @media (max-width: 600px) {
      .dash-best-row { grid-template-columns: minmax(0, 1fr); }
      .dash-best-item { border-left: 0; padding: var(--space-3) 0; border-top: 1px solid var(--border-subtle); }
      .dash-best-item:first-child { border-top: 0; }
      .dash-best-rank { right: 0; }
    }

    /* Latest stream / box scores: a thumbnail that becomes the player on
       click, so the page doesn't load a YouTube player on every visit. */
    .dash-vod {
      display: flex; flex-direction: column; min-width: 0;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--bg-card); overflow: hidden;
    }
    .dash-vod:hover { border-color: var(--accent); }
    .dash-vod-frame { position: relative; aspect-ratio: 16 / 9; background: black; }
    .dash-vod-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .dash-vod-play {
      position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; border: 0;
      display: flex; align-items: center; justify-content: center;
      background: black center / cover no-repeat; cursor: pointer;
    }
    .dash-vod-play .vod-icon { width: 52px; height: 37px; opacity: 0.9; transition: opacity 0.15s, transform 0.15s; }
    .dash-vod-play:hover .vod-icon, .dash-vod-play:focus-visible .vod-icon { opacity: 1; transform: scale(1.08); }
    .dash-vod-cap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.25rem var(--space-4); padding: var(--space-2) var(--space-3); min-width: 0; font-size: var(--text-sm); }
    .dash-vod-teams { display: flex; align-items: center; gap: 0.3rem; font-weight: 700; min-width: 0; white-space: nowrap; }
    .dash-vod-teams img { width: 16px; height: 16px; object-fit: contain; }
    .dash-vod-meta { display: flex; align-items: center; gap: var(--space-2); min-width: 0; }
    .dash-vod-teams .at { color: var(--text-muted); font-weight: 400; }
    .dash-vod-score { font-size: var(--text-xs); color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; text-decoration: none; }
    a.dash-vod-score:hover { color: var(--link); }
    .dash-vod-score .win { color: var(--text-primary); font-weight: 700; }
    .dash-vod-yt { font-size: var(--text-xs); color: var(--text-muted); white-space: nowrap; text-decoration: none; }
    .dash-vod-yt:hover { color: var(--link); }

    /* Standings: East and West side by side in the sidebar. */
    .dash-standings-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: var(--space-3); }
    :root .dash-standings-head .dash-card-title { margin: 0; }
    .dash-stand-gb { margin-left: 0.4rem; font-size: var(--text-xs); color: var(--text-muted); font-variant-numeric: tabular-nums; min-width: 1.8rem; text-align: right; }
    .dash-standings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4) var(--space-6); }
    .dash-stand-line { margin: 0.25rem 0; padding-top: 0.2rem; border-top: 1px dashed var(--border); font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
    .dash-stand-line + .dash-stand-row { border-top: none; }
    .dash-stand-mark { margin-left: 0.3rem; font-size: var(--text-xs); font-weight: 600; color: var(--success); }
    .dash-race-lead { display: flex; flex-direction: column; gap: 0.1rem; margin-bottom: 0.35rem; }
    .dash-race-award { font-size: var(--text-xs); font-weight: 600; color: var(--text-muted); width: 2.8rem; flex-shrink: 0; }
    .dash-race-row { display: flex; align-items: center; gap: 0.4rem; padding: 0.3rem 0; font-size: var(--text-sm); color: var(--text-secondary); text-decoration: none; }
    .dash-race-row + .dash-race-row { border-top: 1px solid var(--border-subtle); }
    .dash-race-row img { width: 16px; height: 16px; object-fit: contain; }
    .dash-race-row:hover .dash-race-name { color: var(--link); }
    .dash-race-name { font-weight: 600; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dash-race-num { margin-left: auto; font-size: var(--text-xs); color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .dash-conf-name { display: flex; align-items: baseline; gap: 0.35rem; font-size: var(--text-xs); font-weight: 600; color: var(--text-muted); margin-bottom: 0.3rem; }
    /* Column labels on the conference line, over the record and GB. */
    .dash-conf-name .dash-conf-col { font-size: var(--text-xs); font-weight: 400; text-transform: uppercase; letter-spacing: 0.06em; flex-shrink: 0; }
    .dash-conf-name .dash-conf-col:first-of-type { margin-left: auto; }
    .dash-conf-name .dash-conf-col.dash-stand-gb { font-size: var(--text-xs); }
    .dash-stand-row {
      display: flex; align-items: center; gap: 0.35rem; padding: 0.25rem 0;
      font-size: var(--text-sm); color: var(--text-secondary); text-decoration: none;
    }
    .dash-stand-row + .dash-stand-row { border-top: 1px solid var(--border-subtle); }
    .dash-stand-row:hover .dash-stand-abbr { color: var(--link); }
    .dash-stand-seed { width: 1rem; color: var(--text-muted); font-size: var(--text-xs); font-variant-numeric: tabular-nums; }
    .dash-stand-row img { width: 18px; height: 18px; object-fit: contain; }
    .dash-stand-abbr { font-weight: 600; color: var(--text-primary); }
    /* Records vary in width ("0–0", "12–14"), so they sit centred in a fixed
       column with the W–L label (same class) over them. Phones have no width
       to spare: there both right-align instead. */
    .dash-stand-rec { margin-left: auto; min-width: 2.6rem; text-align: center; font-variant-numeric: tabular-nums; font-size: var(--text-xs); color: var(--text-muted); white-space: nowrap; }
    /* A record or GB figure never breaks across lines ("1–\n0"); on a phone
       the two conferences share ~170px each, so tighten the row instead. */
    .dash-stand-abbr, .dash-stand-gb { white-space: nowrap; }
    .dash-stand-row > * { flex-shrink: 0; }
    @media (max-width: 520px) {
      .dash-standings-grid { column-gap: var(--space-4); }
      .dash-stand-row { gap: 0.25rem; }
      .dash-conf-name { gap: 0.25rem; }
      .dash-stand-rec { min-width: 0; text-align: right; }
      .dash-stand-gb { margin-left: 0.25rem; min-width: 1.5rem; }
    }
    @media (max-width: 360px) {
      .dash-standings-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: var(--space-3); }
      .dash-stand-row img { width: 14px; height: 14px; }
      .dash-stand-gb { margin-left: 0.15rem; min-width: 1.4rem; }
    }

    /* Ratings movers: risers, then fallers, in the standings' row style. */
    .dash-movers-group + .dash-movers-group { margin-top: var(--space-3); }
    .dash-mover-fa { width: 18px; flex: none; text-align: center; font-size: var(--text-xs); font-weight: 700; color: var(--text-muted); }
    .dash-mover-name { font-weight: 600; color: var(--text-primary); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dash-stand-row:hover .dash-mover-name { color: var(--link); }
    .dash-mover-ovr { margin-left: auto; flex: none; font-variant-numeric: tabular-nums; font-size: var(--text-xs); color: var(--text-muted); }
    .dash-mover-ovr .rank-move { margin-left: 0.3rem; }

    /* Milestone watch: the standings' row style, with the milestone on a
       second line — the sidebar is too narrow for both on one. */
    .dash-ms-row { flex-wrap: wrap; row-gap: 0.1rem; }
    /* Rookie watch: the draft pick, small, just after the name. */
    .dash-rookie-pick { flex: none; font-size: var(--text-xs); color: var(--text-muted); white-space: nowrap; }
    .dash-otd-row { display: grid; grid-template-columns: 2.6rem 1fr; gap: 0.5rem; padding: 0.35rem 0; color: var(--text-secondary); text-decoration: none; font-size: var(--text-sm); line-height: 1.35; }
    .dash-otd-row + .dash-otd-row { border-top: 1px solid var(--border-subtle); }
    a.dash-otd-row:hover .dash-otd-what { color: var(--link); }
    .dash-otd-year { font-family: var(--font-display); font-weight: 700; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .dash-otd-what b { color: var(--text-primary); font-weight: 600; }
    .dash-otd-sub { color: var(--text-muted); font-size: var(--text-xs); }
    .dash-otd-what .dash-feed-team img { width: 14px; height: 14px; }

    /* NBN Twitter: made-up accounts reacting to the latest game day. */
    .dash-tw { display: grid; grid-template-columns: 2.25rem 1fr; gap: 0 0.6rem; padding: 0.6rem 0; }
    .dash-tw + .dash-tw { border-top: 1px solid var(--border-subtle); }
    .dash-tw-av { width: 2.25rem; height: 2.25rem; border-radius: var(--radius-sm); object-fit: cover; background: var(--bg-hover); }
    .dash-tw-av--init { display: grid; place-items: center; background: var(--accent); color: var(--text-on-accent); font-weight: 700; font-size: var(--text-sm); }
    .dash-tw-av--logo { object-fit: contain; padding: 0.2rem; }
    .dash-tw-who { font-size: var(--text-xs); line-height: 1.3; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dash-tw-who b { color: var(--text-primary); }
    .dash-tw-who span { color: var(--text-muted); }
    .dash-tw-text { font-size: var(--text-sm); line-height: 1.45; color: var(--text-secondary); margin-top: 0.1rem; white-space: pre-line; overflow-wrap: anywhere; }
    .dash-tw-foot { display: flex; gap: 1rem; margin-top: 0.3rem; font-size: var(--text-xs); color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .dash-tw-foot a { color: var(--text-muted); }
    .dash-tw-foot a:hover { color: var(--link); }
    .dash-tw-more { margin-top: 0.4rem; }
    .dash-ms-what { flex-basis: 100%; padding-left: calc(18px + 0.35rem); font-size: var(--text-xs); color: var(--text-muted); }

    /* A slate row's time links to that game's preview. */
    a.dash-game-time { color: var(--text-muted); text-decoration: none; }
    a.dash-game-time:hover { color: var(--link); }
    .dash-game-time.final .win { color: var(--text-primary); font-weight: 700; }

    /* A slate game opens to show both starting fives, matched slot by slot. */
    .dash-game[data-away] { cursor: pointer; }
    .dash-game-toggle {
      flex: none; padding: 0 0.1rem; margin-right: -0.3rem;
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); font-size: var(--text-xs); line-height: 1;
      transition: transform 0.2s ease, color 0.2s;
    }
    .dash-game:hover .dash-game-toggle { color: var(--link); }
    .dash-game.open .dash-game-toggle { transform: rotate(90deg); color: var(--accent); }
    .dash-five { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.3s ease; }
    .dash-five.open { grid-template-rows: 1fr; }
    .dash-five-inner { overflow: hidden; min-height: 0; }
    .dash-five-box {
      margin: 0.35rem 0 0.5rem; padding: 0.55rem 0.6rem 0.45rem;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm); background: var(--bg-subtle);
      font-size: var(--text-xs);
    }
    .dash-five-head, .dash-five-row {
      display: grid; align-items: center; column-gap: 0.4rem;
      grid-template-columns: minmax(0, 1fr) 1.5rem 1.6rem 1.5rem minmax(0, 1fr);
    }
    .dash-five-head { margin-bottom: 0.3rem; color: var(--text-muted); font-weight: 600; }
    .dash-five-head img { width: 16px; height: 16px; object-fit: contain; vertical-align: -3px; }
    .dash-five-head .away { grid-column: 1 / 3; text-align: right; }
    .dash-five-head .home { grid-column: 4 / 6; }
    .dash-five-row { padding: 0.12rem 0; }
    .dash-five-row + .dash-five-row { border-top: 1px solid var(--border-subtle); }
    .dash-five-slot { text-align: center; font-weight: 700; color: var(--text-muted); letter-spacing: 0.03em; }
    .dash-five-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-primary); text-decoration: none; }
    a.dash-five-name:hover { color: var(--link); }
    .dash-five-name.away { text-align: right; }
    .dash-five-ovr { text-align: center; font-variant-numeric: tabular-nums; color: var(--text-muted); }
    .dash-five-ovr.edge { color: var(--accent); font-weight: 700; }
    .dash-five-foot { margin-top: 0.3rem; color: var(--text-muted); text-align: center; }
    .dash-five.open .dash-five-row { animation: dash-five-in 0.3s ease both; animation-delay: calc(var(--i) * 45ms + 60ms); }
    @keyframes dash-five-in { from { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .dash-five, .dash-game-toggle { transition: none; }
      .dash-five.open .dash-five-row { animation: none; }
    }

    /* Site footer: the version, linking to what changed in it. */
    .site-footer {
      margin-top: var(--space-7); padding-top: var(--space-4);
      border-top: 1px solid var(--border-subtle);
      font-size: var(--text-xs); color: var(--text-muted);
    }
    .site-footer a { color: inherit; }
    .site-footer a:hover { color: var(--link); }

    /* Sections are ruled, not boxed: a heavy rule, then the section's name
       in the scoreboard face, the way a broadcast graphic stacks. Every one a
       rounded box made the page read as a generic dashboard, and the boxes
       inside boxes (last night's best) as a template. */
    :root .dash-card, :root .hero:not(:empty) {
      background: none;
      border: 0;
      border-top: 2px solid var(--text-primary);
      border-radius: 0;
      padding: var(--space-3) 0 0;
      margin-bottom: var(--space-6);
    }
    /* Beside the main column (900px and up), the widgets in the side column
       sit on flat, square panels so they read as one set; the main column's
       stories stay ruled. One column on a phone: everything is ruled. */
    @media (min-width: 901px) {
      :root .dash-side .dash-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-top: 2px solid var(--text-primary);
        border-radius: var(--radius-sm);
        padding: var(--space-3) var(--space-4) var(--space-4);
        margin-bottom: var(--space-4);
      }
    }
    :root .dash-card-title {
      font-family: var(--font-display);
      font-size: var(--text-lg);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--text-primary);
      margin-bottom: var(--space-3);
    }

    /* A header that is itself the link to the card's full page. */

    /* Your team is boxed like every other section now (above). */
    :root .dash-team-name { font-size: var(--text-xl); }

    /* A small text link under a list. */
    .dash-feed-item { font-size: var(--text-sm); color: var(--text-secondary); }
    a.dash-feed-item:hover { color: var(--text-primary); }

    /* Around the League: days under a header, a square tag, the headline.
       The tag is its own column so the tags line up and can be scanned. */
    .dash-feed { display: flex; flex-direction: column; }
    .dash-feed-day {
      display: block; color: var(--text-secondary);
      padding: var(--space-5) 0 var(--space-2);
      border-bottom: 1px solid var(--border-subtle);
    }
    .dash-feed-day:first-child { padding-top: 0; }
    .dash-feed-day[hidden], :root a.dash-feed-row[hidden] { display: none; }
    :root a.dash-feed-row {
      display: grid; grid-template-columns: 7.5rem minmax(0, 1fr);
      gap: var(--space-1) var(--space-4); align-items: baseline;
      padding: var(--space-3) 0;
      border-bottom: 1px solid var(--border-subtle);
      color: inherit; text-decoration: none;
    }
    /* The next day's header carries the rule. */
    :root a.dash-feed-row:last-child, :root a.dash-feed-row:has(+ .dash-feed-day) { border-bottom: none; }
    /* Wraps rather than truncating: "Offer Sheet Decision" doesn't fit the
       column, and the label is shared with /transactions, so it isn't
       shortened here. */
    .dash-feed-tag.ui-chip { justify-self: start; white-space: normal; transform: translateY(-1px); }
    :root .dash-feed-text { font-size: var(--text-base); font-weight: 500; color: var(--text-primary); line-height: 1.4; }
    :root a.dash-feed-row:hover .dash-feed-text { color: var(--link); }
    :root .dash-feed-text strong { font-weight: 600; }
    /* A team inside a headline: its logo, then the abbreviation. */
    /* Plain inline, not inline-flex: an inline-flex box takes its baseline
       from the logo's bottom edge, which lifted the abbreviation off the line. */
    .dash-feed-team { font-weight: 600; white-space: nowrap; }
    .dash-feed-team img { width: 1.25em; height: 1.25em; object-fit: contain; vertical-align: -0.25em; margin-right: 0.3em; }
    .dash-feed-sub { display: block; font-size: var(--text-sm); font-weight: 400; color: var(--text-muted); margin-top: 0.1rem; }
    /* A night's finals as a ticker: a flat tile per game, away over home,
       each side edged in its two team colours (design-system.md § Scores).
       The tile is what keeps twelve games from reading as one column of
       names; --bg-hover because --bg-subtle barely differs from the page. */
    .dash-feed-scores {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(7rem, 8rem));
      gap: var(--space-2); margin-top: var(--space-2);
    }
    .dash-feed-score {
      display: flex; flex-direction: column; gap: 0.15rem; min-width: 0;
      padding: var(--space-2) var(--space-3);
      background: var(--bg-hover); border-radius: var(--radius-sm);
    }
    .dash-feed-side {
      display: flex; align-items: center; gap: var(--space-2);
      font-family: var(--font-display); font-size: var(--text-base); font-weight: 600;
      line-height: 1.15; letter-spacing: 0.02em; color: var(--text-muted);
    }
    .dash-feed-side::before {
      content: ''; flex: none; width: 2px; align-self: stretch;
      border-left: 2px solid var(--team-primary); background: var(--team-accent);
    }
    .dash-feed-side b { margin-left: auto; font-weight: inherit; font-variant-numeric: tabular-nums; }
    .dash-feed-side.win { color: var(--text-primary); font-weight: 700; }
    /* Show more: the card's footer, under a rule. */
    :root .dash-feed-more {
      width: 100%; justify-content: flex-start; margin-top: var(--space-2); padding: 0;
      border-top: 1px solid var(--border-subtle); border-radius: 0;
      font-family: var(--font-display); font-size: var(--text-sm); font-weight: 600;
      letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-secondary);
    }

    /* Schedule */
    :root .dash-team-phase { font-size: var(--text-lg); font-weight: 700; color: var(--text-primary); }
    :root .dash-team-phase-sub { font-size: var(--text-sm); margin-bottom: var(--space-4); }
    :root .dash-games { gap: 0.45rem; }
    :root .dash-game-day { margin-top: var(--space-3); }

    /* Rankings: a vertical list in the sidebar. */
    :root .dash-ranks-head { flex-direction: column; gap: 0.1rem; margin-bottom: var(--space-3); }
    :root .dash-ranks-head .dash-card-title { margin: 0 !important; }
    :root .dash-ranks-edition { margin-left: 0; }
    :root .dash-ranks-row { grid-template-columns: 1fr; gap: 0; }
    :root .dash-rank-team { border-radius: 0; padding: 0.45rem 0; }
    :root .dash-rank-team + .dash-rank-team { border-top: 1px solid var(--border-subtle); }
    :root .dash-rank-team:hover { background: none; }
    :root .dash-rank-team:hover .dash-rank-abbr { color: var(--link); }
    :root .dash-rank-pos { width: 1.5rem; }
    :root .dash-rank-abbr { font-size: var(--text-sm); }
    :root .dash-rank-team .rank-move { margin-left: auto; }
    /* The blurb's first sentence, on its own line under the abbreviation:
       indented past the rank (1.5rem) and logo (20px) and their two gaps. */
    :root .dash-rank-team { flex-wrap: wrap; }
    .dash-rank-blurb {
      flex-basis: 100%;
      padding-left: calc(1.5rem + 20px + 0.9rem);
      font-size: var(--text-xs); line-height: 1.4; color: var(--text-muted);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    /* Preview bar */
            
    /* Headline: the state of the league, in words, at the top. */
    .hero { display: none; }
    :root .hero:not(:empty) { display: block; }
    .hero-line {
      font-size: clamp(2.5rem, 7vw, 4.5rem);
      font-weight: 700;
      line-height: 0.95;
      text-transform: uppercase;
      color: var(--text-primary);
    }
    .hero-line em { font-style: normal; color: var(--accent); font-variant-numeric: tabular-nums; }
    .hero-sub { margin-top: var(--space-2); font-size: var(--text-base); color: var(--text-muted); }

    /* Preseason: the countdown as one big number. */
    .hero-count { display: flex; align-items: center; gap: var(--space-4); }
    .hero-num {
      font-family: var(--font-display); font-weight: 800; line-height: 0.85;
      font-size: clamp(4.5rem, 14vw, 7.5rem); color: var(--accent);
      font-variant-numeric: tabular-nums;
    }
    .hero-unit { font-size: clamp(1.4rem, 3.5vw, 2.1rem); font-weight: 700; line-height: 1.1; color: var(--text-primary); }
    .hero-count .hero-sub { margin-top: var(--space-1); }
    /* Opening night's games, by logo. */
    .hero-matchups { display: flex; flex-wrap: wrap; gap: var(--space-3); margin-top: var(--space-5); }
    .hero-matchup {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.55rem 0.9rem; border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-weight: 600; font-size: var(--text-base);
    }
    .hero-matchup .dash-game-logo { width: 32px; height: 32px; }
    .hero-matchup-at { color: var(--text-muted); font-weight: 400; }
    .hero-matchup-time { color: var(--text-muted); font-size: var(--text-xs); font-weight: 500; margin-left: 0.2rem; }

    /* Phones */
    @media (max-width: 600px) {
      :root .page-wrap { padding: 1.25rem 1rem 3rem; }
      /* Not on phones: too narrow to read a scrolling line. */
      :root .ticker { display: none; }
      /* Tag on its own line above the headline, so the headline gets the
         full width instead of a narrow strip beside the tag. */
      :root a.dash-feed-row { grid-template-columns: minmax(0, 1fr); gap: var(--space-1); }
      :root .dash-feed-tag { justify-self: start; }
      .dash-feed-scores { grid-template-columns: repeat(auto-fill, minmax(7rem, 1fr)); }
      :root .dash-card, :root .hero:not(:empty) { padding: var(--space-4); margin-bottom: var(--space-4); }
    }

    /* Signed-out visitors only: what this site is, one line, linking to the
       FAQ and application on /join. Replaces the four-question FAQ that used
       to sit at the bottom of the homepage, below every member's content. */
    .visitor-intro {
      max-width: 820px; width: 100%;
      margin: -1.25rem 0 var(--space-5);
      font-size: var(--text-sm); color: var(--text-muted); text-align: center;
    }
    .visitor-intro a { color: var(--link); white-space: nowrap; }

    :root .visitor-intro { text-align: left; max-width: none; margin-top: calc(-1 * var(--space-2)); }
    /* Live banner: the Twitch stream, only while twitch.tv/nothingbutnet is
       live (GET /api/stream/live). Hidden otherwise, so an offline homepage
       is exactly the page without it. */
    .live-banner[hidden] { display: none; }
    .live-banner {
      width: 100%; box-sizing: border-box; min-width: 0;
      margin-bottom: var(--space-5);
      /* On air: a square panel with a red bar across the top, the one place
         the homepage uses red as a band, because it means "live now". */
      background: var(--bg-card); border: 1px solid var(--border);
      border-top: 3px solid var(--danger);
      border-radius: var(--radius-sm); padding: var(--space-4) var(--space-5) var(--space-5);
    }
    .live-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 0.75rem; margin-bottom: 0.75rem; }
    .live-pill {
      display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.2rem 0.6rem;
      border-radius: var(--radius-sm); background: var(--danger-bg); border: 1px solid var(--danger-border);
      color: var(--danger); font-family: var(--font-display); font-size: var(--text-sm); font-weight: 700; letter-spacing: 0.1em;
    }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); animation: live-pulse 1.6s ease-in-out infinite; }
    @keyframes live-pulse { 50% { opacity: 0.3; } }
    @media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } }
    .live-title { font-family: var(--font-display); font-size: var(--text-md); font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase; color: var(--text-primary); min-width: 0; flex: 1 1 16rem; overflow-wrap: anywhere; }
    .live-meta { font-size: var(--text-sm); color: var(--text-muted); }
    .live-link { font-size: var(--text-sm); color: var(--link); text-decoration: none; white-space: nowrap; }
    .live-player { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: var(--radius-sm); overflow: hidden; background: black; }
    .live-player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <div class="page-wrap">
  <!-- All 30 teams, one click into any of them. Filled from the latest
       standings season. -->
  <div class="nav" data-no-home></div>
  <!-- The latest night's finals and top performers, scrolling. Filled from
       latestNight; stays hidden until a night of box scores exists. -->
  <section class="ticker" id="ticker" aria-label="Latest scores and injuries" hidden></section>

  <p class="visitor-intro" id="visitor-intro" hidden>
    A fantasy NBA GM league, played out in NBA 2K since 2020.
    <a href="/join/">What it is and how to join</a>
  </p>

  <section class="dash" id="dash">
    <!-- Twitch stream, shown only while live. In the main column, like the
         headline, so the side column sits beside it rather than below. -->
    <section class="live-banner" id="live-banner" aria-label="Live stream" hidden></section>

    <!-- The headline — in the main column, so the side column starts level
         with it rather than below it. -->
    <div class="hero" id="dash-hero"></div>

    <!-- Band 1 — your team. Signed-in members with an active tenure only;
         stays hidden for everyone else rather than rendering an empty shell. -->
    <div class="dash-card" id="dash-team" hidden></div>

    <!-- Band 2 — around the league. Public, so it renders for visitors too.
         Main column: the night's best performances, then the feed. -->
    <div class="dash-main">
      <!-- Hidden until a night of box scores exists this season. -->
      <div class="dash-card" id="dash-best" hidden></div>
      <!-- In-season only. In the wide column so both conferences fit to the play-in line. -->
      <div class="dash-card" id="dash-standings" hidden></div>
      <div class="dash-card" id="dash-feed">
        <div class="dash-card-title">Around the League</div>
        <div class="dash-skel" style="width:90%"></div>
        <div class="dash-skel" style="width:70%"></div>
        <div class="dash-skel" style="width:80%"></div>
      </div>
      <!-- The current 2K injury list (GET /api/injuries). Hidden until a report is in. -->
      <div class="dash-card" id="dash-tweets" hidden></div>
      <div class="dash-card" id="dash-injuries" hidden></div>
    </div>

    <!-- Sidebar: tonight's games, then the races and lists. -->
    <div class="dash-side">
      <div class="dash-card" id="dash-slate">
        <div class="dash-card-title" id="dash-slate-title">Next Up</div>
        <div class="dash-skel" style="width:80%"></div>
        <div class="dash-skel" style="width:65%"></div>
      </div>
      <!-- The newest stream VOD and the newest Box Scores video. Each hidden until one is up. -->
      <div class="dash-card" id="dash-stream-vod" hidden></div>
      <div class="dash-card" id="dash-box-vod" hidden></div>
      <!-- The award race's leaders (award-race.js). In-season only. -->
      <div class="dash-card" id="dash-race" hidden></div>
      <!-- This season's draft class by the ROTY formula (award-race.js). In-season only. -->
      <div class="dash-card" id="dash-rookies" hidden></div>
      <!-- The current power-rankings standing. Hidden until it has one. -->
      <div class="dash-card" id="dash-ranks" hidden></div>
      <!-- Career milestones active players are closest to. Hidden until loaded. -->
      <div class="dash-card" id="dash-milestones" hidden></div>
      <!-- This date in earlier seasons (GET /api/on-this-day). Hidden when there's nothing. -->
      <div class="dash-card" id="dash-otd" hidden></div>
      <!-- Biggest OVR moves in the latest 2K scrape. Hidden until there is one. -->
      <div class="dash-card" id="dash-movers" hidden></div>
    </div>

  </section>


  <footer class="site-footer">
    Nothing But Net · <a href="/changelog" id="site-version">Changelog</a>
  </footer>

  </div>
  <script>
    if (!localStorage.getItem('nbn_token')) document.getElementById('visitor-intro').hidden = false;

    fetch('/version.json').then(r => r.json()).then(d => {
      const el = document.getElementById('site-version');
      if (el) el.textContent = 'v' + d.version;  // links to the changelog
    });

    // Typing anywhere on the homepage (outside a form field) jumps straight
    // into the site search, seeded with the character just typed.
    document.addEventListener('keydown', e => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key.length !== 1) return;
      const t = e.target;
      const isFormField = t && (
        t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' ||
        t.tagName === 'BUTTON' || t.tagName === 'A' || t.isContentEditable
      );
      if (isFormField) return;
      e.preventDefault();
      openSearch(e.key);
    });

  </script>
  <script src="/nav.js"></script>
  <script src="/token-badge.js"></script>
  <script src="/league-time.js"></script>
  <script src="/cap-health.js"></script>
  <script src="/contract.js"></script>
  <script src="/feed-types.js"></script>
  <script src="/names.js"></script>
  <script src="/milestones.js"></script>
  <script src="/clinch.js"></script>
  <script src="/vod.js"></script>
  <script src="/award-race.js"></script>
  <script src="/teams/lineup.js"></script>
  <script>
  // ── Homepage dashboard ──────────────────────────────────────────────────
  //
  // The homepage used to be a directory: ~40 equal-weight cards, which answers
  // "where is X" (a question Ctrl-K already answers better) and never answers
  // "what should I be doing". This band answers the second question; the site
  // sidebar (nav.js) answers the first, on every page.
  //
  // Three principles it is built on:
  //
  // 1. **No cap math here.** The salary figures come from
  //    `GET /api/cap-history/current` and the reading of them from
  //    `cap-health.js` — the same rules the team page's Cap Health card uses.
  //    A surface that recomputes can show a team room the validator never
  //    credited it with.
  // 2. **Phase-aware, not games-first.** From the July 1 league-year rollover
  //    until opening night there are no games to list, and the league is at its
  //    busiest. The band leads with whatever the calendar says is happening.
  // 3. **Every card fails alone.** Each renders off its own fetch and hides
  //    itself if the data never comes, so one slow endpoint costs one card.
  //
  // Loaded after nav.js deliberately: `TEAM_LIST` is nav's, and BACKLOG.md
  // already counts 13 copies of that map. This is not the 14th.

  (function () {
    'use strict';

    const $ = id => document.getElementById(id);
    const token = localStorage.getItem('nbn_token');
    const auth = token ? { Authorization: 'Bearer ' + token } : {};

    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const jget = (url, opts) =>
      fetch(url, opts).then(r => (r.ok ? r.json() : Promise.reject(new Error(r.status))));

    // Dollars at homepage altitude — "$140.1M", not the exact figure the team
    // page shows. Someone wanting the cent is one click from it. Below $1M,
    // "$0.2M" rounds away the only digits that matter (a $210,325 cap cushion
    // and a $499,999 one would both read "$0.5M"), so that range spells the
    // real number out instead.
    const fmtM = v => {
      const n = Math.abs(Number(v) || 0);
      return n < 1e6 ? '$' + Math.round(n).toLocaleString('en-US') : '$' + (n / 1e6).toFixed(1) + 'M';
    };

    // Civil dates are parsed at noon UTC so a day never slips across a zone
    // boundary. league-time.js owns "what day is it"; this only does arithmetic
    // on dates it has already been handed.
    const at = d => Date.parse(d + 'T12:00:00Z');
    const daysUntil = (from, to) => Math.round((at(to) - at(from)) / 86400000);
    const shortDate = d => {
      const [y, m, day] = d.split('-').map(Number);
      return new Date(Date.UTC(y, m - 1, day))
        .toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
    };
    // "Thu, Oct 23": a feed day header.
    const dayLabel = d => {
      const [y, m, day] = d.split('-').map(Number);
      return new Date(Date.UTC(y, m - 1, day))
        .toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' });
    };
    const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
    // Logo + abbreviation, for a game row that needs to read at a glance
    // rather than by parsing three-letter codes.
    // A link to that team's page. `recs` (TEAM → "12–4") adds the record
    // when a season is being played.
    const teamChip = (abbr, recs) =>
      `<a class="dash-game-team" href="/teams/${esc(String(abbr).toUpperCase())}/">`
      + `<img class="dash-game-logo" src="/logos/sm/logo-${esc(String(abbr).toLowerCase())}.webp" alt="">`
      + `<span>${esc(abbr)}</span>`
      + (recs && recs[abbr] ? `<span class="dash-game-rec">${esc(recs[abbr])}</span>` : '')
      + `</a>`;

    const today = nbnToday();
    const previewHref = g => `/preview/?away=${encodeURIComponent(g.away_team)}`
      + `&home=${encodeURIComponent(g.home_team)}&date=${encodeURIComponent(g.date)}`;
    const dayBefore = (d, n = 1) => new Date(at(d) - n * 86400000).toISOString().slice(0, 10);
    // "Today" / "Tomorrow" for the next two days, the date after that.
    const relDate = d => d === today ? 'Today' : d === dayBefore(today, -1) ? 'Tomorrow' : shortDate(d);

    // ?asof=YYYY-MM-DD shows the in-season cards (last night's best,
    // standings, records) as they were on that date. It changes nothing else
    // and writes nothing. It exists because those cards are empty for the
    // whole offseason, which is when most work on this page happens.
    const asof = (q => (/^\d{4}-\d\d-\d\d$/.test(q) ? q : null))(
      new URLSearchParams(location.search).get('asof') || '');

    // standings-history.csv, fetched once for the whole page. No field in it
    // is quoted, so splitting on commas is a full parse.
    const standingsPromise = fetch('/standings/standings-history.csv')
      .then(r => (r.ok ? r.text() : '')).catch(() => '')
      .then(text => {
        const lines = text.trim().split('\n');
        if (lines.length < 2) return [];
        const hdr = lines[0].split(',');
        return lines.slice(1).map(l => {
          const c = l.split(',');
          return Object.fromEntries(hdr.map((h, i) => [h, c[i]]));
        });
      });

    // ── Band 2: around the league ─────────────────────────────────────────
    //
    // Public. Renders for signed-out visitors too, which is most of what makes
    // the page worth loading when you have no team.

    // One schedule fetch serves both this band and band 1's next-games list.
    const schedulePromise = jget('/api/schedule').catch(() => null);
    // Per-date status; the card reads only each night's Box Scores video from it.
    const streamingDaysPromise = jget('/api/streaming-days').catch(() => ({}));

    // Where the league is in its year, derived from the schedule's own date
    // range rather than a stored flag — there is no phase field on the API, and
    // the schedule is the thing that would have to agree with one anyway.
    function phaseOf(games) {
      if (!games || !games.length) return { phase: 'unknown' };
      const dates = games.map(g => g.date).sort();
      const first = dates[0], last = dates[dates.length - 1];
      if (today < first) return { phase: 'preseason', first, last };
      if (today > last) return { phase: 'offseason', first, last };
      return { phase: 'in-season', first, last };
    }

    // The season whose standings belong on the page: the one being played,
    // or none. Out of season, last year's final table lives on /standings.
    const liveSeasonPromise = schedulePromise.then(sched =>
      asof ? nbnSeasonForDate(asof)
        : sched && phaseOf(sched.games).phase === 'in-season' ? sched.season : null);

    const liveStandingsPromise = Promise.all([liveSeasonPromise, standingsPromise])
      .then(([season, rows]) => (season ? rows.filter(r => r.SEASON === season) : []));

    // TEAM → "12–4" for the season being played, or null.
    const recordsPromise = liveStandingsPromise.then(rows => (rows.length
      ? Object.fromEntries(rows.map(r => [r.TEAM, `${r.W}–${r.L}`])) : null));

    // The most recent night with box scores entered: { date, games }, or null.
    // Shared by "Last night's best" and the feed's final scores.
    //
    // /api/boxscores answers for one exact date, so the schedule is used to
    // find which dates could have results, newest first, and those are asked
    // for in turn. It walks back up to three dates rather than asking only
    // for the newest: a night's games are entered when someone gets to them,
    // so the most recent scheduled date is routinely still empty while the
    // one before it has a full slate. Stopping at the first date that answers
    // with games keeps that to one request on a normal day.
    //
    // In the offseason every scheduled date is in the future, so this makes
    // no requests at all — which is the correct empty.
    const latestNight = schedulePromise.then(async sched => {
      let season, dates;
      if (asof) {
        season = nbnSeasonForDate(asof);
        dates = [0, 1, 2].map(n => dayBefore(asof, n));
      } else {
        if (!sched || !sched.games) return null;
        season = sched.season || '';
        // Today included: a night's scores go up as soon as they are entered,
        // which is often before midnight.
        dates = [...new Set(sched.games.filter(g => g.date <= today).map(g => g.date))]
          .sort().reverse().slice(0, 4);
      }
      for (const date of dates) {
        const games = await jget(`/api/boxscores?date=${encodeURIComponent(date)}`
          + `&season=${encodeURIComponent(season)}`).catch(() => []);
        if (games && games.length) return { date, games };
      }
      return null;
    }).catch(() => null);

    // Only a stream game is tagged. A streamer claims every game of a night
    // they run, stream or not, so tagging each claim put the same name on the
    // whole slate and the actual stream games couldn't be told apart. The
    // claim (`streamer`) and the flag (`stream`) are independent; the name is
    // shown only alongside the flag. Same Stream chip as /calendar.
    function streamTag(g) {
      if (!g.stream) return '';
      const who = g.streamer ? ` ${esc(g.streamer)}` : '';
      const title = 'Stream game' + (g.streamer ? `, streamed by ${g.streamer}` : '')
        + (g.stream_buyer ? `, bought by ${g.stream_buyer}` : '');
      return `<span class="dash-game-stream" title="${esc(title)}"><span class="ui-chip ui-chip--warning">Stream</span>${who}</span>`;
    }

    Promise.all([schedulePromise, recordsPromise]).then(([sched, recs]) => {
      const card = $('dash-slate');
      if (!sched || !sched.games || !sched.games.length) {
        card.innerHTML = '<div class="dash-card-title">Next Up</div>'
          + '<div class="dash-empty">No schedule on file.</div>';
        return;
      }
      const ph = phaseOf(sched.games);
      const upcoming = sched.games.filter(g => g.date >= today).sort((a, b) =>
        a.date.localeCompare(b.date) || nbnTipMinutes(a.time_et) - nbnTipMinutes(b.time_et));

      let title = 'Next Up', head = '', list = [], showDates = false;

      if (ph.phase === 'preseason') {
        const n = daysUntil(today, ph.first);
        title = 'Upcoming Games';
        head = `<div class="dash-team-phase">${n === 0 ? 'Opens tonight' : `Opens in ${plural(n, 'day')}`}</div>`
          + `<div class="dash-team-phase-sub">${esc(shortDate(ph.first))} · ${esc(sched.season)} season</div>`;
        // Not just opening night's own slate — the card has room for several
        // days of the ramp-up, so it doesn't sit mostly empty for the weeks
        // before the opener while "Around the League" next to it is full.
        list = upcoming.slice(0, 8);
        showDates = true;
      } else if (ph.phase === 'offseason') {
        title = 'Offseason';
        head = '<div class="dash-empty">The season is complete. Free agency, extensions and '
          + 'the draft run until next season\'s schedule lands.</div>';
      } else {
        const nextDate = upcoming.length ? upcoming[0].date : null;
        title = nextDate === today ? 'Tonight' : 'Next Slate';
        if (nextDate) {
          head = `<div class="dash-team-phase-sub" style="margin-bottom:0.5rem">`
            + `${esc(shortDate(nextDate))} · ${plural(upcoming.filter(g => g.date === nextDate).length, 'game')}</div>`;
          // The whole night, not the first few: the line above counts every
          // game, and a slate cut at four hid most of an 11-game night.
          list = upcoming.filter(g => g.date === nextDate);
        }
      }

      // The state of the league is the page's headline; the sidebar card
      // keeps just the games.
      {
        const yrs = /^\d\d-\d\d$/.test(sched.season || '')
          ? `20${sched.season.slice(0, 2)}–${sched.season.slice(3)}` : (sched.season || '');
        let line = '', sub = '', heroHtml = '';
        if (ph.phase === 'preseason') {
          const n = daysUntil(today, ph.first);
          const facts = `${esc(shortDate(ph.first))} · ${esc(yrs)} season · `
            + `${sched.games.length.toLocaleString()} games on the schedule`;
          // Opening night's games, by logo, under the countdown.
          const opener = '<div class="hero-matchups">' + sched.games
            .filter(g => g.date === ph.first).map(g => '<div class="hero-matchup">'
              + `${teamChip(g.away_team)}<span class="hero-matchup-at">@</span>${teamChip(g.home_team)}`
              + `<span class="hero-matchup-time">${esc(g.time_et || '')}</span></div>`).join('')
            + '</div>';
          heroHtml = (n === 0
            ? `<div class="hero-line">Opening night is <em>tonight</em></div><div class="hero-sub">${facts}</div>`
            : `<div class="hero-count"><span class="hero-num">${n}</span><div>`
              + `<div class="hero-unit">${n === 1 ? 'day' : 'days'} until opening night</div>`
              + `<div class="hero-sub">${facts}</div></div></div>`)
            + opener;
        } else if (ph.phase === 'offseason') {
          line = 'The offseason';
          sub = 'Free agency, extensions and the draft run until next season\'s schedule lands.';
        } else if (list.length) {
          const n = upcoming.filter(g => g.date === list[0].date).length;
          line = list[0].date === today ? `<em>${plural(n, 'game')}</em> tonight`
            : `Next up: <em>${esc(shortDate(list[0].date))}</em>`;
          sub = `${esc(yrs)} season`;
        }
        $('dash-hero').innerHTML = heroHtml || (line
          ? `<div class="hero-line">${line}</div><div class="hero-sub">${sub}</div>` : '');
        head = '';
        if (ph.phase === 'preseason') title = 'Opening week';
      }

      // Only the title text is the link: a night's box-score video link is added
      // beside it later, and a link can't sit inside another.
      card.innerHTML = `<div class="dash-card-title"><a class="ui-title-link" href="/calendar">${esc(title)}</a></div>${head}`
        // Grouped under a date heading rather than a date column: the card is
        // too narrow for date + two team chips + time on one line, and the
        // times were spilling out past its edge.
        + (list.length ? '<div class="dash-games">' + list.map((g, i) =>
            (showDates && (i === 0 || list[i - 1].date !== g.date)
              ? `<div class="dash-game-day">${esc(shortDate(g.date))}</div>` : '')
            + `<div class="dash-game" data-away="${esc(g.away_team)}" data-home="${esc(g.home_team)}" data-date="${esc(g.date)}">`
            + `<button class="dash-game-toggle" type="button" aria-expanded="false" title="Starting fives">▶</button>`
            + `<span class="dash-game-opp">${teamChip(g.away_team, recs)}<span>@</span>${teamChip(g.home_team, recs)}</span>`
            + streamTag(g)
            + `<a class="dash-game-time" title="Game preview" href="${previewHref(g)}">${esc(g.time_et || 'Preview')} ›</a>`
            + `</div><div class="dash-five"><div class="dash-five-inner"></div></div>`).join('') + '</div>' : '');

      // A game whose box score is already in shows its final in place of the
      // tip time. Matched on date + the two teams, either way round, the same
      // rule /committees/stats uses.
      latestNight.then(night => {
        if (!night) return;
        const key = (a, b) => [a, b].map(t => String(t).toUpperCase()).sort().join('|');
        const finals = new Map(night.games.map(g => [key(g.away_team, g.home_team), g]));
        card.querySelectorAll(`.dash-game[data-date="${night.date}"]`).forEach(row => {
          const g = finals.get(key(row.dataset.away, row.dataset.home));
          if (!g) return;
          const [a, h] = String(g.away_team).toUpperCase() === row.dataset.away.toUpperCase()
            ? [g.away_score, g.home_score] : [g.home_score, g.away_score];
          const el = row.querySelector('.dash-game-time');
          el.href = `/boxscores/?date=${encodeURIComponent(night.date)}&game=${g.away_team}-${g.home_team}`;
          el.title = 'Box score';
          el.classList.add('final');
          el.innerHTML = `<span class="${a > h ? 'win' : ''}">${esc(String(a))}</span>–`
            + `<span class="${h > a ? 'win' : ''}">${esc(String(h))}</span> F ›`;
          // Played, so the Stream chip gives way to the game's video, or ⏳ until it's up.
          const sg = list.find(x => x.date === night.date
            && x.away_team === row.dataset.away && x.home_team === row.dataset.home);
          if (sg) {
            row.querySelector('.dash-game-stream')?.remove();
            el.insertAdjacentHTML('beforebegin', NbnVod.gameHtml(sg));
          }
        });
        // The night's unstreamed games share one video, beside the card's title.
        if (!list.some(g => g.date === night.date)) return;
        streamingDaysPromise.then(days => {
          const box = NbnVod.boxScoresHtml(days && days[night.date] && days[night.date].youtube_url);
          if (box) card.querySelector('.dash-card-title').insertAdjacentHTML('beforeend', box);
        });
      });

      // Clicking a game (anywhere but its links) slides its starting fives
      // out underneath. Filled on first open; later opens just toggle.
      card.addEventListener('click', e => {
        const row = e.target.closest('.dash-game[data-away]');
        if (!row || e.target.closest('a')) return;
        const panel = row.nextElementSibling;
        const open = !row.classList.contains('open');
        row.classList.toggle('open', open);
        row.querySelector('.dash-game-toggle').setAttribute('aria-expanded', String(open));
        if (open && !panel.dataset.filled) {
          panel.dataset.filled = '1';
          renderFives(panel.firstElementChild, row.dataset.away, row.dataset.home);
        }
        // Next frame, so the height animates from zero on the first open too.
        requestAnimationFrame(() => panel.classList.toggle('open', open));
      });
    });

    // ── Starting fives, for an opened slate game ──────────────────────────
    //
    // Same pick as the team page's Overview tab (teams/lineup.js): the team's
    // saved rotation when it has one, otherwise the best legal five by OVR
    // from standard contracts. Today's rosters and ratings, fetched on first
    // open only — most visits never open a game.
    let fivesData = null;
    const loadFivesData = () => fivesData || (fivesData = Promise.all([
      jget('/api/rotations').catch(() => ({})),
      jget('/api/ovr/current').catch(() => ({})),
    ]));
    const rosterSlugs = team => fetch(`/data/${team.toLowerCase()}-roster.csv`)
      .then(r => (r.ok ? r.text() : '')).catch(() => '')
      .then(t => { const [h, ...rows] = t.trim().split('\n'); return h && h.trim() === 'SLUG' ? rows.map(s => s.trim()).filter(Boolean) : []; });

    async function startersFor(team) {
      const [[rotations, ovr], slugs] = await Promise.all([loadFivesData(), rosterSlugs(team)]);
      const bios = slugs.length
        ? await jget('/api/players?slugs=' + encodeURIComponent(slugs.join(','))).catch(() => ({})) : {};
      const pool = slugs.filter(s => bios[s] && ['player', 'two-way'].includes(bios[s].type))
        .map(s => ({ slug: s, type: bios[s].type, name: bios[s].name || s, _posList: bios[s].pos || [], OVR: ovr[s] || 0 }));
      const set = rotationFive(pool, rotations[team]);
      return { set: !!set, five: set || computeStartingFive(pool.filter(p => p.type === 'player')) };
    }

    async function renderFives(el, away, home) {
      el.innerHTML = '<div class="dash-five-box"><div class="dash-five-foot">Loading…</div></div>';
      const [a, h] = await Promise.all([startersFor(away), startersFor(home)]).catch(() => [null, null]);
      if (!a || !h || (!a.five.some(Boolean) && !h.five.some(Boolean))) {
        el.innerHTML = '<div class="dash-five-box"><div class="dash-five-foot">Lineups unavailable.</div></div>';
        return;
      }
      // Last name only: the card is too narrow for two full names a row.
      const last = p => nbnPlayerName(String(p.name).split(',')[0]);
      const name = (p, side) => (p
        ? `<a class="dash-five-name ${side}" href="/players/?p=${encodeURIComponent(p.slug)}" title="${esc(nbnPlayerName(p.name))}">${esc(last(p))}</a>`
        : `<span class="dash-five-name ${side}" style="color:var(--text-muted)">—</span>`);
      const ovrCell = (p, q) => `<span class="dash-five-ovr${p && p.OVR && (!q || p.OVR > q.OVR) ? ' edge' : ''}">${p && p.OVR ? esc(p.OVR) : ''}</span>`;
      const avg = s => { const f = s.five.filter(p => p && p.OVR); return f.length ? (f.reduce((n, p) => n + p.OVR, 0) / f.length).toFixed(1) : '—'; };
      // Whose five is the team's own and whose is our guess.
      const how = a.set && h.set ? 'Both teams\' set rotations'
        : !a.set && !h.set ? 'Projected by OVR'
        : `${esc(a.set ? away : home)} set rotation · ${esc(a.set ? home : away)} projected`;
      const logo = t => `<img src="/logos/sm/logo-${esc(t.toLowerCase())}.webp" alt="">`;
      el.innerHTML = '<div class="dash-five-box">'
        + `<div class="dash-five-head"><span class="away">${esc(away)} ${logo(away)}</span><span></span><span class="home">${logo(home)} ${esc(home)}</span></div>`
        + DEPTH_SLOTS.map((slot, i) => {
            const p = a.five[i], q = h.five[i];
            return `<div class="dash-five-row" style="--i:${i}">${name(p, 'away')}${ovrCell(p, q)}`
              + `<span class="dash-five-slot">${slot}</span>${ovrCell(q, p)}${name(q, 'home')}</div>`;
          }).join('')
        + `<div class="dash-five-foot">Avg OVR ${avg(a)} · ${avg(h)}<br>${how}</div>`
        + '</div>';
    }

    // ── The merged feed ───────────────────────────────────────────────────
    //
    // Transactions, news and final scores in one list, newest first, each row
    // tagged with what kind of thing it is. They were two separate cards
    // ("Latest Moves" and "Newsstand") until 2026-09-05; splitting by source
    // meant the reader had to merge them by eye to answer the only question
    // they were asking, which is "what has happened since I last looked".
    //
    // Adding a fourth source is adding one function to SOURCES. Each returns
    // items of the same shape and is allowed to fail — `allSettled`, so a
    // source that 500s costs its own rows and not the feed.
    //
    //   ts    ISO instant, for ordering. Transactions carry `created_at` and
    //         a civil `date`; a date alone sorts as midnight, which is right:
    //         it is all the precision that exists for it.
    //   type  a key in feed-types.js — a ledger type, or `news` / `score`.
    //   text  already-escaped-at-render HTML-free string, or `html` for a row
    //         that needs markup (a score bolds the winner).
    // The feed is the main column, so it has room for a dozen. The rest, up to
    // FEED_MAX, sit behind a "Show N more" toggle.
    const FEED_LIMIT = 12, FEED_MAX = 60;

    // What FeedTypes.headline needs to name players and teams. Shared by the
    // feed and On This Day's trades.
    const headlineCtx = bios => ({
      esc,
      name: slug => {
        const n = (bios[slug] || {}).name;
        if (n) return nbnPlayerName(n);
        // A slug is "last-first"; good enough when the bio is missing.
        const parts = String(slug || '').split('-');
        return parts.length > 1
          ? [parts[parts.length - 1], ...parts.slice(0, -1)].map(w => w[0].toUpperCase() + w.slice(1)).join(' ')
          : String(slug || '');
      },
      team: abbr => `<span class="dash-feed-team"><img src="/logos/sm/logo-${esc(abbr.toLowerCase())}.webp" alt="">${esc(abbr)}</span>`,
    });
    // The players a ledger entry names, for one bios fetch.
    const txnSlugs = txns => {
      const slugs = new Set();
      txns.forEach(t => {
        const det = t.details || {};
        if (det.player) slugs.add(det.player);
        (det.transfers || []).forEach(tr => (tr.assets || []).forEach(a => a.slug && slugs.add(a.slug)));
      });
      return slugs;
    };

    const feedFromTransactions = () =>
      // The ledger endpoint already withholds sealed types (§ 5.1 waiver
      // claims), so whatever it returns is safe to show. A voided entry
      // (kept in the ledger, never deleted, so there's a permanent record —
      // see edits.jsonl) is real history, not news — it never belonged here.
      //
      // The row reads as a headline built from the entry's details
      // (FeedTypes.headline), not its `description`, which is written for the
      // office. Names come from a bios fetch for just the players named.
      jget('/api/transactions?limit=40').then(d => {
        const txns = (d.transactions || []).filter(t => !t.voided);
        const slugs = txnSlugs(txns);
        const bios = slugs.size
          ? jget('/api/players?slugs=' + encodeURIComponent([...slugs].join(','))).catch(() => ({}))
          : Promise.resolve({});
        return bios.then(bios => {
          const ctx = headlineCtx(bios);
          return txns.map(t => {
            const h = FeedTypes.headline(t, ctx);
            if (!h) return null;
            return {
              ts: t.created_at || (t.date ? t.date + 'T00:00:00Z' : ''),
              date: t.date,
              type: t.type,
              html: h.html,

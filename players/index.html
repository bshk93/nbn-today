<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="/theme-boot.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/shared.css">
  <title>Players - NBN</title>
  <!-- NBN:og -->
  <meta name="description" content="Every player in NBN — career stats, contracts, ratings, awards and game logs.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NBN">
  <meta property="og:title" content="Players - NBN">
  <meta property="og:description" content="Every player in NBN — career stats, contracts, ratings, awards and game logs.">
  <meta property="og:url" content="https://nbn.today/players/">
  <meta property="og:image" content="https://nbn.today/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Nothing But Net — fantasy basketball GM simulation league">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0d0e11">
  <link rel="icon" href="/icons/favicon.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <!-- /NBN:og -->
  <style>

    
        .header-main { display: flex; align-items: center; gap: 1.25rem; flex: 1; }
    .header-text { display: flex; flex-direction: column; }
    .player-nav-btn {
      display: flex; align-items: center; justify-content: center;
      width: 2rem; height: 2rem; border-radius: 50%;
      background: transparent; border: 1px solid var(--border);
      color: var(--text-muted); font-size: 1rem; cursor: pointer;
      text-decoration: none; flex-shrink: 0; line-height: 1;
    }
    .player-nav-btn:hover { border-color: var(--text-muted); color: var(--text-secondary); }
        
    .profile-photo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      object-position: top center;
      background: var(--border);
      flex-shrink: 0;
    }

    #status { color: var(--text-muted); font-size: 0.9rem; padding: 2rem 0; }

    /* index grid */
    .player-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 0.75rem;
    }

    .player-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.75rem 1rem;
      text-decoration: none;
      color: var(--text-primary);
      font-size: 0.9rem;
      font-weight: 500;
      transition: background 0.15s, border-color 0.15s;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .player-card:hover { background: var(--bg-hover); border-color: var(--muted-border); text-decoration: none; }
    .player-card.champion { border-color: var(--warning); }
    .player-card.champion:hover { border-color: var(--gold); }

    .player-photo {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      object-position: top center;
      background: var(--border);
      flex-shrink: 0;
    }

    .player-photo-placeholder {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--border);
      flex-shrink: 0;
    }

    /* bio line */
    .bio-line {
      color: var(--text-muted);
      font-size: 0.82rem;
      margin-bottom: 0.9rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem 0.5rem;
      align-items: center;
    }
    .bio-sep { color: var(--text-dim); }

    /* accolades */
    .accolades {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 1.1rem;
    }

    .badge {
      padding: 0.15rem 0.45rem;
      border-radius: var(--radius-sm);
      font-family: var(--font-display);
      font-size: var(--text-sm);
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
      cursor: default;
    }
    /* Accolades read as one set: one neutral chip, the count in bold, and
       gold kept for the two that are the point of a career (rings, MVP). */
    .accolades .badge {
      font-weight: 500; color: var(--text-secondary);
      background: var(--bg-subtle); border: 1px solid var(--border);
    }
    .accolades .badge b { font-weight: 700; color: var(--text-primary); margin-right: 0.2em; }
    .accolades .badge.badge-gold { color: var(--gold); border-color: var(--gold-border); background: color-mix(in srgb, var(--gold) 8%, transparent); }
    .accolades .badge.badge-gold b { color: var(--gold); }


    /* toggle */
    
    
        
    /* section headings */
    .toggle-bar { margin-bottom: var(--space-4); }   /* the view switch (By Team / By Season / …) */

    /* Same as .ui-section-title (css/components.css); kept as its own class
       because the page builds these in a dozen places. */
    .section-heading {
      font-size: var(--text-md);
      font-weight: 600;
      color: var(--text-primary);
      margin: var(--space-6) 0 var(--space-3);
    }

    /* table wrapper */
    
    
    
    thead th .sort-arrow { margin-left: 4px; opacity: 0; font-size: 0.65rem; }
    thead th[data-active="true"] .sort-arrow { opacity: 1; }

    
        
    
        
    td.league-leader {
      font-weight: 700;
      color: #fcd34d;
    }

    .row-icon { font-size: 0.95em; margin-left: 4px; color: var(--gold); }

    .career-row { border-top: 2px solid var(--border) !important; }

    /* Career Totals: each total carries its all-time rank underneath. */
    .ct-cell { white-space: nowrap; }
    .ct-rank { display: block; font-size: 0.7rem; font-weight: 400; color: var(--text-muted); }
    .ct-rank a { color: inherit; text-decoration: none; }
    .ct-rank a:hover { text-decoration: underline; }
    .ct-rank .ct-active { opacity: 0.8; }
    .ct-top10 .ct-rank { color: var(--gold); font-weight: 700; }
    .ct-top50 .ct-rank { color: var(--accent-light); }
    .ct-note { font-size: 0.75rem; color: var(--text-muted); margin-top: var(--space-2); }
    .career-row td { font-weight: 600; color: var(--text-primary); }
    /* Playoff rows sit in the same tables as the regular season, so they
       carry a gold tint and edge to stand apart. */
    .po-row td { background: color-mix(in srgb, var(--gold) 7%, transparent); }
    .po-row td:first-child { box-shadow: inset 3px 0 0 var(--gold-dim); color: var(--gold); }
    .career-row + .career-row { border-top: none !important; }

    /* Headline tiles (OVR, Hall of Fame, Contract, History, Health): the same card, label,
       figure and one line of context, so they read as a set rather than
       unrelated widgets. */
    .hero-tiles { display: flex; flex-wrap: wrap; gap: var(--space-3); margin-bottom: var(--space-4); }
    .hero-tile {
      display: flex; flex-direction: column; gap: 0.3rem; flex: 1 1 10.5rem; min-width: 0;
      padding: var(--space-3) var(--space-4);
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      color: inherit; text-decoration: none; transition: border-color 0.15s;
    }
    a.hero-tile:hover { border-color: var(--text-muted); text-decoration: none; }
    .tile-label { font-family: var(--font-display); font-size: var(--text-sm); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); }
    .tile-main { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-3); }
    .tile-value { font-size: 1.9rem; line-height: 1; color: var(--text-primary); font-variant-numeric: tabular-nums; }
    .tile-value small { margin-left: 0.25rem; font-size: 0.72rem; font-weight: 600; color: var(--text-muted); }
    .tile-sub { font-size: 0.75rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .tile-sub b { color: var(--text-secondary); font-weight: 600; }
    .tile-up { color: var(--success); }
    .tile-down { color: var(--danger); }
    .tile-spark { display: block; }
    .hof-bar { height: 3px; border-radius: 2px; background: var(--border); overflow: hidden; margin-top: 0.15rem; }
    .hof-bar i { display: block; height: 100%; background: var(--text-muted); }
    .hof-top10 .tile-label, .hof-top10 .tile-sub b:first-child { color: var(--gold); }
    .hof-top10 .hof-bar i { background: var(--gold); }
    /* Contract: the shorthand is words, not a figure, so it runs smaller in the same line box. */
    .tile-value--text { font-size: 1.3rem; line-height: 1.9rem; font-weight: 600; white-space: nowrap; }
    /* Health: green when healthy, the injury badge's colour when not. */
    .health-tile .tile-value { color: var(--success); }
    .health-tile.hurt { border-left: 3px solid var(--warning); }
    .health-tile.hurt .tile-value { color: var(--warning); }
    .health-tile.out { border-left: 3px solid var(--danger); }
    .health-tile.out .tile-value { color: var(--danger); }
    .health-tile .tile-sub .neg { color: var(--danger); }

    /* Compare / Edit Bio, quiet, top right of the header. */
    .player-actions { margin-left: auto; display: flex; gap: var(--space-2); align-items: center; }
    .player-actions a, .player-actions button {
      padding: 0.25rem 0.6rem; border-radius: var(--radius-sm); background: transparent;
      border: 1px solid var(--border); color: var(--text-muted);
      font: inherit; font-size: 0.75rem; font-weight: 500; cursor: pointer; text-decoration: none;
    }
    .player-actions a:hover, .player-actions button:hover { color: var(--text-secondary); border-color: var(--text-muted); text-decoration: none; }
    @media (max-width: 600px) {
      .header-main { flex-wrap: wrap; gap: 0.75rem 1rem; }
      .header-main .profile-photo { width: 56px; height: 56px; }
      .header-text { flex: 1; min-width: 0; }
      .player-actions { order: 3; margin-left: 0; flex-basis: 100%; }
    }

    /* Subtitle: positions · team · seasons */
    .identity { display: flex; flex-wrap: wrap; align-items: center; gap: 0.25rem 0.5rem; }
    .identity .pos { font-weight: 700; color: var(--text-secondary); letter-spacing: 0.02em; }
    .identity a.team { display: inline-flex; align-items: center; gap: 0.35rem; color: var(--text-secondary); font-weight: 600; text-decoration: none; }
    .player-actions .player-compare { font-size: var(--text-md); line-height: 1; padding: 0.2rem 0.5rem; }
    .identity .team-abbr { display: none; }
    .identity a.team:hover { color: var(--text-primary); }
    @media (max-width: 600px) {
      /* Compare (the only action left on a phone) sits in the header's
         top-right corner instead of taking a row of its own. */
      header.ui-header { position: relative; }
      .player-actions { position: absolute; top: 0; right: 0; }
      .ui-header[data-team] .player-actions { top: var(--space-3); right: var(--space-3); }
      .header-text { padding-right: 2.5rem; }
      /* One row on a phone: "PG / SG · ORL · 7 NBN seasons", the team as its
         abbreviation so the line fits. */
      .identity { flex-wrap: nowrap; white-space: nowrap; }
      .identity .team-full { display: none; }
      .identity .team-abbr { display: inline; }
    }
    .identity a.team img { width: 18px; height: 18px; object-fit: contain; }
    .identity .retired { font-weight: 600; color: var(--text-muted); text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.06em; }

    .page-tabs {
      display: flex;
      gap: 0.35rem;
      margin-bottom: 1rem;
    }

    .page-tab {
      padding: 0.3rem 0.75rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }

    .page-tab:hover { background: var(--bg-hover); color: var(--text-secondary); }
    .page-tab.active { background: var(--accent-panel-bg); border-color: var(--accent); color: var(--accent-light); }

    .missing-bar {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .missing-bar-label {
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--text-secondary);
      margin-right: 0.1rem;
    }

    .missing-btn {
      padding: 0.3rem 0.75rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }

    .missing-btn:hover { background: var(--bg-hover); color: var(--text-secondary); }
    .missing-btn.active { background: #451a03; border-color: var(--champion-border); color: #fcd34d; }

    .rostered-btn {
      padding: 0.3rem 0.75rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }
    .rostered-btn:hover { background: var(--bg-hover); color: var(--text-secondary); }
    .rostered-btn.active { background: var(--success-bg); border-color: #16a34a; color: var(--success-light); }

    .filter-bar {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .filter-search,
    .filter-team {
      padding: 0.5rem 0.75rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 0.875rem;
      font-family: inherit;
      outline: none;
    }

    .filter-search { flex: 1; min-width: 180px; }
    .filter-search::placeholder { color: var(--text-muted); }
    .filter-search:focus,
    .filter-team:focus { border-color: var(--accent); }

    .filter-team { cursor: pointer; min-width: 140px; }

    .filter-count { color: var(--text-muted); font-size: 0.85rem; align-self: center; white-space: nowrap; }

    .no-results { color: var(--text-muted); font-size: 0.9rem; padding: 1.5rem 0; }

    /* player index table */
    .idx-team { display: inline-flex; align-items: center; gap: 0.3rem; white-space: nowrap; font-weight: 600; }
    .idx-team img { width: 18px; height: 18px; object-fit: contain; }
    .player-name-cell {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .player-photo-sm {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      object-position: top center;
      background: var(--border);
      flex-shrink: 0;
    }

    .player-placeholder-sm {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--border);
      flex-shrink: 0;
    }

    .champion-name { color: var(--warning); }

    tbody tr.clickable-row { cursor: pointer; }

    /* bio edit form */
    .bio-edit-form {
      background: var(--bg-page); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 0.9rem 1.1rem; margin-top: 0.5rem; margin-bottom: 0.75rem;
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem 1rem;
    }
    @media (max-width: 500px) { .bio-edit-form { grid-template-columns: 1fr; } }

    .bio-edit-form label {
      display: flex; flex-direction: column; gap: 0.2rem;
      font-size: var(--text-sm); color: var(--text-secondary); font-weight: 500;
    }
    .bio-edit-form input {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm);
      color: var(--text-primary); font-size: 0.85rem; font-family: inherit;
      padding: 0.32rem 0.55rem; outline: none;
    }
    .bio-edit-form input:focus { border-color: var(--accent); }
    .bio-edit-form select {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm);
      color: var(--text-primary); font-size: 0.85rem; font-family: inherit;
      padding: 0.32rem 0.55rem; outline: none; cursor: pointer;
    }
    .bio-edit-form select:focus { border-color: var(--accent); }
    .salary-rows { display: flex; flex-direction: column; gap: 0.4rem; margin-top: 0.25rem; }
    .salary-row { display: flex; flex-direction: column; gap: 0.2rem; }
    .salary-row-main { display: flex; gap: 0.4rem; align-items: center; }
    .salary-row-main input { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm);
      color: var(--text-primary); font-size: 0.85rem; font-family: inherit; padding: 0.32rem 0.55rem; outline: none; }
    .salary-row-main input:focus { border-color: var(--accent); }
    .salary-row-main .season-input { width: 5.5rem; flex: 0 0 auto; }
    .salary-row-main .amount-input { flex: 1; }
    .salary-row-main .hold-select {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm);
      color: var(--text-muted); font-size: 0.8rem; font-family: inherit;
      padding: 0.32rem 0.4rem; outline: none; cursor: pointer; flex: 0 0 auto;
    }
    .salary-row-main .hold-select:focus { border-color: var(--accent); }
    /* Guarantee steps */
    .gtd-steps { display: none; flex-direction: column; gap: 0.3rem; margin-left: 1rem; padding: 0.4rem 0.6rem; background: rgba(0,0,0,0.2); border-left: 2px solid var(--border); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
    .gtd-steps.visible { display: flex; }
    .gtd-steps-desc { font-size: 0.68rem; color: var(--text-muted); font-style: italic; margin-bottom: 0.15rem; }
    .gtd-step { display: flex; gap: 0.35rem; align-items: center; }
    .gtd-step-conn { font-size: 0.72rem; color: var(--text-muted); white-space: nowrap; flex-shrink: 0; }
    .gtd-step input { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary); font-size: 0.8rem; font-family: inherit; padding: 0.28rem 0.5rem; outline: none; }
    .gtd-step input:focus { border-color: var(--accent); }
    .gtd-step .gtd-step-amount { width: 9rem; }
    .gtd-step .gtd-step-date { width: 9.5rem; }
    .gtd-step .gtd-step-remove { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; padding: 0 0.2rem; line-height: 1; }
    .gtd-step .gtd-step-remove:hover { color: var(--danger); }
    .add-step-btn { align-self: flex-start; background: none; border: 1px dashed var(--border); border-radius: var(--radius-sm); color: var(--text-muted); cursor: pointer; font-size: 0.7rem; padding: 0.1rem 0.5rem; font-family: inherit; }
    .add-step-btn:hover { color: var(--text-secondary); border-color: var(--text-muted); }
    .bio-edit-form .full-col { grid-column: 1 / -1; }
    .field-hint { font-size: 0.68rem; color: var(--text-muted); margin-top: 0.2rem; line-height: 1.4; }
    .bio-edit-actions {
      grid-column: 1 / -1; display: flex; gap: 0.5rem; align-items: center; padding-top: 0.1rem;
    }
    .edit-btn {
      padding: 0.28rem 0.7rem; border-radius: var(--radius-sm); font-size: 0.78rem;
      font-weight: 600; cursor: pointer; font-family: inherit; border: 1px solid;
    }
    .edit-btn-primary { background: var(--accent-panel-bg); border-color: var(--accent); color: var(--accent-light); }
    .edit-btn-primary:hover { background: #223f70; }
    .edit-btn-secondary { background: transparent; border-color: var(--border); color: var(--text-muted); }
    .edit-btn-secondary:hover { color: var(--text-secondary); border-color: var(--text-muted); }
    .edit-status { font-size: 0.75rem; color: var(--danger); }
    .btn-add-player {
      padding: 0.35rem 0.75rem; background: var(--accent-panel-bg); border: 1px solid var(--accent);
      border-radius: var(--radius-sm); color: var(--accent-light); font-size: 0.78rem; font-weight: 600;
      cursor: pointer; font-family: inherit; white-space: nowrap;
    }
    .btn-add-player:hover { background: #223f70; }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.65);
      display: flex; align-items: center; justify-content: center; z-index: 100;
    }
    .modal-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 1.5rem; width: min(540px, 92vw); max-height: 88vh; overflow-y: auto;
    }
    .modal-card h3 { font-size: 1rem; font-weight: 700; margin-bottom: 1rem; }
    .slug-field {
      display: flex; flex-direction: column; gap: 0.2rem; margin-bottom: 0.75rem;
      font-size: 0.7rem; color: var(--text-muted); font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .slug-field input {
      background: var(--bg-page); border: 1px solid var(--border); border-radius: var(--radius-sm);
      color: var(--text-primary); font-size: 0.85rem; font-family: inherit;
      padding: 0.32rem 0.55rem; outline: none;
    }
    .slug-field input:focus { border-color: var(--accent); }
    .slug-exists-warn {
      display: none; margin-top: 0.3rem; padding: 0.4rem 0.6rem;
      background: var(--danger-alt-bg); border: 1px solid var(--danger-alt-border); border-radius: var(--radius-sm);
      color: var(--danger-light); font-size: 0.78rem; font-weight: 400;
      text-transform: none; letter-spacing: 0;
    }
    .slug-exists-warn a { color: var(--danger-light); text-decoration: underline; }
    .pos-picker { display: flex; gap: 0.35rem; flex-wrap: wrap; margin-top: 0.25rem; }
    .pos-pill {
      padding: 0.18rem 0.5rem; border-radius: var(--radius-sm); font-size: 0.75rem; font-weight: 700;
      cursor: pointer; font-family: inherit; border: 1px solid var(--border);
      background: transparent; color: var(--text-muted);
    }
    .pos-pill.selected { background: var(--accent-panel-bg); border-color: var(--accent); color: var(--accent-light); }
    .pos-pill:hover:not(.selected) { border-color: var(--text-muted); color: var(--text-muted); }

    /* The top of a player page: the bio line and the tiles across the full
       width, then the career card and the archetype radar side by side, the
       same height, so neither hangs beside empty space. */
    .player-hero { margin-bottom: var(--space-5); }
    .hero-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: var(--space-3); align-items: stretch; }
    .career-card {
      display: flex; flex-direction: column; gap: var(--space-3);
      padding: var(--space-3) var(--space-4);
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
    }
    .career-card .career-line-note { margin-top: 0; }
    .career-card .career-line { margin-top: 0; }
    .career-card .accolades { margin: auto 0 0; }
    /* The radar card lies on its side here: the chart on the left, the
       season picker and the similar seasons on the right. */
    .hero-row > .ui-radar--card {
      display: grid; grid-template-columns: 210px minmax(0, 1fr); grid-template-rows: auto 1fr;
      column-gap: var(--space-4); align-items: start; padding: var(--space-3) var(--space-4);
    }
    /* radar.js nests the chart (and the page's similar list) in wrappers;
       let them through so both sit on the card's grid. */
    .hero-row > .ui-radar--card > div:nth-child(2),
    .hero-row > .ui-radar--card > div:nth-child(2) > div { display: contents; }
    .hero-row > .ui-radar--card svg { grid-column: 1; grid-row: 1 / span 2; }
    .hero-row > .ui-radar--card .ui-radar-head { grid-column: 2; grid-row: 1; }
    .hero-row > .ui-radar--card .similar { grid-column: 2; grid-row: 2; margin-top: var(--space-3); }
    .hero-row > .ui-radar svg { width: 210px !important; height: auto; }  /* radar.js sets 280px inline */
    @media (max-width: 900px) {
      .hero-row { grid-template-columns: minmax(0, 1fr); }
    }
    @media (max-width: 480px) {
      .hero-row > .ui-radar--card { display: flex; }
      .hero-row > .ui-radar--card .similar { align-self: stretch; }
    }
    /* Feats & Streaks, side by side on a wide screen. */
    .ins-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--space-4); align-items: start; }
    .ins-grid .ui-table-wrap { margin: 0; }
    .ins-top10 a { color: var(--gold); font-weight: 700; }
    .ins-when { white-space: nowrap; font-size: var(--text-sm); }
    .ins-active { color: var(--success) !important; font-weight: 600; }
    .ins-note { font-size: 0.75rem; color: var(--text-muted); margin-top: var(--space-2); }
    .splits-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); }
    .splits-head .ui-select { width: auto; }
    .splits-opp { display: inline-flex; align-items: center; gap: 0.4rem; font-weight: 600; }
    .splits-opp img { width: 18px; height: 18px; object-fit: contain; }
    /* Most similar seasons, under the archetype radar. */
    .similar { margin-top: var(--space-2); padding-top: var(--space-2); border-top: 1px solid var(--border-subtle); }
    .similar-label { font-family: var(--font-display); font-size: var(--text-sm); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.25rem; }
    .similar-row { display: flex; justify-content: space-between; gap: var(--space-3); padding: 0.2rem 0; font-size: var(--text-sm); text-decoration: none; color: var(--text-secondary); }
    .similar-row:hover { color: var(--link); text-decoration: none; }
    .similar-season { color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .career-line-note { margin-top: var(--space-4); font-family: var(--font-display); font-size: var(--text-sm); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); }
    .career-line { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-6); margin-top: var(--space-2); }
    .career-fig-value { font-family: var(--font-display); font-size: 1.9rem; font-weight: 700; line-height: 1; color: var(--text-primary); font-variant-numeric: tabular-nums; }
    .career-fig-label { font-size: 0.72rem; color: var(--text-muted); margin-top: 0.2rem; }

    .gamelog-pagination {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.5rem 0;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .gl-page-btn {
      padding: 0.3rem 0.7rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.12s, color 0.12s;
    }
    .gl-page-btn:hover:not(:disabled) { background: var(--bg-hover); color: var(--text-secondary); }
    .gl-page-btn:disabled { opacity: 0.35; cursor: default; }
    .po-badge {
      display: inline-block;
      padding: 0.1rem 0.32rem;
      border-radius: var(--radius-sm);
      font-size: 0.62rem;
      font-weight: 700;
      background: var(--accent-panel-bg);
      color: var(--accent-light);
      letter-spacing: 0.04em;
      vertical-align: middle;
      margin-left: 3px;
    }
  </style>
</head>
<body>
<div class="page ui-page ui-page--wide">
  <nav class="nav" id="nav"></nav>
  <header class="ui-header" style="align-items:center">
    <div class="header-main">
      <div class="header-text">
        <h1 class="ui-title" id="page-title">Players</h1>
        <p class="ui-subtitle" id="page-sub"></p>
      </div>
    </div>
  </header>
  <nav class="ui-tabs" id="players-tabs" aria-label="Player pages">
    <a class="ui-tab active" aria-current="page" href="/players">All Players</a>
    <a class="ui-tab" href="/compare/">Compare</a>
    <a class="ui-tab" href="/ratings-changes/">Ratings Changes</a>
  </nav>
  <div id="content"><div id="status">Loading...</div></div>
</div>

<script src="/country-iso.js"></script>
<script src="/ratings-popup.js"></script>
<script src="/league-time.js"></script>
<script src="/names.js"></script>
<script src="/radar.js"></script>
<script src="/injury-history.js"></script>
<script src="/contract.js"></script>
<script src="/players/subpage.js"></script>
<script>
(function () {
  const slug = new URLSearchParams(location.search).get('p');
  // The strip links the player index's sibling pages; on a profile it
  // becomes the player's own: Profile, 2K Ratings, Contract, History, Injuries.
  if (slug) PlayerSubpage.renderTabs(document.getElementById('players-tabs'), slug, 'profile');

  let biosData = {};
  let teamMap = {};
  const slugByName = new Map();  // UPPERCASE player name → slug, for hof.csv
  let currentOvr = {};
  let allOvrHistory = {};
  let allAttributes = {};
  let allPlayerSeasons = [];

  // allAttributes is {slug: [snapshot, …]} oldest-first — current is the last entry.
  function currentAttributes(playerSlug) {
    const history = allAttributes[playerSlug];
    return history && history.length ? history[history.length - 1] : null;
  }

  // The current league year (cap/contract clock). Set from GET /api/league-year at
  // page load; falls back to the date-based season if that fetch fails. Drives the
  // default starting season offered in the contract editor.
  let LEAGUE_YEAR = null;

  function currentSeasonStr() {
    if (LEAGUE_YEAR) return LEAGUE_YEAR;
    const now = new Date();
    const y = now.getFullYear() % 100;
    const m = now.getMonth() + 1;
    return m < 7
      ? `${String(y - 1).padStart(2, '0')}-${String(y).padStart(2, '0')}`
      : `${String(y).padStart(2, '0')}-${String((y + 1) % 100).padStart(2, '0')}`;
  }

  const TEAM_NAMES = {
    ATL:'Atlanta Hawks', BKN:'Brooklyn Nets', BOS:'Boston Celtics', CHA:'Charlotte Hornets',
    CHI:'Chicago Bulls', CLE:'Cleveland Cavaliers', DAL:'Dallas Mavericks', DEN:'Denver Nuggets',
    DET:'Detroit Pistons', GSW:'Golden State Warriors', HOU:'Houston Rockets', IND:'Indiana Pacers',
    LAC:'LA Clippers', LAL:'Los Angeles Lakers', MEM:'Memphis Grizzlies', MIA:'Miami Heat',
    MIL:'Milwaukee Bucks', MIN:'Minnesota Timberwolves', NOP:'New Orleans Pelicans', NYK:'New York Knicks',
    OKC:'Oklahoma City Thunder', ORL:'Orlando Magic', PHI:'Philadelphia 76ers', PHX:'Phoenix Suns',
    POR:'Portland Trail Blazers', SAC:'Sacramento Kings', SAS:'San Antonio Spurs', TOR:'Toronto Raptors',
    UTA:'Utah Jazz', WAS:'Washington Wizards',
  };

  // ── Bio name helpers ─────────────────────────────────────────────────────────

  // "CURRY, STEPHEN" → "Stephen Curry". Shared with every page via /names.js.
  function displayName(canonical) {
    return nbnPlayerName(canonical);
  }

  // Home / Players / <name>. Built as elements: .nav is a flex row with a gap,
  // so bare " / " text between links got the gap on one side only, and the
  // name went in as raw HTML.
  function setCrumbs(name) {
    const nav = document.getElementById('nav');
    nav.textContent = '';
    const add = (tag, text, href, cls) => {
      const el = document.createElement(tag);
      el.textContent = text;
      if (href) el.href = href;
      if (cls) el.className = cls;
      nav.appendChild(el);
    };
    add('a', 'Home', '/');
    add('span', '/', null, 'nav-crumb-sep');
    add('a', 'Players', '/players/');
    add('span', '/', null, 'nav-crumb-sep');
    add('span', name, null, 'nav-crumb-current');
  }

  // Canonical slug is LAST-FIRST ("CURRY, STEPHEN" → "curry-stephen"), i.e. the
  // bio name slugified in place. Do NOT run displayName() first — that flips it
  // to first-last and produces a key nothing else in the site agrees with.
  function slugFromName(canonical) {
    return canonical.toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  }

  // ── Token helpers ────────────────────────────────────────────────────────────

  // Async because it may have to ask. Every caller is an event handler, so
  // awaiting it costs nothing; the alternative is the browser's prompt box,
  // which cannot mask a credential.
  async function getToken() {
    const stored = localStorage.getItem('nbn_token');
    if (stored) return stored;
    return await promptForToken();
  }

  function clearToken() { localStorage.removeItem('nbn_token'); }

  // Roles for the current token, populated once on load from GET /api/auth/me.
  // Gate which edit affordances render — the API still enforces permissions on
  // write; this just hides controls the user couldn't actually use.
  let AUTH_ROLES = [];
  function hasAuthRole(role) {
    if (AUTH_ROLES.includes('admin')) return true;
    if (AUTH_ROLES.includes(role)) return true;
    if (role === 'rosters' && AUTH_ROLES.includes('bod')) return true;  // bod implies rosters
    return false;
  }
  // Bio + OVR edits require the rosters or curator role; adding players requires rosters.
  const canEditBios  = () => hasAuthRole('rosters') || hasAuthRole('curator');
  const canAddPlayer = () => hasAuthRole('rosters');

  // ── CSV helpers ──────────────────────────────────────────────────────────────

  // ── Sort helper ──────────────────────────────────────────────────────────────

  function sortVal(row, field) {
    const v = row[field];
    if (v === undefined || v === '' || v === 'NA') return -Infinity;
    if (field === 'SEASON') {
      const n = parseFloat(v);
      if (!isNaN(n)) return v.includes(' ') ? n + 0.5 : n;
    }
    const n = parseFloat(v);
    return isNaN(n) ? v.toLowerCase() : n;
  }

  // ── Age helper ───────────────────────────────────────────────────────────────

  function ageAtSeason(dob, season) {
    if (!dob || dob === 'NA') return '';
    const m = season && season.match(/\d{2}-(\d{2})/);
    if (!m) return '';
    const ref = new Date(2000 + parseInt(m[1], 10), 0, 1); // Jan 1 of end year
    const d = new Date(dob + 'T00:00:00');
    if (isNaN(d)) return '';
    let age = ref.getFullYear() - d.getFullYear();
    const mo = ref.getMonth() - d.getMonth();
    if (mo < 0 || (mo === 0 && ref.getDate() < d.getDate())) age--;
    return String(age);
  }

  // ── Season aggregation (toggle) ──────────────────────────────────────────────

  const SUM_FIELDS  = ['G','MIN','PTS','REB','AST','STL','BLK','TOV','PF','FGM','FGA','3PM','3PA','FTM','FTA','GMSC'];
  const HIGH_FIELDS = ['HIGH_P','HIGH_R','HIGH_A','HIGH_S','HIGH_B','HIGH_3PM','HIGH_GMSC'];

  function aggregateBySeasonRows(rows) {
    const map = new Map();
    rows.forEach(r => {
      if (!map.has(r.SEASON)) {
        map.set(r.SEASON, { ...r, _teams: [r.TEAM] });
      } else {
        const s = map.get(r.SEASON);
        s._teams.push(r.TEAM);
        SUM_FIELDS.forEach(f  => { s[f] = String(+s[f] + +r[f]); });
        HIGH_FIELDS.forEach(f => { s[f] = String(Math.max(+s[f], +r[f])); });
        if (r.LAST_DATE > s.LAST_DATE) s.LAST_DATE = r.LAST_DATE;
      }
    });
    return Array.from(map.values()).map(r => ({
      ...r,
      TEAM: r._teams.length > 1 ? `${r._teams.length}TM` : r._teams[0],
    }));
  }

  // ── Career summary rows ──────────────────────────────────────────────────────

  function careerStatsRow(rows) {
    const r = { SEASON: 'Career', TEAM: '—', LAST_DATE: '' };
    SUM_FIELDS.forEach(f => { r[f] = String(rows.reduce((a, row) => a + +row[f], 0)); });
    return r;
  }

  function careerHighsRow(rows) {
    const r = { SEASON: 'Career', TEAM: '—', LAST_DATE: '', G: String(rows.reduce((a, row) => a + +row.G, 0)) };
    HIGH_FIELDS.forEach(f => { r[f] = String(rows.reduce((a, row) => Math.max(a, +row[f]), 0)); });
    return r;
  }

  // ── Career totals with all-time ranks ────────────────────────────────────────

  // Each key is also a board on /stats/totals (?stat=KEY), which the rank links to.
  const CAREER_TOTAL_STATS = [
    { key: 'G',    label: 'G' },
    { key: 'MIN',  label: 'MIN' },
    { key: 'PTS',  label: 'PTS' },
    { key: 'REB',  label: 'REB' },
    { key: 'AST',  label: 'AST' },
    { key: 'STL',  label: 'STL' },
    { key: 'BLK',  label: 'BLK' },
    { key: '3PM',  label: '3PM' },
    { key: 'FGM',  label: 'FGM' },
    { key: 'FTM',  label: 'FTM' },
    { key: 'TOV',  label: 'TOV' },
    { key: 'PF',   label: 'PF' },
    { key: 'GMSC', label: 'GMSC' },
  ];

  // Sums every season row into one career line per slug. Rows for seasons not
  // played (G blank/NA, the build's bio-snapshot rows) are skipped.
  function careerTotalsBySlug(seasonRows) {
    const out = new Map();
    seasonRows.forEach(r => {
      if (!(+r.G > 0)) return;
      let t = out.get(r.SLUG);
      if (!t) { t = {}; CAREER_TOTAL_STATS.forEach(s => { t[s.key] = 0; }); out.set(r.SLUG, t); }
      CAREER_TOTAL_STATS.forEach(s => { t[s.key] += +r[s.key] || 0; });
    });
    return out;
  }

  // Competition ranking: rank = 1 + number of players strictly ahead, so level
  // totals share a rank. `pool` limits who is counted (null = everyone).
  function careerRank(totals, slug, key, pool) {
    const mine = totals.get(slug)?.[key];
    if (mine == null) return null;
    let ahead = 0, level = 0;
    totals.forEach((t, s) => {
      if (pool && !pool(s)) return;
      if (t[key] > mine) ahead++;
      else if (t[key] === mine && s !== slug) level++;
    });
    return { rank: ahead + 1, tied: level > 0 };
  }

  // The career in one line, under the accolades: per-game averages, games and
  // the best scoring night. Regular season only, the same basis as the
  // Career Totals table further down. It fills the hero's left column, which
  // otherwise sits empty beside the taller archetype radar.
  function renderCareerLine(container, rows, note = 'Career · regular season') {
    const played = rows.filter(r => +r.G > 0);
    if (!played.length) return;
    const sum = k => played.reduce((s, r) => s + (+r[k] || 0), 0);
    const g = sum('G');
    const high = Math.max(...played.map(r => +r.HIGH_P || 0));
    const figures = [
      ['PTS', (sum('PTS') / g).toFixed(1)],
      ['REB', (sum('REB') / g).toFixed(1)],
      ['AST', (sum('AST') / g).toFixed(1)],
      ['Games', g.toLocaleString()],
      ...(high > 0 ? [['Career high', `${high} pts`]] : []),
    ];
    const el = (cls, text) => {
      const n = document.createElement('div');
      n.className = cls;
      n.textContent = text;
      return n;
    };
    const wrap = document.createElement('div');
    wrap.className = 'career-line';
    wrap.setAttribute('aria-label', `${note} averages`);
    figures.forEach(([label, value]) => {
      const f = document.createElement('div');
      f.className = 'career-fig';
      f.appendChild(el('career-fig-value', value));
      f.appendChild(el('career-fig-label', label));
      wrap.appendChild(f);
    });
    container.appendChild(el('career-line-note', note));
    container.appendChild(wrap);
  }

  // Feats, streaks and teammates: GET /api/players/{slug}/insights, which
  // ranks this player against every other one (the page alone only has its
  // own games). Renders nothing if the call fails; the rest of the page
  // doesn't depend on it.
  function renderInsights(container, slug) {
    const fmtDay = iso => {
      const [y, m, d] = iso.split('-').map(Number);
      return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
    };
    const rankText = r => (r.tied ? 'T-' : '#') + r.rank;
    const rankCell = (td, r, href) => {
      if (!r.rank) { td.textContent = '—'; td.classList.add('muted'); return; }
      const a = document.createElement('a');
      a.textContent = rankText(r);
      if (href) a.href = href;
      td.appendChild(a);
      if (r.rank <= 10) td.classList.add('ins-top10');
    };
    const table = (heads) => {
      const wrap = document.createElement('div');
      wrap.className = 'ui-table-wrap';
      const t = document.createElement('table');
      t.className = 'ui-table ui-table--dense';
      const hr = t.createTHead().insertRow();
      heads.forEach(([label, cls]) => {
        const th = document.createElement('th');
        th.textContent = label;
        if (cls) th.className = cls;
        hr.appendChild(th);
      });
      wrap.appendChild(t);
      return { wrap, body: t.createTBody() };
    };
    const cell = (tr, text, cls) => {
      const td = tr.insertCell();
      if (text != null) td.textContent = text;
      if (cls) td.className = cls;
      return td;
    };

    fetch(`/api/players/${encodeURIComponent(slug)}/insights`)
      .then(r => (r.ok ? r.json() : null))
      .then(data => {
        if (!data) return;
        const feats = (data.feats || []).filter(f => f.count > 0);
        const streaks = (data.streaks || []).filter(s => s.length > 1);

        if (feats.length || streaks.length) {
          const h2 = document.createElement('h2');
          h2.className = 'section-heading';
          h2.textContent = 'Feats & Streaks';
          container.appendChild(h2);
          const grid = document.createElement('div');
          grid.className = 'ins-grid';
          container.appendChild(grid);

          if (feats.length) {
            const { wrap, body } = table([['Career', ''], ['Games', 'right'], ['All-time', 'right']]);
            feats.forEach(f => {
              const tr = body.insertRow();
              cell(tr, f.name);
              cell(tr, f.count.toLocaleString(), 'right strong');
              rankCell(cell(tr, null, 'right'), f, `/stats/highs/?stat=${encodeURIComponent(f.key)}`);
            });
            grid.appendChild(wrap);
          }
          if (streaks.length) {
            const { wrap, body } = table([['Longest run of', ''], ['Games', 'right'], ['When', ''], ['All-time', 'right']]);
            streaks.forEach(s => {
              const tr = body.insertRow();
              cell(tr, s.name);
              cell(tr, String(s.length), 'right strong');
              const when = cell(tr, `${fmtDay(s.start)} – ${s.active ? 'now' : fmtDay(s.end)}`, 'muted ins-when');
              if (s.active) when.classList.add('ins-active');
              rankCell(cell(tr, null, 'right'), s, null);
            });
            grid.appendChild(wrap);
            const note = document.createElement('div');
            note.className = 'ins-note';
            note.textContent = 'Streaks count regular-season games in a row, across seasons. Games a player missed don’t break a run.';
            container.appendChild(note);
          }
        }

        const mates = data.teammates || [];
        if (mates.length) {
          const h2 = document.createElement('h2');
          h2.className = 'section-heading';
          h2.textContent = 'Most Games Together';
          container.appendChild(h2);
          const { wrap, body } = table([['Teammate', ''], ['Games', 'right'], ['Record', 'right'], ['Win %', 'right']]);
          mates.slice(0, 10).forEach(t => {
            const tr = body.insertRow();
            const a = document.createElement('a');
            a.href = `/players/?p=${encodeURIComponent(t.slug)}`;
            a.textContent = typeof nbnPlayerName === 'function' ? nbnPlayerName(t.player) : t.player;
            cell(tr).appendChild(a);
            cell(tr, t.games.toLocaleString(), 'right');
            cell(tr, `${t.w}–${t.l}`, 'right');
            cell(tr, (t.w / Math.max(1, t.games)).toFixed(3).replace(/^0/, ''), 'right');
          });
          container.appendChild(wrap);
          const note = document.createElement('div');
          note.className = 'ins-note';
          note.textContent = 'Games both played for the same team, playoffs included, and the team’s record in them.';
          container.appendChild(note);
        }
      })
      .catch(() => {});
  }

  function renderCareerTotals(container, slug, regRows, poRows) {
    const h2 = document.createElement('h2');
    h2.className = 'section-heading';
    h2.textContent = 'Career Totals';
    container.appendChild(h2);

    const wrap = document.createElement('div');
    wrap.className = 'ui-table-wrap';
    container.appendChild(wrap);
    const table = document.createElement('table');
    table.className = 'ui-table';
    wrap.appendChild(table);

    const hr = table.createTHead().insertRow();
    ['', ...CAREER_TOTAL_STATS.map(s => s.label)].forEach((label, i) => {
      const th = document.createElement('th');
      th.textContent = label;
      if (i) th.classList.add('right');
      hr.appendChild(th);
    });
    const tbody = table.createTBody();

    // "Active" means on a roster today.
    const isActive = s => !!teamMap[s];
    const fmtRank = r => (r.tied ? 'T-' : '#') + r.rank;

    function addRow(label, seasonRows) {
      const totals = careerTotalsBySlug(seasonRows);
      const mine = totals.get(slug);
      if (!mine) return;
      const tr = tbody.insertRow();
      const th = tr.insertCell();
      th.textContent = label;
      th.className = 'muted';
      CAREER_TOTAL_STATS.forEach(s => {
        const td = tr.insertCell();
        td.className = 'right ct-cell';

  const LEADER_STATS = ['PTS', 'REB', 'AST', 'STL', 'BLK', '3PM', 'GMSC'];

  function buildSeasonLeaders(allRows) {
    const bySlugSeason = new Map();
    allRows.forEach(r => {
      if (!r.SLUG || !r.SEASON || r.SEASON.includes('Playoffs')) return;
      const key = r.SLUG + '|' + r.SEASON;
      if (!bySlugSeason.has(key)) {
        bySlugSeason.set(key, { SLUG: r.SLUG, SEASON: r.SEASON, PTS: 0, REB: 0, AST: 0, STL: 0, BLK: 0, '3PM': 0, GMSC: 0 });
      }
      const s = bySlugSeason.get(key);
      LEADER_STATS.forEach(f => { s[f] += +r[f] || 0; });
    });
    const leaders = {};
    for (const row of bySlugSeason.values()) {
      const season = row.SEASON;
      if (!leaders[season]) leaders[season] = {};
      LEADER_STATS.forEach(f => {
        const v = row[f];
        if (!leaders[season][f] || v > leaders[season][f].val) {
          leaders[season][f] = { slug: row.SLUG, val: v };
        }
      });
    }
    return leaders;
  }

  // A small card under the accolades: HOF points, the all-time and active
  // ranks, and a bar against the league's top score. hof.csv only lists the
  // top 250, so a player outside it shows nothing.
  function renderHofLine(container, playerName, hofRows) {
    const key = (playerName || '').toUpperCase();
    const idx = hofRows.findIndex(r => (r.PLAYER || '').toUpperCase() === key);
    if (idx < 0) return;
    const pts = +hofRows[idx].HOF_POINTS;
    const top = Math.max(...hofRows.map(r => +r.HOF_POINTS || 0));
    const rankOf = pool => {
      let ahead = 0, level = 0;
      hofRows.forEach((r, i) => {
        if (i === idx || !pool(r)) return;
        const p = +r.HOF_POINTS;
        if (p > pts) ahead++; else if (p === pts) level++;
      });
      return { label: (level ? 'T-' : '#') + (ahead + 1), rank: ahead + 1 };
    };
    const el = (tag, cls, text) => {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    };

    const all = rankOf(() => true);
    const card = el('a', 'hero-tile');
    card.href = '/hof/';
    card.title = 'Hall of Fame standings';
    if (all.rank <= 10) card.classList.add('hof-top10');

    card.appendChild(el('div', 'tile-label', 'Hall of Fame'));
    const score = el('div', 'tile-value');
    const num = el('span', null, pts.toFixed(1));
    score.appendChild(num);
    score.appendChild(el('small', null, 'pts'));
    card.appendChild(score);

    // "Active" means on a roster today, as in Career Totals.
    const sub = el('div', 'tile-sub');
    sub.appendChild(el('b', null, all.label));
    sub.appendChild(document.createTextNode(' all-time'));
    if (teamMap[slug]) {
      sub.appendChild(document.createTextNode(' · '));
      sub.appendChild(el('b', null, rankOf(r => !!teamMap[slugByName.get((r.PLAYER || '').toUpperCase())]).label));
      sub.appendChild(document.createTextNode(' active'));
    }
    card.appendChild(sub);

    const bar = el('div', 'hof-bar');
    const fill = el('i');
    fill.style.width = `${top > 0 ? Math.max(2, (pts / top) * 100) : 0}%`;
    bar.appendChild(fill);
    bar.title = `${Math.round((pts / top) * 100)}% of the top score (${top.toFixed(1)})`;
    card.appendChild(bar);

    container.appendChild(card);
  }

  function buildSection(container, title, rows, cols, defaultSortField, tiebreakerField, careerRow, leaderCheck, iconFn) {
    const h2 = document.createElement('h2');
    h2.className = 'section-heading';
    h2.textContent = title;
    container.appendChild(h2);

    const wrap = document.createElement('div');
    wrap.className = 'ui-table-wrap';
    container.appendChild(wrap);

    let sortField = defaultSortField || cols[0].sortField;
    let sortDir = (cols.find(c => c.sortField === sortField) || cols[0]).defaultDir ?? -1;

    const table = document.createElement('table'); table.className = 'ui-table';
    const thead = table.createTHead();
    const hr = thead.insertRow();
    const thEls = [];

    cols.forEach(col => {
      const th = document.createElement('th');
      if (col.cls && col.cls.includes('right')) th.classList.add('right');
      const arrow = document.createElement('span');
      arrow.className = 'sort-arrow';
      th.appendChild(document.createTextNode(col.label ?? col.key));
      th.appendChild(arrow);
      th.addEventListener('click', () => {
        if (sortField === col.sortField) {
          sortDir *= -1;
        } else {
          sortField = col.sortField;
          sortDir = col.defaultDir ?? -1;
        }
        updateHeaders();
        rebuildBody();
      });
      thEls.push(th);
      hr.appendChild(th);
    });

    const tbody = table.createTBody();
    wrap.appendChild(table);

    function updateHeaders() {
      thEls.forEach((th, i) => {
        const active = cols[i].sortField === sortField;
        th.dataset.active = active;
        th.querySelector('.sort-arrow').textContent = active ? (sortDir === -1 ? '↓' : '↑') : '';
      });
    }

    function renderRow(tr, row, isCareer) {
      cols.forEach(col => {
        const td = tr.insertCell();
        if (col.cls) td.className = col.cls;
        td.textContent = col.display ? col.display(row) : (row[col.key] ?? '');
        if (!isCareer && leaderCheck && leaderCheck(row, col)) {
          td.classList.add('league-leader');
        }
        if (!isCareer && col.iconSlot && iconFn) {
          iconFn(row).forEach(icon => {
            const span = document.createElement('span');
            span.className = `row-icon ui-icon ui-icon--${icon}`;
            span.title = ICON_TITLE[icon];
            span.setAttribute('role', 'img');
            span.setAttribute('aria-label', ICON_TITLE[icon]);
            td.appendChild(span);
          });
        }
      });
    }

    function rebuildBody() {
      const sorted = [...rows].sort((a, b) => {
        const va = sortVal(a, sortField);
        const vb = sortVal(b, sortField);
        if (va < vb) return sortDir === 1 ? -1 : 1;
        if (va > vb) return sortDir === 1 ? 1 : -1;
        if (tiebreakerField) {
          const ta = a[tiebreakerField] ?? '';
          const tb = b[tiebreakerField] ?? '';
          if (ta < tb) return sortDir === 1 ? -1 : 1;
          if (ta > tb) return sortDir === 1 ? 1 : -1;
        }
        return 0;
      });

      tbody.innerHTML = '';
      sorted.forEach(row => {
        const tr = tbody.insertRow();
        if (isPlayoffRow(row)) tr.className = 'po-row';
        renderRow(tr, row, false);
      });

      [].concat(careerRow || []).forEach(cr => {
        const tr = tbody.insertRow();
        tr.className = isPlayoffRow(cr) ? 'career-row po-row' : 'career-row';
        renderRow(tr, cr, true);
      });
    }

    updateHeaders();
    rebuildBody();
  }

        const amtIn = document.createElement('input');
        amtIn.type = 'text'; amtIn.className = 'gtd-step-amount';
        amtIn.placeholder = '$ partial amount';
        amtIn.title = 'Dollar amount that vests on this date. Leave blank to guarantee the full remaining salary.';
        amtIn.value = amt || '';

        const connOn = document.createElement('span');
        connOn.className = 'gtd-step-conn'; connOn.textContent = 'on';

        const dateIn = document.createElement('input');
        dateIn.type = 'date'; dateIn.className = 'gtd-step-date';
        dateIn.title = 'Date this amount vests. Leave blank for "at signing".';
        dateIn.value = dt || '';

        const rmBtn = document.createElement('button');
        rmBtn.type = 'button'; rmBtn.className = 'gtd-step-remove'; rmBtn.textContent = '×';
        rmBtn.addEventListener('click', () => stepRow.remove());

        const dateHint = document.createElement('span');
        dateHint.className = 'gtd-step-conn';
        dateHint.textContent = '(blank = at signing)';

        stepRow.appendChild(amtIn);
        stepRow.appendChild(connOn);
        stepRow.appendChild(dateIn);
        stepRow.appendChild(dateHint);
        stepRow.appendChild(rmBtn);
        stepsDiv.insertBefore(stepRow, addStepBtn);
      }

      const addStepBtn = document.createElement('button');
      addStepBtn.type = 'button'; addStepBtn.className = 'add-step-btn';
      addStepBtn.textContent = '+ guarantee step';
      addStepBtn.addEventListener('click', () => addGuaranteeStep());
      stepsDiv.appendChild(addStepBtn);

      holdSel.addEventListener('change', () => {
        const on = holdSel.value === 'NON_GTD';
        stepsDiv.classList.toggle('visible', on);
        if (!on) stepsDiv.querySelectorAll('.gtd-step').forEach(s => s.remove());
      });

      // Pre-populate steps
      if (Array.isArray(steps) && steps.length) {
        steps.forEach(s => addGuaranteeStep(s.amount, s.date));
      }

      row.appendChild(stepsDiv);
      return row;
    }

    const initCapMap = initial.cap_holds || {};
    const initSalaries = (initial.salaries && typeof initial.salaries === 'object') ? initial.salaries : {};
    const initGuaranteed = (initial.guaranteed && typeof initial.guaranteed === 'object') ? initial.guaranteed : {};
    const initGuaranteeDates = (initial.guarantee_dates && typeof initial.guarantee_dates === 'object') ? initial.guarantee_dates : {};
    const initGuaranteeSchedule = (initial.guarantee_schedule && typeof initial.guarantee_schedule === 'object') ? initial.guarantee_schedule : {};
    Object.entries(initSalaries).sort(([a], [b]) => a.localeCompare(b))
      .forEach(([k, v]) => {
        // Use guarantee_schedule if present; otherwise convert legacy guaranteed/guarantee_dates to steps
        let steps = initGuaranteeSchedule[k] || null;
        if (!steps) {
          const oldAmt  = initGuaranteed[k];
          const oldDate = initGuaranteeDates[k];
          if (oldAmt || oldDate) {
            steps = [];
            if (oldAmt)  steps.push({ amount: oldAmt });
            if (oldDate) steps.push({ date: oldDate });
          }
        }
        salRows.appendChild(makeSalaryRow(k, v, initCapMap[k] || '', steps));
      });

    const addSalBtn = document.createElement('button');
    addSalBtn.type = 'button'; addSalBtn.textContent = '+ Add season';
    addSalBtn.style.cssText = 'background:none;border:1px dashed var(--border);border-radius:var(--radius-sm);color:var(--text-muted);cursor:pointer;font-size:0.75rem;padding:0.2rem 0.6rem;font-family:inherit;margin-top:0.25rem;width:fit-content';
    addSalBtn.onmouseenter = () => { addSalBtn.style.color = 'var(--text-secondary)'; addSalBtn.style.borderColor = 'var(--text-muted)'; };
    addSalBtn.onmouseleave = () => { addSalBtn.style.color = 'var(--text-muted)'; addSalBtn.style.borderColor = 'var(--border)'; };
    addSalBtn.addEventListener('click', () => {
      const existing = salRows.querySelectorAll('.season-input');
      let next = '';
      if (existing.length) {
        const m = existing[existing.length - 1].value.match(/^(\d{2})-(\d{2})$/);
        if (m) next = `${m[2]}-${String(+m[2] + 1).padStart(2, '0')}`;
      } else {
        next = currentSeasonStr();
      }
      salRows.appendChild(makeSalaryRow(next, ''));
    });
    salLbl.appendChild(salRows); salLbl.appendChild(addSalBtn);
    form.appendChild(salLbl);

    // Toggle salary rows vs two-way shorthand
    typeSelect.addEventListener('change', () => {
      const isTW = typeSelect.value === 'two-way';
      twowayDiv.style.display = isTW ? '' : 'none';
      salLbl.style.display = isTW ? 'none' : '';
    });
    if ((initial.type || '') === 'two-way') {
      twowayDiv.style.display = '';
      salLbl.style.display = 'none';
      // Pre-fill years/start from existing salary data if it matches expected pattern
      const zeroYears = Object.entries(initSalaries).filter(([, v]) => v === '$0').map(([k]) => k).sort();
      if (zeroYears.length) { twStart.value = zeroYears[0]; twYears.value = String(zeroYears.length); }
    }

    if (onNameChange) fName.addEventListener('input', () => onNameChange(fName.value));

    const actions = document.createElement('div');
    actions.className = 'bio-edit-actions';
    const saveBtn = document.createElement('button');
    saveBtn.className = 'edit-btn edit-btn-primary';
    saveBtn.textContent = 'Save';
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'edit-btn edit-btn-secondary';
    cancelBtn.textContent = 'Cancel';
    const status = document.createElement('span');
    status.className = 'edit-status';
    actions.appendChild(saveBtn);
    actions.appendChild(cancelBtn);
    actions.appendChild(status);
    form.appendChild(actions);

    cancelBtn.addEventListener('click', onCancel);
    saveBtn.addEventListener('click', async () => {
      const token = await getToken();
      if (!token) return;
      const salaries = {};
      const cap_holds = {};
      const guaranteed = {};
      const guarantee_schedule = {};
      if (typeSelect.value === 'two-way') {
        const yrs = parseInt(twYears.value) || 0;
        let s = twStart.value.trim();
        for (let i = 0; i < yrs; i++) {
          salaries[s] = '$0'; guaranteed[s] = '$0';
          const m = s.match(/^(\d{2})-(\d{2})$/);
          s = m ? `${m[2]}-${String((+m[2] + 1) % 100).padStart(2, '0')}` : '';
        }
        if (s) { salaries[s] = '$1'; cap_holds[s] = 'RFA'; }
      } else {
        salRows.querySelectorAll('.salary-row').forEach(row => {
          const season  = row.querySelector('.season-input').value.trim();
          const amount  = row.querySelector('.amount-input').value.trim();
          const hold    = row.querySelector('.hold-select').value;
          if (season && amount) salaries[season] = amount;
          if (season && hold)   cap_holds[season] = hold;
          if (season && hold === 'NON_GTD') {
            const steps = [];
            row.querySelectorAll('.gtd-step').forEach(step => {
              const sAmt  = step.querySelector('.gtd-step-amount').value.trim();
              const sDate = step.querySelector('.gtd-step-date').value.trim();
              const entry = {};
              if (sAmt)  entry.amount = sAmt;
              if (sDate) entry.date   = sDate;
              steps.push(entry);
            });
            if (steps.length) guarantee_schedule[season] = steps;
          }
        });
      }
      const payload = {
        // Canonical bio name is uppercase "LAST, FIRST" with the comma-space —
        // normalize both here so a typed "Wallace,Keaton" can't land as-is and
        // read differently from every other bio on the page.
        name:        fName.value.trim().toUpperCase().replace(/\s*,\s*/, ', '),
        ...(posFrozen ? {} : { pos: [...selectedPos] }),
        dob:         fDob.value.trim(),
        college:     fCollege.value.trim(),
        country:     fCountry.value.trim(),
        draft_year:  fDftYr.value  ? +fDftYr.value  : null,
        draft_round: fDftR.value   ? +fDftR.value   : null,
        draft_pick:  fDftP.value   ? +fDftP.value   : null,
        height:      fHeight.value.trim(),
        weight:      fWeight.value  ? +fWeight.value  : null,
        wingspan:    fWingspan.value.trim(),
        photo_url:   fPhoto.value.trim(),
        retired:     retiredCb.checked,
        notes:       fNotes.value.trim(),
        jersey_number: initial.jersey_number ?? null,
        type:        typeSelect.value,
        cap_holds,
        salaries,
        guaranteed,
        guarantee_schedule,
      };
      if (!payload.name) { status.textContent = 'Name is required.'; return; }
      saveBtn.disabled = true;
      status.textContent = 'Saving…';
      try {
        await onSave(token, payload);
      } catch (e) {
        status.textContent = e.message || 'Save failed.';
        saveBtn.disabled = false;
      }
    });

    return form;
  }

  async function showAddPlayerModal() {
    const token = await getToken();
    if (!token) return;

    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    const card = document.createElement('div');
    card.className = 'modal-card';

    const h3 = document.createElement('h3');
    h3.textContent = 'Add Player';
    card.appendChild(h3);

    const slugLabel = document.createElement('label');
    slugLabel.className = 'slug-field';
    slugLabel.textContent = 'Slug (auto-derived, editable)';
    const slugInput = document.createElement('input');
    slugInput.type = 'text';

    const slugWarn = document.createElement('div');
    slugWarn.className = 'slug-exists-warn';

    function checkSlugExists() {
      const sl = slugInput.value.trim();
      if (sl && biosData[sl]) {
        const existing = biosData[sl];
        const displayN = existing.name ? displayName(existing.name) : sl;
        slugWarn.innerHTML = `<i class="ui-icon ui-icon--warning" aria-hidden="true"></i> <strong>${displayN}</strong> already exists — <a href="/players/?p=${sl}" target="_blank">view profile</a>`;
        slugWarn.style.display = '';
        slugInput.style.borderColor = 'var(--danger)';
      } else {
        slugWarn.style.display = 'none';
        slugInput.style.borderColor = '';
      }
    }

    slugInput.addEventListener('input', checkSlugExists);
    slugLabel.appendChild(slugInput);
    slugLabel.appendChild(slugWarn);
    card.appendChild(slugLabel);

    const form = renderBioForm(
      { name: '', pos: [], dob: '', college: '', country: '', draft_year: null, draft_round: null, draft_pick: null, photo_url: '', type: '', cap_holds: {}, salaries: {} },
      async (token, payload) => {
        const sl = slugInput.value.trim();
        if (!sl) throw new Error('Slug is required.');
        const resp = await fetch('/api/players', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...payload, slug: sl }),
        });
        if (resp.status === 401) { clearToken(); throw new Error('Token rejected.'); }
        if (resp.status === 409) throw new Error('A player with this slug already exists.');
        if (!resp.ok) { const d = await resp.json().catch(() => ({})); throw new Error(d.detail || 'Save failed.'); }
        location.reload();
      },
      () => overlay.remove(),
      (nameVal) => { slugInput.value = slugFromName(nameVal); checkSlugExists(); }
    );

    card.appendChild(form);
    overlay.appendChild(card);
    document.body.appendChild(overlay);
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  }

  // Contract and History, beside OVR (→ 2K Ratings) and Health (→ Injuries):
  // each is the one-line answer and a link to the sub-page with the rest
  // (players/subpage.js).

  // The deal as the shorthand (/contract.js), this season's figure under it.
  // Off contract, what he is and what he earned.
  function renderContractTile(container, bio, playerSlug) {
    const tile = document.createElement('a');
    tile.className = 'hero-tile';
    tile.href = PlayerSubpage.href('contract', playerSlug);
    tile.title = 'Contract and salary history';
    tile.innerHTML = '<div class="tile-label">Contract</div><div class="tile-value tile-value--text"></div><div class="tile-sub"></div>';
    const val = tile.querySelector('.tile-value'), sub = tile.querySelector('.tile-sub');
    const season = currentSeasonStr();
    const sals = bio.salaries && typeof bio.salaries === 'object' ? bio.salaries : {};
    const caps = parseCapHoldMap(bio.cap_holds);
    const now = parseContractMoney(sals[season]);
    if ((bio.type === 'player' || bio.type === 'two-way') && now && !isFaHold(caps[season])) {
      val.textContent = summarizeContract(bio, season);
      const b = document.createElement('b');
      b.textContent = compactContractMoney(now);
      sub.appendChild(b);
      sub.appendChild(document.createTextNode(` in ${season}${bio.type === 'two-way' ? ' · Two-way' : ''}`));
    } else if (bio.type === 'draft-rights') {
      val.textContent = 'Draft rights';
      sub.textContent = 'Unsigned';
    } else {
      val.textContent = bio.retired ? 'Retired' : 'Free agent';
      const earned = Object.keys(sals).filter(k => /^\d{2}-\d{2}$/.test(k) && !caps[k])
        .reduce((sum, k) => sum + parseContractMoney(sals[k]), 0);
      const parts = [];
      if (!bio.retired && isFaHold(caps[season])) parts.push(caps[season]);
      parts.push(earned ? `${compactContractMoney(earned)} career earnings` : 'No contract on record');
      sub.textContent = parts.join(' · ');
    }
    container.appendChild(tile);
  }

  // How many moves the ledger has for him, and the latest.
  function renderHistoryTile(container, playerSlug) {
    const tile = document.createElement('a');
    tile.className = 'hero-tile';
    tile.href = PlayerSubpage.href('history', playerSlug);
    tile.title = 'Transactions and season-by-season history';
    tile.innerHTML = '<div class="tile-label">History</div><div class="tile-value">&nbsp;</div><div class="tile-sub">&nbsp;</div>';
    container.appendChild(tile);
    const val = tile.querySelector('.tile-value'), sub = tile.querySelector('.tile-sub');
    const TYPE_LABEL = { sign: 'Signed', pick: 'Drafted', sign_pick: 'Signed', option: 'Option', release: 'Released',
      trade: 'Traded', convert_twoway: 'Two-way conversion', offer_sheet: 'Offer sheet', offer_sheet_decision: 'Offer sheet',
      extension: 'Extended', renounce: 'Renounced', stash: 'Stashed', qualifying_offer: 'Qualifying offer' };
    fetch(`/api/transactions?player=${encodeURIComponent(playerSlug)}&limit=500`)
      .then(r => (r.ok ? r.json() : null)).catch(() => null)

        val.innerHTML = `${txns.length}<small>move${txns.length === 1 ? '' : 's'}</small>`;
        if (!txns.length) { sub.textContent = 'Season by season'; return; }
        const last = txns.reduce((a, b) => (b.date > a.date ? b : a));
        const when = last.date ? new Date(last.date + 'T12:00:00').toLocaleString('en-US', { month: 'short', year: 'numeric' }) : '';
        sub.textContent = `Latest: ${TYPE_LABEL[last.type] || last.type}${when ? ` · ${when}` : ''}`;

  // Health, the third hero tile: injured now, or healthy with the career
  // line. Always shown, and always a link to /players/injuries, which has the
  // full history. Appended at once so it keeps its place beside OVR and HOF;
  // its text arrives with GET /api/injuries/history, and games missed after
  // that, from the game log (InjuryHistory in /injury-history.js).
  function renderHealthTile(container, playerSlug) {
    const tile = document.createElement('a');
    tile.className = 'hero-tile health-tile';
    tile.href = `/players/injuries/?p=${encodeURIComponent(playerSlug)}`;
    tile.title = 'Injury history';
    tile.innerHTML = '<div class="tile-label">Health</div><div class="tile-value">&nbsp;</div><div class="tile-sub">&nbsp;</div>';
    container.appendChild(tile);
    const IH = window.InjuryHistory;
    if (!IH) return;
    const val = tile.querySelector('.tile-value'), sub = tile.querySelector('.tile-sub');
    const today = new Date().toLocaleDateString('en-CA');
    const month = iso => new Date(iso + 'T12:00:00').toLocaleString('en-US', { month: 'short', year: 'numeric' });
    const json = url => fetch(url).then(r => (r.ok ? r.json() : null)).catch(() => null);

    // "5 injuries · 8 games missed", the career line. Shown while hurt too,
    // on its own line under the current injury, so the history doesn't
    // vanish from the profile whenever he's on the report.
    const career = (el, stints, sum) => {
      const b = document.createElement('b');
      b.textContent = `${stints.length} injur${stints.length === 1 ? 'y' : 'ies'}`;
      el.appendChild(b);
      if (sum.missed != null) el.appendChild(document.createTextNode(` · ${sum.missed} game${sum.missed === 1 ? '' : 's'} missed`));
    };

    const draw = (stints, sum) => {
      tile.classList.remove('hurt', 'out');
      sub.textContent = '';
      tile.querySelector('.tile-sub.career')?.remove();
      const c = sum.current;
      if (c) {
        tile.classList.add(IH.isOut(c.status) ? 'out' : 'hurt');
        val.textContent = IH.isOut(c.status) ? 'Out' : 'Hurt';
        const parts = [c.injury, c.duration].filter(Boolean);
        sub.textContent = parts.join(' · ');
        if (c.ovr_delta) {
          const d = document.createElement('span');
          d.className = 'neg';
          d.textContent = `${c.ovr_delta > 0 ? '+' : '−'}${Math.abs(c.ovr_delta)} OVR`;
          if (parts.length) sub.appendChild(document.createTextNode(' · '));
          sub.appendChild(d);
        }
        if (stints.length > 1) {
          const line = document.createElement('div');
          line.className = 'tile-sub career';
          career(line, stints, sum);
          tile.appendChild(line);
        }
        return;
      }
      val.textContent = 'Healthy';
      if (!stints.length) { sub.textContent = 'No injuries on record'; return; }
      career(sub, stints, sum);
      const last = sum.last.start || sum.last.end;
      if (last) sub.appendChild(document.createTextNode(` · last ${month(last)}`));
    };

    json(`/api/injuries/history?slug=${encodeURIComponent(playerSlug)}`).then(events => {
      if (!Array.isArray(events)) { val.textContent = '—'; sub.textContent = 'Injury history'; return; }
      const stints = IH.fold(events);
      draw(stints, IH.summary(stints, today));
      if (!stints.length) return;
      const teams = [...new Set(stints.flatMap(s => s.teams.map(t => t.team)).filter(Boolean))];
      Promise.all([
        json(`/api/players/${encodeURIComponent(playerSlug)}/gamelog`),
        ...teams.map(t => json(`/api/boxscores/games?team=${encodeURIComponent(t)}`)),
      ]).then(([log, ...games]) => {
        if (!Array.isArray(log) || games.some(g => !Array.isArray(g))) return;
        const byTeam = Object.fromEntries(teams.map((t, i) => [t, games[i]]));
        const played = new Set(log.map(g => g.date));
        stints.forEach(s => Object.assign(s, IH.gamesMissed(s, byTeam, played, today)));
        draw(stints, IH.summary(stints, today));
      });
    });
  }

  function renderBioLine(container, row) {
    const parts = [];

    // DOB + age
    const dob = bioVal(row.DOB);
    if (dob) {
      const d = new Date(dob + 'T00:00:00');
      if (!isNaN(d)) {
        const now = new Date();
        let age = now.getFullYear() - d.getFullYear();
        const m = now.getMonth() - d.getMonth();
        if (m < 0 || (m === 0 && now.getDate() < d.getDate())) age--;
        const mon = d.toLocaleString('en-US', { month: 'short' });
        const day = d.getDate();
        const yr  = d.getFullYear();
        parts.push(`${mon} ${day}, ${yr} (age ${age})`);
      }
    }

    // College
    const college = bioVal(row.COLLEGE);
    if (college) parts.push(college);

    // Country
    const country = bioVal(row.COUNTRY);
    if (country) {
      const flag = countryFlag(country);
      parts.push(flag || country);
    }

    // NBN Draft
    const dftYr = bioVal(row.NBN_DFT_YR);
    if (dftYr) {
      const dftR = bioVal(row.NBN_DFT_R);
      const dftP = bioVal(row.NBN_DFT_P);
      let draftStr = dftYr + ' Draft';
      if (dftR || dftP) {
        const rndPart  = dftR ? 'Round ' + dftR : '';
        const pickPart = dftP ? 'Pick ' + dftP  : '';
        draftStr += ' · ' + [rndPart, pickPart].filter(Boolean).join(', ');
      }
      parts.push(draftStr);
    }

    // Measurements
    const measParts = [];
    const height  = bioVal(row.HEIGHT);
    const weight  = bioVal(row.WEIGHT);
    const wingspan = bioVal(row.WINGSPAN);
    if (height)   measParts.push(height);
    if (weight)   measParts.push(weight + ' lbs');
    if (wingspan) measParts.push(wingspan + ' ws');
    if (measParts.length) parts.push(measParts.join(' · '));

    if (!parts.length) return;

    const p = document.createElement('p');
    p.className = 'bio-line';
    parts.forEach((item, i) => {
      if (i > 0) {
        const sep = document.createElement('span');
        sep.className = 'bio-sep';
        sep.textContent = '·';
        p.appendChild(sep);
      }
      if (item instanceof Node) {
        p.appendChild(item);
      } else {
        const span = document.createElement('span');
        span.textContent = item;
        p.appendChild(span);
      }
    });
    container.appendChild(p);
  }

  function renderAccolades(container, playerSlug, rings, playerAwards, seasonLeaders) {
    const awardsForPlayer = playerAwards[playerSlug] || [];
    const awardCountByType = {};
    awardsForPlayer.forEach(a => {
      awardCountByType[a.AWARD] = (awardCountByType[a.AWARD] || 0) + 1;
    });

    const badges = [];

    // Award badges
    BADGE_DEFS.forEach(def => {
      let count = 0;
      if (def.rings) {
        count = +rings || 0;
      } else {
        count = awardCountByType[def.award] || 0;
      }
      if (count > 0) {
        const plural = def.rings && count > 1 ? 'Rings' : def.label;
        badges.push({ count, label: plural, gold: def.rings || def.label === 'MVP' });
      }
    });

    // League-leader badges
    LEADER_BADGE_DEFS.forEach(def => {
      let count = 0;
      Object.entries(seasonLeaders).forEach(([, statMap]) => {
        if (statMap[def.stat] && statMap[def.stat].slug === playerSlug) count++;
      });
      if (count > 0) {
        badges.push({ count, label: def.label });
      }
    });

    if (!badges.length) return;

    const div = document.createElement('div');
    div.className = 'accolades';
    badges.forEach(b => {
      const span = document.createElement('span');
      span.className = 'badge' + (b.gold ? ' badge-gold' : '');
      if (b.count > 1) {
        const n = document.createElement('b');
        n.textContent = `${b.count}×`;
        span.appendChild(n);
      }
      span.appendChild(document.createTextNode(b.label));
      div.appendChild(span);
    });
    container.appendChild(div);
  }

  // ── Row icon helper ──────────────────────────────────────────────────────────

  // Icon names in css/ui-icons.css, and the award each one stands for.
  const AWARD_ICONS = { 'Champion': 'ring', 'Most Valuable Player': 'crown', 'All-Star': 'star' };
  const ICON_ORDER  = ['ring', 'crown', 'star'];
  const ICON_TITLE  = { ring: 'Champion', crown: 'MVP', star: 'All-Star' };

  function makeIconFn(regRows, poRows, playerAwards, slug, bySeasonMode) {
    const awards = playerAwards[slug] || [];

    // last team per season (rows already sorted by SEASON desc, LAST_DATE desc —
    // so first entry per season is the chronologically latest team)
    const regLastTeam = new Map();
    regRows.forEach(r => { if (!regLastTeam.has(r.SEASON)) regLastTeam.set(r.SEASON, r.TEAM); });
    const poLastTeam = new Map();
    if (poRows) poRows.forEach(r => { if (!poLastTeam.has(r.SEASON)) poLastTeam.set(r.SEASON, r.TEAM); });

    // teamIcons[season|team] and seasonIcons[season] — both keyed by SEASON string
    const teamIcons = new Map();
    const seasonIcons = new Map();

    awards.forEach(a => {
      const icon = AWARD_ICONS[a.AWARD];
      if (!icon) return;
      const isPlayoff = a.SEASON.includes('Playoffs');
      const lastTeam = isPlayoff ? poLastTeam.get(a.SEASON) : regLastTeam.get(a.SEASON);
      if (!lastTeam) return;

      const teamKey = a.SEASON + '|' + lastTeam;
      if (!teamIcons.has(teamKey)) teamIcons.set(teamKey, new Set());
      teamIcons.get(teamKey).add(icon);

      if (!seasonIcons.has(a.SEASON)) seasonIcons.set(a.SEASON, new Set());
      seasonIcons.get(a.SEASON).add(icon);
    });

    const sorted = icons => ICON_ORDER.filter(i => icons.has(i));

    return row => {
      if (bySeasonMode) return sorted(seasonIcons.get(row.SEASON) ?? new Set());
      return sorted(teamIcons.get(row.SEASON + '|' + row.TEAM) ?? new Set());
    };
  }

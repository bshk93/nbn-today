  // ── OVR tile ────────────────────────────────────────────────

  // An OVR on the heat scale (components.css .ui-heat): 60 and below is the
  // bottom, 100 the top.
  function ovrHeat(n) {
    return Math.min(1, Math.max(0, (n - 60) / 40)).toFixed(3);
  }

  // Archetype radar. Drawing, ranking and nearest-match live in /radar.js,
  // shared with team pages; the axes and archetypes here are the player's own.
  function buildPlayerRadarChart(playerRows, allRows) {
    if (!window.Radar) return null;
    function rowP36(r, f) { return +r[f] * 36 / Math.max(1, +r.MIN); }
    function rowTS(r) {
      const denom = 2 * (+r.FGA + 0.44 * +r.FTA);
      return denom > 0 ? +r.PTS / denom : 0;
    }
    function ratio(r, num, den) { return +r[den] > 0 ? +r[num] / +r[den] : 0; }
    // Per-36 blows up tiny samples, so both the player and the peers they are
    // ranked against need 20 games at 10+ minutes a game.
    function qualifies(r) { return +r.G >= 20 && +r.MIN / Math.max(1, +r.G) >= 10; }

    // Style axes, per 36 minutes: how a player plays, not how much. Usage says
    // how much of the offense they run, 3P and FT rate where their shots come
    // from. Points, FTA and 3PM per 36 were one scoring signal counted three
    // times (r = 0.78 and 0.59 against points).
    const DIM_DEFS = [
      { label: 'USG',     angle: 90,  get: r => (+r.FGA + 0.44 * +r.FTA + +r.TOV) * 36 / Math.max(1, +r.MIN),
        fmt: v => `${v.toFixed(1)} plays used/36` },
      { label: '3P RATE', angle: 45,  get: r => ratio(r, '3PA', 'FGA'), fmt: v => `${Math.round(v*100)}% of shots from three` },
      { label: 'TS%',     angle: 0,   get: r => rowTS(r),               fmt: v => `${(v*100).toFixed(1)}% TS` },
      { label: 'FT RATE', angle: 315, get: r => ratio(r, 'FTA', 'FGA'), fmt: v => `${Math.round(v*100)} FTA per 100 shots` },
      { label: 'BLK',     angle: 270, get: r => rowP36(r,'BLK'), fmt: v => `${v.toFixed(2)} BLK/36` },
      { label: 'REB',     angle: 225, get: r => rowP36(r,'REB'), fmt: v => `${v.toFixed(1)} REB/36` },
      { label: 'STL',     angle: 180, get: r => rowP36(r,'STL'), fmt: v => `${v.toFixed(2)} STL/36` },
      { label: 'AST',     angle: 135, get: r => rowP36(r,'AST'), fmt: v => `${v.toFixed(1)} AST/36` },
    ];

    // Target percentile per axis, in DIM_DEFS order. Seeded from a clustering
    // of every qualifying season 20-21 to 25-26.
    const ARCHETYPES = {
      //                   USG 3PR  TS  FTR BLK REB STL AST
      'Floor General':    [ 79, 59, 78, 43, 26, 28, 51, 75],
      'Swiss Army Knife': [ 80, 30, 75, 59, 65, 71, 64, 75],
      'Pickpocket':       [ 64, 54, 23, 35, 30, 24, 71, 78],
      'Shooter':          [ 56, 74, 46, 28, 17, 24, 22, 43],
      '3-and-D':          [ 29, 72, 36, 37, 56, 39, 79, 46],
      'Glue Guy':         [ 28, 68, 57, 78, 34, 42, 37, 42],
      'Lob Threat':       [ 24, 10, 66, 73, 84, 86, 32, 20],
      'Stretch Big':      [ 49, 51, 37, 33, 71, 69, 27, 28],
      'Enforcer':         [ 41, 31, 26, 59, 73, 74, 76, 38],
    };

    // Tier is how good, archetype is how they play. Per game on purpose:
    // earning minutes is part of being good.
    function tierFor(p) {
      if (p >= 0.97) return 'Superstar';
      if (p >= 0.89) return 'Star';
      if (p >= 0.58) return 'Starter';
      if (p >= 0.30) return 'Rotation';
      return 'Deep Bench';
    }
    const gsPerGame = r => +r.GMSC / Math.max(1, +r.G);

    function buildSvg(season) {
      const [agg] = aggregateBySeasonRows(playerRows.filter(r => r.SEASON === season));
      if (!agg || !qualifies(agg)) return null;

      const seasonMap = new Map();
      allRows.filter(r => r.SEASON === season).forEach(r => {
        if (!seasonMap.has(r.SLUG)) seasonMap.set(r.SLUG, { ...r });
        else { const s = seasonMap.get(r.SLUG); SUM_FIELDS.forEach(f => { s[f] = String(+s[f] + +r[f]); }); }
      });
      const peers = [...seasonMap.values()].filter(qualifies);

      const dims = DIM_DEFS.map(d => {
        const v = d.get(agg);
        return { label: d.label, angle: d.angle, tip: d.fmt(v), pct: Radar.percentile(v, peers.map(d.get)) };
      });
      const { name, runnerUp } = Radar.nearest(dims.map(d => d.pct), ARCHETYPES);
      const prodPct = Radar.percentile(gsPerGame(agg), peers.map(gsPerGame));
      const tier = tierFor(prodPct);
      const svg = Radar.draw({ dims, title: name, tier, runnerUp, footer: `${season} season · per 36 min` });

      // The three closest seasons by three other players, any year: the same eight
      // style percentiles plus how productive they were (Game Score per game,
      // the tier's measure), so a bench shooter isn't matched to a star one.
      const me = [...dims.map(d => d.pct), prodPct];
      const near = seasonVectors()
        .filter(v => v.slug !== slug)
        .map(v => ({ ...v, dist: Math.hypot(...v.vec.map((x, i) => x - me[i])) }))
        .sort((a, b) => a.dist - b.dist)
        // One season per player: three Giannis seasons say less than three players.
        .filter((v, i, all) => all.findIndex(o => o.slug === v.slug) === i)
        .slice(0, 3);
      if (!near.length) return svg;
      const box = document.createElement('div');
      box.appendChild(svg);
      const list = document.createElement('div');
      list.className = 'similar';
      const label = document.createElement('div');
      label.className = 'similar-label';
      label.textContent = 'Most similar seasons';
      list.appendChild(label);
      near.forEach(v => {
        const a = document.createElement('a');
        a.href = `/players/?p=${encodeURIComponent(v.slug)}`;
        a.className = 'similar-row';
        const nm = document.createElement('span');
        nm.textContent = typeof nbnPlayerName === 'function' ? nbnPlayerName(v.name) : v.name;
        const yr = document.createElement('span');
        yr.className = 'similar-season';
        yr.textContent = `${v.season}${v.team ? ' · ' + v.team : ''}`;
        a.append(nm, yr);
        list.appendChild(a);
      });
      box.appendChild(list);
      return box;
    }

    // Every qualifying player-season's percentile vector, ranked within its
    // own season. Built once on first use and kept: ~2,500 seasons.
    let vectorCache = null;
    function seasonVectors() {
      if (vectorCache) return vectorCache;
      vectorCache = [];
      const bySeason = new Map();
      allRows.forEach(r => {
        if (!bySeason.has(r.SEASON)) bySeason.set(r.SEASON, new Map());
        const m = bySeason.get(r.SEASON);
        if (!m.has(r.SLUG)) m.set(r.SLUG, { ...r, _teams: [r.TEAM] });
        else {
          const x = m.get(r.SLUG);
          SUM_FIELDS.forEach(f => { x[f] = String(+x[f] + +r[f]); });
          x._teams.push(r.TEAM);
        }
      });
      bySeason.forEach((m, season) => {
        const peers = [...m.values()].filter(qualifies);
        const cols = DIM_DEFS.map(d => peers.map(d.get).sort((a, b) => a - b));
        const gs = peers.map(gsPerGame).sort((a, b) => a - b);
        // Share of the season strictly below, by binary search on the sorted column.
        const pct = (sorted, v) => {
          let lo = 0, hi = sorted.length;
          while (lo < hi) { const mid = (lo + hi) >> 1; if (sorted[mid] < v) lo = mid + 1; else hi = mid; }
          return sorted.length ? lo / sorted.length : 0;
        };
        peers.forEach(p => vectorCache.push({
          slug: p.SLUG, name: p.PLAYER, season,
          team: [...new Set(p._teams)].filter(Boolean).join('/'),
          vec: [...DIM_DEFS.map((d, i) => pct(cols[i], d.get(p))), pct(gs, gsPerGame(p))],
        }));
      });
      return vectorCache;
    }

    // Only include qualifying seasons, newest first
    const eligibleSeasons = [...new Set(playerRows.map(r => r.SEASON))]
      .sort().reverse()
      .filter(s => {
        const [a] = aggregateBySeasonRows(playerRows.filter(r => r.SEASON === s));
        return a && qualifies(a);
      });
    return Radar.withSeasons(eligibleSeasons, buildSvg, { card: true, label: 'Archetype' });
  }

  // OVR as a headline tile: the rating, its change since the last update, and
  // a sparkline of the whole history. Colour goes on the figure only.
  function renderOvrTile(container, playerSlug) {
    const ovr = currentOvr[playerSlug];
    if (ovr == null) return;
    const hist = (allOvrHistory[playerSlug] || []).filter(e => e && e.ovr != null);
    const tile = document.createElement('a');
    tile.className = 'hero-tile';
    tile.href = PlayerSubpage.href('ratings', playerSlug);
    tile.title = '2K ratings, badges and their history';
    tile.innerHTML = '<div class="tile-label">Overall</div><div class="tile-main"><div class="tile-value"></div></div><div class="tile-sub"></div>';
    const val = tile.querySelector('.tile-value');
    val.textContent = ovr;
    val.classList.add('ui-heat-ink');
    val.style.setProperty('--heat', ovrHeat(ovr));

    const sub = tile.querySelector('.tile-sub');
    if (hist.length >= 2) {
      const d = hist.at(-1).ovr - hist.at(-2).ovr;
      const since = hist.at(-2).date ? new Date(hist.at(-2).date + 'T00:00:00').toLocaleString('en-US', { month: 'short', year: 'numeric' }) : '';
      const delta = document.createElement('b');
      delta.className = d > 0 ? 'tile-up' : d < 0 ? 'tile-down' : '';
      delta.textContent = d > 0 ? `▲ ${d}` : d < 0 ? `▼ ${-d}` : 'No change';
      sub.appendChild(delta);
      if (since) sub.appendChild(document.createTextNode(` since ${since}`));
      tile.querySelector('.tile-main').appendChild(ovrSparkline(hist));
    } else {
      sub.textContent = hist.length ? `As of ${hist[0].date.slice(0, 7)}` : '';
    }
    container.appendChild(tile);
  }

  function ovrSparkline(entries) {
    const W = 72, H = 26, P = 3;
    const vals = entries.map(e => e.ovr);
    const lo = Math.min(...vals), hi = Math.max(...vals), span = Math.max(1, hi - lo);
    const pts = vals.map((v, i) => [P + i * (W - 2 * P) / (vals.length - 1), P + (1 - (v - lo) / span) * (H - 2 * P)]);
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.setAttribute('width', W); svg.setAttribute('height', H);
    svg.classList.add('tile-spark');
    const line = document.createElementNS(ns, 'polyline');
    line.setAttribute('points', pts.map(p => p.join(',')).join(' '));
    line.setAttribute('fill', 'none');
    line.setAttribute('stroke', 'var(--text-muted)');
    line.setAttribute('stroke-width', '1.5');
    line.setAttribute('stroke-linejoin', 'round');
    svg.appendChild(line);
    const [lx, ly] = pts.at(-1);
    const dot = document.createElementNS(ns, 'circle');
    dot.setAttribute('cx', lx); dot.setAttribute('cy', ly); dot.setAttribute('r', '2.5');
    dot.classList.add('ui-heat-fill');
    dot.style.setProperty('--heat', ovrHeat(vals.at(-1)));
    svg.appendChild(dot);
    const t = document.createElementNS(ns, 'title');
    t.textContent = `OVR ${vals[0]} → ${vals.at(-1)} over ${entries.length} updates`;
    svg.appendChild(t);
    return svg;
  }

  // The subtitle under the name: eligible positions · current team · a count.
  function renderIdentity(bio, playerSlug, tail) {
    const sub = document.getElementById('page-sub');
    sub.textContent = '';
    sub.classList.add('identity');
    const parts = [];
    const pos = ['PG', 'SG', 'SF', 'PF', 'C'].filter(p => (bio.pos || []).includes(p));
    if (pos.length) {
      const e = document.createElement('span'); e.className = 'pos'; e.textContent = pos.join(' / ');
      parts.push(e);
    }
    const team = teamMap[playerSlug];
    // The header takes his team's band (components.css § Player pages).
    const header = sub.closest('.ui-header');
    if (header) team && !bio.retired ? (header.dataset.team = team) : delete header.dataset.team;
    if (team) {
      const a = document.createElement('a');
      a.className = 'team';
      a.href = `/teams/${team}/`;
      const img = document.createElement('img');
      img.src = `/logos/sm/logo-${team.toLowerCase()}.webp`;
      img.alt = '';
      img.onerror = function() { this.remove(); };
      a.appendChild(img);
      // Full name where there's room; the abbreviation on a phone, so the
      // line fits on one row there (CSS below).
      const full = document.createElement('span'); full.className = 'team-full'; full.textContent = TEAM_NAMES[team] || team;
      const short = document.createElement('span'); short.className = 'team-abbr'; short.textContent = team;
      a.append(full, short);
      parts.push(a);
    }
    if (bio.retired) {
      const e = document.createElement('span'); e.className = 'retired'; e.textContent = 'Retired';
      parts.push(e);

    if (tail) parts.push(document.createTextNode(tail));
    parts.forEach((p, i) => {
      if (i) { const d = document.createElement('span'); d.className = 'bio-sep'; d.textContent = '·'; sub.appendChild(d); }
      sub.appendChild(p);
    });
  }

  // ── Render: bio-only player (no stats yet) ───────────────────────────────────

  function renderBioOnlyPlayer(bioSlug, bio) {
    const name = bio.name ? displayName(bio.name) : bioSlug;
    document.title = `${name} - NBN`;
    setCrumbs(name);
    // Rewriting .nav's innerHTML above wipes out the search/inbox/theme/profile
    // icons nav.js already built into it — rebuild them (see the comment on
    // _initNav in nav.js).
    if (typeof _initNav === 'function') _initNav();
    document.getElementById('page-title').textContent = name;
    renderIdentity(bio, bioSlug, 'No NBN stats yet');
    const editBioBtn = document.createElement('button');
    editBioBtn.textContent = 'Edit Bio';
    renderHeaderChrome(bio.photo_url, bioSlug, editBioBtn);
    renderPlayerNav(bioSlug);

    const content = document.getElementById('content');
    content.innerHTML = '';
    renderBioLine(content, {
      DOB:        bio.dob        || '',
      COLLEGE:    bio.college    || '',
      COUNTRY:    bio.country    || '',
      NBN_DFT_YR: bio.draft_year  ? String(bio.draft_year)  : '',
      NBN_DFT_R:  bio.draft_round ? String(bio.draft_round) : '',
      NBN_DFT_P:  bio.draft_pick  ? String(bio.draft_pick)  : '',
      HEIGHT:     bio.height    || '',
      WEIGHT:     bio.weight    != null ? String(bio.weight) : '',
      WINGSPAN:   bio.wingspan  || '',
    });

    const tiles = document.createElement('div');
    tiles.className = 'hero-tiles';
    renderOvrTile(tiles, bioSlug);
    renderContractTile(tiles, bio, bioSlug);
    renderHistoryTile(tiles, bioSlug);
    renderHealthTile(tiles, bioSlug);
    content.appendChild(tiles);

    let bioFormEl = null;
    editBioBtn.addEventListener('click', async () => {
      if (bioFormEl) { bioFormEl.remove(); bioFormEl = null; editBioBtn.textContent = 'Edit Bio'; return; }
      const token = await getToken(); if (!token) return;
      bioFormEl = renderBioForm(
        { ...bio },
        async (token, payload) => {
          const resp = await fetch(`/api/players/${bioSlug}`, {
            method: 'PUT',
            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          if (resp.status === 401) { clearToken(); throw new Error('Token rejected.'); }
          if (!resp.ok) { const d = await resp.json().catch(() => ({})); throw new Error(d.detail || 'Save failed.'); }
          location.reload();
        },
        () => { bioFormEl.remove(); bioFormEl = null; editBioBtn.textContent = 'Edit Bio'; }
      );
      content.insertBefore(bioFormEl, content.firstChild);
      editBioBtn.textContent = 'Close';
    });
  }

  // ── Render: index (player directory) ─────────────────────────────────────────

  function renderIndex(rows) {
    document.title = 'Players - NBN';
    document.getElementById('nav').innerHTML = '<a href="/">← Home</a>';
    if (typeof _initNav === 'function') _initNav();

    // Collect teams per player in chronological order
    const playerFirstRow = new Map();
    const playerTeamsList = new Map(); // slug -> ordered unique teams
    const playerGamesMap = new Map();  // slug -> total G
    const chronoRows = [...rows].sort((a, b) => {
      const sa = parseFloat(a.SEASON) || 0, sb = parseFloat(b.SEASON) || 0;
      if (sa !== sb) return sa - sb;
      return (a.LAST_DATE || '') < (b.LAST_DATE || '') ? -1 : 1;
    });
    chronoRows.forEach(r => {
      if (!r.SLUG) return;
      if (!playerFirstRow.has(r.SLUG)) playerFirstRow.set(r.SLUG, r);
      if (!playerTeamsList.has(r.SLUG)) playerTeamsList.set(r.SLUG, []);
      const tl = playerTeamsList.get(r.SLUG);
      if (r.TEAM && r.TEAM !== 'NA' && !tl.includes(r.TEAM)) tl.push(r.TEAM);
      playerGamesMap.set(r.SLUG, (playerGamesMap.get(r.SLUG) || 0) + (+r.G || 0));
    });

    function fmtDOB(dob) {
      const v = bioVal(dob);
      if (!v) return null;
      const d = new Date(v + 'T00:00:00');
      return isNaN(d) ? null : d.toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function fmtDraft(yr, rnd, pick) {
      const y = bioVal(yr);
      if (!y) return null;
      let s = y;
      const rn = bioVal(rnd); if (rn) { const m = rn.match(/\d+/); if (m) s += ' · R' + m[0]; }
      const pn = bioVal(pick); if (pn) { const m = pn.match(/\d+/); if (m) s += ' · P' + m[0]; }
      return s;
    }

    // Add bio-only players not yet in the CSV
    Object.entries(biosData).forEach(([bioSlug, bio]) => {
      if (!playerFirstRow.has(bioSlug)) {
        playerFirstRow.set(bioSlug, {
          SLUG: bioSlug, PLAYER: displayName(bio.name || bioSlug),
          PHOTO_URL: bio.photo_url || '', RINGS: '0',
          DOB: bio.dob || '', COUNTRY: bio.country || '', COLLEGE: bio.college || '',
          NBN_DFT_YR: bio.draft_year  ? String(bio.draft_year)  : '',
          NBN_DFT_R:  bio.draft_round ? String(bio.draft_round) : '',
          NBN_DFT_P:  bio.draft_pick  ? String(bio.draft_pick)  : '',
        });
      }
    });

    // Build one display-object per player
    const players = [...playerFirstRow.values()].map(r => {
      const bio = biosData[r.SLUG] || {};
      const dobRaw = bio.dob || bioVal(r.DOB);
      const d = dobRaw ? new Date(dobRaw + 'T00:00:00') : null;
      const dobOk = d && !isNaN(d);
      let age = null;
      if (dobOk) {
        const now = new Date();
        age = now.getFullYear() - d.getFullYear();
        const mo = now.getMonth() - d.getMonth();
        if (mo < 0 || (mo === 0 && now.getDate() < d.getDate())) age--;
      }
      const dftYr = bio.draft_year  ? String(bio.draft_year)  : r.NBN_DFT_YR;
      const dftR  = bio.draft_round ? String(bio.draft_round) : r.NBN_DFT_R;
      const dftP  = bio.draft_pick  ? String(bio.draft_pick)  : r.NBN_DFT_P;
      const canonical = bio.name || r.PLAYER || '';
      const lastName = canonical.indexOf(',') > 0
        ? canonical.slice(0, canonical.indexOf(',')).trim()
        : (canonical.trim().split(/\s+/).pop() || '');
      return {
        SLUG:       r.SLUG,
        PLAYER:     bio.name ? displayName(bio.name) : r.PLAYER,
        LAST:       lastName,
        POS:        Array.isArray(bio.pos) ? bio.pos : [],
        PHOTO_URL:  bio.photo_url || r.PHOTO_URL,
        RINGS:      r.RINGS,
        AGE:        age,
        DOB_FMT:    fmtDOB(dobRaw),
        DOB_SORT:   dobOk ? d.getTime() : null,
        COUNTRY:    bio.country || bioVal(r.COUNTRY),
        COLLEGE:    bio.college || bioVal(r.COLLEGE),
        DRAFT_FMT:  fmtDraft(dftYr, dftR, dftP),
        DRAFT_SORT: dftYr ? parseInt(dftYr, 10) : null,
        TEAMS:      playerTeamsList.get(r.SLUG) || [],
        // Whose roster he's on today (the live rosters, via /api/team-map),
        // not a stats team: a signing who hasn't played yet still shows.
        TEAM:       teamMap[r.SLUG] || null,
        HEIGHT:     bio.height  || '',
        WEIGHT:     bio.weight  != null ? bio.weight : null,
        WINGSPAN:   bio.wingspan || '',
        JERSEY:     bio.jersey_number ?? null,
        TYPE:       bio.type || '',
        G:          playerGamesMap.get(r.SLUG) ?? null,
        OVR:        currentOvr[r.SLUG] ?? null,
        RETIRED:    bio.retired || false,
      };
    });

    const allTeams = [...new Set(rows.map(r => r.TEAM).filter(Boolean))].sort();

    const PAGES = [
      { id: 'a-d', label: 'A – D', from: 'A', to: 'D' },
      { id: 'e-k', label: 'E – K', from: 'E', to: 'K' },
      { id: 'l-p', label: 'L – P', from: 'L', to: 'P' },
      { id: 'q-z', label: 'Q – Z', from: 'Q', to: 'Z' },
      { id: 'all', label: 'All', all: true },
    ];
    const tabParam = new URLSearchParams(location.search).get('tab');
    let activePage = PAGES.find(p => p.id === tabParam) || PAGES.find(p => p.id === 'all');

    const content = document.getElementById('content');
    content.innerHTML = '';

    // Tab bar
    const tabBar = document.createElement('div');
    tabBar.className = 'page-tabs';
    const tabBtns = PAGES.map(pg => {
      const btn = document.createElement('button');
      btn.className = 'page-tab' + (pg === activePage ? ' active' : '');
      btn.textContent = pg.label;
      btn.addEventListener('click', () => selectPage(pg, true));
      return btn;
    });
    // A tab switch is a history entry, so Back returns to the last tab.
    function selectPage(pg, push) {
      if (activePage === pg && activeFilters.size === 0) return;
      activePage = pg;
      activeFilters.clear();
      content.querySelectorAll('.missing-btn').forEach(b => b.classList.remove('active'));
      tabBtns.forEach((b, i) => b.classList.toggle('active', PAGES[i] === pg));
      if (push && location.search !== `?tab=${pg.id}`) history.pushState(null, '', `?tab=${pg.id}`);
      searchInput.value = '';
      filterQ = '';
      rebuildBody();
    }
    window.onpopstate = () => {
      const id = new URLSearchParams(location.search).get('tab');
      selectPage(PAGES.find(p => p.id === id) || PAGES.find(p => p.id === 'all'), false);
    };
    tabBtns.forEach(b => tabBar.appendChild(b));
    content.appendChild(tabBar);

    // Filter bar
    const filterBar = document.createElement('div');
    filterBar.className = 'filter-bar';

    const searchInput = document.createElement('input');
    searchInput.type = 'search';
    searchInput.placeholder = 'Search players…';
    searchInput.className = 'filter-search';
    searchInput.setAttribute('autocomplete', 'off');
    filterBar.appendChild(searchInput);

    const teamSelect = document.createElement('select');
    teamSelect.className = 'filter-team';
    [['', 'All teams'], ...allTeams.map(t => [t, t])].forEach(([v, l]) => {
      const opt = document.createElement('option');
      opt.value = v; opt.textContent = l;
      teamSelect.appendChild(opt);
    });
    filterBar.appendChild(teamSelect);

    const rosteredBtn = document.createElement('button');
    rosteredBtn.className = 'rostered-btn';
    rosteredBtn.textContent = 'Rostered';
    filterBar.appendChild(rosteredBtn);

    const resultCount = document.createElement('span');
    resultCount.className = 'filter-count';
    filterBar.appendChild(resultCount);

    if (canAddPlayer()) {
      const addBtn = document.createElement('button');
      addBtn.className = 'btn-add-player';
      addBtn.textContent = '+ Add Player';
      addBtn.addEventListener('click', showAddPlayerModal);
      filterBar.appendChild(addBtn);
    }

    content.appendChild(filterBar);

    const MISSING_FILTERS = [
      { id: 'pos',   label: 'Missing Pos',          test: p => !p.POS.length },
      { id: 'dob',   label: 'Missing DOB',          test: p => !p.DOB_SORT },
      { id: 'image', label: 'Missing Image',        test: p => !p.PHOTO_URL },
      { id: 'meas',  label: 'Missing Measurements', test: p => !p.HEIGHT || p.WEIGHT == null || !p.WINGSPAN },
      { id: 'ovr',   label: 'Missing OVR',          test: p => p.OVR == null },
    ];
    let activeFilters = new Set();

    if (canEditBios()) {
      const missingBar = document.createElement('div');
      missingBar.className = 'missing-bar';
      const lbl = document.createElement('span');
      lbl.className = 'missing-bar-label';
      lbl.textContent = 'Missing:';
      missingBar.appendChild(lbl);
      MISSING_FILTERS.forEach(f => {
        const btn = document.createElement('button');
        btn.className = 'missing-btn';
        btn.textContent = f.label.replace('Missing ', '');
        btn.addEventListener('click', () => {
          if (activeFilters.has(f.id)) {
            activeFilters.delete(f.id);
            btn.classList.remove('active');
          } else {
            activeFilters.add(f.id);
            btn.classList.add('active');
          }
          searchInput.value = '';
          filterQ = '';
          rebuildBody();
        });
        missingBar.appendChild(btn);
      });
      content.appendChild(missingBar);
    }

    // Table
    const IDX_COLS = [
      { label: '#',       field: 'JERSEY',     defaultDir:  1, cls: 'right muted', display: p => p.JERSEY != null ? `#${p.JERSEY}` : '—' },
      { label: 'Player',  field: 'LAST',       defaultDir:  1 },
      { label: 'Team',    field: 'TEAM',        defaultDir:  1, display: p => {
          if (!p.TEAM) return '—';
          const span = document.createElement('span');
          span.className = 'idx-team';
          span.title = TEAM_NAMES[p.TEAM] || p.TEAM;
          const img = document.createElement('img');
          img.src = `/logos/sm/logo-${p.TEAM.toLowerCase()}.webp`;
          img.alt = '';
          img.onerror = function() { this.remove(); };
          span.append(img, document.createTextNode(p.TEAM));
          return span;
        }
      },
      { label: 'Pos',    field: null,          display: p => p.POS.length ? p.POS.join(' · ') : '—', cls: 'muted' },
      { label: 'OVR',     field: 'OVR',         defaultDir: -1, cls: 'right', display: p => p.OVR ?? '—' },
      { label: 'G',       field: 'G',           defaultDir: -1, cls: 'right', display: p => p.G ?? '—' },
      { label: 'Age',     field: 'AGE',         defaultDir: -1, cls: 'right' },
      { label: 'Born',    field: 'DOB_SORT',    defaultDir: -1, cls: 'right', display: p => p.DOB_FMT || '—' },
      { label: 'Country', field: 'COUNTRY',     defaultDir:  1, display: p => {
          if (!p.COUNTRY) return '—';
          const flag = countryFlag(p.COUNTRY);
          return flag || p.COUNTRY;
        }
      },
      { label: 'College', field: 'COLLEGE',     defaultDir:  1, display: p => p.COLLEGE || '—' },
      { label: 'Draft',   field: 'DRAFT_SORT',  defaultDir:  1, display: p => p.DRAFT_FMT || '—' },
      { label: 'Teams',   field: null, display: p => {
          if (!p.TEAMS.length) return '—';
          const wrap = document.createElement('div');
          wrap.style.cssText = 'display:flex;gap:3px;align-items:center;min-width:115px';
          p.TEAMS.forEach(t => {
            const img = document.createElement('img');
            img.src = `/logos/sm/logo-${t.toLowerCase()}.webp`;
            img.alt = t; img.title = t;
            img.style.cssText = 'width:20px;height:20px;object-fit:contain';
            img.onerror = function() { this.replaceWith(document.createTextNode(t)); };
            wrap.appendChild(img);
          });
          return wrap;
        }
      },
      { label: 'Ht',  field: 'HEIGHT',   defaultDir: 1, cls: 'right muted', display: p => p.HEIGHT   || '—' },
      { label: 'Wt',  field: 'WEIGHT',   defaultDir:-1, cls: 'right muted', display: p => p.WEIGHT != null ? p.WEIGHT + ' lbs' : '—' },
      { label: 'WS',  field: 'WINGSPAN', defaultDir: 1, cls: 'right muted', display: p => p.WINGSPAN  || '—' },
      { label: 'Ret', field: 'RETIRED',  defaultDir:-1, cls: 'center muted', display: p => p.RETIRED ? 'Yes' : '—' },
    ];

    let sortField = 'LAST', sortDir = 1;

    function idxSortVal(p, field) {
      const v = p[field];
      if (v == null) return Infinity;
      if (typeof v === 'number') return v;
      const n = parseFloat(v);
      return isNaN(n) ? String(v).toLowerCase() : n;
    }

    const wrap = document.createElement('div');
    wrap.className = 'ui-table-wrap';
    content.appendChild(wrap);

    const table = document.createElement('table'); table.className = 'ui-table';
    const thead = table.createTHead();
    const headerRow = thead.insertRow();
    const thEls = [];

    IDX_COLS.forEach(col => {
      const th = document.createElement('th');
      if (col.cls) th.classList.add(...col.cls.split(' '));
      const arrow = document.createElement('span');
      arrow.className = 'sort-arrow';
      th.appendChild(document.createTextNode(col.label));
      th.appendChild(arrow);
      if (col.field) {
        th.addEventListener('click', () => {
          if (sortField === col.field) sortDir *= -1;
          else { sortField = col.field; sortDir = col.defaultDir ?? 1; }
          updateHeaders();
          rebuildBody();
        });
      } else {
        th.style.cursor = 'default';
      }
      thEls.push(th);
      headerRow.appendChild(th);
    });

    const tbody = table.createTBody();
    wrap.appendChild(table);

    const noResults = document.createElement('p');
    noResults.className = 'no-results';
    noResults.textContent = 'No players match your search.';
    noResults.style.display = 'none';
    content.appendChild(noResults);

    function updateHeaders() {
      thEls.forEach((th, i) => {
        const active = IDX_COLS[i].field === sortField;
        th.dataset.active = active;
        th.querySelector('.sort-arrow').textContent = active ? (sortDir === -1 ? '↓' : '↑') : '';
      });
    }

    function buildRow(p) {
      const tr = document.createElement('tr');
      tr.className = 'clickable-row';
      tr.dataset.name = p.PLAYER.toLowerCase();
      tr.dataset.teams = p.TEAMS.join('|');
      tr.dataset.type = p.TYPE;
      tr.addEventListener('click', () => { location.href = `/players/?p=${p.SLUG}`; });

      // Jersey cell (IDX_COLS[0])
      const tdJ = tr.insertCell();
      const jerseyCol = IDX_COLS[0];
      if (jerseyCol.cls) tdJ.className = jerseyCol.cls;
      tdJ.textContent = jerseyCol.display(p);

      // Player cell: photo + name (IDX_COLS[1])
      const tdP = tr.insertCell();
      const cell = document.createElement('div');
      cell.className = 'player-name-cell';
      if (p.PHOTO_URL) {
        const img = document.createElement('img');
        img.className = 'player-photo-sm';
        img.src = p.PHOTO_URL;
        img.alt = '';
        img.onerror = function() {
          const ph = document.createElement('div');
          ph.className = 'player-placeholder-sm';
          this.replaceWith(ph);
        };
        cell.appendChild(img);
      } else {
        const ph = document.createElement('div');
        ph.className = 'player-placeholder-sm';
        cell.appendChild(ph);
      }
      const nameSpan = document.createElement('span');
      nameSpan.textContent = p.PLAYER;
      if (+p.RINGS > 0) nameSpan.classList.add('champion-name');
      cell.appendChild(nameSpan);
      tdP.appendChild(cell);

      // Remaining cells
      IDX_COLS.slice(2).forEach(col => {
        const td = tr.insertCell();
        if (col.cls) td.className = col.cls;
        const val = col.display ? col.display(p) : (p[col.field] ?? '—');
        if (val instanceof Node) td.appendChild(val);
        else td.textContent = val == null ? '—' : val;
        if (col.field === 'OVR' && p.OVR != null) {
          td.classList.add('ui-heat');
          td.style.setProperty('--heat', ovrHeat(p.OVR));
          td.style.fontWeight = '700';
          td.style.textAlign = 'center';
          // Ratings breakdown on hover/tap. Only wired up when we actually hold
          // attributes for this player, so the cue never promises an empty popup.
          if (window.RatingsPopup && currentAttributes(p.SLUG)) {
            RatingsPopup.attach(td, p.SLUG, { name: p.PLAYER });
          }
        }
      });

      return tr;
    }

    let filterQ = '', filterTeam = '', filterRostered = true;
    rosteredBtn.classList.toggle('active', filterRostered);

    rosteredBtn.addEventListener('click', () => {
      filterRostered = !filterRostered;
      rosteredBtn.classList.toggle('active', filterRostered);
      rebuildBody();
    });

    function visible(p) {
      return (!filterQ || p.PLAYER.toLowerCase().includes(filterQ)) &&
             (!filterTeam || p.TEAMS.includes(filterTeam)) &&
             (!filterRostered || (!p.RETIRED && (p.TYPE === 'player' || p.TYPE === 'two-way')));
    }

    function rebuildBody() {
      const pagePlayers = activeFilters.size > 0
        ? players.filter(p => MISSING_FILTERS.some(f => activeFilters.has(f.id) && f.test(p)))
        : players.filter(p => {
            if (activePage.all) return true;
            const l = (p.LAST[0] || '').toUpperCase();
            return l >= activePage.from && l <= activePage.to;
          });
      const sorted = [...pagePlayers].sort((a, b) => {
        const va = idxSortVal(a, sortField), vb = idxSortVal(b, sortField);
        if (va === Infinity && vb === Infinity) return a.PLAYER.localeCompare(b.PLAYER);
        if (va === Infinity) return 1;
        if (vb === Infinity) return -1;
        if (va < vb) return sortDir === 1 ? -1 : 1;
        if (va > vb) return sortDir === 1 ? 1 : -1;
        return a.PLAYER.localeCompare(b.PLAYER);
      });
      tbody.innerHTML = '';
      let count = 0;
      sorted.forEach(p => {
        const show = visible(p);
        const tr = buildRow(p);
        if (!show) tr.style.display = 'none';
        else count++;
        tbody.appendChild(tr);
      });
      const total = pagePlayers.length;
      resultCount.textContent = count === total ? `${total} players` : `${count} of ${total}`;
      noResults.style.display = count === 0 ? '' : 'none';
    }

    function applyFilters() {
      filterQ = searchInput.value.trim().toLowerCase();
      filterTeam = teamSelect.value;
      let count = 0, total = 0;
      tbody.querySelectorAll('tr').forEach(tr => {
        total++;
        const nameOk = !filterQ || tr.dataset.name.includes(filterQ);
        const teamOk = !filterTeam || tr.dataset.teams.split('|').includes(filterTeam);
        const rosteredOk = !filterRostered || tr.dataset.type === 'player' || tr.dataset.type === 'two-way';
        const show = nameOk && teamOk && rosteredOk;
        tr.style.display = show ? '' : 'none';
        if (show) count++;
      });
      resultCount.textContent = count === total ? `${total} players` : `${count} of ${total}`;
      noResults.style.display = count === 0 ? '' : 'none';
    }

    searchInput.addEventListener('input', applyFilters);
    teamSelect.addEventListener('change', applyFilters);
    updateHeaders();
    rebuildBody();
  }

  // ── Render: player profile ────────────────────────────────────────────────────

  function renderPlayer(playerName, rows, playerAwards, seasonLeaders, allPoRows, hofRows) {
    rows = [...rows].sort((a, b) => {
      const sa = parseFloat(a.SEASON) || 0;
      const sb = parseFloat(b.SEASON) || 0;
      if (sa !== sb) return sb - sa;
      const ta = a.LAST_DATE ?? '';
      const tb = b.LAST_DATE ?? '';
      return ta < tb ? 1 : ta > tb ? -1 : 0;
    });

    document.title = `${playerName} - NBN`;
    setCrumbs(playerName);
    if (typeof _initNav === 'function') _initNav();
    document.getElementById('page-title').textContent = playerName;
    const seasonCount = new Set(rows.map(r => r.SEASON)).size;
    const bio = biosData[slug] || {};
    renderIdentity(bio, slug, `${seasonCount} NBN season${seasonCount !== 1 ? 's' : ''}`);
    const mergedRow = {
      DOB:        bio.dob        || rows[0].DOB,
      COLLEGE:    bio.college    || rows[0].COLLEGE,
      COUNTRY:    bio.country    || rows[0].COUNTRY,
      NBN_DFT_YR: bio.draft_year  ? String(bio.draft_year)  : rows[0].NBN_DFT_YR,
      NBN_DFT_R:  bio.draft_round ? String(bio.draft_round) : rows[0].NBN_DFT_R,
      NBN_DFT_P:  bio.draft_pick  ? String(bio.draft_pick)  : rows[0].NBN_DFT_P,
      HEIGHT:     bio.height   || '',
      WEIGHT:     bio.weight   != null ? String(bio.weight) : '',
      WINGSPAN:   bio.wingspan || '',
    };
    const editBioBtn = document.createElement('button');
    editBioBtn.textContent = 'Edit Bio';
    renderHeaderChrome(bio.photo_url || rows[0].PHOTO_URL, slug, editBioBtn);
    renderPlayerNav(slug);

    const content = document.getElementById('content');
    content.innerHTML = '';

    const hero = document.createElement('div');
    hero.className = 'player-hero';
    const info = document.createElement('div');
    hero.appendChild(info);
    content.appendChild(hero);

    // bio line
    renderBioLine(info, mergedRow);
    // OVR, Hall of Fame, Contract, History and Health as a row of tiles, then
    // the accolades. All but HOF link to the sub-page with the detail.
    const tiles = document.createElement('div');
    tiles.className = 'hero-tiles';
    info.appendChild(tiles);
    renderOvrTile(tiles, slug);
    renderHofLine(tiles, rows[0].PLAYER, hofRows);
    renderContractTile(tiles, bio, slug);
    renderHistoryTile(tiles, slug);
    renderHealthTile(tiles, slug);

    let bioFormEl = null;
    editBioBtn.addEventListener('click', async () => {
      if (bioFormEl) { bioFormEl.remove(); bioFormEl = null; editBioBtn.textContent = 'Edit Bio'; return; }
      const token = await getToken(); if (!token) return;
      const cur = biosData[slug] || {};
      bioFormEl = renderBioForm(
        { name: cur.name || '', pos: cur.pos || [], position: cur.position || null, dob: cur.dob || rows[0].DOB || '', college: cur.college || rows[0].COLLEGE || '', country: cur.country || rows[0].COUNTRY || '', draft_year: cur.draft_year || null, draft_round: cur.draft_round || null, draft_pick: cur.draft_pick || null, height: cur.height || '', weight: cur.weight ?? null, wingspan: cur.wingspan || '', photo_url: cur.photo_url || rows[0].PHOTO_URL || '', retired: cur.retired || false, type: cur.type || '', cap_holds: cur.cap_holds || {}, salaries: cur.salaries || {}, guaranteed: cur.guaranteed || {}, guarantee_dates: cur.guarantee_dates || {}, guarantee_schedule: cur.guarantee_schedule || {} },
        async (token, payload) => {
          const resp = await fetch(`/api/players/${slug}`, {
            method: 'PUT',
            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          if (resp.status === 401) { clearToken(); throw new Error('Token rejected.'); }
          if (!resp.ok) { const d = await resp.json().catch(() => ({})); throw new Error(d.detail || 'Save failed.'); }
          location.reload();
        },
        () => { bioFormEl.remove(); bioFormEl = null; editBioBtn.textContent = 'Edit Bio'; }
      );
      content.insertBefore(bioFormEl, hero.nextSibling);
      editBioBtn.textContent = 'Close';
    });

    // Under the tiles, two cards side by side: the career line with the
    // accolades, and the archetype radar.
    const heroRow = document.createElement('div');
    heroRow.className = 'hero-row';
    const careerCard = document.createElement('div');
    careerCard.className = 'career-card';
    heroRow.appendChild(careerCard);
    hero.appendChild(heroRow);
    renderCareerLine(careerCard, rows);
    renderCareerLine(careerCard, allPoRows.filter(r => r.SLUG === slug), 'Career · playoffs');
    renderAccolades(careerCard, slug, rows[0].RINGS, playerAwards, seasonLeaders);
    const radarEl = buildPlayerRadarChart(rows, allPlayerSeasons);
    if (radarEl) heroRow.appendChild(radarEl);

    // toggle
    const toggleBar = document.createElement('div');
    toggleBar.className = 'toggle-bar ui-segmented';
    toggleBar.setAttribute('role', 'group');
    const btnTeam     = document.createElement('button');
    const btnSeason   = document.createElement('button');
    const btnGameLog  = document.createElement('button');
    btnTeam.className     = 'toggle-btn active';
    btnSeason.className   = 'toggle-btn';
    btnGameLog.className  = 'toggle-btn';
    btnTeam.textContent     = 'By Team';
    btnSeason.textContent   = 'By Season';
    btnGameLog.textContent  = 'Game Log';
    const btnSplits = document.createElement('button');
    btnSplits.className = 'toggle-btn';
    btnSplits.textContent = 'Splits';
    toggleBar.appendChild(btnTeam);
    toggleBar.appendChild(btnSeason);
    toggleBar.appendChild(btnGameLog);
    toggleBar.appendChild(btnSplits);
    content.appendChild(toggleBar);

    // sections container
    const sections = document.createElement('div');
    content.appendChild(sections);
    const careerTotalsEl = document.createElement('div');
    content.appendChild(careerTotalsEl);
    renderCareerTotals(careerTotalsEl, slug, allPlayerSeasons, allPoRows.length ? allPoRows : null);
    const insightsEl = document.createElement('div');
    content.appendChild(insightsEl);
    renderInsights(insightsEl, slug);

    let bySeasonMode = false;
    let showGameLog  = false;
    let showSplits   = false;
    let splitsSeason = '';
    const poRows = allPoRows.filter(r => r.SLUG === slug && +r.G > 0);
    let gameLogRows = null;
    let gameLogPage = 0;
    const GL_PAGE_SIZE = 10;

    function fmtDate(iso) {
      if (!iso) return '';
      const [y, m, d] = iso.split('-');
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      return `${months[+m - 1]} ${+d}, ${y}`;
    }

    function renderGameLogSection() {
      sections.innerHTML = '';
      if (!gameLogRows) {
        const msg = document.createElement('div');
        msg.id = 'status'; msg.textContent = 'Loading game log…';
        sections.appendChild(msg);
        return;
      }
      if (!gameLogRows.length) {
        const msg = document.createElement('div');
        msg.id = 'status'; msg.textContent = 'No games found.';
        sections.appendChild(msg);
        return;
      }

      const totalPages = Math.ceil(gameLogRows.length / GL_PAGE_SIZE);
      const pageRows = gameLogRows.slice(gameLogPage * GL_PAGE_SIZE, (gameLogPage + 1) * GL_PAGE_SIZE);

      const h2 = document.createElement('h2');
      h2.className = 'section-heading';
      h2.textContent = 'Game Log';
      sections.appendChild(h2);

      const wrap = document.createElement('div');
      wrap.className = 'ui-table-wrap';
      sections.appendChild(wrap);

      const table = document.createElement('table'); table.className = 'ui-table';
      const thead = table.createTHead();
      const hr = thead.insertRow();
      [['Date',''], ['Season',''], ['Opp',''], ['W/L','right'], ['MIN','right'],
       ['PTS','right'], ['REB','right'], ['AST','right'], ['STL','right'], ['BLK','right'],
       ['TOV','right'], ['FGM/A','right'], ['3PM/A','right'], ['FTM/A','right']].forEach(([label, cls]) => {
        const th = document.createElement('th');
        th.textContent = label;
        if (cls) th.className = cls;
        hr.appendChild(th);
      });

      const tbody = table.createTBody();
      pageRows.forEach(r => {
        const tr = tbody.insertRow();
        const cells = [
          () => { const td = tr.insertCell(); td.textContent = fmtDate(r.date); return td; },
          () => {
            const td = tr.insertCell();
            td.className = 'muted';
            td.textContent = r.season;
            if (r.gametype === 'PLAYOFF') {
              const b = document.createElement('span');
              b.className = 'po-badge'; b.textContent = 'PO';
              td.appendChild(b);
            }
            return td;
          },
          () => {
            const td = tr.insertCell();
            const prefix = r.home ? 'vs' : '@';
            td.textContent = `${prefix} ${r.opp_raw}`;
            return td;
          },
          () => {
            const td = tr.insertCell();
            td.className = 'right';
            if (r.wl) {
              const score = r.team_pts || r.opp_pts
                ? ` ${r.team_pts}–${r.opp_pts}` : '';
              td.textContent = r.wl + score;
              td.style.color = r.wl === 'W' ? 'var(--market-positive)' : r.wl === 'L' ? 'var(--danger)' : '';
            }
            return td;
          },
          () => { const td = tr.insertCell(); td.className = 'right'; td.textContent = r.min; return td; },
          () => { const td = tr.insertCell(); td.className = 'right'; td.textContent = r.pts; return td; },
          () => { const td = tr.insertCell(); td.className = 'right'; td.textContent = r.reb; return td; },
          () => { const td = tr.insertCell(); td.className = 'right'; td.textContent = r.ast; return td; },
          () => { const td = tr.insertCell(); td.className = 'right'; td.textContent = r.stl; return td; },
          () => { const td = tr.insertCell(); td.className = 'right'; td.textContent = r.blk; return td; },
          () => { const td = tr.insertCell(); td.className = 'right'; td.textContent = r.tov; return td; },
          () => { const td = tr.insertCell(); td.className = 'right'; td.textContent = `${r.fgm}/${r.fga}`; return td; },
          () => { const td = tr.insertCell(); td.className = 'right'; td.textContent = `${r.tpm}/${r.tpa}`; return td; },
          () => { const td = tr.insertCell(); td.className = 'right'; td.textContent = `${r.ftm}/${r.fta}`; return td; },
        ];
        cells.forEach(fn => fn());
      });
      wrap.appendChild(table);

      const pg = document.createElement('div');
      pg.className = 'gamelog-pagination';
      const prevBtn = document.createElement('button');
      prevBtn.className = 'gl-page-btn';
      prevBtn.textContent = '← Prev';
      prevBtn.disabled = gameLogPage === 0;
      prevBtn.addEventListener('click', () => { gameLogPage--; renderGameLogSection(); });
      const nextBtn = document.createElement('button');
      nextBtn.className = 'gl-page-btn';
      nextBtn.textContent = 'Next →';
      nextBtn.disabled = gameLogPage >= totalPages - 1;
      nextBtn.addEventListener('click', () => { gameLogPage++; renderGameLogSection(); });
      const info = document.createElement('span');
      const start = gameLogPage * GL_PAGE_SIZE + 1;
      const end = Math.min((gameLogPage + 1) * GL_PAGE_SIZE, gameLogRows.length);
      info.textContent = `${start}–${end} of ${gameLogRows.length}`;
      pg.appendChild(prevBtn);
      pg.appendChild(info);
      pg.appendChild(nextBtn);
      sections.appendChild(pg);
    }

    // Games started, per "season|REG" or "season|PLAYOFF" → {by: {TEAM: gs},
    // known: {TEAM: games with recorded starters}}, for
    // the seasons that record starters. A row with none stays '—'.
    const starts = {};
    function startsFor(r) {
      const po = isPlayoffRow(r);
      const s = starts[`${r.SEASON.replace(' Playoffs', '')}|${po ? 'PLAYOFF' : 'REG'}`];
      const teams = r._teams || [r.TEAM];
      // A team whose starters were never recorded is unknown, not 0 starts.
      if (!s || !teams.some(t => s.known[t])) return undefined;
      return teams.reduce((n, t) => n + (s.by[t] || 0), 0);
    }
    function getDisplayRows() {
      const reg = bySeasonMode ? aggregateBySeasonRows(rows) : rows;
      const po = bySeasonMode ? aggregateBySeasonRows(poRows) : poRows;
      const dob = rows[0].DOB;
      return [...reg, ...po].map(r => ({ ...r, AGE: ageAtSeason(dob, r.SEASON), GS: startsFor(r) }));
    }

    function makeLeaderCheck() {
      return (row, col) => {
        if (!col.sortField || !LEADER_STATS.includes(col.sortField)) return false;
        if (!row.SEASON || row.SEASON.includes('Playoffs')) return false;
        const leaders = seasonLeaders[row.SEASON];
        if (!leaders || !leaders[col.sortField]) return false;
        return leaders[col.sortField].slug === slug;
      };
    }

    function rebuildSections() {
      if (showGameLog) { renderGameLogSection(); return; }
      if (showSplits) { renderSplitsSection(); return; }
      const displayRows = getDisplayRows();
      sections.innerHTML = '';
      const iconFn = makeIconFn(rows, poRows, playerAwards, slug, bySeasonMode);
      // Regular season and playoffs each get their own career line.
      const reg = displayRows.filter(r => !isPlayoffRow(r));
      const po  = displayRows.filter(isPlayoffRow);
      const careerLines = build => po.length
        ? [build(reg), { ...build(po), SEASON: 'Career Playoffs' }]
        : build(reg);
      buildSection(sections, 'Season Stats', displayRows, SEASON_COLS, 'SEASON', 'LAST_DATE', careerLines(careerStatsRow), makeLeaderCheck(), iconFn);
      buildSection(sections, 'Season Highs', displayRows, HIGHS_COLS, 'SEASON', 'LAST_DATE', careerLines(careerHighsRow), null, iconFn);
    }

    function setStatsMode() {
      showGameLog = false;
      showSplits = false;
      btnGameLog.classList.remove('active');
      btnSplits.classList.remove('active');
    }

    // Always rebuild: coming back from the game log must leave it even when
    // the mode clicked is the one that was already selected.
    function setMode(bySeason) {
      setStatsMode();
      bySeasonMode = bySeason;
      btnTeam.classList.toggle('active', !bySeason);
      btnSeason.classList.toggle('active', bySeason);
      rebuildSections();
    }
    btnTeam.addEventListener('click', () => setMode(false));
    btnSeason.addEventListener('click', () => setMode(true));

    // The game log is fetched once, on first use, by either view that needs it.
    let gameLogFetch = null;
    function loadGameLog() {
      if (gameLogRows !== null || gameLogFetch) return;
      gameLogFetch = fetch(`/api/players/${slug}/gamelog`)
        .then(r => { if (!r.ok) throw new Error(); return r.json(); })
        .then(data => { gameLogRows = data; })
        .catch(() => { gameLogRows = []; })
        .then(() => rebuildSections());
    }

    function showOnly(btn) {
      [btnTeam, btnSeason, btnGameLog, btnSplits].forEach(b => b.classList.toggle('active', b === btn));
    }

    btnGameLog.addEventListener('click', () => {
      if (showGameLog) return;
      showSplits = false;
      showGameLog = true;
      showOnly(btnGameLog);
      gameLogPage = 0;
      renderGameLogSection();
      loadGameLog();
    });

    btnSplits.addEventListener('click', () => {
      if (showSplits) return;
      showGameLog = false;
      showSplits = true;
      showOnly(btnSplits);
      renderSplitsSection();
      loadGameLog();
    });

    // Splits: the game log cut by home/away, win/loss, regular season and
    // playoffs, then by opponent. Averages per game, from the same rows the
    // Game Log view lists, for every season or one.
    function renderSplitsSection() {
      sections.innerHTML = '';
      if (!gameLogRows || !gameLogRows.length) {
        const msg = document.createElement('div');
        msg.id = 'status';
        msg.textContent = gameLogRows ? 'No games found.' : 'Loading game log…';
        sections.appendChild(msg);
        return;
      }
      const won = g => (g.team_pts || g.opp_pts) ? g.team_pts > g.opp_pts : g.wl === 'W';
      const seasons = [...new Set(gameLogRows.map(g => g.season))].sort().reverse();
      if (splitsSeason && !seasons.includes(splitsSeason)) splitsSeason = '';
      const games = gameLogRows.filter(g => !splitsSeason || g.season === splitsSeason);

      const head = document.createElement('div');
      head.className = 'splits-head';
      const h2 = document.createElement('h2');
      h2.className = 'section-heading';
      h2.textContent = 'Splits';
      const sel = document.createElement('select');
      sel.className = 'ui-select';
      sel.setAttribute('aria-label', 'Season');
      sel.appendChild(new Option('All seasons', ''));
      seasons.forEach(x => sel.appendChild(new Option(x, x)));
      sel.value = splitsSeason;
      sel.addEventListener('change', () => { splitsSeason = sel.value; renderSplitsSection(); });
      head.append(h2, sel);
      sections.appendChild(head);

      const COLS = [['G', 'right'], ['W–L', 'right'], ['MIN', 'right'], ['PTS', 'right'], ['REB', 'right'],
        ['AST', 'right'], ['STL', 'right'], ['BLK', 'right'], ['TOV', 'right'],
        ['FG%', 'right'], ['3P%', 'right'], ['FT%', 'right'], ['High', 'right']];
      const line = list => {
        const n = list.length;
        const sum = k => list.reduce((a, g) => a + (+g[k] || 0), 0);
        const avg = k => (sum(k) / n).toFixed(1);
        const pct = (m, a) => sum(a) ? (sum(m) / sum(a) * 100).toFixed(1) : '—';
        const w = list.filter(won).length;
        return [n, `${w}–${n - w}`, avg('min'), avg('pts'), avg('reb'), avg('ast'), avg('stl'), avg('blk'), avg('tov'),
          pct('fgm', 'fga'), pct('tpm', 'tpa'), pct('ftm', 'fta'), Math.max(...list.map(g => +g.pts || 0))];
      };
      const table = (first, rows) => {
        const wrap = document.createElement('div');
        wrap.className = 'ui-table-wrap';
        const t = document.createElement('table');
        t.className = 'ui-table ui-table--sticky-first';
        const hr = t.createTHead().insertRow();
        [[first, ''], ...COLS].forEach(([label, cls]) => {
          const th = document.createElement('th');
          th.textContent = label;
          if (cls) th.className = cls;
          hr.appendChild(th);
        });
        const body = t.createTBody();
        rows.forEach(([label, list, cls]) => {
          if (!list.length) return;
          const tr = body.insertRow();
          if (cls) tr.className = cls;
          const th = tr.insertCell();
          if (label instanceof Node) th.appendChild(label); else th.textContent = label;
          line(list).forEach((v, i) => {
            const td = tr.insertCell();
            td.className = 'right' + (i === 3 ? ' strong' : '');
            td.textContent = v;
          });
        });
        wrap.appendChild(t);
        return wrap;
      };

      const reg = games.filter(g => g.gametype !== 'PLAYOFF');
      const po = games.filter(g => g.gametype === 'PLAYOFF');
      sections.appendChild(table('', [
        ['All games', games, 'career-row'],
        ['Regular season', reg],
        ['Playoffs', po],
        ['Home', games.filter(g => g.home)],
        ['Away', games.filter(g => !g.home)],
        ['Wins', games.filter(won)],
        ['Losses', games.filter(g => !won(g))],
      ]));

      const h3 = document.createElement('h2');
      h3.className = 'section-heading';
      h3.textContent = 'By Opponent';
      sections.appendChild(h3);
      const byOpp = new Map();
      games.forEach(g => {
        const k = g.opp_raw || String(g.opp || '').replace('@', '');
        if (!byOpp.has(k)) byOpp.set(k, []);
        byOpp.get(k).push(g);
      });
      const oppLabel = abbr => {
        const a = document.createElement('a');
        a.href = `/teams/${encodeURIComponent(abbr)}/`;
        a.className = 'splits-opp';
        const img = document.createElement('img');
        img.src = `/logos/sm/logo-${abbr.toLowerCase()}.webp`;
        img.alt = '';
        img.onerror = function () { this.remove(); };
        a.append(img, document.createTextNode(abbr));
        return a;
      };
      // Most points per game first: "who does he light up" is the question.
      const opps = [...byOpp.entries()]
        .sort((a, b) => b[1].reduce((s, g) => s + g.pts, 0) / b[1].length - a[1].reduce((s, g) => s + g.pts, 0) / a[1].length);
      sections.appendChild(table('Opponent', opps.map(([abbr, list]) => [oppLabel(abbr), list])));
    }

    rebuildSections();

    // Starts arrive after the first draw; redraw once they're in.
    const startSeasons = [...new Set([...rows, ...poRows].map(r => r.SEASON.replace(' Playoffs', '')))]
      .filter(s => s >= '26-27');
    Promise.all(startSeasons.flatMap(season => ['REG', 'PLAYOFF'].map(type =>
      fetch(`/api/game-starters/counts?season=${season}&game_type=${type}`)
        .then(r => (r.ok ? r.json() : null)).catch(() => null)
        .then(d => {
          // Only a season that has any known starters at all: otherwise every
          // row would read 0 starts, which is a claim, not an unknown.
          if (d && Object.keys(d.team_games_known || {}).length) {
            starts[`${season}|${type}`] = { by: (d.players[slug] || {}).by_team || {}, known: d.team_games_known };
          }
        }))))
      .then(() => { if (Object.keys(starts).length && !showGameLog && !showSplits) rebuildSections(); });
  }

  // ── Main ─────────────────────────────────────────────────────────────────────

  Promise.all([
    fetch('/players/player_seasons.csv').then(r => { if (!r.ok) throw new Error(); return r.text(); }),
    fetch('/players/player_awards.csv').then(r => r.text()).catch(() => ''),
    fetch('/api/players').then(r => r.ok ? r.json() : {}).catch(() => ({})),
    fetch('/api/team-map').then(r => r.ok ? r.json() : {}).catch(() => ({})),
    fetch('/api/ovr/current').then(r => r.ok ? r.json() : {}).catch(() => ({})),
    fetch('/api/ovr').then(r => r.ok ? r.json() : {}).catch(() => ({})),
    fetch('/api/attributes').then(r => r.ok ? r.json() : {}).catch(() => ({})),
    fetch('/api/auth/me', { headers: localStorage.getItem('nbn_token') ? { Authorization: `Bearer ${localStorage.getItem('nbn_token')}` } : {} }).then(r => r.ok ? r.json() : null).catch(() => null),
    fetch('/api/league-year').then(r => r.ok ? r.json() : null).catch(() => null),
    slug ? fetch('/players/player_seasons_playoffs.csv').then(r => r.ok ? r.text() : '').catch(() => '') : '',
    slug ? fetch('/data/hof.csv').then(r => r.ok ? r.text() : '').catch(() => '') : '',
  ])
    .then(([seasonsText, awardsText, biosJson, teamMapJson, ovrJson, ovrHistoryJson, attributesJson, authJson, leagueYearJson, poText, hofText]) => {
      biosData = biosJson;
      teamMap = teamMapJson;
      currentOvr = ovrJson;
      allOvrHistory = ovrHistoryJson;
      allAttributes = attributesJson;
      // This page already holds every snapshot, so serve the popup from memory
      // instead of letting it fetch per player.
      if (window.RatingsPopup) RatingsPopup.setSource(currentAttributes);
      AUTH_ROLES = Array.isArray(authJson?.roles) ? authJson.roles : [];
      if (leagueYearJson?.current_season) LEAGUE_YEAR = leagueYearJson.current_season;

      const rows = parseCSV(seasonsText);
      allPlayerSeasons = rows;
      const awards = awardsText ? parseCSV(awardsText) : [];

      const playerAwards = {};
      awards.forEach(a => {
        if (!playerAwards[a.SLUG]) playerAwards[a.SLUG] = [];
        playerAwards[a.SLUG].push(a);
      });

      const seasonLeaders = buildSeasonLeaders(rows);

      if (!slug) {
        renderIndex(rows);
        return;
      }

      // Only rows for seasons actually played count as stats. The build emits a
      // bio-snapshot row (SEASON/G all NA) for any drafted player so draft info
      // flows through, but a player who hasn't played yet should render as a
      // clean bio-only page, not an empty season table.
      const playerRows = rows.filter(r => r.SLUG === slug && +r.G > 0);
      if (!playerRows.length) {
        // Player exists in bios but has no played seasons yet
        const bio = biosData[slug];
        if (bio) {
          renderBioOnlyPlayer(slug, bio);
        } else {
          showError(`Player not found: <strong>${slug}</strong>`);
        }
        return;
      }

      const bio = biosData[slug] || {};
      const playerName = bio.name ? displayName(bio.name) : playerRows[0].PLAYER;
      rows.forEach(r => { if (r.PLAYER && r.SLUG) slugByName.set(r.PLAYER.toUpperCase(), r.SLUG); });
      renderPlayer(playerName, playerRows, playerAwards, seasonLeaders,
                   poText ? parseCSV(poText) : [], hofText ? parseCSV(hofText) : []);
    })
    .catch(() => showError('Failed to load data.'));
})();
</script>
  <script src="/nav.js"></script>
  <script src="/token-badge.js"></script>
</body>
</html>

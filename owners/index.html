<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="/theme-boot.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/shared.css">
  <title>Owner History — NBN</title>
  <!-- NBN:og -->
  <meta name="description" content="Career records, ratings and playoff résumés for every NBN general manager.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NBN">
  <meta property="og:title" content="Owner History — NBN">
  <meta property="og:description" content="Career records, ratings and playoff résumés for every NBN general manager.">
  <meta property="og:url" content="https://nbn.today/owners/">
  <meta property="og:image" content="https://nbn.today/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Nothing But Net — fantasy basketball GM simulation league">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0d0e11">
  <link rel="icon" href="/icons/favicon.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <!-- /NBN:og -->
  <style>

    
    
    
    
    
    
    
    thead th .sort-arrow {
      margin-left: 4px;
      opacity: 0;
      font-size: 0.65rem;
    }

    thead th[data-active="true"] .sort-arrow { opacity: 1; }

    
    
    
    
    td.owner-name {
      font-weight: 600;
      color: var(--text-primary);
    }

    td.team-name {
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    
    
    
    .trophy {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.5rem;
      height: 1.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0 0.3rem;
    }

    .trophy-gold { background: var(--gold-chip-border); color: var(--gold); }
    .trophy-silver { background: var(--bg-card); color: var(--text-muted); border: 1px solid var(--border); }

    .achievement {
      display: inline-block;
      margin-left: 0.35rem;
      font-size: 0.85rem;
      cursor: default;
      position: relative;
      vertical-align: middle;
    }

    .achievement--lg {
      font-size: 1.15rem;
    }

    .achievement::after {
      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 5px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.12s;
      z-index: 10;
    }

    .achievement:hover::after { opacity: 1; }

    /* Leader cards over the table: the same shape as the stats pages'. */
    .ow-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--space-3); margin-bottom: var(--space-6); }
    .ow-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-3) var(--space-4) var(--space-2); cursor: pointer; text-align: left; font: inherit; color: inherit; transition: border-color 0.12s; }
    .ow-card:hover { border-color: var(--text-dim); }
    .ow-card[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .ow-card-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-2); margin-bottom: var(--space-2); }
    .ow-card-name { font-size: var(--text-sm); font-weight: 600; color: var(--text-primary); }
    .ow-card-note { font-size: var(--text-xs); color: var(--text-muted); }
    .ow-row { display: grid; grid-template-columns: 1.4rem 1fr auto; align-items: center; column-gap: var(--space-2); padding: 3px 0; font-size: var(--text-sm); }
    .ow-row-rank { color: var(--text-muted); font-size: var(--text-xs); text-align: right; font-variant-numeric: tabular-nums; }
    .ow-row-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-secondary); }
    .ow-card-head + .ow-row .ow-row-name { color: var(--text-primary); font-weight: 600; }
    .ow-row-val { font-variant-numeric: tabular-nums; color: var(--text-primary); }
    .ow-row-bar { grid-column: 2 / 4; height: 3px; border-radius: 2px; background: var(--border-subtle); overflow: hidden; margin-top: 2px; }
    .ow-row-bar > span { display: block; height: 100%; border-radius: 2px; background: var(--accent); }
    .ow-card-empty { font-size: var(--text-xs); color: var(--text-muted); padding: var(--space-2) 0; }
    @media (max-width: 480px) {
      .ow-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-2); }
      .ow-card { padding: var(--space-2) var(--space-3) var(--space-1); }
      .ow-row { grid-template-columns: 1rem 1fr auto; column-gap: var(--space-1); font-size: var(--text-xs); }
    }

    #status {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="page ui-page ui-page--wide">
    <nav class="nav"></nav>

    <header class="ui-header">
      <div>
        <h1 class="ui-title">Owner History</h1>
      </div>
    </header>

    <div class="ow-grid" id="grid"></div>
    <div class="ui-table-wrap" id="table-wrap">
      <div id="status">Loading…</div>
    </div>
  </div>

  <script>
    const COLS = [
      { key: 'owner',            label: 'Owner',        cls: 'owner-name',  sortField: 'owner',            numeric: false, defaultDir:  1 },
      { key: 'teams',            label: 'Team(s)',       cls: 'team-name',   sortField: 'teams',            numeric: false, defaultDir:  1,
        display: r => r.teams || '—' },
      { key: 'seasons',          label: 'Szns',          cls: 'right',       sortField: 'seasons',          numeric: true,  defaultDir: -1 },
      { key: 'best_reg_season',  label: 'Best Szn',      cls: 'right',       sortField: 'best_reg_pct',     numeric: true,  defaultDir: -1,
        display: r => r.best_reg_season || '—' },
      { key: 'worst_reg_season', label: 'Worst Szn',     cls: 'right',       sortField: 'worst_reg_pct',    numeric: true,  defaultDir:  1,
        display: r => r.worst_reg_season || '—' },
      { key: 'total_wl',         label: 'W–L',           cls: 'right',       sortField: 'total_pct',        numeric: true,  defaultDir: -1,
        display: r => (parseInt(r.total_w) + parseInt(r.total_l) === 0) ? '—' : `${r.total_w}–${r.total_l}` },
      { key: 'total_pct',        label: 'W%',            cls: 'right muted', sortField: 'total_pct',        numeric: true,  defaultDir: -1,
        display: r => fmtPct(r.total_pct) },
      { key: 'reg_wl',           label: 'Reg W–L',       cls: 'right',       sortField: 'reg_pct',          numeric: true,  defaultDir: -1,
        display: r => (parseInt(r.reg_w) + parseInt(r.reg_l) === 0) ? '—' : `${r.reg_w}–${r.reg_l}` },
      { key: 'reg_pct',          label: 'Reg W%',        cls: 'right muted', sortField: 'reg_pct',          numeric: true,  defaultDir: -1,
        display: r => fmtPct(r.reg_pct) },
      { key: 'po_wl',            label: 'Playoff W–L',   cls: 'right',       sortField: 'playoff_pct',      numeric: true,  defaultDir: -1,
        display: r => r.playoff_appearances === '0' ? '—' : `${r.playoff_w}–${r.playoff_l}` },
      { key: 'po_pct',           label: 'Playoff W%',    cls: 'right muted', sortField: 'playoff_pct',      numeric: true,  defaultDir: -1,
        display: r => fmtPct(r.playoff_pct) },
      { key: 'playoff_appearances', label: 'PO App',     cls: 'center',      sortField: 'playoff_appearances', numeric: true, defaultDir: -1,
        display: r => parseInt(r.playoff_appearances) > 0 ? r.playoff_appearances : '—' },
      { key: 'po_r2',            label: 'R2',            cls: 'center',      sortField: 'po_r2',            numeric: true,  defaultDir: -1,
        display: r => parseInt(r.po_r2) > 0 ? r.po_r2 : '—' },
      { key: 'po_conf_finals',   label: 'Conf Finals',   cls: 'center',      sortField: 'po_conf_finals',   numeric: true,  defaultDir: -1,
        display: r => parseInt(r.po_conf_finals) > 0 ? r.po_conf_finals : '—' },
      { key: 'po_finals',        label: 'Finals',        cls: 'center',      sortField: 'po_finals',        numeric: true,  defaultDir: -1,
        display: r => parseInt(r.po_finals) > 0 ? r.po_finals : '—' },
      { key: 'championships',    label: '🏆',            cls: 'center',      sortField: 'championships',    numeric: true,  defaultDir: -1 },
      { key: 'off_rtg',          label: 'Off Rtg',       cls: 'right',       sortField: 'off_rtg',          numeric: true,  defaultDir: -1,
        display: r => fmtRtg(r.off_rtg) },
      { key: 'def_rtg',          label: 'Def Rtg',       cls: 'right',       sortField: 'def_rtg',          numeric: true,  defaultDir: -1,
        display: r => fmtRtg(r.def_rtg) },
    ];

    const RTG_COLS = new Set(['off_rtg', 'def_rtg']);
    let colRanges = {};
    let ownerAchievements = new Map();

    function parseBestWins(s) {
      if (!s || s === 'NA') return 0;
      return parseInt(s.split('-')[0]) || 0;
    }

    const ACHIEVEMENTS = [
      {
        id: 'champion',
        icon: '🏆',
        test: r => parseInt(r.championships) >= 1,
        label: r => parseInt(r.championships) > 1 ? `${r.championships}× Champion` : 'Champion',
      },
      {
        id: 'finalist',
        icon: '🥈',
        test: r => parseInt(r.po_finals) >= 1 && parseInt(r.championships) === 0,
        label: r => parseInt(r.po_finals) > 1 ? `${r.po_finals}× Finals Appearance` : 'Finals Appearance',
      },
      {
        id: 'season_70',
        icon: '🔥',
        large: true,
        test: r => parseBestWins(r.best_reg_season) >= 70,
        label: r => `70-Win Season (${r.best_reg_season})`,
      },
      {
        id: 'season_60',
        icon: '🔥',
        test: r => parseBestWins(r.best_reg_season) >= 60 && parseBestWins(r.best_reg_season) < 70,
        label: r => `60-Win Season (${r.best_reg_season})`,
      },
    ];

    function buildAchievements(rows) {
      const map = new Map();
      rows.forEach(r => {
        map.set(r.owner, ACHIEVEMENTS.filter(a => a.test(r)).map(a => ({ icon: a.icon, label: a.label(r), large: !!a.large })));
      });
      return map;
    }

    let sortField = 'total_pct';
    let sortDir = -1;

    function fmtPct(val) {
      if (!val || val === 'NA') return '—';
      const n = parseFloat(val);
      return isNaN(n) ? '—' : n.toFixed(3);
    }

    function fmtRtg(val) {
      if (!val || val === 'NA') return '—';
      const n = parseFloat(val);
      if (isNaN(n)) return '—';
      return (n >= 0 ? '+' : '') + n.toFixed(2);
    }

    function sortVal(row, field) {
      const v = row[field];
      if (!v || v === 'NA') return -Infinity;
      const n = parseFloat(v);
      return isNaN(n) ? v : n;
    }

    function sortRows(rows) {
      return [...rows].sort((a, b) => {
        const va = sortVal(a, sortField);
        const vb = sortVal(b, sortField);
        if (va < vb) return -sortDir;
        if (va > vb) return sortDir;
        return 0;
      });
    }

    function buildTable(rows) {
      const table = document.createElement('table'); table.className = 'ui-table';

      const thead = table.createTHead();
      const hr = thead.insertRow();
      COLS.forEach(col => {
        const th = document.createElement('th');
        const isActive = col.sortField === sortField;
        const arrow = document.createElement('span');
        arrow.className = 'sort-arrow';
        arrow.textContent = sortDir === -1 ? '↓' : '↑';
        th.appendChild(document.createTextNode(col.label));
        th.appendChild(arrow);
        th.dataset.active = isActive;
        if (col.cls && col.cls.includes('right')) th.classList.add('right');
        if (col.cls && col.cls.includes('center')) th.classList.add('right');
        th.addEventListener('click', () => {
          if (sortField === col.sortField) {
            sortDir *= -1;
          } else {
            sortField = col.sortField;
            sortDir = col.defaultDir;
          }
          rebuildBody(rows, tbody);
          renderCards(rows);
          thead.querySelectorAll('th').forEach(t => {
            t.dataset.active = false;
            t.querySelector('.sort-arrow').textContent = '↓';
          });
          th.dataset.active = true;
          th.querySelector('.sort-arrow').textContent = sortDir === -1 ? '↓' : '↑';
        });
        hr.appendChild(th);
      });

      const tbody = table.createTBody();
      rebuildBody(rows, tbody);
      return table;
    }

    function rebuildBody(rows, tbody) {
      tbody.innerHTML = '';
      sortRows(rows).forEach(row => {
        const tr = tbody.insertRow();
        COLS.forEach(col => {
          const td = tr.insertCell();
          col.cls.split(' ').forEach(c => c && td.classList.add(c));

          if (col.key === 'owner') {
            const ownerLink = document.createElement('a');
            ownerLink.href = `/members/${encodeURIComponent(row.owner)}/`;
            ownerLink.textContent = row.owner ?? '';
            ownerLink.style.cssText = 'color:inherit;text-decoration:none;';
            ownerLink.onmouseover = () => ownerLink.style.textDecoration = 'underline';
            ownerLink.onmouseout  = () => ownerLink.style.textDecoration = 'none';
            td.appendChild(ownerLink);
            (ownerAchievements.get(row.owner) ?? []).forEach(a => {
              const span = document.createElement('span');
              span.className = a.large ? 'achievement achievement--lg' : 'achievement';
              span.dataset.tip = a.label;
              span.textContent = a.icon;
              td.appendChild(span);
            });
          } else if (col.key === 'championships') {
            if (parseInt(row.championships) > 0) {
              const b = document.createElement('span');
              b.className = 'trophy trophy-gold';
              b.textContent = row.championships;
              td.appendChild(b);
            }
          } else if (col.display) {
            td.textContent = col.display(row);
          } else {
            td.textContent = row[col.key] ?? '';
          }

          if (RTG_COLS.has(col.key) && colRanges[col.key]) {
            const n = parseFloat(row[col.key]);
            if (!isNaN(n)) {
              const { min, max } = colRanges[col.key];
              const t = max === min ? 0.5 : (n - min) / (max - min);
              const hue = Math.round(t * 120);
              td.style.background = `hsl(${hue} 70% 50% / 0.16)`;
              td.style.color = `hsl(${hue} 70% var(--heat-text-l))`;
            }
          }
        });
      });
    }

    // Leader cards. Each sorts the table by its own column when picked. The
    // percentage cards need a floor, or a two-season owner tops them.
    const CARDS = [
      { name: 'Titles',          field: 'championships' },
      { name: 'Finals trips',    field: 'po_finals' },
      { name: 'Conference finals', field: 'po_conf_finals' },
      { name: 'Playoff trips',   field: 'playoff_appearances' },
      { name: 'Playoff wins',    field: 'playoff_w' },
      { name: 'Total wins',      field: 'total_w' },
      { name: 'Win %',           field: 'total_pct',   note: '3+ seasons', fmt: v => fmtPct(v),
        ok: r => parseInt(r.seasons) >= 3 },
      { name: 'Playoff win %',   field: 'playoff_pct', note: '20+ games', fmt: v => fmtPct(v),
        ok: r => parseInt(r.playoff_w) + parseInt(r.playoff_l) >= 20 },
      { name: 'Best season',     field: 'best_reg_pct', show: r => r.best_reg_season },
      { name: 'Seasons',         field: 'seasons' },
    ];

    function renderCards(rows) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      CARDS.forEach(card => {
        const list = rows
          .filter(r => parseFloat(r[card.field]) > 0 && (!card.ok || card.ok(r)))
          .sort((a, b) => parseFloat(b[card.field]) - parseFloat(a[card.field]))
          .slice(0, 5);
        const top = list.length ? parseFloat(list[0][card.field]) : 0;
        const el = document.createElement('button');
        el.className = 'ow-card';
        el.setAttribute('aria-pressed', card.field === sortField);
        el.innerHTML = `<div class="ow-card-head"><span class="ow-card-name">${card.name}</span>`
          + `<span class="ow-card-note">${card.note || ''}</span></div>`
          + (list.length ? list.map((r, i) => {
              const v = parseFloat(r[card.field]);
              const shown = card.show ? card.show(r) : card.fmt ? card.fmt(r[card.field]) : r[card.field];
              // Ties share a rank.
              const rank = list.findIndex(o => parseFloat(o[card.field]) === v) + 1;
              return `<div class="ow-row"><span class="ow-row-rank">${rank}</span>`
                + `<span class="ow-row-name"></span>`
                + `<span class="ow-row-val">${shown}</span>`
                + `<span></span><span class="ow-row-bar"><span style="width:${top > 0 ? (v / top * 100).toFixed(1) : 0}%"></span></span></div>`;
            }).join('')
            : '<div class="ow-card-empty">Nobody yet.</div>');
        // Owner names are member-chosen text: set them as text, not markup.
        el.querySelectorAll('.ow-row-name').forEach((n, i) => { n.textContent = list[i].owner; });
        el.addEventListener('click', () => {
          sortField = card.field;
          sortDir = -1;
          renderAll(rows);
        });
        grid.appendChild(el);
      });
    }

    function renderAll(rows) {
      renderCards(rows);
      const wrap = document.getElementById('table-wrap');
      wrap.replaceChildren(buildTable(rows));
    }

    (async () => {
      const status = document.getElementById('status');
      const wrap = document.getElementById('table-wrap');
      try {
        const res = await fetch('/data/owner_stats.csv');
        if (!res.ok) throw new Error(res.statusText);
        const text = await res.text();
        const rows = parseCSV(text);
        ownerAchievements = buildAchievements(rows);
        RTG_COLS.forEach(key => {
          const vals = rows.map(r => parseFloat(r[key])).filter(v => !isNaN(v));
          if (vals.length) colRanges[key] = { min: Math.min(...vals), max: Math.max(...vals) };
        });
        status.remove();
        renderAll(rows);
      } catch (e) {
        status.textContent = 'Failed to load owner stats.';
      }
    })();
  </script>
  <script src="/nav.js"></script>
  <script src="/token-badge.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="/theme-boot.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/shared.css">
  <title>NBN | Wall Street 2</title>
  <!-- NBN:og -->
  <meta name="description" content="A discounted-cash-flow price for every NBN franchise, built on the Front Office Ledger.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NBN">
  <meta property="og:title" content="NBN | Wall Street 2">
  <meta property="og:description" content="A discounted-cash-flow price for every NBN franchise, built on the Front Office Ledger.">
  <meta property="og:url" content="https://nbn.today/invest/fair/">
  <meta property="og:image" content="https://nbn.today/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Nothing But Net — fantasy basketball GM simulation league">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0d0e11">
  <link rel="icon" href="/icons/favicon.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <!-- /NBN:og -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <style>
    .fv-chips { display: flex; flex-wrap: wrap; gap: var(--space-2); }
    .fv-table .team-in { display: flex; align-items: center; gap: 0.5rem; }
    /* # and Team both stay put while the table scrolls sideways. */
    .fv-table > thead > tr#thead > :first-child, .fv-table > tbody > tr.row > :first-child { width: 2.5rem; min-width: 2.5rem; box-sizing: border-box; }
    .fv-table > thead > tr#thead > :nth-child(2), .fv-table > tbody > tr.row > :nth-child(2) { position: sticky; left: 2.5rem; background: var(--bg-page); z-index: 1; }
    .fv-years td:first-child { position: static; background: none; }
    .fv-table > tbody > tr.row:is(:hover, .open) > td { background: var(--bg-hover); }
    /* A mask, like the tab strip's: the right edge fades while there are columns off to the side. */
    .fv-wrap.more .ui-table-wrap { mask-image: linear-gradient(to right, black calc(100% - 2.5rem), transparent); }
    /* Column groups: a short label over each run of columns, ruled underneath. */
    .fv-table #thgroup th { border-bottom: none; padding-bottom: 0; font-size: var(--text-xs); letter-spacing: 0.08em; color: var(--text-dim); text-align: center; }
    .fv-table #thgroup th span { display: block; border-bottom: 1px solid var(--border); padding-bottom: var(--space-1); }
    .fv-table #thgroup th.blank { position: sticky; left: 0; background: var(--bg-page); z-index: 1; }
    .fv-table td.gstart, .fv-table #thead th.gstart { border-left: 1px solid var(--border-subtle); }
    .fv-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr)); gap: var(--space-2); margin-bottom: var(--space-4); }
    .fv-tile { border-left: 2px solid var(--border); padding: var(--space-1) var(--space-3); }
    .fv-tile .ui-kicker { color: var(--text-muted); font-size: var(--text-xs); }
    .fv-tile .ui-statline { margin-top: var(--space-1); }
    .fv-tile .ui-statline > b.up { color: var(--market-positive); }
    .fv-tile .ui-statline > b.dn { color: var(--danger); }
    .fv-table .logo { width: 20px; height: 20px; object-fit: contain; }
    .fv-table th[data-sort] { cursor: pointer; }
    .fv-table th.sorted { color: var(--text-primary); }
    .fv-table tbody tr.row { cursor: pointer; }
    .fv-table td.mono, .fv-years td.mono { font-family: var(--font-mono); }
    .fv-detail > td { white-space: normal; padding: 0; background: var(--bg-card); }
    .ui-table tbody tr.fv-detail:hover > td { background: var(--bg-card); }
    .fv-years tr:hover td { background: none; }
    /* The cell spans the whole scrolling table; its content is held to the
       visible width (set from JS) so prose never runs off the side. */
    .fv-detail-in { position: sticky; left: 0; box-sizing: border-box; padding: var(--space-3) var(--space-4); border-left: 3px solid var(--accent); }
    .fv-years { width: 100%; border-collapse: collapse; font-size: var(--text-xs); margin-bottom: var(--space-3); }
    .fv-years th, .fv-years td { padding: 0.3rem 0.5rem; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--border-subtle); }
    .fv-years th:first-child, .fv-years td:first-child { text-align: left; }
    .fv-years th { color: var(--text-muted); font-weight: 600; }
    .fv-sum { font-size: var(--text-sm); color: var(--text-secondary); margin-bottom: var(--space-3); line-height: 1.6; }
    .fv-sum b { color: var(--text-primary); font-family: var(--font-mono); font-weight: 600; }
    .fv-chart { position: relative; height: 240px; }
    .up { color: var(--market-positive); }
    .dn { color: var(--danger); }
    .fv-how { margin-top: var(--space-6); }
    .fv-how summary { cursor: pointer; color: var(--text-secondary); font-weight: 600; }
    .fv-how .ui-prose { margin-top: var(--space-3); font-size: var(--text-sm); }
    .fv-scroll { overflow-x: auto; }
    .fv-tip { cursor: help; }
    .fv-cols { display: grid; grid-template-columns: max-content 1fr; gap: var(--space-1) var(--space-3); margin: 0; }
    .fv-cols dt { font-weight: 600; color: var(--text-primary); }
    .fv-cols dd { margin: 0; }
  </style>
</head>
<body>
  <div class="page ui-page ui-page--wide">
    <header class="ui-header">
      <h1 class="ui-title">Wall Street 2</h1>
      <div class="ui-header-actions fv-chips" id="chips"></div>
    </header>

    <div id="daily-moves"></div>

    <div class="fv-wrap"><div class="ui-table-wrap" id="wrap">
      <table class="ui-table ui-table--dense ui-table--sticky-first fv-table">
        <thead><tr id="thgroup"></tr><tr id="thead"></tr></thead>
        <tbody id="tbody"><tr><td class="ui-loading" colspan="13">Loading…</td></tr></tbody>
      </table>
    </div></div>

    <details class="fv-how">
      <summary>How the price is worked out</summary>
      <div class="ui-prose" id="how"></div>
    </details>
  </div>

  <script src="/nav.js"></script>
  <script src="/invest/daily-moves.js"></script>
  <script src="/contract.js"></script>
  <script src="/feed-types.js"></script>
  <script src="/names.js"></script>
  <script>
  // A shadow model: a discounted-cash-flow price per franchise, built on the
  // Front Office Ledger (nbn-api/routers/fair_value.py). Nothing trades on it.
  // Hidden on purpose (not in the nav) while it is watched over a season.
  const API = '/api';
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const yen = (v, unit = 'M') => v == null ? '—' : (v < 0 ? '−' : '') + '¥' + (Math.abs(v) / (unit === 'B' ? 1e9 : 1e6)).toFixed(unit === 'B' ? 2 : 0) + unit;
  const signedYen = v => (v > 0 ? '+' : '') + yen(v);
  const pct = (v, dp = 1) => v == null ? '—' : (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(dp) + '%';
  const arrow = v => v > 0 ? '▲' : v < 0 ? '▼' : '';
  const cls = v => v > 0 ? 'up' : v < 0 ? 'dn' : '';
  const prob = p => p > 0 && p < 0.0005 ? '<0.1%' : (p * 100).toFixed(p >= 0.1 ? 0 : 1) + '%';
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const shortDate = iso => { const [, m, d] = iso.split('-').map(Number); return `${MONTHS[m - 1]} ${d}`; };

  let run = null, history = [], events = {}, sortKey = 'mcap', sortDir = -1, openTeam = null, chart = null;

  const COLS = [
    { key: 'rank',   label: '#',          get: (t, i) => i + 1, sort: false },
    { key: 'team',   label: 'Team',       get: t => t.team },
    { key: 'mcap',   group: 'Franchise', label: 'Mkt cap', tip: "Market cap: price × 30M shares, what the market says the whole franchise is worth", get: t => t.mcap, num: true, fmt: t => yen(t.mcap, 'B') },
    { key: 'fcap',   group: 'Franchise', label: 'Fair cap', tip: "Fair value × 30M shares: what the model says the whole franchise is worth", get: t => t.value, num: true, fmt: t => yen(t.value, 'B') },
    { key: 'price',  group: 'Share', label: 'Price', tip: "What a share would trade at: fair value plus the market's mood: recent news, form, streaks and last season's finals, overdone the way markets overdo them",      get: t => t.mkt, num: true, fmt: t => '¥' + t.mkt.toFixed(2) },
    { key: 'day',    group: 'Share', label: 'Day', tip: "Change in price since the previous day",        get: t => t.day, num: true,
      fmt: t => t.day == null ? '—' : `<span class="${cls(t.day)}">${arrow(t.day)}</span> ${pct(t.day, 2)}` },
    { key: 'fair',   group: 'Share', label: 'Fair value', tip: "What a share is worth: the franchise's projected profit and sale price ÷ 30M shares. Moves only when something happens", get: t => t.price, num: true, fmt: t => '¥' + t.price.toFixed(2) },
    { key: 'prem',   group: 'Share', label: 'vs fair', tip: "Price against fair value: above 0 the market is paying up for it, below 0 it's on sale", get: t => t.prem, num: true, fmt: t => `<span class="${cls(t.prem)}">${pct(t.prem * 100)}</span>` },
    { key: 'ps',     group: 'Ratios', label: 'P/S', tip: "Price to sales: market cap ÷ this season's projected revenue", get: t => t.ps, num: true, fmt: t => t.ps == null ? '—' : t.ps.toFixed(1) + '×' },
    { key: 'pe',     group: 'Ratios', label: 'P/E', tip: "Price to earnings: price ÷ earnings per share (this season's projected profit ÷ 30M shares). Blank for a team losing money", get: t => t.pe, num: true, fmt: t => t.pe == null ? '<span class="muted">n/m</span>' : t.pe.toFixed(0) },
    { key: 'rec',    group: 'This season', label: 'W-L', tip: "This season's record so far",        get: t => t.w - t.l, num: true, fmt: t => `${t.w}-${t.l}` },
    { key: 'projw',  group: 'This season', label: 'Proj W', tip: "Projected wins for the full season, from the playoff odds simulator",     get: t => t.years[0].proj_w, num: true, fmt: t => t.years[0].proj_w.toFixed(1) },
    { key: 'title',  group: 'This season', label: 'Title', tip: "Chance of winning this season's title",      get: t => t.years[0].title, num: true, fmt: t => prob(t.years[0].title) },
  ];

  // A column marked hideEmpty stays off the table while no team has a value for it.
  const shownCols = () => COLS.filter(c => !c.hideEmpty || run.teams.some(t => c.get(t) != null));

  // A column starts a group when its group differs from the one before it.
  const gstart = (cols, k) => cols[k].group && cols[k].group !== (cols[k - 1] || {}).group;

  function renderHead() {
    const cols = shownCols(), runs = [];
    for (const c of cols) {
      const last = runs[runs.length - 1];
      if (last && last.group === c.group) last.n++;
      else runs.push({ group: c.group, n: 1 });
    }
    document.getElementById('thgroup').innerHTML = runs.map(g => g.group
      ? `<th colspan="${g.n}"><span>${esc(g.group)}</span></th>` : `<th colspan="${g.n}" class="blank"></th>`).join('');
    document.getElementById('thead').innerHTML = cols.map((c, k) =>
      `<th class="${c.num ? 'num' : ''} ${sortKey === c.key ? 'sorted' : ''} ${gstart(cols, k) ? 'gstart' : ''}" ${c.sort === false ? '' : `data-sort="${c.key}"`}${c.tip ? ` title="${esc(c.tip)}"` : ''}>${c.tip ? `<span class="fv-tip">${c.label}</span>` : c.label}${sortKey === c.key ? (sortDir < 0 ? ' ↓' : ' ↑') : ''}</th>`).join('');
  }

  function sorted() {
    const col = COLS.find(c => c.key === sortKey);
    return [...run.teams].sort((a, b) => {
      const x = col.get(a), y = col.get(b);
      if (x == null) return 1;
      if (y == null) return -1;
      return (x < y ? -1 : x > y ? 1 : 0) * sortDir;
    });
  }

  function renderBody() {
    const rows = sorted(), cols = shownCols();
    document.getElementById('tbody').innerHTML = rows.map((t, i) => {
      const cells = cols.map((c, k) => {
        if (c.key === 'team') return `<td class="team"><span class="team-in"><img class="logo" src="/logos/sm/logo-${t.team.toLowerCase()}.webp" alt="" onerror="this.style.visibility='hidden'"><a href="/teams/${t.team}/" onclick="event.stopPropagation()"><b>${t.team}</b></a></span></td>`;
        const v = c.fmt ? c.fmt(t) : c.get(t, i);
        return `<td class="${c.num ? 'num mono' : ''} ${gstart(cols, k) ? 'gstart' : ''}">${v}</td>`;
      }).join('');
      const open = openTeam === t.team;
      return `<tr class="row ${open ? 'open' : ''}" data-team="${t.team}">${cells}</tr>` +
        (open ? `<tr class="fv-detail"><td colspan="${cols.length}"><div class="fv-detail-in">${detail(t)}</div></td></tr>` : '');
    }).join('');
    fitDetail();
    if (openTeam) drawChart(openTeam);
  }

  // Hold the open detail to the visible width, and fade the right edge while
  // there are columns off to the side.
  const wrap = document.getElementById('wrap');
  function fitDetail() {
    const d = document.querySelector('.fv-detail-in');
    if (d) d.style.width = wrap.clientWidth + 'px';
    wrap.parentElement.classList.toggle('more', wrap.scrollLeft + wrap.clientWidth < wrap.scrollWidth - 2);
  }
  wrap.addEventListener('scroll', fitDetail, { passive: true });
  window.addEventListener('resize', () => { fitDetail(); if (chart) chart.resize(); });

  function detail(t) {
    const yrs = t.years;
    const head = ['Season', 'Strength', 'Proj W', 'Playoffs', '2nd rd', 'Title', 'Stars', 'Market', 'Buzz',
                  'Gate', 'Playoff gate', 'Merch', 'Revenue', 'Payroll', 'Tax', 'Profit', 'PV in', 'PV out'];
    const body = yrs.map((y, k) => `<tr>
        <td>${y.season}${k === 0 ? ` <span class="muted">(${Math.round(t.season_left * 100)}% left)</span>` : ''}</td>
        <td class="mono">${y.strength ?? '—'}</td>
        <td class="mono">${y.proj_w.toFixed(1)}</td>
        <td class="mono">${prob(y.playoffs)}</td>
        <td class="mono">${prob(y.second_round)}</td>
        <td class="mono">${prob(y.title)}</td>
        <td class="mono">${y.stars}</td>
        <td class="mono">${y.market == null ? '—' : y.market.toFixed(2) + '×'}</td>
        <td class="mono">${y.buzz == null ? '—' : pct(y.buzz * 100, 0)}</td>
        <td class="mono">${yen(y.gate)}</td>
        <td class="mono">${yen(y.playoff_gate)}</td>
        <td class="mono">${yen(y.merch)}</td>
        <td class="mono">${yen(y.revenue)}</td>
        <td class="mono">${yen(y.payroll)}${y.players != null ? ` <span class="muted">(${y.players})</span>` : ''}</td>
        <td class="mono">${yen(y.tax)}</td>
        <td class="mono ${cls(y.profit)}">${signedYen(y.profit)}</td>
        <td class="mono">${yen(y.pv_in)}</td>
        <td class="mono">${yen(y.pv_out)}</td>
      </tr>`).join('');
    const last = yrs[yrs.length - 1].season;
    const ord = n => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ({ 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] || 'th'));
    const y0 = t.years[0];
    const tile = (label, value, c = '') => `<div class="fv-tile"><div class="ui-kicker">${label}</div><div class="ui-statline"><b class="${c}">${value}</b></div></div>`;
    const keyStats = `<div class="fv-tiles">
        ${tile('Price', '¥' + t.mkt.toFixed(2))}
        ${tile('Fair value', '¥' + t.price.toFixed(2))}
        ${tile('vs fair', pct(t.prem * 100), cls(t.prem))}
        ${tile('Mkt cap', yen(t.mcap, 'B'))}
        ${tile('Fair cap', yen(t.value, 'B'))}
        ${tile('Revenue', yen(y0.revenue))}
        ${tile('Profit', signedYen(y0.profit), cls(y0.profit))}
        ${tile('EPS', '¥' + t.eps.toFixed(2))}
        ${tile('P/E', t.pe == null ? 'n/m' : t.pe.toFixed(0))}
        ${tile('P/S', t.ps == null ? '—' : t.ps.toFixed(1) + '×')}
        ${tile('Season range', '¥' + t.lo.toFixed(0) + '–' + t.hi.toFixed(0))}
      </div>`;
    const picks = (t.picks || []).filter(p => p.round === 1);
    const nm = p => esc(p.name ? nbnPlayerName(p.name) : p.slug);
    const faLine = yrs.slice(1).map(y => {
      const signs = (y.fa_signed || []).map(p => `${nm(p)} (${Math.round(p.ovr)} OVR, ${yen(p.salary)}, from ${esc(p.from)})`);
      const leaves = (y.walked || []).filter(p => p.ovr != null && p.ovr > run.league.replacement_ovr)
        .map(p => `${nm(p)}${p.to ? ` to ${esc(p.to)}` : ''}`);
      if (!signs.length && !leaves.length) return '';
      return `${esc(y.season)}: ${signs.length ? `signs ${signs.join(', ')}` : ''}${signs.length && leaves.length ? '; ' : ''}${leaves.length ? `loses ${leaves.join(', ')}` : ''}.`;
    }).filter(Boolean);
    const faHtml = faLine.length ? `<div class="fv-sum">Projected free agency: ${faLine.join(' ')}</div>` : '';
    const pe = t.playoff_edge;
    const edgeLine = pe && pe.staff && pe.staff.length && Math.abs(pe.points) >= 0.05 ? `<div class="fv-sum">Playoff edge <b>${pe.points > 0 ? '+' : '−'}${Math.abs(pe.points).toFixed(1)} a game</b> in playoff series, from its staff's playoff record: ${pe.staff.map(s =>
        `${esc(s.name)} ${s.series ? `(${s.series} series, ${s.edge >= 0 ? '+' : '−'}${Math.abs(s.edge).toFixed(2)})` : '(no playoff series yet)'}`).join(', ')}.</div>` : '';
    const pickLine = picks.length ? `<div class="fv-sum">First-round picks in the next two drafts: ${picks.map(p =>
        `${p.year} ${p.orig === t.team ? 'own' : esc(p.orig)}${p.share < 1 ? ` (theirs ${Math.round(p.share * 100)}% of the time)` : ''}, projected ${ord(p.slot)}, about ${Math.round(p.ovr)} OVR`).join('; ')}.</div>` : '';
    const mp = t.mood_parts;
    const moodLine = mp ? `<div class="fv-sum">Mood <b>${pct((t.mood || 0) * 100)}</b> over fair value: ${MOOD_PARTS.map(([k, label]) => `${label} ${pct(mp[k] * 100)}`).join(', ')}${Math.abs(mp.news + mp.form + mp.streak + mp.glow - (t.mood || 0)) > 1e-4 ? ', capped' : ''}.</div>` : '';
    return keyStats + moodLine + edgeLine + pickLine + faHtml + `<div class="fv-sum">
        Value <b>${yen(t.value, 'B')}</b> = PV of profit <b>${signedYen(t.pv_in - t.pv_out)}</b>
        + PV of a sale after ${last} <b>${yen(t.pv_sale, 'B')}</b>
        (sale price ${yen(t.sale, 'B')}, ${t.expected_titles.toFixed(2)} expected titles in its six-season brand window).
        ${t.book_value ? `The ledger has it at ${yen(t.book_value, 'B')}, so this model rates it ${(t.value / t.book_value).toFixed(2)}× the ledger.` : ''}
        ${(t.injuries || []).length ? `<br>${t.years[0].strength.toFixed(1) === t.strength_injured.toFixed(1) ? "Injuries don't move this season's strength" : `Injuries take this season's strength from ${t.years[0].strength.toFixed(1)} to ${t.strength_injured.toFixed(1)}`}: ${t.injuries.map(i => `${esc(i.name ? nbnPlayerName(i.name) : i.slug)} (${esc((i.status || '').toLowerCase())}, about ${i.games} of ${i.of} games left)`).join(', ')}.` : ''}
      </div>
      <div class="fv-scroll"><table class="fv-years"><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>
      <div class="muted" style="font-size:var(--text-xs);margin-bottom:var(--space-3)">
        Strength is the minutes-weighted OVR of the top eight. Later seasons count only who is under contract, re-signed or signed in free agency, aged a year per season; payroll shows how many players that is.
        Everything is valued as of opening night, so this season counts whole: what has been played at what the ledger booked, the rest projected.
      </div>
      ${history.length >= 2 ? `<div class="fv-chart"><canvas id="fv-canvas" aria-label="${t.team} price and fair value by day"></canvas></div>` : '<div class="muted" style="font-size:var(--text-xs)">The price chart appears once there are two days of history.</div>'}`;
  }

  function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

  function drawChart(team) {
    const el = document.getElementById('fv-canvas');
    if (!el || typeof Chart === 'undefined') return;
    if (chart) chart.destroy();
    const days = history.filter(d => d.teams[team]);
    chart = new Chart(el, {
      type: 'line',
      data: {
        labels: days.map(d => shortDate(d.date)),
        datasets: [
          { label: 'Price', data: days.map(d => d.teams[team].market ?? d.teams[team].price), borderColor: cssVar('--accent'), borderWidth: 2, pointRadius: 0, pointHoverRadius: 4, tension: 0.2 },
          { label: 'Fair value', data: days.map(d => d.teams[team].price), borderColor: cssVar('--text-muted'), borderWidth: 1.5, borderDash: [4, 4], pointRadius: 0, pointHoverRadius: 4, tension: 0.2 },
        ],
      },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { labels: { color: cssVar('--text-secondary'), boxWidth: 14 } },
          tooltip: { callbacks: { label: c => `${c.dataset.label}: ¥${c.parsed.y.toFixed(2)}` } },
        },
        scales: {
          x: { ticks: { color: cssVar('--text-muted'), maxTicksLimit: 8 }, grid: { display: false } },
          y: { ticks: { color: cssVar('--text-muted'), callback: v => '¥' + v }, grid: { color: cssVar('--border-subtle') } },
        },
      },
    });
  }

  // Day-over-day moves from the history, with what drove each: the PV of
  // revenue, of costs, or of the sale, whichever moved most.
  // How each driver reads in a note. `d` is its effect on value, so costs
  // that rose show as the (negative) value they took.
  const MOOD_PARTS = [['news', 'news'], ['form', 'recent form'], ['streak', 'streak'], ['glow', "last season's finals"]];
  const DRIVER = {
    revenue: d => `revenue outlook ${signedYen(d)}`,
    costs: d => d > 0 ? `costs down, value ${signedYen(d)}` : `costs up, value ${signedYen(d)}`,
    sale: d => `resale value ${signedYen(d)}`,
  };

  // A day with no fair-value move: the part of the mood that moved most.
  function quietNote(x, p) {
    const a = x.mood_parts, b = p.mood_parts;
    if (!a || !b) return 'no news';
    const [k, d] = MOOD_PARTS.map(([k]) => [k, a[k] - b[k]]).sort((m, n) => Math.abs(n[1]) - Math.abs(m[1]))[0];
    if (Math.abs(d) < 0.0005) return 'no news';
    if (k === 'news') return 'no news, last news fading';
    if (k === 'glow') return "no news, last season's finals fading";
    return `no news, ${MOOD_PARTS.find(m => m[0] === k)[1]} ${pct(d * 100)}`;
  }
  function dailyFromHistory() {
    const days = [], teams = {};
    for (let i = 1; i < history.length; i++) {
      const a = history[i - 1], b = history[i];
      days.push(b.date);
      for (const [t, x] of Object.entries(b.teams)) {
        const p = a.teams[t];
        if (!p) continue;
        teams[t] ||= {};
        const drivers = [
          ['revenue', x.pv_in - p.pv_in],
          ['costs', -(x.pv_out - p.pv_out)],
          ['sale', x.pv_sale - p.pv_sale],
        ].sort((m, n) => Math.abs(n[1]) - Math.abs(m[1]));
        const [name, d] = drivers[0];
        const dw = x.proj_w - p.proj_w;
        // What happened leads; the money that moved is the note only on a day nothing did.
        const happened = (events[t] || {})[b.date];
        const fvMove = (x.price / p.price - 1) * 100;
        let note = happened ? happened.join(' · ')
          : Math.abs(fvMove) < 0.05 ? quietNote(x, p) : DRIVER[name](d);
        if (!happened && Math.abs(dw) >= 0.1) note += ` · ${dw > 0 ? '+' : ''}${dw.toFixed(1)} projected wins`;
        if (!happened && x.payroll !== p.payroll) note += ` · payroll ${signedYen(x.payroll - p.payroll)}`;
        if (b.backfill) note += ' · rebuilt';
        teams[t][b.date] = { pct: ((x.market ?? x.price) / (p.market ?? p.price) - 1) * 100, note };
      }
    }
    return { days, teams };
  }

  function renderHow() {
    const L = run.league;
    const rebuilt = history.filter(d => d.backfill).map(d => d.date);
    document.getElementById('how').innerHTML = `
      <p>Each franchise is priced as what its owner gets out of it: <b>profit</b> for this season and the next two, plus what the team would <b>sell for</b> at the end of the third. Both are discounted at ${(L.discount_rate * 100).toFixed(0)}% a season, back to opening night. The price is that value divided by ${(L.shares / 1e6).toFixed(0)}M shares.</p>
      <p><b>Revenue</b> uses the Front Office Ledger's own formulas (gate, playoff gate, merch, media, title bonus) on projected inputs: wins and playoff odds from the playoff odds simulator, and stars from the league's top 15 OVRs. This season's projection always gives the current roster at least half the weight, so a trade moves the price even late in the season.</p>
      <p><b>Market</b> is how much a city spends on its team, and it scales ticket prices, merchandise and local TV. It comes from the Front Office Ledger, where winning grows it and losing shrinks it. Later seasons grow it from the simulated finish, so a playoff run is worth more than one season's revenue.</p>
      <p><b>Buzz</b> is a team's form over its last ten games: its margins, adjusted for how good each opponent is. It raises or cuts ticket prices and merchandise on top of the market. The rest of this season starts from today's buzz and settles at what the team's rating would sustain, so a hot streak pays now and a cold one costs now.</p>
      <p><b>Draft picks</b> count once the player is on the roster within the three projected seasons, so only the next two drafts matter. A pick's player is rated from where it is projected to land (a top pick is about 81 OVR, a late first about 70) and changes with age. Where a pick lands, and whose it is, come from a few hundred simulated draft orders (fewest wins first; there is no lottery), each run through the same rules that settle the pick on draft night. So a top-4 protected pick on a playoff team counts as the other team's, and a swap counts by how often each side gets the better pick.</p>
      <p><b>Injuries</b> count against this season's strength. An Out player is missing until his expected return (the middle of 2K's estimate, from the report that set it), a Hurt one plays at his injured OVR, each for the share of the remaining games he misses.</p>
      <p><b>Ageing.</b> Players change with age the way NBN players have from one season to the next since 20-21: about +0.7 OVR a year up to 22, flat through the late 20s, about −0.5 a year in the early 30s and −1 past 34.</p>
      <p><b>Costs</b> are real money: contracts and dead cap, the ledger's tax, arena ops. In later seasons, a team re-signs its own free agents best OVR first while it stays under the second apron, and keeps anyone past it whose market price is at least his hold.</p>
      <p><b>Free agency.</b> Everyone who leaves, across the league, is the free agent pool. Best first, each signs with whoever offers the most: cap room, else the mid-level exception the team's payroll allows. Between equal offers he picks the better team. His price is what this past summer's signings paid for his OVR (an 80 about ¥11M, an 84 about ¥18M, an 88 about ¥30M), up to the max. He will take somewhat less rather than not sign, and he never goes back to the team that let him go. So cap room is worth something, but only when there is someone worth more than the mid-level to spend it on. Spots still empty are filled by a ${L.replacement_ovr} OVR player at ${yen(L.replacement_salary)}.</p>
      <p><b>Playoff edge.</b> Some front offices' teams do better in the playoffs than their regular season says they should, and keep doing it. Everyone on a team's staff (owner, GM or coach) carries a record from every playoff series they were on staff for: won or lost, against what the two teams' point differentials predicted. A short record counts for little; it grows with more series. A team's edge is the average of its current staff's, and it adds to the team in playoff series only, in every projected season. The best edge is about two points a game, which takes an even series to about 60%. Someone who changes teams takes their record along.</p>
      <p>The <b>sale price</b> is most of a franchise's value. ${Math.round((1 - L.sale_profit_weight) * 100)}% of it is the ledger's valuation (league multiple × average revenue over the projected seasons × title brand), and ${Math.round(L.sale_profit_weight * 100)}% prices the team's average projected profit instead, at a fixed multiple set so the average team sells for about the same. Every figure grows with the salary cap from 27-28, so revenue keeps pace with payroll. That share is how payroll reaches the sale: a team deep in the tax sells for less than one with the same crowds under the cap.</p>
      <p>Because every price is valued as of opening night, nothing drifts as the season goes by: a price moves only when something happens. At the start of a new season the valuation date moves a year on and every price steps up with it, so compare across seasons against the NBN 30. A day's move is labelled with what happened to the team; on a day with no news it is the market's mood, or the piece of fair value that moved most: revenue, costs or sale. A day is the day its games were played: a box score posted the next morning moves its own day, not the next.</p>
      ${rebuilt.length ? `<p>The model started on 2026-10-24. Earlier days (${esc(rebuilt[0])} to ${esc(rebuilt[rebuilt.length - 1])}) were rebuilt afterwards from each day's games, with today's rosters and contracts. Nothing bigger than a depth signing changed in that window.</p>` : ''}
      <p><b>Price and fair value.</b> Fair value is what the franchise is worth, and it only moves when something happens. The price is what a share would trade at: fair value plus the market's mood, which is the market chasing what is recent. Every part of it comes from real results, nothing is random: <b>news</b> (a move in fair value, from a trade, an injury or a game, is overdone by 60% and given back over a few weeks), <b>form</b> (1% for each win in the last ten games above what the model expected going into them, up to 6%), a <b>streak</b> of four or more games (0.75% a game past three, up to 3%), and last season's finalists' <b>glow</b> (5% for the champion, 2% for the runner-up, gone by game 41). The whole mood is capped at 10% either way. So a day with no game and no news barely moves a price. Nothing here can be traded.</p>
      <p>The <b>NBN 30</b> is the average price of all 30 franchises, the league's index. Market cap, P/S and P/E read the way they do for a real stock.</p>
      <p><b>The columns</b></p>
      <dl class="fv-cols">${COLS.filter(c => c.tip).map(c => `<dt>${esc(c.label)}</dt><dd>${esc(c.tip)}</dd>`).join('')}</dl>
      <p class="muted">Model ${esc(run.model)}, computed ${esc(new Date(run.computed_at).toLocaleString())}.</p>`;
  }

  // Stock figures, from the run and the history: the NBN 30 (the equal-weighted
  // average price), P/S, P/E and each team's season range.
  let index = null;
  function stockStats() {
    const shares = run.league.shares;
    const px = x => x.market ?? x.price;
    const days = history.filter(d => d.date < run.date).concat([{ date: run.date, teams: Object.fromEntries(run.teams.map(t => [t.team, { market: t.mkt }])) }]);
    const mean = d => { const v = Object.values(d.teams).map(px); return v.reduce((a, b) => a + b, 0) / v.length; };
    const level = days.map(mean);
    index = { level: level[level.length - 1], day: level.length > 1 ? (level[level.length - 1] / level[level.length - 2] - 1) * 100 : null };
    for (const t of run.teams) {
      const y = t.years[0];
      t.ps = y.revenue ? t.mcap / y.revenue : null;
      t.eps = y.profit / shares;
      t.pe = t.eps > 0 ? t.mkt / t.eps : null;
      const prices = days.map(d => d.teams[t.team] ? px(d.teams[t.team]) : null).filter(v => v != null);
      t.hi = Math.max(...prices); t.lo = Math.min(...prices);
    }
  }

  function renderChips() {
    document.getElementById('chips').innerHTML = `
      <span class="ui-chip ui-chip--warning">Shadow model · not tradable</span>
      <span class="ui-chip">As of ${esc(shortDate(run.date))}</span>
      ${index ? `<span class="ui-chip" title="The NBN 30: the average price of all 30 franchises">NBN 30 ¥${index.level.toFixed(2)}${index.day == null ? '' : ` <span class="${cls(index.day)}">${arrow(index.day)} ${pct(index.day, 2)}</span>`}</span>` : ''}
      <a class="ui-chip" href="/invest/">Wall Street</a>`;
  }

  document.getElementById('thead').addEventListener('click', e => {
    const th = e.target.closest('[data-sort]');
    if (!th) return;
    const k = th.dataset.sort;
    sortDir = sortKey === k ? -sortDir : (k === 'team' ? 1 : -1);
    sortKey = k;
    renderHead();
    renderBody();
  });
  document.getElementById('tbody').addEventListener('click', e => {
    const tr = e.target.closest('tr.row');
    if (!tr) return;
    openTeam = openTeam === tr.dataset.team ? null : tr.dataset.team;
    renderBody();
  });

  // What happened to each team each day, in words: its game, injury report
  // changes, and ledger moves. { ATL: { '2026-10-24': ['W by 8 v BOS', ...] } }
  async function loadEvents(season, since) {
    const get = u => fetch(u).then(x => x.ok ? x.json() : null).catch(() => null);
    const [games, injuries, ledger] = await Promise.all([
      get(`${API}/boxscores/games?season=${encodeURIComponent(season)}`),
      get(`${API}/injuries/history?since=${encodeURIComponent(since)}`),
      get(`${API}/transactions?limit=300`),
    ]);
    const out = {};
    const add = (team, day, text) => {
      if (!team || !day || day < since || !text) return;
      ((out[team] ||= {})[day] ||= []).push(text);
    };
    for (const g of (games || [])) {
      if (g.gametype && g.gametype !== 'REG') continue;
      const diff = g.home_score - g.away_score;
      const res = n => n > 0 ? `W by ${n}` : `L by ${-n}`;
      add(g.home_team, g.date, `${res(diff)} v ${g.away_team}`);
      add(g.away_team, g.date, `${res(-diff)} @ ${g.home_team}`);
    }
    for (const e of [...(injuries || [])].reverse()) {
      const name = e.name || e.slug;
      if (e.kind === 'healed') add(e.team, e.date, `${name} back`);
      else if (e.after) add(e.team, e.date, `${name} ${/^out$/i.test(e.after.status || '') ? 'out' : 'hurt'}${e.after.duration ? ' ' + e.after.duration.toLowerCase() : ''}`);
    }
    const txns = ((ledger || {}).transactions || []).filter(t => !t.voided && (t.date || '') >= since);
    if (txns.length && window.FeedTypes) {
      const slugs = new Set();
      txns.forEach(t => {
        const d = t.details || {};
        if (d.player) slugs.add(d.player);
        (d.transfers || []).forEach(tr => (tr.assets || []).forEach(a => a.slug && slugs.add(a.slug)));
      });
      const bios = slugs.size ? (await get(`${API}/players?slugs=${encodeURIComponent([...slugs].join(','))}`)) || {} : {};
      const ctx = {
        esc: s => String(s ?? ''),
        name: slug => (bios[slug] || {}).name ? nbnPlayerName(bios[slug].name) : slug,
        team: abbr => abbr,
      };
      const text = html => { const el = document.createElement('div'); el.innerHTML = html; return el.textContent.trim(); };
      for (const t of [...txns].reverse()) {
        const h = FeedTypes.headline(t, ctx);
        if (!h) continue;
        const d = t.details || {};
        const teams = new Set([d.team, ...(Array.isArray(d.teams) ? d.teams : [])].filter(Boolean));
        teams.forEach(team => add(team, t.date, text(h.html)));
      }
    }
    return out;
  }

  async function init() {
    try {
      const [r, h] = await Promise.all([
        fetch(`${API}/fair-value`).then(x => x.ok ? x.json() : null),
        fetch(`${API}/fair-value/history`).then(x => x.ok ? x.json() : { days: [] }),
      ]);
      if (!r) {
        document.getElementById('tbody').innerHTML = `<tr><td class="ui-empty" colspan="13">No fair value has been computed yet. It runs hourly with the playoff odds.</td></tr>`;
        return;
      }
      run = r;
      history = h.days || [];
      for (const t of run.teams) {
        t.mkt = t.market ?? t.price;
        t.prem = t.mkt / t.price - 1;
        t.mcap = t.mkt * run.league.shares;
        const prev = (r.prev_market || {})[t.team] ?? r.prev[t.team];
        t.day = prev ? (t.mkt / prev - 1) * 100 : null;
      }
      stockStats();
      renderChips();
      renderHead();
      renderBody();
      renderHow();
      if (history.length) events = await loadEvents(run.season, history[0].date);
      const d = dailyFromHistory();
      DailyMoves.mount(document.getElementById('daily-moves'), { title: `Daily moves · ${run.season}`, ...d });
    } catch (e) {
      document.getElementById('tbody').innerHTML = `<tr><td class="ui-empty" colspan="13">Couldn't load the fair value.</td></tr>`;
    }
  }
  init();
  </script>
</body>

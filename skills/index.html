<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/logo.png">
  <link rel="stylesheet" href="/css/shared.css">
  <title>Skills — NBN</title>
  <!-- NBN:og -->
  <meta name="description" content="The Claude Code commands defined for this project.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NBN">
  <meta property="og:title" content="Skills — NBN">
  <meta property="og:description" content="The Claude Code commands defined for this project.">
  <meta property="og:url" content="https://nbn.today/skills/">
  <meta property="og:image" content="https://nbn.today/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Nothing But Net — fantasy basketball GM simulation league">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0d0e11">
  <!-- /NBN:og -->
  <script src="/vendor/marked-12.0.2.min.js"></script>
  <script src="/vendor/purify-3.2.6.min.js"></script>
  <script src="/markdown.js"></script>
  <style>
    
            
    #index {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    #index a {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--link);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      padding: 0.3rem 0.65rem;
      text-decoration: none;
    }
    #index a:hover { background: var(--bg-hover); }

    #loading {
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 2rem 0;
      text-align: center;
    }

    .skill {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 1rem;
      scroll-margin-top: 1rem;
    }
    .skill summary {
      align-items: baseline;
      cursor: pointer;
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      list-style: none;
      padding: 1rem 1.25rem;
      user-select: none;
    }
    .skill summary::-webkit-details-marker { display: none; }
    .skill summary::before {
      color: var(--text-muted);
      content: '\25B8';
      display: inline-block;
      transition: transform 0.15s;
    }
    .skill[open] summary::before { transform: rotate(90deg); }
    .skill-name {
      color: var(--text-bright);
      font-family: var(--font-mono);
      font-size: 0.95rem;
      font-weight: 700;
    }
    .skill-desc {
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    .skill-body {
      border-top: 1px solid var(--border);
      padding: 1.25rem 1.5rem 1.5rem;
    }

    /* markdown prose */
                                                          </style>
</head>
<body>
<script src="/nav.js"></script>

<div class="page ui-page">
  <nav class="nav"></nav>

  <header class="ui-header">
      <div>
        <h1 class="ui-title">Skills</h1>
        <p class="ui-subtitle">The Claude Code commands defined for this project, straight from <code>.claude/commands/</code> — this page
      just reads them, nothing here is copied or hand-maintained.</p>
      </div>
    </header>

  <div id="index"></div>
  <div id="loading">Loading…</div>
  <div id="skills" style="display:none"></div>
</div>

<script>
  function slugFromFilename(name) {
    return name.replace(/\.md$/, '');
  }

  async function loadSkills() {
    const indexEl = document.getElementById('index');
    const skillsEl = document.getElementById('skills');
    const loadingEl = document.getElementById('loading');

    let files;
    try {
      files = await (await fetch('/skills/manifest.json')).json();
    } catch {
      loadingEl.textContent = 'Failed to load skills/manifest.json.';
      return;
    }

    const skills = await Promise.all(files.map(async name => {
      const slug = slugFromFilename(name);
      try {
        const text = await (await fetch('/.claude/commands/' + name)).text();
        const firstLine = text.split('\n', 1)[0].trim();
        return { slug, name, text, desc: firstLine };
      } catch {
        return { slug, name, text: '*Failed to load.*', desc: '' };
      }
    }));

    indexEl.innerHTML = skills.map(s => `<a href="#${s.slug}">/${s.slug}</a>`).join('');

    skillsEl.innerHTML = skills.map(s => `
      <details class="skill" id="${s.slug}" open>
        <summary>
          <span class="skill-name">/${s.slug}</span>
          <span class="skill-desc">${s.desc.replace(/</g, '&lt;')}</span>
        </summary>
        <div class="skill-body ui-prose">${renderMarkdown(s.text)}</div>
      </details>
    `).join('');

    loadingEl.style.display = 'none';
    skillsEl.style.display = '';
  }

  loadSkills();
</script>
<script src="/token-badge.js"></script>
</body>
</html>

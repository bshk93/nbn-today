<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/logo.png">
  <link rel="stylesheet" href="/css/shared.css">
  <title>Skills — NBN</title>
  <!-- NBN:og -->
  <meta name="description" content="The Claude Code commands defined for this project.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NBN">
  <meta property="og:title" content="Skills — NBN">
  <meta property="og:description" content="The Claude Code commands defined for this project.">
  <meta property="og:url" content="https://nbn.today/skills/">
  <meta property="og:image" content="https://nbn.today/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Nothing But Net — fantasy basketball GM simulation league">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#111827">
  <!-- /NBN:og -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    .page { max-width: 820px; margin: 0 auto; }

    header { margin-bottom: 1.5rem; }
    header h1 { font-size: 1.875rem; font-weight: 700; letter-spacing: -0.02em; }
    header p { color: var(--text-muted); margin-top: 0.4rem; font-size: 0.9rem; }

    #index {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    #index a {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--link);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      padding: 0.3rem 0.65rem;
      text-decoration: none;
    }
    #index a:hover { background: var(--bg-hover); }

    #loading {
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 2rem 0;
      text-align: center;
    }

    .skill {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 1rem;
      scroll-margin-top: 1rem;
    }
    .skill summary {
      align-items: baseline;
      cursor: pointer;
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      list-style: none;
      padding: 1rem 1.25rem;
      user-select: none;
    }
    .skill summary::-webkit-details-marker { display: none; }
    .skill summary::before {
      color: var(--text-muted);
      content: '\25B8';
      display: inline-block;
      transition: transform 0.15s;
    }
    .skill[open] summary::before { transform: rotate(90deg); }
    .skill-name {
      color: var(--text-bright);
      font-family: var(--font-mono);
      font-size: 0.95rem;
      font-weight: 700;
    }
    .skill-desc {
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    .skill-body {
      border-top: 1px solid var(--border);
      padding: 1.25rem 1.5rem 1.5rem;
    }

    /* markdown prose */
    .skill-body h1, .skill-body h2 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-bright);
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.35rem;
      margin: 1.5rem 0 0.75rem;
    }
    .skill-body h1:first-child, .skill-body h2:first-child { margin-top: 0; }
    .skill-body h3 {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin: 1.1rem 0 0.5rem;
    }
    .skill-body p {
      color: var(--text-secondary);
      font-size: 0.875rem;
      line-height: 1.65;
      margin-bottom: 0.7rem;
    }
    .skill-body ul, .skill-body ol {
      color: var(--text-secondary);
      font-size: 0.875rem;
      line-height: 1.65;
      margin: 0.4rem 0 0.7rem 1.4rem;
    }
    .skill-body li { margin-bottom: 0.25rem; }
    .skill-body code {
      background: var(--bg-page);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 0.8em;
      padding: 0.1em 0.35em;
    }
    .skill-body pre {
      background: var(--bg-page);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow-x: auto;
      padding: 0.9rem 1.1rem;
      margin: 0.6rem 0 0.9rem;
    }
    .skill-body pre code {
      background: none;
      border: none;
      font-size: 0.8rem;
      padding: 0;
    }
    .skill-body table {
      border-collapse: collapse;
      font-size: 0.82rem;
      margin: 0.6rem 0 0.9rem;
      width: 100%;
      display: block;
      overflow-x: auto;
    }
    .skill-body th {
      background: var(--bg-page);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.4rem 0.65rem;
      text-align: left;
      text-transform: uppercase;
    }
    .skill-body td {
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 0.35rem 0.65rem;
      vertical-align: top;
    }
    .skill-body strong { color: var(--text-bright); font-weight: 600; }
    .skill-body blockquote {
      border-left: 3px solid var(--border);
      color: var(--text-muted);
      font-style: italic;
      margin: 0.6rem 0;
      padding-left: 1rem;
    }
  </style>
</head>
<body>
<script src="/nav.js"></script>

<div class="page">
  <nav class="nav"></nav>

  <header>
    <h1>Skills</h1>
    <p>The Claude Code commands defined for this project, straight from <code>.claude/commands/</code> — this page
      just reads them, nothing here is copied or hand-maintained.</p>
  </header>

  <div id="index"></div>
  <div id="loading">Loading…</div>
  <div id="skills" style="display:none"></div>
</div>

<script>
  function slugFromFilename(name) {
    return name.replace(/\.md$/, '');
  }

  async function loadSkills() {
    const indexEl = document.getElementById('index');
    const skillsEl = document.getElementById('skills');
    const loadingEl = document.getElementById('loading');

    let files;
    try {
      files = await (await fetch('/skills/manifest.json')).json();
    } catch {
      loadingEl.textContent = 'Failed to load skills/manifest.json.';
      return;
    }

    const skills = await Promise.all(files.map(async name => {
      const slug = slugFromFilename(name);
      try {
        const text = await (await fetch('/.claude/commands/' + name)).text();
        const firstLine = text.split('\n', 1)[0].trim();
        return { slug, name, text, desc: firstLine };
      } catch {
        return { slug, name, text: '*Failed to load.*', desc: '' };
      }
    }));

    indexEl.innerHTML = skills.map(s => `<a href="#${s.slug}">/${s.slug}</a>`).join('');

    skillsEl.innerHTML = skills.map(s => `
      <details class="skill" id="${s.slug}" open>
        <summary>
          <span class="skill-name">/${s.slug}</span>
          <span class="skill-desc">${s.desc.replace(/</g, '&lt;')}</span>
        </summary>
        <div class="skill-body">${marked.parse(s.text)}</div>
      </details>
    `).join('');

    loadingEl.style.display = 'none';
    skillsEl.style.display = '';
  }

  loadSkills();
</script>
<script src="/token-badge.js"></script>
</body>
</html>

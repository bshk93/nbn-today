<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="/theme-boot.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/shared.css">
  <title>Inbox - NBN</title>
  <!-- NBN:og -->
  <meta name="description" content="Your NBN notifications.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NBN">
  <meta property="og:title" content="Inbox - NBN">
  <meta property="og:description" content="Your NBN notifications.">
  <meta property="og:url" content="https://nbn.today/inbox/">
  <meta property="og:image" content="https://nbn.today/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Nothing But Net — fantasy basketball GM simulation league">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0d0e11">
  <link rel="icon" href="/icons/favicon.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <!-- /NBN:og -->
  <style>
    
            
            
    button {
      font-family: inherit; cursor: pointer; border-radius: 6px;
      font-size: 0.8rem; font-weight: 500; padding: 0.35rem 0.8rem;
      border: 1px solid transparent; transition: background 0.1s;
    }
                
    .empty { text-align: center; padding: 3rem 1rem; color: var(--text-dim); font-size: 0.9rem; }

    .item-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .item {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
      padding: 0.85rem 1.1rem; display: flex; align-items: flex-start; gap: 0.75rem;
    }
    .item.unread { border-color: var(--accent-dark); }
    .item-dot {
      width: 8px; height: 8px; border-radius: 50%; margin-top: 0.4rem; flex-shrink: 0;
      background: var(--accent); visibility: hidden;
    }
    .item.unread .item-dot { visibility: visible; }
    .item-body { flex: 1; min-width: 0; }
    .item-text { font-size: 0.88rem; color: var(--text-secondary); }
    .item.unread .item-text { color: var(--text-primary); }
    .item-meta { font-size: 0.72rem; color: var(--text-dim); margin-top: 0.3rem; display: flex; align-items: center; gap: 0.5rem; }
    .item-meta a { color: var(--link); text-decoration: none; }
    .item-meta a:hover { text-decoration: underline; }
    .item-actions { flex-shrink: 0; }
    .item-actions button { background: none; border: none; padding: 0; font-size: 0.72rem; color: var(--text-dim); font-family: inherit; text-decoration: underline; }
    .item-actions button:hover { color: var(--text-secondary); }

    /* Buttons a message carries (`actions` on the item — nbn-api inbox.py).
       Each runs server-side and then reads as done, on every copy. */
    .msg-actions { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.55rem; }
    .msg-action {
      background: var(--bg-page); border: 1px solid var(--border); color: var(--text-primary);
      font-size: 0.75rem; padding: 0.3rem 0.65rem;
    }
    /* A group (one player's Remove / Still available) is one row: the name
       once, then its buttons at one fixed width so they line up row to row. */
    .msg-groups { display: flex; flex-direction: column; gap: 0.4rem; margin-top: 0.55rem; }
    .msg-group { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 0.75rem; }
    .msg-group-name { flex: 1 1 9rem; font-size: 0.82rem; color: var(--text-primary); font-weight: 600; }
    .msg-group-btns { display: flex; gap: 0.4rem; }
    .msg-group-btns .msg-action { width: 8.5rem; text-align: center; }
    .msg-action:hover:not(:disabled) { border-color: var(--accent); }
    .msg-action-primary { background: var(--accent); border-color: var(--accent); color: var(--text-on-accent); }
    .msg-action-primary:hover:not(:disabled) { filter: brightness(1.1); }
    .msg-action:disabled { cursor: default; opacity: 0.6; }
    .msg-action-done {
      font-size: 0.75rem; padding: 0.3rem 0.65rem; border-radius: 6px;
      color: var(--text-secondary); border: 1px dashed var(--border);
    }
    .msg-action-error { font-size: 0.72rem; color: var(--danger); align-self: center; }

    .signin-hint { color: var(--text-dim); font-size: 0.9rem; }

    /* Modal (token sign-in) */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      z-index: 100; align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
      padding: 1.5rem; width: 100%; max-width: 420px; margin: 1rem;
    }
    .modal h2 { font-size: 1rem; font-weight: 700; margin-bottom: 0.75rem; }
    .modal input {
      width: 100%; background: var(--bg-page); border: 1px solid var(--border); color: var(--text-primary);
      border-radius: 6px; padding: 0.5rem 0.75rem; font-size: 0.875rem;
      margin-bottom: 0.75rem; font-family: var(--font-mono);
    }
    .modal input:focus { outline: none; border-color: var(--accent); }
    .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; }
    .modal p.note { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.75rem; }
  </style>
</head>
<body>
<div class="page ui-page">
  <nav class="nav"></nav>

  <header class="ui-header">
    <div>
      <h1 class="ui-title">Inbox</h1>
    </div>
    <div class="right-bar ui-header-actions">
      <button class="btn-ghost" id="btn-mark-all" style="display:none;" onclick="markAllRead()">Mark all read</button>
    </div>
  </header>

  <div id="content">
    <div class="empty">Loading…</div>
  </div>
</div>

<!-- Auth modal -->
<div class="modal-overlay" id="modal-overlay" onclick="closeAuthModal(event)">
  <div class="modal">
    <h2>Sign in with your member token</h2>
    <p class="note">A member token is required to view your inbox. It's stored locally in your browser.</p>
    <input type="password" id="token-input" placeholder="Paste your token" autocomplete="off">
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeAuthModal()">Cancel</button>
      <button class="btn-primary" onclick="doSignIn()">Sign in</button>
    </div>
  </div>
</div>

<script>
const API = '/api';
let me = null;
let items = [];

function fmtDateTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function authHeaders() {
  const token = localStorage.getItem('nbn_token');
  return token ? { Authorization: `Bearer ${token}` } : {};
}

async function loadInbox() {
  const content = document.getElementById('content');
  if (!me) {
    content.innerHTML = '<div class="empty signin-hint">Sign in to see your inbox.</div>';
    return;
  }
  try {
    const res = await fetch(`${API}/inbox`, { headers: authHeaders() });
    if (!res.ok) throw new Error();
    const data = await res.json();
    items = data.items || [];
  } catch {
    content.innerHTML = '<div class="empty">Could not load your inbox.</div>';
    return;
  }
  document.getElementById('btn-mark-all').style.display = items.some(i => !i.read) ? '' : 'none';
  renderItems();
}

function renderItems() {
  const content = document.getElementById('content');
  if (!items.length) {
    content.innerHTML = '<div class="empty">Nothing here yet.</div>';
    return;
  }
  const list = document.createElement('div');
  list.className = 'item-list';
  items.forEach(it => list.appendChild(renderItem(it)));
  content.innerHTML = '';
  content.appendChild(list);
}

function renderItem(it) {
  const el = document.createElement('div');
  el.className = 'item' + (it.read ? '' : ' unread');

  const dot = document.createElement('div');
  dot.className = 'item-dot';
  el.appendChild(dot);

  const body = document.createElement('div');
  body.className = 'item-body';
  const text = document.createElement('div');
  text.className = 'item-text';
  text.textContent = it.text;
  body.appendChild(text);

  const meta = document.createElement('div');
  meta.className = 'item-meta';
  meta.innerHTML = `<span>${fmtDateTime(it.ts)}</span>`
    + (it.link ? `<span>&middot;</span><a href="${escHtml(it.link)}">Open &rarr;</a>` : '');
  body.appendChild(meta);
  if (it.actions && it.actions.length) body.appendChild(renderMsgActions(it));
  el.appendChild(body);

  if (!it.read) {
    const actions = document.createElement('div');
    actions.className = 'item-actions';
    const btn = document.createElement('button');
    btn.textContent = 'Mark read';
    btn.addEventListener('click', () => markRead(it.id));
    actions.appendChild(btn);
    el.appendChild(actions);
  }

  return el;
}

function renderMsgActions(it) {
  // Ungrouped actions sit in one wrapping line. Actions sharing a `group` are
  // alternatives (Remove / Still available for one player) and get a row of
  // their own; once one is done, its chip stands for the whole row.
  const groups = [];
  const loose = [];
  it.actions.forEach((a, i) => {
    if (!a.group) { loose.push(i); return; }
    let g = groups.find(x => x.name === a.group);
    if (!g) groups.push(g = { name: a.group, idx: [] });
    g.idx.push(i);
  });

  const outer = document.createElement('div');
  if (groups.length) {
    const list = document.createElement('div');
    list.className = 'msg-groups';
    groups.forEach(g => {
      const row = document.createElement('div');
      row.className = 'msg-group';
      const done = g.idx.find(i => it.actions[i].done_at);
      if (done !== undefined) {
        row.appendChild(doneChip(it.actions[done]));
      } else {
        const name = document.createElement('span');
        name.className = 'msg-group-name';
        name.textContent = g.name;
        const btns = document.createElement('div');
        btns.className = 'msg-group-btns';
        g.idx.forEach(i => btns.appendChild(actionButton(it, i, row, it.actions[i].short || it.actions[i].label)));
        row.appendChild(name);
        row.appendChild(btns);
      }
      list.appendChild(row);
    });
    outer.appendChild(list);
  }
  if (loose.length) {
    const wrap = document.createElement('div');
    wrap.className = 'msg-actions';
    loose.forEach(i => wrap.appendChild(
      it.actions[i].done_at ? doneChip(it.actions[i]) : actionButton(it, i, wrap, it.actions[i].label)));
    outer.appendChild(wrap);
  }
  return outer;
}

function doneChip(a) {
  const done = document.createElement('span');
  done.className = 'msg-action-done';
  done.textContent = '\u2713 ' + (a.done_label || a.label)
    + (me && a.done_by && a.done_by !== me.name ? ` (${a.done_by})` : '');
  return done;
}

function actionButton(it, i, wrap, text) {
  const a = it.actions[i];
  const btn = document.createElement('button');
  btn.className = 'msg-action' + (a.kind === 'tradeblock_remove' ? ' msg-action-primary' : '');
  btn.textContent = text;
  btn.addEventListener('click', () => runMsgAction(it, i, btn, wrap));
  return btn;
}

async function runMsgAction(it, i, btn, wrap) {
  btn.disabled = true;
  wrap.querySelectorAll('.msg-action-error').forEach(e => e.remove());
  let data;
  try {
    const res = await fetch(`${API}/inbox/${it.id}/actions/${i}`, { method: 'POST', headers: authHeaders() });
    data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || 'That didn\u2019t work');
  } catch (e) {
    btn.disabled = false;
    const err = document.createElement('span');
    err.className = 'msg-action-error';
    err.textContent = e.message || 'That didn\u2019t work';
    wrap.appendChild(err);
    return;
  }
  it.actions[i] = data.action;
  it.read = true;
  document.getElementById('btn-mark-all').style.display = items.some(x => !x.read) ? '' : 'none';
  renderItems();
}

async function markRead(id) {
  try {
    await fetch(`${API}/inbox/${id}/read`, { method: 'POST', headers: authHeaders() });
  } catch { return; }
  const it = items.find(i => i.id === id);
  if (it) it.read = true;
  document.getElementById('btn-mark-all').style.display = items.some(i => !i.read) ? '' : 'none';
  renderItems();
}

async function markAllRead() {
  try {
    await fetch(`${API}/inbox/read-all`, { method: 'POST', headers: authHeaders() });
  } catch { return; }
  items.forEach(i => i.read = true);
  document.getElementById('btn-mark-all').style.display = 'none';
  renderItems();
}

// ── Auth ──────────────────────────────────────────────────────────────────────

async function initAuth() {
  const token = localStorage.getItem('nbn_token');
  if (!token) { updateAuthUI(null); return; }
  try {
    const res = await fetch(`${API}/me`, { headers: { Authorization: `Bearer ${token}` } });
    if (res.ok) {
      me = await res.json();
      updateAuthUI(me);
    } else {
      if (res.status === 401) localStorage.removeItem('nbn_token');
      updateAuthUI(null);
    }
  } catch {
    me = { name: '…', roles: [] };
    updateAuthUI(me);
  }
}

function updateAuthUI(info) {
  // The page's own sign-in bar was removed in favour of the header's Sign in
  // button and profile menu (nav.js), so these may not exist; {} absorbs the
  // writes below without touching the rest of this function.
  const label = document.getElementById('auth-label') || {};
  const name = document.getElementById('auth-name') || {};
  const btn = document.getElementById('btn-auth') || {};
  if (info) {
    label.textContent = 'Signed in as';
    name.textContent = info.name;
    btn.textContent = 'Sign out';
    btn.onclick = doSignOut;
  } else {
    label.textContent = 'Not signed in';
    name.textContent = '';
    btn.textContent = 'Sign in';
    btn.onclick = openAuthModal;
    document.getElementById('btn-mark-all').style.display = 'none';
  }
}

function openAuthModal() {
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('token-input').focus(), 50);
}

function closeAuthModal(e) {
  if (e && e.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.remove('open');
  document.getElementById('token-input').value = '';
}

async function doSignIn() {
  const token = document.getElementById('token-input').value.trim();
  if (!token) return;
  try {
    const res = await fetch(`${API}/me`, { headers: { Authorization: `Bearer ${token}` } });
    if (!res.ok) { toast('That token was not accepted.', true); return; }
    me = await res.json();
    localStorage.setItem('nbn_token', token);
    document.getElementById('modal-overlay').classList.remove('open');
    document.getElementById('token-input').value = '';
    updateAuthUI(me);
    loadInbox();
  } catch { toast('Could not sign in. Check your connection.', true); }
}

function doSignOut() {
  localStorage.removeItem('nbn_token');
  me = null;
  updateAuthUI(null);
  loadInbox();
}

document.getElementById('token-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSignIn();
  if (e.key === 'Escape') closeAuthModal();
});

(async () => {
  await initAuth();
  await loadInbox();
})();
</script>
<script src="/nav.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="preload" href="/css/nav-chrome.css" as="style" data-nbn-preload>

  <link rel="preload" href="/css/components.css" as="style" data-nbn-preload>
  <link rel="preload" href="/css/sidebar.css" as="style" data-nbn-preload>
  <link rel="preload" href="/css/team-colors.css" as="style" data-nbn-preload>
  <link rel="preload" href="/css/ui-icons.css" as="style" data-nbn-preload>
  <link rel="preload" href="/fonts/InterVariable.subset.woff2" as="font" type="font/woff2" crossorigin data-nbn-preload>
  <link rel="preload" href="/fonts/BarlowCondensed-700-latin.woff2" as="font" type="font/woff2" crossorigin data-nbn-preload>
  <link rel="preload" href="/fonts/BarlowCondensed-600-latin.woff2" as="font" type="font/woff2" crossorigin data-nbn-preload>
  <!-- /NBN:preload -->
  <script src="/theme-boot.js"></script>
  <script src="/nbn-data.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/shared.css">
  <title>NBN | Power Rankings Ballot</title>
  <!-- NBN:og -->
  <meta name="description" content="Rank all 30 teams and write the blurbs for an NBN power-rankings edition.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NBN">
  <meta property="og:title" content="NBN | Power Rankings Ballot">
  <meta property="og:description" content="Rank all 30 teams and write the blurbs for an NBN power-rankings edition.">
  <meta property="og:url" content="https://nbn.today/news/rankings/">
  <meta property="og:image" content="https://nbn.today/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Nothing But Net — fantasy basketball GM simulation league">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0d0e11">
  <link rel="icon" href="/icons/favicon.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <!-- /NBN:og -->
  <style>
    .page { max-width: 980px; margin: 0 auto; }


        .sub { font-size: var(--text-sm); color: var(--text-muted); display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .sub .sep { color: var(--border); }
    .sub a { color: var(--link); text-decoration: none; font-weight: 500; }
    .sub a:hover { text-decoration: underline; }

    button { font-family: inherit; cursor: pointer; border-radius: var(--radius-sm); font-size: var(--text-sm); font-weight: 500; padding: 0.35rem 0.85rem; border: 1px solid transparent; }
    button:disabled { opacity: 0.5; cursor: default; }
                        .btn-tiny { font-size: var(--text-xs); padding: 0.18rem 0.5rem; }

    .panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.15rem; margin-bottom: 1.1rem; }
    .panel-title { font-size: var(--text-md); font-weight: 600; color: var(--text-primary); margin-bottom: 0.75rem; }
    .panel-note { font-size: var(--text-xs); color: var(--text-muted); line-height: 1.5; }
    .row-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin-top: 0.8rem; }

    /* Voter chips */
    .chips { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }
    .chip { display: inline-flex; align-items: center; gap: 0.35rem; font-size: var(--text-xs); background: var(--bg-page); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.2rem 0.55rem; color: var(--text-secondary); }
    .chip.done { border-color: color-mix(in srgb, var(--success) 40%, transparent); color: var(--success); }
    .chip.started { border-color: var(--text-dim); color: var(--text-secondary); }
    .part { color: var(--text-dim); }
    .chip button { background: none; border: none; color: var(--text-dim); cursor: pointer; padding: 0; font-size: var(--text-base); line-height: 1; }
    .chip button:hover { color: var(--danger); }
    .voter-input { background: var(--bg-page); border: 1px solid var(--border); color: var(--text-primary); border-radius: var(--radius-sm); padding: 0.3rem 0.55rem; font-size: var(--text-sm); font-family: inherit; min-width: 190px; }

    /* Ballot */
    .ballot-tools, .my-claims { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; margin-top: 0.75rem; }
    .tools-label { font-size: var(--text-xs); letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); margin-right: 0.2rem; }
    .tools-sep { flex: 1; }
    .ballot-list { display: flex; flex-direction: column; gap: 0.3rem; }
    .brow { display: grid; grid-template-columns: 1.1rem 2.2rem minmax(0, 1fr) auto auto;
            grid-template-areas: "grip rank team stats btns";
            align-items: center; gap: 0.55rem; background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 0.4rem 0.6rem 0.4rem 0.35rem; user-select: none; }
    .brow.open { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
    .brow.dragging { position: relative; z-index: 6; border-color: var(--accent); box-shadow: var(--shadow-overlay); opacity: 0.95; }
    body.is-dragging, body.is-dragging * { cursor: grabbing !important; }
    .brow.moved { animation: brow-flash 1.2s ease-out; }
    @keyframes brow-flash { from { background: color-mix(in srgb, var(--accent) 22%, var(--bg-card)); } to { background: var(--bg-card); } }
    .brow-grip { grid-area: grip; color: var(--text-dim); font-size: var(--text-sm); letter-spacing: -0.15em; text-align: center;
                 cursor: grab; touch-action: none; padding: 0.4rem 0; line-height: 1; }
    .brow-rank { grid-area: rank; font-family: var(--font-mono); font-size: var(--text-base); font-weight: 700; color: var(--text-secondary);
                 text-align: right; background: none; border: 1px solid transparent; padding: 0.15rem 0.3rem; }
    .brow-rank:hover { border-color: var(--border); color: var(--text-primary); }
    .brow-rank-input { grid-area: rank; width: 2.6rem; font-family: var(--font-mono); font-size: var(--text-md); text-align: center;
                       background: var(--bg-page); color: var(--text-primary); border: 1px solid var(--accent); border-radius: var(--radius-sm); padding: 0.1rem; }
    .brow-team { grid-area: team; display: flex; align-items: center; gap: 0.55rem; min-width: 0; cursor: pointer; }
    .brow-team img { width: 26px; height: 26px; object-fit: contain; flex: none; }
    .brow-name { font-size: var(--text-base); font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brow-abbr { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-dim); }
    .brow-stats { grid-area: stats; display: flex; gap: 0.15rem; align-items: baseline; font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-muted); white-space: nowrap; }
    .brow-stats .st { display: inline-block; text-align: right; }
    .brow-stats em { font-style: normal; color: var(--text-dim); }
    .st-rec { width: 3.2rem; color: var(--text-primary); font-weight: 600; }
    .st-seed { width: 2.2rem; } .st-l10 { width: 4.6rem; } .st-strk { width: 2.4rem; } .st-diff { width: 3.2rem; } .st-last { width: 4rem; }
    .pos { color: var(--success); } .neg { color: var(--danger); }
    .brow-btns { grid-area: btns; display: flex; gap: 0.25rem; align-items: center; }
    .brow-btns button { background: var(--bg-page); border: 1px solid var(--border); color: var(--text-muted); padding: 0.1rem 0.4rem; font-size: var(--text-xs); }
    .brow-btns button:hover:not(:disabled) { color: var(--text-primary); border-color: var(--text-dim); }

    /* Team drawer — under a ballot row, a table row, or beside a blurb editor */
    .roster-drawer { border: 1px solid var(--border); border-top: none; border-radius: 0 0 var(--radius-sm) var(--radius-sm); background: var(--bg-page); padding: 0.7rem 0.8rem; margin-top: -0.3rem; font-size: var(--text-xs); color: var(--text-muted); }
    .ctx-row td { padding: 0 0 0.5rem; border-bottom: none; }
    .ctx-row .roster-drawer, .blurb-ctx { margin-top: 0; border-top: 1px solid var(--border); border-radius: var(--radius-sm); }
    .roster-drawer table { border-collapse: collapse; width: 100%; font-size: var(--text-xs); }
    .roster-drawer th { text-align: left; font-size: var(--text-xs); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-dim); padding: 0.2rem 0.35rem; border-bottom: 1px solid var(--border); font-weight: 600; }
    .roster-drawer td { padding: 0.22rem 0.35rem; border-bottom: 1px solid color-mix(in srgb, var(--text-primary) 4%, transparent); color: var(--text-secondary); }
    .roster-drawer .num { font-family: var(--font-mono); text-align: right; }
    .roster-drawer td.slot { font-family: var(--font-mono); color: var(--text-dim); width: 1.6rem; }
    .roster-drawer td.pname a { color: inherit; text-decoration: none; }
    .roster-drawer td.pname a:hover { color: var(--link); text-decoration: underline; }
    .roster-drawer tr.starter td { color: var(--text-primary); font-weight: 600; }
    .roster-drawer tr.starter + tr:not(.starter) td { border-top: 1px solid var(--border); }
    .tw { font-size: var(--text-xs); color: var(--text-dim); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0 0.2rem; }
    .dr-kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0.4rem; margin-bottom: 0.6rem; }
    .dr-kpi { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.35rem 0.5rem; display: flex; flex-direction: column; min-width: 0; }
    .dr-kpi .k { font-size: var(--text-xs); letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); }
    .dr-kpi .v { font-family: var(--font-mono); font-size: var(--text-base); font-weight: 700; color: var(--text-primary); }
    .dr-kpi .s { font-size: var(--text-xs); color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dr-line { display: flex; flex-wrap: wrap; gap: 0.3rem 0.45rem; align-items: baseline; margin-bottom: 0.55rem; }
    .dr-lbl { font-size: var(--text-xs); letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); width: 3.6rem; flex: none; }
    .res { font-family: var(--font-mono); font-size: var(--text-xs); background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.05rem 0.35rem; color: var(--text-secondary); }
    .res b { color: inherit; } .res.pos b { color: var(--success); } .res.neg b { color: var(--danger); }
    .inj { color: var(--text-secondary); } .inj b { color: var(--danger); font-weight: 600; }
    .dr-foot { margin-top: 0.5rem; text-align: right; }
    .dr-foot a { color: var(--link); text-decoration: none; font-weight: 500; }

    /* Consensus table */
    .ctable { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
    .ctable th { text-align: left; font-size: var(--text-xs); letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); padding: 0.4rem 0.5rem; border-bottom: 1px solid var(--border); }
    .ctable td { padding: 0.45rem 0.5rem; border-bottom: 1px solid color-mix(in srgb, var(--text-primary) 5%, transparent); vertical-align: top; }
    .ctable td.num { font-family: var(--font-mono); text-align: right; color: var(--text-muted); }
    .ctable .rank { font-family: var(--font-mono); font-size: var(--text-base); font-weight: 700; color: var(--text-primary); text-align: right; }
    .move-up { color: var(--success); font-size: var(--text-xs); font-family: var(--font-mono); }
    .move-down { color: var(--danger); font-size: var(--text-xs); font-family: var(--font-mono); }
    .move-flat { color: var(--text-dim); font-size: var(--text-xs); font-family: var(--font-mono); }
    .move-new { color: var(--gold); font-size: var(--text-xs); letter-spacing: 0.06em; text-transform: uppercase; }
    .team-cell { display: flex; align-items: center; gap: 0.5rem; }
    .team-cell img { width: 24px; height: 24px; object-fit: contain; flex: none; }
    .team-toggle { cursor: pointer; }
    .team-toggle:hover .team-nm { color: var(--link); }
    .team-txt { display: flex; flex-direction: column; min-width: 0; }
    .team-nm { font-weight: 600; color: var(--text-primary); }
    .team-sub { font-size: var(--text-xs); color: var(--text-muted); font-family: var(--font-mono); font-weight: 400; }
    .ctable td.team-td { width: 14rem; }
    .c-narrow { display: none; font-size: var(--text-xs); color: var(--text-dim); font-family: var(--font-mono); }
    .claim-chip { display: inline-flex; align-items: center; gap: 0.3rem; background: var(--bg-page); border: 1px solid var(--border); color: var(--text-secondary); font-family: var(--font-mono); font-size: var(--text-xs); padding: 0.15rem 0.5rem; }
    .claim-chip img { width: 16px; height: 16px; object-fit: contain; }
    .claim-chip.done { border-color: color-mix(in srgb, var(--success) 40%, transparent); color: var(--success); }
    .blurb-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0.7rem; align-items: start; }
    .blurb-grid textarea { min-height: 260px; }

    /* The editor is its own full-width row under the team, not a cell in the
       blurb column — see blurbEditorRow in rankings.js. */
    .blurb-edit-row td { background: var(--bg-card); padding: 0.7rem 0.8rem; }
    .blurb-edit-head { display: flex; align-items: center; gap: 0.5rem; font-size: var(--text-sm); font-weight: 600; color: var(--text-primary); margin-bottom: 0.45rem; }
    .blurb-edit-head img { width: 22px; height: 22px; object-fit: contain; }
    .blurb-edit-head .team-sub { margin-left: 0.3rem; }
    .blurb-box textarea { width: 100%; box-sizing: border-box; background: var(--bg-page); border: 1px solid var(--border); color: var(--text-primary); border-radius: var(--radius-sm); padding: 0.55rem 0.7rem; font-size: var(--text-base); line-height: 1.55; font-family: inherit; resize: vertical; min-height: 140px; }
    .blurb-box textarea:focus { outline: none; border-color: var(--accent); }
    .blurb-count { margin-left: auto; font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-dim); }
    .blurb-count.near { color: var(--gold); }
    .blurb-text { font-size: var(--text-sm); color: var(--text-secondary); line-height: 1.55; }
    .blurb-meta { font-size: var(--text-xs); color: var(--text-dim); margin-top: 0.25rem; display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .blurb-open { font-size: var(--text-xs); color: var(--text-dim); font-style: italic; }

    .status-msg { font-size: var(--text-xs); }
    .status-msg.ok { color: var(--success); } .status-msg.err { color: var(--danger); }
    .empty { color: var(--text-dim); font-size: var(--text-base); padding: 1rem 0; }
    .tick { color: var(--success); }
    .sticky-save { position: sticky; bottom: 0; background: var(--bg-page); border-top: 1px solid var(--border); padding: 0.7rem 0; display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; z-index: 5; }
    /* Phones and narrow windows */
    @media (max-width: 860px) {
      .brow { grid-template-columns: 1.1rem 2rem minmax(0, 1fr) auto;
              grid-template-areas: "grip rank team btns" "grip rank stats btns"; row-gap: 0.15rem; }
      .brow-stats { padding-left: calc(26px + 0.55rem); gap: 0.55rem; flex-wrap: wrap; }
      .brow-stats .st { width: auto; }
      .brow-stats .st:empty { display: none; }
      .blurb-grid { grid-template-columns: 1fr; }
      .blurb-grid textarea { min-height: 160px; }
    }
    @media (max-width: 640px) {
      .brow-abbr { display: none; }
      .brow-btns { flex-direction: column; gap: 0.15rem; }
      .brow-btns button { padding: 0.2rem 0.55rem; }
      .brow-grip { font-size: var(--text-base); padding: 0.6rem 0; }
      .dr-kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .roster-drawer .wide { display: none; }
      .roster-drawer { padding: 0.6rem; }
      .c-wide, .c-move { display: none; }
      .c-narrow { display: block; }
      .ctable td.team-td { width: 9.5rem; }
      .ctable td, .ctable th { padding-left: 0.3rem; padding-right: 0.3rem; }
      .ballot-tools .tools-sep { flex-basis: 100%; height: 0; }
    }
  </style>
</head>
<body>
<div class="page ui-page">
  <div class="nav"><a href="/news/">← News</a></div>
  <div id="loading" style="color:var(--text-muted);font-size:var(--text-base);">Loading…</div>
  <div id="content" style="display:none;">
    <header>
      <div id="phase-badge"></div>
      <h1 class="ui-title" id="pr-title"></h1>
      <div class="sub" id="pr-sub"></div>
    </header>
    <div id="author-panel"></div>
    <div id="main-panel"></div>
  </div>
  <div id="error-msg" style="display:none;color:var(--danger);font-size:var(--text-base);"></div>
</div>
<script src="/names.js"></script>
<script src="/teams/lineup.js"></script>
<script src="/news/rankings/rankings.js"></script>
<script src="/nav.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/logo.png">
  <link rel="stylesheet" href="/css/shared.css">
  <title>Article — NBN News</title>
  <!-- NBN:og -->
  <meta name="description" content="An article from NBN News.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NBN">
  <meta property="og:title" content="Article — NBN News">
  <meta property="og:description" content="An article from NBN News.">
  <meta property="og:url" content="https://nbn.today/news/view/">
  <meta property="og:image" content="https://nbn.today/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Nothing But Net — fantasy basketball GM simulation league">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#111827">
  <!-- /NBN:og -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <style>
    .page { max-width: 760px; margin: 0 auto; }
    /* A power-rankings article carries a 30-row table, which needs more room
       than a column of prose. Set on <body> once we know the type. */
    body.is-ranking .page { max-width: 940px; }

    /* Power rankings */
    /* The row is the border-bottom container; .rank-head is the grid that was
       once the row itself, so opening a team pushes the panel below the head
       rather than into a fifth grid column. */
    .rank-row { border-bottom: 1px solid var(--bg-card); }
    .rank-row:last-child { border-bottom: none; }
    .rank-head { display: grid; grid-template-columns: 2.6rem 2.2rem auto 1fr; gap: 0.75rem; align-items: start;
                 padding: 0.85rem 0.6rem; margin: 0 -0.6rem; border-radius: 8px;
                 cursor: pointer; transition: background 0.12s ease; }
    .rank-head:hover { background: var(--bg-card); }
    .rank-head.static { cursor: default; }
    .rank-head.static:hover { background: transparent; }
    .rank-head:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .rank-no { font-family: var(--font-mono); font-size: 1.35rem; font-weight: 800; color: var(--text-primary); text-align: right; line-height: 1.2; }
    .rank-no .tie { font-size: 0.72rem; font-weight: 700; color: var(--text-dim); vertical-align: 0.35em; margin-right: 0.05rem; }
    .rank-move { text-align: right; padding-top: 0.35rem; }
    .rank-logo img { width: 40px; height: 40px; object-fit: contain; display: block; }
    .rank-team { font-size: 1rem; font-weight: 700; color: var(--text-primary);
                 display: flex; align-items: center; gap: 0.4rem; }
    .rank-chev { font-size: 0.6rem; color: var(--text-dim); transition: transform 0.15s ease; }
    .rank-row.open .rank-chev { transform: rotate(90deg); color: var(--text-muted); }
    .rank-stats { font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-dim); margin-top: 0.1rem; }
    .rank-votes { display: flex; flex-wrap: wrap; gap: 0.15rem 0.45rem; margin-top: 0.35rem; font-size: 0.72rem; }
    .rank-votes .rv { display: inline-flex; align-items: baseline; gap: 0.28rem; white-space: nowrap; }
    .rank-votes .rv + .rv::before { content: '·'; margin-right: 0.45rem; color: var(--text-dim); }
    .rank-votes a { color: var(--text-muted); text-decoration: none; border-bottom: 1px solid transparent; }
    .rank-votes a:hover { color: var(--text-primary); border-bottom-color: var(--border); }
    .rank-votes b { font-family: var(--font-mono); font-weight: 600; color: var(--text-secondary); }
    details.ballots td.voter a { color: inherit; text-decoration: none; }
    details.ballots td.voter a:hover { color: var(--text-primary); text-decoration: underline; }
    .rank-blurb { font-size: 0.9rem; color: var(--text-secondary); line-height: 1.6; margin-top: 0.35rem; }
    .rank-blurb .by { color: var(--text-dim); font-size: 0.75rem; }

    /* The avatar is shared by the starting-five cards and the roster list. It
       is a <span>, so anywhere its parent is not a flex/grid container it needs
       display:block of its own or width/height never apply and the photo
       escapes its box. */
    .roster-chip-avatar { display: block; width: 34px; height: 34px; border-radius: 50%; overflow: hidden;
                           background: var(--bg-page); border: 1px solid var(--border); flex: none; }
    .roster-chip-avatar img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
    .roster-chip-avatar.empty {
      background: radial-gradient(circle at 50% 38%, var(--text-dim) 0 5px, transparent 6px),
                  radial-gradient(ellipse 9px 6px at 50% 100%, var(--text-dim) 0 100%, transparent 0);
    }

    /* Expandable team panel — one card, so it reads as a single object rather
       than three loose blocks under the row. Built on first open (see
       toggleRankRow) so 30 of these are not in the DOM to read one. */
    .rank-panel { padding: 0 0 1.1rem 5.6rem; }
    .panel-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
                  padding: 0.9rem 1rem 1rem; }
    .panel-title { font-size: 0.6rem; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
                   color: var(--text-dim); margin: 1rem 0 0.5rem; }
    .panel-title:first-child { margin-top: 0; }

    /* A KPI row, not a chart: six headline numbers about one team. The 1px grid
       gap over a border-coloured background is what draws the dividers. */
    .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(5rem, 1fr));
               gap: 1px; background: var(--border); border: 1px solid var(--border);
               border-radius: 8px; overflow: hidden; }
    .kpi { background: var(--bg-page); padding: 0.45rem 0.6rem 0.5rem; }
    .kpi-label { font-size: 0.55rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-dim); }
    .kpi-value { font-size: 0.95rem; font-weight: 700; color: var(--text-primary); margin-top: 0.15rem; line-height: 1.2; }
    /* Signed, and the sign is the point: these three are all "higher is better"
       (see team_ratings in stats_build/pipeline.py). The +/- carries the
       polarity on its own, so the colour is a second channel and never the
       only one — which is what makes this pair legal at its CVD separation. */
    .kpi-value.pos { color: var(--success); }
    .kpi-value.neg { color: var(--danger); }
    .kpi-sub { font-size: 0.6rem; font-family: var(--font-mono); color: var(--text-dim); margin-top: 0.1rem; }

    .panel-five { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .five-card { flex: 1 1 5rem; min-width: 5rem; max-width: 9rem; text-align: center;
                 background: var(--bg-page); border: 1px solid var(--border); border-radius: 8px;
                 padding: 0.5rem 0.3rem 0.55rem; }
    .five-slot { font-size: 0.55rem; font-weight: 700; letter-spacing: 0.08em; color: var(--accent-light); margin-bottom: 0.4rem; }
    .five-card .roster-chip-avatar { width: 42px; height: 42px; margin: 0 auto; }
    .five-name { font-size: 0.65rem; color: var(--text-secondary); margin-top: 0.35rem; line-height: 1.2;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .five-ovr { font-family: var(--font-mono); font-size: 0.72rem; font-weight: 700; color: var(--text-primary); }
    .five-card.vacant .five-name, .five-card.vacant .five-ovr { color: var(--text-dim); }

    .plist { display: grid; grid-template-columns: repeat(auto-fit, minmax(19rem, 1fr)); gap: 0.1rem 1.5rem; }
    .prow { display: grid; grid-template-columns: 1.2rem 30px minmax(0, 1fr) auto 1.8rem 2rem;
            gap: 0.5rem; align-items: center; padding: 0.22rem 0.35rem; border-radius: 6px; }
    .prow:hover { background: var(--bg-hover); }
    .prow .seq { font-family: var(--font-mono); font-size: 0.65rem; color: var(--text-dim); text-align: right; }
    .prow .pname { font-size: 0.78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .prow .pname a { color: var(--text-secondary); text-decoration: none; }
    .prow .pname a:hover { color: var(--text-primary); text-decoration: underline; }
    .prow .ppos { font-family: var(--font-mono); font-size: 0.62rem; color: var(--text-muted); }
    .prow .pag, .prow .povr { font-family: var(--font-mono); font-size: 0.72rem; text-align: right; }
    .prow .pag { color: var(--text-dim); }
    .prow .povr { color: var(--text-primary); font-weight: 700; }
    .prow .tw { font-size: 0.52rem; font-weight: 700; letter-spacing: 0.05em; color: var(--gold);
                border: 1px solid var(--gold-dim); border-radius: 3px; padding: 0 0.22rem; margin-left: 0.3rem; }
    .panel-link { display: inline-block; margin-top: 0.85rem; font-size: 0.72rem; color: var(--text-muted); text-decoration: none; }
    .panel-link:hover { color: var(--text-primary); }
    @media (max-width: 640px) {
      .rank-panel { padding-left: 0; }
      /* Reclaim the fixed rank/move/logo columns — on a phone they were taking
         a third of the width off the blurb, which is the part people read. */
      .rank-head { grid-template-columns: 1.9rem 1.5rem 26px 1fr; gap: 0.45rem; }
      .rank-no { font-size: 1.15rem; }
      .rank-logo img { width: 26px; height: 26px; }
      .prow { grid-template-columns: 1.2rem 28px minmax(0, 1fr) auto 2rem; }
      .prow .pag { display: none; }
    }
    .move-up { color: var(--success); font-size: 0.78rem; font-family: var(--font-mono); }
    .move-down { color: var(--danger); font-size: 0.78rem; font-family: var(--font-mono); }
    .move-flat { color: var(--text-dim); font-size: 0.78rem; font-family: var(--font-mono); }
    .move-new { color: var(--gold); font-size: 0.66rem; letter-spacing: 0.06em; text-transform: uppercase; }
    .method-note { font-size: 0.76rem; color: var(--text-muted); line-height: 1.55; background: var(--bg-card);
                   border: 1px solid var(--border); border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 1.25rem; }
    details.ballots { margin-top: 1.5rem; }
    details.ballots summary { cursor: pointer; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em;
                              text-transform: uppercase; color: var(--text-dim); }
    details.ballots summary:hover { color: var(--text-secondary); }
    .btable { width: 100%; border-collapse: collapse; font-size: 0.72rem; margin-top: 0.9rem; display: block; overflow-x: auto; }
    .btable th, .btable td { padding: 0.25rem 0.4rem; border-bottom: 1px solid rgba(255,255,255,0.05); white-space: nowrap; }
    .btable th { text-align: left; color: var(--text-dim); font-size: 0.63rem; letter-spacing: 0.06em; text-transform: uppercase; }
    .btable td.num { font-family: var(--font-mono); text-align: right; color: var(--text-muted); }
    .btable td.voter { color: var(--text-secondary); font-weight: 600; }

    .badge { display: inline-block; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; padding: 0.15rem 0.55rem; border-radius: 4px; }
    .badge-draft { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-muted); }
    .badge-submitted { background: var(--gold-bg); border: 1px solid var(--gold-dim); color: var(--gold); }
    .badge-published { background: var(--success-dark-bg); border: 1px solid #16a34a; color: var(--success); }

    .cover { width: 100%; max-height: 380px; object-fit: cover; border-radius: 12px; margin-bottom: 1.5rem; display: block; }

    .article-header { margin-bottom: 1.5rem; }
    .article-header .badge { margin-bottom: 0.7rem; }
    .article-tags { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.7rem; }
    .tag-pill { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-light); background: var(--accent-panel-bg); border: 1px solid var(--accent-dark); border-radius: 4px; padding: 0.12rem 0.45rem; }
    .article-header h1 { font-size: 2.1rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.6rem; line-height: 1.2; }
    .byline { font-size: 0.85rem; color: var(--text-muted); display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .byline .sep { color: var(--border); }
    .byline strong { color: var(--text-secondary); }

    .header-actions { display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap; }
    button { font-family: inherit; cursor: pointer; border-radius: 6px; font-size: 0.8rem; font-weight: 500; padding: 0.35rem 0.85rem; border: 1px solid transparent; }
    .btn-primary { background: var(--accent-dark); border-color: var(--accent); color: var(--text-on-accent); }
    .btn-primary:hover { background: var(--accent-dark); }
    .btn-success { background: var(--success-dark-bg); border-color: #16a34a; color: var(--success); }
    .btn-success:hover { background: #166534; }
    .btn-secondary { background: var(--bg-card); border-color: var(--border); color: var(--text-secondary); }
    .btn-secondary:hover { background: var(--bg-hover); border-color: var(--text-dim); }
    .btn-ghost { background: transparent; border-color: var(--border); color: var(--text-muted); text-decoration: none; display: inline-block; padding: 0.35rem 0.85rem; border-radius: 6px; }
    .btn-ghost:hover { background: var(--bg-card); color: var(--text-primary); }
    .btn-danger { background: transparent; border-color: var(--border); color: var(--danger); }
    .btn-danger:hover { background: #3b1f1f; border-color: var(--danger); }

    .divider { border: none; border-top: 1px solid var(--border); margin: 1.75rem 0; }

    /* Editor panel */
    .editor-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1.5rem; }
    .editor-panel .section-title { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 0.75rem; }
    .editor-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    .pub-date { background: var(--bg-page); border: 1px solid var(--border); color: var(--text-primary); border-radius: 6px; padding: 0.35rem 0.5rem; font-size: 0.8rem; font-family: inherit; }
    .editor-note { font-size: 0.73rem; color: var(--text-muted); margin-top: 0.55rem; }

    .md-body { line-height: 1.75; color: #d7dce3; font-size: 1.02rem; }
    .md-body h1, .md-body h2, .md-body h3, .md-body h4 { color: var(--text-primary); margin: 1.6rem 0 0.6rem; font-weight: 700; line-height: 1.3; }
    .md-body h1 { font-size: 1.5rem; } .md-body h2 { font-size: 1.25rem; } .md-body h3 { font-size: 1.05rem; }
    .md-body p { margin-bottom: 1rem; }
    .md-body img { max-width: 100%; border-radius: 8px; margin: 0.5rem 0; display: block; }
    .md-body ul, .md-body ol { margin: 0.5rem 0 1rem 1.5rem; }
    .md-body li { margin-bottom: 0.3rem; }
    .md-body blockquote { border-left: 3px solid var(--text-dim); padding-left: 1rem; color: var(--text-muted); margin: 1rem 0; font-style: italic; }
    .md-body code { background: var(--bg-card); border: 1px solid var(--border); border-radius: 3px; padding: 0.1rem 0.35rem; font-size: 0.85em; font-family: var(--font-mono); color: var(--text-primary); }
    .md-body pre { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 1rem; overflow-x: auto; margin-bottom: 1rem; }
    .md-body pre code { background: none; border: none; padding: 0; }
    .md-body a { color: var(--link); }
    .md-body hr { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }
    .md-body table { border-collapse: collapse; width: 100%; margin-bottom: 1rem; }
    .md-body th, .md-body td { border: 1px solid var(--border); padding: 0.4rem 0.7rem; }
    .md-body th { background: var(--bg-card); font-weight: 600; }

    .section-title { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 1rem; }

    /* Comments */
    .comment { border-top: 1px solid var(--bg-card); padding: 1rem 0; }
    .comment:first-child { border-top: none; }
    .comment-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 0.5rem; }
    .comment-author { font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
    .comment-date { font-size: 0.75rem; color: var(--text-dim); margin-left: 0.5rem; }
    .comment-delete { font-size: 0.7rem; color: var(--text-dim); background: none; border: none; cursor: pointer; }
    .comment-delete:hover { color: var(--danger); }
    .comment-body { font-size: 0.9rem; }
    .add-comment { margin-top: 1.25rem; }
    .add-comment textarea { width: 100%; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary); border-radius: 8px; padding: 0.65rem 0.85rem; font-size: 0.9rem; font-family: inherit; resize: vertical; min-height: 90px; }
    .add-comment textarea:focus { outline: none; border-color: var(--accent); }
    .comment-form-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 0.5rem; }
    .comment-auth { font-size: 0.75rem; color: var(--text-muted); }
    .status-msg { font-size: 0.75rem; }
    .status-msg.ok { color: var(--success); } .status-msg.err { color: var(--danger); }
    .empty { color: var(--text-dim); font-size: 0.875rem; padding: 1rem 0; }
    a.signin-link { cursor: pointer; color: var(--link); }
  </style>
</head>
<body>
<div class="page">
  <div class="nav"><a href="/news/">← News</a></div>

  <div id="loading" style="color:var(--text-muted);font-size:0.9rem;">Loading…</div>
  <div id="content" style="display:none;">
    <img class="cover" id="cover-img" style="display:none;" alt="" referrerpolicy="no-referrer">

    <div class="article-header">
      <div id="status-badge"></div>
      <div class="article-tags" id="article-tags"></div>
      <h1 id="article-title"></h1>
      <div class="byline" id="byline"></div>
      <div class="header-actions" id="header-actions"></div>
    </div>

    <!-- Editor panel -->
    <div class="editor-panel" id="editor-panel" style="display:none;">
      <div class="section-title">Editorial Controls</div>
      <div class="editor-actions" id="editor-actions"></div>
      <div class="editor-note" id="editor-note"></div>
    </div>

    <hr class="divider">
    <div class="md-body" id="article-body"></div>
    <div id="rankings-block"></div>
    <hr class="divider">

    <div>
      <div class="section-title" id="comments-title">Comments</div>
      <div id="comments-list"></div>
      <div class="add-comment" id="add-comment-section" style="display:none;">
        <textarea id="comment-textarea" placeholder="Write a comment… (Markdown supported)"></textarea>
        <div class="comment-form-footer">
          <span class="comment-auth" id="comment-auth-msg"></span>
          <div style="display:flex;align-items:center;gap:0.5rem;">
            <span class="status-msg" id="comment-status"></span>
            <button class="btn-primary" id="btn-comment-submit" onclick="submitComment()">Post Comment</button>
          </div>
        </div>
      </div>
      <div id="comment-signin-prompt" style="display:none;margin-top:1rem;">
        <span style="font-size:0.85rem;color:var(--text-muted);"><a class="signin-link" onclick="openTokenPrompt()">Sign in</a> to leave a comment.</span>
      </div>
    </div>
  </div>

  <div id="error-msg" style="display:none;color:var(--danger);font-size:0.9rem;"></div>
</div>

<script src="/league-time.js"></script>
<!-- computeStartingFive, for the projected lineup in an expanded team panel. -->
<script src="/teams/lineup.js"></script>
<script>
const API = '/api';
const params = new URLSearchParams(location.search);
const ARTICLE_ID = params.get('id');
let article = null;
let me = null;
let isEditor = false;
let isAuthor = false;

marked.use({ gfm: true, breaks: true });
function getToken() { return localStorage.getItem('nbn_token'); }
function fmtDate(iso) { if (!iso) return ''; return new Date(iso).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }); }
function escHtml(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function badgeHtml(s) { const l = { draft: 'Draft', submitted: 'In Queue', published: 'Published' }; return `<span class="badge badge-${s}">${l[s] || s}</span>`; }

function computeFlags(a) {
  isAuthor = me && me.name === a.author;
  isEditor = me && (me.roles || []).some(r => r === 'curator' || r === 'bod' || r === 'admin');
}

function render(a) {
  article = a;
  computeFlags(a);

  // Cover
  const cover = document.getElementById('cover-img');
  if (a.cover_image) { cover.src = a.cover_image; cover.style.display = 'block'; cover.onerror = () => { cover.style.display = 'none'; }; }
  else cover.style.display = 'none';

  document.getElementById('status-badge').innerHTML = a.status !== 'published' ? badgeHtml(a.status) : '';
  const tagsEl = document.getElementById('article-tags');
  tagsEl.innerHTML = (a.tags || []).map(t => `<span class="tag-pill">${escHtml(t)}</span>`).join('');
  document.getElementById('article-title').textContent = a.title;
  document.title = `${a.title} — NBN News`;

  const dateLabel = a.status === 'published' ? fmtDate(a.published_at)
    : a.status === 'submitted' ? `Submitted ${fmtDate(a.submitted_at)}`
    : `Draft · edited ${fmtDate(a.updated_at || a.created_at)}`;
  document.getElementById('byline').innerHTML =
    `<span>By <strong>${escHtml(a.author)}</strong></span><span class="sep">•</span><span>${dateLabel}</span>`;

  // Author edit link
  const actions = document.getElementById('header-actions');
  actions.innerHTML = '';
  const canEdit = isAuthor || isEditor;
  if (canEdit) {
    const edit = document.createElement('a');
    edit.href = `/news/new/?id=${a.id}`;
    edit.className = 'btn-ghost';
    edit.textContent = 'Edit';
    actions.appendChild(edit);
  }
  if (isAuthor && a.status === 'draft') {
    // Authors can publish their own drafts directly (no editorial approval).
    // The editor panel only renders for non-draft articles, so there's no
    // duplicate Publish button for editors viewing their own draft.
    const pub = document.createElement('button');
    pub.className = 'btn-success';
    pub.textContent = 'Publish';
    pub.onclick = doPublish;
    actions.appendChild(pub);
    const del = document.createElement('button');
    del.className = 'btn-danger';
    del.textContent = 'Delete Draft';
    del.onclick = doDelete;
    actions.appendChild(del);
  }

  // Editor panel
  const panel = document.getElementById('editor-panel');
  const eActions = document.getElementById('editor-actions');
  const eNote = document.getElementById('editor-note');
  if (isEditor && a.status !== 'draft') {
    panel.style.display = 'block';
    eActions.innerHTML = '';
    if (a.status === 'submitted') {
      const dateInput = document.createElement('input');
      dateInput.type = 'date'; dateInput.className = 'pub-date'; dateInput.id = 'pub-date';
      dateInput.value = nbnToday();
      const pub = document.createElement('button');
      pub.className = 'btn-success'; pub.textContent = 'Publish';
      pub.onclick = doPublish;
      const reject = document.createElement('button');
      reject.className = 'btn-secondary'; reject.textContent = 'Send back to author';
      reject.onclick = doReject;
      eActions.append(dateInput, pub, reject);
      eNote.textContent = `Submitted by ${a.author}. Set the publish date and publish, or send it back as a draft.`;
    } else if (a.status === 'published') {
      const unpub = document.createElement('button');
      unpub.className = 'btn-secondary'; unpub.textContent = 'Unpublish';
      unpub.onclick = doUnpublish;
      const del = document.createElement('button');
      del.className = 'btn-danger'; del.textContent = 'Delete';
      del.onclick = doDelete;
      eActions.append(unpub, del);
      eNote.textContent = `Published ${fmtDate(a.published_at)}${a.published_by ? ' by ' + a.published_by : ''}.`;
    }
  } else { panel.style.display = 'none'; }

  document.getElementById('article-body').innerHTML = marked.parse(a.body || '');
  renderRankings(a);
  renderComments(a);
}

const TEAM_NAMES = {
  ATL: 'Atlanta Hawks',        BKN: 'Brooklyn Nets',       BOS: 'Boston Celtics',
  CHA: 'Charlotte Hornets',    CHI: 'Chicago Bulls',       CLE: 'Cleveland Cavaliers',
  DAL: 'Dallas Mavericks',     DEN: 'Denver Nuggets',      DET: 'Detroit Pistons',
  GSW: 'Golden State Warriors',HOU: 'Houston Rockets',     IND: 'Indiana Pacers',
  LAC: 'LA Clippers',          LAL: 'Los Angeles Lakers',  MEM: 'Memphis Grizzlies',
  MIA: 'Miami Heat',           MIL: 'Milwaukee Bucks',     MIN: 'Minnesota Timberwolves',
  NOP: 'New Orleans Pelicans', NYK: 'New York Knicks',     OKC: 'Oklahoma City Thunder',
  ORL: 'Orlando Magic',        PHI: 'Philadelphia 76ers',  PHX: 'Phoenix Suns',
  POR: 'Portland Trail Blazers', SAC: 'Sacramento Kings',  SAS: 'San Antonio Spurs',
  TOR: 'Toronto Raptors',      UTA: 'Utah Jazz',           WAS: 'Washington Wizards',
};

function moveCell(r) {
  if (r.prev == null) return '<span class="move-new">new</span>';
  if (r.move > 0) return `<span class="move-up">▲${r.move}</span>`;
  if (r.move < 0) return `<span class="move-down">▼${Math.abs(r.move)}</span>`;
  return '<span class="move-flat">–</span>';
}

// A shared rank reads "T13" — the T is small so a two-digit tie still fits the
// column. `tied` comes from the API, which is where the tie is decided.
function rankLabel(r) {
  return `${r.tied ? '<span class="tie">T</span>' : ''}${r.rank}`;
}

// What the arrows are measured against: the previous edition when this one is
// chained to it, otherwise the outside ranking the author set as its baseline
// (a league sheet from before the series existed). Neither, and every row is
// "new", so there is nothing to say.
function movementNote(a) {
  if (a.prev_id) {
    return ` ▲▼ is movement from <a href="/news/view/?id=${escHtml(a.prev_id)}">the previous edition</a>.`;
  }
  if (a.baseline?.label) {
    return ` ▲▼ is movement from ${escHtml(a.baseline.label)}.`;
  }
  return '';
}

// The table under a power-rankings article. A published edition renders its
// frozen `final`; an unpublished one renders the live consensus so the author
// can see the shape of the piece, and offers the workspace link instead.
function renderRankings(a) {
  const host = document.getElementById('rankings-block');
  host.innerHTML = '';
  if (a.type !== 'power_rankings') { document.body.classList.remove('is-ranking'); return; }
  document.body.classList.add('is-ranking');

  const canWork = isAuthor || isEditor || a.viewer_is_voter;
  if (a.status !== 'published' && canWork) {
    const link = document.createElement('a');
    link.href = `/news/rankings/?id=${a.id}`;
    link.className = 'btn-ghost';
    link.textContent = a.phase === 'voting' ? 'Open the ballot →' : 'Ballot & blurbs →';
    document.getElementById('header-actions').appendChild(link);
  }

  const rows = a.final || a.consensus || [];
  if (!rows.length) {
    host.innerHTML = a.status === 'published' ? ''
      : '<p class="empty">No ballots are in yet, so there is no ranking to show.</p>';
    return;
  }

  const voters = (a.ballot_progress?.submitted || []);
  const legend = movementNote(a).trim();
  rows.forEach(r => {
    ROSTERS[r.team] = rosterOf(r);
    if (r.season_line) SEASON_LINES[r.team] = r.season_line;
  });
  host.innerHTML = `
    ${legend ? `<div class="method-note">${legend}</div>` : ''}
    ${rows.map(r => {
      const b = (a.blurbs || {})[r.team] || {};
      // An edition published before any of this was frozen has nothing to open
      // into, so it stays a plain row rather than a control that opens an empty
      // panel. A preview is always expandable — its data arrives async.
      const canOpen = !a.final || rosterOf(r).length > 0 || !!r.season_line;
      return `<div class="rank-row" data-team="${r.team}">
        <div class="rank-head${canOpen ? '' : ' static'}"${canOpen
            ? ` role="button" tabindex="0" aria-expanded="false" aria-controls="panel-${r.team}"` : ''}>
          <div class="rank-no">${rankLabel(r)}</div>
          <div class="rank-move">${moveCell(r)}</div>
          <div class="rank-logo"><img src="/logos/logo-${r.team.toLowerCase()}.png" alt="" loading="lazy"></div>
          <div>
            <div class="rank-team">${escHtml(TEAM_NAMES[r.team] || r.team)}${canOpen ? '<span class="rank-chev">▶</span>' : ''}</div>
            <div class="rank-stats">avg ${r.avg.toFixed(2)} · high ${r.hi} · low ${r.lo}</div>
            ${voterCells(a, voters, r.team)}
            ${b.body ? `<div class="rank-blurb">${escHtml(b.body)}
              ${b.claimed_by ? `<span class="by">— ${escHtml(b.claimed_by)}</span>` : ''}</div>` : ''}
          </div>
        </div>
        <div class="rank-panel" id="panel-${r.team}" hidden></div>
      </div>`;
    }).join('')}
    ${voters.length ? renderBallotTable(a, rows, voters) : ''}`;

  // A published edition's rows already carry a frozen roster and season line
  // (stamped at publish time -- see publish_article in nbn-api's news.py), so
  // there is nothing to fetch. Only a live, unpublished ballot preview
  // (a.consensus, no a.final yet) needs the client-side fetch+compute -- and an
  // old edition published before this field existed simply shows what it froze
  // rather than anything live-fetched under a stale date.
  if (!a.final) loadTeamSnapshots(rows.map(r => r.team));
  bindRankToggle(host);
}

// ── The expandable team panel ────────────────────────────────────────────────
// Everything a panel shows is the roster frozen onto the row at publish time,
// for the same reason the strip above it is frozen: the panel is a claim about
// the team the ranking was *voted on*, and a live fetch would quietly restate
// a months-old edition with today's roster. Editions published before the full
// roster was frozen carry only the six-player `roster_strip`; they fall back to
// it and get a shorter panel rather than a live-fetched one.
const ROSTERS = {};        // team -> roster as of this edition
const SEASON_LINES = {};   // team -> its most recent completed season

function rosterOf(r) { return r.roster || r.roster_strip || []; }

// One delegated pair of listeners on the container, not 30 on the rows. Clicks
// on a link inside the head (a voter's member page) are left alone — following
// a link should not also toggle the row it sits in.
function bindRankToggle(host) {
  if (host.dataset.toggleBound) return;
  host.dataset.toggleBound = '1';
  host.addEventListener('click', ev => {
    if (ev.target.closest('a')) return;
    const head = ev.target.closest('.rank-head:not(.static)');
    if (head) toggleRankRow(head.closest('.rank-row'));
  });
  host.addEventListener('keydown', ev => {
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    const head = ev.target.closest('.rank-head:not(.static)');
    if (!head) return;
    ev.preventDefault();
    toggleRankRow(head.closest('.rank-row'));
  });
}

function toggleRankRow(row) {
  const open = row.classList.toggle('open');
  const panel = row.querySelector('.rank-panel');
  row.querySelector('.rank-head').setAttribute('aria-expanded', String(open));
  panel.hidden = !open;
  if (open) buildTeamPanel(row.dataset.team, panel);
}

// Built on first open and again if the live preview path fills the roster in
// underneath an already-open panel; otherwise left alone.
function buildTeamPanel(team, panel) {
  const roster = ROSTERS[team] || [];
  const line = SEASON_LINES[team];
  const stamp = `${roster.length}:${line ? line.season : ''}`;
  if (panel.dataset.stamp === stamp) return;
  panel.dataset.stamp = stamp;
  panel.innerHTML = (!roster.length && !line)
    ? '<p class="empty">No roster was captured for this edition.</p>'
    : `<div class="panel-card">${kpiRowHtml(line)}${startingFiveHtml(roster)}${rosterListHtml(team, roster)}</div>`;
}

function fmtSigned(v, decimals = 1) {
  const n = parseFloat(v);
  if (isNaN(n)) return '—';
  return (n >= 0 ? '+' : '') + n.toFixed(decimals);
}

// Six headline numbers about one team, so this is a KPI row of stat tiles and
// not a chart of anything.
//
// All three ratings are "higher is better" — OFF_RTG is points scored above
// what that opponent had been allowing, DEF_RTG is points held below what they
// usually score (team_ratings, stats_build/pipeline.py), and DIFF is plain
// point differential. So the sign can be coloured, and the sign is also printed,
// which is what keeps the colour a second channel rather than the only one.
function kpiTile(label, value, cls = '', sub = '') {
  return `<div class="kpi"><div class="kpi-label">${escHtml(label)}</div>
    <div class="kpi-value${cls ? ' ' + cls : ''}">${value}</div>
    ${sub ? `<div class="kpi-sub">${sub}</div>` : ''}</div>`;
}

function signClass(v) {
  const n = parseFloat(v);
  if (isNaN(n) || Math.abs(n) < 0.05) return '';
  return n > 0 ? 'pos' : 'neg';
}

function kpiRowHtml(line) {
  if (!line) return '';
  const pct = parseFloat(line.pct);
  const tiles = [
    kpiTile('Record', `${escHtml(line.w)}–${escHtml(line.l)}`, '',
            isNaN(pct) ? '' : pct.toFixed(3).replace(/^0/, '')),
    kpiTile('Seed', escHtml(line.seed) || '—'),
    kpiTile('Finish', escHtml(line.playoff_result) || '—'),
    kpiTile('Off rtg', fmtSigned(line.off_rtg, 1), signClass(line.off_rtg)),
    kpiTile('Def rtg', fmtSigned(line.def_rtg, 1), signClass(line.def_rtg)),
    kpiTile('Net', fmtSigned(line.diff, 1), signClass(line.diff)),
  ];
  return `<div class="panel-title">${escHtml(line.season)} season</div>
    <div class="kpi-row">${tiles.join('')}</div>`;
}

// The best legal PG→C five out of this roster, via the same computeStartingFive
// the team page's depth chart uses (teams/lineup.js). A legacy six-player
// roster_strip carries no positions, so no slot can be filled and the section
// drops out entirely rather than showing five empty cards.
function startingFiveHtml(roster) {
  if (typeof computeStartingFive !== 'function') return '';
  const five = computeStartingFive(roster.map(p => ({ ...p, _posList: p.pos || [], OVR: p.ovr || 0 })));
  if (five.every(p => !p)) return '';
  return `<div class="panel-title">Projected starting five</div>
    <div class="panel-five">${DEPTH_SLOTS.map((slot, i) => {
      const p = five[i];
      return `<div class="five-card${p ? '' : ' vacant'}">
        <div class="five-slot">${slot}</div>
        ${avatarHtml(p ? p.photo : '')}
        <div class="five-name">${p ? escHtml(fullName(p)) : '—'}</div>
        <div class="five-ovr">${p ? escHtml(p.ovr) : '—'}</div>
      </div>`;
    }).join('')}</div>`;
}

// The top of the roster, not all of it — the panel answers "who is on this
// team", and the 9th-best player does not change that answer. The whole roster
// is still frozen and still read: computeStartingFive above needs it, since the
// only centre on a team can sit well outside the top 8.
const ROSTER_PANEL_N = 8;

function rosterListHtml(team, roster) {
  if (!roster.length) return '';
  const shown = roster.slice(0, ROSTER_PANEL_N);
  const more = roster.length - shown.length;
  return `<div class="panel-title">Roster — top ${shown.length}${more > 0 ? ` of ${roster.length}` : ''}</div>
    <div class="plist">${shown.map((p, i) => `<div class="prow">
      <span class="seq">${i + 1}</span>
      ${avatarHtml(p.photo)}
      <span class="pname"><a href="/players/?p=${encodeURIComponent(p.slug)}">${escHtml(fullName(p))}</a>${
        p.type === 'two-way' ? '<span class="tw">TW</span>' : ''}</span>
      <span class="ppos">${escHtml((p.pos || []).join('/'))}</span>
      <span class="pag">${p.age == null ? '—' : escHtml(p.age)}</span>
      <span class="povr">${escHtml(p.ovr)}</span>
    </div>`).join('')}</div>
    <a class="panel-link" href="/teams/${team}/">${escHtml(TEAM_NAMES[team] || team)} team page →</a>`;
}

function fullName(p) { return p.first ? `${p.first} ${p.name}` : p.name; }

// Minimal CSV reader — same shape other pages use. Neither file read here
// (single-column roster CSVs, standings-history) has a quoted field, so no
// quoted-field handling is needed.
function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h => h.trim());
  return lines.slice(1).map(line => {
    const cells = line.split(',');
    const row = {};
    headers.forEach((h, i) => { row[h] = (cells[i] || '').trim(); });
    return row;
  });
}

const toTitle = s => s.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());

function lastNameFromBio(canonical) {
  if (!canonical) return '';
  const last = canonical.includes(',') ? canonical.split(',', 1)[0] : canonical;
  return toTitle(last.trim());
}

function firstNameFromBio(canonical) {
  const i = (canonical || '').indexOf(',');
  return i < 0 ? '' : toTitle(canonical.slice(i + 1).trim());
}

function ageFromDob(dob) {
  if (!dob) return null;
  const d = new Date(dob + 'T00:00:00Z'), now = new Date();
  if (isNaN(d)) return null;
  let age = now.getUTCFullYear() - d.getUTCFullYear();
  const m = now.getUTCMonth() - d.getUTCMonth();
  if (m < 0 || (m === 0 && now.getUTCDate() < d.getUTCDate())) age--;
  return age;
}

let bioData = null, ovrData = null;   // fetched once, shared across every team (preview path only)

function avatarHtml(photo) {
  return photo
    ? `<span class="roster-chip-avatar"><img src="${escHtml(photo)}" alt="" loading="lazy"
         onerror="this.parentElement.classList.add('empty');this.remove();"></span>`
    : `<span class="roster-chip-avatar empty"></span>`;
}

// The preview path only. A published edition reads the roster frozen onto its
// rows; an unpublished ballot preview has no `final` yet, so it builds the same
// shape client-side — deliberately the same fields the API freezes, so a panel
// looks identical either side of publish.
//
// Fills each team's placeholder in after the table itself has already
// rendered — a slow or failed roster fetch degrades to an empty strip, never
// a delay on the ranking readers came for.
async function loadTeamSnapshots(teams) {
  try {
    if (!bioData) {
      [bioData, ovrData] = await Promise.all([
        fetch('/api/players').then(r => r.ok ? r.json() : {}),
        fetch('/api/ovr/current').then(r => r.ok ? r.json() : {}),
      ]);
    }
    const [standingsRes, ...results] = await Promise.allSettled([
      fetch('/standings/standings-history.csv').then(r => r.ok ? r.text() : null),
      ...teams.map(t => fetch(`/data/${t.toLowerCase()}-roster.csv`).then(r => r.ok ? r.text() : null)),
    ]);
    const standings = (standingsRes.status === 'fulfilled' && standingsRes.value)
      ? parseCSV(standingsRes.value) : [];
    teams.forEach((t, i) => {
      const line = seasonLineFor(t, standings);
      if (line) SEASON_LINES[t] = line;
      const res = results[i];
      if (res.status === 'fulfilled' && res.value) {
        ROSTERS[t] = parseCSV(res.value)
          .map(row => {
            const bio = bioData[row.SLUG] || {};
            return {
              slug: row.SLUG,
              name: lastNameFromBio(bio.name || ''),
              first: firstNameFromBio(bio.name || ''),
              ovr: ovrData[row.SLUG] ?? '',
              photo: bio.photo_url || '',
              pos: bio.pos || [],
              age: ageFromDob(bio.dob || ''),
              type: bio.type || '',
            };
          })
          .filter(p => p.type !== 'dead' && p.name)
          .sort((a, b) => (parseFloat(b.ovr) || 0) - (parseFloat(a.ovr) || 0));
      }
      // A panel opened before the fetch landed is rebuilt now it has something
      // to show; buildTeamPanel no-ops if nothing actually changed.
      const panel = document.getElementById(`panel-${t}`);
      if (panel && !panel.hidden) buildTeamPanel(t, panel);
    });
  } catch { /* the roster is a nice-to-have; leave placeholders empty on failure */ }
}

// Mirrors _team_season_line in nbn-api's news.py: the last season this team has
// a row for, which in the offseason is not the current league season.
function seasonLineFor(team, standings) {
  const rows = standings.filter(r => (r.TEAM || '').toUpperCase() === team);
  if (!rows.length) return null;
  const row = rows.reduce((best, r) => (r.SEASON || '') > (best.SEASON || '') ? r : best);
  return { season: row.SEASON, w: row.W, l: row.L, pct: row.PCT, seed: row.SEED,
           off_rtg: row.OFF_RTG, def_rtg: row.DEF_RTG, diff: row.DIFF,
           playoff_result: row.PLAYOFF_RESULT };
}

// Where each voter had this team, under its average. Names link to the member
// page: a ranking is a set of opinions with people attached, and the people are
// the reason anyone argues about it afterwards.
//
// A ballot that isn't readable — mid-vote, for anyone who isn't the author —
// simply isn't listed, so this renders nothing at all rather than a row of
// blanks.
function voterCells(a, voters, team) {
  const cells = voters.map(v => {
    const pos = (a.ballots?.[v]?.order || []).indexOf(team);
    if (pos < 0) return '';
    return `<span class="rv"><a href="/members/${encodeURIComponent(v)}/">${escHtml(v)}</a>`
      + `<b>${pos + 1}</b></span>`;
  }).filter(Boolean);
  return cells.length ? `<div class="rank-votes">${cells.join('')}</div>` : '';
}

// Every individual ballot, collapsed by default. Blind voting is about
// anchoring, not secrecy — once it closes, how each voter ranked each team is
// part of the article.
function renderBallotTable(a, rows, voters) {
  const order = rows.map(r => r.team);
  return `<details class="ballots">
    <summary>Individual ballots (${voters.length})</summary>
    <table class="btable">
      <thead><tr><th>Voter</th>${order.map(t => `<th>${t}</th>`).join('')}</tr></thead>
      <tbody>${voters.map(v => {
        const ballot = a.ballots?.[v]?.order || [];
        return `<tr><td class="voter"><a href="/members/${encodeURIComponent(v)}/">${escHtml(v)}</a></td>${
          order.map(t => {
            const pos = ballot.indexOf(t);
            return `<td class="num">${pos < 0 ? '–' : pos + 1}</td>`;
          }).join('')}</tr>`;
      }).join('')}</tbody>
    </table>
  </details>`;
}

function renderComments(a) {
  const comments = a.comments || [];
  document.getElementById('comments-title').textContent = `Comments (${comments.length})`;
  const list = document.getElementById('comments-list');
  list.innerHTML = '';
  if (!comments.length) {
    const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'No comments yet.';
    list.appendChild(e);
  } else {
    comments.forEach(c => {
      const div = document.createElement('div');
      div.className = 'comment';
      const canDelete = me && (me.name === c.author || isEditor);
      div.innerHTML = `
        <div class="comment-header">
          <div><span class="comment-author">${escHtml(c.author)}</span><span class="comment-date">${fmtDate(c.created_at)}</span></div>
          ${canDelete ? `<button class="comment-delete" onclick="deleteComment('${c.id}')">Delete</button>` : ''}
        </div>
        <div class="comment-body md-body">${marked.parse(c.body || '')}</div>`;
      list.appendChild(div);
    });
  }
  const addSection = document.getElementById('add-comment-section');
  const prompt = document.getElementById('comment-signin-prompt');
  if (a.status !== 'published') { addSection.style.display = 'none'; prompt.style.display = 'none'; }
  else if (me) { addSection.style.display = 'block'; prompt.style.display = 'none'; document.getElementById('comment-auth-msg').textContent = `Commenting as ${me.name}`; }
  else { addSection.style.display = 'none'; prompt.style.display = 'block'; }
}

async function doPublish() {
  const token = getToken();
  const date = document.getElementById('pub-date')?.value || null;
  if (!await confirmDialog({
    title: 'Publish this article?',
    body: 'It becomes visible to everyone as soon as it is published.',
    confirmLabel: 'Publish',
  })) return;
  try {
    const res = await fetch(`${API}/news/${ARTICLE_ID}/publish`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify({ publish_date: date }),
    });
    if (!res.ok) { const e = await res.json(); toast(e.detail || 'Failed', true); return; }
    await reload();
  } catch { toast('Failed. Please try again.', true); }
}
async function doReject() {
  if (!await confirmDialog({
    title: 'Send this back to the author?',
    body: 'The article returns to the author as a draft.',
    confirmLabel: 'Send back',
  })) return;
  await editorAction('reject');
}
async function doUnpublish() {
  if (!await confirmDialog({
    title: 'Unpublish this article?',
    body: 'It returns to the editorial queue and stops being visible to members.',
    confirmLabel: 'Unpublish',
    danger: true,
  })) return;
  await editorAction('unpublish');
}
async function editorAction(action) {
  const token = getToken();
  try {
    const res = await fetch(`${API}/news/${ARTICLE_ID}/${action}`, { method: 'POST', headers: { Authorization: `Bearer ${token}` } });
    if (!res.ok) { const e = await res.json(); toast(e.detail || 'Failed', true); return; }
    await reload();
  } catch { toast('Failed. Please try again.', true); }
}
async function doDelete() {
  if (!await confirmDialog({
    title: 'Delete this article?',
    body: 'This cannot be undone.',
    confirmLabel: 'Delete',
    danger: true,
  })) return;
  const token = getToken();
  try {
    const res = await fetch(`${API}/news/${ARTICLE_ID}`, { method: 'DELETE', headers: { Authorization: `Bearer ${token}` } });
    if (!res.ok) { const e = await res.json(); toast(e.detail || 'Failed', true); return; }
    location.href = '/news/';
  } catch { toast('Failed. Please try again.', true); }
}

async function submitComment() {
  const body = document.getElementById('comment-textarea').value.trim();
  if (!body) return;
  const token = getToken();
  if (!token) return;
  const btn = document.getElementById('btn-comment-submit'), statusEl = document.getElementById('comment-status');
  btn.disabled = true; statusEl.textContent = '';
  try {
    const res = await fetch(`${API}/news/${ARTICLE_ID}/comments`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify({ body }),
    });
    if (!res.ok) { const e = await res.json(); statusEl.textContent = e.detail || 'Failed'; statusEl.className = 'status-msg err'; return; }
    document.getElementById('comment-textarea').value = '';
    await reload();
  } catch { statusEl.textContent = 'Failed. Try again.'; statusEl.className = 'status-msg err'; }
  finally { btn.disabled = false; }
}
async function deleteComment(id) {
  if (!await confirmDialog({
    title: 'Delete this comment?',
    body: 'This cannot be undone.',
    confirmLabel: 'Delete',
    danger: true,
  })) return;
  const token = getToken();
  try {
    const res = await fetch(`${API}/news/${ARTICLE_ID}/comments/${id}`, { method: 'DELETE', headers: { Authorization: `Bearer ${token}` } });
    if (!res.ok) { const e = await res.json(); toast(e.detail || 'Failed', true); return; }
    await reload();
  } catch { toast('Failed. Please try again.', true); }
}

async function openTokenPrompt() {
  const token = await promptForToken();
  if (!token) return;
  const res = await fetch(`${API}/members/me`, { headers: { Authorization: `Bearer ${token}` } });
  const info = res.ok ? await res.json() : null;
  if (!info) { toast('That token was not accepted.', true); return; }
  me = info;
  render(article);
}

async function reload() {
  const token = getToken();
  const res = await fetch(`${API}/news/${ARTICLE_ID}`, { headers: token ? { Authorization: `Bearer ${token}` } : {} });
  if (!res.ok) return;
  render(await res.json());
}

async function init() {
  if (!ARTICLE_ID) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error-msg').style.display = 'block';
    document.getElementById('error-msg').textContent = 'No article specified.';
    return;
  }
  const token = getToken();
  if (token) {
    try {
      const res = await fetch(`${API}/members/me`, { headers: { Authorization: `Bearer ${token}` } });
      if (res.ok) me = await res.json(); else localStorage.removeItem('nbn_token');
    } catch {}
  }
  try {
    const res = await fetch(`${API}/news/${ARTICLE_ID}`, { headers: token ? { Authorization: `Bearer ${token}` } : {} });
    if (!res.ok) {
      const e = await res.json();
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error-msg').style.display = 'block';
      document.getElementById('error-msg').textContent = e.detail || 'Article not found.';
      return;
    }
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    render(await res.json());
  } catch {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error-msg').style.display = 'block';
    document.getElementById('error-msg').textContent = 'Failed to load article.';
  }
}

init();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="/theme-boot.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/logo.png">
  <link rel="stylesheet" href="/css/shared.css">
  <title>Claude Context — NBN</title>
  <!-- NBN:og -->
  <meta name="description" content="Project context for the nbn.today codebase.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NBN">
  <meta property="og:title" content="Claude Context — NBN">
  <meta property="og:description" content="Project context for the nbn.today codebase.">
  <meta property="og:url" content="https://nbn.today/context/">
  <meta property="og:image" content="https://nbn.today/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Nothing But Net — fantasy basketball GM simulation league">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0d0e11">
  <!-- /NBN:og -->
  <script src="/vendor/marked-12.0.2.min.js"></script>
  <script src="/vendor/purify-3.2.6.min.js"></script>
  <script src="/markdown.js"></script>
  <style>

    
            
    .search-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .search-row input {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 0.9rem;
      padding: 0.55rem 0.875rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-row input::placeholder { color: var(--text-muted); }
    .search-row input:focus { border-color: var(--link); }

    .match-info {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
      min-width: 6rem;
      text-align: right;
    }

    .nav-btns {
      display: flex;
      gap: 0.375rem;
    }
    .nav-btns button {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 0.3rem 0.6rem;
      transition: background 0.15s, color 0.15s;
    }
    .nav-btns button:hover { background: var(--border); color: var(--text-primary); }
    .nav-btns button:disabled { opacity: 0.3; cursor: default; }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem 2.25rem;
    }

    /* markdown prose */
    #content h1 { display: none; } /* page already has a title */
                                                                    
    /* search highlights */
    mark {
      background: var(--gold-border);
      border-radius: 2px;
      color: #fef3c7;
      padding: 0 2px;
    }
    mark.current {
      background: var(--champion-border);
      color: var(--text-on-accent);
    }

    #loading {
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 2rem 0;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="page ui-page">
    <nav class="nav"><a href="/">← NBN Home</a></nav>

    <header class="ui-header">
      <div>
        <h1 class="ui-title">Claude Context</h1>
        <p class="ui-subtitle">Project documentation, architecture notes, and data model reference for this codebase.</p>
      </div>
    </header>

    <div class="search-row">
      <input type="text" id="search" placeholder="Search docs…" autocomplete="off" spellcheck="false">
      <div class="nav-btns">
        <button id="prev-btn" disabled>↑</button>
        <button id="next-btn" disabled>↓</button>
      </div>
      <div class="match-info" id="match-info"></div>
    </div>

    <div class="card">
      <div id="loading">Loading…</div>
      <div id="content" class="ui-prose" style="display:none"></div>
    </div>
  </div>

  <script>
    const contentEl = document.getElementById('content');
    const loadingEl = document.getElementById('loading');
    const searchEl  = document.getElementById('search');
    const matchInfo = document.getElementById('match-info');
    const prevBtn   = document.getElementById('prev-btn');
    const nextBtn   = document.getElementById('next-btn');

    let rawHTML = '';
    let marks = [];
    let currentIdx = -1;

    fetch('/CLAUDE.md')
      .then(r => r.text())
      .then(md => {
        rawHTML = renderMarkdown(md);
        contentEl.innerHTML = rawHTML;
        loadingEl.style.display = 'none';
        contentEl.style.display = '';
      })
      .catch(() => {
        loadingEl.textContent = 'Failed to load CLAUDE.md.';
      });

    function clearHighlights() {
      contentEl.innerHTML = rawHTML;
      marks = [];
      currentIdx = -1;
    }

    function highlight(query) {
      clearHighlights();
      if (!query) {
        matchInfo.textContent = '';
        prevBtn.disabled = true;
        nextBtn.disabled = true;
        return;
      }

      const walker = document.createTreeWalker(contentEl, NodeFilter.SHOW_TEXT);
      const textNodes = [];
      let node;
      while ((node = walker.nextNode())) textNodes.push(node);

      const re = new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
      textNodes.forEach(tn => {
        const val = tn.nodeValue;
        if (!re.test(val)) return;
        re.lastIndex = 0;

        const frag = document.createDocumentFragment();
        let last = 0, m;
        while ((m = re.exec(val)) !== null) {
          if (m.index > last) frag.appendChild(document.createTextNode(val.slice(last, m.index)));
          const mark = document.createElement('mark');
          mark.textContent = m[0];
          frag.appendChild(mark);
          marks.push(mark);
          last = re.lastIndex;
        }
        if (last < val.length) frag.appendChild(document.createTextNode(val.slice(last)));
        tn.parentNode.replaceChild(frag, tn);
      });

      const count = marks.length;
      if (count === 0) {
        matchInfo.textContent = 'No matches';
        prevBtn.disabled = true;
        nextBtn.disabled = true;
        return;
      }

      prevBtn.disabled = false;
      nextBtn.disabled = false;
      goTo(0);
    }

    function goTo(idx) {
      if (!marks.length) return;
      if (currentIdx >= 0) marks[currentIdx].classList.remove('current');
      currentIdx = (idx + marks.length) % marks.length;
      marks[currentIdx].classList.add('current');
      marks[currentIdx].scrollIntoView({ block: 'center', behavior: 'smooth' });
      matchInfo.textContent = `${currentIdx + 1} / ${marks.length}`;
    }

    let debounceTimer;
    searchEl.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => highlight(searchEl.value.trim()), 150);
    });

    searchEl.addEventListener('keydown', e => {
      if (!marks.length) return;
      if (e.key === 'Enter') { e.preventDefault(); goTo(e.shiftKey ? currentIdx - 1 : currentIdx + 1); }
    });

    nextBtn.addEventListener('click', () => goTo(currentIdx + 1));
    prevBtn.addEventListener('click', () => goTo(currentIdx - 1));
  </script>
  <script src="/nav.js"></script>
</body>
</html>

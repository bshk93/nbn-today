<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="/theme-boot.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/shared.css">
  <title>Award Race — NBN</title>
  <!-- NBN:og -->
  <meta name="description" content="Who leads the MVP, DPOY, Rookie, Sixth Man and Most Improved races, by formula — and how often that formula has named the real winner.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NBN">
  <meta property="og:title" content="Award Race — NBN">
  <meta property="og:description" content="Who leads the MVP, DPOY, Rookie, Sixth Man and Most Improved races, by formula — and how often that formula has named the real winner.">
  <meta property="og:url" content="https://nbn.today/awards/race/">
  <meta property="og:image" content="https://nbn.today/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Nothing But Net — fantasy basketball GM simulation league">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0d0e11">
  <link rel="icon" href="/icons/favicon.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <!-- /NBN:og -->
  <style>
    .race-controls { display: flex; align-items: center; gap: var(--space-2); }
    .race-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: var(--space-4); }
    .race-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-4) var(--space-5); min-width: 0; }
    .race-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-2); }
    .race-title { font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; color: var(--text-primary); }
    .race-full { font-size: var(--text-xs); color: var(--text-muted); }
    .race-row { display: grid; grid-template-columns: 1.5rem 1fr auto; align-items: center; gap: var(--space-3); padding: var(--space-2) 0; border-top: 1px solid var(--border-subtle); }
    .race-row:first-of-type { border-top: none; }
    .race-rank { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; color: var(--text-muted); text-align: center; }
    .race-row.lead .race-rank { color: var(--gold); }
    .race-who { min-width: 0; }
    .race-name { display: flex; align-items: center; gap: var(--space-2); font-weight: 600; color: var(--text-primary); }
    .race-name a { color: inherit; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .race-name img { width: 18px; height: 18px; object-fit: contain; flex-shrink: 0; }
    .race-team { font-size: var(--text-xs); font-weight: 500; color: var(--text-muted); }
    .race-line { font-size: var(--text-sm); color: var(--text-secondary); font-variant-numeric: tabular-nums; }
    .race-won { font-size: var(--text-xs); font-weight: 600; color: var(--gold); white-space: nowrap; }
    .race-how { margin-top: var(--space-3); font-size: var(--text-xs); color: var(--text-muted); }
    .race-check { font-size: var(--text-xs); color: var(--text-muted); white-space: nowrap; }
    .race-note { margin-bottom: var(--space-4); font-size: var(--text-sm); color: var(--text-muted); }
    @media (max-width: 520px) { .race-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="page ui-page ui-page--wide">
    <nav class="nav"></nav>
    <header class="ui-header">
      <h1 class="ui-title">Award Race</h1>
      <div class="ui-header-actions race-controls">
        <a class="ui-btn ui-btn--sm ui-btn--ghost" href="/awards/">Past winners</a>
        <select class="ui-select" id="season" aria-label="Season"></select>
      </div>
    </header>
    <p class="race-note" id="note"></p>
    <div class="race-grid" id="grid"><div class="ui-loading">Loading…</div></div>
  </div>

  <script src="/league-time.js"></script>
  <script src="/names.js"></script>
  <script src="/award-race.js"></script>
  <script src="/nav.js"></script>
  <script>
    // Everything is computed here from the build's season totals; the ranking
    // rules are /award-race.js. Each card also scores those rules against the
    // real winners of every past season it can, so the page says how much to
    // trust it.
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const SHOWN = 5;
    const HOW = {
      MVP:  'Game Score per game, weighted by team win % (square root).',
      DPOY: 'Steals + blocks + 0.15 × rebounds per 36, weighted by minutes played and team win %.',
      ROTY: 'Game Score per game, among players drafted this year.',
      '6MOY': 'Game Score per game, among players who started at most half the games with a known starting five. Starts are recorded from 26-27.',
      MIP:  'Game Score per game, up on last season (20+ games last season).',
    };
    const f1 = v => v.toFixed(1);
    const LINE = {
      MVP:  p => `${f1(p.PTS / p.G)} pts · ${f1(p.REB / p.G)} reb · ${f1(p.AST / p.G)} ast · team ${p.win.toFixed(3).replace(/^0/, '')}`,
      DPOY: p => `${f1(p.STL / p.G)} stl · ${f1(p.BLK / p.G)} blk · ${f1(p.REB / p.G)} reb`,
      ROTY: p => `${f1(p.PTS / p.G)} pts · ${f1(p.REB / p.G)} reb · ${f1(p.AST / p.G)} ast`,
      '6MOY': p => `${f1(p.PTS / p.G)} pts · ${f1(p.REB / p.G)} reb · started ${p.gs} of ${p.known}`,
      MIP:  p => `Game Score ${f1(p.prevGmscPg)} → ${f1(p.gmscPg)} (+${f1(p.gmscPg - p.prevGmscPg)})`,
    };

    (async () => {
      const [ps, st, lh, current] = await Promise.all([
        fetch('/players/player_seasons.csv').then(r => r.text()),
        fetch('/standings/standings-history.csv').then(r => r.text()),
        fetch('/data/league-history.csv').then(r => (r.ok ? r.text() : '')).catch(() => ''),
        nbnCurrentSeason(),
      ]);
      const rows = parseCSV(ps);
      const pct = {};
      parseCSV(st).forEach(r => { pct[`${r.SEASON}|${r.TEAM}`] = +r.PCT; });
      const pastRows = lh ? parseCSV(lh) : [];
      const winners = {};
      pastRows.forEach(h => { winners[h.SEASON] = h; });

      const seasons = [...new Set(rows.map(r => r.SEASON))].sort().reverse();
      if (!seasons.includes(current)) seasons.unshift(current);
      const sel = document.getElementById('season');
      sel.innerHTML = seasons.map(s => `<option>${s}</option>`).join('');
      const want = new URLSearchParams(location.search).get('season');
      sel.value = seasons.includes(want) ? want : current;
      // Each season is a history entry, so Back returns to the last one.
      sel.onchange = () => {
        history.pushState(null, '', sel.value === current ? location.pathname : `?season=${sel.value}`);
        render(sel.value);
      };
      window.addEventListener('popstate', () => {
        const s = new URLSearchParams(location.search).get('season');
        sel.value = seasons.includes(s) ? s : current;
        render(sel.value);
      });

      const isWinner = (key, season, p) => {
        const w = (winners[season] || {})[key];
        return !!w && w !== 'NA' && w.toUpperCase() === String(p.name).toUpperCase();
      };

      // How often the formula's #1 was the real winner, over every season
      // with both a winner on file and stats to rank.
      const record = {};
      AwardRace.AWARDS.forEach(({ key }) => {
        let hit = 0, of = 0;
        pastRows.forEach(h => {
          if (!h[key] || h[key] === 'NA') return;
          const top = AwardRace.ladder(key, rows, h.SEASON, pct)[0];
          if (!top) return;
          of++;
          if (isWinner(key, h.SEASON, top)) hit++;
        });
        record[key] = of ? { hit, of } : null;
      });

      const startsCache = {};
      const startsFor = season => startsCache[season] || (startsCache[season] =
        fetch(`/api/game-starters/counts?season=${season}`).then(r => (r.ok ? r.json() : null)).catch(() => null));

      async function render(season) {
        const grid = document.getElementById('grid');
        const starts = await startsFor(season);
        const done = season < current;
        const most = Math.max(0, ...AwardRace.players(rows, season, pct).map(p => p.G));
        document.getElementById('note').textContent = most
          ? (done ? `The ${season} season as these formulas rank it, with the real winner marked.`
                  : `Through ${most} game${most === 1 ? '' : 's'}. A formula, not a vote: it ranks the season's stats so far.`)
          : 'No games yet this season.';
        grid.innerHTML = AwardRace.AWARDS.map(({ key, label }) => {
          const list = AwardRace.ladder(key, rows, season, pct, { starts }).slice(0, SHOWN);
          const rec = record[key];
          const body = list.length ? list.map((p, i) => `
            <div class="race-row${i === 0 ? ' lead' : ''}">
              <span class="race-rank">${i + 1}</span>
              <div class="race-who">
                <div class="race-name"><img src="/logos/sm/logo-${esc(p.team.toLowerCase())}.webp" alt="" onerror="this.style.visibility='hidden'">
                  <a href="/players/?p=${encodeURIComponent(p.slug)}">${esc(nbnPlayerName(p.name))}</a>
                  <span class="race-team">${esc(p.team)}</span></div>
                <div class="race-line">${esc(LINE[key](p))}</div>
              </div>
              ${isWinner(key, season, p) ? '<span class="race-won">🏆 Won</span>' : ''}
            </div>`).join('')
            : `<div class="ui-empty">${key === '6MOY' && season < '26-27'
                ? 'Starts weren’t recorded before 26-27.' : 'Nobody qualifies yet.'}</div>`;
          return `<section class="race-card">
            <div class="race-head"><span class="race-title">${key}</span>
              ${rec ? `<span class="race-check" title="How often this formula's #1 was the real winner">Picked ${rec.hit} of ${rec.of} past winners</span>` : ''}</div>
            <div class="race-full">${esc(label)}</div>
            ${body}
            <div class="race-how">${esc(HOW[key])}</div>
          </section>`;
        }).join('');
      }

      render(sel.value);
    })().catch(e => {
      document.getElementById('grid').innerHTML = `<div class="ui-empty">Couldn’t load the award race: ${esc(e.message)}</div>`;
    });
  </script>
  <script src="/token-badge.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/logo.png">
  <link rel="stylesheet" href="/css/shared.css">
  <title>Stream — NBN</title>
  <!-- NBN:og -->
  <meta name="description" content="The streamer dashboard — claim games to broadcast and enter team coaching settings into the game.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NBN">
  <meta property="og:title" content="Stream — NBN">
  <meta property="og:description" content="The streamer dashboard — claim games to broadcast and enter team coaching settings into the game.">
  <meta property="og:url" content="https://nbn.today/stream/">
  <meta property="og:image" content="https://nbn.today/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Nothing But Net — fantasy basketball GM simulation league">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#111827">
  <!-- /NBN:og -->
  <style>
    .page { max-width: 900px; margin: 0 auto; }

    header { margin-bottom: 1.25rem; }
    header h1 { font-size: 1.875rem; font-weight: 700; letter-spacing: -0.02em; }
    .sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.3rem; }

    /* ── gate ─────────────────────────────────────────────────────────── */
    .gate { max-width: 480px; margin: 3rem auto; text-align: center; }
    .gate h2 { font-size: 1.1rem; margin-bottom: 0.6rem; }
    .gate p { color: var(--text-muted); font-size: 0.88rem; line-height: 1.6; margin-bottom: 1rem; }
    .gate a { color: var(--link); font-size: 0.85rem; }

    /* ── tabs (same shape as teams/team.js) ──────────────────────────────── */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.5rem;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      padding: 0.6rem 1.25rem;
      font-family: inherit;
      transition: color 0.12s;
      margin-bottom: -1px;
      white-space: nowrap;
    }
    .tab:hover { color: var(--text-secondary); }
    .tab.active { color: var(--text-primary); border-bottom-color: var(--accent); font-weight: 600; }
    .tab-panel.hidden { display: none; }

    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; margin-bottom: 0.9rem; }

    .controls select {
      padding: 0.45rem 0.7rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 0.85rem;
      font-family: inherit;
    }
    .controls select:focus { outline: none; border-color: var(--accent); }

    .seg { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .seg button {
      background: var(--bg-card);
      border: none;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.78rem;
      padding: 0.45rem 0.8rem;
      cursor: pointer;
    }
    .seg button + button { border-left: 1px solid var(--border); }
    .seg button:hover { color: var(--text-secondary); }
    .seg button.active { background: var(--accent-dark); color: var(--text-on-accent); }

    .summary {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.4rem 0.9rem;
      font-size: 0.78rem;
      color: var(--text-secondary);
      background: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 0.55rem 0.8rem;
      margin-bottom: 1rem;
    }
    .summary:empty { display: none; }
    .summary b { color: var(--text-primary); font-weight: 600; }
    .summary .dim { color: var(--text-muted); }

    .table-wrap { overflow-x: auto; }
    table.data-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .data-table thead th {
      padding: 0.55rem 0.6rem; text-align: left; font-size: 0.66rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-dim);
      border-bottom: 1px solid var(--border); cursor: default; white-space: nowrap;
    }
    .data-table thead th.right { text-align: right; }
    .data-table tbody td { padding: 0.4rem 0.6rem; color: var(--text-secondary); vertical-align: middle; }

    .games-table tbody tr.game-row { border-bottom: 1px solid var(--bg-card); }
    .games-table tbody tr.game-row:hover { background: var(--bg-subtle); }
    .games-table tbody tr.game-row.played { color: var(--text-muted); }
    .games-table tbody tr.month-row td {
      padding: 1rem 0.6rem 0.4rem; font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--text-dim); border-bottom: 1px solid var(--bg-card);
    }
    .games-table tbody tr.month-row:first-child td { padding-top: 0.4rem; }
    .games-table tbody tr.day-row td {
      padding: 0.5rem 0.6rem 0.25rem; font-size: 0.75rem; font-weight: 600; color: var(--text-muted);
    }
    .day-row-inner { display: flex; align-items: center; flex-wrap: wrap; gap: 0.5rem; }

    /* Per-date "done"/VOD controls, shown on a day divider only when that
       date has at least one claimed or flagged game — same shared, one-per-
       date flag `routers/streaming_days.py` enforces server-side. */
    .day-slate { display: flex; align-items: center; flex-wrap: wrap; gap: 0.4rem; margin-left: auto; }
    .day-slate .cd-btn { font-size: 0.68rem; padding: 0.15rem 0.5rem; }
    .day-yt-input {
      width: 11rem; background: var(--bg-page); border: 1px solid var(--border); border-radius: 6px;
      color: var(--text-secondary); font-size: 0.72rem; padding: 0.2rem 0.45rem; font-family: inherit; outline: none;
    }
    .day-yt-input:focus { border-color: var(--accent); }
    .day-meta { font-size: 0.68rem; color: var(--text-dim); white-space: nowrap; font-weight: 400; text-transform: none; letter-spacing: normal; }

    .gt-num { width: 2rem; text-align: right; font-size: 0.68rem; color: var(--text-dim); font-variant-numeric: tabular-nums; }
    .gt-time { width: 5rem; font-size: 0.75rem; color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .gt-arena { width: 11rem; max-width: 11rem; font-size: 0.72rem; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .gt-streamer, .gt-stream { width: 8rem; white-space: nowrap; }
    .gt-result { width: 5rem; text-align: right; font-size: 0.78rem; font-variant-numeric: tabular-nums; white-space: nowrap; }

    .g-match { display: flex; align-items: center; gap: 0.35rem; font-size: 0.85rem; }
    .g-match a { color: var(--text-secondary); }
    .game-row.played .g-match a { color: var(--text-muted); }
    .g-logo { width: 18px; height: 18px; flex: none; object-fit: contain; }
    .g-at { color: var(--text-dim); font-size: 0.75rem; }
    .g-note {
      display: inline-block; margin-left: 0.4rem; font-size: 0.65rem; color: var(--gold); background: var(--gold-bg);
      border-radius: 3px; padding: 0.1rem 0.35rem; white-space: nowrap;
    }
    .g-score { font-size: 0.78rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .g-score.win { color: var(--success); }
    .g-score.loss { color: var(--danger); }
    .g-next { font-size: 0.6rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--link); }

    .streamer-chip {
      display: inline-flex; align-items: center; gap: 0.25rem;
      font-size: 0.68rem; color: var(--purple-light); background: var(--purple-light-bg);
      border-radius: 3px; padding: 0.1rem 0.4rem; white-space: nowrap;
    }
    .streamer-chip.mine { color: var(--accent-light); background: var(--accent-panel-bg); }
    .chip-x {
      background: none; border: none; padding: 0; cursor: pointer; line-height: 1;
      color: inherit; opacity: 0.6; font-size: 0.8rem; font-family: inherit;
    }
    .chip-x:hover { opacity: 1; }

    .stream-badge {
      display: inline-flex; align-items: center; gap: 0.2rem;
      font-size: 0.65rem; font-weight: 600; color: var(--danger-light); background: var(--danger-bg);
      border-radius: 3px; padding: 0.1rem 0.4rem; white-space: nowrap;
    }

    .g-claim, .g-stream-btn {
      background: none; border: 1px solid var(--border); border-radius: 6px;
      color: var(--text-muted); font-family: inherit; font-size: 0.68rem;
      padding: 0.15rem 0.5rem; cursor: pointer; line-height: 1.2;
      opacity: 0.5; transition: opacity 0.1s, color 0.1s, border-color 0.1s;
    }
    .games-table tbody tr.game-row:hover .g-claim, .g-claim:focus,
    .games-table tbody tr.game-row:hover .g-stream-btn, .g-stream-btn:focus { opacity: 1; color: var(--accent-light); border-color: var(--accent); }
    .g-claim[disabled], .g-stream-btn[disabled] { cursor: default; }

    .toast {
      position: fixed; left: 50%; bottom: 1.5rem; transform: translateX(-50%);
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
      padding: 0.6rem 1rem; font-size: 0.8rem; color: var(--text-primary);
      box-shadow: 0 4px 16px var(--shadow-color); z-index: 50; max-width: 90vw;
    }
    .toast.bad { border-color: var(--danger-border-strong); color: var(--danger-light); }

    .more-wrap { display: flex; justify-content: center; padding: 1.5rem 0 0.5rem; }
    .more-btn {
      background: var(--bg-card); border: 1px solid var(--border); color: var(--text-secondary);
      border-radius: 8px; padding: 0.5rem 1.1rem; font-family: inherit; font-size: 0.8rem; cursor: pointer;
    }
    .more-btn:hover { border-color: var(--accent); color: var(--text-primary); }

    .empty { color: var(--text-muted); font-size: 0.85rem; padding: 2rem 0; text-align: center; }
    .source { font-size: 0.68rem; color: var(--text-dim); margin-top: 2rem; }

    @media (max-width: 700px) {
      .gt-arena { display: none; }
      .gt-time { width: 4rem; }
    }

    /* ── Coaching Settings tab ────────────────────────────────────────── */
    #coaching-dash-wrap h2 { font-size: 0.95rem; font-weight: 700; margin-bottom: 0.15rem; }
    .cd-when { font-size: 0.72rem; color: var(--text-muted); }
    .cd-btn { font-size: 0.72rem; padding: 0.2rem 0.55rem; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: var(--text-secondary); cursor: pointer; font-family: inherit; }
    .cd-btn:hover { border-color: var(--accent); color: var(--text-primary); }
    .cd-btn:disabled { opacity: 0.5; cursor: default; }
    .cd-detail { margin-top: 0.6rem; }

    .cd-table tbody tr.cd-trow { border-bottom: 1px solid var(--bg-card); }
    .cd-table tbody tr.cd-trow:hover { background: var(--bg-subtle); }
    .cd-team-cell { display: flex; align-items: center; gap: 0.4rem; }
    .cd-team-cell a { font-weight: 600; }
    .cd-actions { text-align: right; white-space: nowrap; }
    .cd-actions .cd-btn + .cd-btn { margin-left: 0.4rem; }
    .cd-detail-row td { padding-top: 0; padding-bottom: 0.8rem; background: var(--bg-subtle); }

    /* Indicator cells: a colored dot for entry status, a bare glyph for the
       incomplete warning — text lives in the title tooltip, not the cell. */
    .cd-dot {
      display: inline-block; width: 0.55rem; height: 0.55rem; border-radius: 50%;
      background: transparent; border: 1px solid var(--border);
    }
    .cd-dot.pending { background: var(--gold, #c9a227); border-color: var(--gold, #c9a227); }
    .cd-dot.entered { background: var(--success-light, #4caf50); border-color: var(--success-light, #4caf50); }
    .cd-incomplete-flag { font-size: 0.8rem; line-height: 1; cursor: default; }

    .tab-badge {
      display: inline-block; min-width: 1.1rem; margin-left: 0.35rem; padding: 0 0.35rem;
      border-radius: 999px; background: var(--gold, #c9a227); color: #1a1400;
      font-size: 0.68rem; font-weight: 700; line-height: 1.3rem; text-align: center;
    }
  </style>
</head>
<body>
  <div class="page">
    <nav class="nav"></nav>

    <header>
      <h1>Stream</h1>
      <p class="sub">Claim games to broadcast, mark a night's slate done with a VOD link, and manage each team's in-game coaching settings.</p>
    </header>

    <div id="gate"></div>

    <div id="app" hidden>
      <div class="tabs">
        <button class="tab active" data-tab="claim">Claim Games</button>
        <button class="tab" data-tab="coaching">Coaching Settings<span class="tab-badge" id="coaching-tab-badge" hidden></span></button>
      </div>

      <div class="tab-panel" id="tab-claim">
        <p class="sub" id="sub">Loading…</p>
        <div class="controls">
          <select id="season-sel" aria-label="Season"></select>
          <select id="team-sel" aria-label="Team"></select>
          <div class="seg" id="scope-seg">
            <button data-scope="upcoming">Upcoming</button>
            <button data-scope="all">Full season</button>
          </div>
        </div>
        <div class="summary" id="summary"></div>
        <div class="table-wrap" id="games-table-wrap">
          <table class="data-table games-table">
            <thead>
              <tr>
                <th class="gt-num">#</th>
                <th class="gt-time">Time</th>
                <th>Matchup</th>
                <th class="gt-arena">Arena</th>
                <th class="gt-streamer">Streamer</th>
                <th class="gt-stream">Stream</th>
                <th class="gt-result right">Result</th>
              </tr>
            </thead>
            <tbody id="list"></tbody>
          </table>
        </div>
        <div class="empty" id="list-empty" hidden>Loading…</div>
        <div id="more"></div>
        <p class="source" id="source"></p>
      </div>

      <div class="tab-panel hidden" id="tab-coaching">
        <div id="coaching-dash-wrap">
          <h2>Coaching Settings</h2>
          <div class="table-wrap">
            <table class="data-table cd-table">
              <thead>
                <tr>
                  <th>Team</th>
                  <th>Status</th>
                  <th>Incomplete</th>
                  <th>Next Game</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="coaching-dash-list"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- The Coaching Settings tab's field/option vocabulary and read-only
       renderer — shared with teams/team.js's Coaching tab so a team's
       settings read the same way in both places. -->
  <script src="/coaching-config.js"></script>

  <script>
    const TEAMS = {
      ATL: "Atlanta Hawks", BKN: "Brooklyn Nets", BOS: "Boston Celtics",
      CHA: "Charlotte Hornets", CHI: "Chicago Bulls", CLE: "Cleveland Cavaliers",
      DAL: "Dallas Mavericks", DEN: "Denver Nuggets", DET: "Detroit Pistons",
      GSW: "Golden State Warriors", HOU: "Houston Rockets", IND: "Indiana Pacers",
      LAC: "LA Clippers", LAL: "Los Angeles Lakers", MEM: "Memphis Grizzlies",
      MIA: "Miami Heat", MIL: "Milwaukee Bucks", MIN: "Minnesota Timberwolves",
      NOP: "New Orleans Pelicans", NYK: "New York Knicks", OKC: "Oklahoma City Thunder",
      ORL: "Orlando Magic", PHI: "Philadelphia 76ers", PHX: "Phoenix Suns",
      POR: "Portland Trail Blazers", SAC: "Sacramento Kings", SAS: "San Antonio Spurs",
      TOR: "Toronto Raptors", UTA: "Utah Jazz", WAS: "Washington Wizards",
    };
    const DAYS   = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    const MONTHS_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

    // Pagination is counted in games, not dates, and only ever cuts on a date
    // boundary — a full season is ~1,200 rows across ~170 dates, which is too
    // much DOM at once, but a team's 82 games land inside one page so the
    // filtered view (the common case) never shows a "load more" at all.
    const PAGE = 160;

    let seasons    = [];    // [{season, games}] from /api/schedule/seasons
    let season     = null;
    let games      = [];    // the selected season's fixtures, date order
    let results    = new Map();  // "date|AWAY|HOME" → box score row for the same fixture
    let teamFilter = '';
    let scope      = 'upcoming';
    let shown      = PAGE;
    let me         = { name: null, roles: [] };
    let nextId     = null;  // first unplayed game in the current view, set by render()
    let coachingSettings = {};  // team abbr -> record, from GET /api/coaching-settings
    let streamingDays = {};  // "YYYY-MM-DD" -> {done, done_at, done_by, youtube_url, ...}, from GET /api/streaming-days

    const storedToken = () => localStorage.getItem('nbn_token');
    // `admin` implicitly satisfies any role check server-side, so the button
    // has to appear for an admin too or the page would hide an action the API
    // would have allowed. Gates both claiming a game as streamer and flagging
    // one as a stream — same role, two independent actions — and the whole
    // page below the header, since this page exists only for that role.
    const isStreamerRole = () => me.roles.includes('streamer') || me.roles.includes('admin');

    // ── Coaching Settings tab ────────────────────────────────────────

    async function loadCoachingDashboard() {
      try {
        coachingSettings = await fetch('/api/coaching-settings').then(r => r.ok ? r.json() : {});
      } catch (e) {
        coachingSettings = {};
      }
      renderCoachingDashboard();
    }

    function coachingRowMeta(team) {
      const rec = coachingSettings[team];
      if (!rec) return { status: 'none', label: 'No settings saved' };
      if (rec.pending) return { status: 'pending', label: 'Pending entry' };
      return { status: 'entered', label: 'Entered' };
    }

    // The earliest not-yet-played game a team has in the currently loaded
    // season (`games`/`resultFor` are the Claim Games tab's own state,
    // shared across tabs on this page). Null once a team's slate is done for
    // the loaded season, or before a season has loaded at all.
    function nextGameFor(team) {
      const upcoming = games.filter(g => (g.home_team === team || g.away_team === team) && !resultFor(g));
      if (!upcoming.length) return null;
      upcoming.sort((a, b) => a.date.localeCompare(b.date) || tipKey(a.time_et) - tipKey(b.time_et));
      return upcoming[0];
    }

    function renderCoachingDashboard() {
      const list = document.getElementById('coaching-dash-list');
      list.innerHTML = '';

      // Soonest next game first — that's the order a streamer actually needs
      // to work down. Pending/entered/none is now only the tiebreaker, for
      // teams with the same next-game date or none at all.
      const order = { pending: 0, entered: 1, none: 2 };
      const teams = Object.keys(TEAMS).sort((a, b) => {
        const ga = nextGameFor(a), gb = nextGameFor(b);
        if (ga && gb) {
          const cmp = ga.date.localeCompare(gb.date) || tipKey(ga.time_et) - tipKey(gb.time_et);
          if (cmp) return cmp;
        } else if (ga || gb) {
          return ga ? -1 : 1; // a team with a next game sorts before one with none
        }
        const ma = coachingRowMeta(a), mb = coachingRowMeta(b);
        if (order[ma.status] !== order[mb.status]) return order[ma.status] - order[mb.status];
        const ra = coachingSettings[a], rb = coachingSettings[b];
        const ta = (ra && (ra.updated_at || '')) || '';
        const tb = (rb && (rb.updated_at || '')) || '';
        return tb.localeCompare(ta);
      });

      teams.forEach(team => {
        const [row, detailRow] = coachingDashRow(team);
        list.appendChild(row);
        list.appendChild(detailRow);
      });

      const pendingCount = teams.filter(team => coachingRowMeta(team).status === 'pending').length;
      const badge = document.getElementById('coaching-tab-badge');
      badge.textContent = pendingCount;
      badge.hidden = pendingCount === 0;
    }

    // Returns [row, detailRow] — a normal row plus a hidden full-width detail
    // row toggled by the View button, since a <tr> can't grow a child panel
    // the way a flex row (see Days tab below) can.
    function coachingDashRow(team) {
      const rec = coachingSettings[team] || null;
      const meta = coachingRowMeta(team);
      const rowEl = document.createElement('tr');
      rowEl.className = 'cd-trow';

      const tdTeam = document.createElement('td');
      tdTeam.className = 'cd-team-cell';
      tdTeam.appendChild(logo(team));
      tdTeam.appendChild(teamLink(team));
      rowEl.appendChild(tdTeam);

      // Status is a dot, not a text badge — the label plus who/when saved
      // and entered lives in its title tooltip.
      const tdStatus = document.createElement('td');
      const dot = span('cd-dot ' + meta.status);
      let statusTitle = meta.label;
      if (rec) {
        const savedWhen = rec.updated_at ? new Date(rec.updated_at).toLocaleString() : 'unknown';
        statusTitle += ` — saved ${savedWhen} by ${rec.updated_by || 'unknown'}`;
        if (rec.entered_at) {
          statusTitle += ` · entered ${new Date(rec.entered_at).toLocaleString()} by ${rec.entered_by}`;
        }
      }
      dot.title = statusTitle;
      tdStatus.appendChild(dot);
      rowEl.appendChild(tdStatus);

      // A save is never blocked on an incomplete point-buy pool or minutes
      // grid (the team shouldn't lose partial work over one slider), so this
      // is the streamer's warning that what they're about to enter isn't
      // internally consistent — computed the same way team.js's edit form
      // warns the team that saved it, off the same shared helper.
      const tdIncomplete = document.createElement('td');
      if (rec && window.CoachingSettings) {
        const issues = window.CoachingSettings.validityIssues(rec);
        if (issues.length) {
          const flag = span('cd-incomplete-flag', '⚠');
          flag.title = 'Incomplete: ' + issues.join(' · ');
          tdIncomplete.appendChild(flag);
        }
      }
      rowEl.appendChild(tdIncomplete);

      const tdNext = document.createElement('td');
      const nextGame = nextGameFor(team);
      if (nextGame) {
        const opp = nextGame.home_team === team ? nextGame.away_team : nextGame.home_team;
        const at = nextGame.home_team === team ? 'vs' : '@';
        tdNext.appendChild(span('cd-when', `${fmtShort(nextGame.date)} ${at} ${opp}`));
      }
      rowEl.appendChild(tdNext);

      const detailRow = document.createElement('tr');
      detailRow.className = 'cd-detail-row';
      detailRow.hidden = true;
      const detailTd = document.createElement('td');
      detailTd.colSpan = 5;
      const detail = div('cd-detail');
      detailTd.appendChild(detail);
      detailRow.appendChild(detailTd);

      const tdActions = document.createElement('td');
      tdActions.className = 'cd-actions';

      const viewBtn = document.createElement('button');
      viewBtn.className = 'cd-btn';
      viewBtn.textContent = 'View';
      viewBtn.onclick = () => {
        const showing = !detailRow.hidden;
        if (showing) { detailRow.hidden = true; viewBtn.textContent = 'View'; return; }
        if (window.CoachingSettings) {
          window.CoachingSettings.renderReadOnly(detail, rec, {});
        } else {
          detail.textContent = 'Coaching settings vocabulary unavailable — /coaching-config.js failed to load.';
        }
        detailRow.hidden = false;
        viewBtn.textContent = 'Hide';
      };
      tdActions.appendChild(viewBtn);

      if (rec && rec.pending) {
        const enterBtn = document.createElement('button');
        enterBtn.className = 'cd-btn';
        enterBtn.textContent = 'Mark entered';
        enterBtn.onclick = () => markEntered(team, rec, enterBtn);
        tdActions.appendChild(enterBtn);
      }
      rowEl.appendChild(tdActions);

      return [rowEl, detailRow];
    }

    async function markEntered(team, rec, btn) {
      btn.disabled = true;
      const token = storedToken();
      try {
        const r = await fetch(`/api/coaching-settings/${team}/enter`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) },
          body: JSON.stringify({ expected_updated_at: rec.updated_at }),
        });
        if (r.status === 409) {
          // Trust the server's copy rather than patching it locally — the team
          // saved again since this dashboard loaded, which is exactly what the
          // 409 is for. Refresh so the streamer sees the version they'd
          // actually be entering.
          alert('These settings changed since the dashboard loaded. Refreshing the list.');
          await loadCoachingDashboard();
          return;
        }
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          alert(`Error: ${err.detail || r.status}`);
          btn.disabled = false;
          return;
        }
        const updated = await r.json();
        coachingSettings[team] = updated;
        renderCoachingDashboard();
      } catch (e) {
        alert('Network error');
        btn.disabled = false;
      }
    }

    // ── Day slate controls ──────────────────────────────────────────────
    //
    // Inline on each day divider in Claim Games, not a separate tab: `done`
    // and the YouTube link are attributes of the whole date's slate, not any
    // one game, but the divider row is exactly that — one row per date,
    // already sitting above the date's games. `done` is one shared flag per
    // date (whoever marks it is stamped, not who's allowed to) and the
    // YouTube link is independent of it — same shapes
    // routers/streaming_days.py enforces server-side.

    async function loadStreamingDays() {
      try {
        streamingDays = await fetch('/api/streaming-days').then(r => r.ok ? r.json() : {});
      } catch (e) {
        streamingDays = {};
      }
      render();
    }

    function daySlateControls(date) {
      const rec = streamingDays[date] || null;
      const done = !!(rec && rec.done);
      const wrap = div('day-slate');

      const toggleBtn = document.createElement('button');
      toggleBtn.className = 'cd-btn';
      toggleBtn.textContent = done ? 'Undo' : 'Mark day done';
      toggleBtn.onclick = () => (done ? unmarkDayDone(date, toggleBtn) : markDayDone(date, toggleBtn));
      wrap.appendChild(toggleBtn);
      if (done) wrap.appendChild(span('day-meta', `done by ${rec.done_by}`));

      // YouTube link — independent of done, so it's editable whether or not
      // the day is marked.
      const ytInput = document.createElement('input');
      ytInput.type = 'text';
      ytInput.className = 'day-yt-input';
      ytInput.placeholder = 'YouTube VOD link';
      ytInput.value = (rec && rec.youtube_url) || '';
      const ytBtn = document.createElement('button');
      ytBtn.className = 'cd-btn';
      ytBtn.textContent = 'Save';
      const ytStatus = span('day-meta');
      ytBtn.onclick = () => saveYoutubeUrl(date, ytInput, ytBtn, ytStatus);
      wrap.appendChild(ytInput);
      wrap.appendChild(ytBtn);
      wrap.appendChild(ytStatus);
      if (rec && rec.youtube_url) {
        const openLink = document.createElement('a');
        openLink.href = rec.youtube_url;
        openLink.target = '_blank';
        openLink.rel = 'noopener';
        openLink.textContent = '▶️';
        openLink.title = 'Open the linked video';
        wrap.appendChild(openLink);
      }

      return wrap;
    }

    async function markDayDone(date, btn) {
      btn.disabled = true;
      const token = storedToken();
      try {
        const r = await fetch(`/api/streaming-days/${date}/done`, {
          method: 'POST',
          headers: token ? { Authorization: `Bearer ${token}` } : {},
        });
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          alert(`Error: ${err.detail || r.status}`);
          btn.disabled = false;
          return;
        }
        streamingDays[date] = await r.json();
        render();
      } catch (e) {
        alert('Network error');
        btn.disabled = false;
      }
    }

    async function unmarkDayDone(date, btn) {
      btn.disabled = true;
      const token = storedToken();
      try {
        const r = await fetch(`/api/streaming-days/${date}/done`, {
          method: 'DELETE',
          headers: token ? { Authorization: `Bearer ${token}` } : {},
        });
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          alert(`Error: ${err.detail || r.status}`);
          btn.disabled = false;
          return;
        }
        streamingDays[date] = await r.json();
        render();
      } catch (e) {
        alert('Network error');
        btn.disabled = false;
      }
    }

    async function saveYoutubeUrl(date, input, btn, statusEl) {
      btn.disabled = true;
      statusEl.textContent = 'Saving…';
      const token = storedToken();
      try {
        const r = await fetch(`/api/streaming-days/${date}/youtube`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) },
          body: JSON.stringify({ url: input.value.trim() || null }),
        });
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          statusEl.textContent = `Error: ${err.detail || r.status}`;
          btn.disabled = false;
          return;
        }
        streamingDays[date] = await r.json();
        render();
      } catch (e) {
        statusEl.textContent = 'Network error';
        btn.disabled = false;
      }
    }

    // ── Helpers ──────────────────────────────────────────────────────

    // "7:00p" → minutes past midnight. Mirrors _time_key in
    // nbn-api/routers/schedule.py; times come from the NBA and are always ET.
    function tipKey(t) {
      const m = /^(\d{1,2}):(\d{2})([ap])$/.exec(t || '');
      if (!m) return 9999;
      let hh = +m[1] % 12;
      if (m[3] === 'p') hh += 12;
      return hh * 60 + (+m[2]);
    }

    function fmtTime(t)      { return t ? `${t}m ET` : 'TBD'; }
    function monthKey(d)     { return d.slice(0, 7); }
    function fmtMonth(ym)    { const [y, m] = ym.split('-'); return `${MONTHS[+m - 1]} ${y}`; }
    function fmtDayHdr(d)    { const dt = new Date(d + 'T00:00:00'); return `${DAYS[dt.getDay()]}, ${MONTHS_SHORT[dt.getMonth()]} ${dt.getDate()}`; }
    function fmtShort(d)     { const dt = new Date(d + 'T00:00:00'); return `${MONTHS_SHORT[dt.getMonth()]} ${dt.getDate()}`; }
    function fmtSeason(s)    { const [a, b] = s.split('-'); return `20${a}-${b}`; }

    // A fixture is "played" when a box score exists for the same matchup on the
    // same date — /api/schedule is the plan and nothing retracts a row once the
    // result lands. Deliberately not a date comparison: the sim runs behind the
    // real calendar (a season's games are simmed over months), so "in the past"
    // and "already played" are different questions, and only this one is right.
    function resultFor(g) { return results.get(`${g.date}|${g.away_team}|${g.home_team}`); }

    function teamGames()  { return teamFilter ? games.filter(g => g.home_team === teamFilter || g.away_team === teamFilter) : games; }
    function visible()    { const l = teamGames(); return scope === 'upcoming' ? l.filter(g => !resultFor(g)) : l; }

    function logo(abbr) {
      const img = document.createElement('img');
      img.className = 'g-logo';
      img.src = `/logos/logo-${abbr.toLowerCase()}.png`;
      img.alt = '';
      img.onerror = () => { img.style.display = 'none'; };
      return img;
    }

    function teamLink(abbr) {
      const a = document.createElement('a');
      a.href = `/teams/${abbr.toLowerCase()}/`;
      a.textContent = abbr;
      a.title = TEAMS[abbr] || abbr;
      return a;
    }

    function div(cls, text) {
      const d = document.createElement('div');
      d.className = cls;
      if (text !== undefined) d.textContent = text;
      return d;
    }

    function span(cls, text) {
      const s = document.createElement('span');
      s.className = cls;
      if (text !== undefined) s.textContent = text;
      return s;
    }

    function renderGate() {
      const g = document.getElementById('gate');
      g.innerHTML = '';
      const wrap = div('gate');
      const h = document.createElement('h2');
      h.textContent = 'This page is for the streamer role';
      wrap.appendChild(h);
      const p = document.createElement('p');
      p.textContent = me.name
        ? "Your member account doesn't hold the streamer role, so there's nothing to do here."
        : "Sign in on nbn.today in this browser and you're signed in here automatically, or paste your member token via the profile menu.";
      wrap.appendChild(p);
      const a = document.createElement('a');
      a.href = '/calendar';
      a.textContent = '← Back to the calendar';
      wrap.appendChild(a);
      g.appendChild(wrap);
    }

    // ── Streamer claims & stream flag ────────────────────────────────
    //
    // Two independent things live on a game: `streamer` (who's claimed to
    // broadcast it — one name, or none) and `stream` (whether the game itself
    // is flagged as a stream). A game can have either, neither, or both.

    let toastTimer = null;
    function toast(msg, bad) {
      document.querySelectorAll('.toast').forEach(t => t.remove());
      const el = div('toast' + (bad ? ' bad' : ''), msg);
      document.body.appendChild(el);
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.remove(), 4000);
    }

    // The row is rebuilt in place rather than re-rendering the list, so a claim
    // made halfway down a 160-row page doesn't move the page under the cursor.
    function replaceRow(g, num, oldRow) {
      const fresh = makeRow(g, num);
      oldRow.replaceWith(fresh);
      return fresh;
    }

    async function setClaim(g, num, rowEl, claiming) {
      const token = storedToken();
      const url = `/api/schedule/${g.id}/streamer?season=${encodeURIComponent(season)}`;
      rowEl.querySelectorAll('button').forEach(b => { b.disabled = true; });
      try {
        const r = await fetch(url, {
          method: claiming ? 'POST' : 'DELETE',
          headers: token ? { Authorization: `Bearer ${token}` } : {},
        });
        if (!r.ok) {
          const detail = await r.json().then(j => j.detail).catch(() => null);
          throw new Error(detail || `HTTP ${r.status}`);
        }
        // Trust the server's copy rather than patching it locally — someone
        // else may have claimed the same game in between, and a 409 is exactly
        // how that arrives.
        const updated = await r.json();
        g.streamer = updated.streamer || null;
        replaceRow(g, num, rowEl);
      } catch (e) {
        rowEl.querySelectorAll('button').forEach(b => { b.disabled = false; });
        toast(claiming ? `Could not claim that game: ${e.message}`
                       : `Could not drop that claim: ${e.message}`, true);
      }
    }

    async function setStreamFlag(g, num, rowEl, marking) {
      const token = storedToken();
      const url = `/api/schedule/${g.id}/stream?season=${encodeURIComponent(season)}`;
      rowEl.querySelectorAll('button').forEach(b => { b.disabled = true; });
      try {
        const r = await fetch(url, {
          method: marking ? 'POST' : 'DELETE',
          headers: token ? { Authorization: `Bearer ${token}` } : {},
        });
        if (!r.ok) {
          const detail = await r.json().then(j => j.detail).catch(() => null);
          throw new Error(detail || `HTTP ${r.status}`);
        }
        const updated = await r.json();
        g.stream = !!updated.stream;
        replaceRow(g, num, rowEl);
      } catch (e) {
        rowEl.querySelectorAll('button').forEach(b => { b.disabled = false; });
        toast(marking ? `Could not flag that game as a stream: ${e.message}`
                      : `Could not clear that stream flag: ${e.message}`, true);
      }
    }

    // ── URL state ────────────────────────────────────────────────────

    function syncUrl() {
      const p = new URLSearchParams();
      if (season) p.set('season', season);
      if (teamFilter) p.set('team', teamFilter);
      if (scope !== 'upcoming') p.set('scope', scope);
      const q = p.toString();
      history.replaceState(null, '', q ? `?${q}` : location.pathname);
    }

    // ── Rendering ────────────────────────────────────────────────────

    function makeRow(g, num) {
      const row = document.createElement('tr');
      row.className = 'game-row';
      const res = resultFor(g);
      if (res) row.classList.add('played');

      const tdNum = document.createElement('td');
      tdNum.className = 'gt-num';
      if (teamFilter && num) tdNum.textContent = num;
      row.appendChild(tdNum);

      const tdTime = document.createElement('td');
      tdTime.className = 'gt-time';
      tdTime.textContent = fmtTime(g.time_et);
      row.appendChild(tdTime);

      const tdMatch = document.createElement('td');
      const match = span('g-match');
      if (teamFilter) {
        // A team's own schedule reads from its side: "vs OPP" at home, "@ OPP"
        // on the road, rather than the neutral away-at-home ordering below.
        const home = g.home_team === teamFilter;
        const opp  = home ? g.away_team : g.home_team;
        match.appendChild(span('g-at', home ? 'vs' : '@'));
        match.appendChild(logo(opp));
        match.appendChild(teamLink(opp));
      } else {
        match.appendChild(logo(g.away_team));
        match.appendChild(teamLink(g.away_team));
        match.appendChild(span('g-at', '@'));
        match.appendChild(logo(g.home_team));
        match.appendChild(teamLink(g.home_team));
      }
      tdMatch.appendChild(match);
      if (g.note) tdMatch.appendChild(span('g-note', g.note));
      row.appendChild(tdMatch);

      const tdArena = document.createElement('td');
      tdArena.className = 'gt-arena';
      tdArena.textContent = g.arena || '';
      row.appendChild(tdArena);

      // One streamer per game, so one chip. `mine` also gates the × — a BOD
      // member can drop someone else's claim, but through the API rather than
      // a button that sits next to 29 other people's names.
      const tdStreamer = document.createElement('td');
      tdStreamer.className = 'gt-streamer';
      const held = g.streamer || null;
      if (held) {
        const chip = span('streamer-chip' + (held === me.name ? ' mine' : ''));
        chip.appendChild(document.createTextNode(`📺 ${held}`));
        if (held === me.name) {
          const x = document.createElement('button');
          x.className = 'chip-x';
          x.textContent = '×';
          x.title = 'Drop as streamer';
          x.onclick = () => setClaim(g, num, row, false);
          chip.appendChild(x);
        }
        tdStreamer.appendChild(chip);
      } else if (!res) {
        // No claim button on a game already played.
        const btn = document.createElement('button');
        btn.className = 'g-claim';
        btn.textContent = 'claim';
        btn.title = 'Claim this game as streamer';
        btn.setAttribute('aria-label', `Claim ${g.away_team} at ${g.home_team} as streamer`);
        btn.onclick = () => setClaim(g, num, row, true);
        tdStreamer.appendChild(btn);
      }
      row.appendChild(tdStreamer);

      // Independent of who (if anyone) is claimed as streamer: whether the
      // game itself is flagged as a stream. Anyone with the streamer role can
      // mark or unmark it, not just whoever (if anyone) holds the claim.
      const tdStream = document.createElement('td');
      tdStream.className = 'gt-stream';
      if (g.stream) tdStream.appendChild(span('stream-badge', '📡 Stream'));
      if (!res) {
        const btn2 = document.createElement('button');
        btn2.className = 'g-stream-btn';
        btn2.textContent = g.stream ? 'unflag' : 'stream';
        btn2.title = g.stream ? 'Remove the stream flag from this game' : 'Flag this game as a stream';
        btn2.setAttribute('aria-label',
          `${g.stream ? 'Remove stream flag from' : 'Flag'} ${g.away_team} at ${g.home_team}${g.stream ? '' : ' as a stream'}`);
        btn2.onclick = () => setStreamFlag(g, num, row, !g.stream);
        tdStream.appendChild(btn2);
      }
      row.appendChild(tdStream);

      const tdResult = document.createElement('td');
      tdResult.className = 'gt-result right';
      if (res) {
        const link = document.createElement('a');
        link.className = 'g-score';
        link.href = `/boxscores/?date=${g.date}`;
        if (teamFilter) {
          // The row already reads from this team's side ("vs OPP"), so an
          // away–home score beside it would be ambiguous. Score it their way.
          const own = g.home_team === teamFilter ? +res.home_score : +res.away_score;
          const opp = g.home_team === teamFilter ? +res.away_score : +res.home_score;
          link.textContent = `${own > opp ? 'W' : 'L'} ${own}–${opp}`;
          link.classList.add(own > opp ? 'win' : 'loss');
        } else {
          link.textContent = `${res.away_score}–${res.home_score}`;
        }
        tdResult.appendChild(link);
      } else if (g.id === nextId && scope === 'all') {
        tdResult.appendChild(span('g-next', 'next'));
      }
      row.appendChild(tdResult);

      return row;
    }

    function dividerRow(cls, text) {
      const tr = document.createElement('tr');
      tr.className = cls;
      const td = document.createElement('td');
      td.colSpan = 7;
      td.textContent = text;
      tr.appendChild(td);
      return tr;
    }

    // The day divider carries the date label plus that date's day-slate
    // controls (mark done / VOD link) — on every date, not just ones with a
    // claimed or flagged game, since any streamer should be able to mark a
    // night done or drop a VOD link regardless of who (if anyone) claimed
    // what that night.
    function dayRowEl(date) {
      const tr = document.createElement('tr');
      tr.className = 'day-row';
      const td = document.createElement('td');
      td.colSpan = 7;
      const inner = div('day-row-inner');
      inner.appendChild(span('day-row-label', fmtDayHdr(date)));
      inner.appendChild(daySlateControls(date));
      td.appendChild(inner);
      tr.appendChild(td);
      return tr;
    }

    function render() {
      const list = document.getElementById('list');
      const more = document.getElementById('more');
      const tableWrap = document.getElementById('games-table-wrap');
      const emptyEl = document.getElementById('list-empty');
      list.innerHTML = '';
      more.innerHTML = '';

      const rows = visible();
      if (!rows.length) {
        tableWrap.hidden = true;
        emptyEl.hidden = false;
        emptyEl.textContent = emptyMessage();
        renderSummary();
        return;
      }
      tableWrap.hidden = false;
      emptyEl.hidden = true;

      // Game numbers are the team's place in its own full season, so they stay
      // stable when the Upcoming filter hides the games already played.
      const numbers = new Map();
      if (teamFilter) teamGames().forEach((g, i) => numbers.set(g.id, i + 1));

      // The first unplayed game in the current view, marked NEXT.
      nextId = (rows.find(g => !resultFor(g)) || {}).id;

      let count = 0, lastMonth = null, lastDate = null;
      for (const g of rows) {
        if (count >= shown && g.date !== lastDate) break;
        if (g.date !== lastDate) {
          const ym = monthKey(g.date);
          if (ym !== lastMonth) { list.appendChild(dividerRow('month-row', fmtMonth(ym))); lastMonth = ym; }
          list.appendChild(dayRowEl(g.date));
          lastDate = g.date;
        }
        list.appendChild(makeRow(g, numbers.get(g.id)));
        count++;
      }

      if (count < rows.length) {
        const wrap = document.createElement('div');
        wrap.className = 'more-wrap';
        const btn = document.createElement('button');
        btn.className = 'more-btn';
        btn.textContent = `Show more (${rows.length - count} game${rows.length - count === 1 ? '' : 's'} left)`;
        btn.onclick = () => { shown += PAGE; render(); };
        wrap.appendChild(btn);
        more.appendChild(wrap);
      }

      renderSummary();
    }

    function emptyMessage() {
      const label = fmtSeason(season);
      if (!games.length) return `No schedule on file for ${label}.`;
      if (scope === 'upcoming') {
        return teamFilter
          ? `Every ${TEAMS[teamFilter]} game in ${label} has been played.`
          : `Every game in ${label} has been played.`;
      }
      return teamFilter ? `No ${TEAMS[teamFilter]} games in ${label}.` : `No games in ${label}.`;
    }

    function renderSummary() {
      const el = document.getElementById('summary');
      el.innerHTML = '';
      if (!teamFilter || !games.length) return;

      const mine   = teamGames();
      const home   = mine.filter(g => g.home_team === teamFilter).length;
      const played = mine.filter(g => resultFor(g)).length;
      const next   = mine.find(g => !resultFor(g));

      const add = (label, value, dim) => {
        const s = span(dim ? 'dim' : '');
        s.appendChild(document.createTextNode(label ? `${label} ` : ''));
        const b = document.createElement('b');
        b.textContent = value;
        s.appendChild(b);
        el.appendChild(s);
      };

      const head = span('');
      const b = document.createElement('b');
      b.textContent = TEAMS[teamFilter];
      head.appendChild(b);
      el.appendChild(head);
      add('', `${mine.length} games`);
      add('', `${home} home · ${mine.length - home} away`);
      if (played) add('played', `${played}`, true);
      if (next) {
        const at = next.home_team === teamFilter ? 'vs' : '@';
        const opp = next.home_team === teamFilter ? next.away_team : next.home_team;
        add('next', `${fmtShort(next.date)} ${at} ${opp}`, true);
      }
    }

    function renderControls() {
      const seasonSel = document.getElementById('season-sel');
      seasonSel.innerHTML = '';
      seasons.forEach(s => {
        const o = document.createElement('option');
        o.value = s.season;
        o.textContent = `${fmtSeason(s.season)} season`;
        seasonSel.appendChild(o);
      });
      seasonSel.value = season;

      const teamSel = document.getElementById('team-sel');
      teamSel.innerHTML = '';
      const all = document.createElement('option');
      all.value = '';
      all.textContent = 'All teams';
      teamSel.appendChild(all);
      Object.keys(TEAMS).forEach(abbr => {
        const o = document.createElement('option');
        o.value = abbr;
        o.textContent = TEAMS[abbr];
        teamSel.appendChild(o);
      });
      teamSel.value = teamFilter;

      document.querySelectorAll('#scope-seg button').forEach(b =>
        b.classList.toggle('active', b.dataset.scope === scope));
    }

    // ── Data ─────────────────────────────────────────────────────────

    async function loadSeason(s) {
      season = s;
      shown = PAGE;
      document.getElementById('list').innerHTML = '';
      document.getElementById('games-table-wrap').hidden = true;
      const loadingEl = document.getElementById('list-empty');
      loadingEl.hidden = false;
      loadingEl.textContent = 'Loading…';
      document.getElementById('more').innerHTML = '';

      const [schedRes, boxRes] = await Promise.allSettled([
        fetch(`/api/schedule?season=${encodeURIComponent(s)}`).then(r => r.json()),
        fetch(`/api/boxscores/games?season=${encodeURIComponent(s)}`).then(r => r.json()),
      ]);

      let source = '';
      if (schedRes.status === 'fulfilled') {
        games = (schedRes.value.games || []).slice()
          .sort((a, b) => a.date.localeCompare(b.date) || tipKey(a.time_et) - tipKey(b.time_et)
                          || a.home_team.localeCompare(b.home_team));
        source = schedRes.value.source || '';
      } else {
        games = [];
      }

      results = new Map();
      if (boxRes.status === 'fulfilled') {
        (boxRes.value || []).forEach(r => results.set(`${r.date}|${r.away_team}|${r.home_team}`, r));
      }

      const upcoming = games.filter(g => !resultFor(g)).length;
      document.getElementById('sub').textContent = games.length
        ? `${games.length.toLocaleString()} games in ${fmtSeason(season)} · ${upcoming.toLocaleString()} still to play`
        : `No schedule on file for ${fmtSeason(season)}.`;
      document.getElementById('source').textContent = source ? `Source: ${source}` : '';

      renderControls();
      render();
      syncUrl();
      // The Coaching Settings tab sorts off `games`, which just changed — a
      // fetch that resolved before this season loaded rendered against an
      // empty list, so re-render now that there's something to sort by.
      renderCoachingDashboard();
    }

    // Who is looking. Always 200, empty when signed out, and it accepts the
    // .nbn.today session cookie as well as the token — so this works on
    // pdc.nbn.today, where there is no localStorage token to find.
    async function loadMe() {
      const token = storedToken();
      try {
        me = await fetch('/api/auth/me', {
          headers: token ? { Authorization: `Bearer ${token}` } : {},
        }).then(r => r.json());
        me.roles = me.roles || [];
      } catch (e) {
        me = { name: null, roles: [] };
      }
    }

    async function init() {
      const p = new URLSearchParams(location.search);
      const wantTeam = (p.get('team') || '').toUpperCase();
      if (TEAMS[wantTeam]) teamFilter = wantTeam;
      if (p.get('scope') === 'all') scope = 'all';

      await loadMe();
      if (!isStreamerRole()) { renderGate(); return; }
      document.getElementById('app').hidden = false;

      document.querySelectorAll('.tab').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          document.querySelectorAll('.tab-panel').forEach(tp => tp.classList.add('hidden'));
          btn.classList.add('active');
          document.getElementById('tab-' + btn.dataset.tab).classList.remove('hidden');
        });
      });

      loadCoachingDashboard();
      loadStreamingDays();

      try {
        seasons = await fetch('/api/schedule/seasons').then(r => r.json());
      } catch (e) {
        seasons = [];
      }
      if (!Array.isArray(seasons) || !seasons.length) {
        document.getElementById('sub').textContent = 'No schedule has been loaded yet.';
        document.getElementById('list').innerHTML =
          '<div class="empty">No season schedule is on file. Once one is loaded it shows up here.</div>';
        return;
      }
      // Newest first — the season anyone is asking about is almost always the
      // one being played now.
      seasons.sort((a, b) => b.season.localeCompare(a.season));

      const wantSeason = p.get('season');
      const chosen = seasons.some(s => s.season === wantSeason) ? wantSeason : seasons[0].season;

      document.getElementById('season-sel').onchange = e => loadSeason(e.target.value);
      document.getElementById('team-sel').onchange = e => {
        teamFilter = e.target.value;
        shown = PAGE;
        render();
        syncUrl();
      };
      document.querySelectorAll('#scope-seg button').forEach(btn => {
        btn.onclick = () => {
          scope = btn.dataset.scope;
          shown = PAGE;
          renderControls();
          render();
          syncUrl();
        };
      });

      await loadSeason(chosen);
    }

    init();
  </script>

  <script src="/nav.js"></script>
  <script src="/token-badge.js"></script>
</body>
</html>

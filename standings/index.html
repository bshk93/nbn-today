<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="/theme-boot.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/shared.css">
  <title>Standings — NBN</title>
  <!-- NBN:og -->
  <meta name="description" content="NBN standings season by season, with every playoff bracket.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NBN">
  <meta property="og:title" content="Standings — NBN">
  <meta property="og:description" content="NBN standings season by season, with every playoff bracket.">
  <meta property="og:url" content="https://nbn.today/standings/">
  <meta property="og:image" content="https://nbn.today/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Nothing But Net — fantasy basketball GM simulation league">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0d0e11">
  <link rel="icon" href="/icons/favicon.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <!-- /NBN:og -->
  <style>

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .controls label { font-size: 0.85rem; color: var(--text-muted); }
    .post-status { font-size: var(--text-xs); color: var(--text-muted); }

    select {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      font-size: 0.875rem;
      cursor: pointer;
    }

    select:focus { outline: none; border-color: var(--link); }

    /* Standings tables */
    /* minmax(0, 1fr), not 1fr: a 1fr column never shrinks below its content,
       so two ten-column tables pushed the West off the right edge. Side by
       side only once both fit; stacked below that. */
    .conferences {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: var(--space-5);
    }

    @media (min-width: 1200px) { .conferences { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

    .table-wrap {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    thead th {
      padding: 0.6rem 0.75rem;
      text-align: left;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }

    tbody tr { border-bottom: 1px solid var(--border-subtle); transition: background 0.1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--bg-hover); }

    td { padding: 0.55rem 0.75rem; color: var(--text-secondary); }
    td.seed { color: var(--text-muted); font-size: 0.78rem; width: 2rem; }
    td.team { font-weight: 600; color: var(--text-primary); }
    td.team a { display: inline-flex; align-items: center; gap: 0.4rem; }
    .team-logo { width: 20px; height: 20px; object-fit: contain; flex-shrink: 0; }
    td.right { text-align: right; font-variant-numeric: tabular-nums; }
    td.muted { color: var(--text-muted); }
    td.result { padding-right: 0.75rem; }

    .result-badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      letter-spacing: 0.03em;
    }

    .result-champion   { background: var(--gold-chip-border); color: var(--gold); }
    .result-runnerup   { background: var(--bg-card); color: var(--text-muted); border: 1px solid var(--border); }
    .result-conffinals { background: var(--market-positive-bg); color: var(--market-positive-light); }
    .result-second     { background: var(--bg-card); color: var(--accent-light); }
    .result-first      { background: var(--purple-light-bg); color: var(--purple-light); }

    /* Playoff Odds */
    .odds-intro { font-size: var(--text-sm); color: var(--text-muted); margin: 0 0 var(--space-4); }
    .odds-row { cursor: pointer; }
    .odds-row[aria-expanded="true"] { background: var(--bg-hover); }
    /* The playoff column tinted by its own value: one hue, stronger = likelier. */
    td.odds-main {
      font-weight: 700; color: var(--text-primary);
      background: color-mix(in srgb, var(--accent) calc(var(--odds) * 28%), transparent);
    }
    .odds-move { margin-left: 0.35rem; font-size: 0.68rem; font-weight: 600; font-family: var(--font-mono); }
    .odds-move.up { color: var(--market-positive); }
    .odds-move.down { color: var(--danger); }
    td.strong { color: var(--text-primary); font-weight: 600; }
    .odds-chart-row td { padding: var(--space-3) var(--space-4) var(--space-4); background: var(--bg-hover); white-space: normal; }
    .odds-chart { position: relative; max-width: 640px; }
    .odds-chart svg { width: 100%; height: auto; display: block; }
    .odds-grid { stroke: var(--border-subtle); stroke-width: 1; }
    .odds-axis { fill: var(--text-muted); font-size: 10px; }
    .odds-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .odds-dot { fill: var(--accent); stroke: var(--bg-hover); stroke-width: 2; }
    .odds-hair { stroke: var(--text-muted); stroke-width: 1; }
    .odds-tip {
      position: absolute; top: 0; transform: translateX(-50%); pointer-events: none; white-space: nowrap;
      padding: 0.25rem 0.5rem; border-radius: 6px; font-size: var(--text-xs);
      background: var(--bg-card); border: 1px solid var(--border); color: var(--text-secondary);
    }
    .odds-tip strong { color: var(--text-primary); }
    .odds-chart-empty { font-size: var(--text-sm); color: var(--text-muted); }
    .odds-how { margin-top: var(--space-5); font-size: var(--text-sm); color: var(--text-secondary); max-width: 46rem; }
    .odds-how summary { cursor: pointer; color: var(--link); }
    .odds-how p { margin: var(--space-2) 0 0; line-height: 1.55; }

    /* Bracket */
    #bracket-content { overflow-x: auto; }

    .bracket-container {
      display: grid;
      grid-template-rows: auto 1fr 1fr;
      min-width: 560px;
    }

    .bracket-round-label {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-align: center;
      padding-bottom: 0.5rem;
    }

    .bracket-round-cell {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .bracket-round-cell .series-card { width: 100%; }

    .bracket-connector { overflow: visible; }

    .bracket-finals-cell {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .series-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .series-card-pending {
      border-color: var(--bg-card);
      border-style: dashed;
      min-height: 52px;
    }

    .series-team {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.4rem 0.65rem;
      font-size: 0.82rem;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-subtle);
    }

    .series-team:last-child { border-bottom: none; }

    .series-team.winner {
      color: var(--text-primary);
      font-weight: 600;
      background: var(--bg-hover);
    }

    .series-team.champion { background: var(--gold-bg); color: var(--gold); font-weight: 700; }

    .series-team .team-name { flex: 1; }

    .series-team .seed-badge {
      font-size: 0.68rem;
      color: var(--text-dim);
      margin-right: 0.3rem;
    }
    .series-team .bracket-logo {
      width: 18px; height: 18px; object-fit: contain; flex-shrink: 0; margin-right: 0.3rem;
    }

    .series-team.winner .seed-badge { color: var(--text-muted); }

    .series-team .wins {
      font-size: 0.78rem;
      font-variant-numeric: tabular-nums;
      color: var(--text-dim);
      min-width: 1.2rem;
      text-align: right;
    }

    .series-team.winner .wins { color: var(--link); }

    .finals-card { border-color: var(--text-dim); }
    .finals-card .series-team.champion .wins { color: var(--gold); }

    #status { text-align: center; padding: 3rem; color: var(--text-muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="page ui-page ui-page--wide">
    <nav class="nav"></nav>

    <header class="ui-header">
      <h1 class="ui-title">Standings &amp; Playoffs</h1>
    </header>

    <div class="ui-tabs" role="tablist">
      <button class="ui-tab active" role="tab" aria-selected="true" data-tab="standings">Standings</button>
      <button class="ui-tab" role="tab" aria-selected="false" data-tab="odds">Playoff Odds</button>
      <button class="ui-tab" role="tab" aria-selected="false" data-tab="playoffs">Playoffs</button>
    </div>

    <div class="tab-panel active" id="tab-standings">
      <div class="controls">
        <label for="season-select">Season</label>
        <select id="season-select"></select>
        <button class="ui-btn ui-btn--sm" id="post-discord" hidden>Post to Discord</button>
        <span class="post-status" id="post-status"></span>
      </div>
      <div id="standings-content"><div id="status">Loading…</div></div>
    </div>

    <div class="tab-panel" id="tab-odds">
      <div id="odds-content"><div id="status">Loading…</div></div>
    </div>

    <div class="tab-panel" id="tab-playoffs">
      <div class="controls">
        <label for="bracket-season-select">Season</label>
        <select id="bracket-season-select"></select>
      </div>
      <div id="bracket-content"><div id="status">Loading…</div></div>
    </div>
  </div>

  <script>
    // ── Tab logic ─────────────────────────────────────────────────────────────
    // #odds opens on a tab, so the homepage can link straight to it.
    function showTab(name) {
      const btn = document.querySelector(`.ui-tab[data-tab="${name}"]`);
      if (!btn) return;
      document.querySelectorAll('.ui-tab').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected', 'false'); });
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active'); btn.setAttribute('aria-selected', 'true');
      document.getElementById('tab-' + name).classList.add('active');
      if (name === 'odds') loadOdds();
    }
    document.querySelectorAll('.ui-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        showTab(btn.dataset.tab);
        history.replaceState(null, '', btn.dataset.tab === 'standings' ? location.pathname : '#' + btn.dataset.tab);
      });
    });

    // ── Playoff Odds tab ──────────────────────────────────────────────────────
    //
    // Draws GET /api/playoff-odds, which a timer recomputes (the model is in
    // nbn-api/routers/playoff_odds.py). The page does no simulating. A row
    // opens to that team's playoff chances over the season, from
    // GET /api/playoff-odds/history?team=.
    let oddsLoaded = false;
    function loadOdds() {
      if (oddsLoaded) return;
      oddsLoaded = true;
      const el = document.getElementById('odds-content');
      fetch('/api/playoff-odds')
        .then(r => (r.ok ? r.json() : null))
        .catch(() => null)
        .then(data => {
          if (!data) {
            el.innerHTML = '<div id="status">Playoff odds start once the season’s schedule is out.</div>';
            return;
          }
          renderOdds(el, data);
        });
    }

    const pct = v => v >= 0.995 ? '>99%' : v > 0 && v < 0.005 ? '<1%' : v === 0 ? '—' : Math.round(v * 100) + '%';
    const shortDay = iso => new Date(iso + 'T12:00:00Z').toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });

    function renderOdds(el, data) {
      const teamName = t => (typeof TEAM_LIST !== 'undefined' && TEAM_LIST[t]) || t;
      el.innerHTML = '';
      const intro = document.createElement('p');
      intro.className = 'odds-intro';
      intro.textContent = `Updated ${shortDay(data.date)} · ${data.sims.toLocaleString()} simulated seasons · `
        + (data.games_played ? `${data.games_played} of ${data.games_played + data.games_left} games played`
                             : 'before opening night, so these come from the rosters alone');
      el.appendChild(intro);

      const grid = document.createElement('div');
      grid.className = 'conferences';
      el.appendChild(grid);
      const COLS = [['', ''], ['Team', ''], ['W–L', 'right'], ['Proj', 'right'], ['Playoffs', 'right'],
                    ['Top 6', 'right'], ['Play-in', 'right'], ['#1 seed', 'right'], ['Finals', 'right'], ['Title', 'right']];
      ['East', 'West'].forEach(conf => {
        const rows = data.teams.filter(r => r.conf === conf)
          .sort((a, b) => b.playoffs - a.playoffs || b.proj_w - a.proj_w);
        const box = document.createElement('div');
        const h = document.createElement('h2');
        h.className = 'ui-section-title';
        h.textContent = `${conf}ern Conference`;
        box.appendChild(h);
        const wrap = document.createElement('div');
        wrap.className = 'table-wrap';
        const table = document.createElement('table');
        table.className = 'odds-table';
        const hr = table.createTHead().insertRow();
        COLS.forEach(([label, cls]) => {
          const th = document.createElement('th');
          th.textContent = label;
          if (cls) th.className = cls;
          hr.appendChild(th);
        });
        const body = table.createTBody();
        rows.forEach((r, i) => {
          const tr = body.insertRow();
          tr.className = 'odds-row';
          tr.tabIndex = 0;
          tr.setAttribute('aria-expanded', 'false');
          tr.title = 'Show this team’s odds over the season';
          const td = (text, cls) => { const c = tr.insertCell(); if (text != null) c.textContent = text; if (cls) c.className = cls; return c; };
          td(String(i + 1), 'seed');
          const team = td(null, 'team');
          const a = document.createElement('a');
          a.href = `/teams/${r.team}/`;
          a.title = teamName(r.team);
          const img = document.createElement('img');
          img.className = 'team-logo';
          img.src = `/logos/sm/logo-${r.team.toLowerCase()}.webp`;
          img.alt = '';
          a.append(img, document.createTextNode(r.team));
          a.addEventListener('click', e => e.stopPropagation());
          team.appendChild(a);
          td(`${r.w}–${r.l}`, 'right muted');
          td(`${Math.round(r.proj_w)}–${Math.round(r.games - r.proj_w)}`, 'right');
          const po = td(null, 'right odds-main');
          po.style.setProperty('--odds', r.playoffs);
          po.appendChild(document.createTextNode(pct(r.playoffs)));
          const prev = data.prev && data.prev[r.team];
          if (prev != null) {
            const d = Math.round((r.playoffs - prev) * 100);
            if (d) {
              const m = document.createElement('span');
              m.className = 'odds-move ' + (d > 0 ? 'up' : 'down');
              m.textContent = (d > 0 ? '▲' : '▼') + Math.abs(d);
              m.title = `${d > 0 ? 'Up' : 'Down'} ${Math.abs(d)} points since ${shortDay(data.prev_date)}`;
              po.appendChild(m);
            }
          }
          td(pct(r.top6), 'right');
          td(pct(r.play_in), 'right muted');
          td(pct(r.seed1), 'right');
          td(pct(r.finals), 'right');
          td(pct(r.title), 'right strong');

          const open = () => toggleOddsChart(tr, r.team, COLS.length);
          tr.addEventListener('click', open);
          tr.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
        });
        wrap.appendChild(table);
        box.appendChild(wrap);
        grid.appendChild(box);
      });

      const how = document.createElement('details');
      how.className = 'odds-how';
      how.innerHTML = '<summary>How these are worked out</summary>'
        + '<p>Every night the server plays out the rest of the season 5,000 times, then the play-in and the playoffs. '
        + 'Each game’s odds come from the two teams’ strength plus home court (worth about 2 points). '
        + 'Before the season, strength comes from each roster’s OVRs. As games are played it moves to the team’s real point '
        + 'differential, so after about a dozen games the results count for more than the roster.</p>'
        + '<p><b>Playoffs</b> is a top-6 finish or winning a way in through the play-in. <b>Finals</b> is winning the conference. '
        + 'Ties in the standings are broken by coin flip, not the league’s tiebreakers. The arrows show the change since the day before.</p>';
      el.appendChild(how);
    }

    // One team's playoff odds over the season: a single 2px line, 0–100%,
    // with a crosshair that snaps to the nearest day.
    function toggleOddsChart(tr, team, span) {
      const next = tr.nextElementSibling;
      if (next && next.classList.contains('odds-chart-row')) {
        next.remove();
        tr.setAttribute('aria-expanded', 'false');
        return;
      }
      tr.setAttribute('aria-expanded', 'true');
      const row = document.createElement('tr');
      row.className = 'odds-chart-row';
      const cell = row.insertCell();
      cell.colSpan = span;
      cell.textContent = 'Loading…';
      tr.after(row);
      fetch(`/api/playoff-odds/history?team=${encodeURIComponent(team)}`)
        .then(r => (r.ok ? r.json() : []))
        .catch(() => [])
        .then(points => {
          cell.textContent = '';
          if (points.length < 2) {
            const p = document.createElement('div');
            p.className = 'odds-chart-empty';
            p.textContent = points.length
              ? `${pct(points[0].playoffs)} on ${shortDay(points[0].date)}. The chart fills in as the season is played.`
              : 'No history yet.';
            cell.appendChild(p);
            return;
          }
          cell.appendChild(oddsChart(team, points));
        });
    }

    function oddsChart(team, points) {
      const NS = 'http://www.w3.org/2000/svg';
      const W = 640, H = 160, P = { t: 12, r: 12, b: 22, l: 36 };
      const x = i => P.l + i * (W - P.l - P.r) / (points.length - 1);
      const y = v => P.t + (1 - v) * (H - P.t - P.b);
      const mk = (tag, attrs, text) => {
        const e = document.createElementNS(NS, tag);
        Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v));
        if (text != null) e.textContent = text;
        return e;
      };
      const wrap = document.createElement('div');
      wrap.className = 'odds-chart';
      const svg = mk('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img',
        'aria-label': `${team} playoff odds over the season, now ${pct(points[points.length - 1].playoffs)}` });
      [0, 0.5, 1].forEach(v => {
        svg.appendChild(mk('line', { x1: P.l, x2: W - P.r, y1: y(v), y2: y(v), class: 'odds-grid' }));
        svg.appendChild(mk('text', { x: P.l - 6, y: y(v) + 3, 'text-anchor': 'end', class: 'odds-axis' }, `${v * 100}%`));
      });
      [0, points.length - 1].forEach(i => svg.appendChild(mk('text', {
        x: x(i), y: H - 6, 'text-anchor': i ? 'end' : 'start', class: 'odds-axis' }, shortDay(points[i].date))));
      svg.appendChild(mk('polyline', { class: 'odds-line',
        points: points.map((p, i) => `${x(i)},${y(p.playoffs)}`).join(' ') }));
      const last = points.length - 1;
      svg.appendChild(mk('circle', { cx: x(last), cy: y(points[last].playoffs), r: 4, class: 'odds-dot' }));

      // Crosshair + tooltip, snapped to the nearest day.
      const hair = mk('line', { y1: P.t, y2: H - P.b, class: 'odds-hair', visibility: 'hidden' });
      const hov = mk('circle', { r: 4, class: 'odds-dot', visibility: 'hidden' });
      svg.append(hair, hov);
      const tip = document.createElement('div');
      tip.className = 'odds-tip';
      tip.hidden = true;
      const hit = mk('rect', { x: P.l, y: 0, width: W - P.l - P.r, height: H, fill: 'transparent' });
      svg.appendChild(hit);
      const show = clientX => {
        const box = svg.getBoundingClientRect();
        const sx = (clientX - box.left) * W / box.width;
        const i = Math.max(0, Math.min(last, Math.round((sx - P.l) / ((W - P.l - P.r) / last))));
        const p = points[i];
        [hair].forEach(l => { l.setAttribute('x1', x(i)); l.setAttribute('x2', x(i)); l.setAttribute('visibility', 'visible'); });
        hov.setAttribute('cx', x(i)); hov.setAttribute('cy', y(p.playoffs)); hov.setAttribute('visibility', 'visible');
        tip.hidden = false;
        tip.textContent = '';
        const v = document.createElement('strong');
        v.textContent = pct(p.playoffs);
        tip.append(v, document.createTextNode(` · ${shortDay(p.date)} · title ${pct(p.title)}`));
        tip.style.left = `${x(i) / W * 100}%`;
      };
      const hide = () => { hair.setAttribute('visibility', 'hidden'); hov.setAttribute('visibility', 'hidden'); tip.hidden = true; };
      hit.addEventListener('pointermove', e => show(e.clientX));
      hit.addEventListener('pointerleave', hide);
      wrap.append(svg, tip);
      return wrap;
    }

    if (location.hash === '#odds') showTab('odds');

    // ── CSV parser ────────────────────────────────────────────────────────────
    // ── Standings tab ─────────────────────────────────────────────────────────
    const RESULT_ORDER = ['Champion', 'Runner-Up', 'Conf Finals', 'Second Round', 'First Round', 'Missed'];

    function resultBadge(result) {
      if (!result || result === 'Missed') return '';
      const cls = {
        'Champion':    'result-champion',
        'Runner-Up':   'result-runnerup',
        'Conf Finals': 'result-conffinals',
        'Second Round':'result-second',
        'First Round': 'result-first',
      }[result] || '';
      const label = {
        'Champion':    '🏆 Champion',
        'Runner-Up':   'Runner-Up',
        'Conf Finals': 'Conf Finals',
        'Second Round':'2nd Round',
        'First Round': '1st Round',
      }[result] || result;
      return `<span class="result-badge ${cls}">${label}</span>`;
    }

    function gb(leaderW, leaderL, w, l) {
      const diff = ((leaderW - w) + (l - leaderL)) / 2;
      return diff === 0 ? '—' : diff.toFixed(1);
    }

    function renderConference(rows, confName) {
      const leaderW = +rows[0].W, leaderL = +rows[0].L;
      const wrap = document.createElement('div');
      wrap.className = 'conf-block';
      const h2 = document.createElement('h2');
      h2.className = 'ui-section-title';
      h2.textContent = confName;
      wrap.appendChild(h2);
      const tableWrap = document.createElement('div');
      tableWrap.className = 'table-wrap';
      const tbl = document.createElement('table');
      tbl.innerHTML = `<thead><tr>
        <th></th><th>Team</th>
        <th class="right">W</th><th class="right">L</th>
        <th class="right">PCT</th><th class="right">GB</th>
        <th class="right">PPG</th><th class="right">OPPG</th>
        <th class="right">+/−</th><th></th>
      </tr></thead>`;
      const tbody = document.createElement('tbody');
      rows.forEach(row => {
        const tr = document.createElement('tr');
        const seedNum = row.SEED_NUM || row.SEED.replace(/\D/g, '');
        const pct = (+row.PCT).toFixed(3).replace(/^0/, '');
        tr.innerHTML = `
          <td class="seed">${seedNum}</td>
          <td class="team"><a href="/teams/${row.TEAM.toLowerCase()}/"><img class="team-logo" src="/logos/sm/logo-${row.TEAM.toLowerCase()}.webp" alt="" onerror="this.style.display='none'">${row.TEAM}</a></td>
          <td class="right">${row.W}</td>
          <td class="right">${row.L}</td>
          <td class="right">${pct}</td>
          <td class="right muted">${gb(leaderW, leaderL, +row.W, +row.L)}</td>
          <td class="right">${(+row.PPG).toFixed(1)}</td>
          <td class="right">${(+row.OPPG).toFixed(1)}</td>
          <td class="right">${(+row.DIFF) >= 0 ? '+' : ''}${(+row.DIFF).toFixed(1)}</td>
          <td class="result">${resultBadge(row.PLAYOFF_RESULT)}</td>`;
        tbody.appendChild(tr);
      });
      tbl.appendChild(tbody);
      tableWrap.appendChild(tbl);
      wrap.appendChild(tableWrap);
      return wrap;
    }

    function renderStandings(rows, season) {
      const seasonRows = rows.filter(r => r.SEASON === season);
      const east = seasonRows.filter(r => r.SEED.startsWith('East')).sort((a, b) => +a.SEED_NUM - +b.SEED_NUM);
      const west = seasonRows.filter(r => r.SEED.startsWith('West')).sort((a, b) => +a.SEED_NUM - +b.SEED_NUM);
      const content = document.getElementById('standings-content');
      content.innerHTML = '';
      const grid = document.createElement('div');
      grid.className = 'conferences';
      grid.appendChild(renderConference(east, 'Eastern Conference'));
      grid.appendChild(renderConference(west, 'Western Conference'));
      content.appendChild(grid);
    }

    // ── Bracket tab ───────────────────────────────────────────────────────────
    const ROUND_LABELS = { '1': 'First Round', '2': 'Conference Semifinals', '3': 'Conference Finals', '4': 'Finals' };

    function seedConf(seed) {
      if (!seed) return '';
      return seed.startsWith('East') ? 'E' : 'W';
    }

    function seedNum(seed) {
      return seed ? seed.replace(/\D/g, '') : '';
    }

    function seriesCard(series, isChampSeries) {
      const card = document.createElement('div');
      card.className = 'series-card' + (isChampSeries ? ' finals-card' : '');

      [
        { team: series.T1, seed: series.T1_SEED, wins: +series.T1_W, seedNum: +series.T1_SEED_NUM || 99 },
        { team: series.T2, seed: series.T2_SEED, wins: +series.T2_W, seedNum: +series.T2_SEED_NUM || 99 },
      ].sort((a, b) => a.seedNum - b.seedNum).forEach(({ team, seed, wins }) => {
        const isWinner = team === series.WINNER;
        const isChamp = isChampSeries && isWinner;
        const row = document.createElement('div');
        row.className = 'series-team' + (isWinner ? (isChamp ? ' champion' : ' winner') : '');

        const seedSpan = document.createElement('span');
        seedSpan.className = 'seed-badge';
        seedSpan.textContent = seedConf(seed) + seedNum(seed);

        const nameSpan = document.createElement('span');
        nameSpan.className = 'team-name';
        const nameLink = document.createElement('a');
        nameLink.href = `/teams/${team.toLowerCase()}/`;
        nameLink.textContent = team;
        nameSpan.appendChild(nameLink);

        const winsSpan = document.createElement('span');
        winsSpan.className = 'wins';
        winsSpan.textContent = wins;

        const logoImg = document.createElement('img');
        logoImg.className = 'bracket-logo';
        logoImg.src = `/logos/sm/logo-${team.toLowerCase()}.webp`;
        logoImg.alt = '';
        logoImg.onerror = function() { this.style.display = 'none'; };

        row.appendChild(seedSpan);
        row.appendChild(logoImg);
        row.appendChild(nameSpan);
        row.appendChild(winsSpan);
        card.appendChild(row);
      });

      return card;
    }

    function makeConnectorSVG(nLeft, nRight) {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 0 100 100');
      svg.setAttribute('preserveAspectRatio', 'none');
      svg.style.cssText = 'width:100%;height:100%;display:block';
      for (let i = 0; i < nRight; i++) {
        const topY = (2 * i + 0.5) / nLeft * 100;
        const botY = (2 * i + 1.5) / nLeft * 100;
        const midY = (i + 0.5) / nRight * 100;
        const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        p.setAttribute('d', `M0,${topY}L50,${topY}L50,${botY}L0,${botY}M50,${midY}L100,${midY}`);
        p.setAttribute('stroke', 'var(--border)');
        p.setAttribute('stroke-width', '1.5');
        p.setAttribute('fill', 'none');
        p.setAttribute('vector-effect', 'non-scaling-stroke');
        svg.appendChild(p);
      }
      return svg;
    }

    function makeRoundCell(series, isChamp) {
      const cell = document.createElement('div');
      cell.className = 'bracket-round-cell';
      series.forEach(s => {
        const wrap = document.createElement('div');
        wrap.style.cssText = 'flex:1;display:flex;align-items:center';
        wrap.appendChild(seriesCard(s, isChamp));
        cell.appendChild(wrap);
      });
      return cell;
    }

    function makePlaceholderCell(count) {
      const cell = document.createElement('div');
      cell.className = 'bracket-round-cell';
      for (let i = 0; i < count; i++) {
        const wrap = document.createElement('div');
        wrap.style.cssText = 'flex:1;display:flex;align-items:center';
        const card = document.createElement('div');
        card.className = 'series-card series-card-pending';
        wrap.appendChild(card);
        cell.appendChild(wrap);
      }
      return cell;
    }

    function renderBracket(rows, season) {
      const content = document.getElementById('bracket-content');
      content.innerHTML = '';

      const seasonRows = rows.filter(r => r.SEASON === season);
      if (!seasonRows.length) {
        content.innerHTML = '<div id="status">No playoff data for this season.</div>';
        return;
      }

      // Total rounds comes from ROUND_LABELS so in-progress seasons don't
      // misidentify the last available round as the Finals.
      const totalRounds = Math.max(...Object.keys(ROUND_LABELS).map(Number));
      const champRoundKey = String(totalRounds);
      const nonChampRoundKeys = Array.from({length: totalRounds - 1}, (_, i) => String(i + 1));
      const finalsCol = nonChampRoundKeys.length * 2 + 1;

      const container = document.createElement('div');
      container.className = 'bracket-container';
      container.style.gridTemplateColumns = Array.from(
        {length: finalsCol}, (_, i) => i % 2 === 0 ? '1fr' : '28px'
      ).join(' ');

      const isEast = s => s.T1_SEED?.startsWith('East') || s.T2_SEED?.startsWith('East');
      const isWest = s => s.T1_SEED?.startsWith('West') || s.T2_SEED?.startsWith('West');

      // Round-1 canonical sort key: sort by whichever of seeds 1/4/3/2 is in the series.
      // This gives the bracket order 1v_, 4v_, 3v_, 2v_ regardless of who the opponent is
      // (opponent may be 5–10 depending on the season's play-in format).
      function r1BracketKey(s) {
        const minS = Math.min(+s.T1_SEED_NUM || 99, +s.T2_SEED_NUM || 99);
        if (minS === 1) return 0;
        if (minS === 4) return 1;
        if (minS === 3) return 2;
        if (minS === 2) return 3;
        return 99;
      }

      // Pre-sort round 1 for each conference, then tag every team with its bracket half
      // (0 = top half: positions 0–1; 1 = bottom half: positions 2–3).
      // This lets us correctly sort round-2+ series even after upsets leave no 1/2/3/4-seed
      // in a matchup (e.g. a 5v9 or 7v8 round-2 series).
      const r1Rows = seasonRows.filter(r => r.ROUND === '1');
      const eastR1 = r1Rows.filter(isEast).sort((a, b) => r1BracketKey(a) - r1BracketKey(b));
      const westR1 = r1Rows.filter(isWest).sort((a, b) => r1BracketKey(a) - r1BracketKey(b));
      const bracketHalf = new Map(); // team name → 0 (top) or 1 (bottom)
      [eastR1, westR1].forEach(r1 => {
        r1.forEach((s, i) => {
          bracketHalf.set(s.T1, i < 2 ? 0 : 1);
          bracketHalf.set(s.T2, i < 2 ? 0 : 1);
        });
      });

      function sortSeries(a, b, rnd) {
        if (rnd === '1') return r1BracketKey(a) - r1BracketKey(b);
        // For round 2+, both teams in a series come from the same bracket half;
        // use min() as a fallback in case only one team appears in the half map.
        const halfA = Math.min(bracketHalf.get(a.T1) ?? 1, bracketHalf.get(a.T2) ?? 1);
        const halfB = Math.min(bracketHalf.get(b.T1) ?? 1, bracketHalf.get(b.T2) ?? 1);
        if (halfA !== halfB) return halfA - halfB;
        // Tiebreaker (reseeded brackets where teams crossed halves): better seed first.
        const minSA = Math.min(+a.T1_SEED_NUM || 99, +a.T2_SEED_NUM || 99);
        const minSB = Math.min(+b.T1_SEED_NUM || 99, +b.T2_SEED_NUM || 99);
        return minSA - minSB;
      }

      // Infer expected series count for a round from the nearest earlier round with data.
      function inferCount(roundKey, isConfFn) {
        for (let r = +roundKey; r >= 1; r--) {
          const n = seasonRows.filter(row => row.ROUND === String(r)).filter(isConfFn).length;
          if (n) return Math.max(1, Math.round(n / Math.pow(2, +roundKey - r)));
        }
        return 1;
      }

      nonChampRoundKeys.forEach((rnd, i) => {
        const col = i * 2 + 1;
        const roundSeries = seasonRows.filter(r => r.ROUND === rnd);
        const east = roundSeries.filter(isEast).sort((a, b) => sortSeries(a, b, rnd));
        const west = roundSeries.filter(isWest).sort((a, b) => sortSeries(a, b, rnd));

        const label = document.createElement('div');
        label.className = 'bracket-round-label';
        label.textContent = ROUND_LABELS[rnd] || `Round ${rnd}`;
        label.style.cssText = `grid-column:${col};grid-row:1`;
        container.appendChild(label);

        const eastCell = east.length ? makeRoundCell(east, false) : makePlaceholderCell(inferCount(rnd, isEast));
        eastCell.style.cssText = `grid-column:${col};grid-row:2`;
        container.appendChild(eastCell);

        const westCell = west.length ? makeRoundCell(west, false) : makePlaceholderCell(inferCount(rnd, isWest));
        westCell.style.cssText = `grid-column:${col};grid-row:3`;
        container.appendChild(westCell);

        const connCol = col + 1;
        const isLastNonChamp = i === nonChampRoundKeys.length - 1;

        if (!isLastNonChamp) {
          const nextRnd = nonChampRoundKeys[i + 1];
          const curEast = east.length || inferCount(rnd, isEast);
          const curWest = west.length || inferCount(rnd, isWest);
          const nextEast = inferCount(nextRnd, isEast);
          const nextWest = inferCount(nextRnd, isWest);

          const ec = document.createElement('div');
          ec.className = 'bracket-connector';
          ec.style.cssText = `grid-column:${connCol};grid-row:2`;
          ec.appendChild(makeConnectorSVG(curEast, nextEast));
          container.appendChild(ec);

          const wc = document.createElement('div');
          wc.className = 'bracket-connector';
          wc.style.cssText = `grid-column:${connCol};grid-row:3`;
          wc.appendChild(makeConnectorSVG(curWest, nextWest));
          container.appendChild(wc);
        } else {
          const fc = document.createElement('div');
          fc.className = 'bracket-connector';
          fc.style.cssText = `grid-column:${connCol};grid-row:2/4`;
          fc.appendChild(makeConnectorSVG(2, 1));
          container.appendChild(fc);
        }
      });

      const finalsLabel = document.createElement('div');
      finalsLabel.className = 'bracket-round-label';
      finalsLabel.textContent = ROUND_LABELS[champRoundKey] || 'Finals';
      finalsLabel.style.cssText = `grid-column:${finalsCol};grid-row:1`;
      container.appendChild(finalsLabel);

      const champSeries = seasonRows.filter(r => r.ROUND === champRoundKey);
      const finalsCell = document.createElement('div');
      finalsCell.className = 'bracket-finals-cell';
      finalsCell.style.cssText = `grid-column:${finalsCol};grid-row:2/4`;
      if (champSeries.length) {
        champSeries.forEach(s => finalsCell.appendChild(seriesCard(s, true)));
      } else {
        const card = document.createElement('div');
        card.className = 'series-card series-card-pending';
        card.style.width = '100%';
        finalsCell.appendChild(card);
      }
      container.appendChild(finalsCell);

      content.appendChild(container);
    }

    // ── Init ──────────────────────────────────────────────────────────────────
    async function init() {
      const [standRes, bracketRes] = await Promise.all([
        fetch('/standings/standings-history.csv'),
        fetch('/standings/playoff-brackets.csv'),
      ]);

      if (!standRes.ok || !bracketRes.ok) {
        document.getElementById('status').textContent = 'Failed to load data.';
        return;
      }

      const standRows   = parseCSV(await standRes.text());
      const bracketRows = parseCSV(await bracketRes.text());

      // Populate standings season selector
      const seasons = [...new Set(standRows.map(r => r.SEASON))].sort().reverse();
      const sel = document.getElementById('season-select');
      seasons.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s; opt.textContent = s;
        sel.appendChild(opt);
      });

      // Populate bracket season selector (only seasons with bracket data)
      const bracketSeasons = [...new Set(bracketRows.map(r => r.SEASON))].sort().reverse();
      const bsel = document.getElementById('bracket-season-select');
      bracketSeasons.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s; opt.textContent = s;
        bsel.appendChild(opt);
      });

      renderStandings(standRows, seasons[0]);
      if (bracketSeasons.length) renderBracket(bracketRows, bracketSeasons[0]);

      sel.addEventListener('change', () => renderStandings(standRows, sel.value));
      bsel.addEventListener('change', () => renderBracket(bracketRows, bsel.value));
    }

    // ── Post to Discord (admin) ───────────────────────────────────────────────
    // Announces the selected season's standings to #stats-and-standings.
    async function setupDiscordPost() {
      const token = localStorage.getItem('nbn_token');
      if (!token) return;
      const me = await fetch('/api/me', { headers: { Authorization: `Bearer ${token}` } })
        .then(r => r.ok ? r.json() : null).catch(() => null);
      if (!me?.roles?.includes('admin')) return;
      const btn = document.getElementById('post-discord');
      const status = document.getElementById('post-status');
      const sel = document.getElementById('season-select');
      btn.hidden = false;
      btn.addEventListener('click', async () => {
        const season = sel.value;
        if (!await confirmDialog({ title: `Post ${season} standings to Discord?`,
                                   body: 'Posts to #stats-and-standings.', confirmLabel: 'Post' })) return;
        btn.disabled = true;
        status.style.color = '';
        status.textContent = 'Posting…';
        try {
          const res = await fetch(`/api/admin/discord/post-standings?season=${encodeURIComponent(season)}`,
            { method: 'POST', headers: { Authorization: `Bearer ${token}` } });
          const body = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(body.detail || `HTTP ${res.status}`);
          status.style.color = 'var(--success)';
          status.textContent = `Posted ${season}.`;
        } catch (e) {
          status.style.color = 'var(--danger)';
          status.textContent = e.message;
        } finally {
          btn.disabled = false;
        }
      });
    }

    init();
    setupDiscordPost();
  </script>
  <script src="/nav.js"></script>
  <script src="/token-badge.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/logo.png">
  <link rel="stylesheet" href="/css/shared.css">
  <title>Proposals — NBN</title>
  <!-- NBN:og -->
  <meta name="description" content="Rule proposals up for a vote in NBN.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NBN">
  <meta property="og:title" content="Proposals — NBN">
  <meta property="og:description" content="Rule proposals up for a vote in NBN.">
  <meta property="og:url" content="https://nbn.today/proposals/">
  <meta property="og:image" content="https://nbn.today/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Nothing But Net — fantasy basketball GM simulation league">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#111827">
  <!-- /NBN:og -->
  <style>
    .page { max-width: 860px; margin: 0 auto; }

    .top-bar { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 2rem; gap: 1rem; flex-wrap: wrap; }
    .top-bar h1 { font-size: 1.875rem; font-weight: 700; letter-spacing: -0.02em; }
    .top-bar p { color: var(--text-muted); margin-top: 0.35rem; font-size: 0.9rem; }

    .right-bar { display: flex; align-items: center; gap: 0.75rem; flex-shrink: 0; }
    .auth-label { font-size: 0.8rem; color: var(--text-muted); }
    .auth-name { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }

    button {
      font-family: inherit; cursor: pointer; border-radius: 6px;
      font-size: 0.8rem; font-weight: 500; padding: 0.35rem 0.8rem;
      border: 1px solid transparent; transition: background 0.1s;
    }
    .btn-primary { background: var(--accent-dark); border-color: var(--accent); color: var(--text-on-accent); }
    .btn-primary:hover { background: var(--accent-dark); }
    .btn-ghost { background: transparent; border-color: var(--border); color: var(--text-muted); }
    .btn-ghost:hover { background: var(--bg-card); color: var(--text-primary); }

    .section-label {
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--text-dim); margin-bottom: 0.75rem;
    }

    /* Tabs */
    .tabs {
      display: flex; gap: 0; margin-bottom: 1.25rem; border-bottom: 1px solid var(--border);
      overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      background: none; border: none; border-bottom: 2px solid transparent;
      color: var(--text-muted); padding: 0.5rem 1rem; font-size: 0.8rem; font-weight: 600;
      cursor: pointer; font-family: inherit; margin-bottom: -1px;
      letter-spacing: 0.02em; white-space: nowrap; flex-shrink: 0;
    }
    .tab:hover { color: var(--text-secondary); }
    .tab.active { color: var(--text-primary); border-bottom-color: var(--accent); }
    .tab-count { color: var(--text-dim); font-weight: 500; }
    .tab.active .tab-count { color: var(--text-muted); }

    @media (max-width: 480px) {
      .tab { padding: 0.5rem 0.6rem; font-size: 0.75rem; }
    }

    /* Proposal cards */
    .proposal-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .proposal-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
      padding: 1rem 1.25rem; display: flex; align-items: center; gap: 1rem;
      cursor: pointer; text-decoration: none; color: inherit;
      transition: border-color 0.1s, background 0.1s;
    }
    .proposal-card:hover { border-color: var(--text-dim); background: var(--bg-hover); text-decoration: none; }
    .proposal-card .card-body { flex: 1; min-width: 0; }
    .card-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 0.25rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-meta { font-size: 0.75rem; color: var(--text-muted); display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .card-meta .sep { color: var(--border); }

    .badge {
      display: inline-block; font-size: 0.65rem; font-weight: 700;
      letter-spacing: 0.07em; text-transform: uppercase; padding: 0.15rem 0.5rem;
      border-radius: 4px; flex-shrink: 0;
    }
    .badge-draft    { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-muted); }
    .badge-submitted { background: var(--accent-panel-bg); border: 1px solid var(--accent-dark); color: var(--accent-light); }
    .badge-voting   { background: #3b1f00; border: 1px solid var(--gold-dim); color: var(--gold); }
    .badge-closed   { background: #1a1f2e; border: 1px solid var(--border); color: var(--text-dim); }
    .badge-passed   { background: var(--success-dark-bg); border: 1px solid #16a34a; color: var(--success); }
    .badge-failed   { background: #3b1f1f; border: 1px solid var(--danger-border-strong); color: var(--danger); }

    .card-arrow { color: var(--border); font-size: 1.1rem; flex-shrink: 0; }
    .proposal-card:hover .card-arrow { color: var(--text-muted); }

    .section { margin-bottom: 2.5rem; }
    .empty { text-align: center; padding: 3rem 1rem; color: var(--text-dim); font-size: 0.9rem; }

    /* Auth modal */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      z-index: 100; align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
      padding: 1.5rem; width: 100%; max-width: 380px; margin: 1rem;
    }
    .modal h2 { font-size: 1rem; font-weight: 700; margin-bottom: 0.75rem; }
    .modal input {
      width: 100%; background: var(--bg-page); border: 1px solid var(--border); color: var(--text-primary);
      border-radius: 6px; padding: 0.5rem 0.75rem; font-size: 0.875rem;
      font-family: var(--font-mono); margin-bottom: 0.75rem;
    }
    .modal input:focus { outline: none; border-color: var(--accent); }
    .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; }
    .modal p.note { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.75rem; }
  </style>
</head>
<body>
<div class="page">
  <nav class="nav"></nav>

  <div class="top-bar">
    <div>
      <h1>Proposals</h1>
      <p>League proposals, discussion, and voting</p>
    </div>
    <div class="right-bar">
      <span class="auth-label" id="auth-label">Not signed in</span>
      <span class="auth-name" id="auth-name"></span>
      <button class="btn-ghost" id="btn-auth" onclick="openAuthModal()">Sign in</button>
      <a href="/proposals/new/" class="btn-primary" id="btn-new" style="display:none;padding:0.35rem 0.8rem;border-radius:6px;font-size:0.8rem;font-weight:500;background:var(--accent-dark);border:1px solid var(--accent);color:var(--text-on-accent);">+ New Proposal</a>
    </div>
  </div>

  <!-- My Drafts -->
  <div class="section" id="drafts-section" style="display:none;">
    <div class="section-label">My Drafts</div>
    <div class="proposal-list" id="drafts-list"></div>
  </div>

  <!-- Proposals -->
  <div class="section">
    <div class="tabs">
      <button class="tab active" data-tab="submitted" onclick="setTab('submitted')">Submitted <span class="tab-count" id="count-submitted"></span></button>
      <button class="tab" data-tab="voting" onclick="setTab('voting')">Voting <span class="tab-count" id="count-voting"></span></button>
      <button class="tab" data-tab="passed" onclick="setTab('passed')">Passed <span class="tab-count" id="count-passed"></span></button>
      <button class="tab" data-tab="failed" onclick="setTab('failed')">Failed <span class="tab-count" id="count-failed"></span></button>
      <button class="tab" data-tab="closed" onclick="setTab('closed')">Closed <span class="tab-count" id="count-closed"></span></button>
      <button class="tab" data-tab="all" onclick="setTab('all')">All <span class="tab-count" id="count-all"></span></button>
    </div>
    <div class="proposal-list" id="proposals-list">
      <div class="empty">Loading…</div>
    </div>
  </div>
</div>

<!-- Auth modal -->
<div class="modal-overlay" id="modal-overlay" onclick="closeAuthModal(event)">
  <div class="modal">
    <h2>Sign in with your token</h2>
    <p class="note">Your token is provided by the league admin. It's stored locally in your browser.</p>
    <input type="password" id="token-input" placeholder="Paste your token" autocomplete="off">
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeAuthModal()">Cancel</button>
      <button class="btn-primary" onclick="doSignIn()">Sign in</button>
    </div>
  </div>
</div>

<script>
const API = '/api';
let allProposals = [];
let currentTab = 'submitted';
let me = null; // { name, roles }

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function badge(p) {
  const key = p.outcome || p.status;
  const labels = { draft: 'Draft', submitted: 'Submitted', voting: 'Voting', closed: 'Closed', passed: 'Passed', failed: 'Failed' };
  return `<span class="badge badge-${key}">${labels[key] || key}</span>`;
}

function renderCard(p) {
  const el = document.createElement('a');
  el.className = 'proposal-card';
  el.href = `/proposals/view/?id=${p.id}`;
  const commentPart = p.comment_count > 0 ? `<span class="sep">•</span> 💬 ${p.comment_count}` : '';
  const votePart = (p.status === 'voting' && p.vote_count > 0)
    ? `<span class="sep">•</span> ${p.vote_count} vote${p.vote_count !== 1 ? 's' : ''}`
    : '';
  el.innerHTML = `
    <div class="card-body">
      <div class="card-title">${p.number ? `#${p.number} — ` : ''}${escHtml(p.title)}</div>
      <div class="card-meta">
        ${badge(p)}
        <span class="sep">•</span>
        <span>${escHtml(p.author)}</span>
        <span class="sep">•</span>
        <span>${fmtDate(p.submitted_at || p.created_at)}</span>
        ${commentPart}
        ${votePart}
      </div>
    </div>
    <span class="card-arrow">›</span>`;
  return el;
}

function renderDraftCard(p) {
  const el = document.createElement('a');
  el.className = 'proposal-card';
  el.href = `/proposals/new/?id=${p.id}`;
  el.innerHTML = `
    <div class="card-body">
      <div class="card-title">${escHtml(p.title || '(untitled draft)')}</div>
      <div class="card-meta">
        ${badge({status: 'draft'})}
        <span class="sep">•</span>
        <span>Last edited ${fmtDate(p.updated_at || p.created_at)}</span>
      </div>
    </div>
    <span class="card-arrow">›</span>`;
  return el;
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function setTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === tab);
  });
  renderProposals();
}

function matchesTab(p, tab) {
  if (tab === 'all') return true;
  if (tab === 'passed' || tab === 'failed') return p.outcome === tab;
  if (tab === 'closed') return p.status === 'closed' && !p.outcome;
  return p.status === tab;
}

function renderProposals() {
  const list = document.getElementById('proposals-list');
  const filtered = allProposals.filter(p => matchesTab(p, currentTab));
  list.innerHTML = '';
  if (!filtered.length) {
    list.innerHTML = `<div class="empty">No ${currentTab === 'all' ? '' : currentTab + ' '}proposals yet.</div>`;
    return;
  }
  filtered.forEach(p => list.appendChild(renderCard(p)));
}

function updateTabCounts() {
  ['submitted', 'voting', 'passed', 'failed', 'closed', 'all'].forEach(tab => {
    const el = document.getElementById(`count-${tab}`);
    if (el) el.textContent = `(${allProposals.filter(p => matchesTab(p, tab)).length})`;
  });
}

async function loadProposals() {
  const token = localStorage.getItem('nbn_token');
  const headers = token ? { Authorization: `Bearer ${token}` } : {};
  try {
    const res = await fetch(`${API}/proposals`, { headers });
    if (!res.ok) throw new Error('Failed');
    const data = await res.json();
    allProposals = data.proposals || [];
    updateTabCounts();
    renderProposals();

    const drafts = data.drafts || [];
    const draftsSection = document.getElementById('drafts-section');
    const draftsList = document.getElementById('drafts-list');
    if (drafts.length && me) {
      draftsSection.style.display = 'block';
      draftsList.innerHTML = '';
      drafts.forEach(p => draftsList.appendChild(renderDraftCard(p)));
    } else {
      draftsSection.style.display = 'none';
    }
  } catch {
    document.getElementById('proposals-list').innerHTML = '<div class="empty">Failed to load proposals.</div>';
  }
}

async function resolveToken(token) {
  try {
    const res = await fetch(`${API}/proposals`, { headers: { Authorization: `Bearer ${token}` } });
    if (!res.ok) return null;
    // The API returns proposals but we also need to know who we are.
    // Use /api/members/public to find our name from the token.
    const meRes = await fetch(`${API}/members/me`, { headers: { Authorization: `Bearer ${token}` } });
    if (meRes.ok) return await meRes.json();
    // Fallback: no /me endpoint, just mark as authenticated without name
    return { name: '(you)', roles: [] };
  } catch { return null; }
}

async function initAuth() {
  const token = localStorage.getItem('nbn_token');
  if (!token) { updateAuthUI(null); return; }
  // Resolve who we are via /api/members/me
  try {
    const res = await fetch(`${API}/members/me`, { headers: { Authorization: `Bearer ${token}` } });
    if (res.ok) {
      me = await res.json();
      updateAuthUI(me);
    } else {
      localStorage.removeItem('nbn_token');
      updateAuthUI(null);
    }
  } catch {
    // Can't reach /me — still show as logged in if token exists
    me = { name: '…', roles: [] };
    updateAuthUI(me);
  }
}

function updateAuthUI(info) {
  const label = document.getElementById('auth-label');
  const name = document.getElementById('auth-name');
  const btn = document.getElementById('btn-auth');
  const btnNew = document.getElementById('btn-new');
  if (info) {
    label.textContent = 'Signed in as';
    name.textContent = info.name;
    btn.textContent = 'Sign out';
    btn.onclick = doSignOut;
    btnNew.style.display = '';
  } else {
    label.textContent = 'Not signed in';
    name.textContent = '';
    btn.textContent = 'Sign in';
    btn.onclick = openAuthModal;
    btnNew.style.display = 'none';
  }
}

function openAuthModal() {
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('token-input').focus(), 50);
}

function closeAuthModal(e) {
  if (e && e.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.remove('open');
  document.getElementById('token-input').value = '';
}

async function doSignIn() {
  const token = document.getElementById('token-input').value.trim();
  if (!token) return;
  try {
    const res = await fetch(`${API}/members/me`, { headers: { Authorization: `Bearer ${token}` } });
    if (!res.ok) { toast('That token was not accepted.', true); return; }
    me = await res.json();
    localStorage.setItem('nbn_token', token);
    document.getElementById('modal-overlay').classList.remove('open');
    document.getElementById('token-input').value = '';
    updateAuthUI(me);
    loadProposals();
  } catch { toast('Could not sign in. Check your connection.', true); }
}

function doSignOut() {
  localStorage.removeItem('nbn_token');
  me = null;
  updateAuthUI(null);
  loadProposals();
}

// Keyboard: Enter in token input
document.getElementById('token-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSignIn();
  if (e.key === 'Escape') closeAuthModal();
});

(async () => {
  await initAuth();
  await loadProposals();
})();
</script>
  <script src="/nav.js"></script>
</body>
</html>

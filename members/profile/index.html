<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/logo.png">
  <link rel="stylesheet" href="/css/shared.css">
  <title>Member — NBN</title>
  <style>
    .page { max-width: 700px; margin: 0 auto; }

    :root { --accent: var(--text-primary); }
    .profile-name { font-size: 1.875rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 0.4rem; color: var(--accent); }
    .profile-meta { color: var(--text-muted); font-size: 0.9rem; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .team-badge {
      display: inline-block; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; padding: 0.15rem 0.5rem; border-radius: 4px;
      background: #1c2c1e; color: var(--success-light);
    }
    .team-badge a { color: inherit; }

    .balance-pill {
      display: inline-flex; align-items: center; gap: 0.6rem;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
      padding: 0.5rem 1rem; margin: 1.5rem 0 1.75rem;
    }
    .balance-label { color: var(--text-muted); font-size: 0.8rem; }
    .balance-amount { font-weight: 700; font-size: 1.05rem; color: #fde68a; }

    .section { margin-bottom: 2rem; }
    .section-title {
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 0.75rem;
      padding-bottom: 0.5rem; border-bottom: 1px solid var(--accent-muted, var(--bg-card));
    }

    /* Edit-your-profile drawer — shown only on your own page (isOwn), collapsed
       by default at the bottom of the page so it doesn't compete with the
       stats/tenure/achievements someone actually came here to see. Same
       cosmetics (name color, status text, avatar) + DOB editing as
       members/index.html's "Profile & Customization" bar, styled as a low-key
       settings drawer instead of a titled page section. */
    .profile-editor-bar {
      margin-top: 2.5rem; background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 8px; overflow: hidden;
    }
    .pe-toggle {
      width: 100%; display: flex; align-items: center; gap: 0.5rem;
      padding: 0.65rem 1rem; background: none; border: none; cursor: pointer;
      font-family: inherit; text-align: left; color: var(--text-muted);
    }
    .pe-toggle:hover { color: var(--text-secondary); }
    .pe-chevron { font-size: 0.65rem; transition: transform 0.15s; flex-shrink: 0; }
    .pe-toggle.open .pe-chevron { transform: rotate(90deg); }
    .pe-toggle-label { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
    .pe-content { display: none; flex-direction: column; gap: 0.6rem; padding: 0 1rem 0.9rem; }
    .pe-content.open { display: flex; }
    .pe-row { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .pe-label { color: var(--text-secondary); font-size: 0.875rem; display: flex; align-items: center; gap: 0.5rem; }
    .pe-input {
      background: var(--bg-page); border: 1px solid var(--border); color: var(--text-primary);
      border-radius: 5px; padding: 0.2rem 0.5rem; font-size: 0.8rem; font-family: inherit;
    }
    .pe-group-label { color: var(--text-muted); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
    .pe-hint { font-size: 0.78rem; color: var(--text-muted); }
    .pe-msg { font-size: 0.8rem; display: none; }
    .cosm-divider { border: none; border-top: 1px solid var(--border); margin: 0.2rem 0; }
    .btn-sm {
      background: transparent; border: 1px solid var(--border); color: var(--text-muted);
      border-radius: 5px; padding: 0.15rem 0.5rem; font-size: 0.72rem;
      cursor: pointer; font-family: inherit; white-space: nowrap;
    }
    .btn-sm:hover { border-color: var(--link); color: var(--link); }
    .cosm-swatches { display: flex; align-items: center; gap: 0.35rem; flex-wrap: wrap; }
    .cosm-swatch {
      width: 1.15rem; height: 1.15rem; border-radius: 50%; cursor: pointer;
      border: 2px solid transparent; transition: border-color 0.1s; flex-shrink: 0;
    }
    .cosm-swatch:hover { border-color: var(--text-muted); }
    .cosm-swatch.selected { border-color: var(--text-primary); }
    .cosm-swatch.swatch-none { background: var(--border); }
    .avatar-upload-circle {
      width: 3rem; height: 3rem; border-radius: 50%; cursor: pointer;
      border: 2px dashed var(--text-dim); display: flex; align-items: center;
      justify-content: center; overflow: hidden; flex-shrink: 0;
      transition: border-color 0.1s;
    }
    .avatar-upload-circle:hover { border-color: var(--text-muted); }
    .avatar-upload-circle img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-upload-circle .avatar-plus { font-size: 1.25rem; color: var(--text-muted); line-height: 1; }

    .tenure-table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    .tenure-table td { padding: 0.45rem 0; color: var(--text-secondary); vertical-align: middle; }
    .tenure-table td:first-child { width: 70px; }
    .tenure-table td:nth-child(2) { width: 70px; color: var(--text-muted); }
    .tenure-table td:last-child { color: var(--text-muted); font-size: 0.82rem; }
    .ongoing { color: var(--accent); }

    /* Achievements */
    .ach-cat { margin-bottom: 1.25rem; }
    .ach-cat-label {
      font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--text-dim); margin-bottom: 0.6rem;
    }
    .ach-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(108px, 1fr));
      gap: 0.6rem;
    }
    .ach-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
      padding: 0.75rem 0.4rem 0.65rem; text-align: center;
      cursor: pointer; transition: border-color 0.12s;
      -webkit-tap-highlight-color: transparent;
    }
    .ach-card:not(.locked):hover { border-color: var(--text-dim); }
    .ach-card:focus-visible { outline: none; border-color: var(--text-dim); }
    .ach-card.locked { opacity: 0.35; filter: grayscale(1); }
    /* Tap/click to reveal detail (mobile has no hover for the title tooltip) */
    .ach-info {
      font-size: 0.62rem; color: var(--text-muted); line-height: 1.35;
      max-height: 0; opacity: 0; overflow: hidden;
      transition: max-height 0.18s ease, opacity 0.18s ease, margin-top 0.18s ease;
    }
    .ach-card.open .ach-info { max-height: 6rem; opacity: 1; margin-top: 0.45rem; }
    .ach-icon { font-size: 1.6rem; line-height: 1; display: block; margin-bottom: 0.35rem; }
    .ach-name {
      font-size: 0.7rem; font-weight: 600; color: var(--text-secondary);
      line-height: 1.3; margin-bottom: 0.3rem;
    }
    .ach-tier {
      display: inline-block; font-size: 0.6rem; font-weight: 700;
      letter-spacing: 0.05em; text-transform: uppercase;
      padding: 0.1rem 0.4rem; border-radius: 3px;
    }
    .tier-bronze  { background: var(--danger-alt-bg); color: var(--danger-alt); }
    .tier-silver  { background: var(--bg-card); color: var(--text-muted); border: 1px solid var(--border); }
    .tier-gold    { background: var(--gold-bg); color: var(--gold); }
    .tier-on      { background: var(--success-dark-bg); color: var(--success-light); }
    .tier-locked  { background: var(--bg-page); color: var(--text-dim); }

    /* Tips */
    .tip-form {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
      padding: 1.25rem; margin-bottom: 1.25rem;
    }
    .tip-form-title { font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.85rem; }
    .tip-row { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .tip-input-wrap { display: flex; align-items: stretch; }
    .tip-prefix {
      background: var(--border); border: 1px solid var(--text-dim); border-right: none;
      color: var(--text-muted); font-size: 0.875rem; padding: 0.45rem 0.65rem;
      border-radius: 6px 0 0 6px;
    }
    .tip-amount {
      background: var(--bg-page); border: 1px solid var(--text-dim); color: var(--text-primary);
      border-radius: 0 6px 6px 0; padding: 0.45rem 0.6rem; font-size: 0.875rem;
      width: 90px; font-family: inherit;
    }
    .tip-amount:focus { outline: none; border-color: var(--link); }
    .tip-msg-wrap { margin-top: 0.75rem; }
    .tip-msg {
      background: var(--bg-page); border: 1px solid var(--text-dim); color: var(--text-primary);
      border-radius: 6px; padding: 0.5rem 0.65rem; font-size: 0.875rem;
      width: 100%; font-family: inherit; resize: vertical; min-height: 64px;
    }
    .tip-msg:focus { outline: none; border-color: var(--link); }
    .tip-msg-hint { font-size: 0.72rem; color: var(--text-muted); margin-top: 0.3rem; }
    .btn-tip {
      background: var(--accent-dark); border: 1px solid var(--accent); color: var(--text-on-accent);
      border-radius: 6px; padding: 0.45rem 1rem; cursor: pointer;
      font-size: 0.875rem; font-family: inherit; white-space: nowrap;
    }
    .btn-tip:hover { background: var(--accent-dark); }
    .btn-tip:disabled { opacity: 0.5; cursor: not-allowed; }
    .tip-error { font-size: 0.8rem; color: var(--danger-light); background: var(--danger-bg); border-radius: 6px; padding: 0.5rem 0.75rem; margin-top: 0.6rem; }
    .tip-success { font-size: 0.8rem; color: var(--success-light); background: var(--success-dark-bg); border-radius: 6px; padding: 0.5rem 0.75rem; margin-top: 0.6rem; }

    .signin-prompt {
      font-size: 0.85rem; color: var(--text-muted);
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
      padding: 0.75rem 1rem; margin-bottom: 1.25rem;
    }

    .tips-list { display: flex; flex-direction: column; }
    .tip-item { padding: 0.85rem 0; border-bottom: 1px solid var(--bg-card); }
    .tip-item:last-child { border-bottom: none; }
    .tip-item-header { display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; }
    .tip-from { font-weight: 600; font-size: 0.875rem; }
    .tip-amt { font-size: 0.85rem; color: #fde68a; font-weight: 600; }
    .tip-time { font-size: 0.78rem; color: var(--text-muted); margin-left: auto; }
    .tip-message {
      font-size: 0.875rem; color: var(--text-secondary); margin-top: 0.4rem;
      font-style: italic; padding-left: 0.65rem;
      border-left: 2px solid var(--border);
    }
    .empty-state { color: var(--text-muted); font-size: 0.875rem; }
    .error-state { color: var(--danger-light); font-size: 0.9rem; padding: 2rem 0; }

    .career-stats {
      display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 2rem;
    }
    .cs-box {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
      padding: 0.65rem 0.9rem; flex: 1 1 100px;
    }
    .cs-label {
      font-size: 0.6rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 0.25rem;
    }
    .cs-value {
      font-size: 1.15rem; font-weight: 700; color: var(--text-primary); line-height: 1;
    }
    .cs-sub { font-size: 0.72rem; color: var(--text-muted); margin-top: 0.2rem; }
    .cs-ring { color: var(--gold); }
  </style>
</head>
<body>
<script src="/nav.js"></script>
<script src="/members/achievements.js"></script>
<div class="page">
  <nav class="nav"><a href="/members/">← Members</a></nav>
  <div id="root"><p style="color:var(--text-muted)">Loading…</p></div>
</div>
<script>
const TOKEN_KEY = 'nbn_token';

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function relTime(iso) {
  const s = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (s < 60)  return 'just now';
  const m = Math.floor(s / 60);
  if (m < 60)  return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24)  return `${h}h ago`;
  const d = Math.floor(h / 24);
  if (d < 30)  return `${d}d ago`;
  const mo = Math.floor(d / 30);
  if (mo < 12) return `${mo}mo ago`;
  return `${Math.floor(mo / 12)}y ago`;
}

function fmtDate(s) {
  if (!s) return '';
  const [y, m, d] = s.split('-');
  return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1] + ` ${+d}, ${y}`;
}

const SIGNS = [
  { name: 'Capricorn',   icon: '♑', m: 1,  d: 1  },
  { name: 'Aquarius',    icon: '♒', m: 1,  d: 20 },
  { name: 'Pisces',      icon: '♓', m: 2,  d: 19 },
  { name: 'Aries',       icon: '♈', m: 3,  d: 21 },
  { name: 'Taurus',      icon: '♉', m: 4,  d: 20 },
  { name: 'Gemini',      icon: '♊', m: 5,  d: 21 },
  { name: 'Cancer',      icon: '♋', m: 6,  d: 21 },
  { name: 'Leo',         icon: '♌', m: 7,  d: 23 },
  { name: 'Virgo',       icon: '♍', m: 8,  d: 23 },
  { name: 'Libra',       icon: '♎', m: 9,  d: 23 },
  { name: 'Scorpio',     icon: '♏', m: 10, d: 23 },
  { name: 'Sagittarius', icon: '♐', m: 11, d: 22 },
  { name: 'Capricorn',   icon: '♑', m: 12, d: 22 },
];
function starSign(dob) {
  const [, m, d] = dob.split('-').map(Number);
  let sign = SIGNS[0];
  for (const s of SIGNS) { if (m > s.m || (m === s.m && d >= s.d)) sign = s; }
  return sign;
}

function calcAge(dob) {
  const [y, m, d] = dob.split('-').map(Number);
  const today = new Date();
  let age = today.getFullYear() - y;
  if (today.getMonth() + 1 < m || (today.getMonth() + 1 === m && today.getDate() < d)) age--;
  return age;
}

function activeTenure(tenures) {
  const active = (tenures || []).filter(t => !t.end);
  return active.length ? active.sort((a,b) => b.start.localeCompare(a.start))[0] : null;
}

function displayPos(p) {
  return p === 'owner' ? 'Owner' : p === 'gm' ? 'GM' : p === 'coach' ? 'Coach' : p || '—';
}

function parseCSV(text) {
  const lines = (text || '').trim().split('\n').filter(Boolean);
  if (lines.length < 2) return [];
  const headers = lines[0].split(',').map(h => h.trim());
  return lines.slice(1).map(line => {
    const vals = line.split(',');
    const row = {};
    headers.forEach((h, i) => { row[h] = (vals[i] || '').trim(); });
    return row;
  });
}

function renderCareerStats(ownerRow) {
  if (!ownerRow) return '';
  const w   = +ownerRow.reg_w || 0;
  const l   = +ownerRow.reg_l || 0;
  const pct = (w + l) > 0 ? (w / (w + l) * 100).toFixed(1) : '—';
  const pw  = +ownerRow.playoff_w || 0;
  const pl  = +ownerRow.playoff_l || 0;
  const ppa = +ownerRow.playoff_appearances || 0;
  const rings = +ownerRow.championships || 0;
  const finals = +ownerRow.po_finals || 0;
  const offRtg = ownerRow.off_rtg ? (+ownerRow.off_rtg).toFixed(1) : '—';
  const defRtg = ownerRow.def_rtg ? (+ownerRow.def_rtg).toFixed(1) : '—';

  const ringsHtml = rings > 0
    ? `<span class="cs-ring">${'★'.repeat(rings)}</span> ${rings}`
    : '0';

  return `<div class="career-stats">
    <div class="cs-box"><div class="cs-label">Seasons</div><div class="cs-value">${ownerRow.seasons || 0}</div><div class="cs-sub">${w + l} games</div></div>
    <div class="cs-box"><div class="cs-label">Reg Season</div><div class="cs-value">${w}–${l}</div><div class="cs-sub">${pct}% win rate</div></div>
    <div class="cs-box"><div class="cs-label">Championships</div><div class="cs-value">${ringsHtml}</div><div class="cs-sub">${finals} finals app${finals !== 1 ? 's' : ''}</div></div>
    <div class="cs-box"><div class="cs-label">Playoffs</div><div class="cs-value">${ppa}</div><div class="cs-sub">appearance${ppa !== 1 ? 's' : ''}</div></div>
    <div class="cs-box"><div class="cs-label">Playoff W–L</div><div class="cs-value">${pw}–${pl}</div><div class="cs-sub">series</div></div>
    <div class="cs-box"><div class="cs-label">Rtg</div><div class="cs-value">${offRtg}</div><div class="cs-sub">off · ${defRtg} def</div></div>
  </div>`;
}

const parts = location.pathname.replace(/\/$/, '').split('/').filter(Boolean);
const memberName = decodeURIComponent(parts[1] || '');
const token = localStorage.getItem(TOKEN_KEY) || '';

async function init() {
  if (!memberName) {
    document.getElementById('root').innerHTML = '<p class="error-state">Invalid URL.</p>';
    return;
  }
  document.title = `${memberName} — NBN`;

  const req1 = [
    fetch('/api/members/public').then(r => r.json()).catch(() => []),
    fetch(`/api/tips/${encodeURIComponent(memberName)}`).then(r => r.ok ? r.json() : []).catch(() => []),
    fetch(`/api/bets/balance/${encodeURIComponent(memberName)}`).then(r => r.ok ? r.json() : null).catch(() => null),
  ];
  if (token) req1.push(fetch('/api/me', { headers: { Authorization: `Bearer ${token}` } }).then(r => r.ok ? r.json() : null).catch(() => null));

  const req2 = [
    fetch('/data/owner_stats.csv').then(r => r.ok ? r.text() : '').catch(() => ''),
    fetch('/standings/standings-history.csv').then(r => r.ok ? r.text() : '').catch(() => ''),
    fetch(`/api/bets/stats/${encodeURIComponent(memberName)}`).then(r => r.ok ? r.json() : null).catch(() => null),
    fetch(`/api/invest/stats/${encodeURIComponent(memberName)}`).then(r => r.ok ? r.json() : null).catch(() => null),
    fetch(`/api/cleanup/stats/${encodeURIComponent(memberName)}`).then(r => r.ok ? r.json() : null).catch(() => null),
    fetch('/api/players').then(r => r.ok ? r.json() : {}).catch(() => ({})),
    fetch('/players/player_awards.csv').then(r => r.ok ? r.text() : '').catch(() => ''),
    fetch('/api/transactions?limit=2000').then(r => r.ok ? r.json() : { transactions: [] }).catch(() => ({ transactions: [] })),
    fetch('/players/player_seasons.csv').then(r => r.ok ? r.text() : '').catch(() => ''),
    fetch('/data/h2h-owners.csv').then(r => r.ok ? r.text() : '').catch(() => ''),
  ];

  const [results1, results2] = await Promise.all([Promise.all(req1), Promise.all(req2)]);
  const [allMembers, tips, balData, me] = results1;
  const [ownerStatsCsv, standingsCsv, betsStats, investStats, cleanupStats, bios, awardsCsv, txnResp, playerSeasonsCsv, h2hOwnersCsv] = results2;
  const nameLower = memberName.toLowerCase();
  const ownerRow = parseCSV(ownerStatsCsv).find(r => r.owner.toLowerCase() === nameLower) || null;

  const member = allMembers.find(m => m.name === memberName);
  if (!member) {
    document.getElementById('root').innerHTML = `<p class="error-state">Member "${esc(memberName)}" not found.</p>`;
    return;
  }

  const cur = activeTenure(member.tenures);
  const sortedTenures = [...(member.tenures || [])].sort((a,b) => b.start.localeCompare(a.start));
  const balance = balData?.balance ?? null;
  const isOwn = me && me.name === memberName;
  const canTip = me && !isOwn;

  // Apply member's chosen name color as the page accent theme
  const accentColor = member.cosmetics?.name_color;
  if (accentColor) {
    document.documentElement.style.setProperty('--accent', accentColor);
    document.documentElement.style.setProperty('--accent-muted', accentColor + '33');
  }

  // Build achievement data via the shared engine (members/achievements.js)
  const tipsReceived = tips.reduce((sum, t) => sum + (+t.amount || 0), 0);
  const achShared = NBNAch.prepare({
    ownerStatsCsv, standingsCsv, bios, awardsCsv,
    allTxns: (txnResp && txnResp.transactions) || [],
    playerSeasonsCsv, h2hOwnersCsv,
  });
  const achData = NBNAch.computeAchData(member, achShared, { betsStats, investStats, tipsReceived, cleanupStats });

  let html = '';

  // Header
  if (member.avatar_url) {
    html += `<img src="${member.avatar_url}" alt="${esc(member.name)}" style="width:5rem;height:5rem;border-radius:50%;object-fit:cover;margin-bottom:0.75rem;display:block">`;
  }
  html += `<h1 class="profile-name">${esc(member.name)}</h1>`;
  html += `<div class="profile-meta">`;
  if (cur) {
    html += `${displayPos(cur.position)} · <span class="team-badge"><a href="/teams/${cur.team.toLowerCase()}/">${cur.team}</a></span>`;
  } else {
    html += `<span style="color:var(--text-muted)">No active tenure</span>`;
  }
  if (member.dob) {
    const sign = starSign(member.dob);
    html += ` · <span title="${esc(member.dob)}">Born ${fmtDate(member.dob)} · Age ${calcAge(member.dob)} · <span title="${esc(sign.name)}">${sign.icon} ${esc(sign.name)}</span></span>`;
  }
  if (member.cosmetics?.status_text) {
    html += `<div style="width:100%;margin-top:0.25rem;color:var(--text-muted);font-size:0.85rem">${esc(member.cosmetics.status_text)}</div>`;
  }
  html += `</div>`;

  // Balance
  if (balance !== null) {
    html += `<div class="balance-pill">
      <span class="balance-label">NB¥ balance</span>
      <span class="balance-amount">NB¥${balance.toLocaleString('en-US', {minimumFractionDigits:2,maximumFractionDigits:2})}</span>
    </div>`;
  }

  // Career stats
  html += renderCareerStats(ownerRow);

  // Tenure history
  if (sortedTenures.length) {
    html += `<div class="section"><div class="section-title">Tenure History</div><table class="tenure-table">`;
    for (const t of sortedTenures) {
      const end = t.end ? fmtDate(t.end) : '<span class="ongoing">present</span>';
      html += `<tr>
        <td><span class="team-badge"><a href="/teams/${t.team.toLowerCase()}/">${t.team}</a></span></td>
        <td>${displayPos(t.position)}</td>
        <td>${fmtDate(t.start)} – ${end}</td>
      </tr>`;
    }
    html += `</table></div>`;
  }

  // Achievements
  const unlockedCount = NBNAch.countUnlocked(achData);
  html += `<div class="section">
    <div class="section-title">Achievements (${unlockedCount}/${NBNAch.total})</div>
    ${NBNAch.renderAchievements(achData)}
  </div>`;

  // Tips section
  const tipCount = tips.length;
  html += `<div class="section"><div class="section-title">Tips${tipCount ? ` (${tipCount})` : ''}</div>`;

  if (!token) {
    html += `<div class="signin-prompt">Sign in at <a href="/members/">Members</a> to tip this member.</div>`;
  } else if (isOwn) {
    // no tip form on own page
  } else if (canTip) {
    html += `<div class="tip-form" id="tip-form">
      <div class="tip-form-title">Send NB¥ to ${esc(member.name)}</div>
      <div class="tip-row">
        <div class="tip-input-wrap">
          <span class="tip-prefix">NB¥</span>
          <input type="number" class="tip-amount" id="tip-amount" min="1" step="1" placeholder="10">
        </div>
        <button class="btn-tip" id="tip-btn">Send Tip</button>
      </div>
      <div id="tip-msg-wrap" style="display:none" class="tip-msg-wrap">
        <textarea class="tip-msg" id="tip-msg" placeholder="Add a message…" maxlength="280"></textarea>
        <p class="tip-msg-hint">Publicly visible on ${esc(member.name)}'s page.</p>
      </div>
      <div id="tip-feedback"></div>
    </div>`;
  }

  if (!tipCount) {
    html += `<p class="empty-state">No tips received yet.</p>`;
  } else {
    html += `<div class="tips-list">`;
    for (const t of tips) {
      html += `<div class="tip-item">
        <div class="tip-item-header">
          <span class="tip-from">${esc(t.from)}</span>
          <span class="tip-amt">NB¥${(+t.amount).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</span>
          <span class="tip-time">${relTime(t.ts)}</span>
        </div>
        ${t.message ? `<div class="tip-message">${esc(t.message)}</div>` : ''}
      </div>`;
    }
    html += `</div>`;
  }

  html += `</div>`; // end tips section

  // Edit-your-profile — own page only, tucked away below everything else as a
  // collapsed drawer (closed by default) so it doesn't compete with the stuff
  // you actually came to a profile page to look at.
  if (isOwn) {
    html += `<div class="profile-editor-bar">
      <button type="button" id="pe-toggle" class="pe-toggle" aria-expanded="false">
        <span id="pe-chevron" class="pe-chevron">&#9654;</span>
        <span class="pe-toggle-label">Edit Your Profile</span>
      </button>
      <div id="pe-content" class="pe-content">
        <div class="pe-row">
          <label class="pe-label">Birthday
            <input type="date" id="my-dob-input" class="pe-input" value="${esc(member.dob || '')}">
          </label>
          <button class="btn-sm" id="my-profile-save">Save</button>
          <span id="my-profile-msg" class="pe-msg"></span>
        </div>
        <hr class="cosm-divider">
        <div class="pe-row">
          <span class="pe-group-label">Name color</span>
          <div class="cosm-swatches" id="cosm-swatches"></div>
          <input type="text" id="cosm-status" class="pe-input" style="width:12rem" maxlength="40" placeholder="Short tagline…" value="${esc(member.cosmetics?.status_text || '')}">
          <button class="btn-sm" id="cosm-save">Save · 500 NB¥</button>
          <span id="cosm-msg" class="pe-msg"></span>
        </div>
        <hr class="cosm-divider">
        <div class="pe-row">
          <span class="pe-group-label">Avatar</span>
          <div class="avatar-upload-circle" id="avatar-upload-circle" title="Click to choose image">
            ${member.avatar_url ? `<img src="${esc(member.avatar_url)}" alt="">` : '<span class="avatar-plus">+</span>'}
          </div>
          <input type="file" id="avatar-file-input" accept="image/jpeg,image/png,image/webp" style="display:none">
          <span class="pe-hint">JPEG / PNG / WebP · max 512 KB</span>
          <button class="btn-sm" id="avatar-save" style="display:none">Upload · 5,000 NB¥</button>
          <span id="avatar-msg" class="pe-msg"></span>
        </div>
      </div>
    </div>`;
  }

  document.getElementById('root').innerHTML = html;

  // Tap/click (or Enter/Space) an achievement card to reveal its detail line.
  document.querySelectorAll('.ach-card').forEach(card => {
    const toggle = () => {
      const wasOpen = card.classList.contains('open');
      document.querySelectorAll('.ach-card.open').forEach(c => c.classList.remove('open'));
      if (!wasOpen) card.classList.add('open');
    };
    card.addEventListener('click', toggle);
    card.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });
  });

  if (canTip) {
    const amtEl  = document.getElementById('tip-amount');
    const msgWrap = document.getElementById('tip-msg-wrap');
    const btn    = document.getElementById('tip-btn');
    const fb     = document.getElementById('tip-feedback');

    amtEl.addEventListener('input', () => {
      msgWrap.style.display = parseFloat(amtEl.value) >= 25 ? '' : 'none';
    });

    btn.addEventListener('click', async () => {
      const amount = parseFloat(amtEl.value);
      if (!amount || amount <= 0) { fb.innerHTML = '<div class="tip-error">Enter a valid amount.</div>'; return; }
      const message = document.getElementById('tip-msg')?.value?.trim() || '';
      btn.disabled = true; btn.textContent = 'Sending…'; fb.innerHTML = '';
      try {
        const res = await fetch('/api/tips', {
          method: 'POST',
          headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ to: memberName, amount, message }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || res.statusText);
        fb.innerHTML = `<div class="tip-success">Sent NB¥${amount} to ${esc(memberName)}. Your new balance: NB¥${(+data.new_balance).toLocaleString('en-US',{minimumFractionDigits:2})}</div>`;
        amtEl.value = ''; msgWrap.style.display = 'none';
        if (document.getElementById('tip-msg')) document.getElementById('tip-msg').value = '';
        setTimeout(() => location.reload(), 1800);
      } catch(err) {
        fb.innerHTML = `<div class="tip-error">${esc(err.message)}</div>`;
      } finally {
        btn.disabled = false; btn.textContent = 'Send Tip';
      }
    });
  }

  if (isOwn) {
    document.getElementById('pe-toggle').addEventListener('click', () => {
      const btn = document.getElementById('pe-toggle');
      const content = document.getElementById('pe-content');
      const open = content.classList.toggle('open');
      btn.classList.toggle('open', open);
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });

    const COSM_PALETTE = ['var(--warning)','var(--danger)','#a855f7','var(--link)','var(--market-positive)','#f472b6','var(--danger-alt)','#2dd4bf'];
    let selectedColor = accentColor || '';

    function buildSwatches() {
      const wrap = document.getElementById('cosm-swatches');
      const none = document.createElement('div');
      none.className = 'cosm-swatch swatch-none' + (selectedColor === '' ? ' selected' : '');
      none.title = 'No color';
      none.addEventListener('click', () => selectSwatch(''));
      wrap.appendChild(none);
      for (const hex of COSM_PALETTE) {
        const s = document.createElement('div');
        s.className = 'cosm-swatch' + (selectedColor === hex ? ' selected' : '');
        s.style.background = hex;
        s.title = hex;
        s.dataset.color = hex;
        s.addEventListener('click', () => selectSwatch(hex));
        wrap.appendChild(s);
      }
    }
    function selectSwatch(hex) {
      selectedColor = hex;
      document.querySelectorAll('.cosm-swatch').forEach(s => {
        s.classList.toggle('selected', (s.dataset.color || '') === hex);
      });
    }
    buildSwatches();

    document.getElementById('my-profile-save').addEventListener('click', async () => {
      const btn = document.getElementById('my-profile-save');
      const msg = document.getElementById('my-profile-msg');
      const dob = document.getElementById('my-dob-input').value;
      btn.disabled = true; btn.textContent = 'Saving…';
      msg.style.display = 'none';
      try {
        const res = await fetch('/api/members/me/profile', {
          method: 'PATCH',
          headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ dob: dob || '' }),
        });
        if (!res.ok) throw new Error((await res.json()).detail);
        msg.textContent = 'Saved!'; msg.style.color = 'var(--success-light)'; msg.style.display = '';
        setTimeout(() => { msg.style.display = 'none'; }, 2000);
      } catch (err) {
        msg.textContent = 'Error: ' + err.message; msg.style.color = 'var(--danger)'; msg.style.display = '';
      } finally { btn.disabled = false; btn.textContent = 'Save'; }
    });

    document.getElementById('cosm-save').addEventListener('click', async () => {
      const btn = document.getElementById('cosm-save');
      const msg = document.getElementById('cosm-msg');
      const statusText = document.getElementById('cosm-status').value;
      btn.disabled = true; btn.textContent = 'Saving…';
      msg.style.display = 'none';
      try {
        const res = await fetch('/api/members/me/cosmetics', {
          method: 'PATCH',
          headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ name_color: selectedColor || '', status_text: statusText }),
        });
        if (!res.ok) throw new Error((await res.json()).detail);
        const data = await res.json();
        msg.textContent = `Saved! NB¥ balance: ${data.new_balance.toLocaleString('en-US', {minimumFractionDigits:2,maximumFractionDigits:2})}`;
        msg.style.color = 'var(--success-light)'; msg.style.display = '';
        setTimeout(() => location.reload(), 1200);
      } catch (err) {
        msg.textContent = 'Error: ' + err.message; msg.style.color = 'var(--danger)'; msg.style.display = '';
      } finally { btn.disabled = false; btn.textContent = 'Save · 500 NB¥'; }
    });

    function setAvatarPreview(src) {
      const circle = document.getElementById('avatar-upload-circle');
      circle.innerHTML = src
        ? `<img src="${src}" alt="preview" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
        : '<span class="avatar-plus">+</span>';
    }
    let pendingAvatarFile = null;
    document.getElementById('avatar-upload-circle').addEventListener('click', () => {
      document.getElementById('avatar-file-input').click();
    });
    document.getElementById('avatar-file-input').addEventListener('change', e => {
      const f = e.target.files[0];
      if (!f) return;
      if (f.size > 512 * 1024) {
        const msg = document.getElementById('avatar-msg');
        msg.textContent = 'File too large (max 512 KB)'; msg.style.color = 'var(--danger)'; msg.style.display = '';
        return;
      }
      pendingAvatarFile = f;
      document.getElementById('avatar-msg').style.display = 'none';
      document.getElementById('avatar-save').style.display = '';
      const reader = new FileReader();
      reader.onload = ev => setAvatarPreview(ev.target.result);
      reader.readAsDataURL(f);
    });
    document.getElementById('avatar-save').addEventListener('click', async () => {
      if (!pendingAvatarFile) return;
      const btn = document.getElementById('avatar-save');
      const msg = document.getElementById('avatar-msg');
      btn.disabled = true; btn.textContent = 'Uploading…';
      msg.style.display = 'none';
      try {
        const fd = new FormData();
        fd.append('file', pendingAvatarFile);
        const res = await fetch('/api/members/me/avatar', {
          method: 'POST',
          headers: { Authorization: `Bearer ${token}` },
          body: fd,
        });
        if (!res.ok) throw new Error((await res.json()).detail);
        const data = await res.json();
        msg.textContent = `Uploaded! NB¥ balance: ${data.new_balance.toLocaleString('en-US', {minimumFractionDigits:2,maximumFractionDigits:2})}`;
        msg.style.color = 'var(--success-light)'; msg.style.display = '';
        pendingAvatarFile = null;
        btn.style.display = 'none';
        setTimeout(() => location.reload(), 1200);
      } catch (err) {
        msg.textContent = 'Error: ' + err.message; msg.style.color = 'var(--danger)'; msg.style.display = '';
      } finally { btn.disabled = false; btn.textContent = 'Upload · 5,000 NB¥'; }
    });
  }
}

init();
</script>
<script src="/token-badge.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="/theme-boot.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/shared.css">
  <title>NBN | Stream vs Sim | Stats</title>
  <!-- NBN:og -->
  <meta name="description" content="How streamed NBN games differ from quick-simmed ones: about 60 team measures side by side, with the biggest real gaps called out.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NBN">
  <meta property="og:title" content="NBN | Stream vs Sim | Stats">
  <meta property="og:description" content="How streamed NBN games differ from quick-simmed ones: about 60 team measures side by side, with the biggest real gaps called out.">
  <meta property="og:url" content="https://nbn.today/stats/stream-sim/">
  <meta property="og:image" content="https://nbn.today/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Nothing But Net — fantasy basketball GM simulation league">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0d0e11">
  <link rel="icon" href="/icons/favicon.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <!-- /NBN:og -->
  <style>
    .ss-filters { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); margin-bottom: var(--space-3); }
    .ss-filters[hidden] { display: none; }
    .ss-filters .ui-select { height: 2rem; font-size: var(--text-sm); }
    .ss-note { font-size: var(--text-sm); color: var(--text-muted); margin-bottom: var(--space-5); }
    .ss-section { margin-top: var(--space-6); }

    /* The biggest real gaps, one tile each. */
    .ss-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--space-3); margin-bottom: var(--space-6); }
    .ss-tile { padding: var(--space-3) var(--space-4); background: var(--bg-hover); }
    .ss-tile-label { font-size: var(--text-sm); color: var(--text-secondary); }
    .ss-tile-big { font-family: var(--font-display); font-size: var(--text-xl); color: var(--text-primary); line-height: 1.2; margin: var(--space-1) 0; }
    .ss-tile-vs { font-size: var(--text-xs); color: var(--text-muted); }
    @media (max-width: 560px) {
      .ss-tiles { grid-template-columns: 1fr 1fr; gap: var(--space-2); }
      .ss-tile { padding: var(--space-2) var(--space-3); }
      .ss-tile-big { font-size: var(--text-lg); }
    }

    .ss-group td { padding-top: var(--space-4); font-size: var(--text-xs); color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
    .ss-sub { display: block; font-size: var(--text-xs); color: var(--text-muted); }
    .ss-table td { vertical-align: middle; }

    /* Gap bar: the relative difference, centred on zero; GAP_FULL fills a side. */
    .ss-gap { display: flex; align-items: center; gap: var(--space-2); min-width: 280px; }
    .ss-track { position: relative; flex: 1; height: 10px; }
    .ss-track::before { content: ''; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--border); }
    .ss-fill { position: absolute; top: 0; bottom: 0; background: var(--accent); }
    .ss-fill.is-likely { opacity: 0.6; }
    .ss-fill.is-noise, .ss-fill.is-none { opacity: 0.2; }
    .ss-rel { width: 4.2em; text-align: right; font-variant-numeric: tabular-nums; font-size: var(--text-sm); }
    .ss-dim td { color: var(--text-muted); }
    .ss-dim td.strong { color: var(--text-secondary); }

    .ss-win { font-weight: 700; color: var(--text-primary); }
    #status { text-align: center; padding: 3rem; color: var(--text-muted); font-size: var(--text-base); }
  </style>
</head>
<body>
  <div class="page ui-page ui-page--wide">
    <nav class="nav"></nav>
    <header class="ui-header">
      <div>
        <h1 class="ui-title">Stream vs Sim</h1>
      </div>
    </header>
    <div class="ss-filters" id="season-row" hidden>
      <select class="ui-select" id="f-season" aria-label="Season"></select>
    </div>
    <p class="ss-note" id="note"></p>
    <div id="status">Loading…</div>
    <div id="body" hidden>
      <h2 class="ui-section-title">Biggest differences</h2>
      <div class="ss-tiles" id="tiles"></div>

      <h2 class="ui-section-title">Every measure</h2>
      <div class="ss-filters">
        <div class="ui-segmented" role="group" id="f-order">
          <button data-v="group">By category</button>
          <button data-v="gap">Biggest gap first</button>
        </div>
        <div class="ui-segmented" role="group" id="f-show">
          <button data-v="all">All</button>
          <button data-v="real">Real gaps only</button>
        </div>
      </div>
      <p class="ss-note" id="legend"></p>
      <div class="ui-table-wrap"><table class="ui-table ss-table" id="t-metrics"></table></div>

      <h2 class="ui-section-title ss-section">Streamed games</h2>
      <div class="ui-table-wrap"><table class="ui-table" id="t-games"></table></div>
    </div>
  </div>
  <script>
  (function () {
    // Every number is computed by GET /api/stream-vs-sim (nbn-api
    // routers/stream_sim.py): the split by the schedule's stream flag, each
    // measure both ways, and whether a gap is more than noise (`signal`).
    // The page only draws them.
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    const TILES = 8;
    // A gap this size (as a share of the simmed figure) fills one side of the bar.
    const GAP_FULL = 0.6;
    const SIGNAL = {
      clear:  { label: 'Clear',          tone: 'ui-chip--accent' },
      likely: { label: 'Likely',         tone: '' },
      noise:  { label: 'Could be noise', tone: '' },
      none:   { label: 'Too few games',  tone: '' },
    };
    const REAL = new Set(['clear', 'likely']);

    const q = new URLSearchParams(location.search);
    const state = {
      season: /^\d\d-\d\d$/.test(q.get('season') || '') ? q.get('season') : '',
      order: q.get('order') === 'gap' ? 'gap' : 'group',
      show: q.get('show') === 'real' ? 'real' : 'all',
    };
    let data = null;

    const DEC = { n1: 1, n2: 2, n3: 3 };
    function fmt(m, v) {
      if (v == null) return '—';
      return m.fmt === 'pct' ? (v * 100).toFixed(1) + '%' : v.toFixed(DEC[m.fmt] ?? 1);
    }
    // A percentage's difference is in percentage points, written as %.
    function fmtDiff(m, d) {
      if (d == null) return '—';
      const sign = d > 0 ? '+' : d < 0 ? '−' : '';
      return m.fmt === 'pct' ? sign + Math.abs(d * 100).toFixed(1) + '%' : sign + Math.abs(d).toFixed(DEC[m.fmt] ?? 1);
    }
    function fmtRel(r) {
      if (r == null) return '—';
      const p = Math.round(r * 100);
      return (p > 0 ? '+' : p < 0 ? '−' : '') + Math.abs(p) + '%';
    }

    function renderTiles() {
      // One tile per family, so fouls and fouls per 100 don't take two.
      const seen = new Set();
      const top = data.metrics
        .filter(m => m.signal === 'clear' && m.rel != null)
        .sort((a, b) => Math.abs(b.rel) - Math.abs(a.rel))
        .filter(m => !seen.has(m.family) && seen.add(m.family))
        .slice(0, TILES);
      $('tiles').innerHTML = top.map(m => {
        const word = m.rel > 0 ? 'higher' : 'lower';
        return `<div class="ss-tile">
          <div class="ss-tile-label">${esc(m.label)}</div>
          <div class="ss-tile-big">${Math.abs(Math.round(m.rel * 100))}% ${word}</div>
          <div class="ss-tile-vs">${fmt(m, m.stream)} streamed, ${fmt(m, m.sim)} simmed</div>
        </div>`;
      }).join('') || '<p class="ss-note">No gap is big enough yet to tell from noise.</p>';
    }

    function gapCell(m) {
      if (m.rel == null) return '<td></td>';
      const w = Math.min(Math.abs(m.rel) / GAP_FULL, 1) * 50;
      const pos = m.rel >= 0 ? `left:50%;width:${w}%` : `left:${50 - w}%;width:${w}%`;
      return `<td><div class="ss-gap" title="Streamed is ${fmtRel(m.rel)} vs simmed">
        <div class="ss-track"><div class="ss-fill is-${m.signal}" style="${pos}"></div></div>
        <span class="ss-rel">${fmtRel(m.rel)}</span></div></td>`;
    }

    function row(m) {
      const s = SIGNAL[m.signal] || SIGNAL.none;
      return `<tr class="${REAL.has(m.signal) ? '' : 'ss-dim'}">
        <td>${esc(m.label)}${m.note ? `<span class="ss-sub">${esc(m.note)}</span>` : ''}</td>
        <td class="num strong">${fmt(m, m.stream)}</td>
        <td class="num">${fmt(m, m.sim)}</td>
        <td class="num">${fmtDiff(m, m.diff)}</td>
        ${gapCell(m)}
        <td><span class="ui-chip ui-chip--sm ${s.tone}">${s.label}</span></td>
      </tr>`;
    }

    function renderTable() {
      let ms = data.metrics.filter(m => state.show === 'all' || REAL.has(m.signal));
      let h = `<thead><tr><th>Measure</th><th class="num">Streamed</th><th class="num">Simmed</th>
        <th class="num">Difference</th><th>Gap</th><th>Real?</th></tr></thead><tbody>`;
      if (state.order === 'gap') {
        ms = [...ms].sort((a, b) => Math.abs(b.rel ?? 0) - Math.abs(a.rel ?? 0));
        h += ms.map(row).join('');
      } else {
        let group = null;
        for (const m of ms) {
          if (m.group !== group) { group = m.group; h += `<tr class="ss-group"><td colspan="6">${esc(group)}</td></tr>`; }
          h += row(m);
        }
      }
      $('t-metrics').innerHTML = h + '</tbody>';
      for (const [id, key] of [['f-order', 'order'], ['f-show', 'show']])
        document.querySelectorAll(`#${id} button`).forEach(b => {
          const on = b.dataset.v === state[key];
          b.classList.toggle('active', on); b.setAttribute('aria-pressed', on);
        });
    }

    function renderGames() {
      const fmtDate = s => {
        const d = new Date(s + 'T12:00:00');
        return isNaN(d) ? s : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      };
      let h = '<thead><tr><th>Date</th><th>Game</th><th>Streamer</th><th>Video</th></tr></thead><tbody>';
      for (const g of [...data.stream_games].reverse()) {
        const awayWon = g.away_score > g.home_score;
        const box = `/boxscores/?date=${g.date}&game=${g.away_team}-${g.home_team}`;
        h += `<tr><td>${fmtDate(g.date)}</td>`
          + `<td><a href="${box}"><span class="${awayWon ? 'ss-win' : ''}">${g.away_team} ${g.away_score ?? ''}</span> at <span class="${awayWon ? '' : 'ss-win'}">${g.home_team} ${g.home_score ?? ''}</span></a></td>`
          + `<td>${esc(g.streamer || '—')}</td>`
          + `<td>${g.youtube_url ? `<a href="${esc(g.youtube_url)}" target="_blank" rel="noopener">Watch</a>` : '—'}</td></tr>`;
      }
      $('t-games').innerHTML = h + '</tbody>';
    }

    function render() {
      const g = data.games;
      $('note').textContent = `${data.season} regular season: ${g.stream} streamed games and ${g.sim} quick-simmed.`
        + (data.unmatched ? ` ${data.unmatched} box score${data.unmatched === 1 ? '' : 's'} with no schedule entry left out.` : '')
        + ' Streams have only been tracked since 26-27. Playoff games are all streamed, so they are left out.';
      $('legend').textContent = 'Per team per game unless it says otherwise. Gap is how much higher or lower streamed games run, '
        + 'as a share of the simmed figure. Real? weighs the gap against how much games vary from night to night: '
        + `Clear means the gap is ${data.thresholds.clear}+ times its likely error, Likely ${data.thresholds.likely}+ times. `
        + 'With this few streamed games, a big gap in something rare (40-point games, overtime) can still be luck.';
      $('status').hidden = true;
      $('body').hidden = false;
      renderTiles(); renderTable(); renderGames();
    }

    function syncUrl() {
      const p = new URLSearchParams();
      if (state.season && data && state.season !== data.seasons[0]) p.set('season', state.season);
      if (state.order === 'gap') p.set('order', 'gap');
      if (state.show === 'real') p.set('show', 'real');
      history.replaceState(null, '', location.pathname + (p.toString() ? '?' + p : ''));
    }

    function load() {
      $('status').hidden = false; $('status').textContent = 'Loading…';
      fetch('/api/stream-vs-sim' + (state.season ? `?season=${state.season}` : ''))
        .then(r => r.ok ? r.json() : Promise.reject(r.status))
        .then(d => {
          data = d; state.season = d.season;
          const sel = $('f-season');
          sel.innerHTML = d.seasons.map(s => `<option value="${s}">${s}</option>`).join('');
          sel.value = d.season;
          $('season-row').hidden = d.seasons.length < 2;
          if (!d.games.stream) {
            $('status').textContent = 'No streamed games with a box score yet this season.';
            return;
          }
          render(); syncUrl();
        })
        .catch(() => { $('status').textContent = 'Failed to load data.'; });
    }

    $('f-season').addEventListener('change', ev => { state.season = ev.target.value; load(); });
    for (const [id, key] of [['f-order', 'order'], ['f-show', 'show']])
      $(id).addEventListener('click', ev => {
        const b = ev.target.closest('button');
        if (!b || b.dataset.v === state[key]) return;
        state[key] = b.dataset.v; renderTable(); syncUrl();
      });
    load();
  })();
  </script>
  <script src="/nav.js"></script>
  <script src="/token-badge.js"></script>
</body>
</html>

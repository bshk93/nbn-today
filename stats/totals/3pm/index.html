<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="icon" href="/logo.png">
  <link rel="stylesheet" href="/css/shared.css">
  <title>3-Pointers Made Leaders — NBN Stats</title>
  <!-- NBN:og -->
  <meta name="description" content="NBN career three-point leaders.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NBN">
  <meta property="og:title" content="3-Pointers Made Leaders — NBN Stats">
  <meta property="og:description" content="NBN career three-point leaders.">

  <meta name="theme-color" content="#0d0e11">
  <!-- /NBN:og -->
  <style>
    /* The page uses the standard width so its header lines up with every
       other page; only the table, which is three columns, stays narrow. */
    .table-wrap { max-width: 640px; }
    .table-wrap { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; white-space: nowrap; }
    tbody tr { border-bottom: 1px solid var(--border-subtle); transition: background 0.1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--bg-hover); }
    td { padding: 0.65rem 1rem; color: var(--text-secondary); }
    td.player-name { font-weight: 600; color: var(--text-primary); }
    td.right { text-align: right; font-variant-numeric: tabular-nums; }
    td.muted { color: var(--text-muted); }
    #status { text-align: center; padding: 3rem; color: var(--text-muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="page ui-page">
    <nav class="nav"></nav>
    <header class="ui-header">
      <div>
        <h1 class="ui-title">All-Time 3-Pointers Made Leaders</h1>
        <p class="ui-subtitle">Career totals. Click any column to sort.</p>
      </div>
    </header>
    <div class="table-wrap" id="table-wrap">
      <div id="status">Loading…</div>
    </div>
  </div>
  <script>window.PAGE_CONFIG = { statKey: '3PM', statLabel: '3PM', csvPath: '/data/totals-3pm.csv' };</script>
  <script src="/names.js"></script>
  <script src="/stats/totals/table.js"></script>
  <script src="/nav.js"></script>
  <script src="/token-badge.js"></script>
</body>
</html>

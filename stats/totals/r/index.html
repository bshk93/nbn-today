<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/logo.png">
  <link rel="stylesheet" href="/css/shared.css">
  <title>Rebounds Leaders — NBN Stats</title>
  <style>
    .page { max-width: 640px; margin: 0 auto; }
    header { margin-bottom: 1.75rem; }
    header h1 { font-size: 1.875rem; font-weight: 700; letter-spacing: -0.02em; }
    header p { color: var(--text-muted); margin-top: 0.4rem; font-size: 0.9rem; }
    .table-wrap { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; white-space: nowrap; }
    tbody tr { border-bottom: 1px solid var(--border-subtle); transition: background 0.1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--bg-hover); }
    td { padding: 0.65rem 1rem; color: var(--text-secondary); }
    td.player-name { font-weight: 600; color: var(--text-primary); }
    td.right { text-align: right; font-variant-numeric: tabular-nums; }
    td.muted { color: var(--text-muted); }
    #status { text-align: center; padding: 3rem; color: var(--text-muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="page">
    <nav class="nav"></nav>
    <header>
      <h1>All-Time Rebounds Leaders</h1>
      <p>Career totals. Click any column to sort.</p>
    </header>
    <div class="table-wrap" id="table-wrap">
      <div id="status">Loading…</div>
    </div>
  </div>
  <script>window.PAGE_CONFIG = { statKey: 'R', statLabel: 'REB', csvPath: '/data/totals-r.csv' };</script>
  <script src="/stats/totals/table.js"></script>
  <script src="/nav.js"></script>
  <script src="/token-badge.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/logo.png">
  <link rel="stylesheet" href="/css/shared.css">
  <title>Single-Game Highs — NBN Stats</title>
  <!-- NBN:og -->
  <meta name="description" content="The biggest single games in NBN history, by category.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NBN">
  <meta property="og:title" content="Single-Game Highs — NBN Stats">
  <meta property="og:description" content="The biggest single games in NBN history, by category.">
  <meta property="og:url" content="https://nbn.today/stats/highs/">
  <meta property="og:image" content="https://nbn.today/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Nothing But Net — fantasy basketball GM simulation league">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#111827">
  <!-- /NBN:og -->
  <style>
    .page { max-width: 660px; margin: 0 auto; }
    header { margin-bottom: 2rem; }
    header h1 { font-size: 1.875rem; font-weight: 700; letter-spacing: -0.02em; }
    header p { color: var(--text-muted); margin-top: 0.4rem; font-size: 0.9rem; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; text-decoration: none; color: inherit; transition: background 0.15s, border-color 0.15s, transform 0.15s; display: flex; flex-direction: column; gap: 0.4rem; }
    .card:hover { background: var(--bg-hover); border-color: var(--muted-border); transform: translateY(-2px); }
    .card-stat { font-size: 1.5rem; font-weight: 700; color: var(--accent-light); }
    .card-title { font-size: 0.95rem; font-weight: 600; }
    @media (max-width: 480px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <div class="page">
    <nav class="nav"></nav>
    <header>
      <h1>Single-Game Highs</h1>
      <p>Top 20 single-game performances in NBN history, by category.</p>
    </header>
    <div class="grid">
      <a class="card" href="/stats/highs/p">
        <span class="card-stat">PTS</span>
        <span class="card-title">Points</span>
      </a>
      <a class="card" href="/stats/highs/r">
        <span class="card-stat">REB</span>
        <span class="card-title">Rebounds</span>
      </a>
      <a class="card" href="/stats/highs/a">
        <span class="card-stat">AST</span>
        <span class="card-title">Assists</span>
      </a>
      <a class="card" href="/stats/highs/b">
        <span class="card-stat">BLK</span>
        <span class="card-title">Blocks</span>
      </a>
      <a class="card" href="/stats/highs/s">
        <span class="card-stat">STL</span>
        <span class="card-title">Steals</span>
      </a>
      <a class="card" href="/stats/highs/3pm">
        <span class="card-stat">3PM</span>
        <span class="card-title">3-Pointers Made</span>
      </a>
    </div>
  </div>
  <script src="/nav.js"></script>
  <script src="/token-badge.js"></script>
</body>
</html>

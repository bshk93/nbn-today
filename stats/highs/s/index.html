<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/logo.png">
  <link rel="stylesheet" href="/css/shared.css">
  <title>Single-Game Steals Highs — NBN Stats</title>
  <!-- NBN:og -->
  <meta name="description" content="The biggest steal games in NBN history.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NBN">
  <meta property="og:title" content="Single-Game Steals Highs — NBN Stats">
  <meta property="og:description" content="The biggest steal games in NBN history.">
  <meta property="og:url" content="https://nbn.today/stats/highs/s/">
  <meta property="og:image" content="https://nbn.today/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Nothing But Net — fantasy basketball GM simulation league">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#111827">
  <!-- /NBN:og -->
  <style>
    .page { max-width: 960px; margin: 0 auto; }
    header { margin-bottom: 1.75rem; }
    header h1 { font-size: 1.875rem; font-weight: 700; letter-spacing: -0.02em; }
    header p { color: var(--text-muted); margin-top: 0.4rem; font-size: 0.9rem; }
    .table-wrap { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; white-space: nowrap; }
    thead th.center { text-align: center; }
    thead th.stat-primary { color: var(--text-muted); }
    thead th.stat-sec { color: var(--text-dim); }
    tbody tr { border-bottom: 1px solid var(--border-subtle); transition: background 0.1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--bg-hover); }
    td { padding: 0.65rem 1rem; color: var(--text-secondary); }
    td.player-name { font-weight: 600; color: var(--text-primary); }
    td.right { text-align: right; font-variant-numeric: tabular-nums; }
    td.center { text-align: center; }
    td.muted { color: var(--text-muted); }
    td.stat-primary { color: var(--text-primary); font-weight: 600; }
    td.stat-sec { color: var(--text-muted); }
    #status { text-align: center; padding: 3rem; color: var(--text-muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="page">
    <nav class="nav"></nav>
    <header>
      <h1>Single-Game Steals Highs</h1>
      <p>Top 50 single-game steals performances in NBN history. Click any column to sort.</p>
    </header>
    <div class="table-wrap" id="table-wrap">
      <div id="status">Loading…</div>
    </div>
  </div>
  <script>window.PAGE_CONFIG = { statKey: 'S', statLabel: 'STL', csvPath: '/data/game-highs-s.csv' };</script>
  <script src="/stats/highs/table.js"></script>
  <script src="/nav.js"></script>
  <script src="/token-badge.js"></script>
</body>
</html>

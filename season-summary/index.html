<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="/theme-boot.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/logo.png">
  <link rel="stylesheet" href="/css/shared.css">
  <title>Season Summary — NBN</title>
  <!-- NBN:og -->
  <meta name="description" content="Every NBN season at a glance — champion, award winners and statistical leaders.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NBN">
  <meta property="og:title" content="Season Summary — NBN">
  <meta property="og:description" content="Every NBN season at a glance — champion, award winners and statistical leaders.">
  <meta property="og:url" content="https://nbn.today/season-summary/">
  <meta property="og:image" content="https://nbn.today/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Nothing But Net — fantasy basketball GM simulation league">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0d0e11">
  <!-- /NBN:og -->
  <style>
    .ss-list { display: flex; flex-direction: column; gap: var(--space-4); }
    .ss-season { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }

    /* Header: the season, then who won it. */
    .ss-head { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--border-subtle); flex-wrap: wrap; }
    .ss-year { font-family: var(--font-display); font-size: 1.75rem; font-weight: 700; line-height: 1; color: var(--text-primary); min-width: 5.5rem; }
    .ss-champ { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
    .ss-champ img { width: 44px; height: 44px; object-fit: contain; }
    .ss-champ-label { font-size: var(--text-xs); font-weight: 600; color: var(--gold); }
    .ss-champ-name { font-size: var(--text-md); font-weight: 700; color: var(--text-primary); }
    .ss-champ-name a { color: inherit; }
    .ss-final { font-size: var(--text-sm); color: var(--text-muted); }
    .ss-final b { color: var(--text-secondary); font-weight: 600; }
    .ss-cf { margin-left: auto; font-size: var(--text-xs); color: var(--text-muted); text-align: right; }
    .ss-cf b { color: var(--text-secondary); font-weight: 600; }

    /* Body: three columns of label / value rows. */
    .ss-body { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .ss-col { padding: var(--space-3) var(--space-5) var(--space-4); min-width: 0; }
    .ss-col + .ss-col { border-left: 1px solid var(--border-subtle); }
    .ss-col h3 { font-size: var(--text-xs); font-weight: 600; color: var(--text-muted); margin-bottom: var(--space-2); }
    .ss-row { display: grid; grid-template-columns: 3.25rem minmax(0, 1fr) auto; align-items: center; column-gap: var(--space-2); padding: 3px 0; font-size: var(--text-sm); }
    .ss-row-k { font-size: var(--text-xs); font-weight: 600; color: var(--text-muted); }
    .ss-row-v { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-primary); }
    .ss-row-v a { color: inherit; }
    .ss-row-v img { width: 16px; height: 16px; vertical-align: -3px; margin-right: 6px; object-fit: contain; }
    .ss-row-n { font-size: var(--text-xs); color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .ss-none { color: var(--text-dim); }

    @media (max-width: 860px) {
      .ss-body { grid-template-columns: 1fr; }
      .ss-col + .ss-col { border-left: none; border-top: 1px solid var(--border-subtle); }
      .ss-cf { margin-left: 0; text-align: left; flex-basis: 100%; }
    }
  </style>
</head>
<body>
  <div class="page ui-page">
    <nav class="nav"></nav>

    <header class="ui-header">
      <h1 class="ui-title">Season Summary</h1>
    </header>

    <div class="ss-list" id="list">
      <div class="ui-loading">Loading…</div>
    </div>
  </div>

  <script src="/names.js"></script>
  <script>
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const blank = s => !s || s === 'NA';
    const logo = abbr => `<img src="/logos/logo-${abbr.toLowerCase()}.png" alt="" onerror="this.style.display='none'">`;
    const teamLink = abbr => `<a href="/teams/${abbr}/">${logo(abbr)}${abbr}</a>`;
    const fullSeason = s => { const [a, b] = s.split('-'); return `20${a}–${b}`; };

    let slugByName = {};   // "LAST, FIRST" (upper) → slug, from /api/players

    function playerLink(raw) {
      const slug = slugByName[String(raw).toUpperCase()];
      const name = esc(nbnPlayerName(raw));
      return slug ? `<a href="/players/?p=${encodeURIComponent(slug)}">${name}</a>` : name;
    }

    function row(label, value, note = '') {
      return `<div class="ss-row"><span class="ss-row-k">${label}</span>`
        + `<span class="ss-row-v">${value || '<span class="ss-none">—</span>'}</span>`
        + `<span class="ss-row-n">${note}</span></div>`;
    }

    // "JOKIC, NIKOLA (1087)" → a player link and the total.
    function leaderRow(label, raw) {
      if (blank(raw)) return row(label, '');
      const m = raw.match(/^(.+) \((\d+)\)$/);
      return m ? row(label, playerLink(m[1]), Number(m[2]).toLocaleString()) : row(label, esc(raw));
    }

    // "MIL (+12.04)" → a team link and the margin.
    function ratingRow(label, raw) {
      if (blank(raw)) return row(label, '');
      const m = raw.match(/^([A-Z]{3}) \((.+)\)$/);
      return m ? row(label, teamLink(m[1]), esc(m[2])) : row(label, esc(raw));
    }

    function awardRow(label, raw) { return row(label, blank(raw) ? '' : playerLink(raw)); }

    // COTY reads "Schu (UTA)" in the build's file, and a bare team from a live
    // ballot; a three-letter value is a team either way.
    function teamOrText(raw) {
      if (blank(raw)) return '';
      if (/^[A-Z]{3}$/.test(raw)) return teamLink(raw);
      const m = raw.match(/^(.+) \(([A-Z]{3})\)$/);
      return m ? `${logo(m[2])}${esc(m[1])}` : esc(raw);
    }

    function seasonCard(r, brackets) {
      const finals = brackets.find(b => b.SEASON === r.SEASON && b.ROUND === '4');
      let finalLine = '';
      if (finals && !blank(r.CHAMPION)) {
        const champW = finals.T1 === r.CHAMPION ? finals.T1_W : finals.T2_W;
        const otherW = finals.T1 === r.CHAMPION ? finals.T2_W : finals.T1_W;
        const opp = finals.T1 === r.CHAMPION ? finals.T2 : finals.T1;
        finalLine = `def. <b>${esc(opp)}</b> in the Finals, ${champW}–${otherW}`;
      } else if (!blank(r.RUNNER_UP)) {
        finalLine = `def. <b>${esc(r.RUNNER_UP)}</b> in the Finals`;
      }
      const cf = [r.EAST_RUNNER_UP, r.WEST_RUNNER_UP].filter(t => !blank(t));

      const head = blank(r.CHAMPION)
        ? `<div class="ss-champ"><div class="ss-final">No champion yet</div></div>`
        : `<div class="ss-champ">${logo(r.CHAMPION)}<div>
             <div class="ss-champ-label">Champion</div>
             <div class="ss-champ-name"><a href="/teams/${r.CHAMPION}/">${esc(r.CHAMPION)}</a></div>
             ${finalLine ? `<div class="ss-final">${finalLine}</div>` : ''}
           </div></div>`;

      return `<section class="ss-season" id="s${r.SEASON}">
        <div class="ss-head">
          <div class="ss-year">${fullSeason(r.SEASON)}</div>
          ${head}
          ${cf.length ? `<div class="ss-cf">Conference finalists<br><b>${cf.map(esc).join(', ')}</b></div>` : ''}
        </div>
        <div class="ss-body">
          <div class="ss-col"><h3>Awards</h3>
            ${awardRow('MVP', r.MVP)}${awardRow('DPOY', r.DPOY)}${awardRow('ROTY', r.ROTY)}${awardRow('MIP', r.MIP)}
            ${row('FOTY', teamOrText(r.FOTY))}${row('COTY', teamOrText(r.COTY))}
          </div>
          <div class="ss-col"><h3>Statistical leaders</h3>
            ${leaderRow('PTS', r.PTS_LEADER)}${leaderRow('REB', r.REB_LEADER)}${leaderRow('AST', r.AST_LEADER)}
            ${leaderRow('STL', r.STL_LEADER)}${leaderRow('BLK', r.BLK_LEADER)}${leaderRow('3PM', r.TPM_LEADER)}
          </div>
          <div class="ss-col"><h3>Team ratings</h3>
            ${ratingRow('Offense', r.BEST_OFF)}${ratingRow('Defense', r.BEST_DEF)}${ratingRow('Overall', r.BEST_OVERALL)}
          </div>
        </div>
      </section>`;
    }

    // Seasons up to and including this are sourced from the metadata.R pipeline (league-history.csv).
    // Seasons strictly after this are built live from bracket + award ballot data.
    const LEGACY_CUTOFF = '24-25';

    // Tally a single award category from ballot data using the [5,3,1] point system.
    // Returns the winning candidate (slug or team abbr) or null.
    function tallyAward(ballots, key) {
      const pts = {};
      Object.values(ballots).forEach(ballot => {
        (ballot[key] || []).forEach((candidate, i) => {
          if (candidate != null) {
            const w = [5, 3, 1][i] ?? 0;
            if (w) pts[candidate] = (pts[candidate] || 0) + w;
          }
        });
      });
      const sorted = Object.entries(pts).sort((a, b) => b[1] - a[1]);
      return sorted.length ? sorted[0][0] : null;
    }

    // Convert a player slug to "LAST, FIRST" format using the bios dict.
    function slugToName(slug, bios) {
      if (!slug) return '';
      return (bios && bios[slug]) ? bios[slug].name || '' : '';
    }

    // Derive the loser of a bracket matchup row.
    function loser(g) {
      if (!g) return '';
      return g.T1 === g.WINNER ? g.T2 : g.T1;
    }

    // Build one live history row from bracket + ballot data for the given season.
    // statsBySeason: map of season → CSV stat-leader fields (always from the build pipeline).
    function buildLiveRow(season, brackets, ballots, bios, statsBySeason) {
      const s = brackets.filter(r => r.SEASON === season);
      const done = r => parseInt(r.T1_W) === 4 || parseInt(r.T2_W) === 4;
      const finals = s.find(r => r.ROUND === '4' && done(r));
      const confFinals = s.filter(r => r.ROUND === '3' && done(r));
      const eastCF = confFinals.find(r => r.T1_SEED && r.T1_SEED.startsWith('East-'));
      const westCF = confFinals.find(r => r.T1_SEED && r.T1_SEED.startsWith('West-'));

      const csvStats = (statsBySeason && statsBySeason[season]) || {};
      const row = {
        SEASON:         season,
        CHAMPION:       finals ? finals.WINNER : '',
        RUNNER_UP:      loser(finals),
        EAST_RUNNER_UP: loser(eastCF),
        WEST_RUNNER_UP: loser(westCF),
        MVP: '', DPOY: '', ROTY: '', MIP: '', FOTY: '', COTY: '',
        PTS_LEADER: csvStats.PTS_LEADER || '',
        REB_LEADER: csvStats.REB_LEADER || '',
        AST_LEADER: csvStats.AST_LEADER || '',
        STL_LEADER: csvStats.STL_LEADER || '',
        BLK_LEADER: csvStats.BLK_LEADER || '',
        TPM_LEADER: csvStats.TPM_LEADER || '',
        BEST_OFF:    csvStats.BEST_OFF    || '',
        BEST_DEF:    csvStats.BEST_DEF    || '',
        BEST_OVERALL: csvStats.BEST_OVERALL || '',
      };

      if (ballots) {
        row.MVP  = slugToName(tallyAward(ballots, 'MVP'),  bios);
        row.DPOY = slugToName(tallyAward(ballots, 'DPOY'), bios);
        row.ROTY = slugToName(tallyAward(ballots, 'ROTY'), bios);
        row.MIP  = slugToName(tallyAward(ballots, 'MIP'),  bios);
        row.FOTY = tallyAward(ballots, 'FOTY') || '';
        row.COTY = tallyAward(ballots, 'COTY') || '';
      }

      return row;
    }

    (async () => {
      const wrap = document.getElementById('list');
      const token = localStorage.getItem('nbn_token') || '';
      try {
        // Fetch all data sources in parallel.
        const [historyRes, bracketsRes, configRes, allBios] = await Promise.all([
          fetch('/data/league-history.csv'),
          fetch('/standings/playoff-brackets.csv'),
          fetch('/api/awards-config'),
          fetch('/api/players').then(r => r.ok ? r.json() : {}).catch(() => ({})),
        ]);
        Object.entries(allBios).forEach(([slug, b]) => {
          if (b && b.name) slugByName[b.name.toUpperCase()] = slug;
        });

        if (!historyRes.ok) throw new Error('Failed to load league-history.csv');

        // Playoff bracket data (needed for both legacy champion lookup and live seasons).
        const allBrackets = bracketsRes.ok ? parseCSV(await bracketsRes.text()) : [];

        // Parse all CSV rows once; stat leaders come from here for every season.
        const allCsvRows = parseCSV(await historyRes.text());

        // Stat leaders by season (first row per season is enough — all rows share the same leaders).
        const statsBySeason = {};
        allCsvRows.forEach(r => {
          if (!statsBySeason[r.SEASON]) {
            statsBySeason[r.SEASON] = {
              PTS_LEADER: r.PTS_LEADER, REB_LEADER: r.REB_LEADER,
              AST_LEADER: r.AST_LEADER, STL_LEADER: r.STL_LEADER,
              BLK_LEADER: r.BLK_LEADER, TPM_LEADER: r.TPM_LEADER,
              BEST_OFF: r.BEST_OFF, BEST_DEF: r.BEST_DEF, BEST_OVERALL: r.BEST_OVERALL,
            };
          }
        });

        // Legacy rows: from CSV, only up to and including LEGACY_CUTOFF.
        // One row per season, CHAMPION already correct — the Python build writes it that way.
        const legacyRows = allCsvRows.filter(r => r.SEASON <= LEGACY_CUTOFF);

        // Awards reveal config.
        const awardsConfig = configRes.ok ? await configRes.json() : {};

        // Build live rows for any season beyond the cutoff that has bracket data.
        const liveSeasons = [...new Set(
          allBrackets.filter(r => r.SEASON > LEGACY_CUTOFF).map(r => r.SEASON)
        )].sort();

        const liveRows = [];
        for (const season of liveSeasons) {
          const isRevealed = !!(awardsConfig[season]?.revealed);
          let ballots = null;
          const bios = allBios;

          if (isRevealed) {
            const authHeader = token ? { 'Authorization': `Bearer ${token}` } : {};
            const ballotsRes = await fetch(`/api/awards-ballots/${season}`, { headers: authHeader });
            if (ballotsRes.ok) ballots = await ballotsRes.json();
          }

          liveRows.push(buildLiveRow(season, allBrackets, ballots, bios, statsBySeason));
        }

        const allRows = [...legacyRows, ...liveRows];
        wrap.innerHTML = [...allRows].reverse().map(r => seasonCard(r, allBrackets)).join('');
      } catch (e) {
        wrap.innerHTML = `<div class="ui-empty">Failed to load league history: ${esc(e.message)}</div>`;
      }
    })();
  </script>
  <script src="/nav.js"></script>
  <script src="/token-badge.js"></script>
</body>
</html>

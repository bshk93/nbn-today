<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/logo.png">
  <link rel="stylesheet" href="/css/shared.css">
  <title>Suggestions — NBN</title>
  <!-- NBN:og -->
  <meta name="description" content="Suggest a change to NBN, and see what the league thinks of it.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NBN">
  <meta property="og:title" content="Suggestions — NBN">
  <meta property="og:description" content="Suggest a change to NBN, and see what the league thinks of it.">
  <meta property="og:url" content="https://nbn.today/suggestions/">
  <meta property="og:image" content="https://nbn.today/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Nothing But Net — fantasy basketball GM simulation league">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#111827">
  <!-- /NBN:og -->
  <style>
    .page { max-width: 860px; margin: 0 auto; }

    .top-bar { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 2rem; gap: 1rem; flex-wrap: wrap; }
    .top-bar h1 { font-size: 1.875rem; font-weight: 700; letter-spacing: -0.02em; }
    .top-bar p { color: var(--text-muted); margin-top: 0.35rem; font-size: 0.9rem; }

    .right-bar { display: flex; align-items: center; gap: 0.75rem; flex-shrink: 0; }
    .auth-label { font-size: 0.8rem; color: var(--text-muted); }
    .auth-name { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }

    button {
      font-family: inherit; cursor: pointer; border-radius: 6px;
      font-size: 0.8rem; font-weight: 500; padding: 0.35rem 0.8rem;
      border: 1px solid transparent; transition: background 0.1s;
    }
    .btn-primary { background: var(--accent-dark); border-color: var(--accent); color: var(--text-on-accent); }
    .btn-primary:hover { background: var(--accent-dark); }
    .btn-primary:disabled { opacity: 0.5; cursor: default; }
    .btn-ghost { background: transparent; border-color: var(--border); color: var(--text-muted); }
    .btn-ghost:hover { background: var(--bg-card); color: var(--text-primary); }
    .btn-danger { background: transparent; border-color: var(--border); color: var(--text-muted); }
    .btn-danger:hover { border-color: var(--danger); color: var(--danger); }

    /* Tabs */
    .tabs {
      display: flex; gap: 0; margin-bottom: 1.25rem; border-bottom: 1px solid var(--border);
      overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      background: none; border: none; border-bottom: 2px solid transparent;
      color: var(--text-muted); padding: 0.5rem 1rem; font-size: 0.8rem; font-weight: 600;
      cursor: pointer; font-family: inherit; margin-bottom: -1px;
      letter-spacing: 0.02em; white-space: nowrap; flex-shrink: 0;
    }
    .tab:hover { color: var(--text-secondary); }
    .tab.active { color: var(--text-primary); border-bottom-color: var(--accent); }
    .tab-count { color: var(--text-dim); font-weight: 500; }
    .tab.active .tab-count { color: var(--text-muted); }

    @media (max-width: 480px) {
      .tab { padding: 0.5rem 0.6rem; font-size: 0.75rem; }
    }

    /* Suggestion cards */
    .suggestion-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .suggestion-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
      padding: 1rem 1.25rem; cursor: pointer; transition: border-color 0.1s, background 0.1s;
    }
    .suggestion-card:hover { border-color: var(--text-dim); }
    .card-row { display: flex; align-items: center; gap: 1rem; }
    .card-body { flex: 1; min-width: 0; }
    .card-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 0.25rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-meta { font-size: 0.75rem; color: var(--text-muted); display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .card-meta .sep { color: var(--border); }
    .card-arrow { color: var(--border); font-size: 1.1rem; flex-shrink: 0; transition: transform 0.15s; }
    .suggestion-card.expanded .card-arrow { transform: rotate(90deg); }

    .card-details { display: none; margin-top: 0.85rem; padding-top: 0.85rem; border-top: 1px solid var(--border-subtle); }
    .suggestion-card.expanded .card-details { display: block; }
    .card-description { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.85rem; }
    .card-description:empty::before { content: '(no description provided)'; color: var(--text-dim); font-style: italic; }
    .card-actions { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .card-actions select {
      font-family: inherit; font-size: 0.78rem; background: var(--bg-page); color: var(--text-secondary);
      border: 1px solid var(--border); border-radius: 6px; padding: 0.3rem 0.5rem;
    }
    .card-actions button:disabled { opacity: 0.45; cursor: default; }
    .card-actions button:disabled:hover { background: transparent; border-color: var(--border); color: var(--text-muted); }
    .edited-tag { font-size: 0.7rem; color: var(--text-dim); font-style: italic; }

    /* Comment thread */
    .thread { margin-top: 1rem; padding-top: 0.85rem; border-top: 1px solid var(--border-subtle); }
    .thread-head {
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase;
      color: var(--text-dim); margin-bottom: 0.75rem;
    }
    .entry { display: flex; flex-direction: column; gap: 0.2rem; margin-bottom: 0.85rem; }
    .entry-meta { font-size: 0.72rem; color: var(--text-muted); display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
    .entry-author { font-weight: 600; color: var(--text-secondary); }
    .entry-body { font-size: 0.85rem; color: var(--text-secondary); white-space: pre-wrap; }
    .entry-actions { display: flex; gap: 0.4rem; }
    .entry-actions button {
      background: none; border: none; padding: 0; font-size: 0.72rem; color: var(--text-dim);
      font-family: inherit; text-decoration: underline;
    }
    .entry-actions button:hover { color: var(--text-secondary); }
    .entry-status { font-size: 0.75rem; color: var(--text-muted); display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
    .entry-status .dot { color: var(--border); }
    .thread-empty { font-size: 0.8rem; color: var(--text-dim); font-style: italic; margin-bottom: 0.85rem; }

    .composer textarea {
      width: 100%; background: var(--bg-page); border: 1px solid var(--border); color: var(--text-primary);
      border-radius: 6px; padding: 0.5rem 0.75rem; font-size: 0.85rem; font-family: inherit;
      resize: vertical; min-height: 3.5rem; margin-bottom: 0.5rem;
    }
    .composer textarea:focus { outline: none; border-color: var(--accent); }
    .composer-actions { display: flex; align-items: center; gap: 0.6rem; }
    .composer-hint { font-size: 0.72rem; color: var(--text-dim); }
    .signin-hint { font-size: 0.78rem; color: var(--text-dim); }

    .badge {
      display: inline-block; font-size: 0.65rem; font-weight: 700;
      letter-spacing: 0.07em; text-transform: uppercase; padding: 0.15rem 0.5rem;
      border-radius: 4px; flex-shrink: 0;
    }
    .badge-open        { background: var(--accent-panel-bg); border: 1px solid var(--accent-dark); color: var(--accent-light); }
    .badge-in_progress { background: var(--gold-bg); border: 1px solid var(--gold-dim); color: var(--gold); }
    .badge-complete    { background: var(--success-dark-bg); border: 1px solid #16a34a; color: var(--success); }
    .badge-closed      { background: var(--bg-subtle); border: 1px solid var(--border); color: var(--text-dim); }

    .section { margin-bottom: 2.5rem; }
    .empty { text-align: center; padding: 3rem 1rem; color: var(--text-dim); font-size: 0.9rem; }

    /* Modals */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      z-index: 100; align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
      padding: 1.5rem; width: 100%; max-width: 420px; margin: 1rem;
    }
    .modal h2 { font-size: 1rem; font-weight: 700; margin-bottom: 0.75rem; }
    .modal input, .modal textarea {
      width: 100%; background: var(--bg-page); border: 1px solid var(--border); color: var(--text-primary);
      border-radius: 6px; padding: 0.5rem 0.75rem; font-size: 0.875rem;
      margin-bottom: 0.75rem; font-family: inherit;
    }
    .modal input#token-input { font-family: var(--font-mono); }
    .modal textarea { resize: vertical; min-height: 5.5rem; }
    .modal input:focus, .modal textarea:focus { outline: none; border-color: var(--accent); }
    .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; }
    .modal p.note { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.75rem; }
    .modal .field-label { font-size: 0.72rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.3rem; display: block; }
    .modal-error { font-size: 0.78rem; color: var(--danger); margin-bottom: 0.5rem; display: none; }
    .modal-lg { max-width: 620px; }

    /* ── Markdown editor (description field) ── */
    .md-editor-wrap {
      background: var(--bg-page); border: 1px solid var(--border); border-radius: 8px;
      overflow: hidden; margin-bottom: 0.75rem;
    }
    .md-editor-bar {
      display: flex; align-items: center; gap: 0.2rem;
      padding: 0.3rem 0.4rem; border-bottom: 1px solid var(--border); background: var(--bg-card);
    }
    .md-fmt-btn {
      background: transparent; border: none; border-radius: 4px; color: var(--text-muted);
      cursor: pointer; font-family: inherit; font-size: 0.7rem; font-weight: 700;
      line-height: 1; padding: 0.25rem 0.4rem; min-width: 1.5rem; text-align: center;
    }
    .md-fmt-btn:hover { background: var(--border); color: var(--text-secondary); }
    .md-fmt-sep { width: 1px; height: 12px; background: var(--border-dark); margin: 0 0.1rem; flex-shrink: 0; }
    .md-mode-tabs { display: flex; background: var(--bg-page); border-radius: 5px; padding: 2px; margin-left: auto; gap: 0; }
    .md-mode-tab {
      padding: 0.15rem 0.55rem; font-size: 0.68rem; font-weight: 600; color: var(--text-dim);
      background: transparent; border: none; border-radius: 3px; cursor: pointer;
      font-family: inherit; letter-spacing: 0.02em;
    }
    .md-mode-tab:hover { color: var(--text-muted); }
    .md-mode-tab.active { background: var(--border); color: var(--text-secondary); }
    .md-editor-wrap textarea.md-write {
      display: block; width: 100%; background: transparent; border: none; margin-bottom: 0;
      color: var(--text-primary); caret-color: var(--link); outline: none; resize: vertical;
      font-family: inherit; font-size: 0.85rem; padding: 0.55rem 0.75rem; min-height: 5.5rem; border-radius: 0;
    }
    .md-editor-wrap textarea.md-write:focus { outline: none; border-color: transparent; }
    .md-write::placeholder { color: var(--text-dim); }
    .md-preview { display: none; min-height: 5.5rem; padding: 0.55rem 0.8rem; }
    .md-preview:empty::before { content: 'Nothing to preview.'; color: var(--text-dim); font-style: italic; }

    /* Shared rendered-markdown typography, used by both live preview and card descriptions */
    .md-content { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.65; }
    .md-content > *:first-child { margin-top: 0; }
    .md-content > *:last-child { margin-bottom: 0; }
    .md-content h1, .md-content h2, .md-content h3 { color: var(--text-primary); font-weight: 700; margin: 1em 0 0.4em; line-height: 1.3; }
    .md-content h1 { font-size: 1.15rem; }
    .md-content h2 { font-size: 1.05rem; }
    .md-content h3 { font-size: 0.95rem; }
    .md-content p { margin: 0.6em 0; }
    .md-content ul, .md-content ol { padding-left: 1.4em; margin: 0.6em 0; }
    .md-content li { margin: 0.2em 0; }
    .md-content blockquote {
      border-left: 3px solid var(--text-dim); color: var(--text-muted);
      margin: 0.7em 0; padding: 0.1em 0 0.1em 0.9em;
    }
    .md-content code {
      background: var(--bg-card); border-radius: 4px; color: #a5b4fc;
      font-family: var(--font-mono); font-size: 0.87em; padding: 0.1em 0.35em;
    }
    .md-content pre { background: var(--bg-card); border-radius: 6px; overflow-x: auto; padding: 0.75em 0.9em; margin: 0.65em 0; }
    .md-content pre code { background: none; padding: 0; color: var(--text-secondary); }
    .md-content a { color: var(--link); }
    .md-content a:hover { text-decoration: underline; }
    .md-content hr { border: none; border-top: 1px solid var(--border); margin: 1.2em 0; }
    .md-content strong { color: var(--text-primary); font-weight: 600; }
    .md-content table { border-collapse: collapse; width: 100%; margin: 0.65em 0; }
    .md-content th, .md-content td { border: 1px solid var(--border); padding: 0.35em 0.65em; }
    .md-content th { background: var(--bg-card); color: var(--text-muted); font-size: 0.8rem; }
  </style>
</head>
<body>
<div class="page">
  <nav class="nav"></nav>

  <div class="top-bar">
    <div>
      <h1>Suggestions</h1>
      <p>Things to work on for the site — submit an idea, track its status.</p>
    </div>
    <div class="right-bar">
      <span class="auth-label" id="auth-label">Not signed in</span>
      <span class="auth-name" id="auth-name"></span>
      <button class="btn-ghost" id="btn-auth" onclick="openAuthModal()">Sign in</button>
      <button class="btn-primary" id="btn-new" style="display:none;" onclick="openNewModal()">+ New Suggestion</button>
    </div>
  </div>

  <div class="section">
    <div class="tabs">
      <button class="tab active" data-tab="open" onclick="setTab('open')">Open <span class="tab-count" id="count-open"></span></button>
      <button class="tab" data-tab="in_progress" onclick="setTab('in_progress')">In Progress <span class="tab-count" id="count-in_progress"></span></button>
      <button class="tab" data-tab="complete" onclick="setTab('complete')">Complete <span class="tab-count" id="count-complete"></span></button>
      <button class="tab" data-tab="closed" onclick="setTab('closed')">Closed <span class="tab-count" id="count-closed"></span></button>
      <button class="tab" data-tab="all" onclick="setTab('all')">All <span class="tab-count" id="count-all"></span></button>
    </div>
    <div class="suggestion-list" id="suggestion-list">
      <div class="empty">Loading…</div>
    </div>
  </div>
</div>

<!-- Auth modal -->
<div class="modal-overlay" id="modal-overlay" onclick="closeAuthModal(event)">
  <div class="modal">
    <h2>Sign in with your member token</h2>
    <p class="note">A member token is required to submit suggestions. It's stored locally in your browser.</p>
    <input type="password" id="token-input" placeholder="Paste your token" autocomplete="off">
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeAuthModal()">Cancel</button>
      <button class="btn-primary" onclick="doSignIn()">Sign in</button>
    </div>
  </div>
</div>

<!-- New suggestion modal -->
<div class="modal-overlay" id="new-modal-overlay" onclick="closeNewModal(event)">
  <div class="modal modal-lg">
    <h2>New Suggestion</h2>
    <div class="modal-error" id="new-error"></div>
    <span class="field-label">Title</span>
    <input type="text" id="new-title" placeholder="Short summary…" maxlength="120" autocomplete="off">
    <span class="field-label">Description</span>
    <div id="new-description-md"></div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeNewModal()">Cancel</button>
      <button class="btn-primary" id="new-submit-btn" onclick="submitNewSuggestion()">Submit</button>
    </div>
  </div>
</div>

<!-- Edit suggestion modal -->
<div class="modal-overlay" id="edit-modal-overlay" onclick="closeEditModal(event)">
  <div class="modal modal-lg">
    <h2 id="edit-modal-title">Edit Suggestion</h2>
    <div class="modal-error" id="edit-error"></div>
    <span class="field-label">Title</span>
    <input type="text" id="edit-title" maxlength="120" autocomplete="off">
    <span class="field-label">Description</span>
    <div id="edit-description-md"></div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeEditModal()">Cancel</button>
      <button class="btn-primary" id="edit-submit-btn" onclick="submitEdit()">Save</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script>
const API = '/api';
let allSuggestions = [];
let currentTab = 'open';
let me = null; // { name, roles }
// Every mutation reloads the whole list and re-renders, so which cards were
// open has to survive that — otherwise posting a comment collapses the thread
// you were reading.
const expandedIds = new Set();

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function fmtDateTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Markdown editor (shared by the New and Edit description fields) ──────────

function mdEditorHTML(id) {
  return `
    <div class="md-editor-wrap">
      <div class="md-editor-bar">
        <button type="button" class="md-fmt-btn" title="Bold (Ctrl+B)" onclick="mdFmt('${id}','**','**')"><b>B</b></button>
        <button type="button" class="md-fmt-btn" title="Italic (Ctrl+I)" onclick="mdFmt('${id}','_','_')"><i style="font-style:italic">I</i></button>
        <div class="md-fmt-sep"></div>
        <button type="button" class="md-fmt-btn" title="Heading" onclick="mdFmtLine('${id}','## ')">H2</button>
        <button type="button" class="md-fmt-btn" title="Blockquote" onclick="mdFmtLine('${id}','> ')">&#10077;</button>
        <button type="button" class="md-fmt-btn" title="Bullet list" onclick="mdFmtLine('${id}','- ')">&bull; &mdash;</button>
        <button type="button" class="md-fmt-btn" title="Link (Ctrl+K)" onclick="mdFmtLink('${id}')">&#128279;</button>
        <div class="md-mode-tabs">
          <button type="button" class="md-mode-tab active" data-mode="write" onclick="mdSetMode('${id}','write')">Write</button>
          <button type="button" class="md-mode-tab" data-mode="preview" onclick="mdSetMode('${id}','preview')">Preview</button>
        </div>
      </div>
      <textarea class="md-write" id="${id}" placeholder="Details, context, why it matters… (optional, Markdown supported)"></textarea>
      <div class="md-preview md-content" id="${id}-preview"></div>
    </div>`;
}
document.getElementById('new-description-md').innerHTML = mdEditorHTML('new-description');
document.getElementById('edit-description-md').innerHTML = mdEditorHTML('edit-description');

function mdFmt(id, before, after) {
  const ta = document.getElementById(id);
  const s = ta.selectionStart, e = ta.selectionEnd;
  const sel = ta.value.slice(s, e);
  const rep = before + (sel || 'text') + after;
  ta.setRangeText(rep, s, e, 'select');
  if (!sel) { ta.selectionStart = s + before.length; ta.selectionEnd = s + before.length + 4; }
  ta.focus();
}
function mdFmtLine(id, prefix) {
  const ta = document.getElementById(id);
  const s = ta.selectionStart;
  const lineStart = ta.value.lastIndexOf('\n', s - 1) + 1;
  const alreadyHas = ta.value.slice(lineStart).startsWith(prefix);
  if (alreadyHas) ta.setRangeText('', lineStart, lineStart + prefix.length, 'end');
  else ta.setRangeText(prefix, lineStart, lineStart, 'end');
  ta.focus();
}
function mdFmtLink(id) {
  const ta = document.getElementById(id);
  const s = ta.selectionStart, e = ta.selectionEnd;
  const sel = ta.value.slice(s, e);
  const rep = `[${sel || 'link text'}](url)`;
  ta.setRangeText(rep, s, e, 'select');
  if (!sel) { ta.selectionStart = s + 1; ta.selectionEnd = s + 9; }
  ta.focus();
}
function mdSetMode(id, mode) {
  const ta = document.getElementById(id);
  const preview = document.getElementById(id + '-preview');
  ta.closest('.md-editor-wrap').querySelectorAll('.md-mode-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
  if (mode === 'preview') {
    preview.innerHTML = marked.parse(ta.value || '');
    ta.style.display = 'none';
    preview.style.display = 'block';
  } else {
    ta.style.display = 'block';
    preview.style.display = 'none';
    ta.focus();
  }
}
document.addEventListener('keydown', e => {
  const el = document.activeElement;
  if (!el || !el.classList || !el.classList.contains('md-write')) return;
  if ((e.ctrlKey || e.metaKey) && e.key === 'b') { e.preventDefault(); mdFmt(el.id, '**', '**'); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'i') { e.preventDefault(); mdFmt(el.id, '_', '_'); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); mdFmtLink(el.id); }
});

const STATUS_LABELS = { open: 'Open', in_progress: 'In Progress', complete: 'Complete', closed: 'Closed' };

function badge(status) {
  return `<span class="badge badge-${status}">${STATUS_LABELS[status] || status}</span>`;
}

function isPrivileged() {
  return !!me && (me.roles || []).some(r => r === 'bod' || r === 'admin');
}

function commentsOf(s) {
  return (s.comments || []).filter(c => c.kind === 'comment');
}

function renderEntry(s, entry) {
  const el = document.createElement('div');

  if (entry.kind === 'status') {
    el.className = 'entry-status';
    el.innerHTML = `<span class="entry-author">${escHtml(entry.author)}</span>
      <span>moved this to</span> ${badge(entry.to)}
      <span class="dot">•</span><span>${fmtDateTime(entry.created_at)}</span>`;
    return el;
  }

  el.className = 'entry';
  el.innerHTML = `
    <div class="entry-meta">
      <span class="entry-author">${escHtml(entry.author)}</span>
      <span>${fmtDateTime(entry.created_at)}</span>
      ${entry.edited_at ? '<span class="edited-tag">edited</span>' : ''}
    </div>
    <div class="entry-body">${escHtml(entry.body)}</div>`;

  // A comment is the author's, or BOD's to moderate — same split the API enforces.
  if (me && (me.name === entry.author || isPrivileged())) {
    const bar = document.createElement('div');
    bar.className = 'entry-actions';
    const edit = document.createElement('button');
    edit.textContent = 'Edit';
    edit.addEventListener('click', () => startCommentEdit(el, s, entry));
    const del = document.createElement('button');
    del.textContent = 'Delete';
    del.addEventListener('click', () => deleteComment(s.id, entry.id));
    bar.append(edit, del);
    el.appendChild(bar);
  }
  return el;
}

function startCommentEdit(el, s, entry) {
  const bodyEl = el.querySelector('.entry-body');
  const actions = el.querySelector('.entry-actions');
  const ta = document.createElement('textarea');
  ta.value = entry.body;
  ta.style.cssText = 'width:100%;background:var(--bg-page);border:1px solid var(--border);color:var(--text-primary);border-radius:6px;padding:0.5rem 0.75rem;font-size:0.85rem;font-family:inherit;resize:vertical;min-height:3.5rem;';
  bodyEl.replaceWith(ta);
  actions.innerHTML = '';
  const save = document.createElement('button');
  save.textContent = 'Save';
  save.addEventListener('click', () => saveComment(s.id, entry.id, ta.value));
  const cancel = document.createElement('button');
  cancel.textContent = 'Cancel';
  cancel.addEventListener('click', renderSuggestions);
  actions.append(save, cancel);
  ta.focus();
}

function renderThread(s) {
  const wrap = document.createElement('div');
  wrap.className = 'thread';
  const count = commentsOf(s).length;
  const head = document.createElement('div');
  head.className = 'thread-head';
  head.textContent = count === 1 ? '1 comment' : `${count} comments`;
  wrap.appendChild(head);

  const entries = s.comments || [];
  if (!entries.length) {
    const empty = document.createElement('div');
    empty.className = 'thread-empty';
    empty.textContent = 'No comments yet.';
    wrap.appendChild(empty);
  } else {
    entries.forEach(e => wrap.appendChild(renderEntry(s, e)));
  }

  if (me) {
    const composer = document.createElement('div');
    composer.className = 'composer';
    const ta = document.createElement('textarea');
    ta.placeholder = 'Add a comment…';
    const bar = document.createElement('div');
    bar.className = 'composer-actions';
    const btn = document.createElement('button');
    btn.className = 'btn-primary';
    btn.textContent = 'Comment';
    btn.addEventListener('click', async () => {
      if (!ta.value.trim()) return;
      btn.disabled = true;
      await postComment(s.id, ta.value.trim());
      btn.disabled = false;
    });
    const hint = document.createElement('span');
    hint.className = 'composer-hint';
    hint.textContent = 'Anyone signed in can comment, on any status.';
    bar.append(btn, hint);
    composer.append(ta, bar);
    wrap.appendChild(composer);
  } else {
    const hint = document.createElement('div');
    hint.className = 'signin-hint';
    hint.textContent = 'Sign in to comment.';
    wrap.appendChild(hint);
  }

  return wrap;
}

function renderCard(s) {
  const el = document.createElement('div');
  el.className = 'suggestion-card' + (expandedIds.has(s.id) ? ' expanded' : '');
  const nComments = commentsOf(s).length;
  el.innerHTML = `
    <div class="card-row">
      <div class="card-body">
        <div class="card-title">${s.number ? `#${s.number} — ` : ''}${escHtml(s.title)}</div>
        <div class="card-meta">
          ${badge(s.status)}
          <span class="sep">•</span>
          <span>${escHtml(s.author)}</span>
          <span class="sep">•</span>
          <span>${fmtDate(s.created_at)}</span>
          ${nComments ? `<span class="sep">•</span><span>${nComments} comment${nComments === 1 ? '' : 's'}</span>` : ''}
          ${s.edited_at ? '<span class="sep">•</span><span class="edited-tag">edited</span>' : ''}
        </div>
      </div>
      <span class="card-arrow">›</span>
    </div>
    <div class="card-details">
      <div class="card-description md-content">${s.description ? marked.parse(s.description) : ''}</div>
      <div class="card-actions"></div>
    </div>`;

  el.querySelector('.card-row').addEventListener('click', () => {
    const open = el.classList.toggle('expanded');
    if (open) expandedIds.add(s.id); else expandedIds.delete(s.id);
  });

  const actions = el.querySelector('.card-actions');
  const privileged = isPrivileged();
  const isAuthor = me && me.name === s.author;

  if (privileged) {
    const sel = document.createElement('select');
    Object.keys(STATUS_LABELS).forEach(st => {
      const opt = document.createElement('option');
      opt.value = st; opt.textContent = STATUS_LABELS[st];
      if (st === s.status) opt.selected = true;
      sel.appendChild(opt);
    });
    sel.addEventListener('click', e => e.stopPropagation());
    sel.addEventListener('change', () => changeStatus(s.id, sel.value));
    actions.appendChild(sel);
  }

  // Shown disabled with the reason rather than hidden: "why can't I edit this?"
  // is answered where the button is, and it points at the thread instead.
  if (isAuthor || privileged) {
    const edit = document.createElement('button');
    edit.className = 'btn-ghost';
    edit.textContent = 'Edit';
    if (!privileged && s.status !== 'open') {
      edit.disabled = true;
      edit.title = 'Only BOD can edit a suggestion once it has been triaged — post a comment instead.';
    } else {
      edit.addEventListener('click', e => { e.stopPropagation(); openEditModal(s); });
    }
    actions.appendChild(edit);
  }

  if (privileged || (isAuthor && s.status === 'open')) {
    const del = document.createElement('button');
    del.className = 'btn-danger';
    del.textContent = 'Delete';
    del.addEventListener('click', e => { e.stopPropagation(); deleteSuggestion(s.id); });
    actions.appendChild(del);
  }

  el.querySelector('.card-details').appendChild(renderThread(s));
  return el;
}

function setTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === tab);
  });
  renderSuggestions();
}

function matchesTab(s, tab) {
  return tab === 'all' ? true : s.status === tab;
}

function renderSuggestions() {
  const list = document.getElementById('suggestion-list');
  const filtered = allSuggestions.filter(s => matchesTab(s, currentTab));
  list.innerHTML = '';
  if (!filtered.length) {
    list.innerHTML = `<div class="empty">No ${currentTab === 'all' ? '' : STATUS_LABELS[currentTab].toLowerCase() + ' '}suggestions yet.</div>`;
    return;
  }
  filtered.forEach(s => list.appendChild(renderCard(s)));
}

function updateTabCounts() {
  ['open', 'in_progress', 'complete', 'closed', 'all'].forEach(tab => {
    const el = document.getElementById(`count-${tab}`);
    if (el) el.textContent = `(${allSuggestions.filter(s => matchesTab(s, tab)).length})`;
  });
}

async function loadSuggestions() {
  try {
    const res = await fetch(`${API}/suggestions`);
    if (!res.ok) throw new Error('Failed');
    allSuggestions = await res.json();
    updateTabCounts();
    renderSuggestions();
  } catch {
    document.getElementById('suggestion-list').innerHTML = '<div class="empty">Failed to load suggestions.</div>';
  }
}

async function changeStatus(id, status) {
  const token = localStorage.getItem('nbn_token');
  try {
    const res = await fetch(`${API}/suggestions/${id}`, {
      method: 'PATCH',
      headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ status }),
    });
    if (!res.ok) { toast('Could not update status.', true); return; }
    await loadSuggestions();
  } catch { toast('Could not update status.', true); }
}

async function deleteSuggestion(id) {
  if (!await confirmDialog({
    title: 'Delete this suggestion?',
    body: 'The suggestion and its whole comment thread go with it. This cannot be undone.',
    confirmLabel: 'Delete',
    danger: true,
  })) return;
  const token = localStorage.getItem('nbn_token');
  try {
    const res = await fetch(`${API}/suggestions/${id}`, {
      method: 'DELETE',
      headers: { Authorization: `Bearer ${token}` },
    });
    if (!res.ok) { toast('Could not delete.', true); return; }
    await loadSuggestions();
  } catch { toast('Could not delete.', true); }
}

// ── Comments ─────────────────────────────────────────────────────────────────

async function apiSend(path, method, body) {
  const token = localStorage.getItem('nbn_token');
  const opts = { method, headers: { Authorization: `Bearer ${token}` } };
  if (body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(`${API}${path}`, opts);
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    throw new Error(data.detail || 'Request failed.');
  }
  return res.json();
}

async function postComment(id, body) {
  try {
    await apiSend(`/suggestions/${id}/comments`, 'POST', { body });
    expandedIds.add(id);
    await loadSuggestions();
  } catch (e) { toast(e.message, true); }
}

async function saveComment(id, commentId, body) {
  if (!body.trim()) return;
  try {
    await apiSend(`/suggestions/${id}/comments/${commentId}`, 'PATCH', { body: body.trim() });
    await loadSuggestions();
  } catch (e) { toast(e.message, true); }
}

async function deleteComment(id, commentId) {
  if (!await confirmDialog({
    title: 'Delete this comment?',
    body: 'This cannot be undone.',
    confirmLabel: 'Delete',
    danger: true,
  })) return;
  try {
    await apiSend(`/suggestions/${id}/comments/${commentId}`, 'DELETE');
    await loadSuggestions();
  } catch (e) { toast(e.message, true); }
}

// ── Edit suggestion modal ────────────────────────────────────────────────────

let editingId = null;

function openEditModal(s) {
  editingId = s.id;
  document.getElementById('edit-modal-title').textContent =
    `Edit ${s.number ? `#${s.number}` : 'Suggestion'}`;
  document.getElementById('edit-error').style.display = 'none';
  document.getElementById('edit-title').value = s.title || '';
  document.getElementById('edit-description').value = s.description || '';
  mdSetMode('edit-description', 'write');
  document.getElementById('edit-modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('edit-title').focus(), 50);
}

function closeEditModal(e) {
  if (e && e.target !== document.getElementById('edit-modal-overlay')) return;
  document.getElementById('edit-modal-overlay').classList.remove('open');
  editingId = null;
}

async function submitEdit() {
  const title = document.getElementById('edit-title').value.trim();
  const description = document.getElementById('edit-description').value.trim();
  const errEl = document.getElementById('edit-error');
  errEl.style.display = 'none';
  if (!title) { errEl.textContent = 'Title is required.'; errEl.style.display = 'block'; return; }

  const btn = document.getElementById('edit-submit-btn');
  btn.disabled = true;
  try {
    await apiSend(`/suggestions/${editingId}`, 'PATCH', { title, description });
    closeEditModal();
    await loadSuggestions();
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
  }
}

// ── New suggestion modal ─────────────────────────────────────────────────────

function openNewModal() {
  document.getElementById('new-error').style.display = 'none';
  document.getElementById('new-title').value = '';
  document.getElementById('new-description').value = '';
  mdSetMode('new-description', 'write');
  document.getElementById('new-modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('new-title').focus(), 50);
}

function closeNewModal(e) {
  if (e && e.target !== document.getElementById('new-modal-overlay')) return;
  document.getElementById('new-modal-overlay').classList.remove('open');
}

async function submitNewSuggestion() {
  const title = document.getElementById('new-title').value.trim();
  const description = document.getElementById('new-description').value.trim();
  const errEl = document.getElementById('new-error');
  errEl.style.display = 'none';
  if (!title) { errEl.textContent = 'Title is required.'; errEl.style.display = 'block'; return; }

  const token = localStorage.getItem('nbn_token');
  const btn = document.getElementById('new-submit-btn');
  btn.disabled = true;
  try {
    const res = await fetch(`${API}/suggestions`, {
      method: 'POST',
      headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, description }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      errEl.textContent = data.detail || 'Could not submit suggestion.';
      errEl.style.display = 'block';
      return;
    }
    closeNewModal();
    currentTab = 'open';
    setTab('open');
    await loadSuggestions();
  } catch {
    errEl.textContent = 'Could not reach the server.';
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
  }
}

// ── Auth ──────────────────────────────────────────────────────────────────────

async function initAuth() {
  const token = localStorage.getItem('nbn_token');
  if (!token) { updateAuthUI(null); return; }
  try {
    const res = await fetch(`${API}/members/me`, { headers: { Authorization: `Bearer ${token}` } });
    if (res.ok) {
      me = await res.json();
      updateAuthUI(me);
    } else {
      localStorage.removeItem('nbn_token');
      updateAuthUI(null);
    }
  } catch {
    me = { name: '…', roles: [] };
    updateAuthUI(me);
  }
}

function updateAuthUI(info) {
  const label = document.getElementById('auth-label');
  const name = document.getElementById('auth-name');
  const btn = document.getElementById('btn-auth');
  const btnNew = document.getElementById('btn-new');
  if (info) {
    label.textContent = 'Signed in as';
    name.textContent = info.name;
    btn.textContent = 'Sign out';
    btn.onclick = doSignOut;
    btnNew.style.display = '';
  } else {
    label.textContent = 'Not signed in';
    name.textContent = '';
    btn.textContent = 'Sign in';
    btn.onclick = openAuthModal;
    btnNew.style.display = 'none';
  }
}

function openAuthModal() {
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('token-input').focus(), 50);
}

function closeAuthModal(e) {
  if (e && e.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.remove('open');
  document.getElementById('token-input').value = '';
}

async function doSignIn() {
  const token = document.getElementById('token-input').value.trim();
  if (!token) return;
  try {
    const res = await fetch(`${API}/members/me`, { headers: { Authorization: `Bearer ${token}` } });
    if (!res.ok) { toast('That token was not accepted.', true); return; }
    me = await res.json();
    localStorage.setItem('nbn_token', token);
    document.getElementById('modal-overlay').classList.remove('open');
    document.getElementById('token-input').value = '';
    updateAuthUI(me);
    renderSuggestions();
  } catch { toast('Could not sign in. Check your connection.', true); }
}

function doSignOut() {
  localStorage.removeItem('nbn_token');
  me = null;
  updateAuthUI(null);
  renderSuggestions();
}

document.getElementById('token-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSignIn();
  if (e.key === 'Escape') closeAuthModal();
});

(async () => {
  await initAuth();
  await loadSuggestions();
})();
</script>
  <script src="/nav.js"></script>

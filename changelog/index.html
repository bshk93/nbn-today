<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/logo.png">
  <link rel="stylesheet" href="/css/shared.css">
  <title>Changelog — NBN</title>
  <!-- NBN:og -->
  <meta name="description" content="What changed on nbn.today, release by release.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NBN">
  <meta property="og:title" content="Changelog — NBN">
  <meta property="og:description" content="What changed on nbn.today, release by release.">
  <meta property="og:url" content="https://nbn.today/changelog/">
  <meta property="og:image" content="https://nbn.today/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Nothing But Net — fantasy basketball GM simulation league">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#111827">
  <!-- /NBN:og -->
  <style>
    .page { max-width: 680px; margin: 0 auto; }
    header { margin-bottom: 2.5rem; }
    header h1 { font-size: 1.875rem; font-weight: 700; letter-spacing: -0.02em; }
    header p { color: var(--text-muted); margin-top: 0.4rem; font-size: 0.9rem; }
    .entries { display: flex; flex-direction: column; gap: 1.5rem; }
    .entry {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
    }
    .entry-header {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      margin-bottom: 0.875rem;
    }
    .version {
      font-size: 1rem;
      font-weight: 700;
      color: var(--link);
      font-family: var(--font-mono);
    }
    .date {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .changes {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .changes li {
      font-size: 0.875rem;
      color: var(--text-secondary);
      padding-left: 1rem;
      position: relative;
    }
    .changes li::before {
      content: '–';
      position: absolute;
      left: 0;
      color: var(--text-dim);
    }
  </style>
</head>
<body>
  <div class="page">
    <nav class="nav"></nav>
    <header>
      <h1>Changelog</h1>
      <p id="current-version">Site version history.</p>
    </header>
    <div class="entries" id="entries">
      <p style="color:var(--text-muted);font-size:0.875rem;">Loading…</p>
    </div>
  </div>

  <script>
    fetch('/changelog.json')
      .then(r => r.json())
      .then(entries => {
        const container = document.getElementById('entries');
        container.innerHTML = entries.map(e => `
          <div class="entry">
            <div class="entry-header">
              <span class="version">v${e.version}</span>
              <span class="date">${e.date}</span>
            </div>
            <ul class="changes">
              ${e.changes.map(c => `<li>${c}</li>`).join('')}
            </ul>
          </div>
        `).join('');
        const latest = entries[0];
        document.getElementById('current-version').textContent = `Current version: v${latest.version}`;
      })
      .catch(() => {
        document.getElementById('entries').innerHTML =
          '<p style="color:var(--danger);">Failed to load changelog.</p>';
      });
  </script>
  <script src="/nav.js"></script>
</body>
</html>

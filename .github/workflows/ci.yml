# Checks that need no data directory and no server. The pre-commit hook runs
# these too, plus build/smoke_test.py, which needs /var/lib/nothing-but-stats
# and so only runs on the box. Nothing here writes anywhere.
name: ci

# Pushes to main, and pull requests. Not every branch push: the render job
# loads pages from the live site, and a branch with an open PR would run it
# twice per push, on a box with one core.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: Node unit tests
        run: for t in tests/*.test.js; do echo "== $t"; node "$t" || exit 1; done
      - name: Generated files are current
        run: |
          python3 build/og_tags.py --check
          python3 build/head_preloads.py --check
          python3 build/make_ui_icons.py --check
          python3 build/make_team_colors_css.py --check
      - name: Design drift and duplicate-helper ratchets
        run: |
          python3 build/check_design_drift.py
          python3 build/check_dup_helpers.py
      - name: Build and box score tests
        run: |
          pip install -q openpyxl requests   # build/poopoo.py reads and fetches the league sheet
          python3 build/test_build_sh.py
          python3 build/test_validate_boxscore.py
          python3 build/test_parse_night_reread.py
          python3 build/test_parse_night_compare.py
          python3 build/test_poopoo_picks.py

  render:
    # Every page in tests/frontend/run.js, served from this commit by
    # build/preview_live.py, with the data and /api read from nbn.today.
    # preview_live refuses writes, so this can only ever read the live site.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install puppeteer-core and a browser
        working-directory: tests/frontend
        run: |
          npm ci
          npx --yes @puppeteer/browsers install chrome-headless-shell@stable --path "$RUNNER_TEMP/chrome" \
            | tail -1 | awk '{print "CHROME_PATH=" $2}' >> "$GITHUB_ENV"
      - name: Serve this commit
        run: |
          python3 build/preview_live.py --port 8099 > "$RUNNER_TEMP/preview.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8099/ >/dev/null && break; sleep 1; done
      - name: Render every page
        working-directory: tests/frontend
        env: { NBN_BASE: "http://127.0.0.1:8099" }
        run: node run.js
      - name: Dialog primitives (nav.js, css/dialogs.css)
        run: CHROME="$CHROME_PATH" PORT=8124 bash build/run_dialog_tests.sh

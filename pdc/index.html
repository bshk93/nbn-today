    const yx = (o.offer.contract || {}).years_experience;
    if (yx !== null && yx !== undefined) {
      put('NBA experience', `${yx} yr${yx === 1 ? '' : 's'} as of Year 1 (§ 3.12 scale tier)`);
    }
    put('Submitted', when(o.submitted_at) + ' · ' + (o.submitted_by || '—'));
    if (o.created_by && o.created_by !== o.submitted_by) put('Drafted by', o.created_by);
    card.appendChild(kv);

    card.appendChild(legalityBlock(o));

    if (sheet) card.appendChild(capBlock(sheet));

    card.appendChild(promisesBlock(o.promises));
    if (o.pitch) card.appendChild(pitchBlock(o.pitch));

    const lineup = lineupBlock(o.team, o.player);
    if (lineup) card.appendChild(lineup);

    if (o.outstanding_remands && o.outstanding_remands.length) {
      const b = el('div', 'banner warn');
      b.appendChild(el('div', 'mini-head', 'Awaiting the team · sent back ' + ago(o.outstanding_remands[0].at)));
      o.outstanding_remands.forEach(r => b.appendChild(remandLine(r)));
      card.appendChild(b);
    }
    if (o.versions && o.versions.length) card.appendChild(historyBlock(o, season));

    // § 4.7 — the agent's advice to the sub-committee, shown to everyone who
    // can see the offer and editable only by the agent holding the player.
    if (o.agent_note) {
      const n = el('div', 'banner info');
      n.appendChild(el('div', 'mini-head', 'Agent’s note · ' + (o.agent_note_by || '?')));
      n.appendChild(el('div', null, o.agent_note));
      card.appendChild(n);
    }

    if (canCurate(review) && o.status === 'submitted') {
      const b = el('button', 'btn-danger', 'Send back for revision…');
      b.addEventListener('click', () => remandModal(o));
      card.appendChild(b);
    }
    // § 4.3b — and offered on a `returned` offer too, which is where it earns
    // its keep: a send-back the team never answers has no other end.
    if (canCurate(review)) {
      const b = el('button', 'btn-danger', 'Void…');
      b.style.marginLeft = o.status === 'submitted' ? '0.4rem' : '';
      b.addEventListener('click', () => voidModal(o));
      card.appendChild(b);
    }
    if (canCurate(review) && !IS_HEAD) {
      const b = el('button', 'btn-ghost', o.agent_note ? 'Edit note…' : 'Add a note…');
      b.style.marginLeft = '0.4rem';
      b.addEventListener('click', () => agentNoteModal(o));
      card.appendChild(b);
    }
    return card;
  }

  // § 4.7, reversing D14. Remand and void are the claiming agent's while they
  // hold the player and haven't advanced him, plus head and admin. An assigned
  // sub-committee member has neither: they review a set the agent has already
  // curated, and a term they want changed goes through the agent or the head.
  // `is_agent` is the server's own answer (`_claim_holder == you`), not a local
  // comparison, so the button and the endpoint can't disagree.
  function canCurate(review) {
    const st = review.state || {};
    return IS_HEAD || (st.is_agent && !st.advanced_at);
  }

  // `trailingHold` is the fact sheet's priced § 3.10 hold. The contract itself
  // deliberately leaves that season out of `salaries` — the API prices it at
  // signing time — so without this the hold the deal rolls into, and what it
  // costs, was simply missing from the deal the committee reviews.
  function yearTable(contract, season, trailingHold) {
    const t = el('table', 'years');
    const sals = contract.salaries || {};
    const caps = contract.cap_holds || {};
    const gtd = contract.guaranteed || {};
    Object.keys(sals).filter(k => /^\d{2}-\d{2}$/.test(k) && k >= season).sort().forEach(yr => {
      const isHold = HOLD(caps[yr]);
      const tr = el('tr', isHold ? 'hold' : '');
      tr.appendChild(el('td', null, yr));
      tr.appendChild(el('td', 'amt', isHold ? '' : money(parseMoney(sals[yr]))));
      const tag = isHold ? caps[yr] : (TAGS[caps[yr]] || '');
      const td = el('td', 'tag', tag);
      if (!isHold && gtd[yr] != null && parseMoney(gtd[yr]) < parseMoney(sals[yr])) {
        td.textContent = (tag ? tag + ' ' : '') + 'PG';
        td.title = 'Partially guaranteed: ' + money(parseMoney(gtd[yr]));
      }
      tr.appendChild(td);
      t.appendChild(tr);
    });
    if (trailingHold && !(sals[trailingHold.season])) {
      const tr = el('tr', 'hold');
      tr.appendChild(el('td', null, trailingHold.season));
      tr.appendChild(el('td', 'amt', trailingHold.amount != null ? money(trailingHold.amount) : ''));
      const td = el('td', 'tag', trailingHold.type);
      td.title = trailingHold.note
        || (trailingHold.needs_eaps ? 'Not priced: the team didn’t state whether the prior salary is above or below EAPS.' : '');
      tr.appendChild(td);
      t.appendChild(tr);
    }
    return t;
  }

  // § 5.2 — the frozen submit-time verdict beside a live one. With no withdrawal
  // path (§ 4.3), this badge is the only way the committee learns that an offer
  // has gone illegal since it was made, so it is required, not decorative.
  function legalityBlock(o) {
    const box = el('div');
    const now = o.revalidation || {};
    const then = o.validation || {};
    if (o.legality_changed && now.legal === false) {
      const b = el('div', 'banner bad');
      b.appendChild(el('div', null, 'Legal at submit · illegal now'));
      (now.checks || []).filter(c => !c.passed && c.level === 'error')
        .forEach(c => b.appendChild(el('div', 'checkline err', '✗ ' + (c.message || c.check))));
      if (now.error) b.appendChild(el('div', 'checkline err', now.error));
      box.appendChild(b);
      return box;
    }
    const failing = (now.checks || []).filter(c => !c.passed);
    const chip = el('span', 'chip ' + (now.legal === false ? 'chip-bad' : 'chip-ok'),
      now.legal === false ? 'illegal' : 'legal now');
    chip.title = 'Frozen at submit: ' + (then.legal ? 'legal' : 'not recorded') + '. Revalidated on this page load.';
    box.appendChild(chip);
    failing.forEach(c => box.appendChild(el('div', 'checkline ' + (c.level === 'error' ? 'err' : 'warn'),
      (c.level === 'error' ? '✗ ' : '! ') + (c.message || c.check))));
    return box;
  }

  function capBlock(sheet) {
    const box = el('div');
    box.appendChild(el('div', 'mini-head', 'Cap after signing · ' + sheet.season));
    const kv = el('dl', 'kv');
    const put = (k, v, title) => {
      kv.appendChild(el('dt', null, k));
      const dd = el('dd', null, v);
      if (title) dd.title = title;
      kv.appendChild(dd);
    };
    put('Team salary', compactMoney(sheet.current_salary_ex_holds) + ' → ' + compactMoney(sheet.projected_salary_ex_holds));
    put('Cap room', sheet.cap_room == null ? '—' : compactMoney(sheet.cap_room));
    if (sheet.exception) {
      put(sheet.exception.label, compactMoney(sheet.exception.remaining) + ' left',
        'Of ' + money(sheet.exception.amount) + ', ' + money(sheet.exception.used) + ' used');
    }
    if (sheet.hard_cap_level) {
      put('Hard cap', sheet.hard_cap_level.replace('_', ' ') + ' · ' + compactMoney(sheet.hard_cap_limit));
    }
    if (sheet.apron_after) put('Apron after', sheet.apron_after.replace('_', ' '));
    put('Roster', sheet.standard_count_before + ' → ' + sheet.standard_count_after);
    box.appendChild(kv);
    return box;
  }

  function promisesBlock(p) {
    const box = el('div');
    box.appendChild(el('div', 'mini-head', 'Promises'));
    const bits = [];
    if (p.mpg != null) bits.push(p.mpg + ' mpg');
    if (p.playoffs) bits.push('playoffs');
    bits.push(ROLE_LABELS[p.role] || p.role);
    box.appendChild(el('div', 'bb-val', bits.join(' · ')));
    return box;
  }

  function pitchBlock(text) {
    const box = el('div');
    box.appendChild(el('div', 'mini-head', 'Pitch'));
    const p = el('div', 'pitch', text);
    box.appendChild(p);
    const btn = el('button', 'linkish', 'Show more');
    btn.addEventListener('click', () => {
      p.classList.toggle('open');
      btn.textContent = p.classList.contains('open') ? 'Show less' : 'Show more';
    });
    box.appendChild(btn);
    return box;
  }

  // The offering team's projected starting five with this player inserted
  // (§ 8.2), using the same computeStartingFive team pages run — teams/lineup.js
  // was extracted for exactly this. It reads two fields off each row and nothing
  // else, so these thin objects are all it needs.
  function lineupBlock(team, slug) {
    if (typeof computeStartingFive !== 'function') return null;
    const rows = Object.keys(TEAMMAP)
      .filter(s => TEAMMAP[s] === team && s !== slug)
      .map(s => ({ slug: s, _posList: (BIOS[s] || {}).pos || [], OVR: OVR[s] || 0 }));
    rows.push({ slug, _posList: (BIOS[slug] || {}).pos || [], OVR: OVR[slug] || 0, signee: true });
    const five = computeStartingFive(rows);
    const box = el('div');
    box.appendChild(el('div', 'mini-head', 'Projected starting five'));
    const wrap = el('div', 'lineup');
    DEPTH_SLOTS.forEach((slot, i) => {
      const p = five[i];
      const chip = el('span', 'lu' + (p && p.signee ? ' signee' : ''));
      chip.appendChild(el('b', null, slot));
      chip.appendChild(document.createTextNode(' ' + (p ? nameOf(p.slug).split(' ').slice(-1)[0] + ' ' + (p.OVR || '') : '—')));
      wrap.appendChild(chip);
    });
    box.appendChild(wrap);
    return box;
  }

  function remandLine(r) {
    const d = el('div', 'remand');
    d.appendChild(el('div', null, r.note));
    const meta = el('div', 'meta', r.by + ' · ' + when(r.at) + (r.conflict ? ' · conflicted (' + r.conflict + ')' : ''));
    d.appendChild(meta);
    return d;
  }

  // Offered → asked → returned, as a sequence. Without the frozen prior version
  // "final" would be unfalsifiable — nobody could see what actually changed.
  function historyBlock(o, season) {
    const box = el('div');
    box.appendChild(el('div', 'mini-head', 'Revision history'));
    const chain = o.versions.slice().sort((a, b) => a.version - b.version);
    chain.forEach((v, i) => {
      box.appendChild(el('div', 'bb-val', 'v' + v.version + ' — ' + shorthand(v.offer.contract, season)));
      o.remands.filter(r => r.from_version === v.version).forEach(r => box.appendChild(remandLine(r)));
      const next = chain[i + 1] ? chain[i + 1].offer : o.offer;
      const diff = contractDiff(v.offer, next, season);
      if (diff.length) {
        const d = el('div', 'diff');
        d.textContent = 'v' + v.version + ' → v' + (v.version + 1) + ': ' + diff.join(' · ');
        box.appendChild(d);
      }
    });
    // The current state is only a *further* entry once the team has resubmitted
    // (version bumps then) or edited the returned offer. Printing it
    // unconditionally repeats the frozen version back at itself the moment an
    // offer is sent back and before the team has touched it.
    const last = chain[chain.length - 1];
    const edited = contractDiff(last.offer, o.offer, season).length > 0;
    if (o.version > last.version || edited) {
      box.appendChild(el('div', 'bb-val', 'v' + o.version + ' — ' + shorthand(o.offer.contract, season)
        + (o.version > last.version ? ' (current)' : ' (edited, not yet resubmitted)')));
    }
    return box;
  }

  function contractDiff(prev, next, season) {
    const out = [];
    const ps = prev.contract.salaries || {}, ns = next.contract.salaries || {};
    const pc = prev.contract.cap_holds || {}, nc = next.contract.cap_holds || {};
    const years = Array.from(new Set(Object.keys(ps).concat(Object.keys(ns))))
      .filter(k => /^\d{2}-\d{2}$/.test(k) && k >= season).sort();
    years.forEach(y => {
      const a = parseMoney(ps[y]), b = parseMoney(ns[y]);
      if (a !== b) out.push(`${y} ${a ? compactMoney(a) : '—'}→${b ? compactMoney(b) : '—'}`);
      else if ((pc[y] || '') !== (nc[y] || '')) out.push(`${y} ${pc[y] || '—'}→${nc[y] || '—'}`);
    });
    if (prev.signing_method !== next.signing_method) {
      out.push(`method ${prev.signing_method || '—'}→${next.signing_method || '—'}`);
    }
    // § 3.12: re-declaring experience moves every year onto a different scale
    // row, so it is a change to the money even when the salaries are untouched.
    const pe = prev.contract.years_experience, ne = next.contract.years_experience;
    if ((pe ?? null) !== (ne ?? null)) {
      out.push(`NBA experience ${pe ?? '—'}→${ne ?? '—'}`);
    }
    return out;
  }

  // § 5.3 — a pending FA offer holds no cap room, unlike a § 3.15 offer sheet, so
  // nothing stops a team bidding more than it can fund. Disclosed, never blocked.
  function commitmentsSection(review) {
    const s = el('div', 'section');
    s.appendChild(el('h3', null, 'Offering teams'));
    const teams = Object.keys(review.commitments || {});
    if (!teams.length) { s.appendChild(el('div', 'empty', '—')); return s; }
    const wrap = el('div', 'commit');
    teams.sort().forEach(t => {
      const c = review.commitments[t];
      const card = el('div', 'commit-card' + (c.overcommitted ? ' over' : ''));
      card.appendChild(el('b', null, t));
      card.appendChild(document.createTextNode(
        ` — ${c.live_offers} live offer${c.live_offers === 1 ? '' : 's'}, `
        + `${compactMoney(c.committed_year1)} committed vs ${c.room == null ? '—' : compactMoney(c.room)} room`));
      if (c.overcommitted) {
        card.appendChild(document.createTextNode(' · overcommitted'));
        card.title = 'A pending offer holds no cap room, so this is allowed — the committee is told, not blocked (§ 5.3).';
      }
      wrap.appendChild(card);
    });
    s.appendChild(wrap);
    return s;
  }

  // ── ballots (§ 4.4) ─────────────────────────────────────────────────────────

  function optionLabels(review) {
    const labels = {};
    (review.ballot_options || []).forEach(opt => {
      labels[opt.key] = opt.kind === 'offer' ? `${opt.team} #${opt.number}`
        : opt.kind === 'qo' ? 'Qualifying offer'
        : 'No signing';
    });
    // A voided offer is no longer an option, but ballots cast before the void
    // still name it and the totals still carry it (§ 4.3b — flagged, never
    // rewritten). Without a label those rows would render as a raw offer id.
    (review.voided_offers || []).forEach(o => {
      labels[o.id] = `${o.team} #${o.number} (voided)`;
    });
    return labels;
  }

  function tally(cast) {
    const totals = {};
    Object.values(cast || {}).forEach(b => {
      Object.entries(b.balls || {}).forEach(([k, v]) => { totals[k] = (totals[k] || 0) + v; });
    });
    return totals;
  }

  // Casting is gated on *assignment*, never on being the head. `cast_ballot` is
  // the one endpoint in the API that does not wave `admin` through: a ballot is a
  // vote, not an administrative action, and there is no such thing as casting one
  // you weren't assigned. A head who isn't on this sub-committee gets the totals
  // and the finalize button, and no inputs.
  function amAssigned(review) {
    return ((review.state || {}).subcommittee || []).includes(ME.name);
  }

  function ballotsSection(review, ballots) {
    const s = el('div', 'section');
    s.appendChild(el('h3', null, 'Ballots'));
    // § 4.7 — nothing is balloted before the agent advances the slate. The API
    // refuses too; this is so the page says why rather than showing inputs that
    // 422. An already-finalized player keeps his ballot record on show.
    const st = review.state || {};
    if (!st.advanced_at && !(ballots && ballots.final)) {
      s.appendChild(el('div', 'empty', st.stage === 'with_agent'
        ? (st.claimed_by || 'An agent') + ' is still curating the offers on this player. '
          + 'The ballot opens when the slate is advanced.'
        : 'No ballot yet. A player is balloted once an agent has curated his offers and '
          + 'advanced the survivors to a sub-committee.'));
      return s;
    }
    if (!ballots || ballots._unavailable) {
      s.appendChild(el('div', 'empty', ballots && ballots._unavailable
        ? ballots._unavailable
        : 'No ballot bucket for this player yet.'));
      return s;
    }

    const labels = optionLabels(review);

    // § 4.6 — warn, never block. The team comes from the server's own
    // `_conflict_team`, the same rule that stamps a cast ballot, so what a member
    // is told before voting matches what the head sees afterwards.
    if (ballots.your_conflict) {
      const b = el('div', 'banner warn');
      b.textContent = `${ballots.your_conflict} has an offer in for this player. `
        + 'You may still ballot; the head will see it flagged.';
      s.appendChild(b);
    }

    if (ballots.final) {
      const f = el('div', 'banner info');
      f.appendChild(el('div', null, 'Locked ' + when(ballots.final.locked_at) + ' by ' + ballots.final.locked_by));
      const totals = Object.entries(ballots.final.totals || {}).sort((a, b) => b[1] - a[1]);
      const cap = totals.reduce((m, [, v]) => Math.max(m, v), 0) || 1;
      totals.forEach(([k, v]) => f.appendChild(barRow(labels[k] || k, v, cap)));
      if ((ballots.final.abstained || []).length) {
        f.appendChild(el('div', 'bb-val', 'Abstained: ' + ballots.final.abstained.join(', ')));
      }
      if ((ballots.final.outstanding_remands || []).length) {
        f.appendChild(el('div', 'bb-val', 'Locked with '
          + ballots.final.outstanding_remands.length + ' unanswered remand(s).'));
      }
      (ballots.final.voided_options || []).forEach(v => {
        f.appendChild(el('div', 'bb-val', v.balls.toLocaleString('en-US')
          + ' ball(s) above are on ' + v.team + ' #' + v.number
          + ', an offer voided before the lock — counted as cast.'));
      });
      // § 11.1 — the totals are the committee's decision, not a signing. Nothing
      // here signs anybody, by design, and the panel says so rather than leaving
      // a locked result looking like it executed itself.
      f.appendChild(el('div', 'bb-val',
        'The allocation is the record of the decision. The signing is still entered by hand on /transactions.'));
      s.appendChild(f);
    } else if (amAssigned(review)) {
      s.appendChild(myBallot(review, ballots, labels));
    } else if (IS_HEAD) {
      s.appendChild(el('div', 'bar-lbl',
        'You aren’t on this player’s sub-committee, so there is no ballot for you to cast. '
        + 'Assigning yourself would let you vote on it.'));
    }

    const grid = el('div', 'ballot-grid');
    const cast = Object.entries(ballots.ballots || {});
    cast.forEach(([who, b]) => {
      const card = el('div', 'ballot');
      const nm = el('div', 'ballot-name');
      nm.appendChild(document.createTextNode(who));
      if (who === ME.name) nm.appendChild(el('span', 'chip', 'you'));
      if (b.conflict) nm.appendChild(el('span', 'chip chip-warn', b.conflict));
      card.appendChild(nm);
      card.appendChild(el('div', 'bar-lbl', 'updated ' + ago(b.updated_at)));
      Object.entries(b.balls || {}).sort((x, y) => y[1] - x[1])
        .forEach(([k, v]) => card.appendChild(barRow(labels[k] || k, v, 1000)));
      if (b.note) card.appendChild(el('div', 'bar-lbl', '“' + b.note + '”'));
      if ((b.revised_since || []).length) {
        // Flagged, never voided — silently discarding a member's considered
        // judgment is worse than showing them it may be stale (§ 4.3a).
        const w = el('div', 'banner warn');
        w.style.marginTop = '0.4rem';
        w.textContent = 'Revised after this ballot: ' + b.revised_since.map(id => labels[id] || id).join(', ');
        card.appendChild(w);
      }
      if ((b.voided_since || []).length) {
        // Same rule, harder case (§ 4.3b): the option left the board entirely.
        // The balls stay where they were cast — redistributing them would be the
        // software inventing a vote — so the head is told instead.
        const w = el('div', 'banner bad');
        w.style.marginTop = '0.4rem';
        w.textContent = 'Balls on a voided offer: '
          + b.voided_since.map(id => labels[id] || id).join(', ')
          + '. They still count in the totals as cast.';
        card.appendChild(w);
      }
      grid.appendChild(card);
    });
    if (!cast.length) grid.appendChild(el('div', 'empty', 'Nobody has balloted yet.'));
    s.appendChild(grid);

    if ((ballots.outstanding || []).length) {
      s.appendChild(el('div', 'bar-lbl', 'Outstanding: ' + ballots.outstanding.join(', ')));
    }

    return s;
  }

  // The 1,000 balls (§ 4.4). A ballot must total exactly 1,000 to be cast — the
  // server rejects anything else with the running total in the message, and this
  // gates Save on the same arithmetic so the refusal is never a surprise.
  //
  // Freely revisable until the head finalizes, which is why Save reads "Save" and
  // not "Submit": the last version before the lock is the one that counts.
  function myBallot(review, ballots, labels) {
    const slug = review.player;
    const opts = (review.ballot_options || []).slice();
    const mine = (ballots.ballots || {})[ME.name] || null;
    const balls = {};
    opts.forEach(o => { balls[o.key] = ((mine || {}).balls || {})[o.key] || 0; });

    const box = el('div', 'ballot mine');
    const head = el('div', 'ballot-name');
    head.appendChild(document.createTextNode(mine ? 'Your ballot' : 'Cast your ballot'));
    if (mine) head.appendChild(el('span', 'chip', 'updated ' + ago(mine.updated_at)));
    box.appendChild(head);

    // A member who balloted before a revision is *told*, never silently voided
    // (§ 4.3a). Re-saving clears their own flag and leaves everyone else's.
    if (mine && (mine.revised_since || []).length) {
      const w = el('div', 'banner warn');
      w.style.margin = '0.4rem 0';
      w.textContent = 'Revised after you voted: '
        + mine.revised_since.map(id => labels[id] || id).join(', ')
        + '. Your ballot still stands — re-save it to clear this.';
      box.appendChild(w);
    }
    // The stronger case: an option you backed is gone. Your balls are untouched
    // and still counted, so re-saving is a choice rather than a repair (§ 4.3b).
    if (mine && (mine.voided_since || []).length) {
      const w = el('div', 'banner bad');
      w.style.margin = '0.4rem 0';
      w.textContent = 'You put balls on an offer the head has since voided: '
        + mine.voided_since.map(id => labels[id] || id).join(', ')
        + '. They still count as cast — re-save to put them somewhere else.';
      box.appendChild(w);
    }

    const rows = el('div');
    box.appendChild(rows);
    const foot = el('div', 'ballot-foot');
    box.appendChild(foot);

    const noteRow = el('div');
    noteRow.style.marginTop = '0.5rem';
    noteRow.appendChild(el('label', null, 'Note for the committee (optional)'));
    const note = el('input');
    note.value = (mine && mine.note) || '';
    note.placeholder = 'Why you split them this way';
    noteRow.appendChild(note);
    box.appendChild(noteRow);

    const actions = el('div', 'modal-actions');
    actions.style.marginTop = '0.6rem';
    const even = el('button', 'btn-ghost', 'Even split');
    even.title = 'Divide 1,000 evenly across every line, remainder on the first.';
    const save = el('button', 'btn-primary', mine ? 'Update ballot' : 'Cast ballot');
    actions.appendChild(even);
    actions.appendChild(save);
    box.appendChild(actions);

    const inputs = {};

    function total() { return opts.reduce((n, o) => n + (balls[o.key] || 0), 0); }

    function sync() {
      const t = total();
      const left = BALLOT_TOTAL - t;
      foot.innerHTML = '';
      const line = el('div', 'ballot-total' + (t === BALLOT_TOTAL ? ' ok' : ''));
      line.textContent = t === BALLOT_TOTAL
        ? '1,000 of 1,000 allocated'
        : `${t.toLocaleString('en-US')} of 1,000 allocated · ${left > 0 ? left.toLocaleString('en-US') + ' left to place' : Math.abs(left).toLocaleString('en-US') + ' over'}`;
      foot.appendChild(line);
      save.disabled = t !== BALLOT_TOTAL;
      save.title = t === BALLOT_TOTAL ? '' : 'A ballot must total exactly 1,000.';
      opts.forEach(o => {
        inputs[o.key].num.value = balls[o.key] || 0;
        inputs[o.key].range.value = balls[o.key] || 0;
      });
    }

    opts.forEach(o => {
      const row = el('div', 'alloc-row');
      const lbl = el('div', 'alloc-lbl');
      lbl.appendChild(el('div', null, labels[o.key] || o.key));
      if (o.kind === 'qo') {
        // § 7.2 / § 13.2 — the amount comes from a formula the rulebook itself
        // marks "proposed, pending BOD confirmation", so it is labelled rather
        // than asserted. The line shows either way: an incumbent keeping an RFA
        // on the QO is a real outcome whether or not we can price it.
        lbl.appendChild(el('div', 'bar-lbl', o.amount == null
          ? 'amount unknown — the QO isn’t recorded anywhere in the API yet'
          : '≈ ' + compactMoney(o.amount) + ' (estimated)'));
      } else if (o.kind === 'no_signing') {
        lbl.appendChild(el('div', 'bar-lbl', 'Nobody signs him; he stays a free agent'));
      } else {
        const off = (review.offers || []).find(x => x.id === o.key);
        if (off) {
          lbl.appendChild(el('div', 'bar-lbl',
            shorthand(off.offer.contract, (off.revalidation || off.validation || {}).season || SEASON)
            + (off.status === 'returned' ? ' · sent back' : '')
            + ((off.revalidation || {}).legal === false ? ' · illegal now' : '')));
        }
      }
      row.appendChild(lbl);

      const range = el('input');
      range.type = 'range'; range.min = '0'; range.max = String(BALLOT_TOTAL); range.step = '25';
      range.value = balls[o.key] || 0;
      range.addEventListener('input', () => { balls[o.key] = +range.value; sync(); });
      row.appendChild(range);

      const num = el('input');
      num.type = 'number'; num.min = '0'; num.max = String(BALLOT_TOTAL); num.step = '1';
      num.className = 'alloc-num';
      num.value = balls[o.key] || 0;
      num.addEventListener('input', () => {
        balls[o.key] = Math.max(0, Math.min(BALLOT_TOTAL, +num.value || 0));
        sync();
      });
      row.appendChild(num);

      inputs[o.key] = { range, num };
      rows.appendChild(row);
    });

    even.addEventListener('click', () => {
      const each = Math.floor(BALLOT_TOTAL / opts.length);
      opts.forEach(o => { balls[o.key] = each; });
      balls[opts[0].key] += BALLOT_TOTAL - each * opts.length;
      sync();
    });

    save.addEventListener('click', async () => {
      save.disabled = true;
      try {
        await api('/fa/players/' + encodeURIComponent(slug) + '/ballot', {
          method: 'PUT',
          body: { balls, note: note.value.trim() },
        });
        await reload();
        toast('Ballot saved');
      } catch (e) {
        toast(e.message, true);
        save.disabled = false;
      }
    });

    sync();
    return box;
  }

  // § 4.3a / D15 — an unanswered remand **warns, never blocks**. The head is the
  // clock everywhere else in this system (§ 4.1, D11), so a team that goes quiet
  // can't stall a player indefinitely; a head who locks early does so knowingly,
  // which means the confirm step has to name what they're locking over.
  function finalizeModal(review, ballots, labels) {
    const slug = review.player;
    const cast = ballots.ballots || {};
    const totals = tally(cast);
    const body = el('div');

    body.appendChild(el('p', 'note',
      'Finalizing locks every ballot on this player, records the totals as the committee’s decision, '
      + 'and archives the offers — which is what frees those teams to bid on him again in a later round. '
      + 'It signs nobody: the signing is still entered by hand on /transactions.'));

    const totalBox = el('div', 'banner info');
    const sorted = Object.entries(totals).sort((a, b) => b[1] - a[1]);
    if (!sorted.length) {
      totalBox.appendChild(el('div', null, 'No ballots have been cast. Locking now records an empty result.'));
    } else {
      totalBox.appendChild(el('div', 'mini-head', 'Totals as they stand'));
      const cap = sorted[0][1] || 1;
      sorted.forEach(([k, v]) => totalBox.appendChild(barRow(labels[k] || k, v, cap)));
    }
    body.appendChild(totalBox);

    const voters = Object.keys(cast);
    if (voters.length) {
      const who = el('div');
      who.style.marginTop = '0.6rem';
      who.appendChild(el('div', 'mini-head', 'Who voted'));
      voters.forEach(name => {
        const line = el('div', 'bar-lbl');
        const sum = Object.values(cast[name].balls || {}).reduce((a, b) => a + b, 0);
        line.textContent = `${name} — ${sum.toLocaleString('en-US')} balls, updated ${ago(cast[name].updated_at)}`
          + (cast[name].conflict ? ` · conflicted (${cast[name].conflict} is bidding)` : '');
        if (cast[name].conflict) line.style.color = 'var(--gold)';
        who.appendChild(line);
      });
      body.appendChild(who);
    }

    if ((ballots.outstanding || []).length) {
      const b = el('div', 'banner warn');
      b.style.marginTop = '0.6rem';
      b.textContent = 'Not voted, and will be recorded as abstained: ' + ballots.outstanding.join(', ');
      body.appendChild(b);
    }

    // Same rule the server applies when it stamps `outstanding_remands` onto the
    // final record: an offer sitting in `returned` is one the team hasn't
    // answered. Surfaced with its age so "locking early" is a visible choice.
    const unanswered = (review.offers || []).filter(o => o.status === 'returned');
    if (unanswered.length) {
      const b = el('div', 'banner warn');
      b.style.marginTop = '0.6rem';
      b.appendChild(el('div', 'mini-head', 'Unanswered remands — this warns, it does not block'));
      unanswered.forEach(o => {
        const first = (o.outstanding_remands || [])[0];
        b.appendChild(el('div', null,
          `${o.team} #${o.number} — sent back ${first ? ago(first.at) : 'earlier'}, still awaiting the team`));
      });
      body.appendChild(b);
    }

    // Balls sitting on an offer that has left the board (§ 4.3b). They are
    // counted exactly as cast — the totals are the record of what members voted,
    // not what the software thinks they'd have voted — so the head reads them
    // knowing it, which means saying so before the lock, not after.
    const gone = {};
    (review.voided_offers || []).forEach(o => { gone[o.id] = o; });
    const stranded = Object.entries(totals).filter(([k]) => gone[k]);
    if (stranded.length) {
      const b = el('div', 'banner bad');
      b.style.marginTop = '0.6rem';
      b.appendChild(el('div', 'mini-head', 'Balls on a voided offer — counted as cast'));
      stranded.forEach(([k, v]) => b.appendChild(el('div', null,
        `${v.toLocaleString('en-US')} ball(s) on ${gone[k].team} #${gone[k].number}, voided `
        + ago((gone[k].void || {}).at) + '. Nothing redistributes them.')));
      body.appendChild(b);
    }

    modal('Finalize ' + nameOf(slug), body, [{
      label: 'Lock the ballots', cls: 'btn-primary', run: async () => {
        await api('/fa/players/' + encodeURIComponent(slug) + '/finalize', { method: 'POST' });
        await reload();
        toast(nameOf(slug) + ' finalized');
      },
    }]);
  }

  function unlockModal(slug, ballots) {
    const body = el('div');
    body.appendChild(el('p', 'note',
      'Unlocking reopens the ballots for this round and un-archives the offers this finalize archived — '
      + 'otherwise the restored ballots would refer to offers nobody can see. The result you are undoing '
      + 'is kept on the record.'));
    const f = ballots.final || {};
    body.appendChild(el('div', 'banner info',
      'Locked ' + when(f.locked_at) + ' by ' + f.locked_by + '.'));
    modal('Unlock ' + nameOf(slug), body, [{
      label: 'Unlock', cls: 'btn-danger', run: async () => {
        await api('/fa/players/' + encodeURIComponent(slug) + '/unlock', { method: 'POST' });
        await reload();
        toast(nameOf(slug) + ' unlocked');
      },
    }]);
  }

  function barRow(label, value, cap) {
    const row = el('div', 'bar-row');
    const left = el('div');
    left.appendChild(el('div', 'bar-lbl', label));
    const bar = el('div', 'bar');
    const fill = el('span');
    fill.style.width = Math.max(0, Math.min(100, (value / (cap || 1)) * 100)) + '%';
    bar.appendChild(fill);
    left.appendChild(bar);
    row.appendChild(left);
    row.appendChild(el('div', 'bar-val', value));
    return row;
  }

  function remandModal(o) {
    const body = el('div');
    body.appendChild(el('p', 'note',
      'A remand is the only way back from a submitted offer — the team can never reach for it (§ 4.3a). '
      + 'It is additive: another member sending the same offer back appends a second note rather than '
      + 'starting a new round-trip, and the team answers them all in one resubmission.'));
    const row = el('div', 'row');
    row.appendChild(el('label', null, 'What should change? (required)'));
    const ta = el('textarea');
    ta.placeholder = 'e.g. Add a fourth year, or trim year 1 to the MLE.';
    row.appendChild(ta);
    body.appendChild(row);
    modal('Send ' + o.team + ' #' + o.number + ' back', body, [{
      label: 'Send back', cls: 'btn-danger', run: async () => {
        const note = ta.value.trim();
        if (!note) { toast('A remand requires a note.', true); return false; }
        await api('/fa/offers/' + o.id + '/remand', { method: 'POST', body: { note } });
        await reload();
        toast('Sent back to ' + o.team);
      },
    }]);
    ta.focus();
  }

  // § 4.3b. The dangerous one of the pair, and the copy says exactly what it
  // does — a remand asks the team a question, this ends their bid without one.
  function voidModal(o) {
    const body = el('div');
    body.appendChild(el('p', 'note',
      'A void takes the offer out of play as if it had never been submitted: off the ballot, out of '
      + o.team + '’s exposure, and they are free to bid again. It is not a delete — the terms, the '
      + 'versions and the remands all stay on the record, and you can undo it.'));
    body.appendChild(el('p', 'note',
      'Send it back instead if the terms need changing: a remand keeps the bid live and lets '
      + o.team + ' answer. Nobody can answer a void.'));
    const row = el('div', 'row');
    row.appendChild(el('label', null, 'Why is this offer being voided? (required)'));
    const ta = el('textarea');
    ta.placeholder = 'e.g. Submitted on the wrong player, or duplicated during the outage.';
    row.appendChild(ta);
    body.appendChild(row);
    modal('Void ' + o.team + ' #' + o.number, body, [{
      label: 'Void this offer', cls: 'btn-danger', run: async () => {
        const reason = ta.value.trim();
        if (!reason) { toast('A void requires a reason — the team can’t answer it.', true); return false; }
        await api('/fa/offers/' + o.id + '/void', { method: 'POST', body: { reason } });
        await reload();
        toast(o.team + ' #' + o.number + ' voided');
      },
    }]);
    ta.focus();
  }

  function restoreModal(o) {
    const v = o.void || {};
    const back = v.from_status || 'submitted';
    const body = el('div');
    body.appendChild(el('p', 'note',
      'This puts the offer back as ' + back + ' — on the ballot and back in ' + o.team + '’s exposure. '
      + (back === 'returned'
         ? 'It was sent back before it was voided, so it returns with its remands still unanswered.'
         : 'It returns exactly as it was submitted.')));
    body.appendChild(el('div', 'banner info',
      'Voided ' + when(v.at) + ' by ' + (v.by || '?') + ' — “' + (v.reason || '—') + '”'));
    body.appendChild(el('p', 'note',
      'It will be refused if ' + o.team + ' has already submitted another offer on this player, since a '
      + 'team may only have one live offer per player.'));
    modal('Undo the void — ' + o.team + ' #' + o.number, body, [{
      label: 'Restore the offer', cls: 'btn-primary', run: async () => {
        await api('/fa/offers/' + o.id + '/restore', { method: 'POST' });
        await reload();
        toast(o.team + ' #' + o.number + ' restored');
      },
    }]);
  }

  // ── modal plumbing ──────────────────────────────────────────────────────────

  let _scrim = null;

  function modal(title, body, actions) {
    closeModal();
    _scrim = el('div', 'scrim');
    const box = el('div', 'modal');
    box.appendChild(el('h3', null, title));
    box.appendChild(body);
    const bar = el('div', 'modal-actions');
    const cancel = el('button', 'btn-ghost', 'Close');
    cancel.addEventListener('click', closeModal);
    bar.appendChild(cancel);
    (actions || []).forEach(a => {
      const b = el('button', a.cls || 'btn-ghost', a.label);
      b.addEventListener('click', async () => {
        b.disabled = true;
        try {
          const res = await a.run();
          if (res !== false) closeModal();
          else b.disabled = false;
        } catch (e) {
          toast(e.message, true);
          b.disabled = false;
        }
      });
      bar.appendChild(b);
    });
    box.appendChild(bar);
    _scrim.appendChild(box);
    _scrim.addEventListener('click', e => { if (e.target === _scrim) closeModal(); });
    document.body.appendChild(_scrim);
  }

  function closeModal() {
    if (_scrim) { _scrim.remove(); _scrim = null; }
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  </script>
  <script src="/nav.js"></script>
  <script src="/token-badge.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/logo.png">
  <link rel="stylesheet" href="/css/shared.css">
  <title>Player Decision Committee Dashboard — NBN</title>
  <!--
    The PDC committee dashboard — see nbn-today/docs/pdc-free-agency-spec.md § 8.

    This file ships **no league data** (§ 3.4). It is a shell plus JS, and every
    byte of committee data arrives from a role-gated endpoint: a stranger who
    finds the URL gets this shell, one /api/auth/me with no roles, and the
    forbidden screen. That screen is a courtesy, not a control — the security
    boundary is the API, never the page.

    Served at nbn.today/pdc and at pdc.nbn.today off the same docroot, so /api/*,
    /data/*.csv and /teams/* resolve same-origin under either host and no
    cross-origin request is ever made. The subdomain's nginx block lives at
    /etc/nginx/sites-available/pdc.nbn.today.
  -->
  <style>
    body { padding: 1.5rem 1rem 4rem; }
    .page { max-width: 1500px; margin: 0 auto; }

    /* ── chrome ───────────────────────────────────────────────────────────── */
    .top-bar { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
    .top-bar h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; }
    .right-bar { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; justify-content: flex-end; }
    .who { font-size: 0.8rem; color: var(--text-muted); }
    .who b { color: var(--text-secondary); font-weight: 600; }

    button { font-family: inherit; cursor: pointer; border-radius: 6px; font-size: 0.78rem; font-weight: 600; padding: 0.32rem 0.7rem; border: 1px solid transparent; }
    .btn-primary { background: var(--accent-dark); border-color: var(--accent); color: var(--text-on-accent); }
    .btn-ghost { background: transparent; border-color: var(--border); color: var(--text-muted); }
    .btn-ghost:hover { background: var(--bg-card); color: var(--text-primary); }
    .btn-danger { background: transparent; border-color: var(--border); color: var(--text-muted); }
    .btn-danger:hover { border-color: var(--danger); color: var(--danger); }
    button:disabled { opacity: 0.45; cursor: default; }
    input, textarea, select {
      font-family: inherit; font-size: 0.82rem; background: var(--bg-page); color: var(--text-primary);
      border: 1px solid var(--border); border-radius: 6px; padding: 0.4rem 0.55rem; outline: none; width: 100%;
    }
    textarea { resize: vertical; min-height: 5rem; }

    .chip { display: inline-block; font-size: 0.63rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
            padding: 0.12rem 0.4rem; border-radius: 4px; border: 1px solid var(--border); color: var(--text-muted); white-space: nowrap; }
    .chip-role { border-color: var(--muted-border); color: var(--accent-light); }
    .chip-ok { border-color: var(--success); color: var(--success); }
    .chip-bad { border-color: var(--danger-border-strong); color: var(--danger); }
    .chip-warn { border-color: var(--gold-border); color: var(--gold); }
    .chip-head { border-color: var(--accent); color: var(--accent-light); }
    .chip-live { border-color: var(--accent); color: var(--accent-light); }

    /* ── gate ─────────────────────────────────────────────────────────────── */
    .gate { max-width: 520px; margin: 4rem auto; text-align: center; }
    .gate h2 { font-size: 1.1rem; margin-bottom: 0.6rem; }
    .gate p { color: var(--text-muted); font-size: 0.88rem; line-height: 1.6; margin-bottom: 1rem; }

    /* ── board bar ────────────────────────────────────────────────────────── */
    .boardbar { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
                padding: 0.7rem 0.9rem; margin-bottom: 1rem; display: flex; gap: 1.5rem; flex-wrap: wrap; align-items: center; }
    .bb-block { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .bb-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); font-weight: 700; }
    .bb-val { font-size: 0.82rem; color: var(--text-secondary); }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .seg button { border: none; border-radius: 0; background: transparent; color: var(--text-muted); padding: 0.28rem 0.6rem; }
    .seg button.on { background: var(--accent-dark); color: var(--text-on-accent); }
    .seg button:not(.on):hover { background: var(--bg-hover); color: var(--text-primary); }

    /* ── head zone ────────────────────────────────────────────────────────────
       One consistently-styled, clearly bounded box for every control only a
       head (fac_head/poext_head, or admin) can use — instead of a badge next to
       each individual control, which reads as noise once there's more than one. */
    .head-zone { background: var(--accent-panel-bg); border: 1px solid var(--accent); border-radius: 10px;
                 padding: 0.7rem 0.9rem; margin-bottom: 1rem; display: flex; gap: 1.2rem; flex-wrap: wrap; align-items: center; }
    .head-zone-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.06em;
                        color: var(--accent-light); font-weight: 800; width: 100%; }
    .section.head-section { background: var(--accent-panel-bg); border: 1px solid var(--accent);
                             border-radius: 8px; margin: 0.9rem 1rem; padding: 0.9rem 1rem; }
    .section.head-section h3 { color: var(--accent-light); }

    /* ── panes ────────────────────────────────────────────────────────────── */
    .panes { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 1rem; align-items: start; }
    @media (max-width: 900px) { .panes { grid-template-columns: 1fr; } }

    .pane { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; }
    .pane-head { padding: 0.55rem 0.8rem; border-bottom: 1px solid var(--border-subtle); display: flex; gap: 0.5rem; align-items: center; justify-content: space-between; }
    .tabs-mini { display: flex; gap: 0.15rem; }
    .tabs-mini button { background: none; border: none; color: var(--text-muted); padding: 0.2rem 0.45rem; font-size: 0.72rem; border-radius: 5px; }
    .tabs-mini button.on { background: var(--bg-hover); color: var(--text-primary); }

    .plist { max-height: 70vh; overflow-y: auto; }
    .prow { padding: 0.55rem 0.8rem; border-bottom: 1px solid var(--border-subtle); cursor: pointer; display: flex; gap: 0.5rem; align-items: flex-start; }
    .prow:last-child { border-bottom: none; }
    .prow:hover { background: var(--bg-hover); }
    .prow.on { background: var(--accent-panel-bg); }
    .prow-body { flex: 1; min-width: 0; }
    .prow-name { font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .prow-meta { font-size: 0.7rem; color: var(--text-muted); margin-top: 0.15rem; display: flex; gap: 0.35rem; flex-wrap: wrap; align-items: center; }
    .prow-tags { display: flex; flex-direction: column; gap: 0.2rem; align-items: flex-end; }
    .empty { padding: 1.25rem 0.9rem; color: var(--text-dim); font-size: 0.8rem; text-align: center; }

    /* ── detail ───────────────────────────────────────────────────────────── */
    .detail-head { padding: 0.9rem 1rem; border-bottom: 1px solid var(--border-subtle); }
    .detail-head h2 { font-size: 1.15rem; font-weight: 700; }
    .detail-sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.25rem; display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    .section { padding: 0.9rem 1rem; border-bottom: 1px solid var(--border-subtle); }
    .section:last-child { border-bottom: none; }
    .section h3 { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); font-weight: 700; margin-bottom: 0.6rem; }

    .offers { display: flex; gap: 0.75rem; overflow-x: auto; padding-bottom: 0.3rem; align-items: stretch; }
    .offer { flex: 0 0 320px; background: var(--bg-subtle); border: 1px solid var(--border); border-radius: 9px; padding: 0.7rem 0.8rem; display: flex; flex-direction: column; gap: 0.55rem; }
    .offer.returned { border-color: var(--gold-border); }
    .offer-head { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
    .offer-team { font-size: 0.95rem; font-weight: 700; letter-spacing: 0.02em; }
    .offer-num { font-size: 0.7rem; color: var(--text-dim); font-family: monospace; }
    .shorthand { font-size: 0.85rem; color: var(--text-primary); font-weight: 600; }
    .kv { display: grid; grid-template-columns: auto 1fr; gap: 0.15rem 0.5rem; font-size: 0.74rem; }
    .kv dt { color: var(--text-muted); }
    .kv dd { color: var(--text-secondary); text-align: right; }
    table.years { width: 100%; font-size: 0.74rem; border-collapse: collapse; }
    table.years td { padding: 0.16rem 0; border-bottom: 1px solid var(--border-subtle); }
    table.years td.amt { text-align: right; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
    table.years td.tag { text-align: right; width: 2.6rem; color: var(--text-muted); font-size: 0.66rem; }
    table.years tr.hold td { color: var(--gold-dim); border-bottom: none; }

    .mini-head { font-size: 0.63rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); font-weight: 700; margin-bottom: 0.2rem; }
    .checkline { font-size: 0.72rem; display: flex; gap: 0.35rem; align-items: baseline; }
    .checkline.err { color: var(--danger); }
    .checkline.warn { color: var(--gold); }
    .pitch { font-size: 0.76rem; color: var(--text-secondary); white-space: pre-wrap; line-height: 1.5;
             max-height: 6.5rem; overflow: hidden; position: relative; }
    .pitch.open { max-height: none; }
    .linkish { background: none; border: none; color: var(--link); padding: 0; font-size: 0.72rem; font-weight: 600; }
    .lineup { display: flex; gap: 0.25rem; flex-wrap: wrap; }
    .lu { font-size: 0.68rem; border: 1px solid var(--border); border-radius: 5px; padding: 0.1rem 0.3rem; color: var(--text-muted); }
    .lu b { color: var(--text-secondary); font-weight: 600; }
    .lu.signee { border-color: var(--accent); color: var(--accent-light); }
    .lu.signee b { color: var(--accent-light); }

    .banner { border: 1px solid var(--border); border-radius: 7px; padding: 0.5rem 0.65rem; font-size: 0.76rem; color: var(--text-secondary); line-height: 1.5; }
    .banner.warn { border-color: var(--gold-border); background: var(--gold-bg); color: var(--gold); }
    .banner.bad { border-color: var(--danger-border); background: var(--danger-bg); color: var(--danger-light); }
    .banner.info { border-color: var(--muted-border); background: var(--accent-panel-bg); color: var(--text-secondary); }

    .remand { border-left: 2px solid var(--gold-border); padding: 0.15rem 0 0.15rem 0.5rem; font-size: 0.73rem; color: var(--text-secondary); margin-bottom: 0.35rem; }
    .remand .meta { color: var(--text-dim); font-size: 0.67rem; }
    .diff { font-size: 0.7rem; color: var(--text-muted); font-family: monospace; }

    .ballot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 0.6rem; }
    .ballot { border: 1px solid var(--border); border-radius: 8px; padding: 0.55rem 0.7rem; background: var(--bg-subtle); }
    .ballot-name { font-size: 0.8rem; font-weight: 600; display: flex; gap: 0.35rem; align-items: center; flex-wrap: wrap; }
    .bar-row { display: grid; grid-template-columns: 1fr 3.2rem; gap: 0.4rem; align-items: center; font-size: 0.72rem; margin-top: 0.3rem; }
    .bar { height: 0.5rem; background: var(--bg-page); border-radius: 3px; overflow: hidden; border: 1px solid var(--border-subtle); }
    .bar span { display: block; height: 100%; background: var(--accent); }
    .bar-lbl { font-size: 0.7rem; color: var(--text-muted); }
    .bar-val { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-secondary); }

    /* ── the 1,000-ball allocation (§ 4.4) ────────────────────────────────── */
    .ballot.mine { border-color: var(--accent); margin-bottom: 0.7rem; }
    .ballot label { display: block; font-size: 0.7rem; color: var(--text-muted); font-weight: 600; margin-bottom: 0.2rem; }
    .alloc-row { display: grid; grid-template-columns: minmax(0, 1fr) 9rem 4.5rem; gap: 0.5rem;
                 align-items: center; padding: 0.3rem 0; border-bottom: 1px solid var(--border-subtle); }
    .alloc-row:last-child { border-bottom: none; }
    .alloc-lbl { font-size: 0.78rem; color: var(--text-secondary); min-width: 0; }
    .alloc-num { text-align: right; font-variant-numeric: tabular-nums; }
    .alloc-row input[type=range] { width: 100%; accent-color: var(--accent); padding: 0; }
    .ballot-foot { margin-top: 0.5rem; }
    .ballot-total { font-size: 0.78rem; font-weight: 600; color: var(--gold); }
    .ballot-total.ok { color: var(--success); }
    @media (max-width: 700px) {
      .alloc-row { grid-template-columns: minmax(0, 1fr) 4.5rem; }
      .alloc-row input[type=range] { grid-column: 1 / -1; }
    }

    /* ── role-aware instructions (§ 8.5) ──────────────────────────────────── */
    .howto { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 1rem; }
    .howto > summary { cursor: pointer; padding: 0.55rem 0.9rem; font-size: 0.78rem; font-weight: 600; color: var(--text-secondary); }
    .howto > summary::marker { color: var(--text-dim); }
    .howto-body { padding: 0 0.9rem 0.8rem; }
    .howto h4 { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted);
                font-weight: 700; margin: 0.6rem 0 0.3rem; }
    .howto li { font-size: 0.78rem; color: var(--text-secondary); line-height: 1.6; margin-left: 1rem; }

    .commit { display: flex; gap: 0.6rem; flex-wrap: wrap; }
    .commit-card { border: 1px solid var(--border); border-radius: 8px; padding: 0.45rem 0.65rem; font-size: 0.74rem; color: var(--text-muted); }
    .commit-card b { color: var(--text-secondary); }
    .commit-card.over { border-color: var(--gold-border); color: var(--gold); }

    /* ── modal ────────────────────────────────────────────────────────────── */
    .scrim { position: fixed; inset: 0; background: var(--overlay-scrim); display: flex; align-items: center; justify-content: center; z-index: 10000; padding: 1rem; }
    .modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 1.1rem 1.2rem; width: 460px; max-width: 100%; max-height: 85vh; overflow-y: auto; }
    .modal h3 { font-size: 0.98rem; font-weight: 700; margin-bottom: 0.5rem; }
    .modal p.note { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 0.8rem; line-height: 1.5; }
    .modal .row { margin-bottom: 0.7rem; }
    .modal label { display: block; font-size: 0.7rem; color: var(--text-muted); margin-bottom: 0.2rem; font-weight: 600; }
    .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 0.9rem; }
    .picklist { max-height: 300px; overflow-y: auto; border: 1px solid var(--border); border-radius: 7px; }
    .pickrow { display: flex; gap: 0.5rem; align-items: center; padding: 0.35rem 0.55rem; border-bottom: 1px solid var(--border-subtle); font-size: 0.8rem; }
    .pickrow:last-child { border-bottom: none; }
    .pickrow input[type=checkbox] { width: auto; }

    .toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); z-index: 10001;
             background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem 0.9rem; font-size: 0.8rem; }
    .toast.bad { border-color: var(--danger-border-strong); color: var(--danger-light); }
  </style>
</head>
<body>
  <nav class="nav"><a href="/" id="home-link">← nbn.today</a></nav>

  <div class="page">
    <header class="top-bar">
      <div>
        <h1>Player Decision Committee Dashboard</h1>
      </div>
      <div class="right-bar" id="whoami"></div>
    </header>

    <div id="gate"></div>

    <details class="howto" id="howto" hidden>
      <summary>How this works</summary>
      <div class="howto-body" id="howto-body"></div>
    </details>

    <div id="app" hidden>
      <div class="boardbar" id="boardbar"></div>
      <div class="head-zone" id="head-zone" hidden></div>
      <div class="panes">
        <aside class="pane">
          <div class="pane-head">
            <div class="tabs-mini" id="list-tabs"></div>
          </div>
          <div class="plist" id="player-list"></div>
        </aside>
        <main class="pane" id="detail"></main>
      </div>
    </div>

    <div id="poext" hidden></div>
  </div>

  <script src="/teams/lineup.js"></script>
  <script src="/contract.js"></script>
  <script>
  // ══ PDC dashboard ═══════════════════════════════════════════════════════════
  //
  // The committee pipeline (spec § 8.2 / § 8.3): each member's assigned free
  // agents, the player review, the head's Free Agency controls (mode, rounds),
  // the 1,000-ball ballot, and per-player finalize.
  //
  // Two rules this file follows and must keep following:
  //   * **No cap math here.** Every dollar rendered comes out of the fact sheet
  //     the API built with the same helpers `_validate_sign` uses, so the
  //     dashboard can never show a team room the validator didn't credit it with.
  //   * **No client-side hiding.** What a viewer may see is what the endpoint
  //     returned; grouping is a rendering of an already-filtered payload (§ 6.1).

  const API = '/api';
  const BALLOT_TOTAL = 1000;   // § 4.4 — a ballot must sum to exactly this

  let ME = { name: null, roles: [], owner_of: [] };
  let IS_FAC = false, IS_HEAD = false, IS_POEXT = false, IS_AGENT = false;
  let STATE = null;                 // GET /api/fa/state
  let POOL = {}, BIOS = {}, OVR = {}, TEAMMAP = {};
  let SEASON = '';
  let LIST_MODE = 'mine';           // 'mine' | 'all'
  let OPEN_SLUG = null;

  // ── small helpers ───────────────────────────────────────────────────────────

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function token() { try { return localStorage.getItem('nbn_token'); } catch { return null; } }

  // The `.nbn.today` session cookie covers /api/fa/* and /api/auth/me (§ 3.3), so
  // a member who has ever loaded nbn.today needs no token in this origin at all.
  // The header still wins where a token happens to be present.
  async function api(path, opts) {
    const o = Object.assign({ credentials: 'same-origin' }, opts || {});
    o.headers = Object.assign({}, o.headers || {});
    const t = token();
    if (t) o.headers.Authorization = 'Bearer ' + t;
    if (o.body && typeof o.body !== 'string') {
      o.headers['Content-Type'] = 'application/json';
      o.body = JSON.stringify(o.body);
    }
    const res = await fetch(API + path, o);
    let data = null;
    try { data = await res.json(); } catch { /* empty body */ }
    if (!res.ok) {
      const err = new Error((data && (data.detail && data.detail.detail || data.detail)) || res.statusText);
      err.status = res.status;
      err.data = data;
      throw err;
    }
    return data;
  }

  function toast(msg, bad) {
    const t = el('div', 'toast' + (bad ? ' bad' : ''), msg);
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 4200);
  }

  function displayName(canonical) {
    if (!canonical) return '';
    const toTitle = s => s.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
    if (canonical.includes(',')) {
      const [last, first] = canonical.split(',', 2);
      return toTitle(`${first.trim()} ${last.trim()}`);
    }
    return toTitle(canonical);
  }

  function nameOf(slug) { return displayName((BIOS[slug] || {}).name || slug); }

  function parseMoney(v) {
    if (v == null || v === '') return 0;
    const n = parseFloat(String(v).replace(/[$,\s]/g, ''));
    return isNaN(n) ? 0 : n;
  }
  function money(n) { return (n == null) ? '—' : '$' + Math.round(n).toLocaleString('en-US'); }
  function compactMoney(n) {
    if (!n) return '$0';
    const s = n < 0 ? '-' : '';
    n = Math.abs(n);
    if (n >= 1e6) return s + '$' + (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 1e3) return s + '$' + Math.round(n / 1e3) + 'K';
    return s + '$' + Math.round(n);
  }

  function age(dob) {
    if (!dob) return '';
    return String(Math.floor((Date.now() - new Date(dob).getTime()) / (365.25 * 24 * 3600 * 1000)));
  }

  function when(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  }

  function ago(iso) {
    if (!iso) return '';
    const secs = (Date.now() - new Date(iso).getTime()) / 1000;
    const fwd = secs < 0;
    const s = Math.abs(secs);
    const n = s < 60 ? 'just now'
      : s < 3600 ? Math.floor(s / 60) + 'm'
      : s < 86400 ? Math.floor(s / 3600) + 'h'
      : Math.floor(s / 86400) + 'd';
    if (n === 'just now') return n;
    return fwd ? 'in ' + n : n + ' ago';
  }

  // TAGS / HOLD / shorthand all come from /contract.js (loaded above), so this
  // page and team pages render the same deal identically instead of from two
  // copies of one grammar that only a comment kept in step.
  const TAGS = CONTRACT_TAGS;
  const HOLD = isFaHold;
  const shorthand = summarizeContract;

  const METHOD_LABELS = {
    cap_space: 'Cap space', bird_rights: 'Bird rights', mle: 'MLE', ntmle: 'Non-taxpayer MLE',
    tmle: 'Taxpayer MLE', bae: 'Bi-annual exception', minimum: 'Minimum',
    // The API's value is `room_exception`; `room` is the short form team_state
    // stores. Both appear, so both are labelled — an offer funded from the Room
    // Exception must not read as a raw enum on the review page.
    room_exception: 'Room exception', room: 'Room exception',
    sign_and_trade: 'Sign-and-trade', rookie_scale: 'Rookie scale',
  };
  const ROLE_LABELS = {
    face: 'Face of the franchise', starter: 'Starter', role_player: 'Role player',
    veteran: 'Veteran', none: 'No role promised',
  };

  // ── boot ────────────────────────────────────────────────────────────────────

  (async function boot() {
    if (location.hostname.startsWith('pdc.')) {
      // Under the subdomain "/" is this dashboard, so Home has to be spelled out.
      document.getElementById('home-link').href = 'https://nbn.today/';
    }
    try {
      ME = await api('/auth/me');
    } catch (e) {
      renderGate('offline');
      return;
    }
    const roles = new Set(ME.roles || []);
    const admin = roles.has('admin');
    IS_HEAD = admin || roles.has('fac_head');
    IS_FAC = IS_HEAD || roles.has('fac');
    // § 4.7. `fac_head → agent` in ROLE_IMPLIES, which is what lets a head act
    // on a player nobody has claimed; mirrored here so the two agree.
    IS_AGENT = IS_HEAD || roles.has('agent');
    IS_POEXT = admin || roles.has('poext') || roles.has('poext_head');
    renderWhoami();

    if (!IS_FAC && !IS_AGENT && !IS_POEXT) { renderGate(ME.name ? 'forbidden' : 'anon'); return; }
    renderHowto();
    if (IS_POEXT) renderPoext();
    if (!IS_FAC && !IS_AGENT) return;

    document.getElementById('app').hidden = false;
    document.getElementById('detail').appendChild(el('div', 'empty', 'Pick a player to review.'));

    const [state, pool, bios, ovr, teamMap, ly] = await Promise.all([
      api('/fa/state'),
      api('/fa/pool'),
      api('/players'),
      api('/ovr/current'),
      api('/team-map'),
      api('/league-year').catch(() => ({})),
    ]);
    STATE = state; POOL = pool; BIOS = bios; OVR = ovr; TEAMMAP = teamMap;
    SEASON = ly.current_season || '';
    // An agent's work starts at the queue, a reviewer's at their assignments.
    LIST_MODE = IS_HEAD ? 'all' : (IS_AGENT && !IS_FAC) ? 'queue' : 'mine';
    renderBoard();
    renderList();
    routeFromHash();
    window.addEventListener('hashchange', routeFromHash);
  })();

  // What each role actually grants on this page — shown as a tooltip on the
  // role chip, since "fac_head" on its own doesn't say it's the one that runs
  // Free Agency rather than just reviewing offers.
  const ROLE_EXPLAIN = {
    admin: 'Admin — full access to every control on this page, FAC and PO-EXT alike.',
    fac: 'FAC — reviews offers and casts ballots on players you’re assigned to.',
    agent: 'Agent — claims free agents whose offer window has closed, negotiates the offers down to a final set, then advances the survivors to a sub-committee or finalizes an uncontested one. Claiming a player permanently bars your own team from bidding on him.',
    fac_head: 'FAC Head — runs Free Agency: mode, rounds, sub-committee assignment, finalize/unlock. These live in the boxed "FAC Head controls" areas on the page.',
    poext: 'PO-EXT — granted, but this page is a stub for PO-EXT for now. Nothing to do yet.',
    poext_head: 'PO-EXT Head — granted, but this page is a stub for PO-EXT for now. Nothing to do yet.',
  };
  const HEAD_ROLES = new Set(['admin', 'fac_head', 'poext_head']);

  function renderWhoami() {
    const box = document.getElementById('whoami');
    box.innerHTML = '';
    if (!ME.name) return;
    const who = el('span', 'who');
    who.appendChild(el('b', null, ME.name));
    box.appendChild(who);
    (ME.roles || []).filter(r => ROLE_EXPLAIN[r])
      .forEach(r => {
        const chip = el('span', 'chip ' + (HEAD_ROLES.has(r) ? 'chip-head' : 'chip-role'), r);
        chip.title = ROLE_EXPLAIN[r];
        box.appendChild(chip);
      });
  }

  // The forbidden screen is a courtesy — the API is the boundary (§ 3.4). It
  // exists so a member who lands here by accident gets a sentence rather than a
  // blank page and a console full of 403s.
  function renderGate(kind) {
    const g = document.getElementById('gate');
    g.innerHTML = '';
    const wrap = el('div', 'gate');
    if (kind === 'offline') {
      wrap.appendChild(el('h2', null, 'Can’t reach the league API'));
      wrap.appendChild(el('p', null, 'The dashboard needs /api to answer. Try again in a moment.'));
    } else if (kind === 'anon') {
      wrap.appendChild(el('h2', null, 'Not signed in'));
      wrap.appendChild(el('p', null,
        'Sign in on nbn.today in this browser and you are signed in here automatically. '
        + 'If this browser has never seen the main site, paste your member token instead.'));
      const btn = el('button', 'btn-primary', 'Enter token');
      btn.addEventListener('click', signInModal);
      wrap.appendChild(btn);
    } else {
      wrap.appendChild(el('h2', null, 'Forbidden'));
      wrap.appendChild(el('p', null,
        'This is the PDC committee dashboard. Your member account isn’t on the Free Agency '
        + 'or PO-EXT committee, so there is nothing here for you.'));
      const a = el('a', null, '← Back to nbn.today');
      a.href = location.hostname.startsWith('pdc.') ? 'https://nbn.today/' : '/';
      wrap.appendChild(a);
    }
    g.appendChild(wrap);
  }

  function signInModal() {
    const body = el('div');
    const row = el('div', 'row');
    row.appendChild(el('label', null, 'Member token'));
    const input = el('input');
    input.type = 'password';
    input.placeholder = 'Paste token…';
    row.appendChild(input);
    body.appendChild(row);
    modal('Sign in', body, [
      { label: 'Continue', cls: 'btn-primary', run: () => {
        const v = input.value.trim();
        if (!v) return false;
        try { localStorage.setItem('nbn_token', v); } catch {}
        // token-badge.js mints the .nbn.today session on the next load, so the
        // paste is a one-time cost even if the member lands here first.
        location.reload();
      } },
    ]);
    input.focus();
  }

  // § 8.5 — keyed off the viewer's roles, and sectioned when they hold both. It
  // is collapsed by default: a committee member who has done this before should
  // not have to scroll past it, and one who hasn't should not have to be told
  // where to look.

    const box = document.getElementById('howto-body');
    box.innerHTML = '';
    const list = items => {
      const ul = el('ul');
      items.forEach(t => ul.appendChild(el('li', null, t)));

    };

    const intro = el('p', 'note',
      'Three roles on the FA side, and a free agent passes through them in order. agent claims him '
      + 'once his offer window closes and negotiates the offers down to a final set — that’s '
      + '"Working as an agent". fac then reviews what was advanced and ballots on it — "Reviewing a '
      + 'player". fac_head (or admin) runs the whole thing: mode, rounds, sub-committee assignment, '
      + 'finalize/unlock, and sending a player back to his agent — "Running Free Agency", which on '
      + 'the page lives in the boxed controls set apart from the rest of the UI. agent and fac are '
      + 'meant to be different people: an agent has already exercised judgment by choosing the slate. '
      + 'PO-EXT (poext/poext_head) is granted but this dashboard is a stub for it for now.');
    box.appendChild(intro);

    if (IS_FAC) {
      box.appendChild(el('h4', null, 'Reviewing a player'));
      box.appendChild(list([
        '"My assigned free agents" is the players the head has put you on. You cannot see the offers or the ballots for a player you aren’t assigned to — a sub-committee is transparent to itself and opaque to everyone outside it.',
        'Offers sit side by side: the contract year by year, how it’s funded, the team’s cap position after signing, their projected starting five with this player in it, the promises made, and the pitch.',
        'Legality is re-checked every time you open the page. “Legal at submit · illegal now” means the team’s cap position moved since they offered. They cannot withdraw it — you decide what that’s worth.',
        'The offers you see have already been curated by an agent: they negotiated with the teams, sent bids back for changes, and dropped the ones that were out. You are choosing between finalists, not sifting.',
        'Sending an offer back is no longer yours to do — ask the agent, or ask the head to send the whole player back to them. A player only reaches you once his slate is advanced.',
        'The 1,000 balls are yours to split across the offers, plus “no signing” always and the qualifying offer for a restricted free agent. It must total exactly 1,000.',
        '“No signing” is there so that thinking every offer is bad is something you can actually say. Without it the least-bad offer wins by default.',
        'Ballots stay editable until the head locks the player, and everyone on the sub-committee can see each other’s as they go — including when they were last touched.',

      ]));

      box.appendChild(el('h4', null, 'Working as an agent'));
      box.appendChild(list([
        'The Queue is every free agent whose offer window has closed and who nobody has picked up yet. You claim from it — there is no head handing players out.',
        'A claim is exclusive: while you hold him, no other agent can, and his offers open to you in full. Until you claim, you only see how many offers he has drawn.',
        'You cannot claim a player your own team is bidding on, and claiming one permanently bars your team from bidding on him — including after you release the claim, and after he is reopened. That is the whole reason releasing is allowed at all.',

      ]));
    }

    if (IS_HEAD) {
      box.appendChild(el('h4', null, 'Running Free Agency'));
      box.appendChild(list([
        'Mode is the master switch. Closed takes no offers at all. Rounds takes them only on players you’ve opened. FFA opens every free agent at once.',
        // No hours figure here on purpose: this renders before the board loads,
        // so any number in it would be the default rather than your setting. The
        // live figure is on the board bar and in the control itself.
        'FFA is the only clock the software enforces: the first submitted offer on a player starts it, later offers don’t extend it, and at the deadline he stops taking offers and comes to you. Nothing signs itself, ever.',
        'You set how long that window runs, in hours, next to the mode switch. It applies to clocks started from then on — a clock already running keeps the deadline it was stamped with, so changing it can never move a deadline teams are bidding against or close a window early.',
        'Rounds carry no clock. Opening Round N does not close Round N−1’s players, and a round’s “closes at” is a label — you close players by hand, on purpose, so you can leave one open across a boundary.',

  function renderPoext() {
    const box = document.getElementById('poext');
    box.hidden = false;
    box.innerHTML = '';
    const b = el('div', 'banner info');
    b.style.marginTop = '1rem';
    b.textContent = 'PO-EXT: player options and extensions come to this dashboard after free agency. '
      + 'Your role is granted and does nothing yet — nothing is being missed.';

  // ── the board bar (mode, rounds) ────────────────────────────────────────────

  // The FFA window length is the head's setting (§ 4.1), so no copy on this page
  // may hardcode 24 — it reads the live figure the same way every string the API
  // emits does.
  function ffaHours() {
    const h = Number(STATE && STATE.ffa_window_hours);
    return h > 0 ? h : 24;
  }
  function ffaWindowLabel() {
    const h = ffaHours();
    return (Number.isInteger(h) ? h : Math.round(h * 10) / 10) + '-hour';
  }

  const MODE_COPY = {
    closed: 'No offers are accepted.',
    rounds: 'Only players the head has opened accept offers.',
  };
  function modeCopy(m) {
    return m === 'ffa'
      ? `Every free agent accepts offers; the first offer on a player starts a ${ffaWindowLabel()} clock.`
      : (MODE_COPY[m] || '');
  }

  function currentRound() {
    const rs = (STATE.rounds || []);
    const open = rs.filter(r => !r.closed_at);
    return open.length ? open[open.length - 1] : (rs.length ? rs[rs.length - 1] : null);
  }

  function renderBoard() {
    const bar = document.getElementById('boardbar');
    bar.innerHTML = '';

    // Everyone sees the same read-only status bar, whatever their role — no
    // interactive controls live here, so there's nothing role-dependent to
    // render differently.
    const modeBlock = el('div', 'bb-block');
    modeBlock.appendChild(el('span', 'bb-label', 'Mode'));
    modeBlock.appendChild(el('span', 'chip chip-live', STATE.mode === 'ffa' ? 'FFA' : STATE.mode[0].toUpperCase() + STATE.mode.slice(1)));
    modeBlock.appendChild(el('span', 'bb-val', modeCopy(STATE.mode)));
    bar.appendChild(modeBlock);

    // Shown to everyone, not just the head: a member reading a deadline needs to
    // know what window it came from, and a team on /free-agency is bidding into it.
    if (STATE.mode === 'ffa') {
      const winBlock = el('div', 'bb-block');
      winBlock.appendChild(el('span', 'bb-label', 'FFA window'));
      const c = el('span', 'chip', ffaHours() + 'h');
      c.title = 'Applies to clocks started from now on. A clock already running keeps '
              + 'the deadline it was stamped with.';
      winBlock.appendChild(c);
      bar.appendChild(winBlock);
    }

    const rnd = currentRound();
    const roundBlock = el('div', 'bb-block');
    roundBlock.appendChild(el('span', 'bb-label', 'Round'));
    if (rnd) {
      roundBlock.appendChild(el('span', 'bb-val', rnd.name + (rnd.closed_at ? ' (closed)' : '')));
      if (rnd.closes_at && !rnd.closed_at) {
        // Advisory only: nothing acts on it (§ 4.1, D11). Labelled as such so
        // nobody plans around a deadline the software will not enforce.
        const c = el('span', 'chip', 'label only · ' + when(rnd.closes_at));
        c.title = 'Rounds carry no enforced clock — the head closes players by hand.';
        roundBlock.appendChild(c);
      }
    } else {
      roundBlock.appendChild(el('span', 'bb-val', 'none opened'));
    }
    bar.appendChild(roundBlock);

    // Every control only the head can use lives in this one boxed zone, set
    // apart from the status bar above by its own border and tint — instead of
    // marking each control individually.
    const zone = document.getElementById('head-zone');
    zone.innerHTML = '';
    zone.hidden = !IS_HEAD;
    if (IS_HEAD) {
      zone.appendChild(el('div', 'head-zone-label', 'FAC Head controls'));

      const modeRow = el('div', 'bb-block');
      modeRow.appendChild(el('span', 'bb-label', 'Set FA mode'));
      const seg = el('div', 'seg');
      ['closed', 'rounds', 'ffa'].forEach(m => {
        const b = el('button', STATE.mode === m ? 'on' : '', m === 'ffa' ? 'FFA' : m[0].toUpperCase() + m.slice(1));
        b.title = modeCopy(m);
        b.addEventListener('click', () => setMode(m));
        seg.appendChild(b);
      });
      modeRow.appendChild(seg);
      zone.appendChild(modeRow);

      const winRow = el('div', 'bb-block');
      winRow.appendChild(el('span', 'bb-label', 'FFA window'));
      const winInput = el('input');
      winInput.type = 'number';
      winInput.min = '1'; winInput.max = '168'; winInput.step = '1';
      winInput.value = String(ffaHours());
      winInput.style.width = '5rem';
      const winBtn = el('button', 'btn-ghost', 'Set');
      winBtn.addEventListener('click', () => setFfaWindow(winInput.value));
      winRow.appendChild(winInput);
      winRow.appendChild(el('span', 'bb-val', 'hours'));
      winRow.appendChild(winBtn);
      winRow.appendChild(el('p', 'note',
        'Applies to clocks started from now on. Clocks already running keep the deadline '
        + 'they were stamped with — this can’t move a deadline teams are bidding against.'));
      zone.appendChild(winRow);

      const openBtn = el('button', 'btn-ghost', 'Open round…');
      openBtn.addEventListener('click', openRoundModal);
      zone.appendChild(openBtn);

      const addBtn = el('button', 'btn-ghost', '+ Add player to round…');
      addBtn.addEventListener('click', addPlayerModal);
      zone.appendChild(addBtn);
    }
  }

  async function setMode(mode) {
    if (mode === STATE.mode) return;
    if (mode === 'ffa' && !confirm(
      'Switch to FFA?\n\nEvery free agent in the pool becomes offerable immediately, and the first '
      + `submitted offer on a player starts a ${ffaWindowLabel()} clock that closes their window.`)) return;
    try {
      await api('/fa/mode', { method: 'PUT', body: { mode } });
      await reload();
      toast('Mode is now ' + mode);
    } catch (e) { toast(e.message, true); }
  }

  async function setFfaWindow(raw) {
    const hours = Number(raw);
    if (!(hours >= 1 && hours <= 168)) return toast('Window must be between 1 and 168 hours', true);
    if (hours === ffaHours()) return;
    try {
      const r = await api('/fa/ffa-window', { method: 'PUT', body: { hours } });
      await reload();
      toast(`FFA window is now ${hours}h`
            + (r.clocks_unaffected ? ` — ${r.clocks_unaffected} running clock(s) unchanged` : ''));
    } catch (e) { toast(e.message, true); }
  }

  function openRoundModal() {
    const body = el('div');
    const r1 = el('div', 'row');
    r1.appendChild(el('label', null, 'Name'));
    const name = el('input');
    name.placeholder = 'Round ' + ((STATE.rounds || []).length + 1);
    r1.appendChild(name);
    body.appendChild(r1);

    const r2 = el('div', 'row');
    r2.appendChild(el('label', null, 'Closes at (display label only — nothing acts on it)'));
    const closes = el('input');
    closes.type = 'datetime-local';
    r2.appendChild(closes);
    body.appendChild(r2);

    const r3 = el('div', 'row');
    const lbl = el('label');
    lbl.style.display = 'flex';
    lbl.style.gap = '0.4rem';
    lbl.style.alignItems = 'center';
    const cb = el('input');
    cb.type = 'checkbox';
    cb.style.width = 'auto';
    lbl.appendChild(cb);
    lbl.appendChild(document.createTextNode('Close the previous round record'));
    r3.appendChild(lbl);
    r3.appendChild(el('p', 'note', 'Closing the round record does not close any player — players are closed by hand (§ 4.1).'));
    body.appendChild(r3);

    modal('Open a round', body, [{
      label: 'Open round', cls: 'btn-primary', run: async () => {
        await api('/fa/rounds', { method: 'POST', body: {
          name: name.value.trim() || null,
          closes_at: closes.value ? new Date(closes.value).toISOString() : null,
          close_previous: cb.checked,
        } });
        await reload();
        toast('Round opened');
      },
    }]);
  }

  function addPlayerModal() {
    const alreadyAdded = new Set(Object.keys(STATE.players || {}));
    // `POOL` is everyone with a cap hold *on file*, which spans future league
    // years — /free-agency's year chips are built from it. Only the current
    // class has actually reached free agency, and opening anyone else produces a
    // player no team can bid on with a sub-committee that has nothing to review
    // (the API refuses it outright). `current` is stamped server-side by the
    // same helper that gates offerability, so this isn't a second opinion.
    const all = Object.keys(POOL);
    const candidates = all
      .filter(slug => POOL[slug].current)
      .map(slug => ({ slug, name: nameOf(slug), pool: POOL[slug] }))
      .sort((a, b) => a.name.localeCompare(b.name));

    const body = el('div');
    body.appendChild(el('p', 'note', 'Opening a player lets teams submit offers on them in the current round. '
      + 'In FFA mode every free agent already accepts offers — opening one there is about the sub-committee, not the window.'));
    const search = el('input');
    search.placeholder = 'Search the free agents…';
    body.appendChild(search);
    const list = el('div', 'picklist');
    list.style.marginTop = '0.5rem';
    body.appendChild(list);

    function draw() {
      const q = search.value.trim().toLowerCase();
      list.innerHTML = '';
      const rows = candidates.filter(c => !q || c.name.toLowerCase().includes(q));
      if (!rows.length) { list.appendChild(el('div', 'empty', 'No match.')); return; }
      rows.forEach(c => {
        const row = el('div', 'pickrow');
        const nm = el('span', null, c.name);
        nm.style.flex = '1';
        row.appendChild(nm);
        row.appendChild(el('span', 'chip', c.pool.hold_type));
        row.appendChild(el('span', 'chip', c.pool.class_year));
        if (alreadyAdded.has(c.slug)) row.appendChild(el('span', 'chip chip-live', (STATE.players[c.slug] || {}).status || 'added'));
        const b = el('button', 'btn-ghost', 'Open');
        b.addEventListener('click', async () => {
          b.disabled = true;
          try {
            await api('/fa/players/' + encodeURIComponent(c.slug), { method: 'PUT', body: { status: 'open' } });
            await reload();
            closeModal();
            openPlayer(c.slug);
          } catch (e) { toast(e.message, true); b.disabled = false; }
        });
        row.appendChild(b);
        list.appendChild(row);
      });
    }
    search.addEventListener('input', draw);
    draw();
    modal('Open a player for offers', body, []);
    search.focus();
  }

  // ── the player list ─────────────────────────────────────────────────────────

  // Work queue, most actionable first — *not* soonest-to-expire. A closed window
  // is the committee's cue to start (§ 4.1): the clock governs additional offers
  // and nothing else, so a player still collecting them needs nothing from anyone
  // on this page, while one whose window has closed is waiting on a sub-committee
  // and its ballots. Ordering by the clock put every player who needed work
  // *below* every player who didn't, which is backwards for the only phase this
  // list exists to run.
  //
  // Within the ready group, longest-waiting first (oldest deadline), so a player
  // can't sit unassigned while later closures pile on top of him. Finalized
  // players are done and sort last — they keep `ffa_expired` forever, so without
  // this they would head the queue for the rest of the league year.
  // Reworked for the agent stage (§ 4.7): the stage *is* "who is this waiting
  // on", which is what the ordering was reaching for by reading the clock. A
  // player nobody has picked up leads, then one whose slate is ready to ballot,
  // then one an agent is already working, then one still collecting offers.
  function urgency(p) {
    const dl = (p.ffa || {}).deadline;
    const t = dl ? new Date(dl).getTime() : 0;
    if (p.finalized) return [5, 0];
    if (p.stage === 'awaiting_agent') return [0, t];
    if (p.stage === 'with_committee') return [1, t];
    if (p.stage === 'with_agent') return [2, t];
    if (dl) return [3, t];
    if (p.status === 'open') return [3, 0];
    if (p.status === 'held') return [4, 0];
    return [4, 1];
  }

  function renderList() {
    const tabs = document.getElementById('list-tabs');
    tabs.innerHTML = '';
    const entries = Object.entries(STATE.players || {});
    const mineCount = entries.filter(([, p]) => p.mine).length;
    // § 4.7. "Queue" is everyone whose window has shut and who hasn't been
    // advanced — claimable, held by someone else, or blocked. "Holding" is the
    // agent's own. Both are derived from the server's `stage`, never from a
    // local reading of the clock.
    const queueCount = entries.filter(([, p]) => p.stage === 'awaiting_agent').length;
    const holdCount = entries.filter(([, p]) => p.claimed_by === ME.name).length;
    const tabDefs = [];
    if (IS_FAC) tabDefs.push(['mine', `My free agents (${mineCount})`]);
    if (IS_AGENT) {
      tabDefs.push(['queue', `Queue (${queueCount})`]);
      tabDefs.push(['holding', `Holding (${holdCount})`]);
    }
    tabDefs.push(['all', `All players (${entries.length})`]);
    tabDefs.forEach(([id, label]) => {
      const b = el('button', LIST_MODE === id ? 'on' : '', label);
      b.addEventListener('click', () => { LIST_MODE = id; renderList(); });
      tabs.appendChild(b);
    });

    const list = document.getElementById('player-list');
    list.innerHTML = '';
    let rows = entries.filter(([slug, p]) =>
      LIST_MODE === 'all' ? true
      : LIST_MODE === 'queue' ? p.stage === 'awaiting_agent'
      : LIST_MODE === 'holding' ? p.claimed_by === ME.name
      : p.mine);
    rows.sort((a, b) => {
      const ua = urgency(a[1]), ub = urgency(b[1]);
      return ua[0] - ub[0] || ua[1] - ub[1] || nameOf(a[0]).localeCompare(nameOf(b[0]));
    });

    if (!rows.length) {
      list.appendChild(el('div', 'empty',
        LIST_MODE === 'mine'
          ? 'You aren’t assigned to any player yet. The FAC head assigns sub-committees.'
        : LIST_MODE === 'queue'
          ? 'Nothing waiting. A free agent joins the queue when his offer window closes.'
        : LIST_MODE === 'holding'
          ? 'You aren’t holding anybody. Claim one from the queue to start work on his offers.'
          : 'No players have been opened for Free Agency yet.'));
      return;
    }

    rows.forEach(([slug, p]) => {
      const row = el('div', 'prow' + (slug === OPEN_SLUG ? ' on' : ''));
      row.dataset.slug = slug;
      const body = el('div', 'prow-body');
      body.appendChild(el('div', 'prow-name', nameOf(slug)));

      const meta = el('div', 'prow-meta');
      meta.appendChild(el('span', null, (POOL[slug] || {}).hold_type || '—'));
      meta.appendChild(el('span', null, '·'));
      // `offer_count` comes back null when the viewer's own team is bidding on
      // this player (§ 6.1) — the count is itself intelligence, and this is the
      // one player they can never claim. Suppressed by the server; the page
      // just renders what it was given rather than re-deriving the rule.
      meta.appendChild(el('span', null, p.offer_count == null ? 'offers hidden'
        : p.offer_count === 1 ? '1 offer' : p.offer_count + ' offers'));
      const dl = (p.ffa || {}).deadline;
      if (dl) {
        meta.appendChild(el('span', null, '·'));
        meta.appendChild(el('span', null, p.ffa_expired ? 'window closed ' + ago(dl) : 'closes ' + ago(dl)));
      }
      if (IS_HEAD && p.ballots_cast != null && (p.subcommittee || []).length) {
        meta.appendChild(el('span', null, '·'));
        meta.appendChild(el('span', null, `${p.ballots_cast}/${p.subcommittee.length} balloted`));
      }
      body.appendChild(meta);
      row.appendChild(body);

      const tags = el('div', 'prow-tags');
      if (p.finalized) tags.appendChild(el('span', 'chip chip-ok', 'locked'));
      else if (p.stage === 'awaiting_agent') tags.appendChild(el('span', 'chip chip-warn', 'needs an agent'));
      else if (p.stage === 'with_agent') {
        tags.appendChild(el('span', 'chip chip-live',
          p.claimed_by === ME.name ? 'yours' : 'with ' + p.claimed_by));
      } else if (p.stage === 'with_committee') tags.appendChild(el('span', 'chip chip-warn', 'ready'));
      else tags.appendChild(el('span', 'chip' + (p.status === 'open' ? ' chip-live' : ''), p.status || '—'));
      // Blocked entries stay on the queue, greyed with the reason on hover —
      // "why can't I take this one?" is a rules question, and hiding the row
      // answers it with silence (the § 8.1 disabled-with-reason convention).
      if (p.claim_refusal && p.stage === 'awaiting_agent') {
        const c = el('span', 'chip chip-bad', 'blocked');
        c.title = p.claim_refusal;
        tags.appendChild(c);
      }
      if (p.mine && !p.balloted && !p.finalized && p.stage === 'with_committee') {
        tags.appendChild(el('span', 'chip chip-warn', 'ballot'));
      }
      if (p.mine && p.balloted) tags.appendChild(el('span', 'chip chip-ok', 'voted'));
      row.appendChild(tags);

      row.addEventListener('click', () => { location.hash = '#/p/' + slug; });
      list.appendChild(row);
    });
  }

  function routeFromHash() {
    const m = (location.hash || '').match(/^#\/p\/([a-z0-9\-']+)$/i);
    if (m) openPlayer(m[1]);
  }

  async function reload() {
    STATE = await api('/fa/state');
    renderBoard();
    renderList();
    if (OPEN_SLUG) await openPlayer(OPEN_SLUG, true);
  }

  // ── the review view ─────────────────────────────────────────────────────────

  async function openPlayer(slug, silent) {
    OPEN_SLUG = slug;
    renderList();
    const box = document.getElementById('detail');
    if (!silent) { box.innerHTML = ''; box.appendChild(el('div', 'empty', 'Loading…')); }

    const entry = (STATE.players || {})[slug] || {};
    let review = null, ballots = null, err = null;
    try {
      review = await api('/fa/players/' + encodeURIComponent(slug) + '/review');
    } catch (e) { err = e; }
    if (review) {
      try {
        ballots = await api('/fa/players/' + encodeURIComponent(slug) + '/ballots');
      } catch (e) {
        // 422 = the player has never been opened in a round, so there is no
        // ballot bucket to read. Not an error worth shouting about.
        ballots = { _unavailable: e.message };
      }
    }

    box.innerHTML = '';
    box.appendChild(detailHead(slug, entry, review));

    if (err) {
      const s = el('div', 'section');
      s.appendChild(el('div', 'banner ' + (err.status === 403 ? 'info' : 'bad'),
        err.status !== 403 ? err.message
        : (IS_AGENT && !IS_FAC)
          ? 'You haven’t claimed this player, so his offers aren’t readable to you yet. Claiming '
            + 'him opens every one of them in full (§ 4.7).'
          : 'You aren’t on this player’s sub-committee, so their offers and ballots aren’t readable to you. '
            + 'A sub-committee is transparent to itself and opaque to everyone outside it (§ 4.5).'));
      // The claim control lives in the agent panel, which needs a review payload
      // it can't have yet — so on a 403 the panel is rebuilt from list state.
      if (IS_AGENT && !IS_FAC) {
        const p = (STATE.players || {})[slug] || {};
        box.appendChild(agentPanel(slug, entry, { state: { ...entry, stage: p.stage,
                                                           claimed_by: p.claimed_by,
                                                           is_agent: p.claimed_by === ME.name },
                                                  offers: [] }));
      }
      box.appendChild(s);
      return;
    }

    if (IS_AGENT) box.appendChild(agentPanel(slug, entry, review));
    if (IS_HEAD) box.appendChild(headControls(slug, entry, review, ballots));
    box.appendChild(offersSection(review));
    box.appendChild(commitmentsSection(review));
    // An agent who isn't also on the FAC sees no ballot section at all, rather
    // than one explaining a 403 they will never resolve (§ 4.5).
    if (IS_FAC) box.appendChild(ballotsSection(review, ballots));
  }

  function detailHead(slug, entry, review) {
    const head = el('div', 'detail-head');
    head.appendChild(el('h2', null, nameOf(slug)));
    const bio = BIOS[slug] || {};
    const pool = (review && review.pool) || POOL[slug] || {};
    const sub = el('div', 'detail-sub');
    const bits = [(bio.pos || []).join('/'), age(bio.dob) ? age(bio.dob) + ' yrs' : '', OVR[slug] ? OVR[slug] + ' OVR' : ''];
    sub.appendChild(el('span', null, bits.filter(Boolean).join(' · ')));
    if (pool.hold_type) sub.appendChild(el('span', 'chip', pool.hold_type + ' ' + (pool.class_year || '')));
    if (pool.rfa) {
      // The § 3.9 QO formula is flagged "proposed, pending BOD confirmation" in
      // the rulebook itself, so the figure is labelled rather than asserted. The
      // line shows either way — an incumbent keeping an RFA on the QO is a real
      // outcome whether or not we can price it.
      const qo = pool.qo_amount == null ? 'QO amount unknown' : 'QO ≈ ' + compactMoney(pool.qo_amount) + ' (estimated)';
      sub.appendChild(el('span', 'chip chip-warn', qo));
    }
    const st = (review && review.state) || entry;
    if (st.status) sub.appendChild(el('span', 'chip' + (st.status === 'open' ? ' chip-live' : ''), st.status));
    const dl = (st.ffa || {}).deadline;
    if (dl) {
      sub.appendChild(el('span', 'chip ' + (st.ffa_expired ? 'chip-warn' : 'chip-live'),
        st.ffa_expired ? 'FFA window closed ' + when(dl) : 'FFA window closes ' + when(dl)));
    }
    if ((st.subcommittee || []).length) {
      sub.appendChild(el('span', null, 'Sub-committee: ' + st.subcommittee.join(', ')));
    } else {
      sub.appendChild(el('span', 'chip chip-warn', 'no sub-committee assigned'));
    }
    head.appendChild(sub);
    return head;
  }


  // ── the agent panel (§ 8.6) ─────────────────────────────────────────────────
  //
  // Every branch below reads `state.stage` — the server's derivation — rather
  // than working out from the clock and the claim what an agent is allowed to
  // do. There is one rule and it lives in `_agent_stage`.

  function agentPanel(slug, entry, review) {
    const st = review.state || {};
    const s = el('div', 'section head-section');
    s.appendChild(el('h3', null, 'Agent'));

    const live = (review.offers || []).length;
    const held = st.is_agent && !st.advanced_at;

    if (st.stage === 'open') {
      s.appendChild(el('div', 'empty',
        'His offer window is still open. A free agent reaches the agents’ queue when it closes — '
        + 'until then he may still draw bids nobody has seen.'));
      return s;
    }

    if (st.stage === 'decided') {
      s.appendChild(el('div', 'empty', 'Finalized. Nothing left for an agent to do here.'));
      return s;
    }

    if (st.stage === 'with_committee') {
      const b = el('div', 'banner info');
      b.appendChild(el('div', null,
        'Advanced to the sub-committee ' + ago(st.advanced_at) + ' by ' + (st.claimed_by || '?')
        + '. The agent’s powers on him have ended — only the FAC head can send him back.'));
      if (st.agent_note) b.appendChild(el('div', null, 'Agent’s note: “' + st.agent_note + '”'));
      s.appendChild(b);
      if (IS_HEAD) {
        const back = el('button', 'btn-danger', 'Send back to the agent…');
        back.addEventListener('click', () => returnToAgentModal(slug, st));
        s.appendChild(back);
      }
      return s;
    }

    if (st.stage === 'awaiting_agent') {
      const refusal = (STATE.players[slug] || {}).claim_refusal;
      if (refusal && !IS_HEAD) {
        // Disabled with the server's own reason, never hidden and never a
        // string composed here (§ 8.1's convention).
        const b = el('div', 'banner warn');
        b.textContent = refusal;
        s.appendChild(b);
        return s;
      }
      s.appendChild(el('p', 'note',
        'Claiming opens every offer on him in full and makes you the one who negotiates them. '
        + 'It is exclusive, and it permanently bars your own team from bidding on him — that bar '
        + 'survives releasing the claim and survives him being reopened.'));
      const b = el('button', 'btn-primary', 'Claim ' + nameOf(slug) + '…');
      b.addEventListener('click', () => claimModal(slug));
      s.appendChild(b);
      return s;
    }

    // stage === 'with_agent'
    if (!held) {
      const b = el('div', 'banner info');
      b.textContent = (st.claimed_by || 'Another agent') + ' is the agent on this player, since '
        + ago(st.claimed_at || (st.agent || {}).claimed_at) + '.';
      s.appendChild(b);
      if (!IS_HEAD) return s;
      s.appendChild(el('p', 'note', 'You can still act on his offers as head.'));
      return s;
    }

    const bar = el('div', 'bb-block');
    if ((st.returns || []).length) {
      const r = st.returns[st.returns.length - 1];
      const w = el('div', 'banner warn');
      w.appendChild(el('div', 'mini-head', 'Sent back by ' + r.by + ' ' + ago(r.at)));
      w.appendChild(el('div', null, '“' + r.reason + '”'));
      w.appendChild(el('div', 'meta',
        'Ballots cast on the earlier slate still stand and are flagged for their members.'));
      s.appendChild(w);
    }

    s.appendChild(el('p', 'note', live === 1
      ? 'One offer left standing. You can finalize him here rather than sending a single option '
        + 'to a sub-committee to ballot — or advance anyway if you want the committee on it.'
      : live === 0
        ? 'Every offer has been voided. Finalize him — there is no slate to advance.'
        : live + ' offers still live. Send them back for changes, void the ones that are out, '
          + 'then advance what survives to the sub-committee.'));

    if (live) {
      const adv = el('button', 'btn-primary', 'Advance ' + live + ' offer' + (live === 1 ? '' : 's') + '…');
      adv.addEventListener('click', () => advanceModal(slug, review));
      bar.appendChild(adv);
    }
    const fin = el('button', live > 1 ? 'btn-ghost' : 'btn-primary', 'Finalize without a ballot…');
    fin.addEventListener('click', () => agentFinalizeModal(slug, review));
    bar.appendChild(fin);
    const rel = el('button', 'btn-ghost', 'Release…');
    rel.addEventListener('click', () => releaseModal(slug));
    bar.appendChild(rel);
    s.appendChild(bar);
    return s;
  }

  function claimModal(slug) {
    const body = el('div');
    body.appendChild(el('p', 'note',
      'You become the agent for ' + nameOf(slug) + ': every offer on him opens to you, and the '
      + 'remands, voids and the final slate are yours. No other agent can take him while you hold him.'));
    body.appendChild(el('p', 'note',
      'Your own team is barred from bidding on him from now on. That is permanent — releasing the '
      + 'claim does not lift it, because by then you have read every rival’s figure.'));
    modal('Claim ' + nameOf(slug), body, [{
      label: 'Claim him', cls: 'btn-primary', run: async () => {
        const res = await api('/fa/players/' + encodeURIComponent(slug) + '/claim', { method: 'POST' });
        await reload();
        const blocked = (res.blocked_teams || []).map(b => b.team);
        toast(blocked.length ? 'Claimed — ' + blocked.join(', ') + ' can no longer bid on him'
                             : 'Claimed');
      },
    }]);
  }

  function releaseModal(slug) {
    const body = el('div');
    body.appendChild(el('p', 'note',
      'He goes back on the queue for another agent to claim. Anything you have already done — '
      + 'remands, voids, notes — stays exactly as it is.'));
    body.appendChild(el('p', 'note',
      'Your team stays barred from bidding on him. A release does not undo that.'));
    modal('Release ' + nameOf(slug), body, [{
      label: 'Release him', cls: 'btn-danger', run: async () => {
        await api('/fa/players/' + encodeURIComponent(slug) + '/release', { method: 'POST' });
        await reload();
        toast('Released');
      },
    }]);
  }

  function advanceModal(slug, review) {
    const offers = (review.offers || []).slice().sort((a, b) => a.number - b.number);
    const body = el('div');
    body.appendChild(el('p', 'note',
      'These are the offers the sub-committee will see and ballot on. Nothing else on this player '
      + 'reaches them. You cannot remand, void or note after this — only the FAC head can send him back.'));
    const ul = el('ul');
    offers.forEach(o => ul.appendChild(el('li', null,
      o.team + ' #' + o.number + ' — ' + shorthand(o.offer.contract, SEASON))));
    body.appendChild(ul);
    const row = el('div', 'row');
    row.appendChild(el('label', null, 'A note for the sub-committee (optional)'));
    const ta = el('textarea');
    ta.placeholder = 'e.g. PHX is the strongest fit; CLE would not move off two years.';
    row.appendChild(ta);
    body.appendChild(row);
    modal('Advance ' + nameOf(slug), body, [{
      label: 'Advance to the sub-committee', cls: 'btn-primary', run: async () => {
        await api('/fa/players/' + encodeURIComponent(slug) + '/advance',
                  { method: 'POST', body: { note: ta.value.trim() } });
        await reload();
        toast('Advanced — the head assigns the sub-committee');
      },
    }]);
    ta.focus();
  }

  // D24. Guarded harder than Advance, and worded so the trade-off is explicit:
  // this closes the player with no vote at all.
  function agentFinalizeModal(slug, review) {
    const offers = (review.offers || []).slice().sort((a, b) => a.number - b.number);
    const body = el('div');
    body.appendChild(el('p', 'note', offers.length === 1
      ? 'One bid survived curation, so there is nothing for a sub-committee to choose between. '
        + 'This locks the player with no ballot.'
      : offers.length === 0
        ? 'No bid survived. This closes him out with nothing on the table.'
        : 'There are still ' + offers.length + ' live offers. Finalizing now locks him with no '
          + 'ballot at all — if you want them weighed, advance instead.'));
    if (offers.length) {
      const ul = el('ul');
      offers.forEach(o => ul.appendChild(el('li', null,
        o.team + ' #' + o.number + ' — ' + shorthand(o.offer.contract, SEASON))));
      body.appendChild(ul);
    }
    body.appendChild(el('p', 'note',
      'Nothing is signed by this. The FAC still enters the transaction by hand on /transactions.'));
    modal('Finalize ' + nameOf(slug) + ' without a ballot', body, [{
      label: 'Lock him', cls: 'btn-danger', run: async () => {
        await api('/fa/players/' + encodeURIComponent(slug) + '/finalize', { method: 'POST' });
        await reload();
        toast('Finalized — recorded as uncontested');
      },
    }]);
  }

  function returnToAgentModal(slug, st) {
    const body = el('div');
    body.appendChild(el('p', 'note',
      'The slate goes back to ' + (st.claimed_by || 'the agent') + ', who can remand, void and '
      + 're-advance it. Ballots already cast are kept and flagged for their members as voted on '
      + 'an earlier slate — nothing is discarded.'));
    const row = el('div', 'row');
    row.appendChild(el('label', null, 'Why is it going back? (required)'));
    const ta = el('textarea');
    ta.placeholder = 'e.g. CLE’s year 3 went illegal after they signed elsewhere.';
    row.appendChild(ta);
    body.appendChild(row);
    modal('Send ' + nameOf(slug) + ' back to the agent', body, [{
      label: 'Send back', cls: 'btn-danger', run: async () => {
        const reason = ta.value.trim();
        if (!reason) { toast('A send-back requires a reason.', true); return false; }
        await api('/fa/players/' + encodeURIComponent(slug) + '/return-to-agent',
                  { method: 'POST', body: { reason } });
        await reload();
        toast('Sent back to ' + (st.claimed_by || 'the agent'));
      },
    }]);
    ta.focus();
  }

  function agentNoteModal(o) {
    const body = el('div');
    body.appendChild(el('p', 'note',
      'Advice that travels with this offer to the sub-committee. It is not a ranking and it does '
      + 'not change the ballot — they still vote.'));
    const row = el('div', 'row');
    row.appendChild(el('label', null, 'Note (leave empty to remove)'));
    const ta = el('textarea');
    ta.value = o.agent_note || '';
    row.appendChild(ta);
    body.appendChild(row);
    modal('Note on ' + o.team + ' #' + o.number, body, [{
      label: 'Save', cls: 'btn-primary', run: async () => {
        await api('/fa/offers/' + o.id + '/agent-note',
                  { method: 'PUT', body: { note: ta.value.trim() } });
        await reload();
        toast('Note saved');
      },
    }]);
    ta.focus();
  }

  // ── head controls (§ 8.3) ───────────────────────────────────────────────────

  function headControls(slug, entry, review, ballots) {
    const s = el('div', 'section head-section');
    s.appendChild(el('h3', null, 'FAC Head controls'));
    const row = el('div', 'bb-block');
    ['open', 'held', 'closed'].forEach(status => {
      const b = el('button', (review.state || {}).status === status ? 'btn-primary' : 'btn-ghost',
        status === 'open' ? 'Open' : status === 'held' ? 'Hold' : 'Close');
      b.addEventListener('click', async () => {
        // In FFA, "Open" is not the mild thing its label suggests: it clears the
        // clock and mints a fresh round id, so a second window starts from
        // scratch and the ballots already cast are left in the old bucket. A
        // head reaching for it to buy a few more hours wants Extend instead, so
        // say which is which before doing it rather than after.
        const clock = ((review.state || {}).ffa) || null;
        if (status === 'open' && STATE.mode === 'ffa' && clock && clock.deadline
            && !confirm(
              `Open ${nameOf(slug)} for a NEW window?\n\n`
              + 'This clears the current clock and starts a fresh round: the next submitted offer '
              + 'begins a new window, and ballots already cast stay with the old one.\n\n'
              + 'To keep this round and just add time, cancel and use '
              + `"${(review.state || {}).ffa_expired ? 'Reopen for…' : 'Extend…'}" instead.`)) return;
        try {
          await api('/fa/players/' + encodeURIComponent(slug), { method: 'PUT', body: { status } });
          await reload();
          toast(nameOf(slug) + ' → ' + status);
        } catch (e) { toast(e.message, true); }
      });
      row.appendChild(b);
    });
    const assign = el('button', 'btn-ghost', 'Sub-committee…');
    assign.addEventListener('click', () => assignModal(slug, review));
    row.appendChild(assign);
    s.appendChild(row);

    if (STATE.mode === 'ffa') s.appendChild(windowControls(slug, review));

    // Fires on a closed FFA window as well as an open player, and the closed
    // case is the one that matters: assignment happens *after* the window shuts
    // (§ 4.1 — the clock governs additional offers, nothing else), so this is
    // the head's cue at the exact moment the cue is due. Keyed on `status` alone
    // it never fired for an FFA player at all, because `_start_ffa_clock`
    // deliberately leaves `status` unset.
    const st0 = review.state || {};
    if ((st0.ffa_expired || st0.status === 'open') && !(st0.subcommittee || []).length) {
      const b = el('div', 'banner warn');
      b.style.marginTop = '0.6rem';
      b.textContent = st0.ffa_expired
        ? 'The window has closed and nobody is assigned, so nobody can ballot on this player. '
          + 'Sub-committees default to empty by design — assign one to start deliberation.'
        : 'Nobody is assigned, so nobody can ballot on this player. Sub-committees default to empty by design — assign one.';
      s.appendChild(b);
    }

    // Finalize/Unlock are head actions too, so they live here rather than
    // inside the Ballots section below — the totals and lock record they act
    // on stay there, since those are visible to the whole sub-committee.
    if (ballots && !ballots._unavailable) {
      const actionRow = el('div', 'bb-block');
      actionRow.style.marginTop = '0.6rem';
      if (ballots.final) {
        const u = el('button', 'btn-danger', 'Unlock…');
        u.addEventListener('click', () => unlockModal(slug, ballots));
        actionRow.appendChild(u);
        actionRow.appendChild(el('span', 'bb-val', 'Reopens the ballots and offers this finalize locked.'));
      } else {
        const f = el('button', 'btn-primary', 'Finalize…');
        f.addEventListener('click', () => finalizeModal(review, ballots, optionLabels(review)));
        actionRow.appendChild(f);
        actionRow.appendChild(el('span', 'bb-val', 'Locks every ballot on this player and records the totals.'));
      }
      s.appendChild(actionRow);
    }
    return s;
  }

  // The head has two ways to put a closed player back in front of teams, they
  // do materially different things, and neither was reachable from this view —
  // the reopen lived only in the "+ Player" picker, which skips anyone already
  // on the board, i.e. exactly the players a head would want to reopen. Both
  // are surfaced here, side by side, with the difference stated: an extension
  // keeps the round (offers, ballots, deliberation) and buys time, while a
  // reopen deliberately starts a second window with a clean ballot.
  function windowControls(slug, review) {
    const st = review.state || {};
    const ffa = st.ffa || null;
    const wrap = el('div', 'bb-block');
    wrap.style.marginTop = '0.6rem';
    wrap.style.flexWrap = 'wrap';

    wrap.appendChild(el('span', 'bb-label', 'Window'));
    if (!ffa || !ffa.deadline) {
      wrap.appendChild(el('span', 'bb-val',
        'Not started — the first submitted offer starts one.'));
      return wrap;
    }

    const expired = !!st.ffa_expired;
    wrap.appendChild(el('span', expired ? 'chip chip-warn' : 'chip chip-live',
      expired ? 'closed' : 'running'));
    wrap.appendChild(el('span', 'bb-val',
      (expired ? 'Closed ' : 'Closes ') + when(ffa.deadline)
      + (ffa.window_hours ? ` · ${Math.round(ffa.window_hours * 10) / 10}h window` : '')));

    const ext = el('button', 'btn-ghost', expired ? 'Reopen for…' : 'Extend…');
    ext.addEventListener('click', () => extendModal(slug, review));
    wrap.appendChild(ext);

    const note = el('div', 'bb-val');
    note.style.flexBasis = '100%';
    note.style.marginTop = '0.35rem';
    note.textContent = expired
      ? 'Reopening for N more hours keeps every offer already submitted and the ballots already cast. '
        + 'The "Open" button above is the other thing — it starts a fresh window with a new ballot, '
        + 'and the votes on this one stay behind.'
      : 'Extending keeps the round as it stands — same offers, same ballots, just more time.';
    if ((ffa.extensions || []).length) {
      const last = ffa.extensions[ffa.extensions.length - 1];
      note.textContent += `  Last ${last.reopened ? 'reopened' : 'extended'} by ${last.by} `
        + `(+${last.hours}h): ${last.reason}`;
    }
    wrap.appendChild(note);
    return wrap;
  }

  function extendModal(slug, review) {
    const st = review.state || {};
    const expired = !!st.ffa_expired;
    const body = el('div');
    body.appendChild(el('p', 'note', expired
      ? 'This window has closed. Reopening it puts the player back on the board for the hours you '
        + 'give, counted from now — every offer already submitted stands, and the sub-committee\'s '
        + 'ballots stay exactly as cast.'
      : 'Adds time to the deadline teams are currently bidding against. Offers and ballots are '
        + 'untouched.'));

    const r1 = el('div', 'row');
    r1.appendChild(el('label', null, 'Hours'));
    const hours = el('input');
    hours.type = 'number'; hours.min = '1'; hours.max = '168'; hours.step = '1'; hours.value = '24';
    r1.appendChild(hours);
    body.appendChild(r1);

    const r2 = el('div', 'row');
    r2.appendChild(el('label', null, 'Reason (shown to every team)'));
    const reason = el('input');
    reason.placeholder = expired ? 'e.g. clock lapsed overnight, teams had no chance to bid'
                                 : 'e.g. giving the last two teams a chance to respond';
    r2.appendChild(reason);
    body.appendChild(r2);

    const go = el('button', 'btn-primary', expired ? 'Reopen window' : 'Extend window');
    go.addEventListener('click', async () => {
      const h = Number(hours.value);
      if (!(h > 0 && h <= 168)) return toast('Hours must be between 1 and 168', true);
      if (!reason.value.trim()) return toast('A reason is required — teams are shown it', true);
      go.disabled = true;
      try {
        const r = await api('/fa/players/' + encodeURIComponent(slug) + '/ffa-extend',
                            { method: 'POST', body: { hours: h, reason: reason.value.trim() } });
        closeModal();
        await reload();
        await openPlayer(slug, true);
        toast(`${nameOf(slug)}'s window ${r.reopened ? 'reopened' : 'extended'} — now closes `
              + when(r.ffa.deadline));
      } catch (e) { toast(e.message, true); go.disabled = false; }
    });
    modal(expired ? 'Reopen this window' : 'Extend this window', body, [go]);
    reason.focus();
  }

  function assignModal(slug, review) {
    const assigned = new Set((review.state || {}).subcommittee || []);
    const body = el('div');
    body.appendChild(el('p', 'note',
      'A conflicted member is flagged, never refused (§ 4.6). In a league this size hard-blocking would make '
      + 'some players unballotable, and holding a team role is not by itself evidence of bad faith — but the '
      + 'flag follows them onto their ballot and onto the finalize view.'));
    const list = el('div', 'picklist');
    const boxes = {};
    (review.assignable || []).forEach(m => {
      const row = el('div', 'pickrow');
      const cb = el('input');
      cb.type = 'checkbox';
      cb.checked = assigned.has(m.name);
      boxes[m.name] = cb;
      row.appendChild(cb);
      const nm = el('span', null, m.name);
      nm.style.flex = '1';
      row.appendChild(nm);
      if (m.team) row.appendChild(el('span', 'chip', m.team));
      if (m.conflict) row.appendChild(el('span', 'chip chip-warn', m.conflict + ' has an offer in'));
      list.appendChild(row);
    });
    if (!(review.assignable || []).length) list.appendChild(el('div', 'empty', 'No members hold the fac role yet.'));
    body.appendChild(list);

    modal('Sub-committee — ' + nameOf(slug), body, [{
      label: 'Save', cls: 'btn-primary', run: async () => {
        const picked = Object.keys(boxes).filter(n => boxes[n].checked);
        await api('/fa/players/' + encodeURIComponent(slug), { method: 'PUT', body: { subcommittee: picked } });
        await reload();
        toast('Sub-committee saved');
      },
    }]);
  }

  // ── offers (§ 8.2) ──────────────────────────────────────────────────────────

  function offersSection(review) {
    const s = el('div', 'section');
    s.appendChild(el('h3', null, 'Offers'));
    const voided = review.voided_offers || [];
    if (!review.offers.length) {
      s.appendChild(el('div', 'empty', 'No submitted offers on this player.'));
      if (voided.length) s.appendChild(voidedBlock(voided, review));
      return s;
    }
    const wrap = el('div', 'offers');
    review.offers
      .slice()
      .sort((a, b) => a.number - b.number)
      .forEach(o => wrap.appendChild(offerCard(o, review)));
    s.appendChild(wrap);
    if (voided.length) s.appendChild(voidedBlock(voided, review));
    return s;
  }

  // § 4.3b. Out of play — no revalidation, no ballot line, no exposure — but
  // shown, because "the committee erased a bid" is exactly what a review page
  // has to be able to answer for. Kept below the live offers so it reads as a
  // record rather than as something still under consideration.
  function voidedBlock(voided, review) {
    const box = el('div', 'section');
    box.style.marginTop = '0.8rem';
    box.appendChild(el('div', 'mini-head', 'Voided — out of play, not deleted'));
    voided.slice().sort((a, b) => a.number - b.number).forEach(o => {
      const v = o.void || {};
      const row = el('div', 'remand');
      const head = el('div');
      head.appendChild(el('span', 'offer-team', o.team));
      head.appendChild(el('span', 'offer-num', ' #' + o.number));
      head.appendChild(el('span', 'chip chip-bad', 'voided'));
      row.appendChild(head);
      row.appendChild(el('div', null, shorthand(o.offer.contract, SEASON)));
      row.appendChild(el('div', null, '“' + (v.reason || '—') + '”'));
      row.appendChild(el('div', 'meta',
        'voided ' + ago(v.at) + ' by ' + (v.by || '?')
        + ' · was ' + (v.from_status || 'submitted')
        + ' · ' + o.team + ' may bid again'));
      // Restore follows void (§ 4.7): whoever could drop the bid can put it back.
      if (canCurate(review)) {
        const b = el('button', 'btn-ghost', 'Undo the void…');
        b.style.marginTop = '0.3rem';
        b.addEventListener('click', () => restoreModal(o));
        row.appendChild(b);
      }
      box.appendChild(row);
    });
    return box;
  }

  function offerCard(o, review) {
    const season = (o.revalidation && o.revalidation.season) || (o.validation && o.validation.season) || SEASON;
    const card = el('div', 'offer' + (o.status === 'returned' ? ' returned' : ''));

    const head = el('div', 'offer-head');
    head.appendChild(el('span', 'offer-team', o.team));
    head.appendChild(el('span', 'offer-num', '#' + o.number));
    head.appendChild(el('span', 'chip' + (o.status === 'returned' ? ' chip-warn' : ' chip-live'),
      o.status === 'returned' ? 'returned' : 'submitted'));
    if (o.version > 1) head.appendChild(el('span', 'chip', 'v' + o.version));
    card.appendChild(head);

    // Cap position after the signing — every figure straight off the fact sheet
    // the API built. The dashboard does no cap math of its own.
    const sheet = (o.revalidation && o.revalidation.fact_sheet) || (o.validation && o.validation.fact_sheet);

    card.appendChild(el('div', 'shorthand', shorthand(o.offer.contract, season)));
    card.appendChild(yearTable(o.offer.contract, season, sheet && sheet.trailing_hold));

    const kv = el('dl', 'kv');
    const put = (k, v) => { kv.appendChild(el('dt', null, k)); kv.appendChild(el('dd', null, v)); };
    put('Method', METHOD_LABELS[o.offer.signing_method] || o.offer.signing_method || '—');
    if (o.offer.bird_rights_type) put('Bird', o.offer.bird_rights_type);
    // § 3.12: on a minimum deal this is what every year's figure is derived
    // from, and the team declared it — so it's a reviewable claim, not a
    // detail. Shown only when stated, since it changes nothing otherwise.
